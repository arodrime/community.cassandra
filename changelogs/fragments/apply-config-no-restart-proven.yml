---
minor_changes:
- "apply_config playbook - the differences found say a node list once, above the table, when every file differs on the same nodes, and ``all 12 nodes`` for every node of a run of more than 5; an item too long for the Node and Inventory columns has its values on the next line, under them."
trivial:
- "apply_config playbook - a running node is no longer restarted for files proven to change nothing for its running Cassandra, with the import self-check's own proofs: cassandra-env.sh and the JVM options files giving the JVM the same arguments (bin/cassandra emulated, against the running JVM's arguments, Java and environment), a JVM options file the running Java does not read, logback.xml when the node's file (unchanged since its start) and the new one both have ``scan=\"true\"`` on their root. Anything else, or a proof that cannot be made, restarts as before. The plan, the question and the recaps say it (``all 12 nodes  would apply, no restart (the same JVM arguments; ...)``); the files are then recorded as the ones the running Cassandra runs with, so that no restart is told pending for them later."
- "import_cluster playbook - the next step's ``expected`` line names every config file the next apply_config rewrites with the same JVM arguments (the JVM options files their Java does not read too) and says ``no restart``; ``every node up to date`` instead of ``nothing to apply``, as apply_config says it."
