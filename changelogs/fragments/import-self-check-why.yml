minor_changes:
  - "import_cluster playbook - a failed self-check says why the inventory does not reproduce the nodes yet (``SELF-CHECK FAILED — the inventory does not reproduce 4 nodes yet``), then each kind of difference by its cause with what ``apply_config`` would do: under each, the files and their nodes once, each setting in its file's own words (a YAML key, a JVM option, logback's elements as ``AUDIT / rollingPolicy / fileNamePattern``) with the node's value and Ansible's on aligned ``Node`` and ``Ansible`` lines, then ``To pass:`` with each way out. report.txt has the same under ``TODO``; report.details.txt each difference as found in a ``SELF-CHECK`` section. The shareable copy keeps in clear the settings' YAML and INI keys, XML tags and attribute names, the role's logback names and the JVM's own option names, and masks what the site named (a JMX user but the JDK's, a logger's package, an appender, a memtable configuration, an environment variable, a JVM agent's path, a file or a device of the OS settings, a Medusa bucket or user in the values)."
