---
# Builds a cluster from blank hosts (one inventory group per cluster):
#   ansible-playbook -i inventory community.cassandra.create_cluster
# Without -e cassandra_hosts=<group>: the group cassandra, else the inventory's
# cluster group (lookup community.cassandra.cassandra_hosts).
# Root on the nodes (sudo): the playbook asks for it itself, no -b needed.
# Nodes are prepared in parallel, then started one at a time: seeds first
# (a node of a new rack earlier when the token allocator needs it), each one
# joined before the next. Re-running it on a running cluster
# starts nothing.
# The identity settings must come from the inventory, but a new 5.0 cluster
# may leave cassandra_storage_compatibility_mode out: NONE (CASSANDRA_4 and
# UPGRADING, steps of an upgrade, are refused on a new cluster).
# One token per node (cassandra_num_tokens: 1): the nodes without
# cassandra_initial_token get evenly spaced tokens, shown with each node's
# share of the data, then confirmed (cassandra_operation_confirm).
# -e cassandra_create_cluster_reset=true rebuilds a cluster that runs already,
# ALL ITS DATA LOST: e.g. to move it to another snitch, datacenters or racks,
# which a node keeps for life once it has joined. Refused when --limit leaves a
# node of the group out, when no node answers nodetool status, when the ring has
# a node the group does not have (never wipe part of a cluster that keeps
# running), when a running node is not in that ring or the rings differ, when
# a node holding data is not in that ring, when a Cassandra runs that its unit
# did not start, or when a node's live cassandra.yaml names another cluster. The token plan (one token per node),
# then each node's plan is shown, then the operator types the cluster name (no
# terminal: -e cassandra_create_cluster_reset_confirm=<cluster name> with
# cassandra_operation_confirm=false); every node is stopped and disabled, then
# emptied (reset_node.yml), then the cluster is created with the inventory's
# settings. --check shows the plan only. A create that fails after the wipe:
# run create_cluster again without the option.
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight
  vars:
    # the cluster there now is wiped: its ring does not count for the seeds and racks
    _cassandra_preflight_cluster_reset: "{{ cassandra_create_cluster_reset | default(false) }}"

# A cluster keeps these for life: a role default that changes in a later
# release must not silently change what the next node of this cluster gets
- name: Refuse an identity left to the role defaults
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  vars:
    # the one there is wiped first (cassandra_create_cluster_reset), or a cluster never started: every
    # host of the group in the run (no --limit), checked by the preflight (it answered) and below, none
    # running, none with a system keyspace (a cluster stopped as a whole is not new)
    _group: "{{ query('community.cassandra.cassandra_nodes') | default([]) }}"
    _new_cluster: >-
      {%- set fresh = [] -%}
      {%- for h in ansible_play_hosts_all -%}
      {%-   set v = hostvars[h] -%}
      {%-   if v._cassandra_preflight_running is defined and not v._cassandra_preflight_running | bool
              and v.cassandra_create_system.results is defined
              and v.cassandra_create_system.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists') | list | length == 0 -%}
      {%-     set _ = fresh.append(h) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ cassandra_create_cluster_reset | default(false) | bool
         or (_group | difference(ansible_play_hosts_all) | length == 0 and fresh | length == ansible_play_hosts_all | length) }}
  tasks:
    - name: Load the cassandra_config defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: defaults.yml
        public: true

    # the first data directory holds it (cassandra_data_dir is that one unless the inventory says otherwise)
    - name: Look for the system keyspace of a node that ran already
      ansible.builtin.stat:
        path: "{{ item }}/system"
      loop: "{{ [cassandra_data_dir, [cassandra_data_file_directories] | flatten | first] | unique }}"
      register: cassandra_create_system

    # Role defaults are not in hostvars: what is there came from the inventory or -e
    - name: Check the identity settings come from the inventory
      ansible.builtin.assert:
        that: _missing | length == 0 or cassandra_accept_default_identity | default(false) | bool
        fail_msg: |-
          Left to the role defaults on {{ inventory_hostname }}: set them in the inventory (group_vars of the
          cluster, dc and rack per host), or -e cassandra_accept_default_identity=true. Current values{{
          ' (cassandra_storage_compatibility_mode is only needed once the cluster runs: NONE if create_cluster started it)'
          if 'cassandra_storage_compatibility_mode' in _missing else '' }}:
          {% for name in _missing %}
            {{ name }}: {{ lookup('ansible.builtin.vars', name) | to_json }}
          {% endfor %}
        quiet: true
      vars:
        _names:
          - cassandra_cluster_name
          - cassandra_version
          - cassandra_num_tokens
          - cassandra_partitioner
          - cassandra_endpoint_snitch
          - cassandra_dc
          - cassandra_rack
        # the allocator's hint only matters with vnodes; the storage compatibility mode of a 5.0 cluster
        # is required once it runs (an upgraded one may be in CASSANDRA_4), a new one gets NONE (below)
        _all: >-
          {{ _names + (['cassandra_storage_compatibility_mode'] if cassandra_version == '50x' and not _new_cluster | bool else [])
             + (['cassandra_allocate_tokens_for_local_replication_factor'] if cassandra_num_tokens | int > 1 else []) }}
        _missing: "{{ _all | reject('in', hostvars[inventory_hostname]) | list }}"

    # Only an upgraded cluster has a reason for another mode (CASSANDRA_4, then UPGRADING, then NONE)
    - name: A new 5.0 cluster starts in storage compatibility mode NONE
      ansible.builtin.assert:
        that: _mode == 'NONE'
        fail_msg: >-
          cassandra_storage_compatibility_mode is {{ _mode }} on {{ inventory_hostname }}: a new 5.0 cluster has no older
          sstables or nodes to stay compatible with, it starts in NONE (CASSANDRA_4 and UPGRADING are steps of an
          upgrade from 4.x, see the upgrade playbook). Set NONE, or leave it out.
        quiet: true
      when:
        - cassandra_version == '50x'
        - _new_cluster | bool
      vars:
        _mode: "{{ hostvars[inventory_hostname].cassandra_storage_compatibility_mode | default('NONE') | string }}"

    - name: Say a new 5.0 cluster starts in NONE
      ansible.builtin.debug:
        msg: >-
          cassandra_storage_compatibility_mode is not in the inventory of {{ _unset | join(', ') }}: a new 5.0 cluster,
          NONE (the role's default).
      run_once: true
      when:
        - cassandra_version == '50x'
        - _new_cluster | bool
        - _unset | length > 0
      vars:
        _unset: >-
          {{ ansible_play_hosts | map('extract', hostvars) | rejectattr('cassandra_storage_compatibility_mode', 'defined')
             | map(attribute='inventory_hostname') | list }}

# Each datacenter's nodes evenly spaced on the ring, racks taken in turn, the
# datacenters 100 tokens apart (module_utils/cassandra_tokens.py). A node
# that has cassandra_initial_token keeps it; a datacenter where only some
# have one is refused unless cassandra_token_allow_partial (the others then
# split the largest ranges). A rerun after a create that stopped half way
# gives the same tokens: the nodes already running must have them.
- name: Work out the tokens (one token per node)
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Work out the tokens
      when: _cassandra_preflight.cassandra_num_tokens | int == 1
      vars:
        _plan: "{{ hostvars[ansible_play_hosts_all[0]].cassandra_token_plan | default({}) }}"
        # a cluster rebuilt (cassandra_create_cluster_reset) keeps none of its tokens
        _running: >-
          {{ [] if cassandra_create_cluster_reset | default(false) | bool
             else ansible_play_hosts | map('extract', hostvars) | selectattr('_cassandra_preflight_running')
                  | map(attribute='inventory_hostname') | list }}
      block:
        - name: Load the cassandra_service defaults
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: defaults.yml
            public: true

        - name: Read the tokens of the nodes already running
          community.cassandra.cassandra_ring:
          module_defaults:
            community.cassandra.cassandra_ring: >-
              {{ _cassandra_service_jmx | combine({'port': hostvars[_running | first | default(inventory_hostname)].cassandra_jmx_port
                                                           | default(_cassandra_service_jmx.port) | int}) }}
          register: cassandra_create_ring
          delegate_to: "{{ _running | first | default(inventory_hostname) }}"  # templated even when skipped
          run_once: true
          when: _running | length > 0

        - name: Plan the ring
          ansible.builtin.set_fact:
            cassandra_token_plan: >-
              {{ _nodes | community.cassandra.cassandra_token_assign(_cassandra_preflight.cassandra_partitioner,
                   default_rf=cassandra_token_rf | default(3), allow_partial=cassandra_token_allow_partial | default(false) | bool,
                   ring=cassandra_create_ring.ring | default({}), hosts=_hosts) }}
          vars:
            _nodes: >-
              {%- set l = [] -%}
              {%- for h in ansible_play_hosts -%}
              {%-   set p = hostvars[h]._cassandra_preflight -%}
              {%-   set _ = l.append({'name': h, 'dc': p.cassandra_dc, 'rack': p.cassandra_rack, 'token': p.cassandra_initial_token}) -%}
              {%- endfor -%}
              {{ l }}
            _hosts: >-
              {{ dict(ansible_play_hosts | map('extract', hostvars, ['_cassandra_preflight', 'ring_address']) | zip(ansible_play_hosts)) }}
          run_once: true

        - name: Refuse a ring that can't be worked out
          ansible.builtin.assert:
            that: _plan.problems | length == 0
            fail_msg: "{{ _plan.lines + _plan.warnings | map('regex_replace', '^', 'WARNING - tokens: ') | list + _plan.problems }}"
            quiet: true
          run_once: true

        - name: Show the ring and confirm the tokens
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: screen.yml
          vars:
            cassandra_screen_question: >-
              {{ 'Give the nodes marked * these tokens?' if _plan.tokens | length > 0 and _running | length < ansible_play_hosts | length
                 else '' }}
            cassandra_screen:
              operation: create_cluster
              summary: the tokens of the new nodes (one token per node)
              intro: ["The ring (RF of the shares: cassandra_token_rf):"]
              after:
                - pre: "{{ _plan.lines }}"
              warnings:
                - label: tokens
                  each: "{{ _plan.warnings }}"

        - name: Give the node its token
          ansible.builtin.set_fact:
            cassandra_initial_token: "{{ _plan.tokens[inventory_hostname] }}"
          when: inventory_hostname in _plan.tokens

# After the token plan (shown and confirmed before anything is wiped)
- name: Reset the whole cluster first (cassandra_create_cluster_reset)
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  any_errors_fatal: true  # every node stopped before any is emptied, none if one is refused
  strategy: linear  # each task on every node before the next one
  tasks:
    - name: Reset the whole cluster
      when: cassandra_create_cluster_reset | default(false) | bool
      vars:
        _group: "{{ lookup('community.cassandra.cassandra_hosts') }}"
        _running: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('_cassandra_preflight_running', 'defined')
             | selectattr('_cassandra_preflight_running') | map(attribute='inventory_hostname') | list }}
      block:
        - name: Load the cassandra_service defaults
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: defaults.yml
            public: true

        - name: Every node of the group is in the run
          ansible.builtin.assert:
            that: ansible_play_hosts | sort == groups[_group] | sort
            fail_msg: >-
              The reset wipes the whole cluster: every host of {{ _group }} must be in the run, without --limit
              (left out: {{ groups[_group] | difference(ansible_play_hosts) | join(', ') }}). Nothing was changed.
            quiet: true
          run_once: true

        - name: Read the ring of the running nodes
          community.cassandra.cassandra_status:
            down: 10000  # read it whatever the state of the nodes
            interval: 0
            port: "{{ hostvars[item].cassandra_jmx_port | default(_cassandra_service_jmx.port) | int }}"
          module_defaults:
            community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
          delegate_to: "{{ item }}"
          loop: "{{ _running }}"
          register: cassandra_create_reset_rings
          failed_when: false
          run_once: true

        - name: Check the group is the whole cluster
          ansible.builtin.set_fact:
            _cassandra_create_reset_check: >-
              {{ _answers | community.cassandra.cassandra_cluster_reset_check(_addresses_of, _group, running=_running) }}
          run_once: true
          vars:
            _answers: >-
              {%- set out = [] -%}
              {%- for r in cassandra_create_reset_rings.results | default([]) -%}
              {%-   set _ = out.append({'host': r.item, 'status': r.cluster_status | default(none)}) -%}
              {%- endfor -%}
              {{ out }}
            _addresses_of: >-
              {%- set out = {} -%}
              {%- for h in groups[_group] -%}
              {%-   set v = hostvars[h] -%}
              {%-   set _ = out.update({h: (v.ansible_facts.all_ipv4_addresses | default([]) + v.ansible_facts.all_ipv6_addresses | default([])
                                            + [v._cassandra_preflight.address | default(''), v._cassandra_preflight.ring_address | default('')])
                                           | select | unique | list}) -%}
              {%- endfor -%}
              {{ out }}

        - name: Show what the reset does
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: screen.yml
          vars:
            cassandra_screen_question: ""  # the cluster name is typed next (reset_node.yml)
            cassandra_screen:
              operation: create_cluster
              summary: >-
                wipe the cluster and create it again (cassandra_create_cluster_reset), with the settings of the inventory
                (snitch {{ _cassandra_preflight.cassandra_endpoint_snitch }})
              blocks: "{{ _blocks }}"
              after: "{{ _cassandra_create_reset_check.info + _cassandra_create_reset_check.problems | map('regex_replace', '^', 'REFUSED: ') | list }}"
              warnings:
                - label: data loss
                  real_run: true
                  text: "every node is stopped and emptied: ALL THE DATA of cluster '{{ _cassandra_preflight.cassandra_cluster_name }}' is LOST."
            _blocks: >-
              {%- set l = [] -%}
              {%- for h in ansible_play_hosts -%}
              {%-   set p = hostvars[h]._cassandra_preflight -%}
              {%-   set _ = l.append({'title': h | community.cassandra.cassandra_screen_title(p),
                                      'lines': [('Cassandra running now' if hostvars[h]._cassandra_preflight_running | default(false)
                                                 else 'Cassandra stopped now') ~ ', then joins as above' ~ (', a seed' if p.layout.seed | bool else '')]}) -%}
              {%- endfor -%}
              {{ l }}

        - name: Refuse to reset part of a cluster
          ansible.builtin.fail:
            msg: "Nothing was changed: {{ _cassandra_create_reset_check.problems | join('; ') }}"
          run_once: true
          when: _cassandra_create_reset_check.problems | length > 0

        - name: Stop and empty every node
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: reset_node.yml
          vars:
            _cassandra_node_reset_whole_cluster: true
            _cassandra_node_reset_cluster_ring: "{{ _cassandra_create_reset_check.ring }}"

        # what the preflight found no longer stands: the nodes start as a new cluster
        - name: Forget the cluster that was there
          ansible.builtin.set_fact:
            _cassandra_preflight_running: false
            cassandra_preflight_status: {}
            # its new snitch, datacenters and racks (a stale system dir left outside the emptied ones)
            cassandra_config_force_identity_change: true
          when: not ansible_check_mode

- name: Prepare the nodes
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  become: true
  pre_tasks:
    - name: The plan only (--check with cassandra_create_cluster_reset)
      ansible.builtin.meta: end_play
      when: cassandra_create_cluster_reset | default(false) | bool and ansible_check_mode
  roles:
    - community.cassandra.cassandra_repository
    - community.cassandra.cassandra_install
    - community.cassandra.cassandra_linux
    - community.cassandra.cassandra_config
    - role: community.cassandra.cassandra_firewall
      when: cassandra_manage_firewall | default(false) | bool
    - role: community.cassandra.cassandra_medusa
      when: cassandra_medusa_enabled | default(false) | bool

# The token allocator refuses a node joining a rack already in the ring while
# its datacenter has more than 1 rack but fewer than
# cassandra_allocate_tokens_for_local_replication_factor: seeds first, but a
# node of a new rack before one it would refuse
- name: Order the starts
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  tasks:
    - name: The plan only (--check with cassandra_create_cluster_reset)
      ansible.builtin.meta: end_play
      when: cassandra_create_cluster_reset | default(false) | bool and ansible_check_mode

    - name: Seeds first, racks in an order the token allocator accepts
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: cassandra_create_start_order
      loop: >-
        {{ ansible_play_hosts | map('extract', hostvars, '_cassandra_preflight') | list
           | community.cassandra.cassandra_start_order(_hint,
               cassandra_preflight_status.cluster_status | default({}, true)) }}
      run_once: true
      changed_when: false
      vars:
        # one token per node: no allocator, any order
        _hint: >-
          {{ _cassandra_preflight.cassandra_allocate_tokens_for_local_replication_factor
             if _cassandra_preflight.cassandra_num_tokens | int > 1 else '' }}

- name: Start the nodes, one at a time
  hosts: cassandra_create_start_order
  serial: 1
  become: true
  roles:
    - community.cassandra.cassandra_service

- name: Check the new cluster
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  tasks:
    - name: The plan only (--check with cassandra_create_cluster_reset)
      ansible.builtin.meta: end_play
      when: cassandra_create_cluster_reset | default(false) | bool and ansible_check_mode

    - name: Say the cluster is not checked (--check)
      ansible.builtin.debug:
        msg: "--check: nothing was started, the cluster is not checked (the health_check playbook checks it)."
      run_once: true
      when: ansible_check_mode

    - name: Check the whole cluster from one node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: cluster_health.yml
      vars:
        cassandra_service_health_expected_nodes: "{{ ansible_play_hosts_all | length }}"  # --limit may leave nodes out
      when:
        - inventory_hostname == ansible_play_hosts[0]
        - not ansible_check_mode  # nothing was started
