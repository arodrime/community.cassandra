minor_changes:
  - cassandra_config - new role writing Cassandra's configuration files for 4.0, 4.1 and 5.0 from variables (``cassandra.yaml``, ``cassandra-env.sh``, the JVM options files, ``cassandra-rackdc.properties``, ``logback.xml``), identical to the stock files by default; it shows the diff and asks before changing a running node (https://github.com/ansible-collections/community.cassandra/issues/334).
