minor_changes:
  - 'cassandra_config role - ``cassandra_config_template_snippets`` adds template pieces of yours to the role''s files, rendered with the same variables, at insertion points: ``logback.xml`` (the end of its ``<configuration>``), ``logback.xml:appenders`` (before ``<root>``) and ``cassandra-env.sh`` (its end, under a ``# Custom settings`` line): blocks kept in template files rather than as lines in the inventory. A node whose ``cassandra-env.sh`` was written before that line keeps its file (same settings): the line comes with the next change of the file, or with ``cassandra_config_normalize`` set to true.'
