---
# Adds nodes to a running cluster: all of them prepared at once (repository,
# install, OS, config, firewall, Medusa; nothing started), then started and
# bootstrapped one at a time. Add them to the cluster's inventory group
# first, then:
#   ansible-playbook -i inventory community.cassandra.add_node -e cassandra_target_nodes=node7,node8
# A new node listed in cassandra_seeds too joins as a regular node (a seed does
# not bootstrap: its cassandra.yaml lists the other seeds while it joins), then,
# once the adds are done, cassandra_seeds is applied live on every node
# (change_seeds' way, no restart).
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo): the playbook asks for it itself, no -b needed.
# The cluster is checked before and after each node; the run stops at the
# first problem. Nodes already in the ring are only checked (re-running is safe),
# a node still bootstrapping (an earlier run that stopped waiting) is waited for
# again; a node half added (in the ring without data, data without ring) is refused.
# A new node that has data but is not in the ring (started once by mistake, a
# failed bootstrap) starts over empty (cassandra_add_node_reset, on by default:
# -e cassandra_add_node_reset=false refuses it instead): its directories emptied
# (reset_node.yml), only when Cassandra is down there, no up node of the cluster
# sees it in its ring, its cluster is this one or the stock 'Test Cluster' and it
# has no user keyspace but a failed bootstrap's of this cluster; else refused with
# what it holds. The screen says it ("node7 (dc1/rack_b): has data (...) — will be
# reset", what it deletes in a warning), the one question covers it.
# One screen first, one confirmation (cassandra_operation_confirm: false or
# --check skips it): cluster, version, Java, Medusa, each new node (address, dc, rack, data
# to stream, Medusa fqdn), the cleanup choice, and warnings (uneven racks, a run
# outside tmux/screen).
# A bootstrap can take hours: its progress printed every cassandra_stream_check_interval
# seconds (30, every 10 s for the first 5 minutes); the run stops only after
# cassandra_stream_stall_time seconds (900) with nothing streamed. Afterwards the cleanup command is printed, or
# run with cassandra_add_node_cleanup: sequential (one: the same), rack, dc or
# all (default none), the words of cassandra_cleanup_mode.
# One token per node (cassandra_num_tokens: 1): each new node needs
# cassandra_initial_token, or -e cassandra_token_auto=bisect (each one splits
# the largest range, nothing moves), balanced (an even ring: move_node then
# moves the nodes the screen marks) or true (shows both, asks which).
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight
  vars:
    _cassandra_preflight_target: add  # what cassandra_target_nodes are

# Before anything is installed: every problem of the new hosts at once
- name: Check the new hosts are ready
  hosts: "{{ cassandra_target_nodes }}"
  gather_facts: false
  become: true
  any_errors_fatal: true  # a host that errors must not drop out of the run
  tasks:
    - name: A new node is a node of the cluster
      ansible.builtin.assert:
        that: inventory_hostname in query('community.cassandra.cassandra_nodes')
        fail_msg: >-
          {{ inventory_hostname }} is {{ 'marked cassandra_node_state: absent' if inventory_hostname in groups[lookup('community.cassandra.cassandra_hosts')]
             else 'not in the group ' ~ lookup('community.cassandra.cassandra_hosts') }}: put it in the cluster's group
          (present) first.
        quiet: true

    - name: Check this host
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: new_node_checks.yml
      vars:
        _cassandra_new_node_skip_in_ring: true  # an interrupted run: checked next
        _cassandra_new_node_reset: "{{ cassandra_add_node_reset | default(true) | bool }}"
        _cassandra_new_node_reset_stops: false  # a running Cassandra is refused

- name: Check the new nodes
  hosts: "{{ cassandra_target_nodes }}"
  gather_facts: false
  become: true
  any_errors_fatal: true  # add none of them if one is refused
  vars:
    # the new nodes not in the ring yet, the nodes of the cluster
    _new: "{{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('cassandra_new_node_state', 'defined')
              | selectattr('cassandra_new_node_state', 'equalto', 'new') | map(attribute='inventory_hostname') | list }}"
    _joining: "{{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('cassandra_new_node_state', 'defined')
                  | selectattr('cassandra_new_node_state', 'equalto', 'joining') | map(attribute='inventory_hostname') | list }}"
    _existing: "{{ query('community.cassandra.cassandra_nodes') | reject('in', ansible_play_hosts_all) | list }}"
    # one token per node: the new nodes' tokens (cassandra_token_auto)
    _p0: "{{ hostvars[ansible_play_hosts_all[0]]._cassandra_preflight }}"
    _single: "{{ _p0.cassandra_num_tokens | int == 1 }}"
    _auto: "{{ cassandra_token_auto | default(false) | string | lower }}"
    _no_token: >-
      {{ _new | map('extract', hostvars, ['_cassandra_preflight', 'cassandra_initial_token']) | zip(_new)
         | selectattr(0, 'equalto', '') | map(attribute=1) | list }}
  tasks:
    # cassandra_install's: the summary names the Java the new nodes get
    - name: Load the role defaults
      ansible.builtin.include_role:
        name: "community.cassandra.{{ item }}"
        tasks_from: defaults.yml
        public: true
      loop: [cassandra_service, cassandra_install]

    - name: Check this node
      block:
        - name: Find which ones already joined (an interrupted run)
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: new_node_state.yml

        # Cassandra starts no bootstrap while another one runs: this node would fail to start
        - name: A still bootstrapping node goes before the new ones
          ansible.builtin.assert:
            that: cassandra_new_node_state != 'new' or _joining_after | length == 0
            fail_msg: >-
              {{ _joining_after | join(', ') }} still bootstrapping (an earlier run): put
              {{ 'it' if _joining_after | length == 1 else 'them' }} before {{ inventory_hostname }} in cassandra_target_nodes,
              so add_node waits for it before starting a new node.
            quiet: true
          vars:
            _joining_after: >-
              {{ ansible_play_hosts_all[ansible_play_hosts_all.index(inventory_hostname) + 1:]
                 | map('extract', hostvars) | selectattr('cassandra_new_node_state', 'defined')
                 | selectattr('cassandra_new_node_state', 'equalto', 'joining')
                 | map(attribute='inventory_hostname') | list }}
      rescue:
        - name: Record the refusal
          ansible.builtin.set_fact:
            cassandra_op_result: "add refused: {{ [ansible_failed_result.msg | default('')] | flatten | join(' ') }}"

        - name: Print the summary
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: summary.yml
          vars:
            cassandra_service_summary_hosts: "{{ ansible_play_hosts_all }}"

        - name: Stop here
          vars:
            cassandra_output: true  # a verdict: its msg as is
          ansible.builtin.fail:
            msg: No node was added.

    # Without the replication (no CQL access), the plan assumes the whole datacenter hands over data.
    # On one host without run_once: a run_once task that fails in a rescued block drops the other
    # hosts of the play on ansible-core 2.19+
    - name: Read the keyspaces' replication
      when: inventory_hostname == ansible_play_hosts_all[0]
      block:
        - name: Read the keyspaces' replication
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: keyspaces.yml
          vars:
            cassandra_keyspaces_from: "{{ _existing | first }}"
      rescue:
        - name: Go on without it
          ansible.builtin.set_fact:
            cassandra_keyspaces: null

    - name: Share the replication with every new node
      ansible.builtin.set_fact:
        cassandra_keyspaces: "{{ hostvars[ansible_play_hosts_all[0]].cassandra_keyspaces | default(none) }}"
      run_once: true

    # also on a run again after the nodes joined: the cleanup is still to do
    - name: Work out what the add means for the cluster
      ansible.builtin.set_fact:
        cassandra_add_node_plan: >-
          {{ hostvars[ansible_play_hosts_all[0]].cassandra_new_node_ring.cluster_status
             | community.cassandra.cassandra_add_node_plan(_new_info, hosts=_hosts, keyspaces=cassandra_keyspaces | default(none)) }}
      vars:
        _new_info: >-
          {%- set l = [] -%}
          {%- for h in ansible_play_hosts_all -%}
          {%-   set p = hostvars[h]._cassandra_preflight -%}
          {%-   set _ = l.append({'host': h, 'address': p.address, 'dc': p.cassandra_dc, 'rack': p.cassandra_rack,
                                  'in_ring': h not in _new, 'state': hostvars[h].cassandra_new_node_state}) -%}
          {%- endfor -%}
          {{ l }}
        _hosts: >-
          {{ dict(_existing | map('extract', hostvars, ['_cassandra_preflight', 'address']) | zip(_existing)) }}
      run_once: true

    # One token per node: where the new nodes go (plugins/filter/cassandra_tokens.py)
    - name: Plan the tokens of the new nodes (one token per node)
      when: _single | bool
      run_once: true
      block:
        - name: Check the token choice
          ansible.builtin.assert:
            that:
              - _auto in ['false', 'true', 'bisect', 'balanced']
              - _auto != 'true' or cassandra_operation_confirm | bool or _new | length == 0
              - _auto != 'false' or _no_token | length == 0
            fail_msg: >-
              {{ ('cassandra_token_auto must be false, true, bisect or balanced (got ' ~ _auto ~ ')')
                 if _auto not in ['false', 'true', 'bisect', 'balanced']
                 else ('cassandra_token_auto=true asks which plan to follow: choose one on the command line instead'
                       ' (-e cassandra_token_auto=bisect or balanced), the run being non-interactive'
                       ' (cassandra_operation_confirm false)') if _auto == 'true'
                 else ('One token per node: ' ~ _no_token | join(', ') ~ ' ' ~ ('has' if _no_token | length == 1 else 'have')
                       ~ ' no cassandra_initial_token. Set it, or -e cassandra_token_auto=true to see where they would'
                       ' go (bisect: no node moves; balanced: an even ring, other nodes move) and choose') }}
            quiet: true

        - name: Read the tokens of the ring
          community.cassandra.cassandra_ring:
          module_defaults:
            community.cassandra.cassandra_ring: >-
              {{ _cassandra_service_jmx | combine({'port': hostvars[_existing[0]].cassandra_jmx_port | default(_cassandra_service_jmx.port) | int}) }}
          delegate_to: "{{ _existing | first }}"
          register: cassandra_add_node_ring

        - name: Work out where the new nodes go
          ansible.builtin.set_fact:
            cassandra_add_node_tokens: >-
              {{ cassandra_add_node_ring.ring | community.cassandra.cassandra_token_add_plan(_new_tokens,
                   _p0.cassandra_partitioner, keyspaces=cassandra_keyspaces | default(none),
                   default_rf=cassandra_token_rf | default(3), hosts=_hosts) }}
          vars:
            _new_tokens: >-
              {%- set l = [] -%}
              {%- for h in ansible_play_hosts_all -%}
              {%-   set p = hostvars[h]._cassandra_preflight -%}
              {%-   set _ = l.append({'name': h, 'address': p.ring_address, 'dc': p.cassandra_dc, 'rack': p.cassandra_rack,
                                      'token': p.cassandra_initial_token}) -%}
              {%- endfor -%}
              {{ l }}
            _hosts: >-
              {{ dict(query('community.cassandra.cassandra_nodes')
                      | map('extract', hostvars, ['_cassandra_preflight', 'ring_address'])
                      | zip(query('community.cassandra.cassandra_nodes'))) }}

        - name: Refuse tokens that can't be worked out
          ansible.builtin.assert:
            that:
              - cassandra_add_node_tokens.problems | length == 0
              - _auto != 'balanced' or cassandra_add_node_tokens.balanced_problems | length == 0
            fail_msg: "{{ cassandra_add_node_tokens.problems + (cassandra_add_node_tokens.balanced_problems if _auto == 'balanced' else []) }}"
            quiet: true

    # Read-only: what each reset deletes goes on the screen, refused before any question
    # (topology worked it out already and showed it on its own screen: kept as shown)
    - name: Work out the reset of the new nodes (cassandra_add_node_reset)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: reset_node_plan.yml
      when:
        - cassandra_add_node_reset | default(true) | bool
        - cassandra_new_node_state == 'new'
        - _cassandra_node_reset_plan is not defined
      vars:
        _cassandra_node_reset_auto: true

    - name: Check the cleanup choice
      ansible.builtin.assert:
        that: cassandra_add_node_cleanup | default('none') in ['none', 'sequential', 'one', 'rack', 'dc', 'all']
        fail_msg: >-
          cassandra_add_node_cleanup must be none (print the command), sequential (one node at a time; one is the same),
          rack (a rack at a time), dc (a datacenter at a time) or all (every node at once: heavy I/O)
          (got {{ cassandra_add_node_cleanup | default('') }})
        quiet: true
      run_once: true

    # One screen (screen.yml): what will be done, with what, the warnings; then
    # one confirmation (not under --check nor with cassandra_operation_confirm false)
    - name: Show the plan and confirm the add
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: screen.yml
      when: _new | length > 0 or _joining | length > 0 or cassandra_add_node_cleanup | default('none') != 'none'
      vars:
        _p: "{{ hostvars[(_new + ansible_play_hosts_all) | first]._cassandra_preflight }}"
        _running: >-
          {{ (hostvars[_existing[0]].cassandra_preflight_describe.stdout | default('') ~ '\n').split('Database versions:')[1:]
             | first | default('') | regex_findall('(?m)^\s+([0-9][^:]*): \[') | join(', ') }}
        _cleanup: "{{ {'one': 'sequential'}.get(cassandra_add_node_cleanup | default('none'), cassandra_add_node_cleanup | default('none')) }}"
        # cassandra_medusa's defaults are not loaded here: the version and virtualenv defaults are copied
        # on when a new node gets it (each node's line says which)
        _medusa: >-
          {{ (_new + _joining) | map('extract', hostvars) | selectattr('cassandra_medusa_enabled', 'defined')
             | map(attribute='cassandra_medusa_enabled') | map('bool') | select | list | length > 0 }}
        _blocks: >-
          {%- set l = [] -%}
          {%- for h in _new -%}
          {%-   set p = hostvars[h]._cassandra_preflight -%}
          {%-   set m = hostvars[h] -%}
          {%-   set lines = [] -%}
          {%-   for e in cassandra_add_node_plan.estimate | selectattr('host', 'equalto', h) -%}
          {%-     set _ = lines.append('about ' ~ e.bytes | community.cassandra.cassandra_size ~ ' to stream (' ~ e.basis ~ ')') -%}
          {%-   endfor -%}
          {%-   if m._cassandra_service_is_seed | default(false) | bool -%}
          {%-     set _ = lines.append('in cassandra_seeds: joins as a regular node (a seed does not bootstrap), made a seed'
                                       ~ ' once it is up (cassandra_seeds applied live on every node)') -%}
          {%-   endif -%}
          {%-   if m.cassandra_medusa_enabled | default(false) | bool -%}
          {%-     set _ = lines.append('Medusa fqdn ' ~ ((m.cassandra_medusa_fqdn if m.cassandra_medusa_fqdn is defined
                    else (((m.ansible_facts.hostname | default(h)) ~ '.' ~ m.cassandra_medusa_fqdn_domain)
                          if m.cassandra_medusa_fqdn_domain | default('') else '')) or '(Medusa works it out)')) -%}
          {%-   endif -%}
          {%-   if m._cassandra_node_reset_plan.line | default('') -%}
          {%-     set _ = lines.append(m._cassandra_node_reset_plan.line) -%}
          {%-   endif -%}
          {%-   set _ = l.append({'title': h | community.cassandra.cassandra_screen_title(p), 'lines': lines}) -%}
          {%- endfor -%}
          {{ l }}
        cassandra_screen_session_warning: true
        cassandra_screen_question: >-
          {{ ('Add ' ~ _new | join(', ') ~ '?') if _new else ('Wait for ' ~ _joining | join(', ') ~ '?') if _joining
             else 'Run the cleanup?' }}
        cassandra_screen:
          operation: add_node
          cluster: "{{ _p.cassandra_cluster_name }}"
          version: "{{ _running }}"
          summary: >-
            {{ ('add ' ~ _new | join(', ')) if _new else ('wait for ' ~ _joining | join(', ')) if _joining
               else 'cleanup only' }}
          intro:
            - >-
              New nodes get Cassandra {{ cassandra_package_version | default('', true) or ('series ' ~ _p.cassandra_version) }},
              Java {{ cassandra_java_version | default('of the series') }} ({{ ('tarball ' ~ cassandra_java_tarball)
              if cassandra_java_tarball | default('', true) else ('in ' ~ cassandra_java_home) if cassandra_java_home | default('', true)
              else 'package' if cassandra_install_java | default(true) | bool else 'set up by other means' }}),
              Medusa {{ ('on (' ~ cassandra_medusa_version | default('0.30.1') ~ ' in ' ~ (cassandra_medusa_venv | default('/opt/cassandra-medusa')
              or 'the system Python') ~ ')') if _medusa else 'off' }}.
            - >-
              {{ ('One node at a time; each one streams its share of the data (hours on big nodes), its progress printed every '
                  ~ cassandra_stream_check_interval ~ 's (sooner at first); the run stops after '
                  ~ cassandra_stream_stall_time | int | community.cassandra.cassandra_duration(true) ~ ' without progress.') if _new or _joining
                 else ('No node to add (' ~ ansible_play_hosts_all | join(', ') ~ ' already in the ring).') }}
            - "{{ ('Still bootstrapping, waited for first: ' ~ _joining | join(', ')) if _joining else '' }}"
          blocks: "{{ _blocks }}"
          after:
            - >-
              {{ ('Once the adds are done, cassandra_seeds (' ~ (cassandra_seeds if cassandra_seeds is string else cassandra_seeds | join(','))
                  ~ ') is applied live on every node (no restart): ' ~ _seeds_added | join(', ') ~ ' then a seed.')
                 if _seeds_added and not _cassandra_screen_asked_by | default('') else '' }}
            - >-
              Cleanup afterwards (cassandra_add_node_cleanup={{ _cleanup }}): {{ {'none': 'none, the commands are printed at the end',
                'sequential': 'one node at a time', 'rack': 'a rack at a time', 'dc': 'a datacenter at a time',
                'all': 'every node at once: heavy I/O'}[_cleanup] }}
              ({{ cassandra_add_node_plan.cleanup | dict2items | map(attribute='value') | flatten | length }} nodes: {{
              cassandra_add_node_plan.scope | dict2items | map(attribute='key') | zip(cassandra_add_node_plan.scope | dict2items
              | map(attribute='value') | map('replace', 'rack', "the new nodes' racks") | map('replace', 'dc', 'whole datacenter'))
              | map('join', ' ') | join(', ') }}).
            - >-
              {{ 'One token per node (shares with the largest replication factor of each datacenter, else cassandra_token_rf):'
                 if _single | bool and _new else '' }}
            - pre: "{{ cassandra_add_node_tokens.lines | default([]) if _single | bool and _new else [] }}"
            - >-
              {{ {'false': 'Tokens from the inventory (cassandra_initial_token).',
                  'bisect': 'Following bisect: no node moves.',
                  'balanced': ('Following balanced: then run move_node to move ' ~ cassandra_add_node_tokens.moves | map(attribute='name') | join(', ')
                               ~ ' (until then the ring is uneven).') if cassandra_add_node_tokens.moves | default([]) else 'Following balanced: no node moves.',
                  'true': ('--check: a real run asks next, bisect or balanced; this one follows bisect.' if ansible_check_mode
                           else 'You choose next: bisect or balanced.')}[_auto] if _single | bool and _new else '' }}
          # cassandra_add_node_reset: what each reset deletes (reset_node_plan.yml), covered by the one question
          warnings: >-
            {{ _resets | community.cassandra.cassandra_reset_warnings
               + [{'label': 'racks', 'each': cassandra_add_node_plan.warnings},
                  {'label': 'tokens', 'each': cassandra_add_node_tokens.warnings | default([]) if _single | bool and _new else []}] }}
        _seeds_added: >-
          {{ (_new + _joining) | map('extract', hostvars) | selectattr('_cassandra_service_is_seed', 'defined')
             | selectattr('_cassandra_service_is_seed') | map(attribute='inventory_hostname') | list }}
        _resets: >-
          {%- set l = [] -%}
          {%- for h in _new if hostvars[h]._cassandra_node_reset_plan is defined -%}
          {%-   set _ = l.append({'name': h, 'plan': hostvars[h]._cassandra_node_reset_plan}) -%}
          {%- endfor -%}
          {{ l }}

    - name: Choose where the new nodes go
      ansible.builtin.pause:
        prompt: "bisect (no node moves) or balanced (an even ring, move_node moves other nodes afterwards)? Answer bisect or balanced"
      register: cassandra_token_choice
      run_once: true
      when: _single | bool and _auto == 'true' and _new | length > 0 and not ansible_check_mode  # --check: bisect

    - name: Check the choice
      ansible.builtin.assert:
        that:
          - _choice in ['bisect', 'balanced']
          - _choice != 'balanced' or cassandra_add_node_tokens.balanced_problems | length == 0
        fail_msg: >-
          {{ ('Answer bisect or balanced (got ' ~ _choice ~ '): nothing was done, run it again')
             if _choice not in ['bisect', 'balanced'] else cassandra_add_node_tokens.balanced_problems | join(' ') }}
        quiet: true
      run_once: true
      when: _single | bool and _auto == 'true' and _new | length > 0 and not ansible_check_mode
      vars:
        _choice: "{{ cassandra_token_choice.user_input | default('') | trim | lower }}"

    - name: Give the new node its token
      ansible.builtin.set_fact:
        cassandra_initial_token: "{{ cassandra_add_node_tokens[_kind][inventory_hostname] }}"
        cassandra_add_node_token_kind: "{{ _kind }}"
      when:
        - _single | bool
        - _auto != 'false'
        - inventory_hostname in cassandra_add_node_tokens[_kind] | default({})
      vars:
        _kind: >-
          {{ ('bisect' if ansible_check_mode else hostvars[ansible_play_hosts_all[0]].cassandra_token_choice.user_input
              | default('') | trim | lower) if _auto == 'true' else _auto }}

    # After every refusal above: a node with data of its own (a failed first
    # start or bootstrap, not in the ring) starts over empty
    - name: Reset the new nodes first (cassandra_add_node_reset)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: reset_node.yml
      when:
        - cassandra_add_node_reset | default(true) | bool
        - cassandra_new_node_state == 'new'
        - _p.delete | default([]) | length > 0 or _p.stop | default(false) | bool or _p.disable | default(false) | bool
      vars:
        _p: "{{ _cassandra_node_reset_plan | default({}) }}"
        _cassandra_node_reset_auto: true
        _cassandra_node_reset_confirmed: true  # on the add_node screen, the one question

# Everything before the start (repository, install, OS, config, firewall,
# Medusa), on every new node at once: nothing here starts Cassandra. A host
# that fails stops the run before any node starts.
- name: Prepare the new nodes, all at once
  hosts: "{{ cassandra_target_nodes }}"
  any_errors_fatal: true
  become: true
  tasks:
    - name: Prepare this node
      vars:
        cassandra_output_rescued: true  # the rescue says what failed, the same causes once (ops callback)
      block:
        # an earlier rescue's failure (e.g. the keyspaces' read) stays in these facts: not this step's
        - name: Forget an earlier failure
          ansible.builtin.set_fact:
            ansible_failed_result: {}
            ansible_failed_task: {}

        - name: Prepare this node
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: action_add_prepare.yml

        # The package may start it at boot: a reboot while the nodes before it bootstrap would make it
        # join out of turn. Its start (main.yml) enables it again.
        - name: Read whether Cassandra starts at boot
          ansible.builtin.command: systemctl is-enabled cassandra
          register: cassandra_add_node_enabled
          changed_when: false
          failed_when: false
          check_mode: false  # read-only
          when: cassandra_new_node_state == 'new'

        - name: Keep Cassandra from starting at boot until its turn
          ansible.builtin.systemd_service:
            name: cassandra
            enabled: false
          when:
            - cassandra_new_node_state == 'new'
            - cassandra_add_node_enabled.stdout | default('') | trim == 'enabled'
      rescue:
        # any_errors_fatal: the other nodes come here too, without a failure of their own
        - name: Record the failure
          ansible.builtin.set_fact:
            cassandra_op_result: >-
              {{ ('add FAILED while preparing it: ' ~ _failure | community.cassandra.cassandra_failure_cause(_task)) if _own | bool
                 else 'not prepared: stopped with the others (a node failed)' }}
            # what the grouped report reads (none: no failure of its own)
            _cassandra_add_prepare_failure: >-
              {{ {'host': inventory_hostname, 'task': _task, 'family': ansible_facts['os_family'] | default(''), 'result': _failure}
                 if _own | bool else none }}
          vars:
            _task: "{{ ansible_failed_task.name | default('') }}"
            # a failure of its own, with or without a message (a node stopped with the others has none)
            _own: "{{ ansible_failed_result | default({}) | length > 0 }}"
            # the error's text only (a whole result can be big), a loop's failed items' messages
            _failure: >-
              {{ dict(ansible_failed_result | default({}) | dict2items | selectattr('key', 'in', ['msg', 'failures', 'stderr'])
                      | items2dict)
                 | combine({'results': ansible_failed_result.results | default([]) | selectattr('failed', 'defined')
                                       | selectattr('failed') | map(attribute='msg', default='') | list}) }}

        # One verdict for the nodes that failed at this step, their causes grouped, then what to check
        - name: Stop here
          ansible.builtin.fail:
            msg: >-
              {{ _failures | community.cassandra.cassandra_failure_report(operation='add_node', cluster=_cluster,
                   rerun=_rerun, python311=_failures | map(attribute='task') | select('search', 'python3.11') | list | length > 0)
                 | join(_nl) }}
          run_once: true
          vars:
            _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
            cassandra_output: true  # a verdict: its msg as is
            _failures: >-
              {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('_cassandra_add_prepare_failure', 'defined')
                 | map(attribute='_cassandra_add_prepare_failure') | select | list }}
            _cluster: "{{ (_cassandra_preflight | default({})).cassandra_cluster_name | default('') }}"
            _rerun: >-
              {{ (_cassandra_screen_asked_by | default('') or 'add_node') | community.cassandra.cassandra_command(
                   inventory=ansible_inventory_sources,
                   default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
                   hosts=cassandra_hosts | default(''), cwd=lookup('ansible.builtin.env', 'PWD'),
                   extra={} if _cassandra_screen_asked_by | default('')
                   else {'cassandra_target_nodes': cassandra_target_nodes}) }}

# Then the starts, one at a time: each one bootstraps, waited for
- name: Add the new nodes, one at a time
  hosts: "{{ cassandra_target_nodes }}"
  serial: 1
  any_errors_fatal: true
  gather_facts: false  # gathered by the play before
  become: true
  tasks:
    - name: Add this node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: add
        _cassandra_add_prepared: true
        # the progress lines' [i/n]
        _cassandra_stream_index: "{{ ansible_play_hosts_all.index(inventory_hostname) + 1 }}"
        _cassandra_stream_steps: "{{ ansible_play_hosts_all | length }}"
        cassandra_service_node_checks_before: false
        # not in the ring yet: this node and the ones after it that never started (--check: all of them)
        _pending: >-
          {{ ansible_play_hosts_all[0 if ansible_check_mode else ansible_play_hosts_all.index(inventory_hostname):]
             | map('extract', hostvars, 'cassandra_new_node_state') | select('equalto', 'new') | list | length }}
        # topology: the hosts marked absent are still in the ring until it removes them, after the adds
        _extra: "{{ _cassandra_ring_extra | default(0) | int }}"
        cassandra_service_expected_before: "{{ query('community.cassandra.cassandra_nodes') | length - _pending | int + _extra | int }}"
        cassandra_service_expected_after: >-
          {{ query('community.cassandra.cassandra_nodes') | length - _pending | int + _extra | int + (1 if cassandra_new_node_state == 'new' else 0) }}
        # bootstraps an earlier run started (UJ, waited for in turn): not a problem around the
        # nodes before them (a new node never comes before them, see above)
        _joining: >-
          {{ ansible_play_hosts_all[ansible_play_hosts_all.index(inventory_hostname):]
             | map('extract', hostvars) | selectattr('cassandra_new_node_state', 'equalto', 'joining')
             | map(attribute='cassandra_new_node_address') | list }}
        cassandra_service_joining_before: "{{ _joining }}"
        cassandra_service_joining_after: "{{ _joining | reject('equalto', cassandra_new_node_address) | list }}"

# A new node in cassandra_seeds joined as a regular node (join_seeds.yml): now
# that it is up, cassandra_seeds goes live on every node. In topology, its own
# step does it (between the adds and the removals).
- name: Apply cassandra_seeds now that the new seeds are up
  hosts: >-
    {{ query('community.cassandra.cassandra_nodes')
       if query('ansible.builtin.inventory_hostnames', cassandra_target_nodes) and not _cassandra_screen_asked_by | default('')
       else 'localhost:!localhost' }}
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Apply cassandra_seeds on every node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: seeds_apply.yml
      when:
        - _new_seeds | length > 0
        - not ansible_check_mode  # nothing was set up
      vars:
        _new_seeds: >-
          {{ query('ansible.builtin.inventory_hostnames', cassandra_target_nodes) | map('extract', hostvars)
             | selectattr('_cassandra_service_is_seed', 'defined') | selectattr('_cassandra_service_is_seed')
             | map(attribute='inventory_hostname') | list }}

- name: Summary
  hosts: "{{ cassandra_target_nodes }}"
  gather_facts: false
  become: true
  tasks:
    - name: Print the summary
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: summary.yml
      vars:
        cassandra_service_summary_hosts: "{{ ansible_play_hosts_all }}"

    - name: Say which nodes to move (one token per node, balanced)
      ansible.builtin.debug:
        msg: >-
          {{ ['TO DO', '  1. even out the ring: move ' ~ _moves | map(attribute='name') | join(', ')
              ~ ', one at a time (the plan shown at the start):',
              '     ansible-playbook -i ' ~ ansible_inventory_sources | first ~ ' community.cassandra.move_node -e cassandra_hosts='
              ~ lookup('community.cassandra.cassandra_hosts')] | join(_nl) }}
      run_once: true
      when:
        - _moves | length > 0
        - ansible_play_hosts_all | map('extract', hostvars) | selectattr('cassandra_add_node_token_kind', 'defined')
          | selectattr('cassandra_add_node_token_kind', 'equalto', 'balanced') | list | length > 0
      vars:
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _moves: "{{ hostvars[ansible_play_hosts_all[0]].cassandra_add_node_tokens.moves | default([]) }}"
        cassandra_output: true
        cassandra_output_gap: true  # a block of its own (ops callback)

# The nodes that handed ranges over still hold that data until a cleanup: the
# datacenter's nodes, or only the new nodes' racks when every keyspace has as
# many replicas there as racks. cassandra_add_node_cleanup: none (default)
# prints the command; sequential (or one), rack, dc or all runs it here, by
# batches (one node, the nodes of a rack, of a datacenter, or all of them at
# once), the cluster checked before each batch.
- name: Clean up the nodes that handed data over
  hosts: >-
    {{ query('community.cassandra.cassandra_nodes') if query('ansible.builtin.inventory_hostnames', cassandra_target_nodes)
       else 'localhost:!localhost' }}
  gather_facts: false
  become: true
  vars:
    _plan: >-
      {{ hostvars[query('ansible.builtin.inventory_hostnames', cassandra_target_nodes) | first].cassandra_add_node_plan | default({}) }}
    _targets: >-
      {{ _plan.cleanup | default({}) | dict2items | map(attribute='value') | flatten | select('in', ansible_play_hosts) | list }}
    _mode: "{{ {'one': 'sequential'}.get(cassandra_add_node_cleanup | default('none'), cassandra_add_node_cleanup | default('none')) }}"
    cassandra_service_node_action: cleanup
    cassandra_cleanup_jobs: 2
  tasks:
    - name: Say which cleanups to run
      ansible.builtin.debug:
        msg: >-
          {{ [('After the real run, once' if ansible_check_mode else 'Once') ~ ' the cluster is fine, clean up the nodes that'
              ~ ' handed data over (' ~ _scope ~ '):',
              '  ' ~ 'cleanup' | community.cassandra.cassandra_command(
                       inventory=ansible_inventory_sources,
                       default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
                       hosts=cassandra_hosts | default(''), limit=_targets, cwd=lookup('ansible.builtin.env', 'PWD'),
                       extra={'cassandra_cleanup_mode': cassandra_cleanup_mode | default('sequential'),
                              'cassandra_cleanup_jobs': cassandra_cleanup_jobs}), '',
              '  cassandra_cleanup_mode: sequential (one node at a time, default) | rack (a rack at a time)',
              '                          | dc (a datacenter at a time) | all (every node at once: heavy I/O)',
              '  cassandra_cleanup_jobs: compaction threads per node, default 2 (0 = all compaction threads)'] | join(_nl) }}
      run_once: true
      when:
        - _targets | length > 0
        - _mode == 'none'
      vars:
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        cassandra_output: true
        cassandra_output_gap: true  # a block of its own (ops callback)
        _scope: >-
          {{ _plan.scope | dict2items | map(attribute='key') | zip(_plan.scope | dict2items | map(attribute='value')
             | map('replace', 'rack', "the new nodes' racks only") | map('replace', 'dc', 'the whole datacenter'))
             | map('join', ': ') | join(', ') }}

    - name: Clean up, by batches
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: cleanup_batch.yml
        apply:
          run_once: true
      loop: "{{ _batches }}"
      loop_control:
        loop_var: cassandra_cleanup_batch
        label: "{{ cassandra_cleanup_batch | join(', ') }}"
      run_once: true
      when: _mode != 'none' and not ansible_check_mode
      vars:
        _batches: >-
          {%- set batches = {} -%}
          {%- for h in _targets -%}
          {%-   set p = hostvars[h]._cassandra_preflight -%}
          {%-   set key = {'sequential': h, 'rack': p.cassandra_dc ~ '/' ~ p.cassandra_rack, 'dc': p.cassandra_dc, 'all': 'all'}[_mode] -%}
          {%-   set _ = batches.update({key: batches.get(key, []) + [h]}) -%}
          {%- endfor -%}
          {{ batches.values() | list }}
