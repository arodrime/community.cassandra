minor_changes:
  - "create_cluster - new playbook that builds a cluster from blank hosts: the identity settings (cluster name, version, number of tokens, partitioner, snitch, dc and rack, the allocator hint with vnodes) must come from the inventory (``-e cassandra_accept_default_identity=true`` takes the role defaults), a new 5.0 cluster starts in storage compatibility mode ``NONE``; the nodes are prepared in parallel (repository, install, linux, config, and firewall with ``cassandra_manage_firewall: true``), then started one at a time, seeds first and the racks in an order the token allocator accepts, each one joined before the next, then the cluster is checked. With one token per node, the nodes without ``cassandra_initial_token`` get evenly spaced tokens, shown with each node's share and confirmed. Run again once every node has joined, it starts nothing (https://github.com/ansible-collections/community.cassandra/issues/334)."
  - "rolling_restart and rolling_reboot - new playbooks that drain and restart (or reboot the host of) each node in turn, the cluster checked healthy before and after each, stopping at the first problem without touching the next node; the plan is shown and confirmed once (``cassandra_operation_confirm: false`` for runs without a terminal, ``--check`` asks nothing). Each run keeps a progress file on the controller: ``-e cassandra_rolling_resume=true`` resumes an interrupted one, skipping the nodes done; one node at a time, the node it stopped at may be found drained or stopped. ``-e cassandra_rolling_mode=rack`` restarts a rack at a time when every keyspace keeps at most one replica per rack (https://github.com/ansible-collections/community.cassandra/issues/334)."
  - "stop_rack and start_rack - new playbooks that stop every node of one rack at once (``-e cassandra_target_dc=<dc> -e cassandra_target_rack=<rack>``), each drained first, refused when a keyspace would lose more than one replica or a node of the datacenter is already down (``cassandra_rack_force: true`` goes on), or when the ring has the datacenter or rack under another name than the inventory; then start it again and check the cluster (https://github.com/ansible-collections/community.cassandra/issues/334)."
  - "cassandra_operation - the task files of the node operations (one node at a time with the cluster health before and after, the drain, the confirmation screen, the progress file, the recap) and their settings: ``cassandra_operation_confirm``, ``cassandra_operation_drain``, ``cassandra_rolling_resume``, ``cassandra_rolling_progress_dir``, ``cassandra_rolling_progress_days``, ``cassandra_token_rf``, ``cassandra_token_allow_partial``, ``cassandra_cql_username`` and ``cassandra_cql_password``."
