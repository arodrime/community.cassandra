bugfixes:
- "import_cluster - a stock line of a later release the node's options file predates (5.0's ``-Dchronicle.analytics.disable=true``, the lines 5.0's ``jvm11-server.options`` added to 4.x's) is imported as it is, in the file's ``removed_options``; the self-check compared without it while apply_config added it, so the import said in sync, no restart, and apply_config restarted every node for a new JVM argument."
- "import_cluster - logback.xml writing the log dir as itself (``/data/cassandra/log/system.log``) is imported as it is (``cassandra_log_system_dir``, ``cassandra_log_debug_dir``, ``cassandra_log_audit_dir``); it was read as ``${cassandra.logdir}``, and the next apply_config rewrote the file, which the import did not say."
