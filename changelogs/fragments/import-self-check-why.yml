minor_changes:
  - "import_cluster playbook - a failed self-check says why the inventory does not reproduce the nodes yet (``SELF-CHECK FAILED — the inventory does not reproduce 4 nodes yet``), then each kind of difference by what the import establishes of its cause (settings no inventory variable sets, a file of yours that gives another value, parts of the nodes outside the config files, the same settings in another layout, others) with what ``apply_config`` would do. Under each, the files and their nodes once, each setting in its file's own words (a YAML key, a JVM option or a ``cassandra-env.sh`` variable by its name, logback's elements as ``AUDIT / rollingPolicy / fileNamePattern``, an owner or a mode) with the node's value and Ansible's on aligned ``Node`` and ``Ansible`` lines (``absent``, ``present``, ``(empty)``), then ``To pass:`` with the option of each way out. report.txt has the same under ``TO DO``, its ``HAND EDITS`` each file and its nodes once with the ways to keep, carry or drop them; report.details.txt has each difference as the self-check found it (full XPaths, both values as written) in a ``SELF-CHECK`` section. The self-check compares logback.xml element by element and cassandra-env.sh line by line. The shareable copy keeps these settings' names as they are (a node's or a cluster's name in them replaced)."
