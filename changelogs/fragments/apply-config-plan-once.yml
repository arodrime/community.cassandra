minor_changes:
  - "apply_config playbook - under ``--check`` the plan is said once, at the end: the verdict (``CHECK  apply_config  prod  1 would restart, 2 up to date``), ``DIFFERENCES FOUND`` (one table: ``Item``, ``Node``, ``Inventory``, ``Nodes``, the values in aligned columns, never cut) and ``WOULD DO`` (each node's outcome in a real run, a restarted node's steps in their order: ``would write the config, drain and restart Cassandra``), then the warnings. A real run's plan titles the same tables ``DIFFERENCES FOUND`` and ``WILL DO``."
