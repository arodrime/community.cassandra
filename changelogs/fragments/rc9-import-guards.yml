bugfixes:
  - 'preflight and every playbook (and the cassandra_config role) - ``cassandra_env_extra_lines`` and ``cassandra_logback_extra_lines``, which an import by a 2.1.0 release candidate wrote, are refused before anything is changed (``--check`` too), with the files that set them and the way out (import the cluster again, which writes these lines into snippets); they were only warned about, and the files written without their lines. A re-import names them in a file of yours.'
  - 'import_cluster playbook - the password of a URL (``scheme://user:password@host``: an HTTP proxy at the end of ``cassandra-env.sh``, an appender''s URL in ``logback.xml``) goes to ``secrets.yml`` and the snippet refers to it (up to the last ``@`` before a blank or a ``/``; with a quote, a brace, a ``?`` or a ``#`` in it, the lines go to ``secrets.yml`` whole); the output and ``apply_config``''s diff mask it whole.'
  - 'cassandra_config role - a WARNING, once for the nodes of the run, when ``cassandra_log_audit_file`` left to its default (on with ``FileAuditLogger``) would move the audit events from ``system.log`` to ``audit/audit.log`` on nodes whose ``logback.xml`` has the audit appender commented out, with the way out.'
