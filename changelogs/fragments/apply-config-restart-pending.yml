bugfixes:
  - apply_config - the restart still pending is told from the files cassandra_config writes (and the systemd unit) only, by content, with the running Cassandra found by its process (not the unit's main PID). A node with no record of the files it started with (e.g. imported) is no longer restarted for files written since its start, which are listed instead; cassandra_config and cassandra_service record them before their first change of such a node (in /var/lib/cassandra; it warns where that directory is missing) (a change an earlier version wrote on a node with no record is listed, not restarted for). The JMX users' files count where they are in the conf dir (Debian, Ubuntu). import_cluster reports those files.
