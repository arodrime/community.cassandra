---
# defaults file for cassandra_service
cassandra_service_enabled: true
cassandra_service_state: started

# Restarting a node is a cluster operation: a changed unit only takes effect
# at the next restart unless this is set. The role handles one node; order
# nodes in the playbook (serial: 1) when restarting several.
cassandra_service_restart_on_change: false

# A new node listed in cassandra_seeds is refused when another seed already
# answers: seeds don't bootstrap, it would join without its data.
cassandra_service_allow_new_seed: false

# false: the node's own unit (/etc/systemd/system/cassandra.service, or the
# package's init script) is kept, not replaced by the role's (a node set up
# another way)
cassandra_service_unit_manage: true

# The account Cassandra runs as: cassandra_user and cassandra_group drive the
# unit, the config files' group and the directories and JMX files of
# cassandra_config. cassandra_service_user/_group override them for the unit and
# those directories and files, not the config files' group: set cassandra_user
# and cassandra_group instead.
cassandra_user: cassandra
cassandra_group: cassandra
cassandra_service_user: "{{ cassandra_user }}"
cassandra_service_group: "{{ cassandra_group }}"
# systemd Restart=. "no": a node that died stays down until a human looks
# (disk/commit failure policies and OOM kill it on purpose). "on-failure"
# is capped at cassandra_service_start_limit_burst restarts per interval.
cassandra_service_restart: "no"
cassandra_service_start_limit_burst: 3
cassandra_service_start_limit_interval: 1800  # seconds
cassandra_service_limit_nofile: 1048576
cassandra_service_limit_nproc: 32768
cassandra_service_limit_memlock: infinity
cassandra_service_limit_as: infinity
cassandra_service_timeout_stop: 180  # seconds, let a busy node flush
cassandra_service_environment: {}  # extra Environment= lines, e.g. {JAVA_HOME: /usr/lib/jvm/java-17}
# Tasks (threads) the service may create. systemd's default is 15% of
# pid_max (can be ~4900): too low for a busy node ("unable to create native thread").
cassandra_service_tasks_max: infinity
# Drain the node (nodetool drain) before the JVM gets SIGTERM, so a plain
# "systemctl stop cassandra" (OS patching, reboot) is clean. Never blocks the
# stop: after cassandra_service_drain_timeout the JVM is stopped anyway.
cassandra_service_drain_on_stop: true
cassandra_service_drain_timeout: 120  # seconds, below cassandra_service_timeout_stop

# Wait for the node to be joined (nodetool netstats "Mode: NORMAL")
cassandra_service_wait_for_normal: true
cassandra_service_wait_timeout: 600  # seconds

# The waits (wait_loop.yml) read the node every
# cassandra_stream_early_check_interval seconds during the first
# cassandra_stream_early_time seconds (a short wait ends in seconds), then
# every cassandra_stream_check_interval seconds.
cassandra_stream_check_interval: 30  # seconds
cassandra_stream_early_check_interval: 10  # seconds
cassandra_stream_early_time: 300  # seconds

# checks per include level of the progress waits (wait_loop.yml): Ansible nests
# every include one level deeper and fails past ~150 levels. A round covers 6
# hours of the check interval, 24 to 720 checks: at 30 s (the default) or more,
# a month in 150 rounds; a shorter interval, less (10 s: 2 hours a round). By
# groups of _cassandra_wait_size: once it ends, what is left of the round is
# skipped by at most that many checks and groups, one task each
_cassandra_stream_round_size: "{{ [24, [720, 21600 // ([1, cassandra_stream_check_interval | int] | max)] | min] | max }}"
_cassandra_wait_size: "{{ ((_cassandra_stream_round_size | int) ** 0.5) | round(0, 'ceil') | int }}"

# JMX access for the nodetool calls (the drain on stop, the wait for NORMAL)
# (cassandra_jmx_port comes from cassandra_config). Credentials only when
# remote JMX with authentication is on; prefer the password file.
cassandra_jmx_username: ""
cassandra_jmx_password: ""
cassandra_jmx_password_file: ""
# Owner, group and mode cassandra_config gives the config files (its defaults
# when it is not in the play), for the check that the account can read them
_cassandra_service_config_perms:
  owner: "{{ cassandra_config_user | default('root') }}"
  group: "{{ cassandra_config_group | default(cassandra_group) }}"
  mode: "{{ cassandra_config_mode | default('0640') }}"
  public_mode: "{{ cassandra_config_public_mode | default('0644') }}"
  files: "{{ cassandra_config_file_permissions | default({}) }}"
  user: "{{ cassandra_service_user }}"
  user_group: "{{ cassandra_service_group }}"
# Where the config Cassandra runs with is, and the checksums it started with
_cassandra_service_conf_dir: >-
  {{ cassandra_conf_dir | default('/etc/cassandra/conf' if ansible_facts['os_family'] == 'RedHat' else '/etc/cassandra') }}
_cassandra_service_config_snapshot: /var/lib/cassandra/.ansible_config_at_start.json
# Where a node that started once keeps its system keyspace (system/): a data dir
# (cassandra_data_file_directories, cassandra_data_dir) or, 4.1+, local_system_data_file_directory
_cassandra_service_system_dirs: >-
  {{ ([cassandra_data_file_directories | default([])] | flatten
      + [(cassandra_extra_settings | default({})).local_system_data_file_directory | default('', true) | string,
         cassandra_data_dir | default('/var/lib/cassandra/data')])
     | select | map('regex_replace', '(?<=.)/+$', '') | unique | list }}
_cassandra_service_jmx: >-
  {{ {'port': cassandra_jmx_port | default(7199) | int}
     | combine({'username': cassandra_jmx_username} if cassandra_jmx_username else {})
     | combine({'password_file': cassandra_jmx_password_file} if cassandra_jmx_password_file
               else ({'password': cassandra_jmx_password} if cassandra_jmx_password else {})) }}
