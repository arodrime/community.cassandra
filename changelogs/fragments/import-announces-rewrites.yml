minor_changes:
- "import_cluster playbook - ``in sync with Ansible`` (yes, or not all verified: on the nodes read, named) lists what the next apply_config writes, one fact per line: each file ``rewritten`` or ``created`` with why (``layout``, ``heap placement``: the heap goes to ``jvm-server.options``, ``Java N does not read it``, a cassandra.yaml key its Cassandra rejects removed, the stock JMX password file option back when the JVM never reads it) or ``header line added``, then its nodes when not all of them; and the nodes whose Cassandra runs outside its unit, with apply_config's way out. With no difference found, the diffs of the files written are in ``report.details.txt`` (``REWRITES OF THE NEXT APPLY_CONFIG``, secrets masked). The next step's ``expected`` line names that count of files and leaves the restarts to apply_config --check (WHAT HAPPENS); it said only the JVM's files, and nothing of the heap's other file nor of the header lines. A file that differs only where Cassandra reads nothing takes the role's layout once; the next apply_config after it finds nothing to do."
bugfixes:
- "import_cluster playbook - the config files changed since the running Cassandra started are taken as apply_config takes them: with apply_config's record of that start (``/var/lib/cassandra/.ansible_config_at_start.json``), the files that differ from it; only without a record, the files written since that start. The node's note says which, and no longer what applies them."
