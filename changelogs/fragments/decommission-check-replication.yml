minor_changes:
  - decommission_node playbook - ``--check`` reads the keyspaces' replication too (read-only), so it refuses a datacenter left with too few nodes and missing CQL credentials as the real run does; a refusal on a cqlsh error shows that error, and names ``cassandra_cql_username``/``cassandra_cql_password`` when CQL authentication is on.
