---
# Whether the running Cassandra still has to pick up a config change: the
# files cassandra_config writes (not the keystores, backups or other files of
# the conf dir) differ from the ones it started with, recorded by
# config_snapshot.yml at each start, or by config_seed.yml before
# cassandra_config changes a node started another way. With no record (e.g.
# a node just imported, which the roles have not changed), nothing is
# pending: a file written after its JVM started is only listed in
# cassandra_config_unknown_files, as what Cassandra read then is unknown.
# Sets cassandra_config_restart_pending.
- name: Checksum the config files
  ansible.builtin.find:
    paths: "{{ _cassandra_service_conf_dir }}"
    patterns: "{{ _cassandra_service_config_files }}"
    file_type: file
    get_checksum: true
  register: cassandra_pending_files

- name: Read the checksums recorded at the last start
  ansible.builtin.slurp:
    path: "{{ _cassandra_service_config_snapshot }}"
  register: cassandra_pending_snapshot
  failed_when: false

- name: Read when the running Cassandra started (no checksums recorded)
  ansible.builtin.include_tasks: jvm_started.yml
  when: cassandra_pending_snapshot.content is not defined

- name: Note whether a restart is pending
  ansible.builtin.set_fact:
    cassandra_config_restart_pending: "{{ _changed | length > 0 }}"
    cassandra_config_newer_files: "{{ _changed }}"
    cassandra_config_unknown_files: "{{ _unknown }}"
  vars:
    _started: "{{ cassandra_pending_snapshot.content | b64decode | from_json if cassandra_pending_snapshot.content is defined else {} }}"
    _changed: >-
      {%- set out = [] -%}
      {%- for f in cassandra_pending_files.files if cassandra_pending_snapshot.content is defined -%}
      {%-   if _started.get(f.path) != f.checksum -%}{%- set _ = out.append(f.path | basename) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | sort }}
    _unknown: >-
      {%- set out = [] -%}
      {%- for f in cassandra_pending_files.files if cassandra_pending_snapshot.content is not defined -%}
      {%-   if cassandra_jvm.start is defined and f.ctime > cassandra_jvm.start | float -%}
      {%-     set _ = out.append(f.path | basename) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out | sort }}
