---
# Start the nodes of a rack that stop_rack stopped.
#
#   ansible-playbook community.cassandra.start_rack \
#     -e cassandra_target_dc=dc1 -e cassandra_target_rack=rack2
#
# Each node started and waited for until it has joined, then the cluster
# checked from a node of the rack: a node of the rack not UN or not reached
# stops the run; the rest of the cluster is a warning. Which nodes are of the
# rack, and what stops or warns: the tables of the cassandra_start_rack filter
# (plugins/filter/cassandra_start_rack.py).
# Asks nothing; re-running is safe.
#
# Down longer than the hint window: repair the rack's nodes afterwards.
#
# Options and defaults: ansible-playbook community.cassandra.help -e help_topic=start_rack
- name: Check the cluster's group
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
  tasks:
    - name: Check the cluster's group
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: hosts_check.yml
      tags: [always]  # its variables check under --tags too

- name: Find the rack's nodes
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Check each node has its own facts
      ansible.builtin.assert:
        that: _shared | length == 0
        fail_msg: >-
          ansible-core {{ ansible_version.full }} gave {{ _shared | join(', ') }} the facts of another node
          (ansible/ansible#87148): a run_once task ran on them earlier in this run, before they had facts of their own
          (in a play before this playbook?). Run this playbook on its own, or gather facts first in that play.
          Nothing was changed.
        quiet: true
      run_once: true
      tags: [always]
      vars:
        cassandra_output: true  # its message as is (the ops callback)
        _shared: >-
          {%- set out = [] -%}
          {%- for h in groups['all'] -%}  {#- the ones out of the play too: they may share them with these -#}
          {%-   if hostvars[h].ansible_facts._cassandra_own_facts | default(h) != h -%}{%- set _ = out.append(h) -%}{%- endif -%}
          {%- endfor -%}
          {{ out }}

    # also run by the first play, which --limit skips
    - name: No unknown variable
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: variables_check.yml
      tags: [always]  # under --tags too

    # the run's first line, here when --limit left the first play (localhost) out
    - name: Say which cluster the run is on
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: cluster_banner.yml
      tags: [always]  # under --tags too

    - name: Load the cassandra_config defaults (dc and rack)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: defaults.yml
        public: true

    - name: Group the rack's nodes
      ansible.builtin.group_by:
        key: cassandra_target_rack_nodes
      when:
        - cassandra_dc == cassandra_target_dc
        - cassandra_rack == cassandra_target_rack
      changed_when: false

    - name: The rack has nodes
      ansible.builtin.assert:
        that: groups['cassandra_target_rack_nodes'] | default([]) | length > 0
        fail_msg: "No node declares cassandra_dc={{ cassandra_target_dc | default('(not set)') }} and cassandra_rack={{ cassandra_target_rack | default('(not set)') }}"
        quiet: true
      run_once: true

    # before the unit is written: an inventory not loaded has the role defaults.
    # The cluster name is first checked on a node of another rack; when none
    # answers (or the rack is the whole cluster) and cassandra_cluster_name is the
    # role default 'Test Cluster', the run stops (-e cassandra_accept_default_identity=true
    # goes on).
    - name: Check the running nodes belong to this cluster
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: cluster_name.yml
      vars:
        cassandra_service_cluster_candidates: >-
          {{ query('community.cassandra.cassandra_nodes') | reject('in', groups['cassandra_target_rack_nodes']) | list }}
        cassandra_service_cluster_required: true  # the rack is the whole cluster: nothing to read it from

- name: Start the rack
  hosts: "{{ lookup('community.cassandra.cassandra_hosts') }}:&cassandra_target_rack_nodes"
  gather_facts: true
  gather_subset: [network]
  become: true
  any_errors_fatal: true
  vars:
    # the run's own command again (its inventory, cluster, --limit), for the way out of a stop; the same as
    # _cassandra_start_rack_again of the play "Check the cluster" (a play's vars are its own)
    _cassandra_start_rack_again: >-
      {{ 'start_rack' | community.cassandra.cassandra_command(
           extra={'cassandra_target_dc': cassandra_target_dc, 'cassandra_target_rack': cassandra_target_rack},
           limit=ansible_limit | default(''), **_cassandra_run_command_args) }}
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Check the run has root on the nodes
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: root_check.yml

    # the run's command (its inventory and cluster: _cassandra_run_command_args), for the way outs said
    - name: Load the cassandra_operation defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: defaults.yml
        public: true

    - name: Find the running Cassandra
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: jvm_started.yml

    # the start below is decided by the unit: a JVM outside it, or a unit being stopped, is still started
    - name: Read the cassandra unit state
      ansible.builtin.systemd_service:
        name: cassandra
      register: _cassandra_start_rack_unit
      changed_when: false
      failed_when: false  # (a unit systemd cannot load, no systemctl: not read, the node's package checked)
      check_mode: false  # a read

    # a Cassandra package left half done (an interrupted rpm or dpkg run): refused before any node is started (its
    # start would run Cassandra on those files); a node is not checked only when its unit is active and a Cassandra
    # JVM runs (the start below leaves it as it is, whatever the unit's main process: cassandra_service)
    - name: Refuse to start a node whose Cassandra package is left half done
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: package_unfinished.yml
      vars:
        _cassandra_package_unfinished_hosts: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts -%}
          {%-   set pid = (hostvars[h].cassandra_jvm | default({})).pid | default('') | string -%}
          {%-   set unit = (hostvars[h]._cassandra_start_rack_unit | default({})).status | default({}) -%}
          {%-   if not (pid and unit.ActiveState | default('') == 'active') -%}
          {%-     set _ = out.append(h) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}
        _cassandra_package_unfinished_run: start_rack
        _cassandra_package_unfinished_what: start

    # a node that does not start (its unit fails, it stops while it joins, it is not NORMAL in time): its stop
    # said with what the role saw (its journal) and a way out, not the failure of the role's task (the other
    # nodes stop too: any_errors_fatal)
    - name: Start Cassandra and wait until the node has joined
      vars:
        cassandra_output_rescued: true  # the rescue says what failed (ops callback)
      block:
        - name: Start Cassandra and wait until the node has joined
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
          vars:
            cassandra_service_state: started
      rescue:
        - name: Stop on a node of the rack that did not start
          ansible.builtin.fail:
            msg: >-
              {{ ansible_failed_result | community.cassandra.cassandra_rack_start_failed(
                   ansible_failed_task.name | default(''), inventory_hostname, cassandra_target_rack,
                   _cassandra_start_rack_again) }}
          vars:
            cassandra_output: true  # a verdict: its msg as is (ops callback)

# Run a repair of the rack's nodes afterwards if they were down longer than
# cassandra_max_hint_window (3 hours by default; cassandra_max_hint_window_in_ms
# on 4.0): hints stop being kept after that.
- name: Check the cluster
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false  # after the ssh probe below: a host outside the rack not reached does not fail the run
  become: true
  vars:
    # the node the check runs on: the first of the rack (else of the play)
    _cassandra_start_rack_checker: >-
      {{ (ansible_play_hosts | select('in', _cassandra_start_rack_members) | list + ansible_play_hosts) | first }}
    # the hosts of the cluster not reached over ssh by the probe (outside the rack: out of the play)
    _cassandra_start_rack_unreached: >-
      {%- set out = [] -%}
      {%- for h in ansible_play_hosts_all -%}
      {%-   if (hostvars[h]._cassandra_start_rack_ssh | default({})).unreachable | default(false) -%}
      {%-     set _ = out.append(h) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
    # the hosts of the cluster out of the play (--limit): not probed, not read from
    _cassandra_start_rack_not_probed: "{{ query('community.cassandra.cassandra_nodes') | reject('in', ansible_play_hosts_all) | list }}"
    # the rack's nodes left out by --limit (out of the play): this run does not start them; not UN, they are not
    # waited for, said in a warning once the others are UN (the run's success: its own nodes UN)
    _cassandra_start_rack_left_out: "{{ _cassandra_start_rack_members | reject('in', ansible_play_hosts_all) | list }}"
    # what a read is judged with (cassandra_rack_verdict): the rack, the two nodes read from, what they read
    _cassandra_start_rack_filter_args:
      members: "{{ _cassandra_start_rack_members }}"
      dc: "{{ cassandra_target_dc }}"
      rack: "{{ cassandra_target_rack }}"
      checker: "{{ inventory_hostname }}"
      peer: "{{ _cassandra_health_peer_host }}"  # (its host name)
      # every host's (one host's ansible_host never takes another one's ring address), the rack's kept by the filter
      addresses: "{{ query('community.cassandra.cassandra_nodes') | community.cassandra.cassandra_host_addresses(hostvars) }}"
      reads: "{{ [cassandra_health_self | default({}), cassandra_health_peer | default({})] }}"  # (the rings read)
      schema: "{{ cassandra_health_schema | default({}) }}"
      left_out: "{{ _cassandra_start_rack_left_out }}"
      unreached: "{{ _cassandra_start_rack_unreached }}"
      # each node of the run's nodetool info, by name (its Host ID: the node placed in the ring by it); read again
      # after the wait when a Host ID was not read
      infos: >-
        {%- set out = {} -%}
        {%- for h in _cassandra_start_rack_members -%}
        {%-   set r = hostvars[h]._cassandra_start_rack_info_again | default({'skipped': true}) -%}
        {%-   set r = hostvars[h]._cassandra_start_rack_info | default({}) if r.skipped | default(false) else r -%}
        {%-   set _ = out.update({h: {'rc': r.rc | default(none), 'stdout': r.stdout | default(''),
                                      'stderr': r.stderr | default(''), 'msg': r.msg | default('')}}) -%}
        {%- endfor -%}
        {{ out }}
    # the run's own command again (its inventory, cluster, --limit), for the way out of a stop; the same as
    # _cassandra_start_rack_again of the play "Start the rack"
    _cassandra_start_rack_again: >-
      {{ 'start_rack' | community.cassandra.cassandra_command(
           extra={'cassandra_target_dc': cassandra_target_dc, 'cassandra_target_rack': cassandra_target_rack},
           limit=ansible_limit | default(''), **_cassandra_run_command_args) }}
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    # the run's command (its inventory and cluster: _cassandra_run_command_args), for the way outs said
    - name: Load the cassandra_operation defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: defaults.yml
        public: true

    # every node of the cluster the inventory puts in the rack, under --limit too: a node of the rack this run
    # did not start is still checked as one of the rack
    - name: Find the rack's nodes in the inventory
      ansible.builtin.set_fact:
        _cassandra_start_rack_members: >-
          {{ (query('community.cassandra.cassandra_nodes')
              | community.cassandra.cassandra_rack_members(hostvars, cassandra_target_dc, cassandra_target_rack)
              + groups['cassandra_target_rack_nodes'] | default([])) | unique }}
      run_once: true

    - name: Say the cluster is not checked (--check)
      ansible.builtin.debug:
        msg: "--check: nothing was started, the cluster is not checked (the health_check playbook checks it)."
      run_once: true
      when: ansible_check_mode
      vars:
        cassandra_output: true

    # a host not reached is not an error here: ignored, the exit code stays 0 (under --check too: ping changes
    # nothing); without root, whatever the inventory's ansible_become (only ssh is probed: a host whose sudo fails
    # is still reached)
    - name: Reach each node over ssh
      ansible.builtin.ping:
      register: _cassandra_start_rack_ssh
      become: false
      ignore_unreachable: true
      vars:
        ansible_become: false  # an inventory ansible_become beats the become keyword

    - name: Stop when a node of the rack is not reached over ssh
      ansible.builtin.fail:
        msg: >-
          {{ [inventory_hostname ~ ' (rack ' ~ cassandra_target_rack ~ ') is not reached over ssh', 'all of the error:',
              '  ' ~ _ping, 'WAY OUT  reach it, then run start_rack again:', '  ' ~ _cassandra_start_rack_again]
             | community.cassandra.cassandra_fit }}
      any_errors_fatal: true  # the rack is not checked without it
      when:
        - _cassandra_start_rack_ssh.unreachable | default(false)
        - inventory_hostname in _cassandra_start_rack_members
      vars:
        cassandra_output: true
        _args: "{{ _cassandra_run_command_args }}"
        _ping: "{{ inventory_hostname | community.cassandra.cassandra_ping_command(_args.inventory, _args.default_inventory, _args.cwd) }}"

    # said in the warning below; nothing more is asked of it
    - name: Leave out a node outside the rack not reached over ssh
      ansible.builtin.meta: end_host
      when: _cassandra_start_rack_ssh.unreachable | default(false)

    - name: Gather the network facts
      ansible.builtin.setup:
        gather_subset: [network]
      become: false  # (no root needed)
      vars:
        ansible_become: false  # an inventory ansible_become beats the become keyword

    # what each node of the run says of itself: the check places it in the ring by its Host ID, whatever its
    # address (its Host ID not read: a stop, after the wait below)
    - name: Read the Host ID of each node of the run
      ansible.builtin.command: "{{ _cassandra_service_nodetool }} info"
      register: _cassandra_start_rack_info
      changed_when: false
      failed_when: false
      no_log: "{{ cassandra_jmx_password | length > 0 }}"
      when:
        - inventory_hostname in _cassandra_start_rack_members
        - not ansible_check_mode

    # from a node of the rack (just started: up), read once; its second view from a node outside the rack when
    # there is one (up for long: its view of the others settled), reached over ssh by the probe, else from another
    # node of the rack in the run (its view waited for, as the first one's: it may have just started)
    - name: Read the cluster once from a node of the rack
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: cluster_health.yml
      vars:
        cassandra_service_health_report_only: true  # cassandra_health_findings only
        _cassandra_health_no_wait: true
        _cassandra_health_prefer_peers: >-
          {{ query('community.cassandra.cassandra_nodes') | reject('in', _cassandra_start_rack_members) | list }}
        _cassandra_health_not_peers: "{{ (_cassandra_start_rack_unreached + _cassandra_start_rack_not_probed) | join(',') }}"
      when:
        - inventory_hostname == _cassandra_start_rack_checker
        - not ansible_check_mode  # the rack was not started

    # what it found, judged: the nodes outside the rack not UN for the node outside the rack read from, or not
    # reached over ssh (not waited for, below), the rest (waited for), why a node is judged of the rack, the nodes
    # read from (kept: the read below reads from others) (cassandra_rack_verdict)
    - name: Judge the first read
      ansible.builtin.set_fact:
        _cassandra_start_rack_first_verdict: >-
          {{ cassandra_health_findings | community.cassandra.cassandra_rack_verdict(**_cassandra_start_rack_filter_args) }}
      when:
        - inventory_hostname == _cassandra_start_rack_checker
        - not ansible_check_mode

    # the rack's nodes waited for until UN; the first verdict's nodes outside the rack not judged, in any state; read
    # again from another node of the rack when there is one, else from a node outside it; not from a node seen
    # down, in the first verdict, not reached or not probed, nor one whose nodetool failed
    - name: Check the rack's nodes and the rest of the cluster
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: cluster_health.yml
      vars:
        cassandra_service_health_report_only: true  # (judged below)
        cassandra_service_health_any_ok: >-
          {{ (_cassandra_start_rack_first_verdict.outside + _cassandra_start_rack_first_verdict.left_out)
             | map(attribute='address') | list }}
        _cassandra_health_prefer_peers: "{{ _cassandra_start_rack_members }}"
        _cassandra_health_not_peers: >-
          {{ (_cassandra_start_rack_first_verdict.not_readers + _cassandra_start_rack_unreached + _cassandra_start_rack_not_probed)
             | unique | join(',') }}
      when:
        - inventory_hostname == _cassandra_start_rack_checker
        - not ansible_check_mode
        - cassandra_health_problems | length > 0

    # a node of the run whose Host ID the first verdict has not (nodetool info failing: its JVM down, waited for
    # above while the ring sees it down): read again on each node of the run, the last verdict judged with it
    - name: Read the Host ID again of the nodes of the run
      ansible.builtin.command: "{{ _cassandra_service_nodetool }} info"
      register: _cassandra_start_rack_info_again
      changed_when: false
      failed_when: false
      no_log: "{{ cassandra_jmx_password | length > 0 }}"
      when:
        - inventory_hostname in _cassandra_start_rack_members
        - not ansible_check_mode
        - _first.host_id_unread | default([]) | length > 0
      vars:
        _first: "{{ hostvars[_cassandra_start_rack_checker]._cassandra_start_rack_first_verdict | default({}) }}"

    # the last read (the first one when it found nothing), judged with the first verdict
    - name: Judge the last read
      ansible.builtin.set_fact:
        _cassandra_start_rack_last_verdict: >-
          {{ cassandra_health_findings | community.cassandra.cassandra_rack_verdict(
               first_verdict=_cassandra_start_rack_first_verdict, **_cassandra_start_rack_filter_args) }}
      when:
        - inventory_hostname == _cassandra_start_rack_checker
        - not ansible_check_mode

    # the stop of any cluster check on what the verdict keeps: each problem, the wait, why, the way out
    - name: Stop on the rack's nodes not UN
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: cluster_health.yml
      vars:
        _cassandra_health_stop_on: "{{ _cassandra_start_rack_last_verdict.problems }}"
        _cassandra_health_again: "run start_rack\u00a0again:"  # (a no-break space: "again" never alone on a line)
        _cassandra_health_again_command: "{{ _cassandra_start_rack_again }}"
      when:
        - inventory_hostname == _cassandra_start_rack_checker
        - not ansible_check_mode
        - _cassandra_start_rack_last_verdict.problems | length > 0

    # the rack's nodes UN (its success, said always: under --limit, the nodes of this run), then the warnings: the
    # rack's nodes left out by --limit not UN (the way out per state), the rest of the cluster's problems
    - name: Say the rack's nodes are UN, and the nodes outside the run not UN or not reached
      ansible.builtin.debug:
        msg: >-
          {{ _cassandra_start_rack_last_verdict | community.cassandra.cassandra_rack_outside_lines(
               _cassandra_start_rack_unreached, cassandra_target_dc, cassandra_target_rack, _check_command,
               run=_run, left_out=_cassandra_start_rack_left_out, start_command=_start_command) }}
      when:
        - inventory_hostname == _cassandra_start_rack_checker
        - not ansible_check_mode
        - _verdict.problems | length == 0
          or (_verdict.outside + _verdict.failed + _verdict.warnings + _verdict.ring_size + _verdict.left_out
              + _cassandra_start_rack_unreached) | length > 0
      vars:
        cassandra_output: true
        _verdict: "{{ _cassandra_start_rack_last_verdict }}"
        _run: "{{ _cassandra_start_rack_members | reject('in', _cassandra_start_rack_left_out) | list }}"
        _check_command: "{{ 'health_check' | community.cassandra.cassandra_command(**_cassandra_run_command_args) }}"
        _start_command: >-
          {{ 'start_rack' | community.cassandra.cassandra_command(
               extra={'cassandra_target_dc': cassandra_target_dc, 'cassandra_target_rack': cassandra_target_rack},
               **_cassandra_run_command_args) }}
