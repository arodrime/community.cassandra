minor_changes:
  - New topology playbook - the inventory is the desired state. It adds the hosts of the cluster's group that are not in the ring (as add_node does) and decommissions the hosts marked ``cassandra_node_state=absent`` that are still in it (as decommission_node does), one node at a time, adds first, after one screen and one question; ``--check`` shows the plan. Ring nodes the inventory does not know are reported, never touched; a plan removing more than half of a datacenter is refused.
  - New variable ``cassandra_node_state`` (``present`` or ``absent``) - every operation playbook leaves the hosts marked absent out (preflight, health checks and their node counts, rolling operations, status, import_cluster).
  - New lookup community.cassandra.cassandra_nodes - the hosts of the cluster's group without those marked absent.
