minor_changes:
  - "apply_config playbook - under ``--check`` the plan is said once, at the end: the verdict (the restarts first: ``CHECK  apply_config  prod  1 would restart, 2 up to date``), ``nothing was changed (--check)``, ``DIFFERENCES FOUND`` (each node's value against the inventory's: what was observed), ``WOULD DO`` (each node's outcome in a real run), then the warnings; no plan screen before it. The differences come in one table (``Item``, ``Node``, ``Inventory``, ``Nodes``; each row labelled by what it is: a file, a setting, ``service chronyd``, ``package chrony``) with the node's value and the inventory's in aligned columns and fixed words (``absent``, ``present``, ``**** (another)``) instead of ``a -> b``; a file's nodes once on its row when all its settings change on the same nodes; the read-ahead in KB everywhere (LVM's sectors converted); a row too wide has its nodes on the next line, a value is never cut. A nodes' outcome list is aligned, ``up to date`` everywhere for a node with nothing to apply, and the real run's plan says its order in one line. A node restarted or started says, in the plan and under ``--check``, what a real run does to it in its order (``would drain and stop Cassandra, start chronyd, wait up to 2m for clock sync, start Cassandra``, ``would write the config, drain and restart Cassandra``), no longer ``would apply, then restart (time sync)``."
