---
# One node of the upgrade: drain and stop, the target series' repository and
# package, its config, start, wait until joined, check the version it runs.
- name: Drain the node
  community.cassandra.cassandra_drain:
  module_defaults:
    community.cassandra.cassandra_drain: "{{ _cassandra_service_jmx }}"
  register: cassandra_service_drain
  # best effort: nodetool failing (rc) or the timeout, the node is flushed instead, then stopped all the same,
  # never left drained and running
  failed_when: false
  ignore_errors: true  # the timeout below
  timeout: "{{ cassandra_service_drain_timeout | int }}"

# no answer at all (JMX not reached, its login refused): nothing drained, the node is left as it is
- name: Stop when the node did not answer
  ansible.builtin.fail:
    msg: "{{ cassandra_service_drain.msg }}"
  when:
    - cassandra_service_drain is not skipped
    - not cassandra_service_drain.changed | default(false)
    - cassandra_service_drain.rc is not defined
    # a timeout (maybe drained in part): timedout from ansible-core 2.18, its message before
    - cassandra_service_drain.timedout is not defined
    - cassandra_service_drain.msg | default('') is not search('expected time frame|Timed out after')

- name: Say the drain did not work
  ansible.builtin.debug:
    msg: >-
      WARNING - {{ inventory_hostname }} was not drained ({{ cassandra_service_drain.error | default('', true)
      or ('rc ' ~ cassandra_service_drain.rc if cassandra_service_drain.rc is defined else cassandra_service_drain.msg) }}):
      flushed, then stopped all the same.
  when:
    - cassandra_service_drain is not skipped
    - not cassandra_service_drain.changed | default(false)
  vars:
    cassandra_output: true

# the new version replays as little of the old one's commitlog as it can (best effort: a node drained in part
# may not flush, its start replays the commitlog)
- name: Flush the node instead
  community.cassandra.cassandra_flush:
  module_defaults:
    community.cassandra.cassandra_flush: "{{ _cassandra_service_jmx }}"
  failed_when: false
  ignore_errors: true  # the timeout below
  timeout: "{{ cassandra_service_drain_timeout | int }}"
  when: cassandra_service_drain is not skipped and not cassandra_service_drain.changed | default(false)

- name: Stop Cassandra
  ansible.builtin.systemd_service:
    name: cassandra
    state: stopped

- name: Add the target series' repository
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_repository

- name: Install the target version
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_install
  vars:
    _cassandra_install_upgrade: true

- name: Write the target series' config
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_config
  vars:
    cassandra_config_confirm: false  # previewed by the preflight phase, confirmed by the prepare phase
    _cassandra_config_no_question: true  # whatever -e cassandra_config_confirm says
    _cassandra_config_no_restart_warning: true

- name: Start it and wait until it has joined
  ansible.builtin.include_tasks: main.yml
  vars:
    _cassandra_change_report_quiet: "{{ ansible_verbosity | int == 0 }}"  # the recap says it (-v shows it)
    cassandra_service_state: started

# --check upgrades nothing: no new version to find
- name: Read the version it runs
  ansible.builtin.command: "{{ _cassandra_service_nodetool }} version"
  register: cassandra_upgrade_version
  changed_when: false
  when: not ansible_check_mode

- name: Check it runs the target version
  ansible.builtin.assert:
    that: >-
      cassandra_upgrade_version.stdout is search('ReleaseVersion: ' ~ cassandra_package_version | regex_escape ~ '$', multiline=True)
    fail_msg: "{{ inventory_hostname }} runs {{ cassandra_upgrade_version.stdout | default('') | trim }}, not {{ cassandra_package_version }}"
    quiet: true
  when: not ansible_check_mode
