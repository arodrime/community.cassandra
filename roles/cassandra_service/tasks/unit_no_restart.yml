---
# The unit rewritten under a running Cassandra with a change that JVM does not need (replace_node taking out the
# replace flag, read at the first boot only): the record of the config it started with (config_snapshot.yml) gets
# the new unit, so that no restart is said pending for it (apply_config). Only when the record has that JVM and the
# unit as it was before the rewrite (_cassandra_service_unit_before: its sha1): then that change is the only one.
- name: Record the rewritten unit as the running Cassandra's (no restart needed for it)
  ansible.builtin.include_tasks: config_record_update.yml
  vars:
    _cassandra_service_record_request:
      before: {/etc/systemd/system/cassandra.service: "{{ _cassandra_service_unit_before }}"}
      files: {/etc/systemd/system/cassandra.service: null}
