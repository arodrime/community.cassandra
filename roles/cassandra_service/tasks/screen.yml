---
# The screen of an operation playbook, then its confirmation, once per run:
#   include_role: name=community.cassandra.cassandra_service tasks_from=screen.yml
#   vars: cassandra_screen: {operation, summary, intro, blocks, after, warnings} (filter cassandra_screen)
#         cassandra_screen_question: "Remove node7?"
#         cassandra_screen_session_warning: true adds the warning of a run not inside tmux or screen
#         (long operations: a lost SSH session stops the run)
# The screen is printed in every mode (also in the logs, and before a run
# without a terminal stops); then, on a real run with cassandra_operation_confirm
# true, the question is asked below it. --check (nothing changes) and
# cassandra_operation_confirm false ask nothing.
# No question (empty): printed only (the caller asks its own way), and the
# screen does not say that cassandra_operation_confirm false skips one.
# The cluster's name and running versions come from preflight unless given.
# _cassandra_screen_asked_by (topology, running add_node and decommission_node
# as its steps): the caller showed the whole plan and asked once; only the
# step's own tables (the tokens of the new nodes) and token warnings are
# printed, no question.
- name: Show the plan, then ask
  vars:
    _cassandra_screen_defaults:
      cluster: "{{ (_cassandra_preflight | default({})).cassandra_cluster_name | default('') }}"
      version: >-
        {{ ((cassandra_preflight_describe | default({})).stdout | default('') ~ '\n').split('Database versions:')[1:]
           | first | default('') | regex_findall('(?m)^\s+([0-9][^:]*): \[') | join(', ') }}
    _cassandra_screen_text: >-
      {{ _cassandra_screen_defaults | combine(cassandra_screen)
         | community.cassandra.cassandra_screen(check=ansible_check_mode,
                                                 asks=cassandra_operation_confirm | bool or not cassandra_screen_question | default(''),
                                                 session=_cassandra_session_warning if cassandra_screen_session_warning | default(false) | bool
                                                         and not _cassandra_screen_asked_by | default('') else '',
                                                 asked_by=_cassandra_screen_asked_by | default('')) }}
  block:
    - name: Show the plan
      ansible.builtin.debug:
        msg: "{{ _cassandra_screen_text }}"
      run_once: true
      when: not _cassandra_screen_asked_by | default('')
      vars:
        cassandra_output: true

    # a step of topology: its plan showed the rest
    - name: Show the step's own tables
      ansible.builtin.debug:
        msg: "{{ _step | join(_nl) }}"
      run_once: true
      when:
        - _cassandra_screen_asked_by | default('') | length > 0
        - _step | length > 0
      vars:
        cassandra_output: true
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _step: >-
          {%- set l = [] -%}
          {%- for i in cassandra_screen.intro | default([]) if i is mapping -%}{%- set _ = l.extend(i.pre | default([])) -%}{%- endfor -%}
          {%- for w in cassandra_screen.warnings | default([]) if w.label | default('') == 'tokens' -%}
          {%-   for t in w.each | default([w.text | default('')]) if t -%}{%- set _ = l.append('WARNING  tokens: ' ~ t) -%}{%- endfor -%}
          {%- endfor -%}
          {{ l }}

    - name: Ask for confirmation
      ansible.builtin.include_tasks: confirm.yml
      when:
        - cassandra_screen_question | default('') | length > 0
        - not _cassandra_screen_asked_by | default('')
      vars:
        cassandra_confirm_prompt: "{{ cassandra_screen_question }}"
