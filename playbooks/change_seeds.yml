---
# Applies a new cassandra_seeds list to every node of a cluster, live (no
# restart): only the seeds line of cassandra.yaml changes. Other differences
# between the inventory and the nodes' config are shown, not applied.
#   ansible-playbook -i inventory community.cassandra.change_seeds
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo): the playbook asks for it itself, no -b needed.
# The preflight check refuses seeds that are not up members of the cluster.
# A list that leaves a datacenter with no seed (none of its nodes in it): seeds
# of its own are added there (2 or 3 of its nodes up, on different racks; the
# ones it runs with first), shown with a WARNING and covered by the question;
# applied live only, the end says the cassandra_seeds line to put in the
# inventory. None of its nodes up, or an empty list: refused, nothing changed.
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Update the seed list
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  vars:
    _new: "{{ _cassandra_change_seeds.new }}"  # as the template writes it
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Load the cassandra_config defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: defaults.yml
        public: true

    - name: Load the cassandra_service defaults (JMX access)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    # cassandra_seeds, with seeds of its own for a datacenter it leaves with none (filter cassandra_seed_change,
    # as topology and decommission_node)
    - name: Work out the seed list
      ansible.builtin.set_fact:
        _cassandra_change_seeds: "{{ _hosts | community.cassandra.cassandra_seed_change(cassandra_seeds) }}"
      run_once: true
      vars:
        _hosts: >-
          {%- set l = [] -%}
          {%- for h in ansible_play_hosts_all -%}
          {%-   set p = hostvars[h]._cassandra_preflight | default({}) -%}
          {%-   set _ = l.append({'name': h, 'dc': p.cassandra_dc | default(''), 'rack': p.cassandra_rack | default(''),
                                  'names': hostvars[h]._cassandra_service_names | default([h]), 'live': p.live_seeds | default(''),
                                  'address': p.address | default(''), 'up': p.ring_address | default('') in _un}) -%}
          {%- endfor -%}
          {{ l }}
        # up and normal in the ring: a seed it may get
        _un: >-
          {%- set out = [] -%}
          {%- for dc, info in ((cassandra_preflight_status | default({})).cluster_status | default({}, true)).items() -%}
          {%-   set _ = out.extend(info.nodes | default([]) | selectattr('status', 'equalto', 'U')
                                   | selectattr('state', 'equalto', 'N') | map(attribute='address') | list) -%}
          {%- endfor -%}
          {{ out }}

    - name: Refuse a seed list that can't be applied
      ansible.builtin.assert:
        that: _cassandra_change_seeds.problems | length == 0
        fail_msg: >-
          {{ (['REFUSED  change_seeds  ' ~ _cluster ~ '  nothing was changed']
              + _cassandra_change_seeds.problems | map('regex_replace', '^', '  ') | list) | join(_nl) }}
        quiet: true
      run_once: true
      vars:
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        cassandra_output: true
        _cluster: "{{ (_cassandra_preflight | default({})).cassandra_cluster_name | default(lookup('community.cassandra.cassandra_hosts'), true) }}"

    - name: Show the new seed list and confirm
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: screen.yml
      vars:
        _changed: >-
          {{ ansible_play_hosts | map('extract', hostvars) | rejectattr('_cassandra_preflight.live_seeds', 'equalto', _new)
             | map(attribute='inventory_hostname') | list }}
        _blocks: >-
          {%- set l = [] -%}
          {%- for h in _changed -%}
          {%-   set _ = l.append({'title': h | community.cassandra.cassandra_screen_title(hostvars[h]._cassandra_preflight | default({})), 'lines': ['from: ' ~ hostvars[h]._cassandra_preflight.live_seeds, 'to:   ' ~ _new]}) -%}
          {%- endfor -%}
          {{ l }}
        cassandra_screen_question: "Write and reload the new seed list on {{ _changed | join(', ') }}?"
        cassandra_screen:
          operation: change_seeds
          summary: the seed list in cassandra.yaml, reloaded live (no restart)
          intro: >-
            {%- set l = [] -%}
            {%- for a in _cassandra_change_seeds.auto -%}
            {%-   set _ = l.append('Change seeds: ' ~ a.dc ~ ' gets ' ~ a.labels | join(', ') ~ ', not in cassandra_seeds.') -%}
            {%- endfor -%}
            {{ l }}
          blocks: "{{ _blocks }}"
          warnings: [{label: seeds, each: "{{ _cassandra_change_seeds.warnings }}"}]
      when: _changed | length > 0

    # the same seeds already live (an earlier run picked them): said, nothing to confirm
    - name: Say the seeds kept for a datacenter
      ansible.builtin.debug:
        msg: "{{ _cassandra_change_seeds.warnings | map('regex_replace', '^', 'WARNING - ') | join(_nl) }}"
      run_once: true
      when: _changed | length == 0 and _cassandra_change_seeds.warnings | length > 0
      vars:
        _nl: "\n"
        cassandra_output: true
        _changed: >-
          {{ ansible_play_hosts | map('extract', hostvars) | rejectattr('_cassandra_preflight.live_seeds', 'equalto', _new)
             | map(attribute='inventory_hostname') | list }}

    - name: Apply the new seed list
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: seeds_apply.yml
      vars:
        cassandra_seeds: "{{ _new }}"
        _cassandra_seeds_reload_required: true  # the reload is this playbook's job: every running node, a failure fails

    # Nothing is written here: cassandra_config shows its diffs
    - name: Look for other config differences
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        apply:
          check_mode: true
      vars:
        cassandra_config_confirm: false
        _cassandra_config_no_question: true  # a preview, whatever -e cassandra_config_confirm says
        cassandra_config_reload_seeds: false
        cassandra_seeds: "{{ _new }}"  # the seeds just applied

    - name: Say how to apply the other differences
      ansible.builtin.debug:
        msg: >-
          WARNING - the config of {{ _drift | community.cassandra.cassandra_node_list }} differs from the inventory beyond the seeds
          (apply_config --check shows it), not applied by change_seeds. Apply it with the cassandra_config role, e.g.
          {{ 'create_cluster' | community.cassandra.cassandra_command(
               inventory=ansible_inventory_sources,
               default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
               hosts=cassandra_hosts | default(''), cwd=lookup('ansible.builtin.env', 'PWD')) }}
          (it starts nothing on a running cluster),
          then restart the nodes with community.cassandra.rolling_restart.
      vars:
        cassandra_output: true
        _drift: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('_cassandra_config_changes', 'defined')
             | rejectattr('_cassandra_config_changes', 'equalto', []) | map(attribute='inventory_hostname') | list }}
      when: _drift | length > 0
      run_once: true

    - name: Say what is left to do
      ansible.builtin.debug:
        msg: "{{ [_cassandra_change_seeds | community.cassandra.cassandra_seeds_todo(lookup('community.cassandra.cassandra_hosts'))] | community.cassandra.cassandra_todo | join(_nl) }}"
      run_once: true
      when:
        - _cassandra_change_seeds.auto | length > 0
        - not ansible_check_mode
      vars:
        _nl: "\n"
        cassandra_output: true
        cassandra_output_gap: true  # a block of its own (ops callback)
