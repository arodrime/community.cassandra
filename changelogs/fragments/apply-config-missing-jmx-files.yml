bugfixes:
  - "apply_config - a JMX users' file (``cassandra_jmx_users``) deleted, or with users or rights other than the inventory's (not a new password of the user nodetool logs in with: the checks log in with it first), was not seen (\"nothing to apply\") and stayed missing, refusing every authenticated JMX login (password file) or the next start (access file). It is now shown in the plan and under --check (``file: absent``, its content never shown) and written back. The password file is written first, once the run is confirmed, and needs no restart (read at each login; no longer a \"restart pending\" file either; under --check a node without it is checked from the others). The access file is read at start: written back or changed, the node is restarted (not with ``cassandra_local_jmx``)."
  - "cassandra_config, apply_config - a file kept by hand (``cassandra_config_keep_files``) deleted on a node already initialized is written back from the template with a warning (in the plan and recap of ``apply_config``): its hand edits are lost, restore the copy first to keep them."
  - "preflight - the cluster is read from a running node whose JMX password file is there; a JMX login refused on a node whose password file is missing says so."
