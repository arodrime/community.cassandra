minor_changes:
  - "import_cluster playbook - a failed self-check ends the run with a short block instead of one long line (``SELF-CHECK FAILED  <cluster group>  the inventory would change N settings on M nodes``): one line per setting or file with its nodes, grouped by what makes it pass (hand edits, a file of yours that wins over the import, other differences, nodes not read), then ``HOW TO MAKE IT PASS`` with the option or the value to set for each, and where the details are; report.txt (report.check.txt) has the same in a ``SELF-CHECK`` section, each node's differences under each line. Under the ``community.cassandra.ops`` callback, red on its verdict line only; plain lines under the default callback (``callback_result_format = yaml``, and before the result from ansible-core 2.19 on). Secrets are never shown."
