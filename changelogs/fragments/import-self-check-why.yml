minor_changes:
  - "import_cluster playbook - a failed self-check says why the inventory does not reproduce the nodes yet (``SELF-CHECK FAILED — the inventory does not reproduce 4 nodes yet``), then each kind of difference by what the import establishes of its cause (settings no inventory variable sets, a file of yours that gives another value, parts of the nodes outside the config files, the same settings in another layout, others) with what ``apply_config`` would do. Under each, the files and their nodes once, each setting in its file's own words (a YAML key, a JVM option or a ``cassandra-env.sh`` variable by its name, logback's elements as ``AUDIT / rollingPolicy / fileNamePattern``, an owner or a mode) with the node's value and Ansible's on aligned ``Node`` and ``Ansible`` lines (``absent``, ``present``, ``(empty)``), then ``To pass:`` with the option of each way out (after ``-e import_strict=false``, the ``apply_config --check --diff`` command that reviews the change before applying it). report.txt has the same under ``TO DO``, its ``HAND EDITS`` each file and its nodes once with the ways to keep, carry or drop them; report.details.txt has each difference as the self-check found it (full XPaths, both values as written) in a ``SELF-CHECK`` section. The self-check compares logback.xml element by element and cassandra-env.sh line by line. The shareable copy keeps these settings' keys, tags and attribute names as they are (a node's or a cluster's name in them replaced) and masks what the site named (a JMX user, an XML element's ``name`` or ``ref``: a logger's package, an appender); a JVM option's name is kept everywhere when it starts with ``-XX:``, ``-Dcassandra.``, ``-Djava.``, ``-Djdk.``, ``-Dcom.sun.``, ``-Dlog4j2.``, ``-Dchronicle.`` or ``-Dio.netty.``, masked otherwise (a site's own ``-D`` option)."
