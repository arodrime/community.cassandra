minor_changes:
  - "playbooks - every playbook stops before changing anything when a ``-e`` variable is named like one of the collection's (``cassandra_``, ``import_cluster_``, ``help_``, in any case) but none of its roles or playbooks uses that name (a typo such as ``import_cluster_keep_hand_edit`` was silently ignored), naming the known variable it is close to. A command line that passes a removed variable now stops too. ``-e cassandra_allow_unknown_variables=<name>,<name>`` lets variables of your own through (``true``: every name). The variables set in the inventory are not checked this way (``preflight`` warns about them)."
