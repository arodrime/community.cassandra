---
_cassandra_firewall_service: "{{ (ansible_facts['os_family'] == 'RedHat') | ternary('firewalld', 'ufw') }}"
# cassandra_firewall_port_sources, and the Prometheus exporter's port open to its sources
_cassandra_firewall_port_sources: >-
  {{ cassandra_firewall_port_sources
     | combine({(cassandra_prometheus_exporter_port | default(9404) | string) ~ '/tcp': cassandra_prometheus_exporter_sources}
               if cassandra_prometheus_exporter_enabled | default(false) | bool and cassandra_prometheus_exporter_sources | length > 0
               else {}) }}

# --check, or apply_config's compare (check_mode applied to the role, which ansible_check_mode does not tell:
# _cassandra_compare): the role's tasks act as under --check
_cassandra_firewall_check: "{{ ansible_check_mode or _cassandra_compare | default(false) | bool }}"

# the node's own Cassandra ports moved from the stock ones (storage, its TLS one, the native transport's, a remote
# JMX's) that neither open_ports nor the ports open to some sources open, each "<port> (<its variable>)": said, not
# opened (a node may reach them through a zone of its own)
_cassandra_firewall_own_unopened: >-
  {%- set out = [] -%}
  {%- for port, name, stock in [(cassandra_storage_port | default(7000), 'cassandra_storage_port', 7000),
                                (cassandra_ssl_storage_port | default(7001), 'cassandra_ssl_storage_port', 7001),
                                (cassandra_native_transport_port | default(9042), 'cassandra_native_transport_port', 9042)]
                               + ([] if cassandra_local_jmx | default(true) | bool
                                  else [(cassandra_jmx_port | default(7199), 'cassandra_jmx_port', 7199)]) -%}
  {%-   set p = port | string ~ '/tcp' -%}
  {%-   if port | string != stock | string and p not in open_ports | map('string') | list
           and p not in _cassandra_firewall_port_sources and p not in out | map('first') | list -%}
  {%-     set _ = out.append([p, name]) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ out | map('join', ' (') | map('regex_replace', '$', ')') | list }}

# the firewalld rich rule of each source of _cassandra_firewall_port_sources: {port, source, rule} (written offline
# or live, the same rule)
_cassandra_firewall_rich_rules: >-
  {%- set out = [] -%}
  {%- for port, sources in _cassandra_firewall_port_sources.items() -%}
  {%-   for source in sources -%}
  {%-     set _ = out.append({'port': port, 'source': source,
                              'rule': 'rule family="' ~ ('ipv6' if ':' in source else 'ipv4') ~ '" source address="'
                                      ~ source ~ '" port port="' ~ port | split('/') | first ~ '" protocol="'
                                      ~ port | split('/') | last ~ '" accept'}) -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{ out }}

# what systemctl is-active says of a firewall not running (its rules written offline then); activating or reloading:
# running, its rules changed live
_cassandra_firewall_stopped: [inactive, failed, unknown, '']
