minor_changes:
  - "apply_config playbook - a ``tuned`` profile switch (or the reload of the role's ``cassandra-disks`` profile once changed) and the ``lvchange --readahead`` that ``cassandra_linux`` does not do under a running Cassandra, left for later until now (the switch with a WARNING), are now a restart of that node, done in its restart window one node at a time (drained, Cassandra stopped, done, started), the reason named in the plan and the recap (``would apply, then restart (tuned profile)``, ``(LVM read-ahead)``). A node with only live changes is not restarted; a run interrupted in that window and resumed starts the node again; what ``tuned-adm`` or ``lvchange`` refuses there is said, and does not cause another restart before the next boot. A refusal of restarts while a node is down names ``cassandra_linux_tuned_switch_restart`` and ``cassandra_data_lvchange_restart`` when a restart is for them."
  - "cassandra_linux role - new ``cassandra_linux_tuned_switch_restart`` and ``cassandra_data_lvchange_restart`` (default ``true``): ``false`` keeps the switch or the ``lvchange`` for later under ``apply_config`` too. The WARNING of a switch left for later says what, why, until when, and the ``tuned-adm profile`` command (no longer ``-e cassandra_linux_tuned_switch_running=true``); a reload is also found when the role's profile changed since tuned loaded it (written by an earlier run under a running Cassandra)."
