minor_changes:
  - "import_cluster playbook - one inventory directory for every cluster (``import_cluster_dir``, default ``inventories``; ``inventory = ./inventories`` in ansible.cfg): a cluster's hosts go to ``<cluster group>.yml``, its group_vars and host_vars next to the other clusters', and a re-import (``import_cluster_force``) removes or replaces only this cluster's files. The layout of one directory per cluster (``hosts.yml`` and ``report.txt`` inside) and its switch ``import_cluster_shared_dir`` are gone. A host or group name another cluster already has, a group the user's own inventory files there give hosts, children or vars, a cluster whose name makes the same group as another's, a hosts file of an earlier import into a directory of its own (``hosts.yml`` at the top, or any in a subdirectory: Ansible reads them too), or a cluster group ``cassandra``, ``all`` or ``ungrouped`` stops the import before anything is written."
  - "import_cluster playbook - the first line of every file written names the cluster (``# Written by community.cassandra.import_cluster for <cluster group>``); a re-import never removes or writes over a file another cluster's import wrote. Files written by an earlier release, whose line names no cluster, are taken as this cluster's only when its hosts file alone names their group or host, else kept and listed in the report. A ``<cluster group>.yml`` without that line holding this cluster's group alone (an old ``hosts.yml`` moved there by hand) is its hosts file: replaced, the old one kept as a backup."
  - "import_cluster playbook - report.txt goes to ``import_cluster_report_dir``, by default ``reports/<cluster group>`` next to ``import_cluster_dir`` (``./reports/<cluster group>`` for the default), out of the inventory. A report.txt the import did not write for this cluster is kept as a backup."
  - "import_cluster playbook - ``--check --diff`` reviews a re-import before it writes anything: the changes of every file it would write or remove (secrets.yml hidden), nothing written, not even report.txt."
  - "import_cluster playbook - given nodes of two rings (a run without ``-i <node>,`` on an inventory of several clusters: give ``-e cassandra_hosts=<cluster group>``) stop the import before it reads them; ``--limit`` is refused (it would leave out the nodes found in the ring, and localhost, which writes the inventory)."
  - "import_cluster playbook - report.txt lists one line per setting not at the collection's defaults with the nodes that have each value (the hand edits, what is left as it is and the OS tuning the same way), after the verdict and what is left to do; the run ends with its header, TO DO and SETTINGS, the rest only in report.txt."
  - "operation playbooks - the environment variable ``CASSANDRA_CLUSTER`` picks the cluster when ``cassandra_hosts`` is not set (``CASSANDRA_CLUSTER=<group> ansible-playbook ...``): an inventory group, or a ``cassandra_cluster_name`` (the cluster group whose hosts have that name). A value that matches nothing, or a name several groups have, stops the run; ``-e cassandra_hosts`` wins over it. The first task shows the cluster group and where it comes from."
  - "help playbook - ``help_runbook_dir`` writes RUNBOOK.md to that existing directory instead of the inventory's; the commands of a cluster the import wrote name it (``-e cassandra_hosts``)."
