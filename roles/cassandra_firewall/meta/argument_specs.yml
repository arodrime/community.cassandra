---
argument_specs:
  main:
    short_description: Open the Cassandra ports in the host firewall.
    description:
      - Uses firewalld on RedHat family systems and ufw on Debian and Ubuntu.
    options:
      cassandra_firewall_manage:
        type: bool
        default: true
        description:
          - V(false) leaves the firewall as it is on this node, nothing installed, started or opened.
          - C(import_cluster) sets it for the nodes it imports (host_vars), whose firewall, or none, was set up
            another way; nodes added later get the role's.
      cassandra_offline:
        type: bool
        default: false
        description:
          - Air-gapped hosts, nothing is downloaded. The firewall package
            (firewalld or ufw) is checked instead of installed.
      open_ports:
        type: list
        elements: str
        default: [22/tcp, 7199/tcp, 7000/tcp, 7001/tcp, 9042/tcp]
        description:
          - Ports to open, as C(port/protocol).
      cassandra_firewall_port_sources:
        type: dict
        default: {}
        description:
          - 'Ports open only to some sources instead of everyone, e.g. JMX for a
            remote repair scheduler, C({"7199/tcp": ["10.0.9.0/24"]}). A port
            listed here is closed to the others even when it is in O(open_ports).'
