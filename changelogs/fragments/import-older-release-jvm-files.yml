minor_changes:
  - "cassandra_config - new ``cassandra_log_audit_dir``: the dir of logback.xml's audit file (``audit.log`` of the ``AUDIT`` appender, ``cassandra_log_audit_file``), ``${cassandra.logdir}/audit`` by default as before; import_cluster reads it from the node's ``AUDIT`` appender."
bugfixes:
  - "import_cluster - an option written in the place of a G1 line of jvm<N>-server.options (``-Xmx31G`` for ``-XX:MaxTenuringThreshold=2``) is carried in ``cassandra_jvm<N>_extra_options``; it was dropped, so the heap the JVM runs with was not imported."
  - "import_cluster - a GC block the stock one cannot write as the node has it (G1 without some of its tuning lines, as in an older release's file, or another GC in its place) is imported as ``cassandra_jvm<N>_gc: custom`` with all the node's GC lines (its threads and unlock options too) in ``cassandra_jvm<N>_extra_options``, in the node's order, instead of hand edits the roles would revert; a node the stock block reads as it is stays so."
  - "import_cluster - an option carried in the extra options at another place than the node has it (``-Xss1024M`` in the place of ``-Xss256k``) is no longer also listed as a hand edit when the file has other edits."
  - "import_cluster - an active ``-Djava.rmi.server.hostname`` line of cassandra-env.sh outside any block, below the stock comment or at the end of the file, is imported as ``cassandra_jmx_rmi_hostname`` (the node's address in its group form)."
  - "import_cluster - a hand edit of a JVM options file (a stock line removed) no longer stops the move of cassandra-env.sh's JVM_OPTS lines and the Prometheus exporter's block, nor fails the self-check on those files: it is said on its own."
  - "import_cluster report - an edit that differs between nodes only by each node's own address is one entry (``<its address>``), in HAND EDITS and in SELF-CHECK."
  - "import_cluster - remote JMX set up in the else branch of cassandra-env.sh's LOCAL_JMX test (the password and access file lines and ``-Djava.rmi.server.hostname`` there, the stock password file line commented out) is carried by ``cassandra_jmx_rmi_hostname`` and the JMX users when the running JVM shows that branch ran; the self-check no longer shows that shape as a stray ``fi``."
  - "import_cluster - logback.xml writing the log dir as itself (``/data/cassandra/log/system.log``) where it is the dir the JVM gets as ``${cassandra.logdir}`` (its last ``-Dcassandra.logdir``, else cassandra-env.sh's or the unit's ``CASSANDRA_LOG_DIR``) is no longer a hand edit; when that dir is not sure, it stays one."
  - "import_cluster report - a hand edit of lines of logback.xml or cassandra-env.sh names its way out besides keeping the file: your own template of it (``cassandra_config_template_overrides``) or a piece of it (``cassandra_config_template_snippets``: at the end of cassandra-env.sh, at the end of logback.xml or for appenders before ``<root>``); keeping a JVM options file whose node had cassandra-env.sh lines moved to variables says to keep cassandra-env.sh with it."
  - "import_cluster - cassandra-env.sh lines that are only at another place for the JVM (shown by the running JVM's arguments) are listed with the layout-only edits, no effect, instead of nothing at all."
  - "cassandra_config - a custom GC (``cassandra_jvm<N>_gc: custom``) whose extra options turn ``-XX:+UseG1GC`` on counts as G1 for the heap checks: ``cassandra_heap_size`` alone is taken, as with G1."
  - "import_cluster - a cassandra-env.sh line at another place than the role's (e.g. the rmi hostname at the end) is no longer shown to give the JVM the same arguments when the unit gives JVM_EXTRA_OPTS or MX4J options, which it would come after."
