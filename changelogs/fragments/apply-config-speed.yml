minor_changes:
  - operation playbooks (preflight, apply_config and the roles they run) - the installed packages and the state of the cassandra unit are read by name (``rpm -q``, ``dpkg-query -W``, ``systemctl show``) instead of ``package_facts`` and ``service_facts``, which put every package and service of the node in its facts; ansible-core 2.16 copies those facts again for each task, seconds per task with the packages of a real server. What is shown and done is unchanged.
  - apply_config playbook - the recap and the report read each node's results once, the cluster checks each node's addresses once; the JMX users and cqlsh credentials tasks are left out when none is set.
