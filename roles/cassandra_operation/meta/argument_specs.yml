---
argument_specs:
  main:
    short_description: The task files of the collection's playbooks (internal).
    description:
      - Not a role to run on its own (it has no main tasks), nor a stable interface. It holds the task
        files the collection's playbooks include (the preflight checks, the cluster health, rolling
        operations, confirmation screens, progress files), with the defaults they read.
      - The playbooks' settings below are set in the inventory as any role variable.
    options:
      cassandra_suspicious_ack:
        type: list
        elements: str
        default: []
        description:
          - The sensitive or suspicious settings a node keeps on purpose, by the id of their row, whose WARNING the
            C(preflight) playbook and the C(import_cluster) report leave out for it (per host or group).
          - V(auto_bootstrap_false), V(replace_address) (a replace flag left on a member of the ring), V(heap_size)
            (not set on a 4.x host with 64G of RAM, whose auto-sizing stops at 8G; under 2G, 32G or more, over half
            the RAM), V(allow_all_authenticator) (with an rpc address other hosts reach), V(failure_policy_ignore).
          - Each WARNING names the id that silences it; an id no check has gets a WARNING of its own.
          - The RAM-based heap checks need the host's facts, read by C(preflight), not by C(import_cluster).
      cassandra_node_state:
        type: str
        default: present
        choices: [present, absent]
        description:
          - The state this host should be in, the inventory being the desired state of the cluster. C(absent)
            (a host var, or a group var for a group of hosts) takes the host out of the cluster - every operation
            playbook leaves it out (preflight, health checks and their node counts, rolling operations, status,
            import), and the C(topology) playbook decommissions it if it is still in the ring.
          - Delete the host from the inventory once C(topology) has removed it, or leave it marked absent.
      cassandra_token_rf:
        type: int
        default: 3
        description:
          - One token per node - the replication factor the shares C(create_cluster) shows
            assume in a datacenter no keyspace is replicated to.
            Otherwise the largest replication factor of the datacenter's keyspaces.
      cassandra_token_allow_partial:
        type: bool
        default: false
        description:
          - One token per node, C(create_cluster) - a datacenter where only some nodes have
            C(cassandra_initial_token) is refused; C(true) gives the others the middles of the largest ranges.
      cassandra_service_health_timeout:
        type: int
        default: 600
        description:
          - Operation playbooks, cluster health check. Seconds to wait for down nodes to come back (and this node's storage and CQL ports, gossip and
            native transport to answer), read again every C(cassandra_stream_check_interval) seconds (sooner at
            first, plus the time of a read) with a progress line.
      cassandra_service_health_force:
        type: bool
        default: false
        description:
          - Go on although the cluster is not healthy. Risky, a second replica
            down can make data unavailable.
      cassandra_clock_max_offset_ms:
        type: int
        default: 50
        description:
          - Clocks (the C(sync_clocks) playbook, and the check before C(create_cluster)
            starts nodes). A node is in sync when its time sync daemon
            says it is synchronised and its offset plus the daemon's error bound
            (root delay and dispersion) is within this many milliseconds.
          - A node no daemon reports on (a container, its clock the host's) is
            compared with the others by dates collected over SSH, a coarse
            measure (only a gap over a second counts there).
      cassandra_clock_step_ms:
        type: int
        default: 400
        description:
          - A clock correction over this many milliseconds steps the clock instead
            of slewing it (systemd-timesyncd steps past 400 ms). On a node where
            Cassandra runs, C(sync_clocks) steps it in a restart window (drain,
            stop, step, start), one node at a time.
      cassandra_clock_sync_timeout:
        type: int
        default: 180
        description:
          - Seconds to wait for a time sync daemon just started to synchronise and
            converge (its error bound shrinks with its first samples; chrony polls
            about every 64 s at first).
      cassandra_clock_check:
        type: bool
        default: true
        description:
          - Check the clocks before C(create_cluster) starts nodes
            (refused when not in sync, nothing started). V(false) skips it, for
            clocks kept in sync by other means.
      cassandra_operation_confirm:
        type: bool
        default: true
        description:
          - Ask the operator before a risky operation. C(false) for non-interactive runs. C(--check) never asks
            (nothing changes, the plan only).
      cassandra_operation_drain:
        type: bool
        default: true
        description:
          - Rolling restarts and C(stop_rack) drain each node before stopping it (the role's unit drains
            on stop too, a second drain is harmless). V(false) leaves it to the unit, except on a node whose own
            unit is kept (C(cassandra_service_unit_manage=false)), which is drained anyway.
      cassandra_rolling_resume:
        type: bool
        default: false
        description:
          - Resume the latest interrupted rolling operation of this cluster,
            skipping the nodes already done.
      cassandra_upgrade_sstables_jobs:
        type: int
        default: 2
        description:
          - The C(upgrade) playbook's C(sstables) phase, C(nodetool upgradesstables) one node at a time -
            sstables rewritten at once (nodetool's default); V(0) uses every compaction thread.
      cassandra_upgrade_sstables_timeout:
        type: int
        default: 86400
        description:
          - Seconds one node's C(nodetool upgradesstables) may take.
      cassandra_rolling_progress_dir:
        type: path
        default: ""
        description:
          - Where rolling operations keep their progress files, on the
            controller. A relative path is from the current dir.
          - Empty (default) means C(.cassandra_progress) in the inventory's
            dir, or in the current dir when the inventory's dir is not writable
            and has no C(.cassandra_progress) yet (or there is none, as with
            C(-i host1,host2)). With several inventories, the one of the first
            host of the play.
      cassandra_rolling_progress_days:
        type: int
        default: 30
        description:
          - Progress files older than this are removed.
      cassandra_cql_username:
        type: str
        default: ""
        description:
          - CQL user for the checks that read the schema (the keyspaces'
            replication before a rack goes down), when authentication is on.
      cassandra_cql_password:
        type: str
        default: ""
        no_log: true
        description:
          - Password of O(cassandra_cql_username).
      cassandra_service_state:
        type: str
        default: started
        choices: [started, stopped, restarted]
        description:
          - Read by these task files too, with the same default (see the C(cassandra_service) role).
      cassandra_service_unit_manage:
        type: bool
        default: true
        description:
          - Read by these task files too, with the same default (see the C(cassandra_service) role).
      cassandra_service_wait_timeout:
        type: int
        default: 600
        description:
          - Read by these task files too, with the same default (see the C(cassandra_service) role).
      cassandra_service_drain_timeout:
        type: int
        default: 120
        description:
          - Read by these task files too, with the same default (see the C(cassandra_service) role).
      cassandra_stream_check_interval:
        type: int
        default: 30
        description:
          - Seconds between two reads of the cluster health check's wait for nodes down
            (C(cassandra_service_health_timeout)), after the first C(cassandra_stream_early_time) seconds, a progress
            line each time. The streaming waits of the topology playbooks keep the same pace.
      cassandra_stream_early_check_interval:
        type: int
        default: 10
        description:
          - Read by these task files too, with the same default (see the C(cassandra_service) role).
      cassandra_stream_early_time:
        type: int
        default: 300
        description:
          - Read by these task files too, with the same default (see the C(cassandra_service) role).
      cassandra_jmx_username:
        type: str
        default: ""
        description:
          - Read by these task files too, with the same default (see the C(cassandra_service) role).
      cassandra_jmx_password:
        type: str
        default: ""
        no_log: true
        description:
          - Read by these task files too, with the same default (see the C(cassandra_service) role).
      cassandra_jmx_password_file:
        type: str
        default: ""
        description:
          - Read by these task files too, with the same default (see the C(cassandra_service) role).
