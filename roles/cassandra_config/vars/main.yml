---
_cassandra_config_series: "{{ cassandra_version[0] }}.{{ cassandra_version[1] }}"
_cassandra_config_files:
  "5.0": [cassandra.yaml, cassandra-env.sh, jvm-server.options, jvm11-server.options, jvm17-server.options,
          cassandra-rackdc.properties, logback.xml]
  "4.1": [cassandra.yaml, cassandra-env.sh, jvm-server.options, jvm8-server.options, jvm11-server.options,
          cassandra-rackdc.properties, logback.xml]
  "4.0": [cassandra.yaml, cassandra-env.sh, jvm-server.options, jvm8-server.options, jvm11-server.options,
          cassandra-rackdc.properties, logback.xml]
# The template of each config file: yours (cassandra_config_template_overrides, an absolute path), else the role's
_cassandra_config_templates: >-
  {%- set out = {} -%}
  {%- for f in _cassandra_config_files[_cassandra_config_series] -%}
  {%-   set _ = out.update({f: cassandra_config_template_overrides[f] | default(_cassandra_config_series ~ '/' ~ f ~ '.j2')}) -%}
  {%- endfor -%}
  {{ out }}
# Your own template pieces (cassandra_config_template_snippets), rendered with the same variables, their last
# newlines off: the templates add them at their insertion points ('' for none)
_cassandra_config_snippet_logback: >-
  {{ (lookup('ansible.builtin.template', cassandra_config_template_snippets['logback.xml']) | regex_replace('\n+$', ''))
     if 'logback.xml' in cassandra_config_template_snippets else '' }}
_cassandra_config_snippet_appenders: >-
  {{ (lookup('ansible.builtin.template', cassandra_config_template_snippets['logback.xml:appenders'])
      | regex_replace('\n+$', '')) if 'logback.xml:appenders' in cassandra_config_template_snippets else '' }}
# logback.xml: the appender-refs of cassandra_logback_root_extra_refs, the loggers of cassandra_log_levels: their lines
_cassandra_config_logback_refs: >-
  {%- set out = [] -%}
  {%- for ref in (['CQLLOG'] if cassandra_version == '50x' and cassandra_log_cql_table | bool else [])
                 + cassandra_logback_root_extra_refs -%}
  {%-   set _ = out.append('    <appender-ref ref="' ~ ref ~ '" />') -%}
  {%- endfor -%}
  {{ out }}
_cassandra_config_log_levels: >-
  {%- set out = [] -%}
  {%- for name, level in cassandra_log_levels.items() -%}
  {%-   set _ = out.append('  <logger name="' ~ name ~ '" level="' ~ level ~ '"/>') -%}
  {%- endfor -%}
  {{ out }}
# the stock pattern of the log lines, by series (cassandra_log_pattern's default)
_cassandra_config_log_patterns:
  40x: "%-5level [%thread] %date{ISO8601} %F:%L - %msg%n"
  41x: "%-5level [%thread] %date{ISO8601} %F:%L - %msg%n"
  50x: '%-5level [%thread] %date{"yyyy-MM-dd''T''HH:mm:ss,SSS", UTC} %F:%L - %msg%n'
# the logger names cassandra_log_levels may not take: {name: the variable that sets it}
_cassandra_config_own_loggers:
  ROOT: cassandra_log_level
  org.apache.cassandra: cassandra_log_level_cassandra
  org.apache.cassandra.audit: cassandra_log_audit_file
# the appenders of the stock logback.xml <root> may name (AUDIT: with cassandra_log_audit_file)
_cassandra_config_stock_appenders: [SYSTEMLOG, DEBUGLOG, ASYNCDEBUGLOG, STDOUT]
_cassandra_config_snippet_env: >-
  {{ (lookup('ansible.builtin.template', cassandra_config_template_snippets['cassandra-env.sh']) | regex_replace('\n+$', ''))
     if 'cassandra-env.sh' in cassandra_config_template_snippets else '' }}
# Stock release each series' templates come from (tools/gen_templates.py)
_cassandra_config_template_versions:
  "5.0": 5.0.9
  "4.1": 4.1.12
  "4.0": 4.0.21
# the modules' Python: the one set (e.g. by cassandra_install after the facts were gathered), else the facts'
_cassandra_config_python: >-
  {{ ansible_python_interpreter if ansible_python_interpreter is defined and ansible_python_interpreter is match('/[^ ]+$')
     else ansible_facts['python']['executable'] if ansible_facts['python'] is defined
     else '/usr/bin/python3' }}
# Snitches that don't take the node's dc and rack from cassandra-rackdc.properties'
# dc= and rack= (Cassandra 4.0 to 5.0; the cloud ones may read its other settings)
_cassandra_config_snitches_without_rackdc: [SimpleSnitch, RackInferringSnitch, PropertyFileSnitch, Ec2Snitch,
                                            Ec2MultiRegionSnitch, GoogleCloudSnitch, CloudstackSnitch,
                                            AlibabaCloudSnitch, AzureSnitch]
# Owner, group and mode the role gives a file it writes (its name in
# _cassandra_config_perm_file); import_cluster's self-check uses the same filter
_cassandra_config_perm: >-
  {{ _cassandra_config_perm_file | community.cassandra.cassandra_file_permissions(_cassandra_config_perm_settings) }}
_cassandra_config_perm_settings:
  owner: "{{ cassandra_config_user }}"
  group: "{{ cassandra_config_group }}"
  mode: "{{ cassandra_config_mode }}"
  public_mode: "{{ cassandra_config_public_mode }}"
  files: "{{ cassandra_config_file_permissions }}"
  # the account the unit runs Cassandra as (cassandra_service), else cassandra_user
  user: "{{ cassandra_service_user | default(cassandra_user) }}"
  user_group: "{{ cassandra_service_group | default(cassandra_group) }}"
# GC of each jvm<N>-server.options file of the series
_cassandra_config_gcs: >-
  {{ [cassandra_jvm8_gc | default(cassandra_jvm_gc), cassandra_jvm11_gc | default(cassandra_jvm_gc)]
     if cassandra_version in ['40x', '41x']
     else [cassandra_jvm11_gc | default(cassandra_jvm_gc), cassandra_jvm17_gc | default(cassandra_jvm_gc)] }}
# Where the package puts its config (RedHat: the alternatives target it ships)
_cassandra_config_pkg_conf_dir: "{{ '/etc/cassandra/default.conf' if ansible_facts['os_family'] == 'RedHat' else cassandra_conf_dir }}"
# The record of the config files the running Cassandra started with (config_seed.yml writes it before a
# change; cassandra_service writes it at each start, its _cassandra_service_config_snapshot: a unit test keeps
# them equal), and the files of the conf dir it covers: the config a restart picks up (and the JMX access file,
# in the conf dir on Debian and Ubuntu; not the password file, read at each login: a new one needs no restart)
_cassandra_config_snapshot: /var/lib/cassandra/.ansible_config_at_start.json
_cassandra_config_snapshot_files: [cassandra.yaml, cassandra-env.sh, jvm*-server.options, cassandra-rackdc.properties,
                                   logback.xml, jmxremote.access, jmx_prometheus.at_start]
# A duration above zero Cassandra 4.1+ reads in milliseconds (DurationSpec.IntMillisecondsBound)
_cassandra_config_duration_ms: '^0*[1-9][0-9]*(ms|s|m|h|d)$'
# Installed Cassandra release ('' if not from a package), read with the node (rpm, else dpkg)
_cassandra_config_installed: "{{ _cassandra_config_package | default('') | regex_replace('^([0-9.]+).*$', '\\1') }}"
# [release, where it comes from: installed, pinned or latest] the variables' keys are checked against
# (_cassandra_config_since): the installed one, else (none yet, under --check or from a tarball; another series, an
# upgrade's preview) cassandra_package_version when pinned to a release of the series (its epoch left out), else the
# series' latest release known (its templates'). The upgrade's preview (_cassandra_config_target_preview) takes the
# pinned one first: the release the upgrade installs.
_cassandra_config_release: >-
  {%- set pinned = cassandra_package_version | default('') | string | regex_replace('^[0-9]+:', '')
                   | regex_search('^[0-9]+[.][0-9]+[.][0-9]+') or '' -%}
  {%- set pinned = pinned if (pinned ~ '.').startswith(_cassandra_config_series ~ '.') else '' -%}
  {%- set installed = _cassandra_config_installed
                      if (_cassandra_config_installed ~ '.').startswith(_cassandra_config_series ~ '.') else '' -%}
  {{ [pinned, 'pinned'] if pinned and _cassandra_config_target_preview | default(false) | bool
     else [installed, 'installed'] if installed
     else [pinned, 'pinned'] if pinned
     else [_cassandra_config_template_versions[_cassandra_config_series], 'latest'] }}
# cassandra.yaml sections the template writes that cassandra_extra_settings may
# add sub-keys to (written in the section), and the sub-keys of their variables
# (refused there, the variables named)
_cassandra_config_extra_sections:
  audit_logging_options:
    enabled: cassandra_audit_logging_enabled
    logger: cassandra_audit_logger_class_name, cassandra_audit_logger_parameters
    audit_logs_dir: cassandra_audit_logs_dir
    excluded_keyspaces: cassandra_audit_excluded_keyspaces
    included_categories: cassandra_audit_included_categories
    excluded_users: cassandra_audit_excluded_users
    max_queue_weight: cassandra_audit_max_queue_weight
    max_log_size: cassandra_audit_max_log_size
# cassandra_audit_logger_parameters: a key the template writes plain that YAML
# reads back as the same text, and the characters no value may hold (the control
# ones but tab, YAML 1.1's line breaks): refused, and not imported
_cassandra_config_plain_key: '^(?!(?i:y|n|yes|no|true|false|on|off|null)$)[A-Za-z_][A-Za-z0-9_.-]*$'
_cassandra_config_unwritable_text: '[\x00-\x08\x0a-\x1f\x7f-\x9f\u2028\u2029]'
# A value (a password) that YAML would not read back as the same plain string:
# single-quoted in cassandra.yaml
_cassandra_config_quote: '(?s)^(?!(?!(?i:y|n|yes|no|true|false|on|off|null)$)[A-Za-z][A-Za-z0-9_./+=@-]*$)(.*)$'
# data_file_directories when cassandra.yaml has none: <cassandra.storagedir>/data,
# /var/lib/cassandra with the deb and rpm packages (cassandra.in.sh)
_cassandra_config_default_data_dir: /var/lib/cassandra/data
# A directory given as an absolute path, no shell expansion in it ($CASSANDRA_LOG_DIR)
_cassandra_config_plain_path: '/[^$`]*$'
# [kind, [path]] of the directories the role creates besides the data, commitlog, saved_caches and hints ones: cdc_raw when set or
# with CDC on (Cassandra's default then, under the storage dir), the heap dump dir when it is a path
_cassandra_config_more_dirs: >-
  {{ ([['cdc_raw dir', [cassandra_cdc_raw_dir or ((cassandra_config_storage_dir or '/var/lib/cassandra')
                                                  | regex_replace('(?<=.)/+$', '')) ~ '/cdc_raw']]]
      if cassandra_cdc_raw_dir or cassandra_cdc_enabled | bool else [])
     + ([['heap dump dir', [cassandra_heap_dump_dir]]] if cassandra_heap_dump_dir is match(_cassandra_config_plain_path) else []) }}
# Variables of keys Cassandra has from a series or a patch release on: {variable: [its key, that series or release]}
# (the role refuses them set for an earlier release, _cassandra_config_release: Cassandra would not start, or the
# series' template has no line for them)
_cassandra_config_since:
  cassandra_prepared_statements_cache_size: [prepared_statements_cache_size, "4.1"]
  cassandra_key_cache_size: [key_cache_size, "4.1"]
  cassandra_counter_cache_size: [counter_cache_size, "4.1"]
  cassandra_index_summary_capacity: [index_summary_capacity, "4.1"]
  cassandra_entire_sstable_stream_throughput_outbound: [entire_sstable_stream_throughput_outbound, "4.1"]
  cassandra_entire_sstable_inter_dc_stream_throughput_outbound: [entire_sstable_inter_dc_stream_throughput_outbound, "4.1"]
  cassandra_auto_snapshot_ttl: [auto_snapshot_ttl, "4.1"]
  cassandra_streaming_stats_enabled: [streaming_stats_enabled, "4.1.1"]
  cassandra_sstable_format: [sstable.selected_format, "5.0"]
  cassandra_partition_size_warn_threshold: [partition_size_warn_threshold, "5.0"]
  cassandra_partition_size_fail_threshold: [partition_size_fail_threshold, "5.0"]
# 4.1+: the former names (4.0's) of keys a variable writes; Cassandra refuses a cassandra.yaml with both
_cassandra_config_old_names:
  file_cache_size_in_mb: cassandra_file_cache_size
  memtable_heap_space_in_mb: cassandra_memtable_heap_space
  memtable_offheap_space_in_mb: cassandra_memtable_offheap_space
  column_index_size_in_kb: cassandra_column_index_size
  stream_throughput_outbound_megabits_per_sec: cassandra_stream_throughput_outbound
  inter_dc_stream_throughput_outbound_megabits_per_sec: cassandra_inter_dc_stream_throughput_outbound
  internode_streaming_tcp_user_timeout_in_ms: cassandra_internode_streaming_tcp_user_timeout
  roles_update_interval_in_ms: cassandra_roles_update_interval
  permissions_update_interval_in_ms: cassandra_permissions_update_interval
  credentials_update_interval_in_ms: cassandra_credentials_update_interval
  gc_log_threshold_in_ms: cassandra_gc_log_threshold
  gc_warn_threshold_in_ms: cassandra_gc_warn_threshold
  native_transport_max_frame_size_in_mb: cassandra_native_transport_max_frame_size
# and the ones of one series
_cassandra_config_old_names_of:
  "4.1":
    compaction_large_partition_warning_threshold_mb: cassandra_compaction_large_partition_warning_threshold
  "5.0":
    compaction_large_partition_warning_threshold_mb: cassandra_partition_size_warn_threshold
    compaction_large_partition_warning_threshold: cassandra_partition_size_warn_threshold
# The Prometheus exporter's jar, its config file and the option the JVM gets ('' when off), written at the end of
# jvm-server.options (an IPv6 address in brackets, as the agent reads it)
_cassandra_config_exporter_jar: >-
  {{ cassandra_prometheus_exporter_dir | regex_replace('(?<=.)/+$', '') }}/jmx_prometheus_javaagent-{{
  cassandra_prometheus_exporter_version }}.jar
_cassandra_config_exporter_config: >-
  {{ cassandra_prometheus_exporter_config_file
     or (cassandra_conf_dir | regex_replace('(?<=.)/+$', '')) ~ '/jmx_prometheus.yml' }}
# the digest of its parts read at start (httpServer, openTelemetry), next to the config files: the record of the
# config Cassandra started with covers it (_cassandra_config_snapshot_files)
_cassandra_config_exporter_at_start: "{{ cassandra_conf_dir | regex_replace('(?<=.)/+$', '') }}/jmx_prometheus.at_start"
_cassandra_config_jvm_agent: >-
  {{ ('-javaagent:' ~ _cassandra_config_exporter_jar ~ '='
      ~ ((('[' ~ cassandra_prometheus_exporter_address ~ ']') if ':' in cassandra_prometheus_exporter_address
          else cassandra_prometheus_exporter_address) ~ ':' if cassandra_prometheus_exporter_address else '')
      ~ cassandra_prometheus_exporter_port ~ ':' ~ _cassandra_config_exporter_config)
     if cassandra_prometheus_exporter_enabled | bool else '' }}
# A path the agent's option can name: absolute, and none of what bin/cassandra splits an options line on, nor the
# agent its arguments on (=)
_cassandra_config_exporter_path: '^/[^\s"''=]*$'
