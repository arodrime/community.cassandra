minor_changes:
  - import_cluster playbook - what a node has that the roles did not set up (package repositories, OS settings, cqlsh's Python, the systemd unit) is left as it is on that node (``cassandra_repository_manage``, ``cassandra_linux_manage``, ``cassandra_cqlsh_python_manage``, ``cassandra_service_unit_manage`` false in its host_vars), the config stays in the conf dir the node reads, a heap set in a kept unit stays there, a readwrite JMX user without the create and unregister rights keeps them that way, and the node's boot setting is imported, so the roles change nothing on the imported nodes; nodes added later get the full setup (these host_vars get ``cassandra_imported_host`` (true); add_node and replace_node refuse a host with no Cassandra installed that still carries them, ``cassandra_new_node_allow_kept_setup`` accepts it), and the playbooks drain a node whose unit is kept with nodetool before stopping it. The upgrade playbook stops when a node whose repositories are not managed lacks the target version.
  - cassandra_config role - on a node already initialized, a file with the same settings as the role's (only comments, blank lines or their layout differ), JMX users' files included, is left as it is (``cassandra_config_normalize`` true rewrites it); a readwrite JMX user can do without the create and unregister rights (``create_unregister`` false).
  - cassandra_linux role - new ``cassandra_linux_manage`` option, false leaves the OS settings of the node as they are.
  - cassandra_install role - new ``cassandra_cqlsh_python_manage`` option, false leaves cqlsh's Python as it is.
  - cassandra_service role - new ``cassandra_service_unit_manage`` option, false keeps the node's own unit.
