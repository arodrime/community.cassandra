minor_changes:
  - 'cassandra_config role - ``cassandra_log_audit_file`` uncomments the stock ``AUDIT`` appender of ``logback.xml`` and its ``org.apache.cassandra.audit`` logger (audit events in ``audit/audit.log``); on by default with ``FileAuditLogger``, with a WARNING when turned off then. A cluster auditing with ``FileAuditLogger`` whose logback.xml has the stock block commented out gets its audit events in ``audit/audit.log`` at its next ``apply_config``, no longer in ``system.log``, unless ``cassandra_log_audit_file: false`` (import_cluster writes it for such a node).'
  - 'cassandra_config role - ``cassandra_logback_root_extra_refs`` (appenders ``<root>`` names besides the stock ones, checked) and ``cassandra_log_levels`` (``{logger name: level}``, the loggers of the role''s variables refused).'
  - 'import_cluster playbook - reads back from ``logback.xml`` the audit appender uncommented in place, the appenders added to ``<root>``, the loggers that only set a level (wherever they are) and the node''s own appenders before ``<root>`` (in a snippet ``logback.xml.appenders.snippet.j2``), no longer hand edits; logback''s appenders and loggers compared in any order (an ``appender-ref`` after its appender).'
  - 'cassandra_config role - ``cassandra_log_<system|debug|audit>_<max_file_size|max_history|total_size_cap>`` (the rotation of each log file), ``cassandra_log_pattern`` (one pattern for every log line, the series'' stock one by default) and, 5.0 only, ``cassandra_log_cql_table`` with ``cassandra_log_cql_table_level`` (the stock ``CQLLOG`` appender, the logs in ``system_views.system_logs``); import_cluster reads them back.'
