---
# The mirror (prepare.yml) offers Java 11 and 17; the cluster names its Java,
# 17, and gets that tarball.
- name: Converge
  hosts: all
  vars:
    cassandra_java_tarballs:
      "11":
        url: http://127.0.0.1:8000/java/OpenJDK11U-jre_x64_linux_hotspot_11.0.25_9.tar.gz
      "17":
        url: http://127.0.0.1:8000/java/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1.tar.gz
        checksum: sha256:0b2b640e3046b64c8ec504de0ab9d91bb5610182bda21fad454681ce54d45a62
    cassandra_java_version: "17"
  roles:
    - role: community.cassandra.cassandra_repository
    - role: community.cassandra.cassandra_install

# /usr/bin/java an alternative of a Java removed since (the java group left
# behind by removed packages, in manual mode): leads nowhere, so the tarball's
# java is made the system one again. Once (idempotence run).
- name: System java leading nowhere
  hosts: all
  vars:
    _gone: /opt/gone-java
    _home: /opt/cassandra-java/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1
  tasks:
    - name: Tested already (idempotence run)
      ansible.builtin.stat:
        path: /root/dangling-java-tested
      register: cassandra_test_dangling_done

    - name: Test it
      when: not cassandra_test_dangling_done.stat.exists
      block:
        - name: A Java to be removed
          ansible.builtin.file:
            path: "{{ _gone }}/bin"
            state: directory
            mode: "0755"

        - name: Its java
          ansible.builtin.copy:
            content: "#!/bin/sh\nexit 1\n"
            dest: "{{ _gone }}/bin/java"
            mode: "0755"

        - name: Made the java alternative (manual mode)
          community.general.alternatives:
            name: java
            path: "{{ _gone }}/bin/java"
            link: /usr/bin/java
            priority: 5000

        - name: Then removed
          ansible.builtin.file:
            path: "{{ _gone }}"
            state: absent

        - name: Mark it tested
          ansible.builtin.file:
            path: /root/dangling-java-tested
            state: touch
            mode: "0644"

        - name: Read /usr/bin/java
          ansible.builtin.stat:
            path: /usr/bin/java
          register: cassandra_test_dangling

        - name: It leads nowhere
          ansible.builtin.assert:
            that: cassandra_test_dangling.stat.exists and cassandra_test_dangling.stat.lnk_source == _gone ~ '/bin/java'

        - name: Run the role (twice, the second to see it settled)
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_install
          vars:
            cassandra_java_tarballs: {"17": {url: "http://127.0.0.1:8000/java/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1.tar.gz"}}
            cassandra_java_version: "17"
          loop: [1, 2]

        - name: Ask java its version
          ansible.builtin.command:
            argv: [java, -version]
          register: cassandra_test_dangling_java
          changed_when: false

        - name: The tarball's java, and the second run had nothing to set
          ansible.builtin.assert:
            that:
              - cassandra_test_dangling_java.stderr is search('"17[.]0[.]20[.]1"')
              - cassandra_java_resolved.stdout_lines == [_home ~ '/bin/java'] * 2

# An imported node: Java already there, reached through a link, and a
# /usr/bin/java made by hand. The role must leave both alone.
- name: Java already unpacked (cassandra_java_home)
  hosts: all
  vars:
    _home: /opt/cassandra-java/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1
  tasks:
    - name: A link to the Java directory
      ansible.builtin.file:
        src: "{{ _home }}"
        dest: /opt/current-java
        state: link

    - name: A /usr/bin/java made by hand
      ansible.builtin.file:
        src: "{{ _home }}/bin/java"
        dest: /usr/bin/java
        state: link
        force: true

    - name: Run the role with that Java
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_install
      vars:
        cassandra_java_home: /opt/current-java
        cassandra_java_version: "17"

    - name: Read /usr/bin/java
      ansible.builtin.stat:
        path: /usr/bin/java
      register: cassandra_test_java

    - name: It is still the hand-made link
      ansible.builtin.assert:
        that: cassandra_test_java.stat.lnk_target == _home ~ '/bin/java'

# An imported node with a tarball set for the new nodes (cassandra_java_tarball
# next to the imported cassandra_java_home): its Java, unpacked by hand (no
# .unpacked mark), must not be emptied and unpacked again.
- name: Java already there, tarball set for new nodes
  hosts: all
  vars:
    _home: /opt/cassandra-java/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1
  tasks:
    - name: Unpacked by hand (mark moved away), with a file of the site
      ansible.builtin.shell: mv {{ _home }}/.unpacked /root/.unpacked && touch {{ _home }}/site-file
      changed_when: false

    - name: Run the role with the tarball and that Java
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_install
      vars:
        cassandra_java_home: /opt/current-java
        cassandra_java_tarball: https://mirror.invalid/java/jdk.tar.gz  # never downloaded
        cassandra_java_version: "17"

    - name: Read the site's file
      ansible.builtin.stat:
        path: "{{ _home }}/site-file"
      register: cassandra_test_site_file

    - name: The Java directory was kept
      ansible.builtin.assert:
        that: cassandra_test_site_file.stat.exists

    - name: Back as the first play left it
      ansible.builtin.shell: mv /root/.unpacked {{ _home }}/.unpacked && rm {{ _home }}/site-file
      changed_when: false

# The same, but the role's own unpack was cut short (its .unpacking mark left,
# bin/java already there): unpacked again. Once, the redo is a change.
- name: Unpack left half done, redone
  hosts: all
  vars:
    _home: /opt/cassandra-java/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1
  tasks:
    - name: Tested already (idempotence run)
      ansible.builtin.stat:
        path: /root/half-unpack-tested
      register: cassandra_test_half_done

    - name: Test it
      when: not cassandra_test_half_done.stat.exists
      block:
        - name: Cut short after bin/java
          ansible.builtin.shell: >-
            mv {{ _home }}/.unpacked {{ _home }}/.unpacking && rm -rf {{ _home }}/lib && touch {{ _home }}/site-file
            /root/half-unpack-tested
          changed_when: false

        - name: Run the role with the tarball and that Java
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_install
          vars:
            cassandra_java_home: "{{ _home }}"
            cassandra_java_tarball: http://127.0.0.1:8000/java/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1.tar.gz
            cassandra_java_tarball_checksum: sha256:0b2b640e3046b64c8ec504de0ab9d91bb5610182bda21fad454681ce54d45a62
            cassandra_java_version: "17"

        - name: Read the directory
          ansible.builtin.stat:
            path: "{{ _home }}/{{ item }}"
          loop: [site-file, lib, .unpacked, .unpacking]
          register: cassandra_test_redone

        - name: Unpacked again, whole, and marked done
          ansible.builtin.assert:
            that: cassandra_test_redone.results | map(attribute='stat.exists') | list == [false, true, true, false]

# Refused, before anything changes: a Java the series does not support, and a
# Java the mirror offers no tarball for
- name: Java refused
  hosts: all
  tasks:
    - name: Run the role with {{ item.why }}
      ansible.builtin.include_tasks: refused.yml
      vars:
        cassandra_test_refused: "{{ item }}"
      loop:
        - why: Java 21 on 5.0
          vars: {cassandra_java_version: "21"}
          message: Cassandra 50x runs on Java 11 or 17, not 21
        - why: Java 11 with only 17 on offer
          vars:
            cassandra_java_version: "11"
            cassandra_java_tarballs: {"17": {url: http://127.0.0.1:8000/java/none.tar.gz}}
          message: cassandra_java_tarballs only offers Java 17
      loop_control:
        label: "{{ item.why }}"

# The mirror's "17" is in fact a Java 11: refused once unpacked, before it is
# marked unpacked or made the system java. Once (idempotence run).
- name: Tarball of another Java refused
  hosts: all
  vars:
    _dir: /opt/mismatch-java
    _home: /opt/mismatch-java/OpenJDK11U-jre_x64_linux_hotspot_11.0.25_9
  tasks:
    - name: Tested already (idempotence run)
      ansible.builtin.stat:
        path: "{{ _dir }}"
      register: cassandra_test_mismatch_done

    - name: Test it
      when: not cassandra_test_mismatch_done.stat.exists
      block:
        - name: Run the role with a "17" that is a Java 11
          ansible.builtin.include_tasks: refused.yml
          vars:
            cassandra_test_refused:
              vars:
                cassandra_java_version: "17"
                cassandra_java_tarball_dir: "{{ _dir }}"
                cassandra_java_tarballs:
                  "17": {url: http://127.0.0.1:8000/java/OpenJDK11U-jre_x64_linux_hotspot_11.0.25_9.tar.gz}
              message: >-
                The Java tarball OpenJDK11U-jre_x64_linux_hotspot_11.0.25_9.tar.gz
                (http://127.0.0.1:8000/java/OpenJDK11U-jre_x64_linux_hotspot_11.0.25_9.tar.gz) is Java 11

        - name: Read what it left
          ansible.builtin.stat:
            path: "{{ item }}"
          loop: ["{{ _home }}/.unpacked", "{{ _home }}/.unpacking", /usr/bin/java]
          register: cassandra_test_mismatch

        - name: Not marked unpacked (redone once fixed), and not the system java
          ansible.builtin.assert:
            that:
              - cassandra_test_mismatch.results | map(attribute='stat.exists') | list == [false, true, true]
              - cassandra_test_mismatch.results[2].stat.lnk_source is search('OpenJDK17U')

        # The mirror's file replaced by a real Java 17 under the same name: the
        # same directory, unpacked again
        - name: Run the role with the fixed "17"
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_install
          vars:
            cassandra_java_version: "17"
            cassandra_java_tarball_dir: "{{ _dir }}"
            cassandra_java_tarballs:
              "17": {url: http://127.0.0.1:8000/fixed/OpenJDK11U-jre_x64_linux_hotspot_11.0.25_9.tar.gz}

        - name: Read the directory again
          ansible.builtin.stat:
            path: "{{ _home }}/{{ item }}"
          loop: [.unpacked, .unpacking, bin/java]
          register: cassandra_test_fixed

        - name: Unpacked whole, and marked done
          ansible.builtin.assert:
            that: cassandra_test_fixed.results | map(attribute='stat.exists') | list == [true, false, true]

        - name: Back to the system java the plays above left (a link made by hand)
          ansible.builtin.file:
            src: /opt/cassandra-java/OpenJDK17U-jre_x64_linux_hotspot_17.0.20.1_1/bin/java
            dest: /usr/bin/java
            state: link
            force: true
