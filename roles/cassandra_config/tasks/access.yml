---
# Remote JMX with authentication (cassandra_local_jmx: false): its users. The
# JVM refuses a password file others can read.
- name: Write the JMX users
  when: cassandra_jmx_users | length > 0
  vars:
    # (no user with a password: an empty file; ansible-core 2.19+ renders an empty template as None)
    _cassandra_jmx_password_content: "{{ lookup('ansible.builtin.template', 'jmxremote.password.j2') | default('', true) }}"
    _cassandra_jmx_access_content: "{{ lookup('ansible.builtin.template', 'jmxremote.access.j2') | default('', true) }}"
  block:
    # what the copies below write, for apply_config and the report: a file missing, or (compared) not the
    # same users and rights; said as such, never their content (passwords)
    - name: Record the JMX files to write for the report
      ansible.builtin.set_fact:
        _cassandra_config_items: >-
          {%- set out = [] -%}
          {%- for c in _changes -%}
          {%-   set _ = out.append({'item': c.path, 'before': 'absent' if c.missing else 'other users or rights',
                                    'after': 'written whole', 'whole': true}) -%}
          {%- endfor -%}
          {{ _cassandra_config_items | default([]) + out + _cassandra_config_jmx_written | default([]) }}
      vars:
        _changes: "{{ _cassandra_config_jmx_changes }}"  # (the plan's, access_plan.yml)

    # (a dir of their own, e.g. imported from a node: made on a new node; one already there left as it is)
    - name: Create the directories of the JMX files
      ansible.builtin.command:
        argv: [mkdir, -p, -m, "0755", "{{ item }}"]
        creates: "{{ item }}"
      loop: "{{ [cassandra_jmx_remote_password_file | dirname, cassandra_jmx_remote_access_file | dirname] | unique }}"

    - name: Write jmxremote.password
      ansible.builtin.include_tasks: jmx_password.yml
      when: "'password' not in cassandra_config_jmx_same.stdout | default('[]') | from_json"

    - name: Write jmxremote.access
      ansible.builtin.copy:
        content: "{{ _cassandra_jmx_access_content }}"
        dest: "{{ cassandra_jmx_remote_access_file }}"
        owner: "{{ _cassandra_config_perm.owner }}"
        group: "{{ _cassandra_config_perm.group }}"
        mode: "{{ _cassandra_config_perm.mode }}"
      vars:
        _cassandra_config_perm_file: jmxremote.access
      when: "'access' not in cassandra_config_jmx_same.stdout | default('[]') | from_json"

    # their content stays, not their owner, group and mode
    - name: Set the owner and mode of the JMX files left as they are
      ansible.builtin.file:
        path: "{{ cassandra_jmx_remote_password_file if item == 'password' else cassandra_jmx_remote_access_file }}"
        owner: "{{ _cassandra_config_perm.owner }}"
        group: "{{ _cassandra_config_perm.group }}"
        mode: "{{ _cassandra_config_perm.mode }}"
      loop: "{{ cassandra_config_jmx_same.stdout | default('[]') | from_json }}"
      vars:
        _cassandra_config_perm_file: jmxremote.{{ item }}

    - name: Say which JMX files are kept as they are (cassandra_config_keep_files)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ _kept | join(', ') }} left as they are (cassandra_config_keep_files)"
      vars:
        _kept: >-
          {{ cassandra_config_jmx_same.stdout | default('[]') | from_json | map('regex_replace', '^', 'jmxremote.')
             | select('in', cassandra_config_keep_files) | list }}
      when: _kept | length > 0

    - name: List the JMX files that get the role's header
      ansible.builtin.set_fact:
        _cassandra_config_header: "{{ _cassandra_config_header | default([]) + _jmx }}"
      vars:
        _jmx: "{{ cassandra_config_jmx_header.stdout | default('[]') | from_json }}"
      when: _jmx | length > 0

    # (said apart, as confirm.yml says the config files')
    - name: Say them among the changes
      ansible.builtin.set_fact:
        _cassandra_config_items: >-
          {{ _cassandra_config_items | default([]) | rejectattr('header', 'defined') | list
             + _cassandra_config_header_items }}
      when: cassandra_config_jmx_header.stdout | default('[]') | from_json | length > 0

    - name: Add the role's header to them
      ansible.builtin.include_tasks: header.yml
      vars:
        _cassandra_config_header_files: "{{ cassandra_config_jmx_header.stdout | from_json }}"
      when: cassandra_config_jmx_header.stdout | default('[]') | from_json | length > 0

# what the plan found to write in the users' ~/.cassandra (access_plan.yml), for apply_config and the report: never
# their content (passwords)
- name: Record the users' files to write for the report
  ansible.builtin.set_fact:
    _cassandra_config_items: "{{ _cassandra_config_items | default([]) + _cassandra_config_user_file_changes }}"
  when: _cassandra_config_user_file_changes | default([]) | length > 0

# cqlsh for OS users: ~/.cassandra/cqlshrc pointing at this node, with the CQL
# credentials (4.1+: in a separate credentials file, as cqlsh wants)
- name: Write the cqlsh credentials
  when: cassandra_cqlsh_credentials | length > 0
  vars:
    _home: "{{ ansible_facts.getent_passwd[item.os_user][4] }}"
  block:
    - name: Find the users' home directories
      ansible.builtin.getent:
        database: passwd
        key: "{{ item.os_user }}"
      loop: "{{ cassandra_cqlsh_credentials }}"
      loop_control:
        label: "{{ item.os_user }}"

    - name: Create ~/.cassandra
      ansible.builtin.file:
        path: "{{ _home }}/.cassandra"
        state: directory
        owner: "{{ item.os_user }}"
        mode: "0700"
      loop: "{{ cassandra_cqlsh_credentials }}"
      loop_control:
        label: "{{ item.os_user }}"

    # (the plan renders the same templates: access_plan.yml)
    - name: Write ~/.cassandra/cqlshrc
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', 'cqlshrc.j2') }}"
        dest: "{{ _home }}/.cassandra/cqlshrc"
        owner: "{{ item.os_user }}"
        mode: "0600"
      loop: "{{ cassandra_cqlsh_credentials }}"
      loop_control:
        label: "{{ item.os_user }}"
      no_log: "{{ cassandra_version == '40x' }}"
      diff: false

    - name: Write ~/.cassandra/credentials (4.1+)
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', 'cqlsh_credentials.j2') }}"
        dest: "{{ _home }}/.cassandra/credentials"
        owner: "{{ item.os_user }}"
        mode: "0600"
      loop: "{{ cassandra_cqlsh_credentials }}"
      no_log: true
      diff: false
      when: cassandra_version != '40x'

# Remote JMX over TLS: nodetool --ssl adds the lines of ~/.cassandra/nodetool-ssl.properties of the user running it
# to its JVM options: root's (the collection's nodetool calls under sudo), and the one of the account Cassandra runs as
# (Medusa). It trusts the node's certificate (the truststore, else the keystore itself), and shows the keystore's with
# need_client_auth
- name: Write nodetool's JMX TLS settings
  when: cassandra_jmx_ssl_enabled | bool
  vars:
    _home: "{{ ansible_facts.getent_passwd[item.os_user][4] }}"
    _users: "{{ [{'os_user': 'root'}, {'os_user': _cassandra_config_perm_settings.user}] | unique }}"
  block:
    - name: Find the home directories of root and the account Cassandra runs as
      ansible.builtin.getent:
        database: passwd
        key: "{{ item.os_user }}"
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.os_user }}"

    - name: Create their ~/.cassandra
      ansible.builtin.file:
        path: "{{ _home }}/.cassandra"
        state: directory
        owner: "{{ item.os_user }}"
        mode: "0700"
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.os_user }}"

    - name: Write their ~/.cassandra/nodetool-ssl.properties
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', 'nodetool-ssl.properties.j2') }}"
        dest: "{{ _home }}/.cassandra/nodetool-ssl.properties"
        owner: "{{ item.os_user }}"
        mode: "0600"
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.os_user }}"
      no_log: true
      diff: false
