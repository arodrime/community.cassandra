---
minor_changes:
  - "add_node, replace_node, add_datacenter, create_cluster playbooks - preparing the new nodes says one line per step (repository, install, java, os tuning, data disks, config, firewall, medusa, seeds), the nodes with the same outcome together, in the progress colour: ``node4, node5  install  cassandra 5.0.9 (installed now)``, ``config  3 files written``, ``firewall  off (cassandra_manage_firewall: false)``; ``would ...`` under ``--check``. The lines come from each role's change report; the full lists per role and node stay for ``-v`` and ``cassandra_change_report_dir`` (create_cluster no longer prints them without ``-v``). The data disks' summary follows only when something was set, a line to act on (not tuned yet, a restart to take it), a warning or ``-v``."
  - "create_cluster playbook - a phase line (``Preparing the nodes (...)...``) before the nodes are prepared (not under ``--check``, as the other phase lines of a change)."
  - "cassandra_config - an old system keyspace left outside the data directories of a new node is a ``WARNING``, once with its nodes: why it does not matter for the run (Cassandra does not read it, the node starts empty) and what to delete by hand afterwards, its keyspace directories if no other Cassandra on the host uses it (``reset_node`` does not empty it)."
