bugfixes:
  - >-
    apply_config, upgrade - a package update of Cassandra (apply_config's move to a newer release, the upgrade) writes cassandra_linux's limits file
    (``/etc/security/limits.d/cassandra.conf``) again after it: the RPM ships that file as a plain one,
    and its update put the package's own (``nofile 100000``) in place of the inventory's, which the next apply_config
    --check then found.
