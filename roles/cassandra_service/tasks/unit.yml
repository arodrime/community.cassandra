---
# Checked before the unit is written: a restart writes it before draining,
# so an account that cannot read the config stops the run with the node running
- name: Check the account Cassandra runs as can read the config
  ansible.builtin.include_tasks: account_check.yml

# a running node started another way (e.g. imported): what it runs with, before the unit changes
# (a later run then knows the change waits for a restart); its content only, not its mode
- name: Tell whether the unit changes
  ansible.builtin.template:
    src: cassandra.service.j2
    dest: /etc/systemd/system/cassandra.service
  check_mode: true
  diff: false  # shown by the write
  register: cassandra_service_unit_planned
  when:
    - _cassandra_service_own_unit | bool
    - not ansible_check_mode

# The package's init script (package_script): no unit written, its environment (cassandra_service_environment) in a
# drop-in of the unit systemd generates for it, which systemd applies as to any unit (checked on EL 9, systemd 252:
# the script and the JVM get the variables). Only the environment: the limits of the unit do not hold there, the
# script starts Cassandra through runuser, whose session takes them from pam_limits. Named to come after the node's
# own drop-ins (override.conf...): its values win. Applied at the next start, as a unit written. None set, or the
# role's unit (whose environment it would override): the roles' drop-in removed
- name: Tell whether the environment of the package's init script changes
  when: cassandra_service_unit_manage | bool
  block:
    - name: Tell whether the drop-in changes
      ansible.builtin.template:
        src: cassandra-environment.conf.j2
        dest: "{{ _cassandra_service_environment_dropin }}"
      check_mode: true
      diff: false  # shown by the write
      register: cassandra_service_dropin_planned
      when:
        - _cassandra_service_dropin_wanted | bool
        - not ansible_check_mode

    - name: Look for the drop-in (to remove, or to report)
      ansible.builtin.stat:
        path: "{{ _cassandra_service_environment_dropin }}"
        get_checksum: false
      register: cassandra_service_dropin_found

# a running node: what it runs with, before the unit or its environment changes (a later run then knows the change
# waits for a restart)
- name: Record the config the running Cassandra started with
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_config
    tasks_from: config_seed.yml
  when: >-
    cassandra_service_unit_planned is changed or cassandra_service_dropin_planned is changed
    or cassandra_service_dropin_found.stat.exists | default(false) and not _cassandra_service_dropin_wanted | bool
       and not ansible_check_mode

# Same name as the package's init script: systemd prefers a native unit
# over the SysV-generated one, so service/systemctl both use this.
- name: Install the cassandra systemd unit
  ansible.builtin.template:
    src: cassandra.service.j2
    dest: /etc/systemd/system/cassandra.service
    mode: "0644"
  register: cassandra_service_unit
  when: _cassandra_service_own_unit | bool

- name: Write the environment of the package's init script
  when: cassandra_service_unit_manage | bool
  block:
    - name: Make the drop-in directory of its unit
      ansible.builtin.file:
        path: "{{ _cassandra_service_environment_dropin | dirname }}"
        state: directory
        mode: "0755"
      when: _cassandra_service_dropin_wanted | bool

    - name: Write the drop-in with its environment
      ansible.builtin.template:
        src: cassandra-environment.conf.j2
        dest: "{{ _cassandra_service_environment_dropin }}"
        mode: "0644"
      register: cassandra_service_dropin
      when: _cassandra_service_dropin_wanted | bool

    - name: Remove the drop-in when no environment is set, or with the role's unit
      ansible.builtin.file:
        path: "{{ _cassandra_service_environment_dropin }}"
        state: absent
      register: cassandra_service_dropin_removed
      when: not _cassandra_service_dropin_wanted | bool

# a restart for a change of the unit (cassandra_service_restart_on_change), as for the role's own
- name: Note whether the unit or its environment changed
  ansible.builtin.set_fact:
    _cassandra_service_unit_changed: >-
      {{ cassandra_service_unit is changed or cassandra_service_dropin is changed
         or cassandra_service_dropin_removed is changed }}
