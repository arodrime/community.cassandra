---
# Checks one cluster (an inventory group) before changing it:
#   ansible-playbook -i inventory community.cassandra.preflight
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo), as the operations: the playbook asks for it
# itself, no -b needed.
# Fails on settings that must match across the cluster, on rack layouts the
# token allocator refuses and on mixed Cassandra versions; warns on seed layouts
# that are only risky.
- name: Check the cluster's group
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
  tasks:
    - name: Check the cluster's group
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: hosts_check.yml

# The nodes of the cluster (without the hosts marked cassandra_node_state:
# absent), and the nodes decommission_node removes (cassandra_target_nodes).
# The playbook that imports this one says what its cassandra_target_nodes are
# (_cassandra_preflight_target): add (add_node, add_datacenter, replace_node),
# leave (decommission_node), reset (reset_node), dead (remove_dead_node) or
# canary (upgrade); unset, the playbook takes none (target_nodes_check.yml).
- name: Cassandra preflight checks
  hosts: >-
    {{ 'localhost:!localhost' if _cassandra_preflight_skip | default(false) | bool
       else (query('community.cassandra.cassandra_nodes')
             + (query('ansible.builtin.inventory_hostnames', cassandra_target_nodes)
                if _cassandra_preflight_target | default('') == 'leave' and cassandra_target_nodes | default('') | length > 0 else [])
               | select('in', groups[lookup('community.cassandra.cassandra_hosts')]) | list) | unique }}
  gather_facts: true
  become: true
  tasks:
    # also run by the first play, which --limit skips
    - name: Check cassandra_target_nodes
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: target_nodes_check.yml

    # An unreachable host would silently be left out of the rest of the run
    - name: Every node answers
      ansible.builtin.assert:
        that: _unreachable | length == 0 or cassandra_allow_down_nodes | default(false) | bool
        fail_msg: >-
          {{ _unreachable | join(', ') }} did not answer: the playbook stops here, nothing was done. Restart it first (the server, then Cassandra). If the server can't be recovered, replace
          the node (replace_node); removing it for good (remove_dead_node) is the rare last resort.
          -e cassandra_allow_down_nodes=true goes on without it (the cluster health checks then need
          cassandra_service_health_force too).
        quiet: true
      vars:
        _unreachable: "{{ ansible_play_hosts_all | difference(ansible_play_hosts) }}"
      run_once: true

    - name: Check the run has root on the nodes
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: root_check.yml

    - name: Going on without the nodes that did not answer
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: note.yml
      vars:
        _note: >-
          WARNING  {{ ansible_play_hosts_all | difference(ansible_play_hosts) | community.cassandra.cassandra_node_list }}
          did not answer, going on without them (cassandra_allow_down_nodes). Fewer replicas are up: QUORUM reads and
          writes may fail.
      when: ansible_play_hosts_all | difference(ansible_play_hosts) | length > 0

    - name: Read this node's settings
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: node_facts.yml
        public: true

    # First: the other checks read the inventory's settings, which an inventory
    # not loaded leaves to the role defaults
    - name: Read the cluster from a running node
      run_once: true
      block:
        - name: Find a running node to read the cluster from
          ansible.builtin.set_fact:
            _cassandra_preflight_running_nodes: "{{ _running }}"
            _cassandra_preflight_from: "{{ (_running | reject('in', _aside) | list + _running) | first | default(inventory_hostname) }}"
            # the cluster's nodes the run leaves out (--limit), when none of its own runs
            _cassandra_preflight_peers: >-
              {{ query('community.cassandra.cassandra_nodes') | reject('in', ansible_play_hosts_all + _aside) | list }}
          vars:
            _running: >-
              {{ ansible_play_hosts | map('extract', hostvars) | selectattr('_cassandra_preflight_running')
                 | map(attribute='inventory_hostname') | list }}
            # a node being added or reset may run alone, another cluster's way (e.g. the package's own instance)
            _aside_pattern: >-
              {{ [cassandra_target_nodes | default([])] | flatten | select | join(',')
                 if _cassandra_preflight_target | default('') in ['add', 'reset'] else '' }}
            _aside: "{{ query('ansible.builtin.inventory_hostnames', _aside_pattern) if _aside_pattern else [] }}"

        # Also waits for a node that is still starting (JMX not listening yet); another
        # failure (e.g. a JMX login refused) is told by the check below
        - name: Read the cluster description from a running node
          ansible.builtin.command: "{{ _cassandra_service_nodetool }} describecluster"
          register: cassandra_preflight_describe
          until: >-
            cassandra_preflight_describe.rc == 0
            or 'ConnectException' not in cassandra_preflight_describe.stdout ~ cassandra_preflight_describe.stderr
          failed_when: false
          retries: 12
          delay: 10
          changed_when: false
          delegate_to: "{{ _cassandra_preflight_from }}"
          check_mode: false  # read-only; --check needs it too
          no_log: "{{ cassandra_jmx_password | length > 0 }}"
          when: _cassandra_preflight_running_nodes | length > 0

    # --limit may leave out every running node (e.g. only a node that could
    # not start): then read on another node of the group
    - name: Check the running node belongs to this cluster
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: cluster_name.yml
      vars:
        cassandra_service_cluster_describe: >-
          {{ {'from': _cassandra_preflight_from, 'stdout': cassandra_preflight_describe.stdout,
              'stderr': cassandra_preflight_describe.stderr, 'rc': cassandra_preflight_describe.rc}
             if _cassandra_preflight_running_nodes | length > 0 else {} }}
        cassandra_service_cluster_candidates: >-
          {{ [] if _cassandra_preflight_running_nodes | length > 0 else _cassandra_preflight_peers }}

    # before any operation (apply_config writes the config before it restarts);
    # a node refused stops the whole run, not just that node
    - name: Check the account Cassandra runs as can read the config
      any_errors_fatal: true
      block:
        - name: Check the account Cassandra runs as can read the config
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: account_check.yml
          vars:
            _cassandra_account_must_exist: false  # a new node gets the package (and its user) later

    # a typo, or a name from another version of the collection, is otherwise silently ignored
    - name: Find the cassandra_* variables no role or playbook knows
      ansible.builtin.set_fact:
        _cassandra_preflight_unknown: >-
          {{ query('ansible.builtin.varnames', '^cas+andra_')
             | community.cassandra.cassandra_unknown_names(_cassandra_playbook_variables) }}

    - name: Warn about them
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: note.yml
      vars:
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _note: >-
          {%- set out = [] -%}
          {%- for v in ansible_play_hosts | map('extract', hostvars, '_cassandra_preflight_unknown') | map('list') | flatten | unique | sort -%}
          {%-   set hosts = [] -%}
          {%-   for h in ansible_play_hosts if v in hostvars[h]._cassandra_preflight_unknown -%}{%- set _ = hosts.append(h) -%}{%- endfor -%}
          {%-   set close = hostvars[hosts | first]._cassandra_preflight_unknown[v] -%}
          {%-   set _ = out.append('WARNING  ' ~ v ~ ' (set for ' ~ hosts | community.cassandra.cassandra_node_list ~ ') is not known to this'
                                   ~ ' collection: its roles and playbooks do not read it' ~ ((' (did you mean ' ~ close ~ '?)') if close else '')) -%}
          {%- endfor -%}
          {{ out | join(_nl) }}
      when: ansible_play_hosts | map('extract', hostvars, '_cassandra_preflight_unknown') | map('list') | flatten | length > 0

    # cassandra_seed_True / cassandra_seed_False, used by the other playbooks
    - name: Group seeds and other nodes
      ansible.builtin.group_by:
        key: "cassandra_seed_{{ _cassandra_service_is_seed | bool }}"
      changed_when: false

    - name: Settings that must match on every node
      ansible.builtin.assert:
        that: _values | unique | length == 1
        fail_msg: >-
          {{ item }} differs across the cluster:
          {{ dict(ansible_play_hosts | zip(_values)) }}
        quiet: true
      vars:
        _values: "{{ ansible_play_hosts | map('extract', hostvars, ['_cassandra_preflight', item]) | map('string') | list }}"
      loop:
        - cassandra_cluster_name
        - cassandra_version
        - cassandra_num_tokens
        - cassandra_partitioner
        - cassandra_endpoint_snitch
        - cassandra_allocate_tokens_for_local_replication_factor
        - _cassandra_service_seeds
      run_once: true

    # The seed rule (help says the same): 2 or 3 seeds per datacenter, on different racks; one line per
    # datacenter when one breaks it, with a seed list that follows it
    - name: Seed layout
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: note.yml
      vars:
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _deferred: "{{ _cassandra_notes_deferred | default(false) | bool }}"
        _note: >-
          {{ (_layout.lines | reject('search', '  ok$') | list if _deferred else _layout.lines) | join(_nl)
             ~ ((_nl ~ '  suggested in the group_vars of ' ~ _cluster ~ ': cassandra_seeds: ' ~ _layout.suggested | to_json
                 ~ (' (update the inventory: topology then applies it live)' if _deferred
                    else (_nl ~ '  then apply it live: ' ~ _change_seeds))) if _layout.problems else '') }}
        _change_seeds: >-
          {{ 'change_seeds' | community.cassandra.cassandra_command(
               inventory=ansible_inventory_sources,
               default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
               hosts=cassandra_hosts | default(''), cwd=lookup('ansible.builtin.env', 'PWD')) }}
        _cluster: "{{ lookup('community.cassandra.cassandra_hosts') }}"
        _layout: >-
          {{ ansible_play_hosts | map('extract', hostvars, ['_cassandra_preflight', 'layout']) | list
             | community.cassandra.cassandra_seed_layout }}
      when: (_layout.problems + _layout.notes) | length > 0

    # Once the cluster exists, every seed must be a live member: a stale seed
    # (decommissioned node, old IP) breaks bootstraps. A host the run adds
    # (add_node's cassandra_target_nodes; topology: any host of the group)
    # joins with the other seeds and is made a seed once up (cassandra_service join_seeds.yml)
    - name: Check the running cluster
      run_once: true
      when: _cassandra_preflight_running_nodes | length > 0
      module_defaults:
        community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
      vars:
        _from: "{{ _cassandra_preflight_from }}"
      block:
        - name: Read the ring from a running node
          community.cassandra.cassandra_status:
          register: cassandra_preflight_status
          delegate_to: "{{ _from }}"
          failed_when: not cassandra_preflight_status.cluster_status

        - name: Every seed is up
          ansible.builtin.assert:
            # a cluster about to be wiped: a seed of the group, up or not; a resumed rolling run: a member
            # drained or stopped by the interrupted run; apply_config: a member of this run not running, which
            # it writes (each node's own check before it stops on any other)
            that: >-
              _addr in _up or (_cassandra_preflight_cluster_reset | default(false) | bool and _host | length > 0)
              or (cassandra_rolling_resume | default(false) | bool and _addr in _all)
              or (_cassandra_preflight_seeds_down_ok | default(false) | bool and _addr in _all and _addr in _stopped)
              or (_seed_added | length > 0 and (_addr not in _all or _addr in _joining))
            fail_msg: >-
              Seed {{ item }} ({{ _addr }}) is not an up member of the cluster (nodetool status on {{ _from }}).
              {{ (_absent | first ~ ' is marked cassandra_node_state: absent: take it out of cassandra_seeds in the'
                  ~ ' inventory (topology then drops it from the seed lists before it removes it).') if _absent
                 else ('A host not in the ring yet: add it with add_node (or topology), which makes it a seed once it has'
                  ~ ' joined.') if _host and _addr not in _all
                 else 'Bring it back up, or take it out of cassandra_seeds (change_seeds) if it is gone.' if _addr in _all
                 else 'It is not a node of this cluster: check cassandra_seeds.' }}
            quiet: true
          vars:
            # the hosts this run adds: cassandra_target_nodes (add_node), _cassandra_preflight_adding (topology)
            _new_nodes: "{{ _nn if _nn is string else _nn | join(',') }}"
            _nn: "{{ cassandra_target_nodes | default('', true) if _cassandra_preflight_target | default('') == 'add' else '' }}"
            _adding: >-
              {{ (query('ansible.builtin.inventory_hostnames', _new_nodes) if _new_nodes else [])
                 + _cassandra_preflight_adding | default([]) }}
            # a host marked absent, out of this play: by its name or ansible_host
            _absent: >-
              {%- set out = [] -%}
              {%- for h in query('community.cassandra.cassandra_nodes', state='absent')
                    if item | regex_replace(':[0-9]+$', '') in [h, hostvars[h].ansible_host | default(h)] -%}
              {%-   set _ = out.append(h) -%}
              {%- endfor -%}
              {{ out }}
            # a bootstrap an earlier run started (UJ): waited for, made a seed after
            _joining: >-
              {{ cassandra_preflight_status.cluster_status.values() | map(attribute='nodes') | flatten
                 | selectattr('state', 'equalto', 'J') | map(attribute='address') | list }}
            _seed_added: >-
              {{ ansible_play_hosts | select('in', _adding) | map('extract', hostvars)
                 | selectattr('_cassandra_service_seed_entry', 'equalto', item) | list }}
            _up: >-
              {{ cassandra_preflight_status.cluster_status.values() | map(attribute='nodes') | flatten
                 | selectattr('status', 'equalto', 'U') | selectattr('state', 'in', ['N', 'M']) | map(attribute='address') | list }}
            _host: >-
              {{ ansible_play_hosts | map('extract', hostvars) | selectattr('_cassandra_service_seed_entry', 'equalto', item)
                 | map(attribute='_cassandra_preflight.address') | list }}
            _addr: "{{ _host | first | default(item) }}"
            _all: >-
              {{ cassandra_preflight_status.cluster_status.values() | map(attribute='nodes') | flatten
                 | map(attribute='address') | list }}
            _stopped: >-
              {{ ansible_play_hosts | map('extract', hostvars) | rejectattr('_cassandra_preflight_running')
                 | map(attribute='_cassandra_preflight.address') | list }}
          loop: "{{ _cassandra_service_seeds }}"

        # Streaming and schema changes between versions are not supported;
        # an upgrade in progress sets cassandra_allow_mixed_versions itself
        - name: One Cassandra version in the cluster
          ansible.builtin.assert:
            that: _versions | length <= 1 or cassandra_allow_mixed_versions | default(false) | bool
            fail_msg: >-
              The cluster runs several Cassandra versions ({{ _versions | join('; ') }}): an upgrade is not finished.
              Adding or removing nodes and schema changes are not supported until every node runs the same version.
              Finish the upgrade first, or set cassandra_allow_mixed_versions: true at your own risk
              (bootstrap streaming between versions can fail or leave the new node incomplete).
            quiet: true
          vars:
            _section: "{{ (cassandra_preflight_describe.stdout ~ '\\n').split('Database versions:')[1:] | first | default('') }}"
            _versions: "{{ _section.split('\\n\\n') | first | regex_findall('(?m)^\\s+(\\S+: \\[.*\\])$') }}"

    # A node up and normal in the ring is a member: the mark of a bootstrap add_node started there (a wait
    # that stopped before the end) goes, or a removal of the node later would read it as a failed bootstrap
    # (cassandra_service reset_node_plan.yml)
    - name: Remove the mark of a bootstrap that went through
      ansible.builtin.file:
        path: "{{ _cassandra_service_bootstrap_mark | default('/var/lib/cassandra/.ansible_bootstrap_started') }}"
        state: absent
      when:
        - cassandra_preflight_status.cluster_status is defined
        - _cassandra_preflight.ring_address | default('') in _un
      vars:
        _un: >-
          {{ cassandra_preflight_status.cluster_status.values() | map(attribute='nodes') | flatten
             | selectattr('status', 'equalto', 'U') | selectattr('state', 'equalto', 'N') | map(attribute='address') | list }}

    # The token allocator refuses a node that joins a rack already in the ring
    # when the datacenter's ring has more than 1 rack but fewer than its
    # replication factor hint. The ring counts down nodes too (a dead node's
    # rack is still there for remove_dead_node and replace_node), and each new
    # node joins the ring the next one sees (in the order of add_node's
    # cassandra_target_nodes, else in create_cluster's start order:
    # cassandra_start_order). A
    # replacement allocates nothing (it takes the dead node's tokens). A
    # datacenter not in the ring yet (or no node running): the inventory's
    # racks, 1 or at least the hint. One token per node: no allocator (the
    # tokens come from initial_token).
    - name: Racks per datacenter
      ansible.builtin.assert:
        that: _refused | length == 0
        fail_msg: >-
          {{ (('The token allocator would refuse, in ' ~ item ~ ': ' ~ _refused | join('; ')
               ~ ' (a rack already in the ring, which has more than 1 rack but fewer than the hint)')
              if _ring_racks else (item ~ ' has ' ~ _inventory_racks | length ~ ' racks (' ~ _inventory_racks | join(', ') ~ ')'))
             ~ ': use 1 rack or at least ' ~ _hint ~ ' (cassandra_allocate_tokens_for_local_replication_factor)' }}
        quiet: true
      vars:
        _hint: "{{ cassandra_allocate_tokens_for_local_replication_factor }}"
        # create_cluster's reset: the ring there now is wiped, the nodes start as a new cluster
        _ring_nodes: >-
          {{ [] if _cassandra_preflight_cluster_reset | default(false) | bool
             else ((cassandra_preflight_status.cluster_status | default({}, true))[item] | default({})).nodes | default([]) }}
        _ring_racks: "{{ _ring_nodes | map(attribute='rack') | unique | list }}"
        # the nodes to decommission (cassandra_target_nodes) join nothing
        _inventory: >-
          {{ ansible_play_hosts | reject('in', query('ansible.builtin.inventory_hostnames', cassandra_target_nodes)
                                       if _cassandra_preflight_target | default('') == 'leave'
                                          and cassandra_target_nodes | default('') | length > 0 else [])
             | map('extract', hostvars, '_cassandra_preflight') | selectattr('cassandra_dc', 'equalto', item) | list }}
        _inventory_racks: "{{ _inventory | map(attribute='cassandra_rack') | unique | list }}"
        # the hosts of the datacenter not in its ring yet, refused in turn
        _refused: >-
          {%- set out = [] -%}
          {%- if not _ring_racks -%}
          {%-   if _inventory_racks | length != 1 and _inventory_racks | length < _hint | int -%}
          {%-     set _ = out.append('the inventory') -%}
          {%-   endif -%}
          {%- elif cassandra_replace_address | default('', true) == '' -%}
          {%-   set racks = _ring_racks | list -%}
          {%-   set new = _inventory | rejectattr('address', 'in', _ring_nodes | map(attribute='address') | list) | list -%}
          {%-   set order = [] -%}
          {%-   set nn = cassandra_target_nodes | default('', true) if _cassandra_preflight_target | default('') == 'add' else '' -%}
          {%-   set nn = nn | join(',') if nn is iterable and nn is not string else nn | string -%}
          {%-   set _ = order.extend(query('ansible.builtin.inventory_hostnames', nn) if nn
                                     else ansible_play_hosts | map('extract', hostvars, '_cassandra_preflight') | list
                                          | community.cassandra.cassandra_start_order(_hint,
                                              cassandra_preflight_status.cluster_status | default({}, true))) -%}
          {%-   set ordered = [] -%}
          {%-   for n in order -%}
          {%-     for h in new | selectattr('layout.name', 'equalto', n) -%}
          {%-       if h not in ordered -%}{%- set _ = ordered.append(h) -%}{%- endif -%}
          {%-     endfor -%}
          {%-   endfor -%}
          {%-   for h in ordered + new | reject('in', ordered) | list -%}
          {%-     if h.cassandra_rack in racks and racks | length != 1 and racks | length < _hint | int -%}
          {%-       set _ = out.append(h.layout.name ~ ' in ' ~ h.cassandra_rack ~ ' when the ring has ' ~ racks | join(', ')) -%}
          {%-     elif h.cassandra_rack not in racks -%}
          {%-       set _ = racks.append(h.cassandra_rack) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%- endif -%}
          {{ out }}
      loop: "{{ ansible_play_hosts | map('extract', hostvars, ['_cassandra_preflight', 'cassandra_dc']) | unique | list }}"
      when:
        - _hint | string not in ['', 'None']
        - cassandra_num_tokens | int > 1
      run_once: true
