minor_changes:
  - "cassandra_config - ``cassandra_jmx_remote_password_file`` and ``cassandra_jmx_remote_access_file``: where ``cassandra-env.sh`` points the JVM for the remote JMX users and where the role writes them (default ``/etc/cassandra/jmxremote.password`` and ``.access``, as before)."
  - "import_cluster - the remote JMX password and access files are the ones the JVM reads, whatever their names: from the running JVM's arguments, else ``cassandra-env.sh`` (its variables and ``$CASSANDRA_CONF`` expanded; a path only the shell knows, such as a variable it does not set, is reported and its users not imported), else the JVM options files. Their users go to ``secrets.yml``, their paths to ``cassandra_jmx_remote_password_file`` and ``_access_file``. A JMX authentication by JAAS is said in the report, not imported."
