bugfixes:
  - "rolling operations (rolling_restart, apply_config, add_node...) - the table of a stopped run no longer says ``not done`` for the node it stopped at when that node was touched: its row says what was done to it (``restarted; cluster health check failed``, ``restart started, not finished; ...``, or ``not touched; ...`` when the check before its action stopped the run). ``restarted`` only once the node was seen ``NORMAL`` again (``restart run, not waited for`` when ``cassandra_service_wait_for_normal`` is false); under ``--check``, ``nothing changed (--check)``. rolling_restart by rack says the same of its rack's nodes (``restart started, not finished; not back in Mode NORMAL in time``). A node the run had not got to is ``not touched``, no longer ``not touched (not reached)`` (said of a host Ansible did not reach)."
minor_changes:
  - "rolling operations - a stopped run ends with a block of 79 columns at most, its verdict first (``STOPPED  rolling_restart  prod  at node2``), the cause under it one fact per line (``Why:  node4 (10.0.0.4, r1) is DN, seen from node1 and node2``, ``waited 10m29s (cassandra_service_health_timeout: 600s)``), the nodes' table, then, after a blank line, ``WAY OUT`` in numbered steps (``1. bring node4 back to UN (its host and/or Cassandra)``: down in gossip says nothing of its host; ``2. resume:`` with its command and the progress file under it); what to do if the node is lost for good in a block of its own after it (``IF node4 IS LOST FOR GOOD``: ``replace_node`` with the conditions its playbook states, a blank host and the dead one out of the inventory, a dead seed out of ``cassandra_seeds`` first; ``remove_dead_node`` as the last resort, the dead host out of the inventory first); each command cut between its arguments, `` \\`` at the end of each line but its last (it pastes as one command)."
