minor_changes:
  - >-
    cassandra_repository, cassandra_install - ``cassandra_install_method: system`` installs Cassandra from the
    repositories the node has already (a Satellite, a site mirror): no repository added or removed.
  - >-
    cassandra_install - ``cassandra_cqlsh_source: external`` names another cqlsh (``cassandra_cqlsh_command``, which
    must then be set): nothing is written for the package's cqlsh. Default ``package`` as before.
  - >-
    import_cluster - the repositories and cqlsh are imported instead of left aside (no more
    ``cassandra_repository_manage: false`` or ``cassandra_cqlsh_python_manage: false`` on nodes set up another way):
    ``system`` for a Cassandra a configured repository offers or repository files of the node's own,
    ``cassandra_cqlsh_source: external`` when the inventory names another cqlsh (its path never written by the
    import). The self-check stops on a repository file the roles would add or remove, and on a cqlsh that does not
    start (the roles would give it a Python), with the way out.
