---
# apply_config's restart of a node moving to a newer release of its series (action_restart.yml, Cassandra stopped):
# its package updated (package_update.yml, as the upgrade does; with the repository and packages the plan showed;
# a Java move installed before the stop), then its config written again (a package may put its own files in place of the
# ones it ships); started next, version_verify.yml checks the release it runs.
# A mark in /run (as os_window.yml's, written before the stop: action_restart.yml) lets a resumed run start a node
# left stopped here. A failure with the release it ran still installed (its package unchanged, and none of its files
# changed by the failed update: rpm -V / dpkg --verify, before and after): Cassandra started again on it, the mark
# removed, the run stopped; else (the package changed, files of it changed, or not known) left stopped, the mark
# kept, the run stopped. Either way one way out: fix, then resume (which starts it, the package updated first if
# it is still to do). The package manager's own error lines are said (its module says only that it failed).
# Under --check nothing was stopped: no mark written or removed, no start, never "left stopped" or "started again".
- name: Update the release with Cassandra stopped
  vars:
    # the release installed when Cassandra was stopped (the one it ran, or one updated by other means since its start)
    _running: >-
      {{ (cassandra_apply_config_version | default({})).installed
         | default((cassandra_apply_config_version | default({})).running | default('')) }}
    # (read again in the rescue; not read: not known, the node left stopped)
    _installed: >-
      {{ ((cassandra_window_packages.ansible_facts.packages | default({})).get('cassandra', [{}]) | first).version | default('')
         | regex_replace('^([0-9]+\.[0-9]+\.[0-9]+).*$', '\1') }}
    # the files of the package the failed update changed (differing from it after, not before); not known: none read
    _touched: >-
      {{ cassandra_window_verify.stdout | default('') | community.cassandra.cassandra_package_verify
         | reject('in', cassandra_window_before.stdout | default('') | community.cassandra.cassandra_package_verify)
         | list }}
    # (and the files of the package's directories written since the update started: a file new in the target release,
    # or one that differed before; "unknown": not read, or under --check: no mark written)
    _written: "{{ cassandra_window_written.stdout_lines | default(['unknown']) }}"
    _verified: >-
      {{ cassandra_window_before.stdout_lines is defined and cassandra_window_verify.rc | default(2) in [0, 1]
         and 'unknown' not in _written }}
    # the release it ran still installed, none of its files changed, the failure not the config's write (the files
    # half written), no Cassandra JVM left (one the unit did not start): started again
    _back: >-
      {{ _running != '' and cassandra_window_packages.ansible_facts.packages is defined and _installed == _running
         and _verified | bool and not _touched and not _written and not _cassandra_window_config | default(false) | bool
         and cassandra_window_jvm.rc | default(0) == 1 }}
  block:
    # what an update that fails changed is told by these: the files of the package that differ from it before
    # (changed by hand or by other means: not the update's), a mark of the time it starts holding the list of the
    # package's files (a file of their directories written since, not one of them: the update's), the size of dnf's
    # rpm log (its lines since: the update's)
    - name: Note the files of the package and the time before the update
      ansible.builtin.shell: |
        {{ '' if ansible_check_mode else ('{ dpkg -L cassandra; } > /run/cassandra-apply-config.update 2>/dev/null'
                                          if ansible_facts['os_family'] == 'Debian' else
                                          '{ rpm -ql cassandra; } > /run/cassandra-apply-config.update 2>/dev/null') }}
        echo "rpmlog=$(stat -c %s /var/log/dnf.rpm.log 2>/dev/null || echo 0)"
        {{ 'dpkg --verify cassandra' if ansible_facts['os_family'] == 'Debian' else 'rpm -V cassandra' }}
        exit 0
      register: cassandra_window_before
      changed_when: false
      check_mode: false  # a mark in /run (not under --check), reads

    - name: Note that the package is being updated
      ansible.builtin.set_fact:
        _cassandra_window_config: false

    # (installed already, by other means since Cassandra started: nothing to install, its start runs it)
    - name: Update the Cassandra package
      ansible.builtin.include_tasks: package_update.yml
      vars:
        cassandra_install_java: false  # (a Java move: installed before the stop, java_install.yml)
      when: _running != cassandra_package_version

    - name: Note that the config is being written
      ansible.builtin.set_fact:
        _cassandra_window_config: true
        _cassandra_op_stage: writing  # (the stop's row: how far it went)

    - name: Write the config again
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
      vars:
        cassandra_config_confirm: false
        _cassandra_config_no_question: true  # the run's own question covered it
        _cassandra_config_no_newsize_warning: true
        _cassandra_config_no_restart_warning: true
        _cassandra_config_quiet: true
        _cassandra_change_report_quiet: true

    - name: Note that the config is written
      ansible.builtin.set_fact:
        _cassandra_op_stage: written

    # (the package's own limits file put back by its update, in place of cassandra_linux's: the next run would find it
    # changed)
    - name: Write the limits file of the cassandra user again
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_linux
        tasks_from: limits.yml
      when:
        - _running != cassandra_package_version
        - cassandra_linux_manage | default(true) | bool

    - name: Forget the mark of the update
      ansible.builtin.file:
        path: /run/cassandra-apply-config.update
        state: absent
      when: not ansible_check_mode  # (none written under --check)
  rescue:
    # (noted now: the start below has a failure of its own, which would take the place of this one; secrets and a
    # URL's login masked)
    - name: Note what failed
      ansible.builtin.set_fact:
        _cassandra_window_cause: >-
          {{ ansible_failed_result | default({}) | community.cassandra.cassandra_failure_cause(ansible_failed_task.name | default('')) }}
        # (its output: the package manager's own error lines when it has no log of them)
        _cassandra_window_failure: "{{ ansible_failed_result | default({}) | dict2items | selectattr('key', 'in', ['stderr', 'stdout', 'failures']) | items2dict }}"

    - name: Read the installed packages
      ansible.builtin.package_facts:
      register: cassandra_window_packages
      ignore_errors: true  # (not read: the release installed is not known, Cassandra left stopped)
      check_mode: false

    # (no shell: a pipe would hide its exit code) the files of the package installed that differ from it now
    - name: Check the files of the Cassandra package installed
      ansible.builtin.command:
        argv: "{{ ['dpkg', '--verify', 'cassandra'] if ansible_facts['os_family'] == 'Debian' else ['rpm', '-V', 'cassandra'] }}"
      register: cassandra_window_verify
      changed_when: false
      failed_when: false  # (not read: Cassandra left stopped)
      check_mode: false

    # (by their change time: a file new in the target release, unseen by the old package's check, on the classpath
    # of the old one; /etc and /var aside: the config and the package's own .rpmnew files). Regular files only, in
    # the directories of the old package's regular files (the list in the mark: never / of dpkg -L's "/.", nor a
    # directory whose entries changed: cassandra_install's policy-rc.d, written and removed in /usr/sbin on
    # Debian, is no file of the update), not its own files: those the package check above tells (dpkg's rollback of
    # a failed unpack moves them back, their change time new, their content the old package's). The mark removed
    # once read (not under --check); an empty list: not known
    - name: Look for files of the package's directories written since the update started
      ansible.builtin.shell: |
        m=/run/cassandra-apply-config.update
        [ -s $m ] || { echo unknown; {{ '' if ansible_check_mode else 'rm -f $m;' }} exit 0; }
        grep -v '^/etc/' $m | grep -v '^/var/' | while read -r f; do [ -f "$f" ] && dirname "$f"; done | sort -u \
          | while read -r d; do
              [ "$d" = / ] || find "$d" -mindepth 1 -maxdepth 1 -type f -cnewer $m ! -name policy-rc.d -print
            done | sort -u | awk 'NR == FNR { own[$0]; next } !($0 in own)' $m - | head -20
        {{ '' if ansible_check_mode else 'rm -f $m' }}
        exit 0
      register: cassandra_window_written
      changed_when: false
      check_mode: false  # reads (the mark removed: not under --check)

    # dnf's module says "Failed to install some of the specified packages", rpm's reason (an unpack error) is in its
    # log: its lines since the update started (apt's module returns dpkg's output: read from the failure itself)
    - name: Read the package manager's log of the update
      ansible.builtin.command:
        argv: [tail, -c, "+{{ (cassandra_window_before.stdout_lines | default([]) | select('match', '^rpmlog=')
                                | first | default('rpmlog=0'))[7:] | int + 1 }}", /var/log/dnf.rpm.log]
      register: cassandra_window_rpm_log
      changed_when: false
      failed_when: false  # (none: the failure's own words)
      check_mode: false
      when: ansible_facts['os_family'] != 'Debian'

    # (pgrep: no shell, whose own command line would match)
    - name: Look for a Cassandra JVM
      ansible.builtin.command:
        argv: [pgrep, -f, org.apache.cassandra.service.CassandraDaemon]
      register: cassandra_window_jvm
      changed_when: false
      failed_when: false
      check_mode: false

    # (its own failure said in the stop below, with the way out: the mark kept, a resume starts it; under --check
    # nothing was stopped)
    - name: Start Cassandra again on the release it ran
      when:
        - _back | bool
        - not ansible_check_mode
      block:
        - name: Start Cassandra again on the release it ran
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: main.yml
            rolespec_validate: false  # as the include it was: no argument check
          vars:
            cassandra_service_state: started
            _cassandra_storage_mode_checked: true  # (storage_mode_guard.yml, before the plan)

        - name: Forget the mark of the stop
          ansible.builtin.file:
            path: /run/cassandra-apply-config.restart
            state: absent
      rescue:
        - name: Note the start failed
          ansible.builtin.set_fact:
            _cassandra_window_start_failed: "{{ ansible_failed_result | default({}) | community.cassandra.cassandra_failure_cause }}"

        - name: Note the state the failed start left
          ansible.builtin.include_tasks: start_failed_state.yml

    # (the nodes' table: the step that failed, not this task's name)
    - name: Note the step that failed
      ansible.builtin.set_fact:
        _cassandra_stop_word: "{{ 'config write failed' if _cassandra_window_config | default(false) | bool else 'package update failed' }}"

    # one fact per line: what failed (the package manager's own error lines under it), the state it left; then the
    # one way out (the stop block: fix it, then resume)
    - name: Stop the run
      ansible.builtin.fail:
        msg: "{{ ([_failed] + _errors + _state + ['WAY OUT  fix it, then resume']) | join(_nl) }}"
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _failed: >-
          {{ inventory_hostname }}: {{ 'the config written again after the update to Cassandra ' ~ cassandra_package_version
          if _cassandra_window_config | default(false) | bool else 'the update to Cassandra ' ~ cassandra_package_version }}
          {{ '(--check)' if ansible_check_mode else 'with Cassandra stopped' }} failed: {{ _cassandra_window_cause }}
        _errors: >-
          {{ _cassandra_window_failure | community.cassandra.cassandra_package_errors(
               cassandra_window_rpm_log.stdout | default(''))
             | map('regex_replace', '^', '  ' ~ ('apt' if ansible_facts['os_family'] == 'Debian' else 'dnf') ~ ': ') | list }}
        _what: "{{ 'dpkg --verify' if ansible_facts['os_family'] == 'Debian' else 'rpm -V' }}"
        _same: "{{ 'Cassandra ' ~ _running ~ ' installed, its files as its package has them (' ~ _what ~ ')' }}"
        # started again on the release it ran
        _state_back: ["{{ _same }}: started again on it."]
        # its start failed: the state that left
        _state_start_failed: ["{{ _same }}.", "Its start failed too: {{ _cassandra_window_start_failed | default('') }}.",
                              "{{ cassandra_start_failed_state | default('') }}"]
        # not started again: what was observed
        _state_left: >-
          {{ ['Package installed: Cassandra ' ~ (_installed or 'not known') ~ '.']
             + (['Files of that package changed by the failed update (' ~ _what ~ '): ' ~ _touched[:5] | join(', ')
                 ~ (' and ' ~ (_touched | length - 5) ~ ' more' if _touched | length > 5 else '') ~ '.'] if _touched else [])
             + (['Files written in its directories since the update started: ' ~ _written[:5] | join(', ')
                 ~ (' and more' if _written | length > 5 else '') ~ '.'] if _written and 'unknown' not in _written else [])
             + (['A Cassandra JVM the unit did not start runs.'] if cassandra_window_jvm.rc | default(2) == 0
                else ['Cassandra left stopped.'] if cassandra_window_jvm.rc | default(2) == 1
                else ['Cassandra not started again; whether a Cassandra JVM runs is not known (pgrep failed).']) }}
        # (under --check: nothing stopped, nothing installed)
        _state: >-
          {{ ['Under --check: Cassandra was not stopped, no package changed.'] if ansible_check_mode
             else _state_left if not _back | bool
             else _state_start_failed if _cassandra_window_start_failed is defined else _state_back }}
