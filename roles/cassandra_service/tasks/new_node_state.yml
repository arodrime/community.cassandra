---
# Where a node given to add_node stands, as add_node sees it: from where it
# stands (node_standing.yml, cassandra_node_standing; cassandra_node_add_state),
# cassandra_new_node_state: new (not in the ring: added; holding data, emptied
# first when it may be: reset_node_plan.yml, cassandra_add_node_reset on by
# default), joining (UJ under its own host ID: a bootstrap an earlier run
# started, waited for again) or joined (UN under its own host ID); any other is
# refused with the reason. cassandra_new_node_ring: the ring of the first node
# of the cluster that answered UN, the one add_node plans with.
- name: Where {{ inventory_hostname }} stands
  vars:
    _from: >-
      {{ query('community.cassandra.cassandra_nodes')
         | reject('in', query('ansible.builtin.inventory_hostnames', cassandra_target_nodes)) | first | default('') }}
    _address: >-
      {{ cassandra_listen_address if cassandra_listen_address | default('') not in ['', 'localhost']
         else ansible_facts['default_ipv4']['address'] }}
    _add: >-
      {{ cassandra_node_standing | community.cassandra.cassandra_node_add_state(
           cassandra_add_node_reset | default('auto') | community.cassandra.cassandra_reset_choice, _address) }}
    _state: "{{ _add.state }}"
  block:
    - name: A node of the cluster is not being added (its ring to join)
      ansible.builtin.assert:
        that: _from | length > 0
        fail_msg: "Every node of {{ lookup('community.cassandra.cassandra_hosts') }} is in cassandra_target_nodes: use create_cluster for a new cluster"
        quiet: true

    - name: Read where it stands
      ansible.builtin.include_tasks: node_standing.yml
      vars:
        _cassandra_node_standing_size: true  # what it holds, on add_node's screen

    - name: Need the ring of the cluster
      ansible.builtin.assert:
        that: cassandra_node_standing.ring.known | bool
        fail_msg: >-
          The ring of {{ lookup('community.cassandra.cassandra_hosts') }} can't be read ({{ cassandra_node_standing.ring.why }}):
          nothing was changed. Check that Cassandra runs on its nodes and the JMX access (cassandra_jmx_port,
          cassandra_jmx_username, cassandra_jmx_password); a host of the group that is not a member yet and is stopped:
          start it, or take it out of the group.
        quiet: true

    # add_node (_cassandra_new_node_refused_by_caller): kept for its one refusal block of all the nodes
    - name: Say why {{ inventory_hostname }} is refused
      ansible.builtin.set_fact:
        _cassandra_new_node_refusal: "{{ _add.refusal }}"
      when: _state not in ['new', 'joining', 'joined']

    - name: Refuse a node that is not simply new or joined
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }} ({{ _address }}): {{ _cassandra_new_node_refusal }}"
      when:
        - _state not in ['new', 'joining', 'joined']
        - not _cassandra_new_node_refused_by_caller | default(false) | bool

    - name: Remember where it stands
      ansible.builtin.set_fact:
        cassandra_new_node_state: "{{ _state }}"
        cassandra_new_node_address: "{{ _address }}"
        cassandra_new_node_ring:
          cluster_status: >-
            {{ (_cassandra_node_standing_read.answers | selectattr('host', 'equalto', cassandra_node_standing.ring['from'])
                | first).status }}

    # joined (an interrupted run's bootstrap went through): the mark of that bootstrap goes (action_add.yml)
    - name: Remove the mark of a bootstrap that went through
      ansible.builtin.file:
        path: "{{ _cassandra_service_bootstrap_mark }}"
        state: absent
      when: _state == 'joined'
