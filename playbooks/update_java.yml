---
# Move a running cluster to the Java in cassandra_java_version.
#
#   ansible-playbook community.cassandra.update_java
#
# One node at a time: Java installed and made the default, config written,
# node drained and restarted, the cluster checked before and after. One
# question. Nodes already on that Java are skipped: re-running is safe.
#
# -e cassandra_rolling_resume=true resumes an interrupted run.
#
# Options and defaults: ansible-playbook community.cassandra.help -e help_topic=update_java
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight
  vars:
    _cassandra_notes_in_plan: true  # the checks' WARNING lines in the plan, before the question

- name: Check the Java change
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  any_errors_fatal: true  # one node refused: none is changed
  gather_facts: false
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Load the role defaults
      ansible.builtin.include_role:
        name: "community.cassandra.{{ item }}"
        tasks_from: defaults.yml
        public: true
      loop: [cassandra_install, cassandra_config, cassandra_service, cassandra_operation]

    # Refused: a Java the series does not support (4.0/4.1: 8, 11; 5.0: 11, 17; filter cassandra_java_check,
    # cassandra_java_allow_unsupported: true goes on). With cassandra_java_tarballs (Java tarballs by major,
    # e.g. in a mirror file shared by every cluster), the node gets the tarball of cassandra_java_version.
    - name: The series supports this Java, and a tarball is on offer for it
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_install
        tasks_from: java_check.yml

    # by its process, whatever started it (the unit's main PID may be another process, or none)
    - name: Find the running Cassandra and its java
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: jvm_started.yml

    - name: Read the Java version the running Cassandra uses
      ansible.builtin.command:
        argv: ["/proc/{{ cassandra_jvm.pid }}/exe", -XshowSettings:properties, -version]  # even replaced since
      register: cassandra_update_java_spec
      changed_when: false
      failed_when: false
      check_mode: false  # read-only
      when: cassandra_jvm.pid is defined

    # The running java is a resolved path: resolve the wanted home the same way
    # (-m: a tarball not unpacked yet, its directories missing)
    - name: Resolve the wanted Java home
      ansible.builtin.command:
        argv: [readlink, -m, "{{ _cassandra_java_home }}"]
      register: cassandra_update_java_home
      changed_when: false
      failed_when: false
      check_mode: false
      when: _cassandra_java_home != ''

    # its major version as the import reads it (a package path may not name it: zulu17, temurin-17-jdk)
    - name: Note what this node needs
      ansible.builtin.set_fact:
        cassandra_update_java_running: "{{ _running }}"
        cassandra_update_java_major: "{{ _major }}"
        cassandra_update_java_todo: >-
          {{ _major != cassandra_java_version | string
             or (_cassandra_java_home != ''
                 and not _running.startswith((cassandra_update_java_home.stdout | default('', true) or _cassandra_java_home) ~ '/')) }}
      vars:
        _running: "{{ cassandra_jvm.exe | default('', true) or 'not running' }}"
        _spec: >-
          {{ cassandra_update_java_spec.stderr | default('') | regex_findall('java[.]specification[.]version = (\S+)')
             | first | default('') }}
        _major: "{{ _spec.split('.')[1] if _spec.startswith('1.') else _spec }}"

    # The JAVA_HOME Cassandra restarts with, whatever sets it: bin/cassandra runs $JAVA_HOME/bin/java, else the
    # system java. In the order it is applied, the last one found wins: the unit's Environment
    # (cassandra_service_environment, written with the unit before the drain; the unit itself when it is kept,
    # cassandra_service_environment does not reach it), its drop-ins, its EnvironmentFile, /etc/default/cassandra
    # (an init script's unit), then cassandra.in.sh (the first bin/cassandra finds). A plain assignment only (a
    # shell expression is left to the check after the restart). Then resolved, as the wanted home is (-m: a
    # tarball not unpacked yet), and the Java version of its release file (a Java 8 jre: the one above it).
    # Lines: JAVA_HOME, resolved, its Java version, where it is set; none: no line.
    - name: Read the JAVA_HOME Cassandra is given
      ansible.builtin.shell: |
        jh= where= inc=
        # The JAVA_HOME= assignments of a shell file, in order, one per line: "<kind><tab><value>", the kind
        # plain (top level), cond (under a test that is not on JAVA_HOME: an if, a &&: counts when that directory
        # exists here) or fallback (under a test on JAVA_HOME, after a ||: counts only when nothing set it before).
        # A quoted value is taken whole (spaces kept); one with a $ or a ` (an expression) is left out. Plain awk
        # (mawk, busybox): no character classes.
        assignments() {
          awk '
            function value(rest,   q, v) {
              q = substr(rest, 1, 1)
              if (q == "\042" || q == "\047") { v = substr(rest, 2); return substr(v, 1, index(v, q) - 1) }
              sub(/[; \t].*$/, "", rest); return rest
            }
            /^[ \t]*#/ { next }
            {
              line = $0; kind = ""
              for (i = 1; i <= n; i++) if (stack[i] == "fallback") kind = "fallback"; else if (kind == "" && stack[i] == "cond") kind = "cond"
              one = (line ~ /^[ \t]*if[ \t].*;[ \t]*then[ \t]/ && line ~ /;[ \t]*fi[ \t]*$/)
              if (line ~ /^[ \t]*if[ \t]/ && !one) { stack[++n] = (line ~ /JAVA_HOME/) ? "fallback" : "cond"; next }
              if (line ~ /^[ \t]*fi([ \t;]|$)/) { if (n > 0) n--; next }
              p = index(line, "JAVA_HOME=")
              if (p == 0) next
              before = substr(line, 1, p - 1)
              if (one) kind = (substr(line, 1, index(line, "then")) ~ /JAVA_HOME/) ? "fallback" : "cond"
              else if (before ~ /\|\|[ \t]*(export[ \t]+)?$/) kind = (before ~ /JAVA_HOME/) ? "fallback" : "cond"
              else if (before ~ /&&[ \t]*(export[ \t]+)?$/) kind = (before ~ /JAVA_HOME/ && before ~ /-z/) ? "fallback" : "cond"
              else if (before !~ /^[ \t]*(export[ \t]+)?$/ && !one) next
              v = value(substr(line, p + 10))
              if (v != "" && v !~ /[$`]/) print (kind == "" ? "plain" : kind) "\t" v
            }' "$1" 2>/dev/null
        }
        # a shell file read as bin/cassandra or an init script would
        read_file() {
          tab=$(printf '\t')
          while IFS="$tab" read -r kind v; do
            case $kind in
              plain) jh=$v; where=$1 ;;
              cond) [ -d "$v" ] && { jh=$v; where=$1; } ;;
              fallback) [ -n "$jh" ] || { jh=$v; where=$1; } ;;
            esac
          done <<EOF_ASSIGNMENTS
        $(assignments "$1")
        EOF_ASSIGNMENTS
        }
        # an Environment= value of systemd (systemctl show, a unit line): NAME=value words, a quoted one kept whole
        # (backslash escapes undone), one per line
        env_lines() {
          awk '{
            s = $0; t = ""; q = 0
            for (i = 1; i <= length(s); i++) {
              c = substr(s, i, 1)
              if (c == "\134" && i < length(s)) { i++; t = t substr(s, i, 1); continue }
              if (c == "\042") { q = !q; continue }
              if ((c == " " || c == "\t") && !q) { if (t != "") print t; t = ""; continue }
              t = t c
            }
            if (t != "") print t
          }'
        }
        if [ "$UNIT_KEPT" = yes ]; then
          vars=$(systemctl show cassandra -p Environment --value 2>/dev/null | env_lines)
          v=$(echo "$vars" | sed -n 's/^JAVA_HOME=//p' | tail -1)
          [ -z "$v" ] || { jh=$v; where=unit; }
          inc=$(echo "$vars" | sed -n 's/^CASSANDRA_INCLUDE=//p' | tail -1)
          files=$(systemctl show cassandra -p EnvironmentFiles --value 2>/dev/null | sed 's/ (ignore_errors=[a-z]*)/\n/g')
          case $(systemctl show cassandra -p SourcePath --value 2>/dev/null) in
            */init.d/cassandra) files="$files
        /etc/default/cassandra";;
          esac
        else
          [ -z "$GIVEN" ] || { jh=$GIVEN; where=cassandra_service_environment; }
          files=
          for d in $(systemctl show cassandra -p DropInPaths --value 2>/dev/null); do
            vars=$(sed -n 's/^[[:space:]]*Environment=//p' "$d" 2>/dev/null | env_lines)
            v=$(echo "$vars" | sed -n 's/^JAVA_HOME=//p' | tail -1)
            [ -z "$v" ] || { jh=$v; where=$d; }
            v=$(echo "$vars" | sed -n 's/^CASSANDRA_INCLUDE=//p' | tail -1)
            [ -z "$v" ] || inc=$v
            files="$files
        $(sed -n 's/^[[:space:]]*EnvironmentFile=//p' "$d" 2>/dev/null)"
          done
        fi
        for f in $files; do
          f=${f#-}
          read_file "$f"
        done
        # CASSANDRA_INCLUDE: the file bin/cassandra reads instead of looking for a cassandra.in.sh
        home=$(getent passwd "$CASSANDRA_USER" 2>/dev/null | cut -d: -f6)
        for f in ${inc:+"$inc"} /usr/sbin/cassandra.in.sh ${home:+"$home/.cassandra.in.sh"} /usr/share/cassandra/cassandra.in.sh \
                 /usr/local/share/cassandra/cassandra.in.sh /opt/cassandra/cassandra.in.sh; do
          [ -f "$f" ] || { [ -z "$inc" ] || [ "$f" != "$inc" ] || break; continue; }
          read_file "$f"
          break
        done
        [ -n "$jh" ] || exit 0
        echo "$jh"
        h=$(readlink -m "$jh")
        echo "$h"
        sed -n 's/^JAVA_VERSION="\(.*\)"$/\1/p' "$h/release" "$h/../release" 2>/dev/null | head -1 | grep . || echo
        echo "$where"
        exit 0
      environment:
        GIVEN: "{{ cassandra_service_environment.JAVA_HOME | default('') }}"
        UNIT_KEPT: "{{ 'no' if cassandra_service_unit_manage | default(true) | bool else 'yes' }}"
        CASSANDRA_USER: "{{ cassandra_user | default('cassandra') }}"
      register: cassandra_update_java_given
      changed_when: false
      failed_when: false
      check_mode: false  # read-only
      when: cassandra_update_java_todo | bool

    # why Cassandra would restart on another Java than the new one, "" when it would not: no JAVA_HOME is the system
    # java, the new one unless cassandra_java_set_default is false; a JAVA_HOME that is cassandra_java_link follows it
    - name: Note what JAVA_HOME Cassandra restarts with
      ansible.builtin.set_fact:
        cassandra_update_java_kept: "{{ _why }}"
      vars:
        _given: "{{ cassandra_update_java_given.stdout_lines | default([]) }}"
        _set: "JAVA_HOME={{ _given[0] | default('') }}"
        _home: "{{ _given[1] | default('') }}"
        _given_major: "{{ _given[2] | default('') | regex_replace('^1[.]', '') | regex_replace('[._+-].*$', '') }}"
        _wanted: "{{ cassandra_update_java_home.stdout | default('', true) or _cassandra_java_home }}"
        _kept_unit: "{{ not cassandra_service_unit_manage | default(true) | bool }}"
        _from: "{{ _given[3] | default('') }}"
        _where: >-
          {{ 'its unit (kept: cassandra_service_unit_manage false; edit it by hand, systemctl edit cassandra)'
             if _from == 'unit' or (_from == '' and _kept_unit | bool)
             else 'cassandra_service_environment' if _from in ['', 'cassandra_service_environment']
             else _from ~ ' (edit it by hand)' }}
        _link: "{{ _cassandra_java_link | default('') }}"
        _why: >-
          {{ '' if not cassandra_update_java_todo | bool
             else ('' if cassandra_java_set_default | bool else 'no JAVA_HOME in ' ~ _where) if _given[0] | default('') == ''
             else '' if _cassandra_java_home != '' and _link != '' and _given[0] | regex_replace('(?<=.)/+$', '') == _link
             else (_set ~ ' in ' ~ _where ~ ' is not the new Java (' ~ _wanted ~ ')')
             if _cassandra_java_home != '' and _home != _wanted
             else (_set ~ ' in ' ~ _where ~ ' is not a Java ' ~ cassandra_java_version ~ ' installed here: install '
                   ~ [cassandra_java_package] | flatten | join(' ') ~ ' first (update_java installs it only after this'
                   ~ ' check)')
             if _cassandra_java_home == '' and _given_major != cassandra_java_version | string
             else '' }}

    - name: Cassandra restarts on the new Java
      ansible.builtin.assert:
        that: _kept | length == 0
        fail_msg: >-
          {{ (['Cassandra would not restart on Java ' ~ cassandra_java_version ~ ': the JAVA_HOME '
               ~ ('this node starts' if _kept | length == 1 else 'these nodes start') ~ ' Cassandra with does not lead to'
               ~ ' it. Nothing was done.']
              + _kept | map('regex_replace', '^', '  ') | list
              + ['WAY OUT  set JAVA_HOME to the home of the new Java where the line says (cassandra_java_home, a'
                 ' tarball one, cassandra_java_link, or the package one, installed)'
                 ~ (', or remove it there: the new Java is made the system java' if cassandra_java_set_default | bool
                    else ', or remove cassandra_java_set_default: false to make it the system java')
                 ~ '; then run update_java again']) | join(_nl) }}
        quiet: true
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"
        _kept: >-
          {%- set out = [] -%}
          {%- for host in ansible_play_hosts_all if hostvars[host].cassandra_update_java_kept | default('') != '' -%}
          {%-   set _ = out.append(host ~ ': ' ~ hostvars[host].cassandra_update_java_kept) -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    # A node left drained (Cassandra running, gossip and the native transport off: Mode DRAINED) would be seen down
    # by the health check of the first node, which waits for it (cassandra_service_health_timeout) then stops; a
    # resumed run takes it first, from where it is (node_operation.yml)
    - name: Read whether Cassandra runs drained there
      community.cassandra.cassandra_netstats:
      module_defaults:
        community.cassandra.cassandra_netstats: "{{ _cassandra_service_jmx }}"
      register: cassandra_update_java_netstats
      failed_when: false  # not running, JMX not answering: the health checks say it
      check_mode: false  # read-only
      when:
        - cassandra_jvm.pid is defined
        - not cassandra_rolling_resume | default(false) | bool

    # every node of the run (one already on the new Java, drained, is waited for as well); the resume offered only
    # when a progress file of update_java for this cluster is there to resume
    - name: No node of the run is left drained
      ansible.builtin.assert:
        that: _drained | length == 0
        fail_msg: >-
          {{ (['Cassandra runs drained on ' ~ _drained | join(', ') ~ ' (nodetool netstats: Mode: DRAINED; gossip and'
               ~ ' the native transport are off there). Nothing was done.']
              + (['WAY OUT  resume: the resumed run takes the node it stopped at first, from DRAINED:',
                  '  ' ~ 'update_java' | community.cassandra.cassandra_command(extra=['-e cassandra_rolling_resume=true'],
                                                                               **_cassandra_run_command_args),
                  '  or restart Cassandra on ' ~ _drained | join(', ') ~ ' (systemctl restart cassandra), then run'
                  ~ ' update_java again']
                 if _progress | length > 0 else
                 ['WAY OUT  restart Cassandra on ' ~ _drained | join(', ') ~ ' (systemctl restart cassandra), then run'
                  ~ ' update_java again'])) | join(_nl) }}
        quiet: true
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"
        # where progress.yml keeps them: cassandra_rolling_progress_dir, else the inventory's dir, else the current one
        _progress_dirs: >-
          {{ [cassandra_rolling_progress_dir | expanduser] if cassandra_rolling_progress_dir | default('', true)
             else [inventory_dir | default('', true) ~ '/.cassandra_progress', lookup('ansible.builtin.env', 'PWD') ~ '/.cassandra_progress'] }}
        _progress: >-
          {%- set out = [] -%}
          {%- for d in _progress_dirs if d is abs -%}
          {%-   set _ = out.extend(query('ansible.builtin.fileglob',
                                         d ~ '/' ~ lookup('community.cassandra.cassandra_hosts') ~ '-update_java-*.done')) -%}
          {%- endfor -%}
          {{ out }}
        _drained: >-
          {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('cassandra_update_java_netstats', 'defined')
             | selectattr('cassandra_update_java_netstats.mode', 'defined')
             | selectattr('cassandra_update_java_netstats.mode', 'equalto', 'DRAINED')
             | map(attribute='inventory_hostname') | list }}
      run_once: true
      when: not cassandra_rolling_resume | default(false) | bool

    - name: The new Java reads an options file the role writes
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_install
        tasks_from: java_options_kept.yml
      vars:
        _cassandra_java_options_now: >-
          {{ cassandra_version | community.cassandra.cassandra_jvm_options_file(cassandra_update_java_major) }}
      when: cassandra_update_java_todo | bool

    - name: Settings that only apply to another Java
      ansible.builtin.debug:
        msg: >-
          {{ ['WARNING  ' ~ inventory_hostname ~ ' sets ' ~ _other | join(', ') ~ ', which only apply to another Java.'
              ~ ' Java ' ~ cassandra_java_version ~ ' reads the cassandra_jvm' ~ cassandra_java_version ~ '_* ones'
              ~ ' (e.g. in group_vars):']
             + (_other | map('regex_replace', '^cassandra_jvm[0-9]+_', 'cassandra_jvm' ~ cassandra_java_version ~ '_')
                | zip(_other | map('extract', hostvars[inventory_hostname])) | map('join', ': ') | map('regex_replace', '^', '  ')
                | list) }}
      vars:
        cassandra_output: true
        _other: >-
          {{ hostvars[inventory_hostname] | select('match', '^cassandra_jvm(8|11|17)_')
             | reject('match', '^cassandra_jvm' ~ cassandra_java_version ~ '_') | list }}
      when: _other | length > 0

    - name: No CMS on Java 17
      ansible.builtin.debug:
        msg: >-
          WARNING  cassandra_jvm_gc is CMS, which Java 17 does not have: on Java 17 the node runs G1
          (jvm17-server.options). Check the heap settings for G1.
      vars:
        cassandra_output: true
      when:
        - cassandra_java_version | string == '17'
        - cassandra_jvm_gc == 'CMS'

    # the nodes already running that Java are skipped
    - name: Group the nodes to do
      ansible.builtin.group_by:
        key: "cassandra_update_java_{{ cassandra_update_java_todo | bool }}"
      changed_when: false

    - name: Nothing to do on this node
      ansible.builtin.set_fact:
        cassandra_op_result: "already on Java {{ cassandra_java_version }}"
      when: not cassandra_update_java_todo | bool

    # The Prometheus exporter's port free before anything is done (the agent would make the JVM exit; its jar and
    # config are put in place with the config, checked again before the restart)
    - name: Check the Prometheus exporter's port is free
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: exporter_check.yml
      vars:
        _cassandra_exporter_check_option: "{{ _cassandra_config_jvm_agent }}"
        _cassandra_exporter_check_kinds: [port]
        _cassandra_exporter_check_left: nothing was done
      when: cassandra_update_java_todo | bool

    - name: Show the plan and confirm the run
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: screen.yml
      vars:
        _todo: "{{ groups['cassandra_update_java_True'] | default([]) }}"
        _blocks: >-
          {%- set l = [] -%}
          {%- for h in _todo -%}
          {%-   set _ = l.append({'title': h | community.cassandra.cassandra_screen_title(hostvars[h]._cassandra_preflight | default({})), 'lines': ['runs ' ~ hostvars[h].cassandra_update_java_running]}) -%}
          {%- endfor -%}
          {{ l }}
        _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default((_cassandra_preflight | default({})).cassandra_cluster_name | default('')) }}"
        cassandra_screen_question: "Move {{ _todo | join(', ') }} of {{ _cluster }} to Java {{ cassandra_java_version }}?"
        cassandra_screen:
          operation: update_java
          summary: "{{ _todo | join(', ') }} of {{ _cluster }} to Java {{ cassandra_java_version }}"
          intro:
            - Moves these nodes to the new Java, one at a time (install, config, drain, restart).
          blocks: "{{ _blocks }}"
      when: groups['cassandra_update_java_True'] | default([]) | length > 0

- name: Set up the progress file
  hosts: "{{ query('community.cassandra.cassandra_nodes') | select('in', groups['cassandra_update_java_True'] | default([])) | list }}"
  gather_facts: false
  become: true
  vars:
    cassandra_service_node_action: update_java
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    # -e cassandra_rolling_resume=true: an interrupted run resumes, skipping the nodes already done
    - name: Set up the progress file
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: progress.yml

# The Java set in the inventory (cassandra_java_version, e.g. "17" in the
# cluster's group_vars), one node at a time: cluster checked, Java installed
# and made the default, config written, node drained and restarted, cluster
# checked again.
- name: Move to the new Java, one node at a time
  hosts: "{{ query('community.cassandra.cassandra_nodes') | select('in', groups['cassandra_update_java_True'] | default([])) | list }}"
  serial: 1
  any_errors_fatal: true
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    # cassandra_java_version and the others the action reads (e.g. the series' Java when the inventory has none)
    - name: Load the role defaults
      ansible.builtin.include_role:
        name: "community.cassandra.{{ item }}"
        tasks_from: defaults.yml
        public: true
      loop: [cassandra_install, cassandra_config, cassandra_service, cassandra_operation]

    - name: Update this node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: update_java

- name: Summary
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Print the summary
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: summary.yml
      vars:
        cassandra_service_summary_operation: update_java
