minor_changes:
  - health_check playbook, import_cluster playbook - sensitive or suspicious settings found and said (nothing refused), in health_check's SETTINGS TO REVIEW block and the import report's TO DO - a ``-Dcassandra.replace_address`` or ``replace_address_first_boot`` flag left on a member of the ring (the JVM options, ``cassandra_service_environment``, a line of the node's config), with what to remove (this one is also a WARNING in every operation's plan - the node's next start would fail); the heap (``cassandra_heap_size``, a ``-Xmx`` option, the unit's ``MAX_HEAP_SIZE``) not set on a 4.x host with 64G of RAM or more, under 2G, 32G or more, or over half the RAM; ``AllowAllAuthenticator`` with an rpc address other hosts reach; ``disk_failure_policy`` or ``commit_failure_policy`` ``ignore``.
  - cassandra_operation role - ``cassandra_settings_kept_on_purpose`` (per host or group), the ids of the findings a node keeps on purpose, left out of the block; each finding says its id, an unknown id gets a line of its own.
