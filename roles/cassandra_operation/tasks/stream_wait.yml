---
# Waits for a streaming operation as long as it makes progress: every
# cassandra_stream_check_interval seconds (sooner at first), reads nodetool netstats where the
# data streams, prints the progress (cassandra_progress_line), and fails only after
# cassandra_stream_stall_time seconds without any byte or file
# streamed nor, on a receiving node (_cassandra_stream_disk), growth of its used space (or after cassandra_stream_max_time,
# when set). The checks (stream_check.yml) run in wait_loop.yml, which stops
# right after the one that ends it.
# The caller sets:
#   _cassandra_stream_what: what is waited for, for the messages (e.g. "bootstrap of node7")
#   _cassandra_stream_operations: netstats session operations to follow (e.g. ['Bootstrap'])
#   _cassandra_stream_from: hosts whose netstats show the streams
#   _cassandra_stream_join: true: done when this node is NORMAL (bootstrap, replace)
#   _cassandra_stream_leave: true: done when this node is DECOMMISSIONED (decommission)
#   _cassandra_stream_job: {'jid': ..., 'host': ...}: done when this async job ends (with _leave, when it
#     changed something: a decommission of a node already LEAVING waits for DECOMMISSIONED)
#   _cassandra_stream_removal_on: host whose nodetool removenode status says when
#     a removenode an earlier run started is over (no job to follow)
#   _cassandra_stream_peers: hosts to read instead, from the other side, when this
#     node's nodetool can't answer during its bootstrap (5.0.0 to 5.0.4, CASSANDRA-19902)
#   _cassandra_stream_advice: what to check when it stalls
#   _cassandra_stream_disk: true: this node receives (bootstrap, replace, rebuild): the growth of the space used
#     on its data and commitlog filesystems is progress too (a whole SSTable counts in netstats once sent)
# and resets _cassandra_stream_state to {} before the include.
- name: Start following it
  ansible.builtin.set_fact:
    _cassandra_stream_status: going
  vars:
    cassandra_output_gap: true  # its progress lines, a block of their own (ops callback)

- name: Check the progress, then every {{ cassandra_stream_check_interval }}s
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: wait_loop.yml
  vars:
    # templated in the wait loop of cassandra_service (its role_path): this role is its sibling
    _cassandra_wait_check: "{{ role_path }}/../cassandra_operation/tasks/stream_check.yml"
    _cassandra_wait_going: "{{ _cassandra_stream_status == 'going' }}"

- name: Stop when it failed or stopped moving
  ansible.builtin.fail:
    msg: >-
      {{ _cassandra_stream_status | community.cassandra.cassandra_stream_failure(
           inventory_hostname, _cassandra_stream_what, job=_cassandra_stream_job_result | default({}),
           advice=_cassandra_stream_advice | default(none), force=cassandra_decommission_force | default(false) | bool,
           refused=_cassandra_stream_refused | default([]), idle=_cassandra_stream_state.idle | default(0),
           stall_time=cassandra_stream_stall_time, max_time=cassandra_stream_max_time,
           last=_cassandra_stream_report | default([]) | first | default('')) }}
  when: _cassandra_stream_status not in ['done', 'going']
