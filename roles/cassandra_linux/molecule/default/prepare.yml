---
# UBI 8 only ships platform-python 3.6, below ansible-core's target minimum
- name: Bootstrap Python on RHEL 8
  hosts: rhel810
  gather_facts: false
  tasks:
    - name: Install python3.12
      ansible.builtin.raw: test -x /usr/bin/python3.12 || dnf -y install python3.12
      changed_when: false

- name: Prepare
  hosts: all

  tasks:

  - name: Clean package manager cache
    ansible.builtin.shell: dnf clean all || yum clean all
    when: ansible_facts['os_family'] == 'RedHat'
    
  - name: Clean package manager cache
    ansible.builtin.shell: apt-get update && apt-get clean
    when: ansible_facts['os_family'] == 'Debian'

  # Fake sysfs tree for the disk tuning tests: the container is privileged,
  # so the real /sys/block is the host's and must never be written to.
  - name: Create fake sysfs queue dir
    ansible.builtin.file:
      path: /tmp/fake-sys/block/sdz/queue
      state: directory

  - name: Seed fake sysfs queue attributes with stock-like values
    ansible.builtin.copy:
      content: "{{ item.value }}"
      dest: "/tmp/fake-sys/block/sdz/queue/{{ item.name }}"
    loop:
      - { name: read_ahead_kb, value: "128\n" }
      - { name: scheduler, value: "[mq-deadline] none\n" }

  # UBI repos don't carry chrony (real RHEL does, via subscription): pull it
  # from the matching Rocky BaseOS instead. Test scaffolding only.
  - name: Add Rocky BaseOS repo for chrony on UBI
    ansible.builtin.yum_repository:
      name: rocky-baseos-chrony
      description: Rocky BaseOS (chrony only)
      baseurl: "https://dl.rockylinux.org/pub/rocky/{{ ansible_facts['distribution_major_version'] }}/BaseOS/$basearch/os/"
      gpgcheck: false
      includepkgs: chrony
    when: ansible_facts['distribution'] == 'RedHat'
