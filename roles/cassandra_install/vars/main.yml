---
# Private to the collection (a leading underscore): computed from the public settings in
# defaults/main.yml or fixed. Role vars, so an inventory or play variable of the same name does not
# override them by accident.

# cqlsh's Python set up by this role: managed, and the package's cqlsh is the one used
_cassandra_cqlsh_managed: "{{ cassandra_cqlsh_python_manage | bool and cassandra_cqlsh_source == 'package' }}"

_cassandra_packages: >-
  {{ ([cassandra_packages] | flatten + (['cassandra-tools'] if cassandra_install_tools | bool else [])) | unique }}

# the installed packages the role reads (install.yml), by name: package_facts would put every package of the node
# in its facts, copied again for each task. Its own packages, Java's (as given, and without a version), and every
# other one its tasks look for in _cassandra_install_before (a unit test checks the list has them)
_cassandra_install_read_names: >-
  {{ ([cassandra_java_package] | flatten + [cassandra_java_package] | flatten | map('regex_replace', '[=<>].*$', '') | list
      + _cassandra_packages + _cassandra_install_read_others) | unique }}
_cassandra_install_read_others: [cassandra, cassandra-java-tarball, gzip, jemalloc, libjemalloc2, procps-ng, python3,
                                 python3-debian, python3.11, shadow-utils, tar]

_cassandra_java_tarball_entry: "{{ cassandra_java_tarballs | community.cassandra.cassandra_java_tarball(cassandra_java_version) }}"

_cassandra_java_tarball_from_entry: >-
  {{ cassandra_java_tarball != '' and cassandra_java_tarball == _cassandra_java_tarball_entry.url | default('') }}

# an entry with a username or a password has its own credentials, both
_cassandra_java_tarball_own_credentials: >-
  {{ _cassandra_java_tarball_from_entry
     and (_cassandra_java_tarball_entry.username is defined or _cassandra_java_tarball_entry.password is defined) }}

_cassandra_java_tarball_on_mirror: "{{ cassandra_java_tarball | community.cassandra.cassandra_same_origin(cassandra_install_url) }}"

_cassandra_java_tarball_name: "{{ cassandra_java_tarball | urlsplit('path') | basename }}"

_cassandra_java_home: >-
  {{ cassandra_java_home | regex_replace('/+$', '') if cassandra_java_home != ''
     else ((cassandra_java_tarball_dir | regex_replace('/+$', '')) ~ '/'
           ~ (_cassandra_java_tarball_name | regex_replace('[.](tar[.]gz|tgz|tar)$', '')))
     if cassandra_java_tarball != '' else '' }}

_cassandra_java_link: "{{ cassandra_java_link | regex_replace('(?<=.)/+$', '') }}"

# --check, or apply_config's compare (check_mode applied to the role, which ansible_check_mode does not tell:
# _cassandra_compare): the role's tasks act as under --check
_cassandra_install_check: "{{ ansible_check_mode or _cassandra_compare | default(false) | bool }}"
