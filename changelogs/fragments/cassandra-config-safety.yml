minor_changes:
  - cassandra_config - masks secret values in the diff it shows (``cassandra_config_confirm``), refuses to change the identity of a joined node (cluster name, num_tokens, partitioner, snitch, datacenter, rack, 5.0 storage compatibility mode beyond one step; ``cassandra_config_force_identity_change``), refuses a ``cassandra_version`` of another series than the installed package, says when the files of a running node changed, and on RedHat writes to its own conf dir selected with ``alternatives`` (``cassandra_rpm_conf_alternative``) (https://github.com/ansible-collections/community.cassandra/issues/334).
