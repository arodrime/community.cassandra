---
minor_changes:
- "apply_config playbook - the compare of ``cassandra_config`` runs the role's plan on every node (``tasks/plan.yml``: its reads, compares and lists), and the rest of the role (``tasks/apply_plan.yml``) only where the plan lists something to write; the screens are the same, the report says how many nodes the plan found unchanged. ``-e apply_full=true`` runs the rest everywhere, as before; ``-e apply_verify=true`` runs it everywhere too and stops on a node whose facts it changed although the plan found nothing."
- "apply_config playbook - ``-e apply_only=<parts>`` (``config``, ``unit``, ``java``, ``linux``, ``install``, ``repository``, ``medusa``, ``firewall``, ``axonops``) compares and applies only those parts, ``config`` and ``unit`` always; the plan, the recap and the report say the parts left out. An unknown part, a part left out that a node needs (a newer release, the AxonOps agent), or a resumed run with other parts than the interrupted one stops the run before any change."
trivial:
- "cassandra_config role - its tasks split into the plan (``plan.yml``: the reads, compares and lists, the JMX users' files compared there too) and the rest (``apply_plan.yml``); ``main.yml`` runs both, as before."
