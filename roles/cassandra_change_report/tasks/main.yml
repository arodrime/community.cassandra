---
# Called by the other roles with:
#   cassandra_change_report_role: role name
#   cassandra_change_report_items: [{item, before, after}] for what changes
- name: Show changes ({{ cassandra_change_report_role }})
  ansible.builtin.debug:
    msg: "{{ lines.splitlines() }}"
  vars:
    lines: |-
      {% for c in cassandra_change_report_items %}
      {{ c.item }}: {{ c.before }} -> {{ c.after }}
      {% endfor %}
  when: cassandra_change_report_items | length > 0

# Same timestamp for every host and role of the run. Not under the block's
# conditions: run_once would skip it for every host when the first one has
# no change.
- name: Pick the report timestamp
  ansible.builtin.set_fact:
    cassandra_change_report_stamp: "{{ cassandra_change_report_stamp | default(now(utc=true).strftime('%Y%m%dT%H%M%SZ')) }}"
  run_once: true
  when: cassandra_change_report_dir != ""

- name: Write the change report on the controller
  when:
    - cassandra_change_report_dir != ""
    - cassandra_change_report_items | length > 0
  block:
    - name: Create the report directory
      ansible.builtin.file:
        path: "{{ cassandra_change_report_dir }}/{{ cassandra_change_report_stamp }}"
        state: directory
        mode: "0700"  # reports show config diffs
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false  # a report is not a change to the host

    - name: Write {{ inventory_hostname }}-{{ cassandra_change_report_role }}.yml
      ansible.builtin.copy:
        dest: "{{ cassandra_change_report_dir }}/{{ cassandra_change_report_stamp }}/{{ inventory_hostname }}-{{ cassandra_change_report_role }}.yml"
        content: "{{ report | to_nice_yaml(indent=2, width=200, sort_keys=false) }}"
        mode: "0600"
      vars:
        report:
          host: "{{ inventory_hostname }}"
          role: "{{ cassandra_change_report_role }}"
          mode: "{{ 'check' if ansible_check_mode else 'applied' }}"
          date: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          changes: "{{ cassandra_change_report_items }}"
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false  # a report is not a change to the host
