---
# Once the JVM options file is written (apply.yml): what the Prometheus exporter's agent no longer loads, as
# cassandra_install removes the dsbulk versions it installed before. On: the jars of other versions the role
# downloaded into cassandra_prometheus_exporter_dir (listed in its .cassandra_config; a jar put there by other
# means stays). Off: those jars, that list (and the directory when it is then empty), the role's config (its
# header line) and the record of its parts read at start; nothing while the next start may still load an exporter's
# agent or the role's config: in a run that writes, the files that start reads, as written; in one that only looks
# (--check, apply_config's preview), the ones the role does not write from its template (kept by hand, your own
# templates) as they are, and what it is to write from the variables (the extra options, your snippet of
# cassandra-env.sh): removed, they would stop Cassandra at its next start. A
# running Cassandra keeps the jar it opened until its restart (the one the JVM options file now gives is there).
# (a task check mode skips: this run writes the files, or only looks, --check or check_mode applied to the role)
- name: Tell a run that writes from one that only looks
  ansible.builtin.command: "true"
  register: _cassandra_config_exporter_writes
  changed_when: false

- name: Find what the exporter's agent no longer needs
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        dir=$1 keep=$2 conf=$3 on=$4 files=$5 rendered=$6
        list="$dir/.cassandra_config"
        unused=$(
          if [ -f "$list" ]; then
            while IFS= read -r jar; do
              case "$jar" in ''|*/*) continue ;; esac
              if [ "$on" != on ] || [ "$jar" != "$keep" ]; then [ -f "$dir/$jar" ] && echo "jar|$dir/$jar"; fi
            done < "$list"
            [ "$on" = on ] || echo "list|$list"
          fi
          if [ "$on" != on ]; then
            grep -qs '^# Managed by Ansible (community.cassandra.cassandra_config)' "$conf/jmx_prometheus.yml" \
              && echo "config|$conf/jmx_prometheus.yml"
            [ -f "$conf/jmx_prometheus.at_start" ] && echo "record|$conf/jmx_prometheus.at_start"
          fi
        )
        [ -n "$unused" ] || exit 0
        # off, the next start may still load the role's jar or config: nothing removed (broadly: a jar of its
        # directory, an agent's jar through a variable, the conf dir's config; kept, it costs a warning, removed,
        # Cassandra would not start). An exporter of your own (its jar and config elsewhere) needs none of them.
        if [ "$on" != on ]; then
          {
            for f in $files; do
              case "$f" in /*) path=$f ;; *) path=$conf/$f ;; esac
              lines=$(grep -v '^[[:space:]]*#' "$path" 2>/dev/null) || continue
              { printf '%s\n' "$lines" | grep -qF -e "$dir/" -e "$conf/jmx_prometheus.yml" \
                || printf '%s\n' "$lines" | grep -qE 'javaagent:[^[:space:]=]*[$][^[:space:]=]*jmx_prometheus_javaagent'
              } && echo "kept|$f"
            done
            set -f
            for f in $rendered; do echo "kept|$f"; done
          } | grep . && exit 0
        fi
        echo "$unused"
      - sh
      - "{{ cassandra_prometheus_exporter_dir | regex_replace('(?<=.)/+$', '') }}"
      - "{{ _cassandra_config_exporter_jar | basename }}"
      - "{{ cassandra_conf_dir | regex_replace('(?<=.)/+$', '') }}"
      - "{{ 'on' if cassandra_prometheus_exporter_enabled | bool else 'off' }}"
      - "{{ _on_node | join(' ') }}"
      - "{{ _rendered | join(' ') }}"
  register: cassandra_config_exporter_unused
  changed_when: false
  check_mode: false  # reads only
  vars:
    # (as the script finds it: a jar of the role's directory, an agent's jar through a variable, the conf dir's config)
    _agent: >-
      {{ (cassandra_prometheus_exporter_dir | regex_replace('(?<=.)/+$', '')) | regex_escape }}/|{{
         (cassandra_conf_dir | regex_replace('(?<=.)/+$', '')) | regex_escape }}/jmx_prometheus[.]yml|javaagent:[^\s=]*[$][^\s=]*jmx_prometheus_javaagent
    # the series' cassandra-env.sh and JVM options files: all of them (a Java other than cassandra_java_version's
    # reads another)
    _jvm_files: >-
      {{ _cassandra_config_files[_cassandra_config_series]
         | select('match', '^(jvm[0-9]*-server[.]options|cassandra-env[.]sh)$') | list }}
    # the files the role does not write that give the JVM options: cassandra.in.sh, the unit and its drop-ins
    _not_the_roles:
      - cassandra.in.sh
      - /usr/share/cassandra/cassandra.in.sh
      - /etc/systemd/system/cassandra.service
      - /etc/systemd/system/cassandra.service.d/*.conf
    # read on the node: in a run that writes, as written; in one that only looks, the ones the role does not write
    # from its template (kept by hand, your own templates)
    _on_node: >-
      {{ (_jvm_files if _cassandra_config_exporter_writes is not skipped
          else (cassandra_config_keep_files + (cassandra_config_template_overrides
                if cassandra_config_template_overrides is mapping else {}) | list)
               | select('in', _jvm_files) | unique | list) + _not_the_roles }}
    # what the role (or cassandra_service) is to write from the variables: the unit's environment
    # (cassandra_service_environment, JVM_EXTRA_OPTS); only looking, the extra options and your snippet of
    # cassandra-env.sh too
    _rendered: >-
      {{ (['cassandra_service_environment'] if (cassandra_service_environment | default({})
           if cassandra_service_environment | default({}) is mapping else {}).values() | map('string') | join(' ')
           is search(_agent) else [])
         + ([] if _cassandra_config_exporter_writes is not skipped
            else ['cassandra_jvm*_extra_options'] if _cassandra_config_java_options is search(_agent)
            else ['cassandra_config_template_snippets'] if _cassandra_config_snippet_env | string is search(_agent)
            else []) }}

- name: Say what the exporter's agent in a file still needs is left in place
  ansible.builtin.debug:
    msg: >-
      WARNING  {{ inventory_hostname }}: the Prometheus exporter is off, but {{ _kept | join(', ') }} still
      {{ 'gives' if _kept | length == 1 else 'give' }} Cassandra an exporter's agent or the role's config: its jar and
      config are left in place, or Cassandra would not start. Remove the agent's line there (the file, your copy or
      template, the extra options or your snippet{{ ', cassandra_service_environment' if 'cassandra_service_environment' in _kept
      else '' }}{{ ', systemctl edit cassandra for the unit' if _kept | select('match', '/etc/systemd/') | list else '' }}), or
      point it at a jar and config of your own, then run again to remove them.
  vars:
    cassandra_output: true
    _kept: "{{ cassandra_config_exporter_unused.stdout_lines | select('match', 'kept[|]') | map('regex_replace', '^kept[|]', '') | list }}"
  when: _kept | length > 0

- name: Remove them
  ansible.builtin.file:
    path: "{{ item.split('|', 1)[1] }}"
    state: absent
  loop: "{{ cassandra_config_exporter_unused.stdout_lines | reject('match', 'kept[|]') | list }}"

- name: Forget the jars removed
  ansible.builtin.lineinfile:
    path: "{{ cassandra_prometheus_exporter_dir | regex_replace('(?<=.)/+$', '') }}/.cassandra_config"
    line: "{{ item.split('|', 1)[1] | basename }}"
    state: absent
  loop: "{{ cassandra_config_exporter_unused.stdout_lines | select('match', 'jar[|]') | list }}"
  when: cassandra_prometheus_exporter_enabled | bool

# (only the directory of the jars the role downloaded, once empty: one with other files stays)
- name: Remove the exporter's directory once empty
  ansible.builtin.command:
    argv: [rmdir, --ignore-fail-on-non-empty, "{{ cassandra_prometheus_exporter_dir }}"]
  changed_when: false
  when:
    - not cassandra_prometheus_exporter_enabled | bool
    - cassandra_config_exporter_unused.stdout_lines | select('match', 'list[|]') | list | length > 0
    - not ansible_check_mode

# for the report and apply_config (no restart for them: the running JVM keeps what it opened until its restart)
- name: Note what is removed
  ansible.builtin.set_fact:
    _cassandra_config_exporter_changes: "{{ _before + _removed }}"
    _cassandra_config_items: "{{ _cassandra_config_items | default([]) + _removed }}"
  vars:
    _before: "{{ _cassandra_config_exporter_changes | default([]) if cassandra_prometheus_exporter_enabled | bool else [] }}"
    _removed: >-
      {%- set out = [] -%}
      {%- for line in cassandra_config_exporter_unused.stdout_lines if line.split('|', 1)[0] not in ['list', 'kept'] -%}
      {#-   (by its name: a path is shown as where a link points, in apply_config's plan) -#}
      {%-   set _ = out.append({'item': line.split('|', 1)[1] | basename, 'kind': 'removed', 'restart': false,
                                'before': 'present', 'after': 'removed'}) -%}
      {%- endfor -%}
      {{ out }}
