---
trivial:
- "cassandra_install, cassandra_linux, cassandra_firewall and cassandra_medusa roles, and the operation playbooks on their normal path (preflight, apply_config) - the installed packages are read by name (``rpm -q``, ``dpkg-query -W``) instead of ``package_facts``, and the preflight reads the state of the cassandra unit with ``systemctl show`` instead of ``service_facts``; those facts put every package and service of the node in its facts, which ansible-core 2.16 copies again for each task, seconds per task with the packages of a real server. The rescue paths of apply_config and add_node's read of a new node still run ``package_facts``."
- "apply_config playbook - the cluster checks read each node's addresses once, the list of the nodes to restart reads each node once; the JMX users and cqlsh credentials tasks are left out when none is set."
- "cassandra_install, cassandra_linux, cassandra_firewall and cassandra_medusa roles - they no longer fill ``ansible_facts.packages`` as a side effect (``package_facts`` is no longer run there); a play that reads it after these roles now runs ``ansible.builtin.package_facts`` itself. The operation playbooks' preflight no longer fills ``ansible_facts.services``."
