---
# Operator confirmation before a risky operation, once per run:
#   include_role: name=community.cassandra.cassandra_service tasks_from=confirm.yml
#   vars: cassandra_confirm_prompt: "what is about to happen, and the risk"
# cassandra_operation_confirm: false skips the question (non-interactive runs).
- name: Confirm the operation
  ansible.builtin.pause:
    prompt: "{{ cassandra_confirm_prompt }}\nType 'yes' to go on"
  register: cassandra_confirm_answer
  run_once: true
  when: cassandra_operation_confirm | bool

- name: Stop unless confirmed
  ansible.builtin.assert:
    that: cassandra_confirm_answer.user_input | default('') == 'yes'
    fail_msg: >-
      Not confirmed, nothing was changed. Run interactively and answer 'yes',
      or set cassandra_operation_confirm: false to go on without asking.
    quiet: true
  run_once: true
  when: cassandra_operation_confirm | bool
