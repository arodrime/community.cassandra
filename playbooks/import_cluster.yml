# Read a running cluster into an inventory, changing nothing on the nodes.
#
#   ansible-playbook community.cassandra.import_cluster -i node1,
#   ansible-playbook community.cassandra.import_cluster -e import_force=true --check --diff
#
# Give one node of a new cluster: the others are found in its ring. It checks
# that the roles would write each node's files as they are, then writes the
# hosts file, group_vars and host_vars to import_dir (passwords in
# secrets.yml, vaulted when a vault password file is set) and a report.
#
# A re-import reads the cluster from the inventory and keeps the files it did
# not write; --check --diff shows its changes first. A DataStax Enterprise or
# ScyllaDB node is refused before anything is written: Apache Cassandra only.
#
# Options and defaults: ansible-playbook community.cassandra.help -e help_topic=import_cluster

- name: Check the cluster asked for
  # A new cluster: give one of its nodes (or more) with -i <node>,. Any reachable
  # nodes will do: the others are found with nodetool status. Without -i <node>,
  # (a re-import), the inventory (ansible.cfg's, or -i <inventory file or dir>):
  # every host there is given (with its variables), or the hosts of the cluster
  # -e cassandra_hosts=<cluster group> or the environment variable
  # CASSANDRA_CLUSTER names when it holds other clusters (a name that is not in
  # the inventory stops the import at once: a new cluster is given by a node,
  # -i <node>,; CASSANDRA_CLUSTER is left out with -i <node>,; both set: the same cluster, else refused).
  # A re-import reads the cluster from the inventory (its connection variables,
  # its JMX and CQL logins, vaulted ones too), not from -i <node>, (which reads
  # none of them). Review it before it writes anything: --check --diff shows the
  # changes of each file it would write or remove (secrets.yml hidden), and
  # writes nothing in the inventory (its report only: report.check.txt):
  #   ansible-playbook community.cassandra.import_cluster -e cassandra_hosts=<cluster group> -e import_force=true --check --diff
  # then the same without --check --diff (-e cassandra_hosts left out when
  # CASSANDRA_CLUSTER names the cluster or the inventory holds it alone).
  # (a play first: the hosts of the first play can't be picked by a cluster name)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
  tasks:
    - name: No unknown variable
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: variables_check.yml
      vars:
        _cassandra_variables_check_renamed: false  # it reads neither the former names nor their name now
      tags: [always]  # under --tags too

    - name: Stop on a cluster not in the inventory
      ansible.builtin.assert:
        that: not _named or groups[_named] | default([]) | length > 0 or _by_name | bool
        fail_msg: >-
          {{ _named }} is not in the inventory{{ '' if cassandra_hosts | default('', true) else ' (CASSANDRA_CLUSTER)' }}:
          to import a new cluster, give one of its nodes: ansible-playbook -i <node>, community.cassandra.import_cluster.
          Nothing was written.
        quiet: true
      run_once: true
      vars:
        cassandra_output: true  # its message as is (the ops callback), no task dump
        # the cluster asked for: -e cassandra_hosts, else CASSANDRA_CLUSTER with an inventory of files (not -i <node>,)
        _named: >-
          {{ cassandra_hosts | default('', true) or (lookup('ansible.builtin.env', 'CASSANDRA_CLUSTER')
             if ansible_inventory_sources | reject('exists') | list | length == 0 else '') }}
        # CASSANDRA_CLUSTER may give a cassandra_cluster_name
        _by_name: >-
          {{ not cassandra_hosts | default('', true) and groups['all'] | map('extract', hostvars)
             | selectattr('cassandra_cluster_name', 'defined') | selectattr('cassandra_cluster_name', 'equalto', _named)
             | list | length > 0 }}

    # -e cassandra_hosts and CASSANDRA_CLUSTER (read with an inventory of files only) naming two clusters, as the
    # operation playbooks refuse them
    - name: Stop on two names for the cluster
      ansible.builtin.assert:
        that: _refusal == ''
        fail_msg: "{{ _refusal }} Nothing was written."
        quiet: true
      run_once: true
      when: >-
        cassandra_hosts | default('', true) | length > 0 and lookup('ansible.builtin.env', 'CASSANDRA_CLUSTER') | length > 0
        and ansible_inventory_sources | reject('exists') | list | length == 0
      vars:
        cassandra_output: true  # its message as is (the ops callback), no task dump
        _refusal: "{{ lookup('community.cassandra.cassandra_hosts', refusal=true) }}"

    # in the inventory: what the next play reads, its own error if any (a name several groups have, a
    # cassandra_node_state neither present nor absent): the next play's hosts can't say it
    - name: Check the cluster's hosts
      ansible.builtin.set_fact:
        _import_cluster_named: "{{ query('community.cassandra.cassandra_nodes') }}"
      run_once: true
      when: >-
        cassandra_hosts | default('', true) | length > 0 or (lookup('ansible.builtin.env', 'CASSANDRA_CLUSTER') | length > 0
        and ansible_inventory_sources | reject('exists') | list | length == 0)

- name: Find the cluster from the given nodes
  # -e cassandra_hosts, else CASSANDRA_CLUSTER with an inventory of files (not -i <node>,), else every host;
  # a cluster not in the inventory: none (stops in the last play, saying how to import a new cluster)
  hosts: >-
    {{ query('community.cassandra.cassandra_nodes', group=cassandra_hosts) if cassandra_hosts | default('', true)
       else query('community.cassandra.cassandra_nodes', errors='ignore')
            if lookup('ansible.builtin.env', 'CASSANDRA_CLUSTER') and ansible_inventory_sources | reject('exists') | list | length == 0
       else query('community.cassandra.cassandra_nodes', group='all') }}
  gather_facts: false  # (below, after the phase line)
  become: true  # nodetool reads the JMX password file (cassandra's, 0400)
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Check each node has its own facts
      ansible.builtin.import_tasks: tasks/own_facts_check.yml

    # import_host_names: hostname (default, the short one as the node
    # reports it), fqdn or ip: the name of each node.
    - name: Check the options
      ansible.builtin.assert:
        that: import_host_names | default('hostname') in ['hostname', 'fqdn', 'ip']
        fail_msg: "import_host_names must be hostname, fqdn or ip, not {{ import_host_names | default('') }}"
        quiet: true
      run_once: true
      vars:
        cassandra_output: true

    # import_group: the cluster's group (default: its cluster name's, test_cluster for Test Cluster), an Ansible group
    # name, written in lower case
    - name: Check the group asked for
      ansible.builtin.assert:
        that: _error | length == 0
        fail_msg: "{{ _error }}"
        quiet: true
      run_once: true
      when: import_group | default('', true) | string | length > 0
      vars:
        cassandra_output: true
        _error: "{{ import_group | string | community.cassandra.cassandra_import_group_error }}"

    # --limit is refused: it would leave out the nodes found in the ring, and localhost, whose play writes the
    # inventory
    - name: Stop on --limit
      ansible.builtin.assert:
        that: ansible_limit is not defined
        fail_msg: >-
          --limit would leave out the nodes found in the ring and localhost, which writes the inventory: give the
          nodes with -i <node>, or, with the inventory, -e cassandra_hosts=<cluster group>. Nothing was written.
        quiet: true
      run_once: true
      vars:
        cassandra_output: true

    - name: Say what the run does
      ansible.builtin.debug:
        msg: "{{ 'import_given' | community.cassandra.cassandra_phase(ansible_play_hosts_all) }}"
      run_once: true
      vars:
        cassandra_output: true  # a phase line (ops callback)
        cassandra_output_gap: true  # a block of its own

    - name: Gather the network facts
      ansible.builtin.setup:
        gather_subset: [network]

    # JMX access: the cassandra_service variables (cassandra_jmx_port,
    # cassandra_jmx_username, cassandra_jmx_password_file...), written to the
    # inventory too.
    - name: Load the cassandra_service and cassandra_operation defaults (JMX access)
      ansible.builtin.include_role:
        name: "community.cassandra.{{ item }}"
        tasks_from: defaults.yml
        public: true
      loop: [cassandra_service, cassandra_operation]

    - name: Remember the given nodes (add_host extends the play)
      ansible.builtin.set_fact:
        import_cluster_given: "{{ ansible_play_hosts_all }}"  # unreachable ones too, for the errors
      run_once: true

    # Remote JMX over TLS (the running JVM's last -Dcom.sun.management.jmxremote.ssl): nodetool needs --ssl, and
    # the options of root's ~/.cassandra/nodetool-ssl.properties (bin/nodetool adds them), before it is run here
    - name: Find whether JMX runs over TLS on the given nodes
      ansible.builtin.shell: |
        for p in $(pgrep -x java); do
          tr '\0' '\n' < /proc/$p/cmdline | grep -qx org.apache.cassandra.service.CassandraDaemon || continue
          echo "ssl=$(tr '\0' '\n' < /proc/$p/cmdline | sed -n 's/^-Dcom[.]sun[.]management[.]jmxremote[.]ssl=//p' | tail -1)"
          [ -r ~/.cassandra/nodetool-ssl.properties ] && echo "properties=yes"
          break
        done
        exit 0
      register: import_cluster_jmx_tls
      changed_when: false
      failed_when: false
      check_mode: false  # read only

    - name: Use JMX over TLS where the JVM serves it
      ansible.builtin.set_fact:
        cassandra_jmx_ssl_enabled: true
      when: "'ssl=true' in import_cluster_jmx_tls.stdout_lines | default([])"

    - name: Stop on JMX over TLS without nodetool's settings
      ansible.builtin.assert:
        that: _missing | length == 0
        fail_msg: >-
          JMX runs over TLS on {{ _missing | join(', ') }} (-Dcom.sun.management.jmxremote.ssl=true), and nodetool
          finds no ~/.cassandra/nodetool-ssl.properties for root there. Write it (one option per line:
          -Djavax.net.ssl.trustStore=<a truststore trusting the node's certificate>,
          -Djavax.net.ssl.trustStorePassword=<its password>, with client authentication -Djavax.net.ssl.keyStore=
          and -Djavax.net.ssl.keyStorePassword=), then run import_cluster again. Nothing was changed.
        quiet: true
      run_once: true
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _missing: >-
          {%- set out = [] -%}
          {%- for h in import_cluster_given -%}
          {%-   set read = (hostvars[h].import_cluster_jmx_tls | default({})).stdout_lines | default([]) -%}
          {%-   if 'ssl=true' in read and 'properties=yes' not in read -%}
          {%-     set _ = out.append(h) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

    # DataStax Enterprise and ScyllaDB answer nodetool status too: what runs on the given nodes, before the ring
    # is read (files/import_distribution.sh: the java processes' main class, the dse and scylla commands and
    # configuration directories, their versions; nothing started)
    - name: Read what runs on the given nodes
      ansible.builtin.shell: |
        {{ lookup('ansible.builtin.file', playbook_dir ~ '/files/import_distribution.sh') }}
        # nothing known runs here: a DataStax Enterprise build answers nodetool with a four-number
        # ReleaseVersion (4.0.0.6816)
        [ -z "$dist" ] && echo "release=$({{ _cassandra_service_nodetool }} version 2>/dev/null | sed -n 's/^ReleaseVersion: //p')"
        exit 0
      register: import_cluster_distribution
      changed_when: false
      failed_when: false
      check_mode: false  # read only
      no_log: "{{ cassandra_jmx_password | default('') | length > 0 }}"  # (nodetool -pw)

    - name: Refuse a DataStax Enterprise or ScyllaDB cluster
      ansible.builtin.assert:
        that: _refused | length == 0
        fail_msg: "{{ _refused | join(_nl) }}"
        quiet: true
      run_once: true
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _read: >-
          {%- set out = {} -%}
          {%- for h in import_cluster_given if hostvars[h].import_cluster_distribution.stdout is defined -%}
          {%-   set _ = out.update({h: hostvars[h].import_cluster_distribution.stdout}) -%}
          {%- endfor -%}
          {{ out }}
        _refused: "{{ _read | community.cassandra.cassandra_import_unsupported }}"

    - name: Read the ring
      community.cassandra.cassandra_status:
        down: 10000  # read it whatever the state of the nodes
      module_defaults:
        community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
      register: import_cluster_ring
      failed_when: false

    # without -i <node>, (the inventory of ansible.cfg) every host there is given: one cluster's only; nodes of
    # two rings stop the import
    - name: Stop on nodes of several clusters
      ansible.builtin.assert:
        that: _apart | length == 0
        fail_msg: >-
          {{ _apart | join(', ') }} not in the ring of {{ _rings | list | first | default("") }}: the given nodes are of several
          clusters. Give a node of one cluster (-i <node>,), or run with the inventory and -e cassandra_hosts=<its
          cluster group> (or CASSANDRA_CLUSTER=<its cluster group>). Nothing was written.
        quiet: true
      run_once: true
      vars:
        cassandra_output: true
        # each given node that answered: the addresses of its ring
        _rings: >-
          {%- set out = {} -%}
          {%- for h in import_cluster_given if hostvars[h].import_cluster_ring.cluster_status | default({}) -%}
          {%-   set addrs = [] -%}
          {%-   for dc, info in hostvars[h].import_cluster_ring.cluster_status.items() -%}
          {%-     set _ = addrs.extend(info.nodes | map(attribute='address')) -%}
          {%-   endfor -%}
          {%-   set _ = out.update({h: addrs}) -%}
          {%- endfor -%}
          {{ out }}
        _apart: >-
          {%- set first = _rings[_rings | list | first] if _rings else [] -%}
          {%- set out = [] -%}
          {%- for h, addrs in _rings.items() if not addrs | intersect(first) -%}{%- set _ = out.append(h) -%}{%- endfor -%}
          {{ out }}

    - name: List the nodes of the ring the inventory does not have yet
      ansible.builtin.set_fact:
        import_cluster_from: "{{ _from }}"
        import_cluster_new: "{{ hostvars[_from].import_cluster_ring.cluster_status | community.cassandra.cassandra_ring_nodes
                                | map(attribute='address') | reject('in', _known) | list if _from else [] }}"
      run_once: true
      vars:
        # the first given node that read the ring
        _from: >-
          {%- set out = [] -%}
          {%- for h in import_cluster_given if hostvars[h].import_cluster_ring.cluster_status | default({}) -%}
          {%-   set _ = out.append(h) -%}
          {%- endfor -%}
          {{ out | first | default('') }}
        # without iproute a host gathers no interface facts: its default and connection addresses still count
        _known: >-
          {%- set out = [] -%}
          {%- for h in import_cluster_given -%}
          {%-   set _ = out.extend(hostvars[h].ansible_facts.all_ipv4_addresses | default([])) -%}
          {%-   set _ = out.append(hostvars[h].ansible_facts.default_ipv4.address | default('')) -%}
          {%-   set _ = out.append(hostvars[h].ansible_host | default('')) -%}
          {%- endfor -%}
          {{ out | select | unique | list }}

    # reached as the given node is: by the name it knows them by (getent hosts there; short, or the fqdn when the
    # given name has a domain; ssh config and known_hosts entries match names) when the controller can reach that
    # name (it resolves it, or the ssh config gives it a HostName or a jump host; always with a connection by
    # name, docker...), else by their address; with its connection variables (ansible_user, port, key, ssh args,
    # become...); at their ring address when the given node has an address of its own (ansible_host). One not
    # reached is named by its address, and listed as not read.
    - name: Find the names of the nodes found in the ring, as the given node knows them
      ansible.builtin.command:
        argv: "{{ ['getent', 'hosts'] + import_cluster_new }}"
      delegate_to: "{{ import_cluster_from or inventory_hostname }}"  # (templated before the when, since ansible-core 2.19)
      run_once: true
      register: import_cluster_peer_names
      changed_when: false
      failed_when: false  # 2: some not found
      check_mode: false
      when: import_cluster_new | length > 0

    - name: Check the controller can reach them by these names (an address, or an ssh config entry)
      ansible.builtin.shell: |
        set -f
        for n in $IMPORT_CLUSTER_NAMES; do
          # an address, or an ssh config entry: a HostName of its own, or a jump host
          g=$(ssh -G "$n" 2>/dev/null)
          h=$(printf '%s\n' "$g" | awk 'tolower($1) == "hostname" {print tolower($2); exit}')
          l=$(printf '%s\n' "$n" | tr '[:upper:]' '[:lower:]')
          if getent ahosts "$n" >/dev/null 2>&1 || { [ -n "$h" ] && [ "$h" != "$l" ]; } \
             || printf '%s\n' "$g" | grep -qiE '^(proxyjump|proxycommand) '; then echo "$n"; fi
        done
      args:
        executable: /bin/sh
      environment:
        IMPORT_CLUSTER_NAMES: "{{ _names.values() | reject('in', import_cluster_new) | join(' ') }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: import_cluster_peer_usable
      changed_when: false
      failed_when: false
      check_mode: false
      when: import_cluster_new | length > 0 and not _by_name | bool
      vars:
        ansible_connection: local  # never an inventory's connection to localhost
        ansible_become: false  # an inventory ansible_become beats the become keyword
        _names: >-
          {{ import_cluster_peer_names.stdout | default('')
             | community.cassandra.cassandra_ring_names(import_cluster_new, import_cluster_from) }}
        _by_name: "{{ hostvars[import_cluster_from].ansible_connection | default('ssh') | regex_replace('^ansible[.]builtin[.]', '') not in _ssh }}"
        _ssh: [ssh, smart, paramiko, paramiko_ssh, local]

    - name: Add the nodes the inventory does not have yet
      ansible.builtin.add_host:
        name: "{{ _name }}"
        ansible_host: "{{ item if _name == item or (_by_address | bool and not _by_name | bool) else omit }}"
        import_cluster_address: "{{ item }}"
        groups: [import_cluster_found]
        ansible_connection: "{{ omit if _connection in ['', 'local', 'ansible.builtin.local'] else _connection }}"
        ansible_user: "{{ _given.ansible_user | default(omit) }}"
        ansible_ssh_user: "{{ _given.ansible_ssh_user | default(omit) }}"
        ansible_port: "{{ _given.ansible_port | default(omit) }}"
        ansible_ssh_port: "{{ _given.ansible_ssh_port | default(omit) }}"
        ansible_password: "{{ _given.ansible_password | default(omit) }}"
        ansible_ssh_pass: "{{ _given.ansible_ssh_pass | default(omit) }}"
        ansible_private_key_file: "{{ _given.ansible_private_key_file | default(omit) }}"
        ansible_ssh_private_key_file: "{{ _given.ansible_ssh_private_key_file | default(omit) }}"
        ansible_ssh_common_args: "{{ _given.ansible_ssh_common_args | default(omit) }}"
        ansible_ssh_extra_args: "{{ _given.ansible_ssh_extra_args | default(omit) }}"
        ansible_ssh_executable: "{{ _given.ansible_ssh_executable | default(omit) }}"
        ansible_scp_extra_args: "{{ _given.ansible_scp_extra_args | default(omit) }}"
        ansible_sftp_extra_args: "{{ _given.ansible_sftp_extra_args | default(omit) }}"
        ansible_ssh_pipelining: "{{ _given.ansible_ssh_pipelining | default(omit) }}"
        ansible_timeout: "{{ _given.ansible_timeout | default(omit) }}"
        ansible_become: "{{ _given.ansible_become | default(omit) }}"
        ansible_become_method: "{{ _given.ansible_become_method | default(omit) }}"
        ansible_become_user: "{{ _given.ansible_become_user | default(omit) }}"
        ansible_become_password: "{{ _given.ansible_become_password | default(omit) }}"
        ansible_become_pass: "{{ _given.ansible_become_pass | default(omit) }}"
        ansible_become_exe: "{{ _given.ansible_become_exe | default(omit) }}"
        ansible_become_flags: "{{ _given.ansible_become_flags | default(omit) }}"
        ansible_remote_tmp: "{{ _given.ansible_remote_tmp | default(omit) }}"
        ansible_python_interpreter: "{{ _given.ansible_python_interpreter | default(omit) }}"
      loop: "{{ import_cluster_new }}"
      run_once: true
      no_log: true  # the given node's passwords, if any
      vars:
        _given: "{{ hostvars[import_cluster_from] }}"
        _connection: "{{ _given.ansible_connection | default('') }}"
        _names: >-
          {{ import_cluster_peer_names.stdout | default('')
             | community.cassandra.cassandra_ring_names(import_cluster_new, import_cluster_from) }}
        # a connection that reaches its hosts by name only (docker, podman, lxd...): by the name, as it is
        _by_name: "{{ _given.ansible_connection | default('ssh') | regex_replace('^ansible[.]builtin[.]', '') not in _ssh }}"
        _ssh: [ssh, smart, paramiko, paramiko_ssh, local]
        # by name when the controller can reach it so (an address, an ssh config entry), else by the address;
        # a name the inventory has already (another host, maybe another cluster's): the address
        _usable: "{{ _by_name | bool or _names[item] in (import_cluster_peer_usable.stdout | default('')).split() }}"
        _name: "{{ item if _names[item] in groups['all'] or not _usable | bool else _names[item] }}"
        # the given node reached at an address of its own (ansible_host, or the older ansible_ssh_host): the found
        # ones at theirs
        _by_address: >-
          {{ _given.ansible_host | default(_given.ansible_ssh_host | default(import_cluster_from)) != import_cluster_from }}

    - name: Stop if no node answered
      ansible.builtin.assert:
        that: import_cluster_given | map('extract', hostvars) | map(attribute='import_cluster_ring.cluster_status', default={}) | select | list | length > 0
        fail_msg: >-
          {{ ['nodetool status failed on every given node. Is Cassandra running, and the JMX access right'
              ~ ' (cassandra_jmx_port, cassandra_jmx_username, cassandra_jmx_password_file or _password)?'] + _errors }}
      vars:
        cassandra_output: true
        # "Read the ring" shows ok whatever happened: each node's error
        _errors: >-
          {%- set out = [] -%}
          {%- for h in import_cluster_given -%}
          {%-   set r = hostvars[h].import_cluster_ring | default({}) -%}
          {%-   set m = r.msg | default('no result') -%}
          {%-   set e = (r.stderr | default('')).splitlines() | first | default('') -%}
          {%-   set _ = out.append(h ~ ': ' ~ ('unreachable' if r == {}
                                              else (m ~ ('' if e | regex_replace('^error: *', '') in m else ' ' ~ e))
                                                   | trim | truncate(400))) -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    # for the play that writes the inventory: on the controller, read there without the variables of every host
    - name: Keep the given nodes and the ring on the controller
      ansible.builtin.set_fact:
        import_cluster_given: "{{ import_cluster_given }}"
        import_cluster_ring_nodes: "{{ hostvars[import_cluster_from].import_cluster_ring.cluster_status | community.cassandra.cassandra_ring_nodes }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      become: false
      vars:
        ansible_become: false  # an inventory ansible_become beats the become keyword


# the given nodes and the ones found in the ring (not the inventory's other hosts); a host marked
# cassandra_node_state: absent (an inventory given back) is not read (cassandra_nodes leaves it out above)
- name: Read every node
  hosts: >-
    {{ (groups['all'] | map('extract', hostvars) | selectattr('import_cluster_given', 'defined')
        | map(attribute='import_cluster_given') | first | default([])) + groups['import_cluster_found'] | default([]) }}
  gather_facts: false
  ignore_unreachable: true
  become: true
  vars:
    _files:
      - cassandra.yaml
      - cassandra-env.sh
      - jvm-server.options
      - jvm8-server.options
      - jvm11-server.options
      - jvm17-server.options
      - cassandra-rackdc.properties
      - logback.xml
    # reads files on a node in one go (see the script)
    _read_files: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/import_read_files.py') }}"
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Load the cassandra_service and cassandra_operation defaults (JMX access)
      ansible.builtin.include_role:
        name: "community.cassandra.{{ item }}"
        tasks_from: defaults.yml
        public: true
      loop: [cassandra_service, cassandra_operation]

    # (one line for the run: per-node lines would come all at once, each task waits for every node)
    - name: Say what is read on the nodes
      ansible.builtin.debug:
        msg: >-
          Reading {{ ansible_play_hosts_all | length }} node{{ 's' if ansible_play_hosts_all | length > 1 else '' }}:
          facts, packages, the running Cassandra, its config{{ (' (' ~ _forks ~ ' at a time: forks = '
          ~ ansible_play_hosts_all | length ~ ' in ansible.cfg reads them together)')
          if ansible_play_hosts_all | length > _forks | int else '' }}...
      run_once: true
      vars:
        cassandra_output: true
        _forks: "{{ ansible_forks | default(lookup('ansible.builtin.config', 'DEFAULT_FORKS')) | int }}"  # (-f too)

    # (virtual: whether cassandra_linux applies its settings live there, a container's are the host's)
    - name: Gather facts
      ansible.builtin.setup:
        gather_subset: [network, distribution, virtual]

    # No module reads a running JVM: its command line and its java binary
    - name: Read the running Cassandra (conf dir, Cassandra and Java versions)
      ansible.builtin.shell: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/templates/import_running.sh.j2') }}"
      environment:
        IMPORT_CLUSTER_PACKAGES: >-
          cassandra cassandra-tools jemalloc libjemalloc2
          {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../roles/cassandra_repository/defaults/main.yml') | from_yaml).debian_packages
             | join(' ') }}
        # (a node not reached has no facts: the task is then unreachable too, the reason the report gives)
        IMPORT_CLUSTER_OS_FAMILY: "{{ ansible_facts['os_family'] | default('') }}"
      register: import_cluster_running
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: "{{ cassandra_jmx_password | default('') | length > 0 }}"  # (nodetool -pw)

    # a node found in the ring, or re-imported, that runs DataStax Enterprise or ScyllaDB: refused as the given ones
    - name: Refuse a DataStax Enterprise or ScyllaDB node
      ansible.builtin.assert:
        that: _refused | length == 0
        fail_msg: "{{ _refused | join(_nl) }}"
        quiet: true
      run_once: true
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _read: >-
          {%- set out = {} -%}
          {%- for h in ansible_play_hosts if hostvars[h].import_cluster_running.stdout is defined -%}
          {%-   set _ = out.update({h: hostvars[h].import_cluster_running.stdout}) -%}
          {%- endfor -%}
          {{ out }}
        _refused: "{{ _read | community.cassandra.cassandra_import_unsupported }}"

    - name: Work out the series and the conf dir
      ansible.builtin.set_fact:
        import_cluster_version: "{{ _kv.version }}"
        import_cluster_series: "{{ _kv.version.split('.')[:2] | join('') ~ 'x' }}"
        import_cluster_java: "{{ _kv.java.split('.')[1] if _kv.java.startswith('1.') else _kv.java }}"
        # not from a package: the directory above bin/java
        import_cluster_java_home: "{{ _kv.javabin | dirname | dirname if _kv.javapkg | default('') == '' else '' }}"
        import_cluster_system_java: "{{ _kv.sysjava | default('') }}"
        import_cluster_java_bin: "{{ _kv.javabin | default('') }}"
        # a link to the running Java's home that /usr/bin/java goes through (not for a package Java)
        import_cluster_java_link: "{{ _kv.javalink | default('') if _kv.javapkg | default('') == '' else '' }}"
        # updated since Cassandra started: the java it runs, gone (the java read is its new build)
        import_cluster_java_updated: "{{ _kv.javaupdated | default('') }}"
        # its unit's JAVA_HOME, that Java gone
        import_cluster_java_home_gone: "{{ _kv.javahomegone | default('') }}"
        import_cluster_held: "{{ _kv.held | default('') | split }}"
        import_cluster_dsbulk: "{{ _kv.dsbulk | default('') }}"
        import_cluster_repo_files: "{{ _kv.repo_files | default('') | split }}"
        # the package query answered (dnf repoquery, apt lists): else an air-gapped host, or repositories down
        import_cluster_repos_answer: "{{ _kv.pkg_query is defined }}"
        import_cluster_java_package: "{{ _kv.javapkg | default('') }}"
        import_cluster_package: "{{ _installed.cassandra | default('') }}"
        # {name: version} of the ones the import looks at
        import_cluster_packages: "{{ _installed }}"
        # installed, but no configured repository offers it (the query ran): from a package file
        import_cluster_package_from_file: >-
          {{ 'cassandra' in _installed and _kv.pkg_query is defined and _kv.pkg_repo is not defined }}
        import_cluster_conf_dir: >-
          {{ _kv.config | dirname if _kv.config is match('/')
             else ('/etc/cassandra/conf' if ansible_facts['os_family'] == 'RedHat' else '/etc/cassandra') }}
        import_cluster_log_dir: "{{ _kv.logdir | default('') }}"
        # cqlsh does not start: why (its last error line, not found...)
        import_cluster_cqlsh_error: "{{ _kv.cqlsh_error | default('') }}"
        import_cluster_storage_dir: "{{ _kv.storagedir | default('') }}"
        import_cluster_conf_target: "{{ _kv.conftarget | default('') }}"
        import_cluster_account:
          user: "{{ _kv.run_user | default('') }}"
          group: "{{ _kv.run_group | default('') }}"
        # set up another way (no mark of the roles): the roles leave it as it is on this node (the OS settings: their
        # values imported instead, cassandra_os_import)
        # (rc10: nothing any more; the parts are imported, the self-check stops on what they cannot express)
        import_cluster_keep: {}
        # a configured repository offers the cassandra package (the query answered)
        import_cluster_package_offered: "{{ _kv.pkg_repo is defined and _kv.pkg_query is defined }}"
        # cqlsh's Python set up by cassandra_install (its wrapper, or its cqlshlib link)
        import_cluster_own_cqlsh: "{{ _kv.own_cqlsh is defined }}"
        # what cassandra_install sets up for the package's cqlsh, as the node has it (the read script says each)
        import_cluster_cqlsh:
          py3: "{{ _kv.cqlsh_py3 | default('') }}"
          py311: "{{ _kv.cqlsh_py311 is defined }}"
          wrapper: "{{ _kv.cqlsh_wrapper | default('absent') }}"
          profile: "{{ _kv.cqlsh_profile | default('absent') }}"
          # the Python each of them names, when the role wrote it
          wrapper_py: "{{ _kv.cqlsh_wrapper_py | default('') }}"
          profile_py: "{{ _kv.cqlsh_profile_py | default('') }}"
          wrapper_sum: "{{ _kv.cqlsh_wrapper_sum | default('') }}"
          profile_sum: "{{ _kv.cqlsh_profile_sum | default('') }}"
          # path|site-packages|cqlshlib|ok or its last error line, of each Python the roles may give it
          pythons: "{{ _kv | dict2items | selectattr('key', 'match', '^cqlsh_python_') | map(attribute='value') | list }}"
          ran: "{{ _kv.cqlsh_ran | default('') }}"
          # the same, links followed on the node: {path: the file it is}
          real:
            ran: "{{ _kv.cqlsh_ran_real | default('') }}"
            /usr/bin/cqlsh: "{{ _kv.cqlsh_usr_bin_real | default('') }}"
            /usr/local/bin/cqlsh: "{{ _kv.cqlsh_usr_local_real | default('') }}"
        # the cqlsh the playbooks run (the inventory's, or -e)
        import_cluster_cqlsh_command: "{{ cassandra_cqlsh_command | default('cqlsh', true) }}"
        # cassandra_linux's limits file with its mark: a node the roles set up
        import_cluster_own_os: "{{ _kv.own_os is defined }}"
        # the unit of cassandra_service (its mark)
        import_cluster_own_unit: "{{ _kv.own_unit is defined }}"
        import_cluster_unit:
          file: "{{ _kv.unit_SourcePath | default('') or _kv.unit_FragmentPath | default('') }}"
          restart: "{{ _kv.unit_Restart | default('') }}"
          boot: >-
            {{ _kv.unit_IsEnabled | default('') if _kv.unit_UnitFileState | default('') in ['', 'generated']
               else _kv.unit_UnitFileState }}
          # everything else the unit sets (e.g. LOCAL_JMX=no), and the files it reads variables from
          env: "{{ _kv.unit_Environment | default('') | community.cassandra.cassandra_unit_environment }}"
          env_files: "{{ _kv.unit_EnvironmentFiles | default('') }}"
          # what the JVM got for cassandra-env.sh to add (JVM_EXTRA_OPTS, MX4J_*), whatever set it
          jvm_env: "{{ dict(_kv.jvm_env | default('') | b64decode | split('\n') | select | map('split', '=', 1)) }}"
          # why its arguments and environment are not the unit's ('': they are): not read for the proofs
          jvm_untrusted: "{{ _kv.jvm_untrusted | default('') | regex_replace(';$', '') }}"
          # the cassandra.in.sh files that name CASSANDRA_HEAPDUMP_DIR (set before cassandra-env.sh, unseen)
          heapdump_before: "{{ _kv.heapdump_before | default('') | trim }}"
          # an init script (SysV): its path, the package it comes from as installed, or modified ('': not a package's)
          script: "{{ _kv.unit_SourcePath | default('') }}"
          # drop-ins of the unit (cassandra.service.d): what they set holds only for a unit
          dropins: "{{ _kv.unit_DropInPaths | default('') }}"
          # their lines besides Environment= (the roles carry only that with the init script of the package)
          dropin_other: "{{ _kv.unit_dropin_other | default('') }}"
          pkg_script: "{{ _kv.pkg_script | default('') }}"
      vars:
        _kv: "{{ dict(import_cluster_running.stdout_lines | map('split', '=', 1)) }}"
        _pairs: "{{ _kv | dict2items | selectattr('key', 'match', 'installed_') | list }}"
        _installed: "{{ dict(_pairs | map(attribute='key') | map('regex_replace', '^installed_', '') | zip(_pairs | map(attribute='value'))) }}"
      when: import_cluster_running.rc | default(1) == 0

    # config files written since Cassandra started: it may not run what they say (a restart pending, or not)
    - name: Find when the running Cassandra started
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: jvm_started.yml
      when: import_cluster_series is defined

    # Each file read or stat'ed by a module is a round trip to the node: here one command per step reads them all
    # (_read_files: what slurp, stat and find give, as they give it), its output kept as their results were.
    # cassandra_jvm.start: the config files written since Cassandra started (it may not run what they say)
    - name: Read the config files, when they were written, the JVM's arguments, the repository files and the unit
      ansible.builtin.command:
        argv: "{{ [ansible_facts.python.executable, '-c', _read_files] }}"
        stdin: "{{ _wanted | to_json }}"
      register: import_cluster_files
      changed_when: false
      failed_when: false
      check_mode: false  # read only
      no_log: true  # keystore passwords, (a keystore password can be a JVM argument), credentials, the unit's Environment
      when: _wanted | length > 0
      vars:
        _supported: "{{ import_cluster_series is defined and import_cluster_series in ['40x', '41x', '50x'] }}"
        _repo: >-
          {{ import_cluster_repo_files | default([])
             + (['/etc/apt/auth.conf.d/cassandra.conf'] if ansible_facts['os_family'] | default('') == 'Debian' else []) }}
        # [what, how, [[item, path]...]]: the files' content (as slurp), stat (follow), stat with a checksum, find
        _wanted: >-
          {{ ([['newer', 'find', [[import_cluster_conf_dir, _cassandra_service_config_files]]]]
              if import_cluster_series is defined and cassandra_jvm.start is defined else [])
             + ([['config', 'content', _files | zip(_files | map('regex_replace', '^', import_cluster_conf_dir ~ '/')) | list]]
                if _supported | bool else [])
             + ([['cmdline', 'content', [['cmdline', '/proc/' ~ cassandra_jvm.pid ~ '/cmdline']]]]
                if _supported | bool and cassandra_jvm.pid | default('') != ''
                   and import_cluster_unit.jvm_untrusted | default('') == '' else [])
             + ([['repo', 'content', _repo | zip(_repo) | list]] if import_cluster_repo_files | default([]) | length > 0 else [])
             + ([['unit', 'content', [['cassandra.service', import_cluster_unit.file]]]]
                if _supported | bool and 'cassandra_service_unit_manage' not in import_cluster_keep
                   and import_cluster_unit.file != '' and import_cluster_unit.script | default('') == '' else []) }}

    - name: Keep what was read
      ansible.builtin.set_fact:
        import_cluster_conf_files: "{{ (_read.newer | first) if 'newer' in _read else {} }}"
        import_cluster_slurp: {results: "{{ _read.config | default([]) }}"}
        import_cluster_jvm_cmdline: "{{ _read.cmdline | default([{}]) | first }}"
        import_cluster_repo_slurp: {results: "{{ _read.repo | default([]) }}"}
        import_cluster_unit_slurp: "{{ _read.unit | default([{}]) | first }}"
      no_log: true
      when: import_cluster_files is not skipped
      vars:
        _read: "{{ import_cluster_files.stdout | from_json if import_cluster_files.rc | default(1) == 0 else {} }}"

    - name: Note the ones written since it started
      ansible.builtin.set_fact:
        import_cluster_newer_files: >-
          {{ import_cluster_conf_files.files | selectattr('ctime', '>', cassandra_jvm.start | float)
             | map(attribute='path') | map('basename') | sort }}
      when: import_cluster_conf_files.files is defined

    # remote JMX users: the password and access files the JVM reads, whatever their names (its arguments, else
    # cassandra-env.sh, else the JVM options files), the role's paths when none is given
    - name: Find the JMX password and access files the JVM reads
      ansible.builtin.set_fact:
        import_cluster_jmx_files: >-
          {{ _live['cassandra-env.sh'] | default('') | community.cassandra.cassandra_jmx_files(
               _live | dict2items | selectattr('key', 'match', 'jvm[0-9]*-server[.]options$') | items2dict,
               import_cluster_jvm_cmdline.content | default('') | b64decode, import_cluster_conf_dir,
               _live['cassandra.yaml'] | default('')) }}
      no_log: "{{ not import_debug | default(false) | bool }}"  # the files read, on an error
      when: import_cluster_series is defined and import_cluster_series in ['40x', '41x', '50x']
      vars:
        _live: >-
          {{ dict(import_cluster_slurp.results | selectattr('content', 'defined') | map(attribute='item')
                  | zip(import_cluster_slurp.results | selectattr('content', 'defined') | map(attribute='content')
                        | map('b64decode'))) }}

    # the JMX users' files (not the role's paths when the JVM's are unknown: not read); the Cassandra repository
    # files: cassandra_repository takes over only the ones it would write as they are (their mode, the signing
    # keys they name)
    - name: Read the JMX users, the repository files' mode and their signing keys
      ansible.builtin.command:
        argv: "{{ [ansible_facts.python.executable, '-c', _read_files] }}"
        stdin: "{{ _wanted | to_json }}"
      register: import_cluster_users_read
      changed_when: false
      failed_when: false
      check_mode: false  # read only
      no_log: true  # the JMX passwords, the checksum of the credentials file
      when: _wanted | length > 0
      vars:
        _jmx:
          - [jmxremote.password, "{{ import_cluster_jmx_files.password | default('', true) or '/etc/cassandra/jmxremote.password' }}"]
          - [jmxremote.access, "{{ import_cluster_jmx_files.access | default('', true) or '/etc/cassandra/jmxremote.access' }}"]
        _repo: >-
          {{ (import_cluster_repo_slurp.results | default([]) | selectattr('content', 'defined') | map(attribute='item') | list
              + import_cluster_repo_slurp.results | default([]) | selectattr('content', 'defined') | map(attribute='content')
                | map('b64decode') | map('regex_findall', '(?m)^(?:gpgkey\s*=\s*file://|Signed-By:\s*)(\S+)') | flatten)
             | unique }}
        # the Prometheus exporter's agent the config files give its Java (as the import finds it): its jar's sha256,
        # its config
        _exporter: >-
          {{ dict(import_cluster_slurp.results | default([]) | selectattr('content', 'defined') | map(attribute='item')
                  | zip(import_cluster_slurp.results | default([]) | selectattr('content', 'defined') | map(attribute='content')
                        | map('b64decode')))
             | community.cassandra.cassandra_prometheus_agent_paths(import_cluster_series | default(''),
                                                                    import_cluster_java | default('')) }}
        _wanted: >-
          {{ ([['jmx', 'content', _jmx]]
              if import_cluster_series is defined and import_cluster_series in ['40x', '41x', '50x']
                 and not import_cluster_jmx_files.unknown | default('') else [])
             + ([['repo', 'checksum', _repo | zip(_repo) | list]] if import_cluster_repo_files | default([]) | length > 0 else [])
             + ([['exporter_jar', 'sha256', [[_exporter.jar, _exporter.jar]]],
                 ['exporter_config', 'content', [[_exporter.config, _exporter.config]]]]
                if _exporter else []) }}

    - name: Keep the JMX users and the repository files' mode
      ansible.builtin.set_fact:
        import_cluster_jmx_slurp: {results: "{{ _read.jmx | default([]) }}"}
        import_cluster_repo_stat: {results: "{{ _read.repo | default([]) }}"}
        import_cluster_exporter_read:
          sha256: "{{ (_read.exporter_jar | default([{}]) | first).sha256 | default('') }}"
          config: "{{ (_read.exporter_config | default([{}]) | first).content | default('') }}"
          # (the paths read: the import takes them for the agent it finds only)
          jar: "{{ (_read.exporter_jar | default([{}]) | first).item | default('') }}"
          config_file: "{{ (_read.exporter_config | default([{}]) | first).item | default('') }}"
      no_log: true
      when: import_cluster_users_read is not skipped
      vars:
        _read: "{{ import_cluster_users_read.stdout | from_json if import_cluster_users_read.rc | default(1) == 0 else {} }}"

    # (each file's own error is in its result: the command failing is the script's, nothing of the node is read)
    - name: Note a node whose files could not be read
      ansible.builtin.set_fact:
        import_cluster_error: "its files could not be read: {{ (_failed.stderr | default('', true) or _failed.msg | default('', true) or '?').splitlines() | last }}"
      when: _failed != {}
      vars:
        _failed: >-
          {{ ([import_cluster_files, import_cluster_users_read] | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list
              + [import_cluster_files, import_cluster_users_read] | selectattr('unreachable', 'defined') | selectattr('unreachable') | list)
             | first | default({}) }}

    - name: Tell whether cassandra_repository would write them as they are
      ansible.builtin.set_fact:
        import_cluster_repo: >-
          {{ _files | community.cassandra.cassandra_repository_import(
               _stats, import_cluster_series, ansible_facts['os_family'],
               lookup('ansible.builtin.file', playbook_dir ~ '/../roles/cassandra_repository/files/KEYS', rstrip=false) | hash('sha1'),
               import_cluster_packages, import_cluster_package_from_file | bool,
               (lookup('ansible.builtin.file', playbook_dir ~ '/../roles/cassandra_repository/defaults/main.yml') | from_yaml).debian_packages) }}
      vars:
        _read: "{{ import_cluster_repo_slurp.results | default([]) | selectattr('content', 'defined') | list }}"
        _files: "{{ dict(_read | map(attribute='item') | zip(_read | map(attribute='content') | map('b64decode'))) }}"
        _stats: >-
          {{ dict(import_cluster_repo_stat.results | default([]) | selectattr('stat.exists', 'defined') | selectattr('stat.exists')
                  | map(attribute='item')
                  | zip(import_cluster_repo_stat.results | default([]) | selectattr('stat.exists', 'defined') | selectattr('stat.exists')
                        | map(attribute='stat'))) }}
      no_log: "{{ not import_debug | default(false) | bool }}"
      when:
        - import_cluster_series is defined
        - import_cluster_repo_files | default([]) | length > 0

    # its Java removed since it started (a JDK update took its directory): what it runs is unknown
    - name: Note a running Java that cannot be read
      ansible.builtin.set_fact:
        import_cluster_error: >-
          its Java ({{ import_cluster_java_bin or '?' }}) cannot be run any more (removed since Cassandra started,
          e.g. by a JDK update): restart Cassandra (rolling_restart), then import again
      when:
        - import_cluster_series is defined
        - import_cluster_java | default('') == ''

    # its new build read, but the unit points JAVA_HOME at the Java gone: Cassandra would not start again
    - name: Note a JAVA_HOME of a Java gone
      ansible.builtin.set_fact:
        import_cluster_error: >-
          its unit sets JAVA_HOME={{ import_cluster_java_home_gone }}, the Java removed by an update since Cassandra
          started: the next start would fail. Point JAVA_HOME at its new build
          ({{ import_cluster_java_bin | regex_replace('/bin/java$', '') | regex_replace('/jre$', '') }}) in the unit
          (systemctl edit cassandra), restart Cassandra, then import again
      when:
        - import_cluster_series is defined
        - import_cluster_error is not defined
        - import_cluster_java_home_gone | default('') != ''

    # no_log hides the error too: the rescue says what failed, without the values
    # the series says it was read
    - name: Read this node's config
      when: import_cluster_series is defined and import_cluster_series in ['40x', '41x', '50x'] and import_cluster_error is not defined
      block:
        # without it the role defaults would be imported (cluster name, seeds...)
        - name: Check cassandra.yaml was read
          ansible.builtin.assert:
            that: _yaml.content is defined
            fail_msg: "{{ _yaml.msg | default('cannot read ' ~ import_cluster_conf_dir ~ '/cassandra.yaml') }}"
            quiet: true
          vars:
            _yaml: "{{ import_cluster_slurp.results | selectattr('item', 'equalto', 'cassandra.yaml') | first | default({}) }}"

        - name: Turn them into cassandra_config variables
          no_log: "{{ not import_debug | default(false) | bool }}"
          ansible.builtin.set_fact:
            import_cluster_config: >-
              {{ _live | community.cassandra.cassandra_config_import(import_cluster_series, ansible_facts,
                                                                     import_cluster_conf_target | default(''),
                                                                     import_cluster_storage_dir | default(''),
                                                                     import_cluster_jmx_files | default({}),
                                                                     _release, '', '', _jvm) }}
          vars:
            # the cassandra.yaml keys are judged by the release the next start runs: the package installed
            # since Cassandra started (a restart pending), else the running one
            _package: >-
              {{ import_cluster_package | default('') | regex_replace('^([0-9]+[.][0-9]+[.][0-9]+).*$', '\1') }}
            _release: >-
              {{ _package if _package is match('[0-9]+[.][0-9]+[.][0-9]+$')
                            and _package.split('.')[:2] == (import_cluster_version | default('') | string).split('.')[:2]
                            and _package is version(import_cluster_version, '>')
                 else import_cluster_version | default('') }}
            # the running JVM: cassandra-env.sh's hand edits move to variables when it gets the same arguments
            _jvm:
              cmdline: "{{ import_cluster_jvm_cmdline.content | default('') | b64decode }}"
              java: "{{ import_cluster_java | default('') }}"
              # (and the variables the JVM got for cassandra-env.sh to add: the next apply_config's proof reads them)
              environment: "{{ dict(import_cluster_unit.env | default({}), **(import_cluster_unit.jvm_env | default({}))) }}"
              heapdump_before: "{{ import_cluster_unit.heapdump_before | default('') }}"
              newer: "{{ import_cluster_newer_files | default([]) }}"
              keep: "{{ import_keep_hand_edits | default(false) }}"  # those files not moved
              # the Prometheus exporter's jar and config, read on the node
              exporter:
                sha256: "{{ import_cluster_exporter_read.sha256 | default('') }}"
                config: "{{ import_cluster_exporter_read.config | default('') | b64decode if import_cluster_exporter_read.config | default('') else none }}"
                jar: "{{ import_cluster_exporter_read.jar | default('') }}"
                config_file: "{{ import_cluster_exporter_read.config_file | default('') }}"
                carry: "{{ import_carry_exporter_config | default(false) | bool }}"
            _slurped: "{{ import_cluster_slurp.results + import_cluster_jmx_slurp.results | default([]) }}"
            _live: >-
              {{ dict(_slurped | selectattr('content', 'defined') | map(attribute='item')
                      | zip(_slurped | selectattr('content', 'defined') | map(attribute='content') | map('b64decode'))) }}
      rescue:
        # for the report: the node is listed as not read, with this reason
        - name: Keep why for the report
          ansible.builtin.set_fact:
            import_cluster_error: >-
              "{{ ansible_failed_task.name | default('?') }}" failed{{ (': ' ~ _why) if _why else '' }}
          vars:
            _why: >-
              {{ ansible_failed_result.msg | default('?') if ansible_failed_task.name | default('') == 'Check cassandra.yaml was read'
                 else ansible_failed_result | default({}) | community.cassandra.cassandra_import_error }}

        - name: Say what failed on this node
          ansible.builtin.fail:
            msg: >-
              {{ import_cluster_error }}{{ '' if ansible_failed_task.name | default('') == 'Check cassandra.yaml was read'
              else '. Its error is above.' if import_debug | default(false) | bool
              else '. The rest of the error is hidden (the config holds passwords):'
                   ~ ' rerun with -e import_debug=true to see it (it may show passwords).' }}
          vars:
            cassandra_output: true

    # owner, group and mode of what cassandra_config writes or creates, read only
    - name: Read the owner and mode of the config files and directories
      ansible.builtin.command:
        argv: "{{ [ansible_facts.python.executable, '-c', _read_files] }}"
        stdin: "{{ [['perms', 'stat', _paths | zip(_paths) | list]] | to_json }}"
      register: import_cluster_perm_read
      changed_when: false
      failed_when: false  # (each file's own error is in its result)
      check_mode: false  # read only
      when: import_cluster_config is defined
      vars:
        _paths: >-
          {{ _files | map('regex_replace', '^', import_cluster_conf_dir ~ '/') | list
             + [_jmx.password | default('', true) or '/etc/cassandra/jmxremote.password',
                _jmx.access | default('', true) or '/etc/cassandra/jmxremote.access'] + _dirs }}
        _cfg: "{{ import_cluster_config.vars | default({}) }}"
        _jmx: "{{ import_cluster_jmx_files | default({}) }}"
        _dirs: >-
          {{ ([_cfg.cassandra_data_file_directories | default([_cfg.cassandra_data_dir | default('/var/lib/cassandra/data')])]
              | flatten) + [_cfg.cassandra_commitlog_dir | default('/var/lib/cassandra/commitlog'),
                _cfg.cassandra_hints_dir | default('/var/lib/cassandra/hints'),
                _cfg.cassandra_saved_caches_dir | default('/var/lib/cassandra/saved_caches'),
                import_cluster_log_dir | default('', true) or _cfg.cassandra_log_dir | default('/var/log/cassandra')]
             + _cdc_raw }}
        # the cdc_raw dir, as cassandra_config creates it: when set, or with CDC on (under the storage dir)
        _cdc_raw: >-
          {{ [_cfg.cassandra_cdc_raw_dir | default('', true)
              or (_cfg.cassandra_config_storage_dir | default('', true) or '/var/lib/cassandra')
                 | regex_replace('(?<=.)/+$', '') ~ '/cdc_raw']
             if _cfg.cassandra_cdc_raw_dir | default('', true) or _cfg.cassandra_cdc_enabled | default(false) | bool
             else [] }}

    - name: Turn them into variables
      ansible.builtin.set_fact:
        import_cluster_perms: >-
          {{ _file_stats | community.cassandra.cassandra_permissions_import(import_cluster_account, import_cluster_series,
                                                                            _dir_stats, 'cassandra_jmx_users' in import_cluster_config.vars) }}
      vars:
        # the files by their name, then the dirs by their path (as read above; a stat that failed, e.g. a data dir
        # on NFS root can't read: none, left out)
        _results: "{{ (import_cluster_perm_read.stdout | from_json).perms if import_cluster_perm_read.rc | default(1) == 0 else [] }}"
        _names: "{{ _files + ['jmxremote.password', 'jmxremote.access'] }}"
        _paths: "{{ _results | map(attribute='item') | list }}"
        _stats: "{{ _results | map(attribute='stat', default={}) | list }}"
        _file_stats: "{{ dict(_names | zip(_stats[:_names | length])) }}"
        _dir_stats: "{{ dict(_paths[_names | length:] | zip(_stats[_names | length:])) }}"
      when: import_cluster_config is defined

    # Cassandra Medusa (backups): its install and /etc/medusa/medusa.ini
    - name: Say what is read next on the nodes
      ansible.builtin.debug:
        msg: "Looking for Medusa, reading the OS tuning on {{ ansible_play_hosts | length }} node{{ 's' if ansible_play_hosts | length > 1 else '' }}..."
      run_once: true
      vars:
        cassandra_output: true

    # Medusa is looked for at import_medusa_path (default none: its
    # virtualenv or its medusa script, a full path on the nodes), else in the PATH,
    # else in the usual places, else in the PATH of a login shell of cassandra, then
    # of root, and last in any virtualenv under /opt.
    - name: Look for Medusa
      ansible.builtin.shell: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/templates/import_medusa.sh.j2') }}"
      environment:
        IMPORT_MEDUSA_PATH: "{{ import_medusa_path | default('') }}"
      register: import_cluster_medusa_found
      changed_when: false
      failed_when: false
      check_mode: false
      when: import_cluster_config is defined

    # no_log: medusa.ini and the S3 credentials file hold secrets
    - name: Read the Medusa config
      when: _found.ini | default('') == 'yes'
      vars:
        _found: "{{ dict(import_cluster_medusa_found.stdout_lines | default([]) | map('split', '=', 1)) }}"
      block:
        - name: Read medusa.ini
          ansible.builtin.slurp:
            path: /etc/medusa/medusa.ini
          register: import_cluster_medusa_ini
          no_log: true

        - name: Read its S3 credentials file
          ansible.builtin.slurp:
            path: "{{ _key_file }}"
          register: import_cluster_medusa_key_file
          failed_when: false
          no_log: true
          when: _key_file != ''
          vars:
            _key_file: >-
              {{ (import_cluster_medusa_ini.content | b64decode | community.cassandra.cassandra_medusa_ini).storage.key_file
                 | default('') }}

        - name: Read its owner and mode
          ansible.builtin.stat:
            path: "{{ import_cluster_medusa_key_file.source }}"
          register: import_cluster_medusa_key_stat
          when: import_cluster_medusa_key_file.content is defined

        - name: Turn them into cassandra_medusa variables
          ansible.builtin.set_fact:
            import_cluster_medusa: >-
              {{ import_cluster_medusa_ini.content | b64decode | community.cassandra.cassandra_medusa_import(
                   import_cluster_medusa_key_file.content | default('') | b64decode,
                   _found | combine({'key_owner': _key.pw_name | default(''), 'key_group': _key.gr_name | default(''),
                                     'key_mode': _key.mode | default(''),
                                     'account_user': import_cluster_account.user | default(''),
                                     'account_group': import_cluster_account.group | default('')})) }}
          vars:
            _key: "{{ import_cluster_medusa_key_stat.stat | default({}) }}"
          no_log: "{{ not import_debug | default(false) | bool }}"
      rescue:
        - name: Keep why for the report
          ansible.builtin.set_fact:
            import_cluster_medusa:
              vars: {}
              notes:
                - >-
                  Medusa: medusa.ini NOT imported, "{{ ansible_failed_task.name | default('?') }}" failed
                  {{- (': ' ~ _why) if _why else '' }}
          vars:
            _why: "{{ ansible_failed_result | default({}) | community.cassandra.cassandra_import_error }}"

    - name: Note a Medusa without medusa.ini, or an import_medusa_path without Medusa
      ansible.builtin.set_fact:
        import_cluster_medusa:
          vars: {}
          notes: >-
            {{ (['Medusa ' ~ (_found.version | default('') or '?') ~ ' in ' ~ _found.bin
                 ~ ', but no /etc/medusa/medusa.ini: NOT imported'] if _found.bin is defined else [])
               + (['Medusa: no medusa in ' ~ _found.hint_missing ~ ' (import_medusa_path) on this node']
                  if _found.hint_missing is defined else []) }}
      vars:
        _found: "{{ dict(import_cluster_medusa_found.stdout_lines | default([]) | map('split', '=', 1)) }}"
      when:
        - _found.bin is defined or _found.hint_missing is defined
        - _found.ini | default('') != 'yes'

    # The OS tuning already on the nodes (set by hand, by another tool, by
    # a golden image), compared with what cassandra_linux would set: the files
    # as they are, and the live values. Read only.
    # the roles' own defaults, as for the config import: not the values an
    # inventory may already set (a value equal to them would not be carried)
    - name: Load the cassandra_linux and cassandra_service defaults (what they would set)
      ansible.builtin.set_fact:
        import_cluster_os_defaults: >-
          {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../roles/cassandra_linux/defaults/main.yml') | from_yaml
              | combine(lookup('ansible.builtin.file', playbook_dir ~ '/../roles/cassandra_service/defaults/main.yml') | from_yaml))
             | dict2items
             | selectattr('key', 'match', '^cassandra_(linux_(sysctl|sysctl_file|limits|timesync|thp_enabled|thp_defrag)'
                                          ~ '|data_(readahead_kb|scheduler|lvm_readahead)|service_limit_.*)$')
             | items2dict }}
      when: import_cluster_config is defined

    # The OS tuning found on the nodes (sysctl, limits, THP, disks, tuned, swap,
    # time sync, firewall) is listed in the report, and what a variable covers is
    # carried into the inventory for the nodes added later.
    - name: Read the OS tuning
      ansible.builtin.shell: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/templates/import_os_tuning.sh.j2') }}"
      vars:
        _cfg: "{{ import_cluster_config.vars }}"
        _dirs: >-
          {{ ([_cfg.cassandra_data_file_directories | default([_cfg.cassandra_data_dir | default('/var/lib/cassandra/data')])]
              | flatten) + [_commitlog] }}
        _commitlog: "{{ _cfg.cassandra_commitlog_dir | default('/var/lib/cassandra/commitlog') }}"
        # (not a data directory too)
        _commitlog_only: "{{ '' if _commitlog in _dirs[:-1] else _commitlog }}"
        # Cassandra's too: a disk under them is not shared (not tuned themselves)
        _others: >-
          {{ [_cfg.cassandra_hints_dir | default('/var/lib/cassandra/hints'),
              _cfg.cassandra_saved_caches_dir | default('/var/lib/cassandra/saved_caches')] }}
        _ports: >-
          {{ ([_cfg.cassandra_storage_port | default(7000), _cfg.cassandra_native_transport_port | default(9042),
               _cfg.cassandra_jmx_port | default(cassandra_jmx_port | default(7199))]
              + ([_cfg.cassandra_prometheus_exporter_port | default(9404)]
                 if _cfg.cassandra_prometheus_exporter_enabled | default(false) | bool else []))
             | map('string') | select('match', '^[0-9]+$') | list }}
      register: import_cluster_os_found
      changed_when: false
      failed_when: false
      check_mode: false
      when: import_cluster_config is defined

    - name: Compare it with what the roles would set
      ansible.builtin.set_fact:
        import_cluster_os: >-
          {{ import_cluster_os_found.stdout | community.cassandra.cassandra_os_import(_wanted)
             if import_cluster_os_found.rc | default(1) == 0
             else {'lines': ['OS tuning NOT read: ' ~ (import_cluster_os_found.stderr | default('') or import_cluster_os_found.msg
                                                     | default('?')).splitlines() | first | default('?')],
                   'vars': {}, 'carried': []} }}
      vars:
        _cfg: "{{ import_cluster_config.vars }}"
        _d: "{{ import_cluster_os_defaults }}"
        _wanted:
          sysctl: "{{ _d.cassandra_linux_sysctl }}"
          sysctl_file: "{{ _d.cassandra_linux_sysctl_file }}"
          limits: "{{ _d.cassandra_linux_limits }}"
          readahead_kb: "{{ _d.cassandra_data_readahead_kb }}"
          scheduler: "{{ _d.cassandra_data_scheduler }}"
          lvm_readahead: "{{ _d.cassandra_data_lvm_readahead }}"
          thp_enabled: "{{ _d.cassandra_linux_thp_enabled }}"
          thp_defrag: "{{ _d.cassandra_linux_thp_defrag }}"
          timesync: "{{ _d.cassandra_linux_timesync }}"
          os_family: "{{ ansible_facts['os_family'] }}"
          service_limits:
            nofile: "{{ _d.cassandra_service_limit_nofile }}"
            nproc: "{{ _d.cassandra_service_limit_nproc }}"
            memlock: "{{ _d.cassandra_service_limit_memlock }}"
            as: "{{ _d.cassandra_service_limit_as }}"
          ports:
            - "{{ _cfg.cassandra_storage_port | default(7000) }}/tcp"
            - "{{ _cfg.cassandra_native_transport_port | default(9042) }}/tcp"
            - "{{ _cfg.cassandra_jmx_port | default(cassandra_jmx_port | default(7199)) }}/tcp"
          # the Prometheus exporter's, where it runs: its sources carried (cassandra_prometheus_exporter_sources)
          exporter_port: >-
            {{ _cfg.cassandra_prometheus_exporter_port | default(9404)
               if _cfg.cassandra_prometheus_exporter_enabled | default(false) | bool else '' }}
          # the node has cassandra_linux's own files, or cassandra_service's unit: it keeps their values
          own: "{{ import_cluster_own_os | default(false) }}"
          own_unit: "{{ import_cluster_own_unit | default(false) }}"
      when: import_cluster_os_found is not skipped

- name: Write the inventory
  hosts: localhost
  connection: local
  gather_facts: false
  become: false  # the files are the user's, written without root (none on the controller)
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
    # reads files in one go (see the script)
    _read_files: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/import_read_files.py') }}"
    # set on the given nodes only (not on the ones add_host found)
    _given: "{{ import_cluster_given }}"
    _ring: "{{ import_cluster_ring_nodes }}"
    _java_default: {40x: "11", 41x: "11", 50x: "17"}
    # the JMX login given for the import, which every later run needs too
    # (-e, or the given nodes' own inventory: read on the first of them)
    _jmx: >-
      {%- set h = hostvars[_given | first] -%}
      {%- set out = {} -%}
      {%- for k in ['cassandra_jmx_username', 'cassandra_jmx_password_file', 'cassandra_jmx_password'] -%}
      {%-   if h[k] | default('') -%}{%- set _ = out.update({k: h[k]}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
    # import_vault_password_file, else Ansible's (ansible.cfg vault_password_file, ANSIBLE_VAULT_PASSWORD_FILE)
    # (made absolute here: the modules would take a relative path from their own working directory)
    # (its dir only: a <name>-client symlink keeps its name, as for Ansible)
    _vault_file: "{{ ((_vault_given | dirname | default('.', true) | realpath) ~ '/' ~ _vault_given | basename) if _vault_given else '' }}"
    _vault_given: >-
      {{ (import_vault_password_file | default('', true)
          or lookup('ansible.builtin.config', 'DEFAULT_VAULT_PASSWORD_FILE') | default('', true)) | string | expanduser }}
    _vault: "{{ _vault_file != '' }}"
    _hosts_file: "{{ _layout.cluster_group ~ '.yml' }}"
    # CQL authentication on a node read: the operations that read the replication need a CQL login
    _cql_on: >-
      {{ _nodes | default([]) | selectattr('read') | map(attribute='vars') | map(attribute='cassandra_authenticator', default='')
         | map('string') | select('search', 'PasswordAuthenticator|PasswordFallback') | list | length > 0 }}
    # the CQL login the inventory (or -e) sets; the one an earlier import of this cluster wrote in its own files
    _cql_set:
      user: "{{ hostvars[_given | first].cassandra_cql_username | default('', true) }}"
      password: "{{ hostvars[_given | first].cassandra_cql_password | default('', true) }}"
    _cql_own: >-
      {%- set v = dict(import_cluster_existing_vars.results | default([]) | selectattr('content', 'defined')
                       | map(attribute='item')
                       | zip(import_cluster_existing_vars.results | default([]) | selectattr('content', 'defined')
                             | map(attribute='content') | map('b64decode')))
                  | community.cassandra.cassandra_inventory_own_values(_layout.cluster_group,
                      ['cassandra_cql_username', 'cassandra_cql_password'], _vault_secret | default('')) -%}
      {{ {'user': v.cassandra_cql_username | default('') | string, 'password': v.cassandra_cql_password | default('') | string} }}
    # cqlsh does not start on some nodes (seen at the read): a TO DO step, the two ways out
    _cqlsh_todo: >-
      {{ _nodes | default([]) | community.cassandra.cassandra_import_cqlsh_todo(hostvars, import_keep_hand_edits | default(false)) }}
    # what is left to do about it (TO DO)
    _cql_todo: >-
      {{ cassandra_cql_login | default({}) | community.cassandra.cassandra_import_cql_todo(
           _cql_on | bool, _cql_own, _layout.cluster_group, _cql_from, ansible_check_mode,
           cassandra_operation_confirm | default(true)) }}
    _cql_from: "{{ (_nodes | default([]) | selectattr('read') | first | default({})).name | default('') }}"
    # the self-check passed, or import_strict false takes its failure: the run writes the inventory and ends without
    # a stop of its own (the CQL login is asked then only)
    _import_completes: "{{ _self_check_ok | bool or not import_strict | default(true) | bool }}"
    # the user's own variables files there (group_vars/all...), and the inventory laid out over them (the tasks)
    _theirs: >-
      {{ dict(import_cluster_existing_vars.results | default([]) | selectattr('content', 'defined') | map(attribute='item')
              | zip(import_cluster_existing_vars.results | default([]) | selectattr('content', 'defined')
                    | map(attribute='content') | map('b64decode')))
         | community.cassandra.cassandra_inventory_user_files(_layout, _vault_secret | default('')) }}
    _layout_over: >-
      {{ _nodes | community.cassandra.cassandra_inventory_layout_over(_layout.cluster_name, _theirs, _dir,
                                                                     _layout.cluster_group) }}
    # what the playbooks are run with on this inventory: no -i when it is ansible.cfg's, no -e cassandra_hosts
    # when it holds this cluster alone (no other inventory file at its top)
    _next_inventory: "{{ '' if lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST') | map('realpath') | list == [_dir] else _dir }}"
    # -i <node>, while ansible.cfg (or ANSIBLE_INVENTORY) names an inventory on disk: that one was not read, its
    # variables (e.g. cassandra_cqlsh_command in its group_vars) did not apply to this run (/etc/ansible/hosts, the
    # stock default: not named)
    _inventory_unread: >-
      {{ lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST') | select('exists') | map('realpath')
         | reject('equalto', '/etc/ansible/hosts')
         | reject('in', ansible_inventory_sources | select('exists') | map('realpath') | list) | list
         if ansible_inventory_sources | reject('exists') | list | length > 0 else [] }}
    _look: >-
      {{ [] if not _inventory_unread else
         [['the inventory of ansible.cfg (' ~ _inventory_unread | join(', ') ~ ') was not read: this run had -i '
           ~ ansible_inventory_sources | reject('exists') | join(' '),
           'its variables did not apply to this run (e.g. cassandra_cqlsh_command in its group_vars); to import with'
           ~ ' them: run without -i, with -e cassandra_hosts=' ~ _layout.cluster_group]] }}
    _next_hosts: >-
      {{ _layout.cluster_group if import_cluster_existing.files | default([]) | map(attribute='path') | map('relpath', _dir)
                                  | reject('match', '(group_vars|host_vars)/') | reject('match', '(.*/)?[.]')
                                  | reject('search', '([.](pyc|pyo|swp|bak|rpm|md|txt|rst|orig|cfg|retry)|~)$')
                                  | reject('equalto', _hosts_file) | list else '' }}
    _files: "{{ _layout | community.cassandra.cassandra_inventory_files }}"
    _secrets: "{{ _files | selectattr('secret') | map(attribute='path') | list }}"
    # not one node read: nothing checked, nothing valid; a ring node not read (down, unreachable, nodetool not
    # found, its running Java removed by an update): not checked, its settings unknown, the roles would give it
    # the group variables (and start it): it fails the import, unless import_allow_unread=true
    # (default false) accepts it
    _self_check_ok: >-
      {{ _self_check_error is not defined and _self_check | default({}) | length > 0
         and _self_check | dict2items | map(attribute='value.differences') | select | list | length == 0
         and (_unchecked | length == 0 or import_allow_unread | default(false) | bool) }}
    _unchecked: >-
      {%- set out = [] -%}
      {%- for n in _nodes | default([]) if not n.read | bool -%}{%- set _ = out.append(_layout.names[n.address]) -%}{%- endfor -%}
      {{ out }}
    # report.txt: by urgency, TO DO, WORTH A LOOK... what to do next (cassandra_import_report);
    # report.check.txt under --check (the real one left as it is)
    _report_args:
      written: ["{{ _dir ~ '/' ~ _hosts_file }}", "{{ _dir }}"]
      report_file: "{{ _report_dir ~ ('/report.check.txt' if ansible_check_mode else '/report.txt') }}"
      secrets_clear: "{{ [] if _vault | bool else _secrets }}"
      check: "{{ ansible_check_mode }}"
      inventory: "{{ _next_inventory }}"
      hosts: "{{ _next_hosts }}"
      cwd: "{{ lookup('ansible.builtin.env', 'PWD') }}"
      allow_unread: "{{ import_allow_unread | default(false) | bool }}"
      todo: "{{ _cql_todo + _cqlsh_todo }}"
      look: "{{ _look }}"
      run_time: "{{ _import_run_time | default('') }}"  # (the head of each report: rewritten at each run)
    _report: >-
      {{ _layout | community.cassandra.cassandra_import_report(_report_args.written, _report_args.report_file,
           _self_check | default({}), _self_check_ok | bool, secrets_clear=_report_args.secrets_clear,
           leftovers=_leftovers | default({}), check=_report_args.check | bool,
           inventory=_report_args.inventory, hosts=_report_args.hosts, cwd=_report_args.cwd,
           allow_unread=_report_args.allow_unread | bool,
           self_check_error=_self_check_error | default(''), changes=_changes, todo=_report_args.todo,
           look=_report_args.look, run_time=_report_args.run_time | default(''), build=true,
           convergence=_convergence) | join(_newline) }}
    # report.details.txt: what report.txt leaves out (the settings, versions, convergence, OS, each node's lines)
    _report_details: >-
      {{ _layout | community.cassandra.cassandra_import_report(_report_args.written, _report_args.report_file,
           _self_check | default({}), _self_check_ok | bool, secrets_clear=_report_args.secrets_clear,
           leftovers=_leftovers | default({}), check=_report_args.check | bool,
           inventory=_report_args.inventory, hosts=_report_args.hosts, cwd=_report_args.cwd,
           allow_unread=_report_args.allow_unread | bool,
           self_check_error=_self_check_error | default(''), changes=_changes, todo=_report_args.todo,
           look=_report_args.look, run_time=_report_args.run_time | default(''), build=true,
           convergence=_convergence, details=true) | join(_newline) }}
    # CONVERGENCE (report.txt, FOR INFO): how far the cluster is from one group, every setting in group_vars (what to
    # change, and how); output only: the inventory is written as it is
    _convergence: >-
      {{ _layout | community.cassandra.cassandra_import_convergence(_self_check | default({}),
           inventory=_report_args.inventory, hosts=_report_args.hosts, cwd=_report_args.cwd,
           self_check_ok=_self_check_ok | bool) }}
    # the files the run wrote or removed (would, under --check) and the ones there before: a re-import that
    # changes nothing says so
    _changes:
      changed: >-
        {{ ([_hosts_file] if import_cluster_wrote_hosts is changed else [])
           + import_cluster_wrote_vars.results | default([]) | selectattr('changed', 'defined') | selectattr('changed')
             | map(attribute='item.path') | list }}
      removed: >-
        {{ import_cluster_removed.results | default([]) | selectattr('changed', 'defined') | selectattr('changed')
           | map(attribute='item') | list }}
      existed: "{{ import_cluster_existing.files | default([]) | map(attribute='path') | map('relpath', _dir) | list }}"
    # (a newline: in a folded block, '\n' would stay a backslash and an n)
    _newline: "\n"
  tasks:
    # the time on the head of the reports and the screen: once, the same everywhere
    - name: Note the time of the run
      ansible.builtin.set_fact:
        _import_run_time: "{{ now().timestamp() }}"

    # the first play had no host: a group that matches nothing (or only hosts marked absent), a --limit
    - name: Stop when no node was given
      ansible.builtin.assert:
        that: import_cluster_given is defined
        fail_msg: >-
          No node given: -i <node>, or, with the inventory, -e cassandra_hosts=<a group with nodes not marked
          absent> (--limit is refused). Nothing was written.
        quiet: true
      run_once: true  # (no host before its message)
      vars:
        cassandra_output: true

    - name: Say the inventory is laid out
      ansible.builtin.debug:
        msg: "Laying out the inventory..."
      vars:
        cassandra_output: true

    # no_log: the variables hold the passwords read from the config; import_debug: true (default
    # false) shows an error while writing the inventory, hidden otherwise.
    # Each node is named by import_host_names, with ansible_host set to its address in the ring; a node
    # without facts keeps the name it was given, or its address. The lines at the end of cassandra-env.sh and
    # logback.xml are carried in snippets next to the inventory (cassandra_config_template_snippets; a secret in them
    # to secrets.yml as a cassandra_secret_<file>_<name> variable); cassandra-env.sh's JVM_OPTS lines and heap move
    # to variables when the running JVM gets the same arguments (MOVED in the report). Other hand edits no
    # variable covers fail the self-check: import_keep_hand_edits=true (default false) leaves those files as
    # they are on their node (cassandra_config_keep_files) instead, or the files named (=logback.xml).
    - name: Build the inventory
      block:
        # in Python: in a template, hostvars[host] works out the host's variables anew at each use (per node and
        # per setting, the import of a large cluster took hours)
        - name: Match the ring with the hosts
          no_log: "{{ not import_debug | default(false) | bool }}"
          ansible.builtin.set_fact:
            _nodes: >-
              {{ _ring | community.cassandra.cassandra_import_nodes(
                   hostvars | community.cassandra.cassandra_import_host_vars(_given + _found + _ring | map(attribute='address') | list),
                   _given, _found, _jmx, _java_default, import_host_names | default('hostname'),
                   import_set_ansible_host | default(true), import_keep_hand_edits | default(false)) }}
          vars:
            _found: "{{ groups['import_cluster_found'] | default([]) }}"

        - name: Lay out groups and variables
          no_log: "{{ not import_debug | default(false) | bool }}"
          ansible.builtin.set_fact:
            _layout: "{{ _nodes | community.cassandra.cassandra_inventory_layout(_cluster_name, _group) }}"
          vars:
            _cluster_name: >-
              {{ _nodes | selectattr('read') | map(attribute='vars.cassandra_cluster_name') | first | default('cassandra') }}
            # import_group, else the group an earlier import wrote for the given nodes (<import_dir>/<group>.yml its
            # hosts file), else (empty) the cluster name's
            _group: "{{ import_group | default('', true) or _known }}"
            _known: >-
              {%- set texts = {} -%}
              {%- for g in _given | map('extract', hostvars, 'group_names') | flatten | unique
                   if g not in ['all', 'ungrouped'] -%}
              {%-   set _ = texts.update({g: lookup('ansible.builtin.file', _known_dir ~ '/' ~ g ~ '.yml', errors='ignore')
                                             | default('', true)}) -%}
              {%- endfor -%}
              {{ _given | map('extract', hostvars, 'group_names') | flatten | unique
                 | community.cassandra.cassandra_import_known_group(texts) }}
            _known_dir: "{{ import_dir | default('inventories', true) | expanduser }}"
      rescue:
        - name: Say how to see the error
          ansible.builtin.fail:
            msg: >-
              "{{ ansible_failed_task.name | default('?') }}" failed{{ (' (' ~ _why ~ ')') if _why else '' }}{{ ': its error is above.'
              if import_debug | default(false) | bool else ', the rest of its error is hidden (the variables hold passwords).'
              ~ ' Rerun with -e import_debug=true to see it (it may show passwords).' }}
          run_once: true  # (no host before its message)
          vars:
            cassandra_output: true
            # the ring nodes it failed on, and what of the error shows no value
            _why: "{{ ansible_failed_result | default({}) | community.cassandra.cassandra_import_error }}"

    # import_dir: the inventory dir (default inventories; a relative path is from the current dir);
    # import_report_dir: where report.txt goes (default reports/<cluster group> next to
    # import_dir: ./reports/<cluster group> for the default).
    # One inventory dir for every cluster (ansible.cfg inventory = that dir, the playbooks run with
    # -e cassandra_hosts=<cluster group>): the hosts go to <cluster group>.yml there, the variables to
    # group_vars/ and host_vars/, side by side with the other clusters'; a host or group name another cluster
    # has already stops the import (Stop rather than write over another cluster's files).
    # made absolute here, on the controller: the modules would take a relative
    # path from their own working directory, not the one the playbook was run from
    - name: Pick the output dirs
      ansible.builtin.set_fact:
        _dir: "{{ _abs_dir }}"
        _report_dir: "{{ _given_report_dir if _given_report_dir is abs else _given_report_dir | realpath }}"
      vars:
        _given_dir: "{{ import_dir | default('inventories', true) | expanduser }}"
        _abs_dir: "{{ (_given_dir if _given_dir is abs else _given_dir | realpath) | regex_replace('(?<=.)(/+[.]?)+$', '') }}"
        # reports/<cluster group> next to the inventory dir as given (through a symlink too; /x/inv/. as /x/inv)
        _given_report_dir: >-
          {{ import_report_dir | default([_given_dir | regex_replace('(?<=.)(/+[.]?)+$', '') | dirname, 'reports',
                                                  _layout.cluster_group] | path_join, true) | expanduser }}

    - name: Check the output dir
      ansible.builtin.stat:
        path: "{{ _dir }}"
      register: import_cluster_dir_stat

    - name: Check the hosts file
      ansible.builtin.stat:
        path: "{{ _dir }}/{{ _hosts_file }}"
      register: import_cluster_hosts_stat

    # import_force: false; true imports a cluster whose <cluster group>.yml
    # is there already (a re-import).
    - name: Stop rather than overwrite an inventory
      ansible.builtin.assert:
        that: import_force | default(false) | bool or not import_cluster_hosts_stat.stat.exists
        fail_msg: >-
          {{ _dir ~ '/' ~ _hosts_file }} exists: this cluster is imported there already, set import_force=true
          to import it again (with --check --diff first to see the changes); another cluster of the same name:
          -e import_group=<another name>
      run_once: true  # (no host before its message)
      vars:
        cassandra_output: true

    # two clusters of one name (Test Cluster, the default) get one group: import_force never writes over the other
    # one's files (none of its hosts a node of this ring)
    - name: Stop rather than overwrite another cluster's inventory
      ansible.builtin.assert:
        that: _other | length == 0
        fail_msg: >-
          {{ _dir ~ '/' ~ _hosts_file }} is another cluster's: none of its hosts ({{ _other | join(', ') }}) is a node
          of this one, though both are named {{ _layout.cluster_name }}. Import this one under a group of its own:
          -e import_group=<another name> (then -e cassandra_hosts=<that name> for the playbooks). Nothing was written.
        quiet: true
      run_once: true
      when: import_cluster_hosts_stat.stat.exists
      vars:
        cassandra_output: true
        _other: >-
          {{ lookup('ansible.builtin.file', _dir ~ '/' ~ _hosts_file, errors='ignore') | default('', true)
             | community.cassandra.cassandra_import_other_cluster(_layout) }}

    # The vault password: import_vault_password_file (default none), else Ansible's own
    # (vault_password_file in ansible.cfg, ANSIBLE_VAULT_PASSWORD_FILE; not --vault-password-file, which is
    # not used), with import_vault_id (default: default); a password file that is executable is run,
    # as Ansible does
    - name: Read the vault password
      when: _vault | bool
      block:
        - name: Check the vault password file
          ansible.builtin.stat:
            path: "{{ _vault_file }}"
          register: import_cluster_vault_stat

        - name: Stop on a missing vault password file
          ansible.builtin.assert:
            that: import_cluster_vault_stat.stat.exists
            fail_msg: "vault password file {{ _vault_file }} not found"
            quiet: true
          run_once: true  # (no host before its message)
          vars:
            cassandra_output: true

        # a <name>-client script is asked for the vault id, as Ansible does
        - name: Run the vault password script
          ansible.builtin.command:
            argv: >-
              {{ [_vault_file] + (['--vault-id', import_vault_id | default(lookup('ansible.builtin.config', 'DEFAULT_VAULT_IDENTITY'))]
                 if _vault_file | basename | splitext | first is match('.*-client$') else []) }}
          register: import_cluster_vault_script
          changed_when: false
          check_mode: false
          no_log: true
          when: import_cluster_vault_stat.stat.executable

        - name: Keep the vault password
          ansible.builtin.set_fact:
            _vault_secret: >-
              {{ import_cluster_vault_script.stdout if import_cluster_vault_stat.stat.executable
                 else lookup('ansible.builtin.file', _vault_file) | trim }}
          no_log: true

        - name: Stop on an empty vault password
          ansible.builtin.assert:
            that: _vault_secret | length > 0
            fail_msg: "empty vault password from {{ _vault_file }}"
            quiet: true
          run_once: true  # (no host before its message)
          vars:
            cassandra_output: true

    # a re-import keeps what it did not write (group_vars/all/*, ansible.cfg,
    # notes...): it replaces its own files, and removes the ones an earlier
    # import wrote that this one does not (a node gone from the ring)
    - name: Find the files already there
      ansible.builtin.find:
        paths: "{{ _dir }}"
        recurse: true
        depth: 3  # group_vars/<group>/main.yml
        file_type: file
      register: import_cluster_existing
      when: import_cluster_dir_stat.stat.exists

    # (one command: a slurp per file is a module run each)
    - name: Read the group_vars and host_vars files already there
      ansible.builtin.command:
        argv: "{{ [ansible_playbook_python, '-c', _read_files] }}"
        stdin: "{{ _wanted | to_json }}"
      register: import_cluster_existing_read
      changed_when: false
      failed_when: >-
        import_cluster_existing_read.rc != 0
        or (import_cluster_existing_read.stdout | from_json).vars | selectattr('failed', 'defined') | list | length > 0
      check_mode: false  # read only
      no_log: true  # a secrets.yml in clear
      when: _read | length > 0
      vars:
        _read: >-
          {{ _found | select('match', '^((group_vars|host_vars)/[^/]+(/[^/]+)?[.](yml|yaml|json)|(group_vars|host_vars)/[^/]+/[^/]+[.]j2|'
                                      ~ _top ~ ')$') | list }}
        _wanted: [[vars, content, "{{ _read | zip(_read | map('regex_replace', '^', _dir ~ '/')) | list }}"]]
        # every file Ansible reads as inventory (the hosts files: whose they are; the user's: their groups)
        _top: "(?!(group_vars|host_vars)/)(?!.*([.](pyc|pyo|swp|bak|rpm|md|txt|rst|orig|cfg|retry)|~)$).+"
        # (not a big file left there: a dump, an archive)
        _found: "{{ import_cluster_existing.files | default([]) | selectattr('size', 'le', 1048576) | map(attribute='path')
                    | map('relpath', _dir) | reject('match', '(.*/)?[.]') | list }}"

    # as slurp results; their text and the mode of each file there, to leave the ones that would not change alone
    - name: Keep the files already there
      ansible.builtin.set_fact:
        import_cluster_existing_vars: {results: "{{ _results }}"}
        import_cluster_existing_text: >-
          {{ dict(_results | map(attribute='item') | zip(_results | map(attribute='content') | map('b64decode'))) }}
        import_cluster_existing_modes: >-
          {{ dict(import_cluster_existing.files | default([]) | map(attribute='path') | map('relpath', _dir)
                  | zip(import_cluster_existing.files | default([]) | map(attribute='mode'))) }}
      no_log: true  # a secrets.yml in clear
      vars:
        _results: >-
          {{ (import_cluster_existing_read.stdout | from_json).vars if import_cluster_existing_read is not skipped else [] }}

    # A part is kept by hand only when this run names it (import_keep_hand_edits), as a file: one the last import
    # kept (cassandra_import_kept, or the *_manage: false of an import before rc10) is imported, the report says so
    - name: Say the parts the last import kept by hand that this one imports
      no_log: "{{ not import_debug | default(false) | bool }}"
      ansible.builtin.set_fact:
        _nodes: "{{ _nodes | community.cassandra.cassandra_import_kept_last_notes(_kept_last) }}"
      vars:
        _kept_last: >-
          {{ import_cluster_existing_text | default({}) | community.cassandra.cassandra_import_kept_last(
               import_keep_hand_edits | default(false)) }}

    # import_set_ansible_host: true; false leaves ansible_host out. Not given, a re-import keeps how the
    # inventory there reaches its hosts: one it reaches without ansible_host (imported with
    # import_set_ansible_host=false, or taken out by hand) gets none again (the earlier choice kept)
    - name: Leave ansible_host out where the inventory there has none
      no_log: "{{ not import_debug | default(false) | bool }}"
      ansible.builtin.set_fact:
        _nodes: >-
          {{ _nodes | community.cassandra.cassandra_import_kept_ansible_host(import_cluster_existing_text, _hosts_file,
                                                                           _layout.cluster_group, _layout.names,
                                                                           _vault_secret | default('')) }}
      when: import_set_ansible_host is not defined

    # the user's own variables files there (group_vars/all...) apply to these hosts too: a value of theirs that
    # would change a node is written as the node has it (listed in the report)
    - name: Lay out again over your own variables
      no_log: "{{ not import_debug | default(false) | bool }}"
      ansible.builtin.set_fact:
        _layout: "{{ _layout_over }}"
        _user_files: "{{ _theirs }}"

    # a file of yours at a path the import writes is replaced (kept as <file>.<date>~): its values are not
    # yours any more (laid out without it)
    - name: Keep your files the import does not write over
      no_log: "{{ not import_debug | default(false) | bool }}"
      ansible.builtin.set_fact:
        _user_files: "{{ _user_files | selectattr('path', 'in', _layout.user_paths) | list }}"

    # Each node read: what the roles would write with the inventory's variables
    # (read back from the files about to be written, over the roles' defaults,
    # with the node's facts), against the node's files, setting by setting
    - name: Say the self-check runs
      ansible.builtin.debug:
        msg: "Comparing with what the roles would write (self-check)..."
      vars:
        cassandra_output: true

    - name: Self-check
      block:
        - name: Render what the roles would write, and compare with the nodes' files
          no_log: "{{ not import_debug | default(false) | bool }}"
          ansible.builtin.set_fact:
            _self_check: >-
              {{ (_user_files | default([]) + _files) | community.cassandra.cassandra_import_self_check_nodes(
                   _layout.hosts, _nodes, _layout.names,
                   hostvars | community.cassandra.cassandra_import_host_vars(_nodes | selectattr('read') | map(attribute='host') | list),
                   inventory_dir=_dir) }}
      rescue:
        - name: Keep why for the report
          ansible.builtin.set_fact:
            _self_check_error: >-
              the self-check could not run ("{{ ansible_failed_task.name | default('?') }}" failed{{ (': ' ~ _why) if _why else '' }}):
              nothing says the variables reproduce the nodes
          vars:
            _why: "{{ ansible_failed_result | default({}) | community.cassandra.cassandra_import_error }}"

    # CQL authentication on (a PasswordAuthenticator): the operations that read the replication (decommission,
    # topology, rolling restarts...) log in with cassandra_cql_username and _password, which no node gives. Set
    # in the inventory or with -e (else written by an earlier import): checked with a real login, not asked;
    # else asked on the terminal, checked, then written with the cluster's variables (the password in
    # secrets.yml, vaulted with the vault password file). Asked once, when it is written: after the self-check,
    # when the run goes on to write the inventory (_import_completes), not under --check, nor with
    # cassandra_operation_confirm false. Nothing before needs it (the read runs cqlsh --version only).
    # Not one password shown: no_log.
    - name: Check the CQL login, or ask for one
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: cql_login.yml
      when: _cql_on | bool
      vars:
        # the node the operator gave (-i), read: the question names it, not another one; else the first
        _cql_node: >-
          {{ (_nodes | selectattr('read') | selectattr('host', 'in', _given | default([])) | list
              + _nodes | selectattr('read') | list) | first | default({}) }}
        _cql_vars: "{{ _cql_node.vars | default({}) }}"
        _cql_facts: "{{ hostvars[_cql_node.host].ansible_facts | default({}) }}"
        _cassandra_cql_login_from: "{{ _cql_node.host }}"
        # its CQL address and port, as the import read them: what Cassandra binds (rpc_interface, else rpc_address:
        # blank, the node's own name; localhost or 0.0.0.0, 127.0.0.1; the hostname or address fact the import wrote)
        _cassandra_cql_login_host: >-
          {{ _cql_vars | community.cassandra.cassandra_cql_host(facts=_cql_facts, address=_cql_node.address) }}
        _cassandra_cql_login_port: "{{ _cql_vars.cassandra_native_transport_port | default(9042) }}"
        # the inventory's (or -e), else the one an earlier import of this cluster wrote
        _cassandra_cql_login_given: "{{ _cql_set if _cql_set.user and _cql_set.password else _cql_own }}"
        _cassandra_cql_login_ask: >-
          {{ not ansible_check_mode and cassandra_operation_confirm | default(true) | bool and _import_completes | bool }}

    # From the CQL login on, the files sorted out, then written: a login typed, then a stop before it is written
    # (another cluster's files there, a vaulted file without its password, an error), says it is not saved and the
    # way to give it without typing it (no password shown)
    - name: Write the files
      block:
        # the login typed, else the one the import wrote before (kept, never lost); one of your files, or -e: not
        # written (yours stays where you keep it)
        - name: Write the CQL login with the cluster's variables
          ansible.builtin.set_fact:
            _nodes: >-
              {%- set out = [] -%}
              {%- for n in _nodes -%}
              {%-   set _ = out.append(n | combine({'vars': n.vars | combine(_login)}) if n.read | bool else n) -%}
              {%- endfor -%}
              {{ out }}
          no_log: true  # the password
          register: import_cluster_cql_login_set
          changed_when: _typed | bool  # (typed: said when a stop comes before it is written)
          when:
            - _cql_on | bool
            - _typed | bool or (_cql_own.user != '' and _cql_own.password != '')
          vars:
            _typed: >-
              {{ cassandra_cql_login.asked | default(false) and cassandra_cql_login.state | default('') in ['ok', 'unchecked'] }}
            _login:
              cassandra_cql_username: "{{ cassandra_cql_login.user if _typed | bool else _cql_own.user }}"
              cassandra_cql_password: "{{ cassandra_cql_login.password if _typed | bool else _cql_own.password }}"

        # the files written with it (secrets.yml): the stops below see them
        - name: Lay out again with the CQL login
          no_log: "{{ not import_debug | default(false) | bool }}"
          ansible.builtin.set_fact:
            _layout: "{{ _layout_over }}"
          when: import_cluster_cql_login_set is not skipped

        # Each file it writes starts with a "# Written by ...import_cluster for
        # <cluster group>" line: a re-import replaces those, removes the ones of this
        # cluster it no longer writes (a node gone), and keeps every other file
        # (group_vars/all/*.yml, the other clusters', notes). A file from an earlier
        # release, whose line names no cluster, is this cluster's only when this
        # cluster's hosts file alone names its group or host (else it is kept, and
        # listed in the report). A <cluster group>.yml without that line holding this
        # cluster's group alone (moved from an earlier layout, or edited by hand) is
        # its hosts file: replaced, the old one kept as <file>.<date>~. So is a file
        # without that line laid out as the import writes it (its first comment a block
        # title: # Cluster & topology...), from an import before that line.
        # import_adopt: false; true takes the files of an earlier import of
        # this cluster that do not say whose they are (no first line naming it, and no
        # hosts file there naming their group or host) as this cluster's: replaced or
        # removed, each replaced one kept as <file>.<date>~.
        - name: Sort out the files an earlier import wrote
          ansible.builtin.set_fact:
            _leftovers: >-
              {{ _found | community.cassandra.cassandra_inventory_leftovers(_read, _written, _layout.cluster_group,
                                                                             _vault_secret | default(''),
                                                                             _layout.hosts, _layout.cluster_name,
                                                                             import_adopt | default(false) | bool) }}
          vars:
            # (not the report, when import_report_dir puts it there: written again below)
            _found: "{{ import_cluster_existing.files | default([]) | map(attribute='path') | map('relpath', _dir)
                        | reject('match', '(.*/)?[.]') | reject('in', _report_files) | list }}"
            _report_files: >-
              {{ ['report.txt', 'report.check.txt', 'report.details.txt', 'report.check.details.txt',
                  'report.shareable.txt', 'report.check.shareable.txt', 'report.shareable.key.txt',
                  'report.shareable.map']
                 | map('regex_replace', '^', _report_dir ~ '/') | map('relpath', _dir) | list }}
            # the first line is enough to tell (a vaulted file: decrypted to its first line; an inventory file,
            # and the cluster's main.yml for its cluster name: all of it), and a secret's value never leaves
            # this task
            _read: >-
              {{ import_cluster_existing_vars.results | community.cassandra.cassandra_inventory_file_heads(_layout.cluster_group) }}
            _written: "{{ [_hosts_file] + _files | map(attribute='path') | list }}"

        - name: Stop rather than write over another cluster's files
          ansible.builtin.assert:
            that: _leftovers.conflicts | length == 0
            fail_msg: >-
              {{ _leftovers.conflicts | default([]) | join('; ') }}. Nothing written: in {{ _dir }}, these are another
              cluster's (another import_dir, or for a host name import_host_names fqdn or ip), or files an
              earlier release wrote that no hosts file there names{{ '' if not _leftovers.adoptable | default([]) else
              '. If an earlier import of this cluster wrote them: -e import_adopt=true takes them over, each
              file replaced kept as <file>.<date>~' if _leftovers.adoptable | length == _leftovers.conflicts | length else
              '. -e import_adopt=true would take over ' ~ _leftovers.adoptable | length ~ ' of them only' }}
            quiet: true
          run_once: true  # (no host before its message)
          vars:
            cassandra_output: true

        - name: Stop rather than write in clear over a vaulted file
          ansible.builtin.assert:
            that: _vault | bool or _vaulted | length == 0
            fail_msg: >-
              {{ _vaulted | join(', ') }} in {{ _dir }} are vaulted, and no vault password file is set: set
              vault_password_file in ansible.cfg (or -e import_vault_password_file=<file>)
            quiet: true
          run_once: true  # (no host before its message)
          vars:
            cassandra_output: true
            _vaulted: >-
              {%- set out = [] -%}
              {%- for r in import_cluster_existing_vars.results | default([]) if r.content is defined -%}
              {%-   if r.item in _files | selectattr('secret') | map(attribute='path') and (r.content | b64decode).startswith('$ANSIBLE_VAULT') -%}
              {%-     set _ = out.append(r.item) -%}
              {%-   endif -%}
              {%- endfor -%}
              {{ out }}

        # known as an earlier import's by their layout only (no first line), or taken over: kept as <file>.<date>~
        - name: Say the inventory is written
          ansible.builtin.debug:
            msg: "{{ ('Comparing the inventory with ' if ansible_check_mode else 'Writing the inventory to ') ~ _dir }}..."
          vars:
            cassandra_output: true

        - name: Keep a backup of the files it removes that do not say they are its
          ansible.builtin.copy:
            src: "{{ _dir }}/{{ item }}"
            dest: "{{ _dir }}/{{ item }}.{{ now(fmt='%Y-%m-%d@%H:%M:%S') }}~"
            mode: preserve
            remote_src: true
          loop: "{{ _leftovers.backup | default([]) }}"
          no_log: true  # (a secrets.yml)

        - name: Remove the files an earlier import wrote and this one does not
          ansible.builtin.file:
            path: "{{ _dir }}/{{ item }}"
            state: absent
          loop: "{{ _leftovers.stale }}"  # files only: a dir may hold files of yours
          register: import_cluster_removed

        - name: Read the dirs already there
          ansible.builtin.command:
            argv: "{{ [ansible_playbook_python, '-c', _read_files] }}"
            stdin: "{{ _wanted | to_json }}"
          register: import_cluster_dirs_read
          changed_when: false
          check_mode: false  # read only
          vars:
            _dirs: "{{ [''] + _files | map(attribute='path') | map('dirname') | unique | list }}"
            _wanted: [[dirs, stat, "{{ _dirs | zip(_dirs | map('regex_replace', '^', _dir ~ '/')) | list }}"]]

        # (the ones there with their mode already left alone: a module run each)
        - name: Create the dirs
          ansible.builtin.file:
            path: "{{ _dir }}/{{ item.item }}"
            state: directory
            mode: "0755"
          loop: "{{ (import_cluster_dirs_read.stdout | from_json).dirs }}"
          loop_control:
            label: "{{ item.item }}"
          when: not (item.stat.isdir | default(false) and item.stat.mode == '0755')

        - name: Create the report dir
          ansible.builtin.file:
            path: "{{ _report_dir }}"
            state: directory
            mode: "0755"
          check_mode: false  # the report is written under --check too (on the controller, not in the inventory)
          when: _report_dir != _dir

        # (one there as it would be written, its mode too, left alone: as copy would, without its module run)
        - name: Write the hosts file
          ansible.builtin.copy:
            content: "{{ _content }}"
            dest: "{{ _dir }}/{{ _hosts_file }}"
            mode: "0644"
            backup: "{{ _hosts_file in _leftovers.replaced | default([]) }}"  # not an import's
          register: import_cluster_wrote_hosts
          diff: "{{ ansible_diff_mode | bool and _hosts_file in import_cluster_existing_modes }}"  # (--diff) a new file: listed on the screen, not shown whole
          when: >-
            not (import_cluster_existing_modes[_hosts_file] | default('') == '0644'
                 and import_cluster_existing_text[_hosts_file] | default(none) == _content)
          vars:
            _content: "{{ (('' if _self_check_ok | bool else '# NOT VALID: the import self-check failed, see '
                                                           ~ (_report_dir ~ '/report.txt') | relpath(_dir) ~ '\n')
                           ~ _layout.hosts | to_nice_yaml(indent=2, sort_keys=false))
                          | community.cassandra.cassandra_inventory_generated(_layout.cluster_group) }}"

        # Passwords found in the config go to secrets.yml files next to the other variables: encrypted as a whole
        # with ansible-vault (Ansible reads vaulted vars files) with the vault password above, else written 0600
        # for you to encrypt
        - name: Write group_vars and host_vars
          ansible.builtin.copy:
            content: >-
              {{ item.content | community.cassandra.cassandra_inventory_generated(_layout.cluster_group)
                 | ansible.builtin.vault(_vault_secret, vault_id=import_vault_id | default('default'))
                 if item.secret and _vault | bool else item.content | community.cassandra.cassandra_inventory_generated(_layout.cluster_group, item.path) }}
            dest: "{{ _dir }}/{{ item.path }}"
            mode: "{{ '0600' if item.secret else '0644' }}"
            backup: "{{ item.path in _leftovers.replaced | default([]) }}"  # not an import's: kept as <file>.<date>~
            decrypt: false  # the content is already encrypted, write it as is
          loop: "{{ _files }}"
          loop_control:
            label: "{{ item.path }}"
          register: import_cluster_wrote_vars
          no_log: "{{ item.secret }}"
          diff: "{{ ansible_diff_mode | bool and item.path in import_cluster_existing_modes }}"  # (--diff) a new file: listed on the screen, not shown whole
          # a vaulted file already there with the same content is left as it is (not encrypted again); one in clear
          # there as it would be written, its mode too, also (as copy would, without its module run)
          when: >-
            not (import_cluster_existing_text[item.path] | default('') | community.cassandra.cassandra_inventory_same_secret(_text, _vault_secret)
                 if item.secret and _vault | bool
                 else import_cluster_existing_modes[item.path] | default('') == ('0600' if item.secret else '0644')
                      and import_cluster_existing_text[item.path] | default(none) == _text)
          vars:
            _text: "{{ item.content | community.cassandra.cassandra_inventory_generated(_layout.cluster_group, item.path) }}"

        - name: Note the CQL login is written
          ansible.builtin.set_fact:
            _cql_saved: true
      always:
        - name: Say the CQL login typed was not saved
          ansible.builtin.debug:
            msg:
              - >-
                CQL login {{ cassandra_cql_login.user }}: typed{{ ' and checked' if cassandra_cql_login.state == 'ok'
                else ' (not checked)' }}, NOT saved: the import stopped before it wrote the inventory.
              - The next import asks for it again, when it writes the inventory.
              - "To give it without typing the password, in a vaulted file: ansible-vault create cql_login.yml"
              - "  cassandra_cql_username: {{ cassandra_cql_login.user }}"
              - "  cassandra_cql_password: <its password>"
              - >-
                Then add to the playbooks, the import too: -e @cql_login.yml --ask-vault-pass (a login given so is
                used, not written to the inventory).
          when:
            - import_cluster_cql_login_set | default({}) is changed
            - not _cql_saved | default(false)
          vars:
            cassandra_output: true
            cassandra_output_gap: true  # a block of its own (ops callback)

    # import_report_shareable: true (default false: none written) also writes a copy of the report to share, next to it
    # (report.shareable.txt; report.check.shareable.txt under --check): node names n1.., clusters c1.., addresses
    # IP, the site's host names, domains, URLs, paths, buckets and user names replaced, secrets masked; and its key
    # (the real names), for the operator only: report.shareable.key.txt, mode 0600 before anything is in it, never in
    # the copy, not written under --check (.txt: an inventory dir that holds them, Ansible skips them)
    - name: Make the shareable copy of the report
      ansible.builtin.set_fact:
        _import_shareable: >-
          {{ (_report ~ _newline ~ _newline ~ _report_details) | community.cassandra.cassandra_import_shareable(_layout, _report_args.written,
               _report_args.report_file, _report_args.cwd) }}
      when: import_report_shareable | default(false) | bool

    # the shareable copy and key an earlier import wrote (each known by its first line, the import's own), read
    # before report.txt is written (whose cluster it was: said), never removed nor overwritten (the key of a copy
    # already shared must not be lost). Moved aside as <file>.<date>@<time>~:
    # - with import_report_shareable off (they describe that import);
    # - when this import writes another text in their place (the run's time and build left out);
    # - a link this import writes over (the link itself; a link it does not write over is kept);
    # - the key of an earlier release candidate (report.shareable.map).
    # Under --check only said, except the copy --check writes itself (report.check.shareable.txt).
    - name: Find the shareable copy and key of an earlier import
      ansible.builtin.set_fact:
        _import_old_shareable: >-
          {{ _report_args.report_file | dirname | community.cassandra.cassandra_import_old_shareable(
               _layout.cluster_group, now(fmt='%Y-%m-%d@%H:%M:%S'), _on, _new, ansible_check_mode) }}
      vars:
        _stem: "{{ (_report_args.report_file | basename | regex_replace('[.]txt$', '')) ~ '.shareable.' }}"
        _on: "{{ import_report_shareable | default(false) | bool }}"
        # what this import writes there (its key: not under --check)
        _new: >-
          {{ {_stem ~ 'txt': _import_shareable.text | join(_newline) ~ _newline}
             | combine({} if ansible_check_mode else {_stem ~ 'key.txt': _import_shareable.map | join(_newline) ~ _newline})
             if _on | bool else {} }}

    # mv -n: never over a file; when the name found above is taken since (another import in this dir at the same
    # time), the file stays where it is, and the run stops below before anything is written over it
    - name: Move aside the shareable copy and key of an earlier import
      ansible.builtin.command:
        argv: [mv, -n, --, "{{ item.path }}", "{{ item.backup }}"]
      register: _import_moved_aside
      changed_when: true
      failed_when: false  # (judged below: whether the file is still there)
      loop: "{{ _import_old_shareable | selectattr('action', 'equalto', 'move') | list }}"
      loop_control:
        label: "{{ item.name }}"
      check_mode: false  # (under --check: only the copy --check writes, found so)

    - name: Say what was done with the shareable copy and key of an earlier import
      ansible.builtin.debug:
        msg: >-
          {{ _said | community.cassandra.cassandra_import_old_shareable_lines(
               _report_args.report_file | dirname, _layout.cluster_group, import_report_shareable | default(false) | bool) }}
      when: _said | length > 0
      vars:
        cassandra_output: true
        # (said before the stop below: a file mv -n left in place is said by the stop alone)
        _left: "{{ _import_moved_aside.results | default([]) | selectattr('item.path', 'exists') | map(attribute='item.name') | list }}"
        _said: "{{ _import_old_shareable | rejectattr('name', 'in', _left) | list }}"

    - name: Stop when a shareable copy or key was not moved aside
      ansible.builtin.fail:
        msg:
          - "{{ item.item.name }} was not moved aside"
          - "nothing is written over it: the run stops"
          - "in:"
          - "  {{ item.item.path | dirname }}"
          - "mv -n to {{ item.item.backup | basename }}:"
          - "  {{ item.stderr or 'that name is taken' }}"
          - "WAY OUT  {{ 'fix what mv says, then run the import again' if item.stderr
                         else 'run the import again (it takes the next free name)' }}"
      loop: "{{ _import_moved_aside.results | default([]) }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.item.path is exists
      vars:
        cassandra_output: true

    # a report.txt of the user's, or of another cluster's import: kept as <file>.<date>~; under --check,
    # report.check.txt (on the controller only: the inventory is not written)
    - name: Write report.txt and report.details.txt
      ansible.builtin.copy:
        content: "{{ (item.text ~ '\n') | community.cassandra.cassandra_inventory_generated(_layout.cluster_group) }}"
        dest: "{{ item.path }}"
        mode: "0600"  # (secrets masked; what it says of the nodes stays its owner's, as the run reports)
        backup: >-
          {{ item.path is file
             and not lookup('ansible.builtin.file', item.path).startswith(
                       '# Written by community.cassandra.import_cluster for ' ~ _layout.cluster_group ~ ':') }}
      loop:
        - {path: "{{ _report_args.report_file }}", text: "{{ _report }}"}
        - {path: "{{ _report_args.report_file | regex_replace('[.]txt$', '') ~ '.details.txt' }}",
           text: "{{ _report_details }}"}
      loop_control:
        label: "{{ item.path | basename }}"
      check_mode: false
      diff: false
      # (--check with the report in an inventory dir not there yet: not created)
      when: not ansible_check_mode or _report_args.report_file | dirname is directory

    # (the copy made above)
    - name: Make the key of the shareable copy readable by its owner only
      ansible.builtin.file:
        path: "{{ _report_args.report_file | regex_replace('[.]txt$', '') ~ '.shareable.key.txt' }}"
        state: touch
        mode: "0600"
        follow: false  # (a link kept: never the mode of the file it points to)
        access_time: preserve
        modification_time: preserve
      when:
        - import_report_shareable | default(false) | bool
        - not ansible_check_mode

    - name: Write the shareable copy of the report
      ansible.builtin.copy:
        content: "{{ _shareable[item.part] | join(_newline) ~ _newline }}"
        dest: "{{ _report_args.report_file | regex_replace('[.]txt$', '') ~ '.shareable.' ~ item.extension }}"
        mode: "{{ item.mode }}"
      loop:
        - {part: text, extension: txt, mode: "0644"}
        - {part: map, extension: key.txt, mode: "0600"}
      loop_control:
        label: "{{ item.extension }}"
      check_mode: false
      diff: false
      when:
        - import_report_shareable | default(false) | bool
        - not ansible_check_mode or _report_args.report_file | dirname is directory
        - item.part == 'text' or not ansible_check_mode
      vars:
        _shareable: "{{ _import_shareable }}"

    # the end of the run: report.txt shorter (the differences and the files kept without their steps)
    - name: Show the summary
      ansible.builtin.debug:
        msg: >-
          {{ _layout | community.cassandra.cassandra_import_report(_report_args.written, _report_args.report_file,
               _self_check | default({}), _self_check_ok | bool, secrets_clear=_report_args.secrets_clear,
               leftovers=_leftovers | default({}), check=_report_args.check | bool,
               inventory=_report_args.inventory, hosts=_report_args.hosts, cwd=_report_args.cwd,
               allow_unread=_report_args.allow_unread | bool,
               self_check_error=_self_check_error | default(''), changes=_changes, todo=_report_args.todo,
               look=_report_args.look, run_time=_report_args.run_time | default(''), build=true,
               screen=true, strict=import_strict | default(true) | bool,
               shareable=import_report_shareable | default(false) | bool) }}
      vars:
        cassandra_output: true  # printed as is by the ops callback
        cassandra_output_gap: true  # a block of its own (ops callback)

    # import_strict: true; false writes an inventory that fails the self-check without failing the run
    # (to inspect it: not safe to apply).
    # what differs, grouped by what makes the self-check pass, and how (report.txt: the same, each node's lines);
    # one text: plain under the default callback too (ansible-core 2.19+ prints it as is, before its result)
    - name: Stop on a failed self-check
      ansible.builtin.fail:
        msg: >-
          {{ _layout | community.cassandra.cassandra_import_self_check_advice(_self_check | default({}),
               report_file=_report_args.report_file, error=_self_check_error | default(''),
               allow_unread=_report_args.allow_unread | bool, check=_report_args.check | bool,
               inventory=_report_args.inventory, hosts=_report_args.hosts, cwd=_report_args.cwd) | join(_newline) }}
      when:
        - not _self_check_ok | bool
        - import_strict | default(true) | bool
      run_once: true  # (no host before its message)
      vars:
        cassandra_output: true  # its message as is (the ops callback), no task dump
