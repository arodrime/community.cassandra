---
# defaults file for cassandra_firewall
# false: the firewall is left as it is on this node (nothing installed,
# started or opened); import_cluster sets it for the nodes it imports
cassandra_firewall_manage: true
open_ports:
  - 22/tcp  # ssh
  - 7199/tcp  # jmx
  - 7000/tcp  # Internode communication (not used if TLS enabled)
  - 7001/tcp  # TLS Internode communication (used if TLS enabled)
  - 9042/tcp  # CQL native transport port

# Ports open only to some sources instead of everyone, e.g. JMX for a remote
# repair scheduler: {"7199/tcp": ["10.0.9.0/24", "10.0.10.5"]}. A port listed
# here is closed to the others even when it is in open_ports.
cassandra_firewall_port_sources: {}

# Download nothing (air-gapped hosts): the firewall package is checked, not installed
cassandra_offline: false
