---
# Stops every node of one rack at once (maintenance of the rack's hosts,
# network, power...), each one drained (nodetool drain, best effort; with
# cassandra_operation_drain: false only by the role's unit) then stopped:
#   ansible-playbook -i inventory community.cassandra.stop_rack \
#     -e cassandra_target_dc=dc1 -e cassandra_target_rack=rack2
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo): the playbook asks for it itself, no -b needed.
# With at least as many racks as replicas in the datacenter, one rack down is
# one replica down. Refused when a keyspace would lose more than that (more
# replicas in the datacenter than racks, SimpleStrategy with RF > 1) or when a
# node is already down elsewhere in the datacenter; cassandra_rack_force: true
# goes on anyway, at the risk of unavailable or lost data. Refused, whatever
# cassandra_rack_force, when the ring has the datacenter or a node of the rack
# otherwise than the inventory (cassandra_dc, cassandra_rack). Start the rack again
# with start_rack. CQL credentials, when authentication is on:
# cassandra_cql_username/_password.
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Check that the rack can go down
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  vars:
    _dc_nodes: >-
      {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('_cassandra_preflight.cassandra_dc', 'equalto', cassandra_target_dc)
         | list }}
    _rack_nodes: >-
      {{ _dc_nodes | selectattr('_cassandra_preflight.cassandra_rack', 'equalto', cassandra_target_rack)
         | map(attribute='inventory_hostname') | list }}
    _checker: "{{ ansible_play_hosts_all | reject('in', _rack_nodes) | first | default('') }}"
    # each node of the rack: the address the ring lists it by (its ring_address; when that is a name, the
    # host's own addresses), one spelling each (nodetool prints IPv6 in full)
    _rack_node_addresses: >-
      {%- set out = {} -%}
      {%- for h in _rack_nodes -%}
      {%-   set a = hostvars[h]._cassandra_preflight.ring_address | community.cassandra.cassandra_ip -%}
      {%-   set f = hostvars[h].ansible_facts | default({}) -%}
      {%-   set more = [] if a is match('^[0-9.]+$|.*:') else f.all_ipv4_addresses | default([]) + f.all_ipv6_addresses | default([]) -%}
      {%-   set _ = out.update({h: ([a] + more | map('community.cassandra.cassandra_ip') | list) | unique | list}) -%}
      {%- endfor -%}
      {{ out }}
    # the rack's nodes as the ring has them
    _ring_rack: >-
      {{ (cassandra_rack_ring.cluster_status[cassandra_target_dc] | default({})).nodes | default([])
         | selectattr('rack', 'equalto', cassandra_target_rack) | map(attribute='address')
         | map('community.cassandra.cassandra_ip') | list }}
    # what forbids the stop (cassandra_rack_force goes on), and what only warns
    _problems: >-
      {{ _cassandra_rack_check.problems
         + (['already down in ' ~ cassandra_target_dc ~ ': ' ~ _cassandra_rack_down_here | join(', ')]
            if _cassandra_rack_down_here else []) }}
    _warnings: >-
      {{ _cassandra_rack_check.warnings
         + (['down in another datacenter: ' ~ _cassandra_rack_down_elsewhere | join(', ')] if _cassandra_rack_down_elsewhere else []) }}
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Load the cassandra_service defaults (JMX access)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: The rack has nodes, and the cluster has others
      ansible.builtin.assert:
        that:
          - _rack_nodes | length > 0
          - _checker | length > 0
        fail_msg: >-
          {{ 'No node declares cassandra_dc=' ~ cassandra_target_dc ~ ' and cassandra_rack=' ~ cassandra_target_rack
             if _rack_nodes | length == 0 else 'Every node is in that rack: nothing would stay up.' }}
        quiet: true
      run_once: true

    - name: Read the ring from {{ _checker }}
      community.cassandra.cassandra_status:
        down: 10000  # read it whatever the state of the nodes
      module_defaults:
        community.cassandra.cassandra_status: >-
          {{ _cassandra_service_jmx | combine({'port': hostvars[_checker].cassandra_jmx_port | default(_cassandra_service_jmx.port) | int}) }}
      delegate_to: "{{ _checker }}"
      run_once: true
      register: cassandra_rack_ring
      failed_when: cassandra_rack_ring.cluster_status is not mapping

    # The checks below go by the ring's names: a datacenter or rack named otherwise in the inventory (a dc_suffix,
    # an inventory edited after the nodes joined: a node keeps its rack for life) would check nothing
    - name: The ring has the rack as the inventory says it
      ansible.builtin.assert:
        that: cassandra_target_dc in cassandra_rack_ring.cluster_status and _not_there | length == 0
        fail_msg: >-
          {{ ('The ring (nodetool status on ' ~ _checker ~ ') has no datacenter ' ~ cassandra_target_dc ~ ' (it has '
              ~ cassandra_rack_ring.cluster_status.keys() | list | join(', ') ~ ').')
             if cassandra_target_dc not in cassandra_rack_ring.cluster_status
             else ('Not in ' ~ cassandra_target_dc ~ '/' ~ cassandra_target_rack ~ ' in the ring (nodetool status on ' ~ _checker
                   ~ '): ' ~ _not_there | join(', ') ~ '.') }}
          The inventory's cassandra_dc and cassandra_rack must be the ones the nodes joined with. Nothing was changed.
        quiet: true
      run_once: true
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _ring_all: >-
          {{ cassandra_rack_ring.cluster_status.values() | map(attribute='nodes') | flatten | map(attribute='address')
             | map('community.cassandra.cassandra_ip') | list }}
        _not_there: >-
          {%- set out = [] -%}
          {%- for h in _rack_nodes -%}
          {%-   set a = _rack_node_addresses[h] -%}
          {%-   if not a | intersect(_ring_rack) -%}
          {%-     set _ = out.append(h ~ ' (' ~ a | first ~ ('' if a | intersect(_ring_all) else ', not in the ring at all') ~ ')') -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Read the keyspaces' replication from {{ _checker }}
      community.cassandra.cassandra_cqlsh:
        execute: "SELECT JSON keyspace_name, replication FROM system_schema.keyspaces;"
        transform: raw
        cqlsh_host: >-
          {{ hostvars[_checker].cassandra_rpc_address | default('')
             if hostvars[_checker].cassandra_rpc_address | default('') not in ['', 'localhost', '0.0.0.0']
             else '127.0.0.1' }}
        username: "{{ cassandra_cql_username | default(omit, true) }}"
        password: "{{ cassandra_cql_password | default(omit, true) }}"
        debug: true
      delegate_to: "{{ _checker }}"
      run_once: true
      register: cassandra_rack_keyspaces
      changed_when: false

    - name: Work out the risks
      ansible.builtin.set_fact:
        _cassandra_rack_check: >-
          {{ cassandra_rack_keyspaces.out | default('') | community.cassandra.cassandra_keyspaces
             | community.cassandra.cassandra_rack_down_problems(cassandra_target_dc, _racks | length) }}
        # addresses of the rack's nodes, to tell them apart in the ring
        _cassandra_rack_down_here: >-
          {{ cassandra_rack_ring.cluster_status[cassandra_target_dc].nodes | default([])
             | selectattr('status', 'equalto', 'D') | map(attribute='address')
             | map('community.cassandra.cassandra_ip') | reject('in', _rack_addresses) | list }}
        _cassandra_rack_down_elsewhere: >-
          {{ cassandra_rack_ring.cluster_status | dict2items | rejectattr('key', 'equalto', cassandra_target_dc)
             | map(attribute='value.nodes') | flatten | selectattr('status', 'equalto', 'D')
             | map(attribute='address') | list }}
      vars:
        # only the ones in the rack in the ring: a host address that is another node's never hides that one
        _rack_addresses: "{{ _rack_node_addresses.values() | flatten | intersect(_ring_rack) }}"
        # the datacenter's racks as the ring has them
        _racks: "{{ cassandra_rack_ring.cluster_status[cassandra_target_dc].nodes | map(attribute='rack') | unique | list }}"
      run_once: true

    - name: Refuse when a keyspace would lose more than one replica
      ansible.builtin.assert:
        that: _problems | length == 0 or cassandra_rack_force | default(false) | bool
        fail_msg: >-
          {{ ['Stopping ' ~ cassandra_target_dc ~ '/' ~ cassandra_target_rack ~ ' (' ~ _rack_nodes | join(', ')
              ~ ') would take down more than one replica of some data:'] + _problems
             + ['Fix that first, or set cassandra_rack_force: true: reads and writes needing those replicas then fail,'
                ~ ' and data only on them is unavailable until the rack is back.']
             + _warnings | map('regex_replace', '^', 'WARNING - ') | list }}
        quiet: true
      run_once: true

    - name: Show the plan and confirm
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: screen.yml
      vars:
        _blocks: >-
          {%- set l = [] -%}
          {%- for h in _rack_nodes -%}
          {%-   set _ = l.append({'title': h | community.cassandra.cassandra_screen_title(hostvars[h]._cassandra_preflight | default({}))}) -%}
          {%- endfor -%}
          {{ l }}
        cassandra_screen_question: "Stop {{ _rack_nodes | join(', ') }}?"
        cassandra_screen:
          operation: stop_rack
          summary: "stop {{ cassandra_target_dc | default('(not set)') }} / {{ cassandra_target_rack | default('(not set)') }}"
          intro:
            - >-
              Stops Cassandra on every node of the rack at once; they stay down until start_rack.
          blocks: "{{ _blocks }}"
          warnings:
            - label: replicas
              text: >-
                {{ (['cassandra_rack_force is true: the rack goes down although it takes more than one replica of some'
                     ' data down:'] + _problems) if _problems and cassandra_rack_force | default(false) | bool else '' }}
            - label: replication
              each: "{{ _cassandra_rack_check.warnings }}"
            - label: down nodes
              text: >-
                {{ ('down in another datacenter: ' ~ _cassandra_rack_down_elsewhere | join(', ')) if _cassandra_rack_down_elsewhere else '' }}

    - name: Group the rack's nodes
      ansible.builtin.group_by:
        key: cassandra_target_rack_nodes
      when: inventory_hostname in _rack_nodes
      changed_when: false

- name: Stop the rack
  hosts: "{{ lookup('community.cassandra.cassandra_hosts') }}:&cassandra_target_rack_nodes"
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Load the cassandra_service defaults (JMX access)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    # Not left to the unit: one kept as found (cassandra_service_unit_manage: false) may not drain.
    # Best effort, like the unit's: a node that does not answer (down, JMX) is stopped all the
    # same (SIGTERM runs Cassandra's own drain on shutdown), never left drained and running.
    - name: Drain the node
      community.cassandra.cassandra_drain:
      module_defaults:
        community.cassandra.cassandra_drain: "{{ _cassandra_service_jmx }}"
      register: cassandra_rack_drain
      failed_when: false
      ignore_errors: true  # the timeout below
      timeout: "{{ cassandra_service_drain_timeout | int }}"
      when: cassandra_operation_drain | bool or not cassandra_service_unit_manage | bool

    - name: Say the drain did not work
      ansible.builtin.debug:
        msg: >-
          WARNING - {{ inventory_hostname }} was not drained ({{ cassandra_rack_drain.error | default('', true)
                                                                 or cassandra_rack_drain.msg | default('no answer', true) }}): stopped all the same.
      vars:
        cassandra_output: true
      when:
        - cassandra_rack_drain is not skipped
        - not cassandra_rack_drain.changed | default(false)  # an error, no answer, the timeout

    - name: Stop Cassandra
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
      vars:
        cassandra_service_state: stopped

    - name: Say how to start it again
      ansible.builtin.debug:
        msg: >-
          {{ cassandra_target_dc | default('(not set)') }}/{{ cassandra_target_rack | default('(not set)') }} is down ({{ ansible_play_hosts_all | join(', ') }}).
          Start it with: ansible-playbook -i <inventory> community.cassandra.start_rack -e cassandra_hosts={{
          lookup('community.cassandra.cassandra_hosts') }} -e cassandra_target_dc={{ cassandra_target_dc | default('(not set)') }}
          -e cassandra_target_rack={{ cassandra_target_rack | default('(not set)') }}
      run_once: true
      vars:
        cassandra_output: true
        cassandra_output_gap: true  # a block of its own
