---
# Checked before the unit is written: a restart writes it before draining,
# so an account that cannot read the config stops the run with the node running
- name: Check the account Cassandra runs as can read the config
  ansible.builtin.include_tasks: account_check.yml

# a running node started another way (e.g. imported): what it runs with, before the unit changes
# (apply_config then knows the change waits for a restart)
- name: Tell whether the unit changes
  ansible.builtin.template:
    src: cassandra.service.j2
    dest: /etc/systemd/system/cassandra.service
    mode: "0644"
  check_mode: true
  register: cassandra_service_unit_planned
  when:
    - cassandra_service_unit_manage | bool
    - not ansible_check_mode

- name: Record the config the running Cassandra started with
  ansible.builtin.include_tasks: config_seed.yml
  when: cassandra_service_unit_planned is changed

# Same name as the package's init script: systemd prefers a native unit
# over the SysV-generated one, so service/systemctl both use this.
- name: Install the cassandra systemd unit
  ansible.builtin.template:
    src: cassandra.service.j2
    dest: /etc/systemd/system/cassandra.service
    mode: "0644"
  register: cassandra_service_unit
  when: cassandra_service_unit_manage | bool
