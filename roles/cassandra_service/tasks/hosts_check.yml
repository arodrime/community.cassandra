---
# Run on localhost before any play on the cluster's group: a group name that
# is not in the inventory would otherwise run on no host, or stop later on a
# raw template error. Without cassandra_hosts, the group is the one the
# CASSANDRA_CLUSTER environment variable names, else the inventory's cluster
# group (lookup community.cassandra.cassandra_hosts), and a name close
# to a playbook variable (-e cassandra_host=...) is pointed out. A run with
# --limit skips localhost, so this check too.
- name: Check cassandra_target_nodes
  ansible.builtin.include_tasks: target_nodes_check.yml
  tags: [always]  # its variables check under --tags too

- name: Variables close to the playbooks' own
  ansible.builtin.debug:
    msg: "WARNING - {{ item.key }} is set: did you mean {{ item.value }}?"
  loop: "{{ query('ansible.builtin.varnames', '^cas+andra_') | community.cassandra.cassandra_close_names(_known) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    cassandra_output: true
    _known: "{{ _cassandra_playbook_variables }}"

# the lookup's own refusal (a group not in the inventory, several clusters and none named, an unknown
# CASSANDRA_CLUSTER...), the plays after never reached: in their hosts, the lookup can only fail with a
# raw Ansible error (under --limit, where this play does not run)
- name: The cluster's group is in the inventory
  ansible.builtin.assert:
    that: _refusal | length == 0
    fail_msg: "{{ _refusal }}"
    quiet: true
  run_once: true  # its msg as is, not "localhost: ..." (ops callback)
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _refusal: "{{ lookup('community.cassandra.cassandra_hosts', refusal=true) }}"
  tags: [always]  # under --tags too, else the next play's hosts fail on it

# the default callback's line (the ops callback prints only the failure above)
- name: Say which group is the cluster's
  ansible.builtin.debug:
    msg: "Cluster group {{ lookup('community.cassandra.cassandra_hosts', explain=true) }}"
