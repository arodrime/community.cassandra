minor_changes:
  - "topology - the screen starts with the plan in order, each node with its datacenter and rack (adds, seed change, decommissions). No cap on the number of removals: more than half of a datacenter removed is a warning on the plan screen; the refusals are a datacenter left with fewer nodes than a keyspace has replicas there, and a datacenter that keeps nodes left with no seed."
  - "topology, add_node, decommission_node - the seeds follow ``cassandra_seeds``. A new host listed in it joins as a regular node (its ``cassandra.yaml`` never lists itself while it bootstraps), then the list is applied live on every node; a node to remove that is no longer in it is first dropped from the other nodes' seed lists (as change_seeds applies them, no restart). topology also applies a seed change with no node to add or remove, and its screen (under ``--check`` too) warns that the seeds will change on every node, with the old and new lists."
