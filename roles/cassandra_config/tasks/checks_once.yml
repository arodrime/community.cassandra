---
# cassandra_config's checks (checks.yml) once for the nodes of the play whose values they read are the same
# (_cassandra_config_check_vars, and those it looks up by name), on the first of them, its messages naming them all:
# they read the variables only, so the verdicts are theirs too. Every node of the play must run it (plan.yml:
# apply_config's compare)
- name: Note the values the checks read
  ansible.builtin.set_fact:
    _cassandra_config_check_key: >-
      {{ query('ansible.builtin.vars', *(_cassandra_config_check_vars + _by_name), default='(not set)') | to_json
         | hash('sha1') }}
  no_log: true  # (a sha1, but of values that hold secrets)
  # a value that cannot be read (a template of yours that fails...): no key, the node checked on its own, its
  # checks saying what fails
  ignore_errors: true
  vars:
    # the ones checks.yml looks up by name
    _by_name: >-
      {%- set out = query('ansible.builtin.varnames', '^cassandra_(env|logback)_extra_lines$') -%}
      {%- for prefix in ['cassandra_jvm_', 'cassandra_jvm8_', 'cassandra_jvm11_', 'cassandra_jvm17_'] -%}
      {%-   for name in _names -%}{%- set _ = out.append(prefix ~ name) -%}{%- endfor -%}
      {%- endfor -%}
      {{ out }}
    _names: [max_tenuring_threshold, g1_heap_region_size, g1_new_size_percent, g1_rset_updating_pause_time_percent,
             max_gc_pause_millis, initiating_heap_occupancy_percent, removed_options, extra_options]

- name: Group the nodes whose checks read the same values
  ansible.builtin.set_fact:
    _cassandra_config_check_groups: >-
      {{ ansible_play_hosts | community.cassandra.cassandra_check_groups(hostvars) }}
  run_once: true

# a check that fails stops the nodes of the group, its message naming them (its verdict is theirs)
- name: Check the variables of these nodes
  when: inventory_hostname in _cassandra_config_check_groups
  vars:
    _cassandra_config_checked: "{{ _cassandra_config_check_groups[inventory_hostname] }}"
    cassandra_output_rescued: true  # (the rescue says what failed, the nodes it stands for)
  block:
    - name: Check the variables of these nodes
      ansible.builtin.include_tasks: checks.yml
  rescue:
    - name: Stop the nodes these checks stand for
      ansible.builtin.fail:
        msg: >-
          {{ _msg if _msg is match('REFUSED ') else _cassandra_config_checked_names ~ ': ' ~ _msg }}
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _msg: "{{ ansible_failed_result.msg | default('a check failed') }}"  # (a refusal names them already)
