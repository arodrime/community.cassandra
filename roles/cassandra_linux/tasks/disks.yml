---
# The disks: the devices of the data and commitlog directories, from the
# filesystem down to the disks (LVM, md RAID, dm-crypt, multipath, partitions),
# or the ones set in cassandra_data_block_devices (and the devices under
# them). Read-ahead is used at the top, the device the filesystem is mounted
# from; the devices under it are tuned too, whatever else they hold
# (module_utils/cassandra_disks.py says why). The lookups only read, so they
# also run in check mode.
- name: Find the devices to tune
  ansible.builtin.import_tasks: disks_find.yml

- name: Tune them
  ansible.builtin.import_tasks: disks_apply.yml

- name: Compare the disk tuning and keep how the disks are tuned
  ansible.builtin.import_tasks: disks_summary.yml
