---
# Drains the node, reboots the host and waits until Cassandra (enabled at boot)
# has joined again.
# (the AxonOps agent on: the options file cassandra-env.sh sources there, or Cassandra would not start at boot)
- name: Check the AxonOps Java agent can load
  ansible.builtin.include_tasks: axonops_check.yml
  when: cassandra_axonops_enabled | default(false) | bool

- name: Drain the node
  ansible.builtin.import_tasks: drain.yml
  # a kept unit, or the package's init script, may not drain
  when: >-
    cassandra_operation_drain | bool or not cassandra_service_unit_manage | default(true) | bool
    or cassandra_service_start | default('unit') != 'unit'
  vars:
    _cassandra_service_drain_then: rebooted

- name: Reboot the host
  ansible.builtin.reboot:
    msg: "Rolling reboot of the Cassandra cluster ({{ lookup('community.cassandra.cassandra_hosts') }})"
    reboot_timeout: "{{ cassandra_reboot_timeout | default(1800) }}"
    reboot_command: "{{ cassandra_reboot_command | default(omit) }}"
    boot_time_command: "{{ cassandra_reboot_boot_time_command | default(omit) }}"

- name: Wait until the node has joined
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: main.yml
    rolespec_validate: false  # as the include it was: no argument check
  vars:
    _cassandra_change_report_quiet: "{{ ansible_verbosity | int == 0 }}"  # the recap says it (-v shows it)
    cassandra_service_state: started
    _cassandra_storage_mode_checked: true  # (storage_mode_guard.yml, before the plan)
