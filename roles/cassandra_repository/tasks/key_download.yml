---
# (repository.yml: cassandra_repository_key_url given)
- name: Download the Cassandra signing keys and check their fingerprints
  block:
    # get_url would read another URL, or send the login as it is (2.16 does not decode a %XX), and
    # show the URL whole in its error: refused, the URL not shown
    - name: The signing keys URL holds a plain login, if any
      ansible.builtin.assert:
        that: cassandra_repository_key_url | community.cassandra.cassandra_url_login_ok(ansible_version.full)
        fail_msg: |-
          cassandra_repository_key_url: the part before its last @ is not a plain login.
          A plain login is user:password with letters, digits and - . _ ~ ! $ & ' ( ) * + , ; ={{ ' or %XX' if _decodes else '' }} only.
          The URL is not shown; nothing was downloaded.
          For a file on the mirror (the server of cassandra_install_url): take the login out of the URL and set cassandra_install_username and cassandra_install_password.
          On ansible-core 2.19 or later (this run: {{ ansible_version.full }}), a login can be percent-encoded instead (/ as %2F, @ as %40...).
          An @ in the path is written %40. Then run again.
        quiet: true
      vars:
        _decodes: "{{ ansible_version.full is version('2.19', '>=') }}"

    - name: Download the signing keys, or say why not
      block:
        - name: Download the signing keys
          ansible.builtin.get_url:
            url: "{{ cassandra_repository_key_url }}"
            dest: "{{ _cassandra_repository_key_path }}.new"
            mode: "0644"
            url_username: "{{ cassandra_install_username if _on_mirror | bool else omit }}"
            url_password: "{{ cassandra_install_password if _on_mirror | bool else omit }}"
            force_basic_auth: "{{ _on_mirror | bool }}"
          retries: 3
          register: _cassandra_repository_key_download
          # a login, a query (a signature) or a fragment in the URL shows in its result, its retries and its error
          # (2.19+ masks the result's url only): hidden then, the rescue says why
          no_log: "{{ cassandra_repository_key_url is search('[@?#]') }}"
          until: _cassandra_repository_key_download is succeeded
          changed_when: false  # a temp file: the install below reports the change
          check_mode: false  # read-only for the host's config: the check below needs the file
          vars:
            # the mirror's credentials, only when the keys are on the mirror itself: same scheme, host
            # and port (not sent to apache.org, nor over http:// or to another port of the mirror's host)
            _on_mirror: >-
              {{ cassandra_install_username != ''
                 and cassandra_repository_key_url | community.cassandra.cassandra_same_origin(cassandra_install_url) }}
      rescue:
        - name: Stop on the failed signing keys download
          ansible.builtin.fail:
            msg: >-
              The Cassandra signing keys could not be downloaded from
              {{ cassandra_repository_key_url | community.cassandra.cassandra_url_masked }}:
              {{ ('HTTP ' ~ _status ~ ', ') if _status | int not in [-1, 200] else '' }}{{ _said }}.
              The repository source is left as it is. Check cassandra_repository_key_url (empty: the keys shipped
              with the role), then run again.
          vars:
            _status: "{{ ansible_failed_result.status_code | default(-1) }}"
            _said: >-
              {{ (ansible_failed_result.response | default('', true) or ansible_failed_result.msg | default('no answer'))
                 | regex_replace('^HTTP Error [0-9]+: ', '') | community.cassandra.cassandra_url_masked
                 | trim | regex_replace('[.]$', '') }}

    # Minimal images (AlmaLinux 10) come without it; Amazon Linux's
    # gnupg2-minimal has it, and conflicts with gnupg2
    - name: Look for gpg (RedHat)
      ansible.builtin.stat:
        path: /usr/bin/gpg
      register: _cassandra_repository_gpg
      when: ansible_facts['os_family'] == "RedHat"

    - name: Install gpg to read them (RedHat)
      ansible.builtin.package:
        name: gnupg2
        state: present
      retries: 3
      when:
        - ansible_facts['os_family'] == "RedHat"
        - not _cassandra_repository_gpg.stat.exists

    # --check on a blank host: gnupg, installed above, is not really there yet
    - name: Look for gpg (--check)
      ansible.builtin.command: gpg --version
      register: _cassandra_repository_gpg_check
      changed_when: false
      failed_when: false
      check_mode: false
      when: _cassandra_repository_check

    - name: Read the fingerprints of the downloaded keys
      ansible.builtin.shell: >-
        set -o pipefail;
        home=$(mktemp -d); trap 'rm -rf "$home"' EXIT;
        GNUPGHOME=$home gpg --batch --show-keys --with-colons {{ _cassandra_repository_key_path }}.new
        | awk -F: '/^pub/ { primary = 1; next } primary && /^fpr/ { print $10; primary = 0 }'
      args:
        executable: /bin/bash
      register: _cassandra_repository_key_list
      changed_when: false
      check_mode: false
      when: _cassandra_repository_gpg_check.rc | default(0) == 0

    - name: Check the downloaded keys are known ones
      ansible.builtin.assert:
        that:
          - _cassandra_repository_key_list.stdout_lines | length > 0
          - _unknown | length == 0
        fail_msg: >-
          {{ cassandra_repository_key_url | community.cassandra.cassandra_url_masked }} holds no key or unknown keys ({{ _unknown | join(', ') }}).
          Check them, then add them to cassandra_repository_key_fingerprints.
        quiet: true
      when: _cassandra_repository_gpg_check.rc | default(0) == 0
      vars:
        _unknown: "{{ _cassandra_repository_key_list.stdout_lines | difference(cassandra_repository_key_fingerprints) }}"

    - name: Install the downloaded keys
      ansible.builtin.copy:
        src: "{{ _cassandra_repository_key_path }}.new"
        dest: "{{ _cassandra_repository_key_path }}"
        remote_src: true
        mode: "0644"
      register: _cassandra_repository_key_downloaded
  always:
    - name: Remove the downloaded file
      ansible.builtin.file:
        path: "{{ _cassandra_repository_key_path }}.new"
        state: absent
      changed_when: false
      check_mode: false
