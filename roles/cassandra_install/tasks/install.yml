---
- name: Check the install method
  ansible.builtin.assert:
    that:
      - cassandra_install_method in ['repository', 'packages']
      - cassandra_install_method != 'packages' or cassandra_package_version != ''
    fail_msg: >-
      {{ ('cassandra_install_method is ' ~ cassandra_install_method ~ ': '
          ~ ('not supported yet' if cassandra_install_method == 'tarball' else 'unknown') ~ ', use repository or packages.')
         if cassandra_install_method not in ['repository', 'packages']
         else 'cassandra_install_method packages needs cassandra_package_version (e.g. "5.0.7"): it names the files to download.' }}
    quiet: true

- name: Check the Java
  ansible.builtin.import_tasks: java_check.yml

- name: Snapshot installed packages (change report)
  ansible.builtin.package_facts:
  check_mode: false

- name: Keep the snapshot
  ansible.builtin.set_fact:
    _cassandra_install_before: "{{ ansible_facts['packages'] }}"

# tasks file for cassandra_install
# Minimal images drop man pages; the JDK postinst then fails on its man1 alternatives
- name: Ensure man1 directory exists (Debian JDK postinst)
  ansible.builtin.file:
    path: /usr/share/man/man1
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == 'Debian'

# EL 10 has Java 21 and 25 packages only, none the Cassandra series run on (11,
# 17): say so, rather than let dnf fail on the package name
- name: Look up the Java package in the enabled repos (RedHat)
  ansible.builtin.command:
    # --check: without the repositories cassandra_repository removes
    argv: >-
      {{ ['dnf', '-q', 'repoquery'] + _cassandra_repository_check_removed | default([]) | map('regex_replace', '^', '--disablerepo=') | list
         + ['--whatprovides', cassandra_java_package] }}
  register: cassandra_java_query
  changed_when: false
  check_mode: false  # read-only
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - cassandra_install_java | bool
    - _cassandra_java_home == ''
    - not cassandra_offline | bool
    - cassandra_java_package not in _cassandra_install_before

- name: Stop when no repository offers the Java package (RedHat)
  ansible.builtin.assert:
    that: cassandra_java_query.stdout | trim != ''
    fail_msg: >-
      No repository of {{ inventory_hostname }} offers {{ cassandra_java_package }} (Java {{ cassandra_java_version }},
      for Cassandra {{ cassandra_version }}){{ ': EL 10 has no Java 11 or 17 package'
      if ansible_facts['distribution_major_version'] == '10' and cassandra_java_version | string in ['11', '17'] else '' }}.
      Set cassandra_java_tarball (or a cassandra_java_tarballs entry) to a Java {{ cassandra_java_version }} tarball (e.g. Eclipse Temurin), or
      cassandra_java_home to a Java {{ cassandra_java_version }} installed by other means.
    quiet: true
  when: cassandra_java_query is not skipped

# Debian 12 and later have no Java 11, which Cassandra 4.x needs: say so
# rather than let apt fail with "No package matching"
- name: Java package availability (Debian)
  when:
    - ansible_facts['os_family'] == 'Debian'
    - cassandra_install_java | bool
    - _cassandra_java_home == ''
    - not cassandra_offline | bool
  vars:
    # the names without a version (pkg=1.2) or a range
    _cassandra_install_java_names: "{{ [cassandra_java_package] | flatten | map('regex_replace', '[=<>].*$', '') | list }}"
  block:
    - name: Look up the Java package in the apt repositories (Debian)
      ansible.builtin.command: >-
        apt-cache policy {{ _cassandra_install_java_names | map('quote') | join(' ') }}
      environment:
        LC_ALL: C  # its labels are translated
      register: cassandra_java_policy
      changed_when: false
      check_mode: false  # read-only

    - name: Check the Java package is installed or available (Debian)
      ansible.builtin.assert:
        that:
          - _missing | length == 0
        fail_msg: >-
          {{ _missing | join(', ') }}: not in the apt repositories of this
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
          Set cassandra_java_tarball (or a cassandra_java_tarballs entry) to a Java {{ cassandra_java_version }} tarball,
          or add a repository with a Java {{ cassandra_java_version }} and set cassandra_java_package
          to its package (e.g. temurin-{{ cassandra_java_version }}-jdk from Adoptium).
        quiet: true
      vars:
        # a package block of apt-cache policy, installed or with a candidate
        _available_re: '(?m)^(\S+):\n\s+Installed: (?:(?!\(none\))|\(none\)\n\s+Candidate: (?!\(none\)))'
        _missing: >-
          {{ _cassandra_install_java_names
          | difference(cassandra_java_policy.stdout | regex_findall(_available_re)) }}

- name: Install Java
  ansible.builtin.package:
    name: "{{ cassandra_java_package }}"
    state: present
  retries: 3
  when:
    - cassandra_install_java | bool
    - _cassandra_java_home == ''
    - not cassandra_offline | bool

- name: Java from a tarball, or already unpacked (cassandra_java_home)
  ansible.builtin.include_tasks: java_tarball.yml
  when: _cassandra_java_home != ''

# Cassandra and nodetool run the default java: with several JDKs installed
# (e.g. while moving to another Java), it must be this one
- name: List the installed Javas
  ansible.builtin.command: "{{ 'update-alternatives' if ansible_facts['os_family'] == 'Debian' else 'alternatives' }} --display java"
  register: cassandra_java_alternatives
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cassandra_install_java | bool
    - _cassandra_java_home == ''
    - cassandra_java_set_default | bool

- name: Make it the default java
  community.general.alternatives:
    name: java
    path: "{{ _path }}"
  vars:
    _path: >-
      {{ cassandra_java_alternatives.stdout_lines | default([])
         | select('match', '^/\S*java-(1\.)?' ~ cassandra_java_version ~ '[.-]\S*/bin/java ')
         | map('regex_replace', ' .*$', '') | first | default('') }}
  when:
    - cassandra_install_java | bool
    - _cassandra_java_home == ''
    - cassandra_java_set_default | bool
    - _path != ''

# The Debian package starts Cassandra from its postinst, with stock config,
# before the node is configured: it would initialise as "Test Cluster" and
# later refuse the real cluster_name. policy-rc.d (exit 101) tells
# invoke-rc.d not to start or restart services during package operations.
# A policy-rc.d holding the marker below is ours, left by an interrupted run:
# it is rewritten and removed like a missing one (rc 0 or 2). Anyone else's
# (rc 1) is left alone.
- name: Look for a policy-rc.d not written by this role (Debian)
  ansible.builtin.command: grep -qF "Managed by Ansible (cassandra_install)" /usr/sbin/policy-rc.d
  register: cassandra_policy_rc_d
  changed_when: false
  failed_when: false
  check_mode: false  # read-only
  when: ansible_facts['os_family'] == 'Debian'

# Under --check the Cassandra repository is not really added: skip what
# can't be resolved yet instead of failing (the report says so)
- name: Check that the Cassandra packages are available (--check)
  ansible.builtin.shell: >-
    {% if ansible_facts['os_family'] == 'Debian' %}
    apt-cache policy cassandra | grep -q 'Candidate: [0-9]'
    {% else %}
    dnf -q repoquery cassandra 2>/dev/null | grep -q .
    {% endif %}
  register: cassandra_install_available
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_check_mode
    - not cassandra_offline | bool
    - cassandra_install_method == 'repository'

- name: Check the installed version against cassandra_package_version
  when: cassandra_package_version != ""
  block:
    - name: Read the installed packages
      ansible.builtin.package_facts:
      check_mode: false

    - name: Refuse to change the version of an installed node
      ansible.builtin.assert:
        that: _installed == '' or _installed == cassandra_package_version or _cassandra_install_upgrade | default(false)
        fail_msg: >-
          {{ inventory_hostname }} has Cassandra {{ _installed }}, the inventory asks for {{ cassandra_package_version }}.
          This role never changes the version of an installed node: that is an upgrade (drain, stop, package,
          config, start, one node at a time). Set cassandra_package_version to {{ _installed }} to keep it.
        quiet: true
      vars:
        _installed: >-
          {{ (ansible_facts.packages['cassandra'] | default([{}]) | first).version | default('')
             | regex_replace('^([0-9]+\.[0-9]+\.[0-9]+).*$', '\1') }}

- name: Install Cassandra Packages
  when:
    - not cassandra_offline | bool
    - not ansible_check_mode or cassandra_install_method == 'packages' or cassandra_install_available.rc == 0
  vars:
    _cassandra_install_names: >-
      {{ _cassandra_packages if cassandra_package_version == ''
         else _cassandra_packages | map('regex_replace', '$',
              ('=' if ansible_facts['os_family'] == 'Debian' else '-') ~ cassandra_package_version) | list }}
  block:
    - name: Block service starts during package install (Debian)
      ansible.builtin.copy:
        content: "#!/bin/sh\n# Managed by Ansible (cassandra_install), removed after the install\nexit 101\n"
        dest: /usr/sbin/policy-rc.d
        mode: "0755"
      when:
        - ansible_facts['os_family'] == 'Debian'
        - cassandra_policy_rc_d.rc != 1
      changed_when: false

    - name: Install Cassandra Packages
      ansible.builtin.package:
        name: "{{ _cassandra_install_names }}"
        state: present
      retries: 3
      when:
        - cassandra_install_method == 'repository'
        - not (_cassandra_install_upgrade | default(false) and ansible_facts['os_family'] == 'Debian')
        - _cassandra_java_home == '' or ansible_facts['os_family'] == 'Debian'

    # The RedHat packages depend on a Java package: with Java from a tarball
    # they are installed without their dependencies, plus the ones Cassandra
    # runs with. (Debian: a local package provides Java, see java_tarball.yml.)
    - name: Install the Cassandra packages without a Java package (cassandra_java_home)
      when:
        - cassandra_install_method == 'repository'
        - _cassandra_java_home != ''
        - ansible_facts['os_family'] == 'RedHat'
        - >-
          'cassandra' not in _cassandra_install_before
          or (_cassandra_install_upgrade | default(false)
              and _cassandra_install_before['cassandra'][0].version != cassandra_package_version)
      vars:
        _rpms: /var/tmp/cassandra-rpms
      block:
        - name: Install what Cassandra needs besides Java
          ansible.builtin.package:
            name: [procps-ng, python3, shadow-utils]
            state: present
          retries: 3

        - name: Start from an empty download directory
          ansible.builtin.file:
            path: "{{ _rpms }}"
            state: absent
          changed_when: false

        # dnf download, not the dnf module's download_only: that one resolves
        # the dependencies, and fails where no repository offers the Java
        # package they need (EL 10 has no Java 11 or 17)
        - name: Install the dnf download command
          ansible.builtin.package:
            name: dnf-command(download)
            state: present
          retries: 3

        - name: Download the Cassandra packages
          ansible.builtin.command:
            # excludepkgs/versionlock (kept from routine upgrades) don't apply here
            argv: "{{ ['dnf', '-q', 'download', '--disableexcludes=all', '--destdir', _rpms] + _cassandra_install_names }}"
          register: cassandra_install_download
          until: cassandra_install_download is succeeded
          retries: 3
          changed_when: false
          when: not ansible_check_mode

        - name: Find them among the downloads
          ansible.builtin.find:
            paths: "{{ _rpms }}"
            patterns: "{{ _cassandra_packages | map('regex_replace', '$', '-[0-9]*.rpm') | list }}"
          register: cassandra_install_rpms
          when: not ansible_check_mode

        - name: Every package was downloaded
          ansible.builtin.assert:
            that: cassandra_install_rpms.files | length == _cassandra_packages | length
            fail_msg: >-
              Downloaded {{ cassandra_install_rpms.files | map(attribute='path') | map('basename') | join(', ') or 'nothing' }}
              for {{ _cassandra_packages | join(', ') }}.
            quiet: true
          when: not ansible_check_mode

        - name: Install them without their Java dependency
          ansible.builtin.command:
            argv: "{{ ['rpm', '-U', '--nodeps', '--oldpackage'] + cassandra_install_rpms.files | map(attribute='path') | list }}"
          changed_when: true
          when: not ansible_check_mode

      always:
        - name: Remove the downloaded packages
          ansible.builtin.file:
            path: "{{ _rpms }}"
            state: absent
          changed_when: false

    - name: Install the Cassandra package files (packages)
      ansible.builtin.include_tasks: packages.yml
      when: cassandra_install_method == 'packages'

    # The upgrade playbook, node stopped: the pinned packages are held
    - name: Upgrade the Cassandra packages (Debian)
      ansible.builtin.apt:
        name: "{{ _cassandra_install_names }}"
        state: present
        allow_change_held_packages: true
      retries: 3
      when:
        - cassandra_install_method == 'repository'
        - _cassandra_install_upgrade | default(false) and ansible_facts['os_family'] == 'Debian'

    - name: Hold the pinned packages (Debian)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ _cassandra_packages }}"
      when:
        - ansible_facts['os_family'] == 'Debian'
        - cassandra_package_version != ""
        - cassandra_package_hold | bool
        - not ansible_check_mode or item in _cassandra_install_before  # not installed under --check
  always:
    - name: Remove the temporary policy-rc.d (Debian)
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when:
        - ansible_facts['os_family'] == 'Debian'
        - cassandra_policy_rc_d.rc != 1
      changed_when: false

# jemalloc is preloaded by the cassandra script when found; RedHat-likes
# only have it in EPEL (or Amazon's base repos), so it is optional there.
- name: Look up jemalloc in the enabled repos (RedHat)
  ansible.builtin.command:
    # --check: without the repositories cassandra_repository removes
    argv: >-
      {{ ['dnf', '-q', 'repoquery'] + _cassandra_repository_check_removed | default([]) | map('regex_replace', '^', '--disablerepo=') | list
         + ['jemalloc'] }}
  register: cassandra_jemalloc_query
  changed_when: false
  failed_when: false  # no repository answers (air-gapped): no jemalloc
  check_mode: false  # read-only
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - cassandra_install_jemalloc | bool
    - not cassandra_offline | bool

- name: Install jemalloc
  ansible.builtin.package:
    name: "{{ 'libjemalloc2' if ansible_facts['os_family'] == 'Debian' else 'jemalloc' }}"
    state: present
  retries: 3
  when:
    - cassandra_install_jemalloc | bool
    - not cassandra_offline | bool
    - ansible_facts['os_family'] == 'Debian' or cassandra_jemalloc_query.stdout != ''

# cqlsh only runs on some Python versions (4.x: 3.6-3.11, 5.0: 3.8-3.13):
# when python3 is outside that range, install python3.11 next to it for cqlsh.
- name: Get the system python3 version
  ansible.builtin.command: python3 -c "import sys; print('%d.%d' % sys.version_info[:2])"
  register: cassandra_python3_version
  changed_when: false
  check_mode: false  # read-only
  failed_when: false

- name: Pick the Python cqlsh runs with
  ansible.builtin.set_fact:
    _cassandra_cqlsh_python: >-
      {{ cassandra_cqlsh_python if cassandra_cqlsh_python != ''
      else '' if cassandra_version not in cassandra_cqlsh_python_supported
      else '' if (cassandra_python3_version.rc == 0
                  and cassandra_python3_version.stdout is version(cassandra_cqlsh_python_supported[cassandra_version][0], '>=')
                  and cassandra_python3_version.stdout is version(cassandra_cqlsh_python_supported[cassandra_version][1], '<='))
      else '/usr/bin/python3.11' }}

# cassandra_offline: nothing is downloaded, everything must be installed already
- name: Check the packages are installed (offline)
  when: cassandra_offline | bool
  block:
    - name: Read the installed packages
      ansible.builtin.package_facts:
      check_mode: false

    - name: Every package Cassandra needs is installed
      ansible.builtin.assert:
        that: _missing | length == 0
        fail_msg: >-
          cassandra_offline downloads nothing, and {{ inventory_hostname }} lacks {{ _missing | join(', ') }}:
          install them from your image or internal mirror first (the guide lists the packages per OS and series).
        quiet: true
      vars:
        _needed: >-
          {{ ([cassandra_java_package] if cassandra_install_java | bool and _cassandra_java_home == '' else [])
             + _cassandra_packages + (['tar'] if cassandra_java_tarball != '' and cassandra_java_home == '' else []) }}
        _missing: "{{ _needed | reject('in', ansible_facts['packages']) | list }}"

    - name: Say python3.11 is missing (cqlsh only)
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ inventory_hostname }} has no python3.11, which cqlsh needs here (its python3 is outside the
          versions cqlsh supports): Cassandra runs, cqlsh won't until python3.11 is installed from your image or mirror.
          cqlsh is left as it is (not pointed at the missing python3.11).
      when:
        - cassandra_cqlsh_python_manage | bool
        - _cassandra_cqlsh_python == '/usr/bin/python3.11'
        - "'python3.11' not in ansible_facts['packages']"
      vars:
        cassandra_output: true

    - name: Say jemalloc is missing (optional)
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} has no jemalloc ({{ _jemalloc }}): Cassandra runs without it, with the glibc
          allocator. Install it from your image or mirror to use it.
      vars:
        cassandra_output: true
        _jemalloc: "{{ 'libjemalloc2' if ansible_facts['os_family'] == 'Debian' else 'jemalloc' }}"
      when:
        - cassandra_install_jemalloc | bool
        - _jemalloc not in ansible_facts['packages']

- name: Install python3.11 for cqlsh
  when:
    - cassandra_cqlsh_python_manage | bool
    - _cassandra_cqlsh_python == '/usr/bin/python3.11'
    - not cassandra_offline | bool
  block:
    - name: Check whether the distro repos have python3.11 (Ubuntu)
      ansible.builtin.command: apt-cache policy python3.11
      environment:
        LC_ALL: C  # its labels are translated
      register: cassandra_python311_policy
      changed_when: false
      check_mode: false  # read-only
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Add the deadsnakes PPA (Ubuntu without python3.11)
      when:
        - not ansible_check_mode  # deb822_repository needs python3-debian even to compare
        - ansible_facts['distribution'] == 'Ubuntu'
        - cassandra_cqlsh_python_repo_uri != ''
        - "'Candidate: (none)' in cassandra_python311_policy.stdout or cassandra_python311_policy.stdout == ''"
      block:
        - name: Install the deadsnakes signing key
          ansible.builtin.copy:
            src: deadsnakes.asc
            dest: /etc/apt/keyrings/deadsnakes.asc
            mode: "0644"

        - name: Install python3-debian (deb822_repository needs it)
          ansible.builtin.apt:
            name: python3-debian
            state: present
          retries: 3

        - name: Add the deadsnakes repository
          ansible.builtin.deb822_repository:
            name: deadsnakes
            types: deb
            uris: "{{ cassandra_cqlsh_python_repo_uri }}"
            suites: "{{ ansible_facts['distribution_release'] }}"
            components: main
            signed_by: /etc/apt/keyrings/deadsnakes.asc

        - name: Update the apt cache
          ansible.builtin.apt:
            update_cache: true
          retries: 3

    - name: Look up python3.11 in the enabled repos (RedHat)
      ansible.builtin.command:
        # --check: without the repositories cassandra_repository removes
        argv: >-
          {{ ['dnf', '-q', 'repoquery'] + _cassandra_repository_check_removed | default([]) | map('regex_replace', '^', '--disablerepo=') | list
             + ['python3.11'] }}
      register: cassandra_python311_query
      changed_when: false
      check_mode: false  # read-only
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - "'python3.11' not in _cassandra_install_before"
        - cassandra_cqlsh_python == ''  # picked by the role, not given

    # EL 10: python3 is 3.12, and no python3.11 package exists
    - name: Stop when no repository offers python3.11 (RedHat)
      ansible.builtin.assert:
        that: cassandra_python311_query.stdout | trim != ''
        fail_msg: >-
          cqlsh of Cassandra {{ cassandra_version }} runs on Python {{ cassandra_cqlsh_python_supported[cassandra_version] | join(' to ') }},
          python3 on {{ inventory_hostname }} is {{ cassandra_python3_version.stdout | default('') or 'missing' }}, and no
          repository offers python3.11 to run it with. Install a Python cqlsh supports by other means and set
          cassandra_cqlsh_python to it, or set cassandra_cqlsh_python_manage to false to leave cqlsh as it is.
        quiet: true
      when: cassandra_python311_query is not skipped

    # --check: apt can't resolve it before the PPA above is really added
    - name: Install python3.11
      ansible.builtin.package:
        name: python3.11
        state: present
      retries: 3
      when: >-
        not (ansible_check_mode and ansible_facts['distribution'] == 'Ubuntu' and cassandra_cqlsh_python_repo_uri != ''
             and cassandra_python311_policy.stdout is not search('Candidate: [0-9]'))

# The rpm installs cqlshlib for python3.6 only: link it into the Pythons
# cqlsh may run with (CASSANDRA-19206).
- name: Find the site-packages of the Pythons cqlsh may use (RedHat)
  ansible.builtin.command: "{{ item }} -c \"import sysconfig; print(sysconfig.get_paths()['purelib'])\""
  register: cassandra_cqlsh_purelibs
  changed_when: false
  check_mode: false  # read-only
  failed_when: false
  loop: "{{ (['python3', _cassandra_cqlsh_python] | select | unique) }}"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - cassandra_cqlsh_python_manage | bool

- name: Ensure those site-packages exist (RedHat)
  ansible.builtin.file:
    path: "{{ item.stdout }}"
    state: directory
    mode: "0755"
  loop: "{{ cassandra_cqlsh_purelibs.results | default([]) }}"
  loop_control:
    label: "{{ item.stdout | default('') }}"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - cassandra_cqlsh_python_manage | bool
    - item.rc == 0
    - item.stdout != '/usr/lib/python3.6/site-packages'

- name: Check for the packaged cqlshlib (absent under --check before install)
  ansible.builtin.stat:
    path: /usr/lib/python3.6/site-packages/cqlshlib
  register: cassandra_cqlshlib_src
  when: ansible_facts['os_family'] == 'RedHat'

- name: Link cqlshlib into them (RedHat)
  ansible.builtin.file:
    src: /usr/lib/python3.6/site-packages/cqlshlib
    dest: "{{ item.stdout }}/cqlshlib"
    state: link
  loop: "{{ cassandra_cqlsh_purelibs.results | default([]) }}"
  loop_control:
    label: "{{ item.stdout | default('') }}"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - cassandra_cqlsh_python_manage | bool
    - cassandra_cqlshlib_src.stat.exists or not ansible_check_mode
    - item.rc == 0
    - item.stdout != '/usr/lib/python3.6/site-packages'

- name: Check for visudo (sudo installed)
  ansible.builtin.stat:
    path: /usr/sbin/visudo
  register: cassandra_visudo

# cqlsh honours CQLSH_PYTHON: wrapper for scripts/cron (/usr/local/bin comes
# first in PATH), profile.d for login shells, env_keep for sudo.
- name: Point cqlsh at its Python
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    mode: "{{ item.mode }}"
    validate: "{{ item.validate | default(omit) }}"
  loop:
    - dest: /usr/local/bin/cqlsh
      mode: "0755"
      content: |
        #!/bin/sh
        # Managed by Ansible (cassandra_install): run the package's cqlsh with a Python it supports
        CQLSH_PYTHON="${CQLSH_PYTHON:-{{ _cassandra_cqlsh_python }}}" exec /usr/bin/cqlsh "$@"
    - dest: /etc/profile.d/cqlsh.sh
      mode: "0644"
      content: |
        # Managed by Ansible (cassandra_install)
        export CQLSH_PYTHON={{ _cassandra_cqlsh_python }}
    - dest: /etc/sudoers.d/cqlsh
      mode: "0440"
      validate: /usr/sbin/visudo -cf %s
      content: |
        # Managed by Ansible (cassandra_install)
        Defaults env_keep += "CQLSH_PYTHON"
  loop_control:
    label: "{{ item.dest }}"
  register: cassandra_cqlsh_wrapper
  when:
    - cassandra_cqlsh_python_manage | bool
    - _cassandra_cqlsh_python != ''
    - item.dest != '/etc/sudoers.d/cqlsh' or cassandra_visudo.stat.exists
    # offline without python3.11: leave cqlsh as it is rather than point it at nothing
    - not (cassandra_offline | bool and _cassandra_cqlsh_python == '/usr/bin/python3.11'
           and 'python3.11' not in ansible_facts['packages'] | default({}))

# Only the files written by this role (marker), e.g. not a pip-installed cqlsh
- name: Find the cqlsh Python pointers written by this role
  ansible.builtin.command: >-
    grep -lF "Managed by Ansible (cassandra_install)"
    /usr/local/bin/cqlsh /etc/profile.d/cqlsh.sh /etc/sudoers.d/cqlsh
  register: cassandra_cqlsh_pointers
  changed_when: false
  failed_when: false
  check_mode: false  # read-only
  when:
    - cassandra_cqlsh_python_manage | bool
    - _cassandra_cqlsh_python == ''

- name: Remove the cqlsh Python pointers when not needed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ cassandra_cqlsh_pointers.stdout_lines | default([]) }}"
  when:
    - cassandra_cqlsh_python_manage | bool
    - _cassandra_cqlsh_python == ''

# DataStax Bulk Loader, next to the tools
- name: Install dsbulk
  ansible.builtin.include_tasks: dsbulk.yml
  when: cassandra_dsbulk_install | bool

- name: Report changes
  ansible.builtin.include_tasks: report.yml
