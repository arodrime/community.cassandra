minor_changes:
  - "Operator output - the plan screens go by blocks, one blank line apart: the plan and its steps, the facts, the warnings together (no blank line between two warnings), then the question or, in its place, what ``--check`` or ``cassandra_operation_confirm: false`` means for the run (said under the header before)."
  - "ops callback - one blank line between two blocks, never two in a row: above a question and after its answer (shown again), and before the start of each progress wait, the recaps and the TO DO lists (task variable ``cassandra_output_gap``)."
  - "ops callback - rules mark the blocks out (a heavy one above a plan or a screen and around a recap, a light one between their blocks, above the question and above each node's progress lines, named after the node), and the lines are coloured by their start (WARNING yellow, DONE/HEALTHY green, REFUSED/FAILED/NOT HEALTHY and a stalled progress red, NOTE and progress lines blue), with Ansible's colours: ``ANSIBLE_NOCOLOR`` and a non-terminal output print none. The messages themselves stay plain text."
