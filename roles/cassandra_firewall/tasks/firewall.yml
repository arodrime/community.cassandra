---
# The firewall of the OS family, its service and the Cassandra ports (cassandra_firewall_manage)
- name: Include vars for os family
  ansible.builtin.include_vars:
    file: "{{ ansible_facts['os_family'] }}.yml"

- name: Read the current firewall state (change report)
  ansible.builtin.shell: |
    svc={{ _cassandra_firewall_service }}
    echo "active|$(systemctl is-active $svc 2>/dev/null)"
    e=$(systemctl is-enabled $svc 2>/dev/null); [ "$e" = not-found ] && e=absent
    echo "enabled|$e"
    {% if ansible_facts['os_family'] == 'RedHat' %}
    ports=$(firewall-cmd --permanent --list-ports 2>/dev/null || firewall-offline-cmd --list-ports 2>/dev/null)
    {% else %}
    ports=$(ufw show added 2>/dev/null | awk '$1=="ufw" && $2=="allow" {print $3}' | tr '\n' ' ')
    {% endif %}
    echo "ports|$ports"
  register: cassandra_firewall_snapshot
  changed_when: false
  check_mode: false

- name: Keep the snapshot
  ansible.builtin.set_fact:
    _cassandra_firewall_before: "{{ dict(cassandra_firewall_snapshot.stdout_lines | map('split', '|', 1)) }}"

# installed already: no package manager call (it reads every repository's
# metadata, and fails when a mirror is down though nothing is to install).
# python-firewall is a name python3-firewall provides
- name: Read the installed packages
  ansible.builtin.command:
    argv: "{{ _names | community.cassandra.cassandra_package_query(ansible_facts['os_family']) }}"
  environment:
    LC_ALL: C  # "not installed" said in English, as the filter reads it
  register: cassandra_firewall_read
  changed_when: false
  failed_when: false  # not installed; nothing read at all: the task below fails
  check_mode: false  # a read
  vars:
    _names: "{{ [firewall_packages] | flatten | map('regex_replace', '^python-firewall$', 'python3-firewall') | list }}"
  when: not cassandra_offline | bool

- name: Ensure firewall package is installed
  ansible.builtin.package:
    name: "{{ firewall_packages }}"
    state: present
  retries: 3
  register: cassandra_firewall_install
  when:
    - not cassandra_offline | bool
    - >-
      [firewall_packages] | flatten | map('regex_replace', '^python-firewall$', 'python3-firewall')
      | reject('in', cassandra_firewall_read | default({}) | community.cassandra.cassandra_installed_packages) | list | length > 0

- name: Check the firewall is installed (offline)
  when: cassandra_offline | bool
  block:
    - name: Read the installed packages
      ansible.builtin.command:
        argv: "{{ [_cassandra_firewall_service] | community.cassandra.cassandra_package_query(ansible_facts['os_family']) }}"
      environment:
        LC_ALL: C  # "not installed" said in English, as the filter reads it
      register: cassandra_firewall_read_offline
      changed_when: false
      failed_when: false  # not installed; nothing read at all: the task below fails
      check_mode: false  # a read

    - name: The firewall is installed
      ansible.builtin.assert:
        that: _cassandra_firewall_service in cassandra_firewall_read_offline | community.cassandra.cassandra_installed_packages
        fail_msg: >-
          cassandra_offline downloads nothing, and {{ inventory_hostname }} has no {{ _cassandra_firewall_service }}:
          install it from your image or internal mirror first.
        quiet: true

# The ports open (and those open to some sources only) before the firewall starts: never a running firewall without
# them. firewalld not running yet: its permanent config written offline, loaded when it starts
- name: Ensure ports for cassandra open, before firewalld starts (RedHat)
  ansible.builtin.shell: |
    c=0
    for p in $OPEN; do firewall-offline-cmd -q --query-port="$p" || { firewall-offline-cmd -q --add-port="$p" || exit 1; c=1; }; done
    while IFS= read -r r; do
      [ -n "$r" ] || continue
      firewall-offline-cmd -q --query-rich-rule="$r" || { firewall-offline-cmd -q --add-rich-rule="$r" || exit 1; c=1; }
    done <<EOF
    $RULES
    EOF
    for p in $CLOSE; do ! firewall-offline-cmd -q --query-port="$p" || { firewall-offline-cmd -q --remove-port="$p" || exit 1; c=1; }; done
    echo "changed=$c"
  environment:
    OPEN: "{{ open_ports | reject('in', _cassandra_firewall_port_sources) | join(' ') }}"
    CLOSE: "{{ _cassandra_firewall_port_sources | list | join(' ') }}"
    RULES: "{{ _cassandra_firewall_rich_rules | map(attribute='rule') | join(_nl) }}"  # (one per line)
  vars:
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
  register: cassandra_firewall_offline
  changed_when: "'changed=1' in cassandra_firewall_offline.stdout"
  when:
    - ansible_facts['os_family'] == "RedHat"
    - _cassandra_firewall_before.active in _cassandra_firewall_stopped
    - not _cassandra_firewall_check

- name: Ensure ports for cassandra open (RedHat)
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: yes
    immediate: yes
    state: enabled
  with_items:
    - "{{ open_ports | reject('in', _cassandra_firewall_port_sources) | list }}"
  when:
    - ansible_facts['os_family'] == "RedHat"
    - _cassandra_firewall_before.active not in _cassandra_firewall_stopped

- name: Ensure ports for cassandra open (Debian)
  community.general.ufw:
    port: "{{ item | split('/') | first }}"
    proto: "{{ item | split('/') | last }}"
    rule: "allow"
  with_items:
    - "{{ open_ports | reject('in', _cassandra_firewall_port_sources) | list }}"
  when:
    - ansible_facts['os_family'] == "Debian"
    - not (_cassandra_firewall_check and cassandra_firewall_install is changed)

- name: Ports open to some sources only
  when:
    - _cassandra_firewall_port_sources | length > 0
    - not (_cassandra_firewall_check and cassandra_firewall_install is changed)
  # (to their sources first, then closed to everyone else: no moment closed to them)
  block:
    - name: Open them to their sources (RedHat)
      ansible.posix.firewalld:
        rich_rule: "{{ item.rule }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ _cassandra_firewall_rich_rules }}"
      loop_control:
        label: "{{ item.port }} from {{ item.source }}"
      when:
        - ansible_facts['os_family'] == "RedHat"
        - _cassandra_firewall_before.active not in _cassandra_firewall_stopped  # (else written offline, above)

    - name: Close them to everyone (RedHat)
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: disabled
      loop: "{{ _cassandra_firewall_port_sources | list }}"
      when:
        - ansible_facts['os_family'] == "RedHat"
        - _cassandra_firewall_before.active not in _cassandra_firewall_stopped  # (else written offline, above)

    - name: Open them to their sources (Debian)
      community.general.ufw:
        rule: allow
        from_ip: "{{ item.source }}"
        to_port: "{{ item.port | split('/') | first }}"
        proto: "{{ item.port | split('/') | last }}"
      loop: "{{ _cassandra_firewall_rich_rules }}"  # (a port's sources a list or one string, as on RedHat)
      loop_control:
        label: "{{ item.port }} from {{ item.source }}"
      when: ansible_facts['os_family'] == "Debian"

    - name: Close them to everyone (Debian)
      community.general.ufw:
        port: "{{ item | split('/') | first }}"
        proto: "{{ item | split('/') | last }}"
        rule: allow
        delete: true
      loop: "{{ _cassandra_firewall_port_sources | list }}"
      when: ansible_facts['os_family'] == "Debian"

# Started once its ports are open. Under --check nothing is installed, so the service can't be queried
- name: Ensure firewall service is started
  ansible.builtin.service:
    name: "{{ _cassandra_firewall_service }}"
    state: started
    enabled: yes
  when: not (_cassandra_firewall_check and cassandra_firewall_install is changed)

# a Cassandra port moved from the stock one and not in open_ports: the nodes may not reach it (not opened here: a
# node may reach it through a zone of its own, as an import found it)
- name: Say the Cassandra ports the role does not open
  ansible.builtin.debug:
    msg: >-
      {{ ['WARNING  ' ~ inventory_hostname ~ ': Cassandra is set to use ' ~ (_cassandra_firewall_own_unopened | join(', '))
          ~ ', not in open_ports nor among the ports open to some sources.',
          'The firewall role does not open ' ~ _them ~ '.',
          'Way out: add ' ~ _them ~ ' to open_ports, unless the node reaches ' ~ _them ~ ' by other means.'] }}
  vars:
    cassandra_output: true
    _them: "{{ 'it' if _cassandra_firewall_own_unopened | length == 1 else 'them' }}"
  when: _cassandra_firewall_own_unopened | length > 0

# open to no one by default: Prometheus scrapes it from other hosts
- name: Say the exporter's port is not opened
  ansible.builtin.debug:
    msg: >-
      WARNING  {{ inventory_hostname }}: the Prometheus exporter's port {{ _port }} is not opened in the firewall
      (cassandra_prometheus_exporter_sources is empty): list the Prometheus servers' addresses there.
  vars:
    cassandra_output: true
    _port: "{{ cassandra_prometheus_exporter_port | default(9404) | string ~ '/tcp' }}"
  when:
    - cassandra_prometheus_exporter_enabled | default(false) | bool
    - _port not in _cassandra_firewall_port_sources
    - _port not in open_ports

- name: Build the change list
  ansible.builtin.set_fact:
    _cassandra_firewall_items: >-
      {{ ([{'item': 'packages ' ~ (firewall_packages | join(', ')), 'before': 'absent', 'after': 'present'}]
          if cassandra_firewall_install is changed else [])
         + ([{'item': _cassandra_firewall_service, 'before': _cassandra_firewall_before.active or 'absent', 'after': 'active'}]
            if _cassandra_firewall_before.active != 'active' else [])
         + ([{'item': _cassandra_firewall_service ~ ' at boot', 'before': _cassandra_firewall_before.enabled or 'absent', 'after': 'enabled'}]
            if _cassandra_firewall_before.enabled not in _started_at_boot else []) }}
  vars:
    # what systemctl is-enabled says of a unit that starts at boot
    _started_at_boot: [enabled, enabled-runtime, static, alias, indirect, generated]

- name: Add the ports to open
  ansible.builtin.set_fact:
    _cassandra_firewall_items: "{{ _cassandra_firewall_items + [{'item': 'port ' ~ item, 'before': 'closed', 'after': 'open'}] }}"
  loop: "{{ open_ports | reject('in', _cassandra_firewall_port_sources) | reject('in', _cassandra_firewall_before.ports.split()) | list }}"

- name: Report
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_change_report
  vars:
    cassandra_change_report_role: cassandra_firewall
    cassandra_change_report_items: "{{ _cassandra_firewall_items }}"
