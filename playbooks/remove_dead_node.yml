---
# Last resort for a node that is dead for good and will not be replaced: takes
# it out of the ring, its data rebuilt from the other replicas.
#   ansible-playbook -i inventory community.cassandra.remove_dead_node \
#     -e cassandra_dead_node_address=10.0.0.14
# Without -e cassandra_hosts=<group>: the group cassandra, else the inventory's
# cluster group (lookup community.cassandra.cassandra_hosts).
# Take the dead host out of the inventory first. Prefer replace_node (a new host
# takes over its tokens and data). cassandra_dead_node_method: removenode
# (default: streams the dead node's ranges from the other replicas),
# removenode_force (finishes a removenode of this node that is stuck, without
# waiting for the streams left; run on the node coordinating it, or one that
# shows it DL: nodetool forces every removal or leave that node knows of, so it
# is refused while another node is leaving or being removed too, and does
# nothing when the node is already out of the ring), or assassinate (removes it
# from gossip without streaming: only when removenode can't finish; data it held
# alone is lost, repair after). Run again after an interruption: a removal of it
# still in progress (asked on every node, whichever coordinates it; the token it
# removes tells whose) is waited for again, a node already out of the ring is
# done. A removal of another node in progress is refused. A node being removed
# (gossip) or DL with no node of the run coordinating its removal (from outside
# cassandra_hosts, or its coordinator restarted) is refused:
# cassandra_dead_node_new_removal: true starts a removenode anyway, once none
# runs anywhere.
# CQL credentials, when authentication is on: cassandra_cql_username/_password.
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Remove the dead node
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  vars:
    _method: "{{ cassandra_dead_node_method | default('removenode') }}"
    # removenode(_force) on a node already out of the ring: nothing to do
    _nothing_to_do: "{{ _method in ['removenode', 'removenode_force'] and cassandra_dead_node | default({}) == {} }}"
    # removenode: an earlier run's removal still in progress (on any node) is waited for again
    _resume: "{{ _method == 'removenode' and (cassandra_dead_removal | default({})).state | default('start') == 'resume' }}"
    _nodes_left: >-
      {%- set out = {} -%}
      {%- for h in ansible_play_hosts -%}
      {%-   set dc = hostvars[h]._cassandra_preflight.cassandra_dc -%}
      {%-   set _ = out.update({dc: out.get(dc, 0) + 1}) -%}
      {%- endfor -%}
      {{ out }}
    _replication_problems: >-
      {{ cassandra_dead_keyspaces.out | default('') | community.cassandra.cassandra_keyspaces
         | community.cassandra.cassandra_replication_problems(_nodes_left) }}
  tasks:
    - name: Load the cassandra_service defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Check the request
      ansible.builtin.assert:
        that:
          - cassandra_dead_node_address | default('') | length > 0
          - _method in ['removenode', 'removenode_force', 'assassinate']
          - cassandra_dead_node_address not in (ansible_play_hosts | map('extract', hostvars, ['_cassandra_preflight', 'address']))
        fail_msg: >-
          Give the dead node's address in cassandra_dead_node_address (not a host of the inventory: take it out first),
          and cassandra_dead_node_method removenode, removenode_force or assassinate.
        quiet: true
      run_once: true

    - name: Read the ring
      community.cassandra.cassandra_status:
        down: 10000  # read it whatever the state of the nodes
      module_defaults:
        community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
      run_once: true
      register: cassandra_dead_ring
      failed_when: cassandra_dead_ring.cluster_status is not defined

    - name: Keep what the ring says about it
      ansible.builtin.set_fact:
        cassandra_dead_node: >-
          {{ cassandra_dead_ring.cluster_status.values() | map(attribute='nodes') | flatten
             | selectattr('address', 'equalto', cassandra_dead_node_address) | first | default({}) }}
      run_once: true

    # Only the node coordinating a removal says so, whichever node started it
    - name: Read the removals in progress on every node
      ansible.builtin.command: "{{ _cassandra_service_nodetool }} removenode status"
      register: cassandra_dead_removal_status
      changed_when: false
      failed_when: false
      check_mode: false  # read-only; --check needs it too
      no_log: "{{ cassandra_jmx_password | length > 0 }}"
      when: _method in ['removenode', 'removenode_force']

    # "Removing token (<token>)": one of the tokens of the node being removed
    # on the first node and on each node removing one: a coordinator knows the tokens it removes
    - name: Read the tokens of the ring
      ansible.builtin.command: "{{ _cassandra_service_nodetool }} ring"
      register: cassandra_dead_tokens
      changed_when: false
      failed_when: false
      check_mode: false  # read-only
      no_log: "{{ cassandra_jmx_password | length > 0 }}"
      when:
        - _method in ['removenode', 'removenode_force']
        - inventory_hostname == ansible_play_hosts[0] or 'Removing token' in cassandra_dead_removal_status.stdout | default('')

    # Only the coordinator's ring shows the node DL: gossip says "removing" on every node
    - name: Read the gossip state of the nodes
      ansible.builtin.command: "{{ _cassandra_service_nodetool }} gossipinfo"
      register: cassandra_dead_gossip
      changed_when: false
      failed_when: false
      check_mode: false  # read-only
      no_log: "{{ cassandra_jmx_password | length > 0 }}"
      run_once: true
      when: _method in ['removenode', 'removenode_force']

    - name: Keep where the removal stands
      ansible.builtin.set_fact:
        cassandra_dead_removal: >-
          {{ cassandra_dead_ring | community.cassandra.cassandra_removal_state(cassandra_dead_node_address,
               dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, 'cassandra_dead_removal_status')
                                             | map(attribute='stdout', default=''))),
               gossip=cassandra_dead_gossip.stdout | default(''), tokens=ansible_play_hosts | map('extract', hostvars, 'cassandra_dead_tokens')
                                               | map(attribute='stdout', default='') | join('\n')) }}
      run_once: true

    - name: No other removal in progress
      ansible.builtin.assert:
        that: cassandra_dead_removal.state != 'busy'
        fail_msg: >-
          {{ cassandra_dead_removal.reason }}: wait for that to finish (nodetool removenode status), then run this again.
        quiet: true
      run_once: true
      when: _method == 'removenode'

    # Being removed (gossip), or DL (it died decommissioning). Another removenode
    # from a second node would run next to one still going on elsewhere
    - name: Its removal is not coordinated elsewhere
      ansible.builtin.assert:
        that: cassandra_dead_removal.state != 'orphan' or cassandra_dead_node_new_removal | default(false) | bool
        fail_msg: >-
          {{ cassandra_dead_node_address }} is being removed (gossip), or DL (it died while decommissioning), but no node of
          {{ lookup('community.cassandra.cassandra_hosts') }} is removing it (nodetool removenode status). Check on the other nodes
          of the cluster: if one is removing it, wait for it there. If none is (its coordinator restarted), run this again
          with -e cassandra_dead_node_new_removal=true to start a removenode; or, if a node of the run shows it DL
          (it died decommissioning), with -e cassandra_dead_node_method=removenode_force to finish it without streaming
          (then a repair).
        quiet: true
      run_once: true
      when: _method == 'removenode'

    - name: The node is dead
      when:
        - _method != 'removenode_force'
        - not _nothing_to_do | bool
      ansible.builtin.assert:
        that: _dead.status | default('') == 'D'
        fail_msg: >-
          {{ cassandra_dead_node_address | default('(not set)') }} is {{ (_dead.status ~ _dead.state) if _dead else 'not in the ring' }}:
          only a dead (DN) node is removed this way. A live node leaves with decommission_node.
        quiet: true
      vars:
        _dead: >-
          {{ cassandra_dead_ring.cluster_status.values() | map(attribute='nodes') | flatten
             | selectattr('address', 'equalto', cassandra_dead_node_address) | first | default({}) }}
      run_once: true

    # removenode force finishes EVERY removal or leave the node it runs on knows
    # of (a live node decommissioning too), and nothing on a node that does not
    # show this one DL (only a removal's coordinator does)
    - name: Read the ring on every node (removenode_force)
      community.cassandra.cassandra_status:
        down: 10000
      module_defaults:
        community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
      register: cassandra_dead_force_ring
      failed_when: false
      when:
        - _method == 'removenode_force'
        - not _nothing_to_do | bool

    - name: Choose the node that forces it
      ansible.builtin.set_fact:
        cassandra_dead_force: >-
          {{ dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, 'cassandra_dead_force_ring')))
             | community.cassandra.cassandra_removal_force_target(cassandra_dead_node_address, cassandra_dead_removal) }}
      run_once: true
      when:
        - _method == 'removenode_force'
        - not _nothing_to_do | bool

    - name: A removal of it is in progress, and only that one (removenode_force)
      ansible.builtin.assert:
        that: cassandra_dead_force.on | length > 0
        fail_msg: "{{ cassandra_dead_force.reason }}"
        quiet: true
      run_once: true
      when:
        - _method == 'removenode_force'
        - not _nothing_to_do | bool

    - name: Read the keyspaces' replication
      community.cassandra.cassandra_cqlsh:
        execute: "SELECT JSON keyspace_name, replication FROM system_schema.keyspaces;"
        transform: raw
        cqlsh_host: >-
          {{ cassandra_rpc_address | default('')
             if cassandra_rpc_address | default('') not in ['', 'localhost', '0.0.0.0'] else '127.0.0.1' }}
        username: "{{ cassandra_cql_username | default(omit, true) }}"
        password: "{{ cassandra_cql_password | default(omit, true) }}"
        debug: true
      run_once: true
      register: cassandra_dead_keyspaces
      changed_when: false
      when: not _nothing_to_do | bool

    - name: Every datacenter keeps enough nodes for its replicas
      ansible.builtin.assert:
        that: _replication_problems | length == 0 or cassandra_decommission_force | default(false) | bool
        fail_msg: >-
          {{ ['Without ' ~ cassandra_dead_node_address ~ ', too few nodes are left:'] + _replication_problems
             + ['Add a node first (or replace_node), or lower the replication; cassandra_decommission_force: true'
                ~ ' goes on anyway.'] }}
        quiet: true
      when: not _nothing_to_do | bool
      run_once: true

    - name: Show the plan and confirm
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: screen.yml
      when: not _nothing_to_do | bool
      vars:
        _dead: "{{ cassandra_dead_node | default({}) }}"
        _dead_dc: >-
          {%- set out = [] -%}
          {%- for dc, info in cassandra_dead_ring.cluster_status.items()
                if info.nodes | default([]) | selectattr('address', 'equalto', cassandra_dead_node_address) | list -%}
          {%-   set _ = out.append(dc) -%}
          {%- endfor -%}
          {{ out | first | default('?') }}
        cassandra_screen_session_warning: true
        cassandra_screen_question: "Take {{ cassandra_dead_node_address | default('(not set)') }} out of the ring with {{ _method }}?"
        cassandra_screen:
          operation: remove_dead_node
          summary: "take {{ cassandra_dead_node_address | default('(not set)') }} out of the ring with {{ _method }}"
          blocks:
            - title: >-
                {{ cassandra_dead_node_address | default('(not set)') }}  {{ (_dead.status | default('') ~ _dead.state | default(''))
                   or 'not in the ring' }}{{ ('  ' ~ _dead_dc ~ ' / ' ~ _dead.rack) if _dead.rack is defined else '' }}{{
                   (', load ' ~ _dead.load) if _dead.load is defined else '' }}
              lines:
                - >-
                  {{ ('its removal, started earlier, is still in progress on ' ~ cassandra_dead_removal.on ~ ': waited for again')
                     if _resume | bool
                     else ('removenode from ' ~ ansible_play_hosts[0] ~ ': its ranges are streamed from the other replicas'
                           ~ ' (hours on a big node)') if _method == 'removenode'
                     else ('removenode force on ' ~ cassandra_dead_force.on | default('')
                           ~ ': finishes the pending removal without waiting for the streams left') if _method == 'removenode_force'
                     else 'assassinate: out of gossip, no streaming' }}
                - >-
                  end state: out of the ring{{ '' if _method == 'removenode' else
                  ('; run a repair afterwards' if _method == 'removenode_force' else '; run a full repair afterwards') }}
          warnings:
            - label: data loss
              text: "{{ 'assassinate: data only this node held is LOST.' if _method == 'assassinate' else '' }}"
            - label: replication
              text: >-
                {{ (['cassandra_decommission_force is true: the removal goes on although too few nodes are left for'
                     ' some keyspaces:'] + _replication_problems) if _replication_problems and cassandra_decommission_force | default(false) | bool else '' }}

    - name: Remove it (removenode, from {{ ansible_play_hosts[0] }})
      community.cassandra.cassandra_removenode:
        host_id: "{{ _dead.host_id }}"
        debug: true  # nodetool's stderr in the result: the reason of a failure
      module_defaults:
        community.cassandra.cassandra_removenode: "{{ _cassandra_service_jmx }}"
      vars:
        _dead: >-
          {{ cassandra_dead_ring.cluster_status.values() | map(attribute='nodes') | flatten
             | selectattr('address', 'equalto', cassandra_dead_node_address) | first }}
      async: "{{ cassandra_decommission_timeout | default(_cassandra_stream_async) }}"
      poll: 0
      register: cassandra_removenode_job
      run_once: true
      when:
        - _method == 'removenode'
        - not _resume | bool
        - not _nothing_to_do | bool

    - name: Start following the removal
      ansible.builtin.set_fact:
        _cassandra_stream_state: {}
      run_once: true
      when:
        - _method == 'removenode'
        - not _nothing_to_do | bool

    # The nodes that take over its ranges stream them from the other replicas
    - name: Follow the removal
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: stream_wait.yml
        apply:
          run_once: true
      vars:
        _cassandra_stream_what: removenode of {{ cassandra_dead_node_address }}
        _cassandra_stream_operations: [Restore replica count]
        _cassandra_stream_from: "{{ ansible_play_hosts }}"
        # none when resuming: done once no removal is left on that node
        _cassandra_stream_job: >-
          {{ {'jid': cassandra_removenode_job.ansible_job_id, 'host': ansible_play_hosts[0]}
             if cassandra_removenode_job.ansible_job_id is defined else {} }}
        _cassandra_stream_removal_on: "{{ cassandra_dead_removal.on if _resume | bool else '' }}"
        _cassandra_stream_advice: >-
          nodetool removenode status and nodetool netstats on the nodes; once the streams are over or stuck for good,
          run this again with -e cassandra_dead_node_method=removenode_force (then a repair).
      run_once: true
      when:
        - _method == 'removenode'
        - not _nothing_to_do | bool

    - name: Finish a stuck removal (removenode force, on the node chosen above)
      ansible.builtin.command: "{{ _cassandra_service_nodetool }} removenode force"
      changed_when: true
      no_log: "{{ cassandra_jmx_password | length > 0 }}"
      when:
        - _method == 'removenode_force'
        - not _nothing_to_do | bool
        - inventory_hostname == cassandra_dead_force.on

    - name: Read the ring after removenode force
      community.cassandra.cassandra_status:
        down: 10000
      module_defaults:
        community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
      register: cassandra_dead_ring_after
      failed_when: cassandra_dead_ring_after.cluster_status is not defined
      when:
        - _method == 'removenode_force'
        - not _nothing_to_do | bool
        - inventory_hostname == cassandra_dead_force.on

    - name: It is out of the ring (removenode_force)
      ansible.builtin.assert:
        that: cassandra_dead_node_address not in _addresses
        fail_msg: "{{ cassandra_dead_node_address }} is still in the ring after removenode force: check nodetool removenode status."
        quiet: true
      vars:
        _addresses: >-
          {{ hostvars[cassandra_dead_force.on].cassandra_dead_ring_after.cluster_status.values() | map(attribute='nodes') | flatten
             | map(attribute='address') | list }}
      run_once: true
      when:
        - _method == 'removenode_force'
        - not _nothing_to_do | bool
        - not ansible_check_mode  # removenode force did not run

    - name: Remove it (assassinate, from {{ ansible_play_hosts[0] }})
      community.cassandra.cassandra_assassinate:
        ip_address: "{{ cassandra_dead_node_address | default('(not set)') }}"
      module_defaults:
        community.cassandra.cassandra_assassinate: "{{ _cassandra_service_jmx }}"
      run_once: true
      when: _method == 'assassinate'

    # After removenode force, the streams of the removal may still run on some nodes (force
    # does not stop them): said, not a failure
    - name: Check the cluster without it
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: cluster_health.yml
        apply:
          run_once: true
      vars:
        cassandra_service_health_report_only: "{{ _method == 'removenode_force' }}"
      run_once: true
      # --check removes nothing: the dead node is still there (removenode_force only reports)
      when: not ansible_check_mode or _method == 'removenode_force'

    - name: Stop on an unhealthy cluster (removenode_force)
      ansible.builtin.fail:
        msg: "{{ ['Cluster not healthy, nothing more is done:'] + _problems }}"
      vars:
        _problems: "{{ cassandra_health_problems | reject('match', 'streams in progress on ') | list }}"
      run_once: true
      when:
        - _method == 'removenode_force'
        - _problems | length > 0
        - not cassandra_service_health_force | bool
        - not ansible_check_mode  # removenode force did not run: the node is still in the ring

    - name: Go on despite the problems (removenode_force, cassandra_service_health_force)
      ansible.builtin.debug:
        msg: "{{ ['WARNING: cassandra_service_health_force is set, going on with an unhealthy cluster:'] + _problems }}"
      vars:
        _problems: "{{ cassandra_health_problems | reject('match', 'streams in progress on ') | list }}"
      run_once: true
      when:
        - _method == 'removenode_force'
        - _problems | length > 0
        - cassandra_service_health_force | bool

    - name: Streams of the forced removal still running
      ansible.builtin.debug:
        msg: >-
          {{ cassandra_health_problems | select('match', 'streams in progress on ') | list
             + ['left from the removal removenode force finished: they end or fail on their own (nodetool netstats).'] }}
      run_once: true
      when:
        - _method == 'removenode_force'
        - cassandra_health_problems | select('match', 'streams in progress on ') | list | length > 0

    - name: Say what is left to do
      ansible.builtin.debug:
        msg: >-
          {{ (cassandra_dead_node_address | default('(not set)') ~ ' was already out of the ring: nothing was done.')
             if _nothing_to_do | bool
             else (cassandra_dead_node_address | default('(not set)') ~ ' is out of the ring. '
                   ~ ('Run a full repair now: ' ~ _method ~ ' did not stream everything.' if _method != 'removenode' else '')) }}
      run_once: true
