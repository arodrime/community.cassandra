---
# Minimal images drop man pages; the JDK postinst then fails on its man1 alternatives
- name: Ensure man1 directory exists (Debian JDK postinst)
  ansible.builtin.file:
    path: /usr/share/man/man1
    state: directory
    mode: "0755"
  when: ansible_facts['os_family'] == 'Debian'

# The Java package, from the repositories (java_package.yml)
- name: Install the Java package
  ansible.builtin.include_tasks: java_package.yml
  when:
    - cassandra_install_java | bool
    - _cassandra_java_home == ''
    - not cassandra_offline | bool

# cassandra_java_set_default false leaves a /usr/bin/java there as it is; a
# missing one, or a link leading nowhere, is still made (nodetool and the
# scripts need a java)
- name: Look for the system java
  ansible.builtin.stat:
    path: /usr/bin/java
    follow: true  # a link leading nowhere: not there
    get_checksum: false
  register: cassandra_java_system_link

# false, /usr/bin/java missing while its alternative leads to a java: that link
# alone is made again (below), the alternative left as it is
- name: Look for the java alternative
  ansible.builtin.stat:
    path: /etc/alternatives/java
    follow: true
    get_checksum: false
  register: cassandra_java_alternative_link
  when: not cassandra_java_system_link.stat.exists

- name: Java from a tarball, or already unpacked (cassandra_java_home)
  ansible.builtin.include_tasks: java_tarball.yml
  when: _cassandra_java_home != ''

# Cassandra and nodetool run the default java: with several JDKs installed
# (e.g. while moving to another Java), it must be this one
- name: Make the Java package's java the default java
  ansible.builtin.include_tasks: java_default.yml
  vars:
    # the package's own java among the alternatives (a temurin or zulu path does not name java-<N>), else one that does
    _path: >-
      {{ cassandra_java_alternatives.stdout_lines | default([])
         | community.cassandra.cassandra_java_alternative(cassandra_java_files.stdout_lines | default([]), cassandra_java_version) }}
  when:
    - cassandra_install_java | bool
    - _cassandra_java_home == ''
    - cassandra_java_set_default | bool or not cassandra_java_system_link.stat.exists
      and not cassandra_java_alternative_link.stat.exists | default(false)

# Missing, or leading nowhere, while its alternative is already the one
# selected: the alternatives module, which reads /etc/alternatives, has
# nothing to change and leaves it so
- name: Link the system java to its alternative
  ansible.builtin.file:
    src: /etc/alternatives/java
    dest: /usr/bin/java
    state: link
    force: true  # over a link leading nowhere; under --check the alternative may not be there yet
  when:
    - not cassandra_java_system_link.stat.exists
    - cassandra_install_java | bool or _cassandra_java_home != ''
