---
# 5.0: storage_compatibility_mode as this node's cassandra.yaml has it (what Cassandra reads at its start):
# cassandra_storage_mode_read.stdout, "" when the file has no such line; rc 3 when the file cannot be read
- name: Read storage_compatibility_mode in its cassandra.yaml
  ansible.builtin.shell: |
    [ -r "$F" ] || exit 3
    sed -n 's/^storage_compatibility_mode:[[:space:]]*//p' "$F" | sed 's/[[:space:]]*#.*$//; s/[[:space:]]*$//' | tail -1
  environment:
    F: "{{ cassandra_conf_dir | regex_replace('(?<=.)/+$', '') }}/cassandra.yaml"
  register: cassandra_storage_mode_read
  changed_when: false
  failed_when: false  # not read: said as such
  check_mode: false  # a read
