# Reads a running cluster into an inventory for the roles, changing nothing
# on the nodes:
#   ansible-playbook -i node1,node2 community.cassandra.import_cluster
# Any reachable nodes will do: the others are found with nodetool status.
# Without -i, the inventory of ansible.cfg: every host there is given (with
# its variables), or the hosts of -e cassandra_hosts=<cluster group> when it
# holds other clusters (--limit is refused: it would leave out the nodes found
# and the controller, which writes the inventory); nodes of two rings stop the
# import.
# One inventory dir for every cluster (ansible.cfg inventory = that dir, the
# playbooks run with -e cassandra_hosts=<cluster group>): the hosts go to
# <cluster group>.yml there, the variables to group_vars/ and host_vars/, side
# by side with the other clusters'; a host or group name another cluster has
# already stops the import.
# Options (-e), with their default:
#   import_cluster_dir: the inventory dir (default inventories; a relative path
#     is from the current dir).
#   import_cluster_report_dir: where report.txt goes (default reports/<cluster
#     group> next to import_cluster_dir: ./reports/<cluster group> for the
#     default).
#   import_cluster_force: false; true imports a cluster whose <cluster group>.yml
#     is there already (a re-import).
#   import_cluster_host_names: hostname (default, the short one as the node
#     reports it), fqdn or ip: the name of each node.
#   import_cluster_set_ansible_host: true; false leaves ansible_host out.
#   import_cluster_vault_password_file, import_cluster_vault_id: none, default
#     (see the passwords below).
#   import_cluster_medusa_path: none (see Medusa below).
#   import_cluster_keep_hand_edits: false (see the hand edits below).
#   import_cluster_allow_unread: false (see the nodes not read below).
#   import_cluster_strict: true; false writes an inventory that fails the
#     self-check without failing the run.
#   import_cluster_debug: false; true shows an error while writing the
#     inventory, hidden otherwise (the variables hold passwords).
# Review a re-import before it writes anything: --check --diff shows the
# changes of each file it would write or remove (secrets.yml hidden), and
# writes nothing:
#   ansible-playbook -i <node>, community.cassandra.import_cluster -e import_cluster_force=true --check --diff
# then the same without --check --diff.
# Each file it writes starts with a "# Written by ...import_cluster for
# <cluster group>" line: a re-import replaces those, removes the ones of this
# cluster it no longer writes (a node gone), and keeps every other file
# (group_vars/all/*.yml, the other clusters', notes). A file from an earlier
# release, whose line names no cluster, is this cluster's only when this
# cluster's hosts file alone names its group or host (else it is kept, and
# listed in the report). A <cluster group>.yml without that line holding this
# cluster's group alone (moved from an earlier layout, or edited by hand) is
# its hosts file: replaced, the old one kept as <file>.<date>~.
# Passwords found in the config go to secrets.yml files next to the other
# variables: encrypted with ansible-vault with the vault password file of
# Ansible (vault_password_file in ansible.cfg, ANSIBLE_VAULT_PASSWORD_FILE; not
# --vault-password-file, which is not used) or
# import_cluster_vault_password_file (and optionally import_cluster_vault_id),
# else written 0600 for you to encrypt.
# JMX access: the cassandra_service variables (cassandra_jmx_port,
# cassandra_jmx_username, cassandra_jmx_password_file...), written to the
# inventory too.
# Root on the nodes (sudo; nodetool reads the JMX password file, the service
# account's): the playbook asks for it itself, no -b needed. None on the
# controller: the files are written as the user running Ansible.
# Each node is named by import_cluster_host_names, with ansible_host set to its
# address in the ring; a node without facts keeps the name it was given, or
# its address.
# The nodes found in the ring are reached as the given node is: by the name it
# knows them by (getent hosts there; short, or the fqdn when the given name has
# a domain), with its connection variables (ansible_user, port, key, ssh args,
# become...), at their ring address when the given node has an ansible_host;
# one not reached is named by its address, and listed as not read.
# The OS tuning found on the nodes (sysctl, limits, THP, disks, tuned, swap,
# time sync, firewall) is listed in the report, and what a variable covers is
# carried into the inventory for the nodes added later.
# Medusa is looked for at import_cluster_medusa_path (its virtualenv or its
# medusa script, a full path on the nodes), else in the PATH, else in the usual
# places, else in the PATH of a login shell of cassandra, then of root, and
# last in any virtualenv under /opt.
# A host marked cassandra_node_state: absent (an inventory given back) is not read.
# Hand edits no variable covers fail the self-check:
# import_cluster_keep_hand_edits=true leaves those files as they are on their
# node (cassandra_config_keep_files) instead.
# A ring node it could not read (down, unreachable, nodetool not found, its
# running Java removed by an update) fails the import, as its settings are
# unknown: import_cluster_allow_unread=true accepts it.
- name: Find the cluster from the given nodes
  hosts: "{{ query('community.cassandra.cassandra_nodes', group=cassandra_hosts | default('all', true)) }}"
  gather_facts: true
  gather_subset: [network]
  become: true  # nodetool reads the JMX password file (cassandra's, 0400)
  tasks:
    - name: Check the options
      ansible.builtin.assert:
        that: import_cluster_host_names | default('hostname') in ['hostname', 'fqdn', 'ip']
        fail_msg: "import_cluster_host_names must be hostname, fqdn or ip, not {{ import_cluster_host_names | default('') }}"
        quiet: true
      run_once: true

    # --limit would leave out the nodes found in the ring, and localhost, whose play writes the inventory
    - name: Stop on --limit
      ansible.builtin.assert:
        that: ansible_limit is not defined
        fail_msg: >-
          --limit would leave out the nodes found in the ring and localhost, which writes the inventory: give the
          nodes with -i <node>, or, with the inventory, -e cassandra_hosts=<cluster group>. Nothing was written.
        quiet: true
      run_once: true

    - name: Load the cassandra_service defaults (JMX access)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Remember the given nodes (add_host extends the play)
      ansible.builtin.set_fact:
        import_cluster_given: "{{ ansible_play_hosts_all }}"  # unreachable ones too, for the errors
      run_once: true

    - name: Read the ring
      community.cassandra.cassandra_status:
        down: 10000  # read it whatever the state of the nodes
      module_defaults:
        community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
      register: import_cluster_ring
      failed_when: false

    # without -i <node>, (the inventory of ansible.cfg) every host there is given: one cluster's only
    - name: Stop on nodes of several clusters
      ansible.builtin.assert:
        that: _apart | length == 0
        fail_msg: >-
          {{ _apart | join(', ') }} not in the ring of {{ _rings | list | first }}: the given nodes are of several
          clusters. Give a node of one cluster (-i <node>,), or run with the inventory and -e cassandra_hosts=<its
          cluster group>. Nothing was written.
        quiet: true
      run_once: true
      vars:
        # each given node that answered: the addresses of its ring
        _rings: >-
          {%- set out = {} -%}
          {%- for h in import_cluster_given if hostvars[h].import_cluster_ring.cluster_status | default({}) -%}
          {%-   set addrs = [] -%}
          {%-   for dc, info in hostvars[h].import_cluster_ring.cluster_status.items() -%}
          {%-     set _ = addrs.extend(info.nodes | map(attribute='address')) -%}
          {%-   endfor -%}
          {%-   set _ = out.update({h: addrs}) -%}
          {%- endfor -%}
          {{ out }}
        _apart: >-
          {%- set first = _rings[_rings | list | first] if _rings else [] -%}
          {%- set out = [] -%}
          {%- for h, addrs in _rings.items() if not addrs | intersect(first) -%}{%- set _ = out.append(h) -%}{%- endfor -%}
          {{ out }}

    - name: List the nodes of the ring the inventory does not have yet
      ansible.builtin.set_fact:
        import_cluster_from: "{{ _from }}"
        import_cluster_new: "{{ hostvars[_from].import_cluster_ring.cluster_status | community.cassandra.cassandra_ring_nodes
                                | map(attribute='address') | reject('in', _known) | list if _from else [] }}"
      run_once: true
      vars:
        # the first given node that read the ring
        _from: >-
          {%- set out = [] -%}
          {%- for h in import_cluster_given if hostvars[h].import_cluster_ring.cluster_status | default({}) -%}
          {%-   set _ = out.append(h) -%}
          {%- endfor -%}
          {{ out | first | default('') }}
        # without iproute a host gathers no interface facts: its default and connection addresses still count
        _known: >-
          {%- set out = [] -%}
          {%- for h in import_cluster_given -%}
          {%-   set _ = out.extend(hostvars[h].ansible_facts.all_ipv4_addresses | default([])) -%}
          {%-   set _ = out.append(hostvars[h].ansible_facts.default_ipv4.address | default('')) -%}
          {%-   set _ = out.append(hostvars[h].ansible_host | default('')) -%}
          {%- endfor -%}
          {{ out | select | unique | list }}

    # reached as the given node is: by the name it knows them by (ssh config and known_hosts entries match
    # names), with its connection variables; at their ring address only when the given node has one too
    - name: Find the names of the nodes found in the ring, as the given node knows them
      ansible.builtin.command:
        argv: "{{ ['getent', 'hosts'] + import_cluster_new }}"
      delegate_to: "{{ import_cluster_from }}"
      run_once: true
      register: import_cluster_peer_names
      changed_when: false
      failed_when: false  # 2: some not found
      check_mode: false
      when: import_cluster_new | length > 0

    - name: Add the nodes the inventory does not have yet
      ansible.builtin.add_host:
        name: "{{ _name }}"
        ansible_host: "{{ item if _name == item or _by_address else omit }}"
        import_cluster_address: "{{ item }}"
        groups: [import_cluster_found]
        ansible_connection: "{{ _given.ansible_connection | default(omit) }}"
        ansible_user: "{{ _given.ansible_user | default(omit) }}"
        ansible_port: "{{ _given.ansible_port | default(omit) }}"
        ansible_password: "{{ _given.ansible_password | default(omit) }}"
        ansible_ssh_pass: "{{ _given.ansible_ssh_pass | default(omit) }}"
        ansible_private_key_file: "{{ _given.ansible_private_key_file | default(omit) }}"
        ansible_ssh_private_key_file: "{{ _given.ansible_ssh_private_key_file | default(omit) }}"
        ansible_ssh_common_args: "{{ _given.ansible_ssh_common_args | default(omit) }}"
        ansible_ssh_extra_args: "{{ _given.ansible_ssh_extra_args | default(omit) }}"
        ansible_become: "{{ _given.ansible_become | default(omit) }}"
        ansible_become_method: "{{ _given.ansible_become_method | default(omit) }}"
        ansible_become_user: "{{ _given.ansible_become_user | default(omit) }}"
        ansible_become_password: "{{ _given.ansible_become_password | default(omit) }}"
        ansible_become_pass: "{{ _given.ansible_become_pass | default(omit) }}"
        ansible_python_interpreter: "{{ _given.ansible_python_interpreter | default(omit) }}"
      loop: "{{ import_cluster_new }}"
      run_once: true
      no_log: true  # the given node's passwords, if any
      vars:
        _given: "{{ hostvars[import_cluster_from] }}"
        _names: >-
          {{ import_cluster_peer_names.stdout | default('')
             | community.cassandra.cassandra_ring_names(import_cluster_new, import_cluster_from) }}
        # a name the inventory has already (another host, maybe another cluster's): the address instead
        _name: "{{ item if _names[item] in groups['all'] else _names[item] }}"
        # the given node reached at an address of its own (ansible_host): the found ones at theirs
        _by_address: "{{ _given.ansible_host | default(import_cluster_from) != import_cluster_from }}"

    - name: Stop if no node answered
      ansible.builtin.assert:
        that: import_cluster_given | map('extract', hostvars) | map(attribute='import_cluster_ring.cluster_status', default={}) | select | list | length > 0
        fail_msg: >-
          {{ ['nodetool status failed on every given node. Is Cassandra running, and the JMX access right'
              ~ ' (cassandra_jmx_port, cassandra_jmx_username, cassandra_jmx_password_file or _password)?'] + _errors }}
      vars:
        # "Read the ring" shows ok whatever happened: each node's error
        _errors: >-
          {%- set out = [] -%}
          {%- for h in import_cluster_given -%}
          {%-   set r = hostvars[h].import_cluster_ring | default({}) -%}
          {%-   set _ = out.append(h ~ ': ' ~ ('unreachable' if r == {}
                                              else (r.msg | default('no result') ~ ' ' ~ (r.stderr | default('')).splitlines() | first | default(''))
                                                   | trim | truncate(400))) -%}
          {%- endfor -%}
          {{ out }}
      run_once: true


# the given nodes and the ones found in the ring (not the inventory's other hosts)
- name: Read every node
  hosts: >-
    {{ (groups['all'] | map('extract', hostvars) | selectattr('import_cluster_given', 'defined')
        | map(attribute='import_cluster_given') | first | default([])) + groups['import_cluster_found'] | default([]) }}
  gather_facts: false
  ignore_unreachable: true
  become: true
  vars:
    _files:
      - cassandra.yaml
      - cassandra-env.sh
      - jvm-server.options
      - jvm8-server.options
      - jvm11-server.options
      - jvm17-server.options
      - cassandra-rackdc.properties
      - logback.xml
  tasks:
    - name: Load the cassandra_service defaults (JMX access)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Gather facts
      ansible.builtin.setup:
        gather_subset: [network, distribution]

    - name: Read the installed packages
      ansible.builtin.package_facts:

    # No module reads a running JVM: its command line and its java binary
    - name: Read the running Cassandra (conf dir, Cassandra and Java versions)
      ansible.builtin.shell: |
        # the JVM (its command line is too long for pgrep -f, and a wrapper script may match)
        pid=
        for p in $(pgrep -x java); do
          tr '\0' '\n' < /proc/$p/cmdline | grep -qx org.apache.cassandra.service.CassandraDaemon && { pid=$p; break; }
        done
        [ -n "$pid" ] || exit 3
        cfg=$(tr '\0' '\n' < /proc/$pid/cmdline | sed -n 's#^-Dcassandra.config=\(file://\)\?##p' | head -1)
        echo "config=$cfg"
        echo "version=$({{ _cassandra_service_nodetool }} version | sed -n 's/^ReleaseVersion: //p')"
        echo "logdir=$(tr '\0' '\n' < /proc/$pid/cmdline | sed -n 's#^-Dcassandra.logdir=##p' | head -1)"
        echo "storagedir=$(tr '\0' '\n' < /proc/$pid/cmdline | sed -n 's#^-Dcassandra.storagedir=##p' | head -1)"
        # the account it runs as: its effective user and group (a name, else the number)
        uid=$(awk '/^Uid:/ {print $3}' /proc/$pid/status 2>/dev/null)
        gid=$(awk '/^Gid:/ {print $3}' /proc/$pid/status 2>/dev/null)
        [ -n "$uid" ] && echo "run_user=$(getent passwd "$uid" | cut -d: -f1 | grep . || echo "$uid")"
        [ -n "$gid" ] && echo "run_group=$(getent group "$gid" | cut -d: -f1 | grep . || echo "$gid")"
        # how it is started today: the unit (or the init script systemd wraps), its restart policy, at boot or not
        for p in FragmentPath SourcePath Restart UnitFileState Environment EnvironmentFiles; do
          echo "unit_$p=$(systemctl show cassandra -p $p --value 2>/dev/null)"
        done
        # the unit of an init script is "generated": is-enabled asks the init system
        echo "unit_IsEnabled=$(systemctl is-enabled cassandra 2>/dev/null)"
        # (a java replaced since it started, e.g. a JDK update: "<path> (deleted)", still run from /proc unless its
        # directory went too)
        bin=$(readlink /proc/$pid/exe | sed 's/ (deleted)$//')
        echo "java=$(/proc/$pid/exe -XshowSettings:properties -version 2>&1 | sed -n 's/.*java.specification.version = //p')"
        echo "javabin=$bin"
        # the package the running java comes from, empty when none (a tarball)
        pkg=$(rpm -qf --qf '%{NAME}\n' "$bin" 2>/dev/null) && pkg=$(echo "$pkg" | head -1) || pkg=$(dpkg -S "$bin" 2>/dev/null | cut -d: -f1) || pkg=
        echo "javapkg=$pkg"
        echo "sysjava=$([ -e /usr/bin/java ] && readlink -f /usr/bin/java)"
        # where the config really is (/etc/cassandra/conf of the RPM is an alternatives link)
        case $cfg in /*) d=${cfg%/*} ;; *) d=/etc/cassandra/conf ;; esac
        echo "conftarget=$(readlink -f "$d" 2>/dev/null)"
        # the Cassandra packages held (Debian, Ubuntu)
        command -v dpkg >/dev/null 2>&1 && echo "held=$(dpkg --get-selections 'cassandra*' 2>/dev/null | awk '$2 == "hold" {print $1}' | tr '\n' ' ')"
        # dsbulk as cassandra_install puts it: /usr/share/dsbulk-<version> with its marker, linked from
        # /usr/share/dsbulk and /usr/bin/dsbulk
        # (the links as the role writes them: else it would rewrite them)
        dsb=$(readlink /usr/share/dsbulk 2>/dev/null)
        [ "$(readlink /usr/bin/dsbulk 2>/dev/null)" = /usr/share/dsbulk/bin/dsbulk ] && [ -x "$dsb/bin/dsbulk" ] \
          && [ -f "$dsb/.cassandra_install" ] && echo "dsbulk=$dsb/bin/dsbulk"
        # what the roles set up has their mark; the rest was set up another way, and is left as it is
        grep -qs 'Managed by Ansible (community.cassandra.cassandra_service)' "$(systemctl show cassandra -p FragmentPath --value 2>/dev/null)" \
          && echo "own_unit=yes"
        # (the limits file's mark only: a sysctl.d/60-cassandra.conf may be the admin's, the sysctl module writes no mark)
        grep -qs 'Managed by Ansible (community.cassandra.cassandra_linux)' /etc/security/limits.d/cassandra.conf \
          && echo "own_os=yes"
        grep -qs 'Managed by Ansible (cassandra_install)' /usr/local/bin/cqlsh /etc/profile.d/cqlsh.sh && echo "own_cqlsh=yes"
        rf=
        for f in /etc/yum.repos.d/cassandra-*.repo /etc/apt/sources.list.d/cassandra-*.sources /etc/apt/sources.list.d/cassandra-*.list; do
          [ -e "$f" ] && rf="$rf $f"
        done
        # (each one checked below: the role takes over only files it would write as they are)
        [ -n "$rf" ] && echo "own_repo=yes" && echo "repo_files=${rf# }"
        # a configured repository offers the cassandra package (else it was installed from a file: new nodes
        # need cassandra_install_method packages); apt: a source besides the status of the installed package
        if command -v apt-cache >/dev/null 2>&1; then
          # (read from the local lists: none, nothing to conclude)
          ls /var/lib/apt/lists/*_Packages* >/dev/null 2>&1 && echo "pkg_query=ok"
          apt-cache policy cassandra 2>/dev/null | grep -E '^ +[0-9]+ ' | grep -vq '/var/lib/dpkg/status' && echo "pkg_repo=yes"
        else
          # a repository skipped (unreachable), other than a cassandra-* one (e.g. a plain directory declared as
          # one): nothing to conclude
          res=$(timeout 180 dnf -q repoquery --setopt=skip_if_unavailable=True --qf 'PKG %{name}' cassandra 2>&1); rc=$?
          bad=$(echo "$res" | sed -n "s/.*repo '\([^']*\)'.*/\1/p; s/.*Ignoring repositories: //p" | tr ', ' '\n\n' | grep . | grep -v '^cassandra-')
          [ $rc = 0 ] && [ -z "$bad" ] && echo "pkg_query=ok"
          echo "$res" | grep -q '^PKG ' && echo "pkg_repo=yes"
        fi
        exit 0
      register: import_cluster_running
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Work out the series and the conf dir
      ansible.builtin.set_fact:
        import_cluster_version: "{{ _kv.version }}"
        import_cluster_series: "{{ _kv.version.split('.')[:2] | join('') ~ 'x' }}"
        import_cluster_java: "{{ _kv.java.split('.')[1] if _kv.java.startswith('1.') else _kv.java }}"
        # not from a package: the directory above bin/java
        import_cluster_java_home: "{{ _kv.javabin | dirname | dirname if _kv.javapkg | default('') == '' else '' }}"
        import_cluster_system_java: "{{ _kv.sysjava | default('') }}"
        import_cluster_java_bin: "{{ _kv.javabin | default('') }}"
        import_cluster_held: "{{ _kv.held | default('') | split }}"
        import_cluster_dsbulk: "{{ _kv.dsbulk | default('') }}"
        import_cluster_repo_files: "{{ _kv.repo_files | default('') | split }}"
        # the package query answered (dnf repoquery, apt lists): else an air-gapped host, or repositories down
        import_cluster_repos_answer: "{{ _kv.pkg_query is defined }}"
        import_cluster_java_package: "{{ _kv.javapkg | default('') }}"
        import_cluster_package: "{{ (ansible_facts.packages['cassandra'] | default([{}]) | first).version | default('') }}"
        # installed, but no configured repository offers it (the query ran): from a package file
        import_cluster_package_from_file: >-
          {{ 'cassandra' in ansible_facts.packages and _kv.pkg_query is defined and _kv.pkg_repo is not defined }}
        import_cluster_conf_dir: >-
          {{ _kv.config | dirname if _kv.config is match('/')
             else ('/etc/cassandra/conf' if ansible_facts['os_family'] == 'RedHat' else '/etc/cassandra') }}
        import_cluster_log_dir: "{{ _kv.logdir | default('') }}"
        import_cluster_storage_dir: "{{ _kv.storagedir | default('') }}"
        import_cluster_conf_target: "{{ _kv.conftarget | default('') }}"
        import_cluster_account:
          user: "{{ _kv.run_user | default('') }}"
          group: "{{ _kv.run_group | default('') }}"
        # set up another way (no mark of the roles): the roles leave it as it is on this node
        import_cluster_keep: >-
          {{ {} | combine({'cassandra_repository_manage': false} if _kv.own_repo is not defined else {},
                          {'cassandra_linux_manage': false} if _kv.own_os is not defined else {},
                          {'cassandra_cqlsh_python_manage': false} if _kv.own_cqlsh is not defined else {},
                          {'cassandra_service_unit_manage': false} if _kv.own_unit is not defined else {}) }}
        import_cluster_unit:
          file: "{{ _kv.unit_SourcePath | default('') or _kv.unit_FragmentPath | default('') }}"
          restart: "{{ _kv.unit_Restart | default('') }}"
          boot: >-
            {{ _kv.unit_IsEnabled | default('') if _kv.unit_UnitFileState | default('') in ['', 'generated']
               else _kv.unit_UnitFileState }}
          # everything else the unit sets (e.g. LOCAL_JMX=no), and the files it reads variables from
          env: "{{ _kv.unit_Environment | default('') | community.cassandra.cassandra_unit_environment }}"
          env_files: "{{ _kv.unit_EnvironmentFiles | default('') }}"
      vars:
        _kv: "{{ dict(import_cluster_running.stdout_lines | map('split', '=', 1)) }}"
      when: import_cluster_running.rc | default(1) == 0

    # config files written since Cassandra started: it may not run what they say (a restart pending, or not)
    - name: Find when the running Cassandra started
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: jvm_started.yml
      when: import_cluster_series is defined

    - name: Read when its config files were written
      ansible.builtin.find:
        paths: "{{ import_cluster_conf_dir }}"
        patterns: "{{ _cassandra_service_config_files }}"
        file_type: file
      register: import_cluster_conf_files
      when:
        - import_cluster_series is defined
        - cassandra_jvm.start is defined

    - name: Note the ones written since it started
      ansible.builtin.set_fact:
        import_cluster_newer_files: >-
          {{ import_cluster_conf_files.files | selectattr('ctime', '>', cassandra_jvm.start | float)
             | map(attribute='path') | map('basename') | sort }}
      when: import_cluster_conf_files.files is defined

    - name: Read the config files
      ansible.builtin.slurp:
        path: "{{ import_cluster_conf_dir }}/{{ item }}"
      loop: "{{ _files }}"
      register: import_cluster_slurp
      failed_when: false
      no_log: true  # keystore passwords
      when: import_cluster_series is defined and import_cluster_series in ['40x', '41x', '50x']

    # remote JMX users, where cassandra_config writes them
    - name: Read the JMX users
      ansible.builtin.slurp:
        path: "/etc/cassandra/{{ item }}"
      loop: [jmxremote.password, jmxremote.access]
      register: import_cluster_jmx_slurp
      failed_when: false
      no_log: true
      when: import_cluster_series is defined and import_cluster_series in ['40x', '41x', '50x']

    # the Cassandra repository files: cassandra_repository takes over only the ones it would write as they are
    - name: Read the Cassandra repository files
      ansible.builtin.slurp:
        path: "{{ item }}"
      loop: "{{ import_cluster_repo_files + (['/etc/apt/auth.conf.d/cassandra.conf'] if ansible_facts['os_family'] == 'Debian' else []) }}"
      register: import_cluster_repo_slurp
      failed_when: false  # no credentials file
      no_log: true  # credentials
      when: import_cluster_repo_files | default([]) | length > 0

    - name: Read their mode and the signing keys they name
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha1
        get_mime: false
        get_attributes: false
      loop: >-
        {{ (import_cluster_repo_slurp.results | default([]) | selectattr('content', 'defined') | map(attribute='item') | list
            + import_cluster_repo_slurp.results | default([]) | selectattr('content', 'defined') | map(attribute='content')
              | map('b64decode') | map('regex_findall', '(?m)^(?:gpgkey\s*=\s*file://|Signed-By:\s*)(\S+)') | flatten)
           | unique }}
      register: import_cluster_repo_stat
      no_log: true  # the checksum of the credentials file
      when: import_cluster_repo_files | default([]) | length > 0

    - name: Tell whether cassandra_repository would write them as they are
      ansible.builtin.set_fact:
        import_cluster_repo: >-
          {{ _files | community.cassandra.cassandra_repository_import(
               _stats, import_cluster_series, ansible_facts['os_family'],
               lookup('ansible.builtin.file', playbook_dir ~ '/../roles/cassandra_repository/files/KEYS', rstrip=false) | hash('sha1'),
               ansible_facts['packages'] | default({}), import_cluster_package_from_file | bool,
               (lookup('ansible.builtin.file', playbook_dir ~ '/../roles/cassandra_repository/defaults/main.yml') | from_yaml).debian_packages) }}
      vars:
        _read: "{{ import_cluster_repo_slurp.results | default([]) | selectattr('content', 'defined') | list }}"
        _files: "{{ dict(_read | map(attribute='item') | zip(_read | map(attribute='content') | map('b64decode'))) }}"
        _stats: >-
          {{ dict(import_cluster_repo_stat.results | default([]) | selectattr('stat.exists', 'defined') | selectattr('stat.exists')
                  | map(attribute='item')
                  | zip(import_cluster_repo_stat.results | default([]) | selectattr('stat.exists', 'defined') | selectattr('stat.exists')
                        | map(attribute='stat'))) }}
      no_log: "{{ not import_cluster_debug | default(false) | bool }}"
      when:
        - import_cluster_series is defined
        - import_cluster_repo_files | default([]) | length > 0

    # the unit cassandra_service wrote (its mark): the self-check compares it with the one it would write
    - name: Read the unit
      ansible.builtin.slurp:
        path: "{{ import_cluster_unit.file }}"
      register: import_cluster_unit_slurp
      failed_when: false
      no_log: true  # its Environment may hold a password
      when:
        - import_cluster_series is defined and import_cluster_series in ['40x', '41x', '50x']
        - "'cassandra_service_unit_manage' not in import_cluster_keep"
        - import_cluster_unit.file != ''

    # its Java removed since it started (a JDK update took its directory): what it runs is unknown
    - name: Note a running Java that cannot be read
      ansible.builtin.set_fact:
        import_cluster_error: >-
          its Java ({{ import_cluster_java_bin or '?' }}) cannot be run any more (removed since Cassandra started,
          e.g. by a JDK update): restart Cassandra (rolling_restart), then import again
      when:
        - import_cluster_series is defined
        - import_cluster_java | default('') == ''

    # no_log hides the error too: the rescue says what failed, without the values
    # a skipped loop registers results too: the series, not them, says it was read
    - name: Read this node's config
      when: import_cluster_series is defined and import_cluster_series in ['40x', '41x', '50x'] and import_cluster_error is not defined
      block:
        # without it the role defaults would be imported (cluster name, seeds...)
        - name: Check cassandra.yaml was read
          ansible.builtin.assert:
            that: _yaml.content is defined
            fail_msg: "{{ _yaml.msg | default('cannot read ' ~ import_cluster_conf_dir ~ '/cassandra.yaml') }}"
            quiet: true
          vars:
            _yaml: "{{ import_cluster_slurp.results | selectattr('item', 'equalto', 'cassandra.yaml') | first | default({}) }}"

        - name: Turn them into cassandra_config variables
          no_log: "{{ not import_cluster_debug | default(false) | bool }}"
          ansible.builtin.set_fact:
            import_cluster_config: >-
              {{ _live | community.cassandra.cassandra_config_import(import_cluster_series, ansible_facts,
                                                                     import_cluster_conf_target | default(''),
                                                                     import_cluster_storage_dir | default('')) }}
          vars:
            _slurped: "{{ import_cluster_slurp.results + import_cluster_jmx_slurp.results | default([]) }}"
            _live: >-
              {{ dict(_slurped | selectattr('content', 'defined') | map(attribute='item')
                      | zip(_slurped | selectattr('content', 'defined') | map(attribute='content') | map('b64decode'))) }}
      rescue:
        # for the report: the node is listed as not read, with this reason
        - name: Keep why for the report
          ansible.builtin.set_fact:
            import_cluster_error: >-
              "{{ ansible_failed_task.name | default('?') }}" failed{{ (': ' ~ _why) if _why else '' }}
          vars:
            _why: >-
              {{ ansible_failed_result.msg | default('?') if ansible_failed_task.name | default('') == 'Check cassandra.yaml was read'
                 else ansible_failed_result | default({}) | community.cassandra.cassandra_import_error }}

        - name: Say what failed on this node
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: {{ import_cluster_error }}{{ '' if ansible_failed_task.name | default('') == 'Check cassandra.yaml was read'
              else '. Its error is above.' if import_cluster_debug | default(false) | bool
              else '. The rest of the error is hidden (the config holds passwords):'
                   ~ ' rerun with -e import_cluster_debug=true to see it (it may show passwords).' }}

    # owner, group and mode of what cassandra_config writes or creates, read only
    - name: Read the owner and mode of the config files and directories
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: true
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop: >-
        {{ _files | map('regex_replace', '^', import_cluster_conf_dir ~ '/') | list
           + ['/etc/cassandra/jmxremote.password', '/etc/cassandra/jmxremote.access'] + _dirs }}
      register: import_cluster_perm_stat
      failed_when: false  # not read (e.g. a data dir on NFS root can't read): left out
      when: import_cluster_config is defined
      vars:
        _cfg: "{{ import_cluster_config.vars | default({}) }}"
        _dirs: >-
          {{ (_cfg.cassandra_data_file_directories | default([_cfg.cassandra_data_dir | default('/var/lib/cassandra/data')]))
             + [_cfg.cassandra_commitlog_dir | default('/var/lib/cassandra/commitlog'),
                _cfg.cassandra_hints_dir | default('/var/lib/cassandra/hints'),
                _cfg.cassandra_saved_caches_dir | default('/var/lib/cassandra/saved_caches'),
                import_cluster_log_dir | default('', true) or _cfg.cassandra_log_dir | default('/var/log/cassandra')] }}

    - name: Turn them into variables
      ansible.builtin.set_fact:
        import_cluster_perms: >-
          {{ _file_stats | community.cassandra.cassandra_permissions_import(import_cluster_account, import_cluster_series,
                                                                            _dir_stats, 'cassandra_jmx_users' in import_cluster_config.vars) }}
      vars:
        # the files by their name, then the dirs by their path (the loop above)
        _names: "{{ _files + ['jmxremote.password', 'jmxremote.access'] }}"
        _paths: "{{ import_cluster_perm_stat.results | map(attribute='item') | list }}"
        _stats: "{{ import_cluster_perm_stat.results | map(attribute='stat', default={}) | list }}"
        _file_stats: "{{ dict(_names | zip(_stats[:_names | length])) }}"
        _dir_stats: "{{ dict(_paths[_names | length:] | zip(_stats[_names | length:])) }}"
      when: import_cluster_config is defined

    # Cassandra Medusa (backups): its install and /etc/medusa/medusa.ini
    - name: Look for Medusa
      ansible.builtin.shell: |
        ini=/etc/medusa/medusa.ini
        [ -f "$ini" ] && echo "ini=yes" && stat --printf 'ini_owner=%U\nini_group=%G\nini_mode=%a\n' "$ini"
        trusted() { case $(stat -c %U "$1" 2>/dev/null) in root|cassandra) ;; *) return 1 ;; esac; }
        # the file cassandra_medusa_profile_d writes
        [ -f /etc/profile.d/cassandra-medusa.sh ] && echo "profile_d=yes"
        # import_cluster_medusa_path: the medusa script, its virtualenv or the bin dir of it
        hint=$IMPORT_CLUSTER_MEDUSA_PATH
        if [ -d "$hint" ]; then
          if [ -f "$hint/medusa" ]; then hint=$hint/medusa; else hint=$hint/bin/medusa; fi
        fi
        if [ -n "$hint" ] && [ ! -x "$hint" ]; then
          echo "hint_missing=$(printf %s "$IMPORT_CLUSTER_MEDUSA_PATH" | tr '\n' ' ')"
          hint=
        fi
        # the PATH of sudo may lack /usr/local/bin (RHEL)
        bin=$(PATH=$PATH:/usr/local/bin command -v medusa 2>/dev/null)
        # else the usual places
        fixed=
        for c in /opt/cassandra-medusa/bin/medusa /opt/medusa/bin/medusa /usr/share/cassandra-medusa/bin/medusa; do
          [ -x "$c" ] && { fixed=$c; break; }
        done
        # else the medusa a login shell of cassandra or root finds (a profile may put a virtualenv in the
        # PATH): bash run as that user with a clean environment, login then interactive (~/.bashrc), without
        # a terminal (setsid: an interactive bash would stop on the one of the ssh session) nor history, and
        # stopped after 10s. Its answer goes to a file: a process a profile starts in a session of its own
        # outlives the timeout, and would keep a pipe open.
        as_user() {
          r=$(PATH=$PATH:/usr/sbin:/sbin command -v runuser) || return 0
          "$r" -u "$1" -- setsid timeout -k 2 10 env -i HOME="$(getent passwd "$1" | cut -d: -f6)" USER="$1" \
            LOGNAME="$1" SHELL=/bin/bash PATH=/usr/bin:/bin HISTFILE=/dev/null \
            /bin/bash "$2" 'command -v medusa' </dev/null 2>/dev/null
        }
        login= lbin=
        if [ -z "$hint$bin$fixed" ] && out=$(mktemp); then
          trap 'rm -f "$out"' EXIT
          for u in cassandra root; do
            for o in -lic -ic; do
              as_user "$u" "$o" >"$out"
              # the last line: a profile may print something first
              lbin=$(tail -n 1 "$out")
              case $lbin in /*) [ -x "$lbin" ] && login=$u && break 2 ;; esac
              lbin=
            done
          done
        fi
        real=
        # last, any virtualenv under /opt
        for c in "$hint" "$bin" "$fixed" "$lbin" /opt/*/bin/medusa; do
          [ -n "$c" ] && [ -x "$c" ] && { real=$(readlink -f "$c"); break; }
        done
        [ -n "$real" ] || exit 0
        echo "bin=$real"
        # the Python of the script (a virtualenv's python is a link: not resolved)
        set -- $(sed -n '1s/^#! *//p' "$real")
        py=${1:-}; [ "${py##*/}" = env ] && py=${2:-}
        # pip's sh launcher for a long Python path: '''exec' /path/python "$0" "$@" (quoted with a space)
        if [ "${py##*/}" = sh ]; then
          py=$(sed -n "2s/^'''exec' \"\([^\"]*\)\".*/\1/p" "$real")
          [ -n "$py" ] || py=$(sed -n "2s/^'''exec' \([^ ]*\) .*/\1/p" "$real")
        fi
        # its virtualenv: the one it is in, else the one of its Python (a full path only)
        venv=$(dirname "$(dirname "$real")")
        if [ ! -f "$venv/pyvenv.cfg" ]; then
          case $py in /*) venv=$(dirname "$(dirname "$py")") ;; *) venv= ;; esac
        fi
        if [ -n "$venv" ] && [ -f "$venv/pyvenv.cfg" ]; then
          echo "venv=$venv"
          py=$venv/bin/python
          [ -L "$bin" ] && [ "$(readlink -f "$bin")" = "$(readlink -f "$venv/bin/medusa")" ] && echo "link_dir=$(dirname "$bin")"
          # in the PATH only by a login profile: reported, unless by the file of the role
          [ -n "$login" ] && ! grep -qsF "$venv/bin" /etc/profile.d/cassandra-medusa.sh && echo "login=$login"
        else
          echo "python=$py"
        fi
        # its version, from its Python: only a script and a Python owned by root or cassandra, run as cassandra
        # (as root only when root owns both and there is no cassandra user)
        as_cassandra() {
          r=$(PATH=$PATH:/usr/sbin:/sbin command -v runuser)
          if getent passwd cassandra >/dev/null; then
            [ -z "$r" ] || "$r" -u cassandra -- setsid timeout -k 2 30 env -i PATH=/usr/bin:/bin "$@" </dev/null
          elif [ "$(stat -c %U "$real" "$(readlink -f "$py")" | sort -u)" = root ]; then
            timeout -k 2 30 "$@" </dev/null
          fi
        }
        if trusted "$real" && trusted "$(readlink -f "$py")"; then
          v=$(as_cassandra "$py" -c "from importlib.metadata import version; print(version('cassandra-medusa'))" 2>/dev/null \
              | tail -n 1)
          echo "version=$v"
          [ -n "$v" ] || echo "version_unread=yes"
        else
          echo "untrusted=yes"
        fi
        pkg=$(rpm -qf --qf '%{NAME}\n' "$real" 2>/dev/null) && pkg=$(echo "$pkg" | head -1) || pkg=$(dpkg -S "$real" 2>/dev/null | cut -d: -f1) || pkg=
        echo "package=$pkg"
      environment:
        IMPORT_CLUSTER_MEDUSA_PATH: "{{ import_cluster_medusa_path | default('') }}"
      register: import_cluster_medusa_found
      changed_when: false
      failed_when: false
      check_mode: false
      when: import_cluster_config is defined

    # no_log: medusa.ini and the S3 credentials file hold secrets
    - name: Read the Medusa config
      when: _found.ini | default('') == 'yes'
      vars:
        _found: "{{ dict(import_cluster_medusa_found.stdout_lines | default([]) | map('split', '=', 1)) }}"
      block:
        - name: Read medusa.ini
          ansible.builtin.slurp:
            path: /etc/medusa/medusa.ini
          register: import_cluster_medusa_ini
          no_log: true

        - name: Read its S3 credentials file
          ansible.builtin.slurp:
            path: "{{ _key_file }}"
          register: import_cluster_medusa_key_file
          failed_when: false
          no_log: true
          when: _key_file != ''
          vars:
            _key_file: >-
              {{ (import_cluster_medusa_ini.content | b64decode | community.cassandra.cassandra_medusa_ini).storage.key_file
                 | default('') }}

        - name: Read its owner and mode
          ansible.builtin.stat:
            path: "{{ import_cluster_medusa_key_file.source }}"
          register: import_cluster_medusa_key_stat
          when: import_cluster_medusa_key_file.content is defined

        - name: Turn them into cassandra_medusa variables
          ansible.builtin.set_fact:
            import_cluster_medusa: >-
              {{ import_cluster_medusa_ini.content | b64decode | community.cassandra.cassandra_medusa_import(
                   import_cluster_medusa_key_file.content | default('') | b64decode,
                   _found | combine({'key_owner': _key.pw_name | default(''), 'key_group': _key.gr_name | default(''),
                                     'key_mode': _key.mode | default(''),
                                     'account_user': import_cluster_account.user | default(''),
                                     'account_group': import_cluster_account.group | default('')})) }}
          vars:
            _key: "{{ import_cluster_medusa_key_stat.stat | default({}) }}"
          no_log: "{{ not import_cluster_debug | default(false) | bool }}"
      rescue:
        - name: Keep why for the report
          ansible.builtin.set_fact:
            import_cluster_medusa:
              vars: {}
              notes:
                - >-
                  Medusa: medusa.ini NOT imported, "{{ ansible_failed_task.name | default('?') }}" failed
                  {{- (': ' ~ _why) if _why else '' }}
          vars:
            _why: "{{ ansible_failed_result | default({}) | community.cassandra.cassandra_import_error }}"

    - name: Note a Medusa without medusa.ini, or an import_cluster_medusa_path without Medusa
      ansible.builtin.set_fact:
        import_cluster_medusa:
          vars: {}
          notes: >-
            {{ (['Medusa ' ~ (_found.version | default('') or '?') ~ ' in ' ~ _found.bin
                 ~ ', but no /etc/medusa/medusa.ini: NOT imported'] if _found.bin is defined else [])
               + (['Medusa: no medusa in ' ~ _found.hint_missing ~ ' (import_cluster_medusa_path) on this node']
                  if _found.hint_missing is defined else []) }}
      vars:
        _found: "{{ dict(import_cluster_medusa_found.stdout_lines | default([]) | map('split', '=', 1)) }}"
      when:
        - _found.bin is defined or _found.hint_missing is defined
        - _found.ini | default('') != 'yes'

    # The OS tuning already on the nodes (set by hand, by another tool, by
    # a golden image), compared with what cassandra_linux would set: the files
    # as they are, and the live values. Read only.
    # the roles' own defaults, as for the config import: not the values an
    # inventory may already set (a value equal to them would not be carried)
    - name: Load the cassandra_linux and cassandra_service defaults (what they would set)
      ansible.builtin.set_fact:
        import_cluster_os_defaults: >-
          {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../roles/cassandra_linux/defaults/main.yml') | from_yaml
              | combine(lookup('ansible.builtin.file', playbook_dir ~ '/../roles/cassandra_service/defaults/main.yml') | from_yaml))
             | dict2items | selectattr('key', 'match', '^cassandra_(linux_(sysctl|sysctl_file|limits|timesync)|data_readahead_kb|service_limit_.*)$')
             | items2dict }}
      when: import_cluster_config is defined

    - name: Read the OS tuning
      ansible.builtin.shell: |
        set -- {{ _dirs | map('quote') | join(' ') }}  # the data and commitlog dirs
        ports='{{ _ports | join('|') }}'
        seen=
        once() { r=$(readlink -f "$1"); case " $seen " in *" $r "*) return 1 ;; esac; seen="$seen $r"; }
        # the package a file under /etc comes from (a distro default, not set by the admin)
        owner() {
          case $1 in /etc/*) ;; *) return ;; esac
          o=$(rpm -qf --qf '%{NAME}\n' "$1" 2>/dev/null) && o=$(echo "$o" | head -1) || o=$(dpkg -S "$1" 2>/dev/null | cut -d: -f1) || o=
          [ -n "$o" ] && echo "owner|$1|$o"
        }
        # the lines of a file, comments and blank lines left out: kind|file|line
        f() {
          k=$1; shift
          for x in "$@"; do
            # a link to /dev/null masks the file of that name in the other dirs
            [ -L "$x" ] && [ "$(readlink -f "$x")" = /dev/null ] && { echo "masked|$x"; continue; }
            [ -f "$x" ] && once "$x" || continue
            awk -v p="$k|$x|" '!/^[[:space:]]*([#;]|$)/ {print p $0}' "$x" 2>/dev/null
            owner "$x"
          done
        }
        # kernel settings: the files sysctl --system reads; systemd-sysctl reads sysctl.conf
        # only through a link in sysctl.d (99-sysctl.conf), at the place of its name
        for x in /etc/sysctl.d/*.conf; do
          [ -L "$x" ] && [ "$(readlink -f "$x")" = /etc/sysctl.conf ] && echo "sysctl_link|$x"
        done
        once /etc/sysctl.conf
        f sysctl /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf \
          /lib/sysctl.d/*.conf
        seen=; f sysctl /etc/sysctl.conf
        more=$(cat /etc/sysctl.d/*.conf /run/sysctl.d/*.conf /etc/sysctl.conf 2>/dev/null \
               | sed -n 's/^[[:space:]]*-\{0,1\}\([A-Za-z0-9_./-]*\)[[:space:]]*=.*/\1/p')
        for k in $(printf '%s\n' {{ import_cluster_os_defaults.cassandra_linux_sysctl.keys() | map('quote') | join(' ') }} $more | sort -u); do
          echo "sysctl_live|$k|$(sysctl -n "$k" 2>/dev/null | tr -s '[:space:]' ' ' | sed 's/ $//')"
        done
        # limits of the cassandra user, of the unit, of the running Cassandra
        seen=; f limits /etc/security/limits.conf /etc/security/limits.d/*.conf
        echo "groups|$(id -Gn cassandra 2>/dev/null)"
        systemctl cat cassandra 2>/dev/null | awk '/^# \// {p=$2}
          /^[[:space:]]*Limit(NOFILE|NPROC|MEMLOCK|AS)=/ {sub(/^[[:space:]]*/, ""); print "unit|" p "|" $0}'
        for p in $(pgrep -x java); do
          tr '\0' '\n' < /proc/$p/cmdline | grep -qx org.apache.cassandra.service.CassandraDaemon || continue
          sed -n 's/^\(Max \(open files\|processes\|locked memory\|address space\)\)  *\([^ ]*\)  *\([^ ]*\).*/proc_limit|\1|\3|\4/p' /proc/$p/limits
          break
        done
        # transparent huge pages, and what disables them
        t=/sys/kernel/mm/transparent_hugepage
        [ -f $t/enabled ] && echo "thp|enabled|$(cat $t/enabled)" && echo "thp|defrag|$(cat $t/defrag 2>/dev/null)"
        echo "cmdline|$(cat /proc/cmdline 2>/dev/null)"
        for x in /etc/default/grub /etc/default/grub.d/*.cfg; do
          grep -s transparent_hugepage "$x" | grep -v '^[[:space:]]*#' | awk -v p="grub|$x|" '{print p $0}'
        done
        seen=
        for x in /etc/systemd/system/*.service /usr/lib/systemd/system/*.service /lib/systemd/system/*.service \
                 /etc/rc.d/rc.local /etc/rc.local; do
          [ -f "$x" ] && grep -qs transparent_hugepage "$x" && once "$x" || continue
          case $x in
            *.service) s=$(systemctl is-enabled "${x##*/}" 2>/dev/null) ;;
            *) if [ -x "$x" ]; then s=executable; else s="not executable"; fi ;;
          esac
          echo "thp_unit|$x|$s"
        done
        # tuned: the active profile(s), and the profiles they include
        if [ -f /etc/tuned/active_profile ]; then
          todo=$(cat /etc/tuned/active_profile)
          echo "tuned|$todo|$(systemctl is-active tuned 2>/dev/null)"
          seen= n=0
          while [ -n "$todo" ] && [ $n -lt 10 ]; do
            n=$((n + 1)); p=${todo%% *}; todo=$(echo ${todo#"$p"})
            for d in /etc/tuned/profiles/$p /etc/tuned/$p /usr/lib/tuned/profiles/$p /usr/lib/tuned/$p; do
              [ -f "$d/tuned.conf" ] || continue
              f tuned_conf "$d/tuned.conf"
              todo="$todo $(sed -n 's/^[[:space:]]*include[[:space:]]*=[[:space:]]*//p' "$d/tuned.conf" | tr ',' ' ')"
              todo=$(echo $todo)
              break
            done
          done
        fi
        # the disks of the data and commitlog dirs: read-ahead, scheduler, SSD or not
        done_src=
        for d in "$@"; do
          src=$(findmnt -n -o SOURCE --target "$d" 2>/dev/null | sed 's/\[.*\]$//')
          [ -n "$src" ] || { echo "disk|$d||||||"; continue; }
          case " $done_src " in *" $src "*) continue ;; esac; done_src="$done_src $src"
          l=$(lsblk -ndP -o TYPE,PKNAME,KNAME "$src" 2>/dev/null)
          type=$(echo "$l" | sed -n 's/.*TYPE="\([^"]*\)".*/\1/p')
          disk=
          [ "$type" = part ] && disk=$(echo "$l" | sed -n 's/.*PKNAME="\([^"]*\)".*/\1/p')
          [ "$type" = disk ] && disk=$(echo "$l" | sed -n 's/.*KNAME="\([^"]*\)".*/\1/p')
          q=/sys/block/$disk/queue
          if [ -n "$disk" ] && [ -d "$q" ]; then
            echo "disk|$d|$src|$type|$disk|$(cat $q/read_ahead_kb)|$(sed -n 's/.*\[\(.*\)\].*/\1/p;t;p' $q/scheduler)|$(cat $q/rotational)"
          else
            echo "disk|$d|$src|$type|||||"
          fi
        done
        seen=
        for x in /etc/udev/rules.d/*.rules /run/udev/rules.d/*.rules /usr/lib/udev/rules.d/*.rules /lib/udev/rules.d/*.rules; do
          [ -L "$x" ] && [ "$(readlink -f "$x")" = /dev/null ] && { echo "masked|$x"; continue; }
          [ -f "$x" ] && once "$x" || continue
          grep -E 'read_ahead_kb|queue/scheduler|--setra' "$x" | grep -v '^[[:space:]]*#' | awk -v p="udev|$x|" '{print p $0}' \
            | grep . && owner "$x"
        done
        # swap
        awk '!/^[[:space:]]*#/ && $3 == "swap" {print "swap_fstab|" $0}' /etc/fstab 2>/dev/null
        awk 'NR > 1 {print "swap_on|" $1 " " $2 " " $3 "K"}' /proc/swaps 2>/dev/null
        # time sync
        ids=
        for s in chronyd chrony ntpd ntp ntpsec openntpd systemd-timesyncd; do
          [ "$(systemctl is-active $s 2>/dev/null)" = active ] || continue
          id=$(systemctl show -p Id --value $s 2>/dev/null); id=${id%.service}; id=${id:-$s}  # no --value before systemd 230
          case " $ids " in *" $id "*) continue ;; esac; ids="$ids $id"
          echo "timesync|$id|active|$(systemctl is-enabled $s 2>/dev/null)"
        done
        for x in /etc/chrony.conf /etc/chrony/chrony.conf /etc/chrony.d/*.conf /etc/chrony/conf.d/*.conf \
                 /etc/chrony/sources.d/*.sources /etc/ntp.conf /etc/ntpsec/ntp.conf /etc/systemd/timesyncd.conf \
                 /etc/systemd/timesyncd.conf.d/*.conf; do
          [ -f "$x" ] && grep -E '^[[:space:]]*(server|pool|peer|NTP=|FallbackNTP=)' "$x" | awk -v p="timesync_server|$x|" '{print p $0}'
        done
        # firewall: firewalld, ufw, else iptables/nftables rules for the Cassandra ports
        if [ "$(systemctl is-active firewalld 2>/dev/null)" = active ] && command -v firewall-cmd >/dev/null; then
          echo "fw|firewalld|active|default zone $(firewall-cmd --get-default-zone 2>/dev/null)"
          for z in $(firewall-cmd --get-active-zones 2>/dev/null | grep -v '^[[:space:]]' | awk '{print $1}'); do
            l=$(firewall-cmd --zone="$z" --list-ports 2>/dev/null); [ -n "$l" ] && echo "fw_rule|zone $z|ports $l"
            for s in $(firewall-cmd --zone="$z" --list-services 2>/dev/null); do
              l=$(firewall-cmd --info-service="$s" 2>/dev/null | sed -n 's/^[[:space:]]*ports: *//p')
              [ -n "$l" ] && echo "fw_rule|zone $z|service $s: $l"
            done
            firewall-cmd --zone="$z" --list-rich-rules 2>/dev/null | awk -v p="fw_rule|zone $z|" '{print p "rich rule " $0}'
          done
        elif command -v ufw >/dev/null && ufw status 2>/dev/null | grep -q '^Status: active'; then
          echo "fw|ufw|active|"
          ufw status 2>/dev/null | grep ALLOW | awk '{print "fw_rule|ufw|" $0}'
        else
          # only when their tables are there already (listing them would load the kernel modules)
          if grep -qsx filter /proc/net/ip_tables_names || { [ -e /sys/module/nf_tables ] && iptables -V 2>/dev/null | grep -q nf_tables; }; then
            pol=$(iptables -S INPUT 2>/dev/null | sed -n 's/^-P INPUT //p')
            [ -n "$pol" ] && [ "$pol" != ACCEPT ] && echo "fw|iptables|INPUT policy $pol|"
            iptables -S 2>/dev/null | grep -E -- "--dports? ([0-9]+[,:])*($ports)([,:]|[[:space:]]|$)" | grep -- '-j ACCEPT' \
              | awk '{print "fw_rule|iptables|" $0}'
          fi
          if [ -e /sys/module/nf_tables ] && command -v nft >/dev/null; then
            nft list ruleset 2>/dev/null | grep -E "dport.*[^0-9]($ports)([^0-9]|$)" | grep accept | awk '{print "fw_rule|nftables|" $0}'
          fi
        fi
        exit 0
      vars:
        _cfg: "{{ import_cluster_config.vars }}"
        _dirs: >-
          {{ (_cfg.cassandra_data_file_directories | default([_cfg.cassandra_data_dir | default('/var/lib/cassandra/data')]))
             + [_cfg.cassandra_commitlog_dir | default('/var/lib/cassandra/commitlog')] }}
        _ports: >-
          {{ [_cfg.cassandra_storage_port | default(7000), _cfg.cassandra_native_transport_port | default(9042),
              _cfg.cassandra_jmx_port | default(cassandra_jmx_port | default(7199))] | map('string') | select('match', '^[0-9]+$') | list }}
      register: import_cluster_os_found
      changed_when: false
      failed_when: false
      check_mode: false
      when: import_cluster_config is defined

    - name: Compare it with what the roles would set
      ansible.builtin.set_fact:
        import_cluster_os: >-
          {{ import_cluster_os_found.stdout | community.cassandra.cassandra_os_import(_wanted)
             if import_cluster_os_found.rc | default(1) == 0
             else {'lines': ['OS tuning NOT read: ' ~ (import_cluster_os_found.stderr | default('') or import_cluster_os_found.msg
                                                     | default('?')).splitlines() | first | default('?')],
                   'vars': {}, 'carried': []} }}
      vars:
        _cfg: "{{ import_cluster_config.vars }}"
        _d: "{{ import_cluster_os_defaults }}"
        _wanted:
          sysctl: "{{ _d.cassandra_linux_sysctl }}"
          sysctl_file: "{{ _d.cassandra_linux_sysctl_file }}"
          limits: "{{ _d.cassandra_linux_limits }}"
          readahead_kb: "{{ _d.cassandra_data_readahead_kb }}"
          timesync: "{{ _d.cassandra_linux_timesync }}"
          service_limits:
            nofile: "{{ _d.cassandra_service_limit_nofile }}"
            nproc: "{{ _d.cassandra_service_limit_nproc }}"
            memlock: "{{ _d.cassandra_service_limit_memlock }}"
            as: "{{ _d.cassandra_service_limit_as }}"
          ports:
            - "{{ _cfg.cassandra_storage_port | default(7000) }}/tcp"
            - "{{ _cfg.cassandra_native_transport_port | default(9042) }}/tcp"
            - "{{ _cfg.cassandra_jmx_port | default(cassandra_jmx_port | default(7199)) }}/tcp"
          # the node has cassandra_linux's own files, or cassandra_service's unit: it keeps their values
          own: "{{ 'cassandra_linux_manage' not in import_cluster_keep | default({}) }}"
          own_unit: "{{ 'cassandra_service_unit_manage' not in import_cluster_keep | default({}) }}"
      when: import_cluster_os_found is not skipped

- name: Write the inventory
  hosts: localhost
  connection: local
  gather_facts: false
  become: false  # the files are the user's, written without root
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
    # set on the given nodes only (not on the ones add_host found)
    _given: "{{ groups['all'] | map('extract', hostvars) | selectattr('import_cluster_given', 'defined') | map(attribute='import_cluster_given') | first }}"
    _ring: >-
      {{ _given | map('extract', hostvars) | map(attribute='import_cluster_ring.cluster_status', default={})
         | select | first | default({}) | community.cassandra.cassandra_ring_nodes }}
    _java_default: {40x: "11", 41x: "11", 50x: "17"}
    # the JMX login given for the import, which every later run needs too
    # (-e, or the given nodes' own inventory: read on the first of them)
    _jmx: >-
      {%- set h = hostvars[_given | first] -%}
      {%- set out = {} -%}
      {%- for k in ['cassandra_jmx_username', 'cassandra_jmx_password_file', 'cassandra_jmx_password'] -%}
      {%-   if h[k] | default('') -%}{%- set _ = out.update({k: h[k]}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
    # import_cluster_vault_password_file, else Ansible's (ansible.cfg vault_password_file, ANSIBLE_VAULT_PASSWORD_FILE)
    # (made absolute here: the modules would take a relative path from their own working directory)
    # (its dir only: a <name>-client symlink keeps its name, as for Ansible)
    _vault_file: "{{ ((_vault_given | dirname | default('.', true) | realpath) ~ '/' ~ _vault_given | basename) if _vault_given else '' }}"
    _vault_given: >-
      {{ (import_cluster_vault_password_file | default('', true)
          or lookup('ansible.builtin.config', 'DEFAULT_VAULT_PASSWORD_FILE') | default('', true)) | string | expanduser }}
    _vault: "{{ _vault_file != '' }}"
    _hosts_file: "{{ _layout.cluster_group ~ '.yml' }}"
    # what the playbooks are run with on this inventory
    _inventory_args: "{{ '-i ' ~ _dir ~ ' -e cassandra_hosts=' ~ _layout.cluster_group }}"
    _files: "{{ _layout | community.cassandra.cassandra_inventory_files }}"
    _secrets: "{{ _files | selectattr('secret') | map(attribute='path') | list }}"
    # not one node read: nothing checked, nothing valid; a ring node not read (down, unreachable): not
    # checked, the roles would give it the group variables (and start it), unless import_cluster_allow_unread
    _self_check_ok: >-
      {{ _self_check_error is not defined and _self_check | default({}) | length > 0
         and _self_check | dict2items | map(attribute='value.differences') | select | list | length == 0
         and (_unchecked | length == 0 or import_cluster_allow_unread | default(false) | bool) }}
    _unchecked: >-
      {%- set out = [] -%}
      {%- for n in _nodes | default([]) if not n.read | bool -%}{%- set _ = out.append(_layout.names[n.address]) -%}{%- endfor -%}
      {{ out }}
    # report.txt: setting by setting, each value with the nodes that have it (cassandra_import_report)
    _report_args:
      written: ["{{ _dir ~ '/' ~ _hosts_file }}", "{{ _dir }}"]
      report_file: "{{ _report_dir ~ '/report.txt' }}"
      secrets_clear: "{{ [] if _vault | bool else _secrets }}"
      check: "{{ ansible_check_mode }}"
      inventory_args: "{{ _inventory_args }}"
      allow_unread: "{{ import_cluster_allow_unread | default(false) | bool }}"
    _report: >-
      {{ _layout | community.cassandra.cassandra_import_report(_report_args.written, _report_args.report_file,
           _self_check | default({}), _self_check_ok | bool, secrets_clear=_report_args.secrets_clear,
           leftovers=_leftovers | default({}), check=_report_args.check | bool,
           inventory_args=_report_args.inventory_args, allow_unread=_report_args.allow_unread | bool,
           self_check_error=_self_check_error | default('')) | join('\n') }}
  tasks:
    # the first play had no host: a group that matches nothing (or only hosts marked absent), a --limit
    - name: Stop when no node was given
      ansible.builtin.assert:
        that: groups['all'] | map('extract', hostvars) | selectattr('import_cluster_given', 'defined') | list | length > 0
        fail_msg: >-
          No node given: -i <node>, or, with the inventory, -e cassandra_hosts=<a group with nodes not marked
          absent> (--limit is refused). Nothing was written.
        quiet: true

    # no_log: the variables hold the passwords read from the config
    - name: Build the inventory
      block:
        - name: Match the ring with the hosts
          no_log: "{{ not import_cluster_debug | default(false) | bool }}"
          ansible.builtin.set_fact:
            _nodes: "{{ _nodes | default([]) + [_node] }}"
          loop: "{{ _ring }}"
          loop_control:
            label: "{{ item.address }}"
          vars:
            # the given host with that address (interface facts, else its default or connection address)
            _host: >-
              {%- set found = [] -%}
              {%- for h in _given + groups['import_cluster_found'] | default([]) -%}
              {#-   a node found, reached by name: the machine reached must have its address (else it is not this node) -#}
              {%-   set addrs = (hostvars[h].ansible_facts.all_ipv4_addresses | default([]))
                                + [hostvars[h].ansible_facts.default_ipv4.address | default(''), hostvars[h].ansible_host | default('')]
                                + ([hostvars[h].import_cluster_address | default('')]
                                   if hostvars[h].ansible_facts.all_ipv4_addresses is not defined else []) -%}
              {%-   if item.address in addrs -%}{%- set _ = found.append(h) -%}{%- endif -%}
              {%- endfor -%}
              {{ found | first | default(item.address) }}
            _hv: "{{ hostvars[_host] | default({}) }}"
            _read: "{{ _hv.import_cluster_config is defined }}"
            # import_cluster_host_names: hostname (short, as the node reports it), fqdn or ip;
            # without facts (unreachable), the given name, else the address
            _name: >-
              {{ item.address if _host_names == 'ip' or (_hv.ansible_facts.hostname is not defined and _host not in _given)
                 else (_hv.ansible_facts[_host_names] | default(_host, true)) }}
            _host_names: "{{ import_cluster_host_names | default('hostname') }}"
            # a Java package is kept (cassandra_java_tarballs: {}, not the tarballs a shared
            # offer has); a Java the series does not support too (cassandra_java_allow_unsupported)
            _java: >-
              {{ ({'cassandra_java_version': _hv.import_cluster_java}
                  if _read and _hv.import_cluster_java != _java_default[_hv.import_cluster_series] | default('') else {})
                 | combine({'cassandra_java_home': _hv.import_cluster_java_home}
                           if _read and _hv.import_cluster_java_home | default('') != '' else {})
                 | combine({'cassandra_java_package': _hv.import_cluster_java_package}
                           if _read and _hv.import_cluster_java_package | default('') not in ['', _java_package] else {})
                 | combine({'cassandra_java_tarballs': {}}
                           if _read and _hv.import_cluster_java_home | default('') == '' else {})
                 | combine({'cassandra_java_allow_unsupported': true}
                           if _read and (_hv.import_cluster_series | community.cassandra.cassandra_java_supported | length > 0)
                              and _hv.import_cluster_java not in _hv.import_cluster_series | community.cassandra.cassandra_java_supported
                           else {}) }}
            # the package cassandra_install would install for that Java (its default)
            _java_package: >-
              {{ ('openjdk-' ~ _hv.import_cluster_java | default('') ~ '-jre-headless') if _hv.ansible_facts.os_family | default('') == 'Debian'
                 else ('java-' ~ _hv.import_cluster_java | default('') ~ '-amazon-corretto-headless') if _hv.ansible_facts.distribution | default('') == 'Amazon'
                 else ('java-' ~ _hv.import_cluster_java | default('') ~ '-openjdk-headless') }}
            # the installed version, so nodes added later get the same one
            _pkg: >-
              {{ ({'cassandra_package_version': _hv.import_cluster_package | regex_replace('^([0-9]+\.[0-9]+\.[0-9]+).*$', '\1')}
                  if _read and _hv.import_cluster_package | default('') else {})
                 | combine({'cassandra_install_method': 'packages'}
                           if _read and _hv.import_cluster_package | default('') and _hv.import_cluster_package_from_file | default(false) | bool
                           else {})
                 | combine(_repo.vars if _read else {}) }}
            # import_cluster_keep_hand_edits: the config files with hand edits no variable covers are left as
            # they are on this node (cassandra_config_keep_files), rather than failing the self-check
            _hand_kept: >-
              {%- set out = [] -%}
              {%- for line in _hv.import_cluster_config.hand_edits | default([]) if _read -%}
              {%-   set f = line | regex_replace('[:,].*$', '') -%}
              {%-   if f is match('^(cassandra[.]yaml|cassandra-env[.]sh|jvm[0-9]*-server[.]options|cassandra-rackdc[.]properties|logback[.]xml)$')
                       and f not in out -%}
              {%-     set _ = out.append(f) -%}
              {%-   endif -%}
              {%- endfor -%}
              {{ {'cassandra_config_keep_files': out} if out and import_cluster_keep_hand_edits | default(false) | bool else {} }}
            # cassandra_repository takes over the node's Cassandra repository files only if it would write them as
            # they are (with their URL, credentials and key path); else they are left as they are
            _repo: "{{ _hv.import_cluster_repo | default({'manage': true, 'vars': {}, 'why': ''}) }}"
            # what cassandra_install adds next to the Cassandra package, left out where the node has none (its
            # host_vars: nodes added later get them)
            _installed: >-
              {%- set pkgs = _hv.ansible_facts.packages | default({}) -%}
              {%- set out = {} -%}
              {%- if _read and _hv.import_cluster_package | default('') -%}
              {%-   if 'cassandra-tools' not in pkgs -%}{%- set _ = out.update({'cassandra_install_tools': false}) -%}{%- endif -%}
              {%-   if ('libjemalloc2' if _hv.ansible_facts.os_family | default('') == 'Debian' else 'jemalloc') not in pkgs -%}
              {%-     set _ = out.update({'cassandra_install_jemalloc': false}) -%}
              {%-   endif -%}
              {%-   if _hv.ansible_facts.os_family | default('') == 'Debian'
                       and ['cassandra', 'cassandra-tools'] | select('in', pkgs) | reject('in', _hv.import_cluster_held | default([])) | list -%}
              {%-     set _ = out.update({'cassandra_package_hold': false}) -%}
              {%-   endif -%}
              {%- endif -%}
              {%- set dsbulk = _hv.import_cluster_dsbulk | default('') -%}
              {%- if _read and dsbulk is match('^/usr/share/dsbulk-[0-9]+([.][0-9]+)*/bin/dsbulk$') -%}
              {%-   set _ = out.update({'cassandra_dsbulk_version': (dsbulk | dirname | dirname | basename)[7:]}) -%}
              {%- elif _read -%}{%- set _ = out.update({'cassandra_dsbulk_install': false}) -%}
              {%- endif -%}
              {{ out }}
            _conf: >-
              {{ ({'cassandra_conf_dir': _hv.import_cluster_conf_dir}
                  if _read and _hv.import_cluster_conf_dir not in _default_conf_dirs else {})
                 | combine({'cassandra_log_dir': _hv.import_cluster_log_dir}
                           if _read and _hv.import_cluster_log_dir | default('') not in ['', '/var/log/cassandra'] else {})
                 | combine({'cassandra_service_restart': _hv.import_cluster_unit.restart}
                           if _read and _hv.import_cluster_unit.restart | default('') not in ['', 'no'] else {})
                 | combine({'cassandra_service_enabled': false}
                           if _read and _hv.import_cluster_unit.boot | default('') == 'disabled' else {})
                 | combine({'cassandra_service_environment': _unit_env} if _unit_env else {}) }}
            # cassandra_config's default (without facts: either)
            _default_conf_dirs: >-
              {{ ['/etc/cassandra/conf'] if _hv.ansible_facts.os_family | default('') == 'RedHat'
                 else ['/etc/cassandra'] if _hv.ansible_facts.os_family | default('') != ''
                 else ['/etc/cassandra', '/etc/cassandra/conf'] }}
            # a kept unit that sets CASSANDRA_LOG_DIR: this node's cassandra-env.sh keeps its own fallback
            # (new nodes get the log dir in cassandra-env.sh, the dir made by cassandra_config)
            _env_log_dir: >-
              {{ {'cassandra_log_dir': _hv.import_cluster_config.vars.cassandra_log_dir | default('/var/log/cassandra')}
                 if _read and 'cassandra_service_unit_manage' in _hv.import_cluster_keep | default({})
                    and _hv.import_cluster_unit.env.CASSANDRA_LOG_DIR | default('') != ''
                    and _conf.cassandra_log_dir | default('') not in ['', _hv.import_cluster_config.vars.cassandra_log_dir
                                                                           | default('/var/log/cassandra')]
                 else {} }}
            # /usr/bin/java is another java than the running one (Cassandra finds its Java through JAVA_HOME):
            # left as it is on this node, the system java of the other programs. None (or leading nowhere):
            # the roles make it the running one, as nodetool needs one
            _java_link: >-
              {{ {'cassandra_java_set_default': false}
                 if _read and _hv.import_cluster_java_bin | default('') != '' and _hv.import_cluster_system_java | default('') != ''
                    and _hv.import_cluster_system_java != _hv.import_cluster_java_bin else {} }}
            # the unit's Environment (its heap too: cassandra-env.sh stays as it is), kept in cassandra_service's unit
            _unit_env: >-
              {{ {} if not _read else _hv.import_cluster_unit.env | default({}) | dict2items
                 | rejectattr('key', 'equalto', 'CASSANDRA_LOG_DIR' if _hv.import_cluster_unit.env.CASSANDRA_LOG_DIR | default('')
                                                == _hv.import_cluster_log_dir | default('') else '')
                 | items2dict }}
            _node:
              name: "{{ _name }}"
              address: "{{ item.address }}"
              host: "{{ _host }}"
              hostname: "{{ _hv.ansible_facts.hostname | default('') }}"
              # the address from the ring, whatever name the host was given or found by
              ansible_host: "{{ item.address if import_cluster_set_ansible_host | default(true) | bool else '' }}"
              dc: "{{ item.dc }}"
              rack: "{{ item.rack }}"
              read: "{{ _read }}"
              reason: >-
                {{ 'unreachable' if _hv.import_cluster_running.rc is not defined
                   else ('Cassandra not running' if _hv.import_cluster_running.rc != 0
                   else (_hv.import_cluster_error if _hv.import_cluster_error is defined
                   else 'unsupported version ' ~ _hv.import_cluster_version)) }}
              vars: >-
                {{ (_hv.import_cluster_config.vars | combine({'cassandra_version': _hv.import_cluster_series}, _java, _pkg, _conf, _jmx,
                                                             _hv.import_cluster_perms.vars | default({}),
                                                             _hv.import_cluster_medusa.vars | default({}),
                                                             _hv.import_cluster_os.vars | default({})))
                   if _read else {} }}
              # the OS tuning found on it, for the report
              os: "{{ _hv.import_cluster_os | default({}) if _read else {} }}"
              # a node not read is an existing node too: nothing of it is taken over. The firewall (or none)
              # is the node's: no mark tells one the role set up
              keep: >-
                {{ (_hv.import_cluster_keep | default({})
                    | combine(_env_log_dir, _java_link, {'cassandra_firewall_manage': false}, _hv.import_cluster_medusa.keep | default({}),
                              {} if _repo.manage else {'cassandra_repository_manage': false}, _hand_kept, _installed)
                    if _read
                    else {'cassandra_repository_manage': false, 'cassandra_linux_manage': false,
                          'cassandra_cqlsh_python_manage': false, 'cassandra_service_unit_manage': false,
                          'cassandra_java_set_default': false, 'cassandra_firewall_manage': false,
                          'cassandra_install_tools': false, 'cassandra_install_jemalloc': false,
                          'cassandra_package_hold': false, 'cassandra_dsbulk_install': false}) }}
              hand_edits: "{{ _hv.import_cluster_config.hand_edits | default([]) }}"
              normalized: "{{ _hv.import_cluster_config.normalized | default([]) }}"
              comments: "{{ _hv.import_cluster_config.comments | default([]) }}"
              notes: >-
                {{ [_versions ~ ', ' ~ _install ~ ', config in ' ~ _hv.import_cluster_conf_dir | default('?'), _started]
                   + _hv.import_cluster_perms.notes | default([])
                   + _hv.import_cluster_medusa.notes | default([])
                   + ([('reached at ' ~ _hv.ansible_host ~ ', its hosts file has its ring address ' ~ item.address
                        ~ ' (import_cluster_set_ansible_host: false leaves ansible_host out)')]
                      if _host != item.address and _hv.ansible_host | default(item.address) != item.address
                         and import_cluster_set_ansible_host | default(true) | bool else [])
                   + ([('Cassandra repository files left as they are: ' ~ _repo.why)] if _read and not _repo.manage else [])
                   + (['no repository answered the package query (an air-gapped host?): set cassandra_offline: true'
                       ~ ' (group_vars) unless the roles may download from the mirror']
                      if _read and not _hv.import_cluster_repos_answer | default(true) | bool else [])
                   + ([(_hv.import_cluster_newer_files | join(', ') ~ ' written after Cassandra started: it may not run'
                        ~ ' what they say. apply_config does not restart it for them; rolling_restart applies them')]
                      if _read and _hv.import_cluster_newer_files | default([]) else []) }}
            _versions: >-
              {{ 'Cassandra ' ~ _hv.import_cluster_version | default('?') ~ ', Java ' ~ _hv.import_cluster_java | default('?')
                 ~ ((' (not a package: ' ~ _hv.import_cluster_java_home ~ ')') if _hv.import_cluster_java_home | default('') else '')
                 ~ ((', /usr/bin/java is ' ~ _hv.import_cluster_system_java
                     ~ ': left as it is on this node (new nodes get the running Java as their system java)') if _java_link
                    else ', /usr/bin/java is missing: the roles will point it at the running Java'
                         if _hv.import_cluster_java_bin | default('') != '' and _hv.import_cluster_system_java | default('') == ''
                    else '') }}
            _started: >-
              {{ 'started by ' ~ (_hv.import_cluster_unit.file | default('') or 'no systemd unit')
                 ~ ', Restart=' ~ (_hv.import_cluster_unit.restart | default('') or '?')
                 ~ ', at boot: ' ~ (_hv.import_cluster_unit.boot | default('') or '?')
                 ~ (' (kept on this node; new nodes get the unit of cassandra_service, with the restart policy'
                    if 'cassandra_service_unit_manage' in _hv.import_cluster_keep | default({})
                    else ' (cassandra_service replaces it with its own unit, keeping the restart policy')
                 ~ ((', its Environment ' ~ _unit_env.keys() | join(', ') ~ ' as cassandra_service_environment') if _unit_env else '')
                 ~ ((', NOT its EnvironmentFile ' ~ _hv.import_cluster_unit.env_files ~ ': put what it sets in cassandra_service_environment')
                    if _hv.import_cluster_unit.env_files | default('') else '') ~ ')' }}
            _install: >-
              {{ ('package ' ~ _hv.import_cluster_package
                  ~ (' installed from a file, no configured repository offers it (cassandra_install_method: packages;'
                     ~ ' set cassandra_install_url, the directory of the package files, for new nodes)'
                     if _hv.import_cluster_package_from_file | default(false) | bool else ''))
                 if _hv.import_cluster_package | default('')
                 else 'NOT a package install: cassandra_install would install the package next to it' }}

        - name: Lay out groups and variables
          no_log: "{{ not import_cluster_debug | default(false) | bool }}"
          ansible.builtin.set_fact:
            _layout: "{{ _nodes | community.cassandra.cassandra_inventory_layout(_cluster_name) }}"
          vars:
            _cluster_name: >-
              {{ _nodes | selectattr('read') | map(attribute='vars.cassandra_cluster_name') | first | default('cassandra') }}
      rescue:
        - name: Say how to see the error
          ansible.builtin.fail:
            msg: >-
              "{{ ansible_failed_task.name | default('?') }}" failed{{ (' (' ~ _why ~ ')') if _why else '' }}{{ ': its error is above.'
              if import_cluster_debug | default(false) | bool else ', the rest of its error is hidden (the variables hold passwords).'
              ~ ' Rerun with -e import_cluster_debug=true to see it (it may show passwords).' }}
          vars:
            # the ring nodes it failed on, and what of the error shows no value
            _why: "{{ ansible_failed_result | default({}) | community.cassandra.cassandra_import_error }}"

    # made absolute here, on the controller: the modules would take a relative
    # path from their own working directory, not the one the playbook was run from
    - name: Pick the output dirs
      ansible.builtin.set_fact:
        _dir: "{{ _abs_dir }}"
        _report_dir: "{{ _given_report_dir if _given_report_dir is abs else _given_report_dir | realpath }}"
      vars:
        _given_dir: "{{ import_cluster_dir | default('inventories', true) | expanduser }}"
        _abs_dir: "{{ (_given_dir if _given_dir is abs else _given_dir | realpath) | regex_replace('(?<=.)(/+[.]?)+$', '') }}"
        # reports/<cluster group> next to the inventory dir as given (through a symlink too; /x/inv/. as /x/inv)
        _given_report_dir: >-
          {{ import_cluster_report_dir | default([_given_dir | regex_replace('(?<=.)(/+[.]?)+$', '') | dirname, 'reports',
                                                  _layout.cluster_group] | path_join, true) | expanduser }}

    - name: Check the output dir
      ansible.builtin.stat:
        path: "{{ _dir }}"
      register: import_cluster_dir_stat

    - name: Check the hosts file
      ansible.builtin.stat:
        path: "{{ _dir }}/{{ _hosts_file }}"
      register: import_cluster_hosts_stat

    - name: Stop rather than overwrite an inventory
      ansible.builtin.assert:
        that: import_cluster_force | default(false) | bool or not import_cluster_hosts_stat.stat.exists
        fail_msg: >-
          {{ _dir ~ '/' ~ _hosts_file }} exists: this cluster is imported there already, set import_cluster_force=true
          to import it again (with --check --diff first to see the changes)

    # The vault password: import_cluster_vault_password_file, else Ansible's own
    # (vault_password_file in ansible.cfg, ANSIBLE_VAULT_PASSWORD_FILE); a
    # password file that is executable is run, as Ansible does
    - name: Read the vault password
      when: _vault | bool
      block:
        - name: Check the vault password file
          ansible.builtin.stat:
            path: "{{ _vault_file }}"
          register: import_cluster_vault_stat

        - name: Stop on a missing vault password file
          ansible.builtin.assert:
            that: import_cluster_vault_stat.stat.exists
            fail_msg: "vault password file {{ _vault_file }} not found"
            quiet: true

        # a <name>-client script is asked for the vault id, as Ansible does
        - name: Run the vault password script
          ansible.builtin.command:
            argv: >-
              {{ [_vault_file] + (['--vault-id', import_cluster_vault_id | default(lookup('ansible.builtin.config', 'DEFAULT_VAULT_IDENTITY'))]
                 if _vault_file | basename | splitext | first is match('.*-client$') else []) }}
          register: import_cluster_vault_script
          changed_when: false
          check_mode: false
          no_log: true
          when: import_cluster_vault_stat.stat.executable

        - name: Keep the vault password
          ansible.builtin.set_fact:
            _vault_secret: >-
              {{ import_cluster_vault_script.stdout if import_cluster_vault_stat.stat.executable
                 else lookup('ansible.builtin.file', _vault_file) | trim }}
          no_log: true

        - name: Stop on an empty vault password
          ansible.builtin.assert:
            that: _vault_secret | length > 0
            fail_msg: "empty vault password from {{ _vault_file }}"
            quiet: true

    # a re-import keeps what it did not write (group_vars/all/*, ansible.cfg,
    # notes...): it replaces its own files, and removes the ones an earlier
    # import wrote that this one does not (a node gone from the ring)
    - name: Find the files already there
      ansible.builtin.find:
        paths: "{{ _dir }}"
        recurse: true
        depth: 3  # group_vars/<group>/main.yml
        file_type: file
      register: import_cluster_existing
      when: import_cluster_dir_stat.stat.exists

    - name: Read the group_vars and host_vars files already there
      ansible.builtin.slurp:
        src: "{{ _dir }}/{{ item }}"
      loop: "{{ _found | select('match', '^((group_vars|host_vars)/[^/]+(/[^/]+)?[.](yml|yaml|json)|' ~ _top ~ ')$') | list }}"
      register: import_cluster_existing_vars
      no_log: true  # a secrets.yml in clear
      vars:
        # every file Ansible reads as inventory (the hosts files: whose they are; the user's: their groups)
        _top: "(?!(group_vars|host_vars)/)(?!.*([.](pyc|pyo|swp|bak|rpm|md|txt|rst|orig|cfg|retry)|~)$).+"
        # (not a big file left there: a dump, an archive)
        _found: "{{ import_cluster_existing.files | default([]) | selectattr('size', 'le', 1048576) | map(attribute='path')
                    | map('relpath', _dir) | reject('match', '(.*/)?[.]') | list }}"

    # the user's own variables files there (group_vars/all...) apply to these hosts too: a value of theirs that
    # would change a node is written as the node has it (listed in the report)
    - name: Lay out again over your own variables
      no_log: "{{ not import_cluster_debug | default(false) | bool }}"
      ansible.builtin.set_fact:
        _layout: "{{ _nodes | community.cassandra.cassandra_inventory_layout_over(_layout.cluster_name, _theirs) }}"
        _user_files: "{{ _theirs }}"
      vars:
        _theirs: >-
          {{ dict(import_cluster_existing_vars.results | default([]) | selectattr('content', 'defined') | map(attribute='item')
                  | zip(import_cluster_existing_vars.results | default([]) | selectattr('content', 'defined')
                        | map(attribute='content') | map('b64decode')))
             | community.cassandra.cassandra_inventory_user_files(_layout, _vault_secret | default('')) }}

    # Each node read: what the roles would write with the inventory's variables
    # (read back from the files about to be written, over the roles' defaults,
    # with the node's facts), against the node's files, setting by setting
    - name: Self-check
      block:
        - name: Render what the roles would write, and compare with the nodes' files
          no_log: "{{ not import_cluster_debug | default(false) | bool }}"
          ansible.builtin.set_fact:
            _self_check: "{{ _self_check | default({}) | combine({_name: _result}) }}"
          loop: "{{ _nodes }}"
          loop_control:
            label: "{{ item.address }}"
          when: item.read | bool
          vars:
            _hv: "{{ hostvars[item.host] }}"
            _name: "{{ _layout.names[item.address] }}"
            _slurped: >-
              {{ _hv.import_cluster_slurp.results + _hv.import_cluster_jmx_slurp.results | default([])
                 + ([_hv.import_cluster_unit_slurp | combine({'item': 'cassandra.service'})]
                    if _hv.import_cluster_unit_slurp.content is defined else [])
                 + ([_hv.import_cluster_medusa_ini | combine({'item': 'medusa.ini'})]
                    if _hv.import_cluster_medusa_ini.content is defined else []) }}
            _live: >-
              {{ dict(_slurped | selectattr('content', 'defined') | map(attribute='item')
                      | zip(_slurped | selectattr('content', 'defined') | map(attribute='content') | map('b64decode'))) }}
            _result: >-
              {{ (_user_files | default([]) + _files) | community.cassandra.cassandra_import_self_check(_layout.hosts, _name, _hv.ansible_facts, _live,
                                                                          _hv.import_cluster_unit.env | default({}),
                                                                          _hv.import_cluster_storage_dir | default(''),
                                                                          _hv.import_cluster_java | default(''),
                                                                          _hv.import_cluster_conf_dir,
                                                                          _hv.import_cluster_perms.files | default(none)) }}
      rescue:
        - name: Keep why for the report
          ansible.builtin.set_fact:
            _self_check_error: >-
              the self-check could not run ("{{ ansible_failed_task.name | default('?') }}" failed{{ (': ' ~ _why) if _why else '' }}):
              nothing says the variables reproduce the nodes
          vars:
            _why: "{{ ansible_failed_result | default({}) | community.cassandra.cassandra_import_error }}"

    - name: Sort out the files an earlier import wrote
      ansible.builtin.set_fact:
        _leftovers: >-
          {{ _found | community.cassandra.cassandra_inventory_leftovers(_read, _written, _layout.cluster_group,
                                                                         _vault_secret | default(''),
                                                                         _layout.hosts, _layout.cluster_name) }}
      vars:
        # (not the report, when import_cluster_report_dir puts it there: written again below)
        _found: "{{ import_cluster_existing.files | default([]) | map(attribute='path') | map('relpath', _dir)
                    | reject('match', '(.*/)?[.]') | reject('in', _report_files) | list }}"
        _report_files: "{{ [(_report_dir ~ '/report.txt') | relpath(_dir)] }}"
        # the first line is enough to tell (a vaulted file: decrypted to its first line; an inventory file,
        # and the cluster's main.yml for its cluster name: all of it), and a secret's value never leaves
        # this task
        _read: >-
          {%- set out = {} -%}
          {%- for r in import_cluster_existing_vars.results -%}
          {%-   set t = r.content | b64decode -%}
          {%-   set _ = out.update({r.item: t if t.startswith('$ANSIBLE_VAULT') or not r.item is match('(group|host)_vars/')
                                              or r.item == 'group_vars/' ~ _layout.cluster_group ~ '/main.yml'
                                         else t.split('\n') | first}) -%}
          {%- endfor -%}
          {{ out }}
        _written: "{{ [_hosts_file] + _files | map(attribute='path') | list }}"

    - name: Stop rather than write over another cluster's files
      ansible.builtin.assert:
        that: _leftovers.conflicts | length == 0
        fail_msg: >-
          {{ _leftovers.conflicts | default([]) | join('; ') }}. Nothing written: in {{ _dir }}, these are another
          cluster's (another import_cluster_dir, or for a host name import_cluster_host_names fqdn or ip), or files an
          earlier release wrote that no hosts file there names (remove them if they are this cluster's)
        quiet: true

    - name: Stop rather than write in clear over a vaulted file
      ansible.builtin.assert:
        that: _vault | bool or _vaulted | length == 0
        fail_msg: >-
          {{ _vaulted | join(', ') }} in {{ _dir }} are vaulted, and no vault password file is set: set
          vault_password_file in ansible.cfg (or -e import_cluster_vault_password_file=<file>)
        quiet: true
      vars:
        _vaulted: >-
          {%- set out = [] -%}
          {%- for r in import_cluster_existing_vars.results | default([]) if r.content is defined -%}
          {%-   if r.item in _files | selectattr('secret') | map(attribute='path') and (r.content | b64decode).startswith('$ANSIBLE_VAULT') -%}
          {%-     set _ = out.append(r.item) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Remove the files an earlier import wrote and this one does not
      ansible.builtin.file:
        path: "{{ _dir }}/{{ item }}"
        state: absent
      loop: "{{ _leftovers.stale }}"  # files only: a dir may hold files of yours

    - name: Create the dirs
      ansible.builtin.file:
        path: "{{ _dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ [''] + _files | map(attribute='path') | map('dirname') | unique | list }}"

    - name: Create the report dir
      ansible.builtin.file:
        path: "{{ _report_dir }}"
        state: directory
        mode: "0755"
      when: _report_dir != _dir

    - name: Write the hosts file
      ansible.builtin.copy:
        content: "{{ (('' if _self_check_ok | bool else '# NOT VALID: the import self-check failed, see '
                                                      ~ (_report_dir ~ '/report.txt') | relpath(_dir) ~ '\n')
                      ~ _layout.hosts | to_nice_yaml(indent=2, sort_keys=false))
                     | community.cassandra.cassandra_inventory_generated(_layout.cluster_group) }}"
        dest: "{{ _dir }}/{{ _hosts_file }}"
        mode: "0644"
        backup: "{{ _hosts_file in _leftovers.replaced | default([]) }}"  # not an import's

    # secrets.yml: encrypted as a whole (Ansible reads vaulted vars files), or 0600 in clear
    - name: Write group_vars and host_vars
      ansible.builtin.copy:
        content: >-
          {{ item.content | community.cassandra.cassandra_inventory_generated(_layout.cluster_group)
             | ansible.builtin.vault(_vault_secret, vault_id=import_cluster_vault_id | default('default'))
             if item.secret and _vault | bool else item.content | community.cassandra.cassandra_inventory_generated(_layout.cluster_group) }}
        dest: "{{ _dir }}/{{ item.path }}"
        mode: "{{ '0600' if item.secret else '0644' }}"
        backup: "{{ item.path in _leftovers.replaced | default([]) }}"  # not an import's: kept as <file>.<date>~
        decrypt: false  # the content is already encrypted, write it as is
      loop: "{{ _files }}"
      loop_control:
        label: "{{ item.path }}"
      no_log: "{{ item.secret }}"
      # a vaulted file already there with the same content is left as it is (not encrypted again)
      when: >-
        not (item.secret and _vault | bool
             and _existing[item.path] | default('') | community.cassandra.cassandra_inventory_same_secret(
                   item.content | community.cassandra.cassandra_inventory_generated(_layout.cluster_group), _vault_secret))
      vars:
        _existing: >-
          {{ dict(import_cluster_existing_vars.results | default([]) | selectattr('content', 'defined') | map(attribute='item')
                  | zip(import_cluster_existing_vars.results | default([]) | selectattr('content', 'defined')
                        | map(attribute='content') | map('b64decode'))) }}

    # a report.txt of the user's, or of another cluster's import: kept as <file>.<date>~
    - name: Write report.txt
      ansible.builtin.copy:
        content: "{{ (_report ~ '\n') | community.cassandra.cassandra_inventory_generated(_layout.cluster_group) }}"
        dest: "{{ _report_dir }}/report.txt"
        mode: "0644"
        backup: >-
          {{ (_report_dir ~ '/report.txt') is file
             and not lookup('ansible.builtin.file', _report_dir ~ '/report.txt').startswith(
                       '# Written by community.cassandra.import_cluster for ' ~ _layout.cluster_group ~ ':') }}
      when: not ansible_check_mode  # shown below

    # the end of the run: its header, TO DO and SETTINGS; the rest is in report.txt
    - name: Show the summary
      ansible.builtin.debug:
        msg: >-
          {{ _layout | community.cassandra.cassandra_import_report(_report_args.written, _report_args.report_file,
               _self_check | default({}), _self_check_ok | bool, secrets_clear=_report_args.secrets_clear,
               leftovers=_leftovers | default({}), check=_report_args.check | bool,
               inventory_args=_report_args.inventory_args, allow_unread=_report_args.allow_unread | bool,
               self_check_error=_self_check_error | default(''), screen=true) }}

    - name: Stop on a failed self-check
      ansible.builtin.fail:
        msg: >-
          SELF-CHECK FAILED: the inventory in {{ _dir }} is NOT VALID (written for inspection only): with it, the
          roles would change settings on the nodes{{ (', ' ~ _unchecked | join(', ') ~ ' not read')
          if _unchecked and not import_cluster_allow_unread | default(false) | bool else '' }}. See TO DO above{{ ''
          if ansible_check_mode else ', and DETAILS in ' ~ _report_dir ~ '/report.txt' }}.
          (-e import_cluster_strict=false: the same inventory and report, without this failure)
      when:
        - not _self_check_ok | bool
        - import_cluster_strict | default(true) | bool
