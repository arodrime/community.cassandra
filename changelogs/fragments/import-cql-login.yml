minor_changes:
  - "import_cluster - with CQL authentication on, the CQL login the operations need (``cassandra_cql_username``, ``cassandra_cql_password``): one the inventory or ``-e`` sets is checked with a real login on a node (as the operations log in), not asked nor written (a refused one is a TO DO); one an earlier import wrote is kept; else it is asked on the terminal (the password not shown), checked (3 tries) and written with the cluster's variables, the password in ``secrets.yml``. Without a terminal, under ``--check`` or with ``cassandra_operation_confirm: false``, a TO DO says how to set it."
