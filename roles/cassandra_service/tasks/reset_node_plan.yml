---
# The plan of reset_node.yml, read-only: what the reset of this node would
# stop, disable and delete (_cassandra_node_reset_plan), shown per node, and
# the refusal, if any. A caller that confirms the reset on its own screen
# (add_node, replace_node: cassandra_reset_warnings; topology for the hosts it
# adds, its add_node step keeping that plan) runs it before that screen with
# _cassandra_node_reset_on_screen: true (shown there only, not here too), then
# reset_node.yml with _cassandra_node_reset_confirmed: true.
# _cassandra_node_reset_auto (add_node and topology, cassandra_add_node_reset on by
# default): a node without data needs no reset (nothing to do, no line); one
# with data is reset only when Cassandra is down there, it is in no ring, its
# cluster is this one or the stock 'Test Cluster' and it has no user keyspace but
# a failed bootstrap's of this cluster (cassandra_add_node_reset_check): the plan
# gets the line for the screen, or the refusal saying what the node holds.
# a host marked cassandra_node_state: absent (removed by topology) is still of the group: reset_node empties it
- name: The node belongs to the cluster's group
  ansible.builtin.assert:
    that: inventory_hostname in groups[lookup('community.cassandra.cassandra_hosts')] | default([])
    fail_msg: >-
      {{ inventory_hostname }} is not a host of the group {{ lookup('community.cassandra.cassandra_hosts') }} (cassandra_hosts):
      the reset checks the ring of that group's nodes, so it only resets a host of that group.
    quiet: true

# What the node holds, its rings, where it stands: read once (node_standing_read.yml)
- name: Where the node stands
  ansible.builtin.include_tasks: node_standing.yml
  vars:
    # the whole cluster (create_cluster's reset): every node is wiped, the caller checked the ring
    _cassandra_node_standing_ring: "{{ not _cassandra_node_reset_whole_cluster | default(false) | bool }}"
    _cassandra_node_standing_size: "{{ _cassandra_node_reset_auto | default(false) }}"  # add_node's line

- name: Work out whether this node may be reset
  vars:
    _whole: >-
      {{ _cassandra_node_standing_read.addresses | community.cassandra.cassandra_node_reset_ring(host=inventory_hostname,
           has_data=cassandra_node_standing.holds_data, cluster_ring=_cassandra_node_reset_cluster_ring | default([]))
         if _cassandra_node_reset_whole_cluster | default(false) | bool else {} }}
  ansible.builtin.set_fact:
    # create_cluster: a node holding data must be in the cluster's ring, of no other cluster; else where it stands
    _cassandra_node_reset_ring: >-
      {{ (_whole | combine({'problems': _whole.problems + cassandra_node_standing
                                        | community.cassandra.cassandra_node_reset_refusal(whole_cluster=true)}))
         if _cassandra_node_reset_whole_cluster | default(false) | bool
         else {'problems': cassandra_node_standing | community.cassandra.cassandra_node_reset_refusal,
               'info': cassandra_node_standing.reasons | select('search', 'the node being replaced$') | list} }}
    # add_node's reset (cassandra_add_node_reset): never joined, or a former member when given
    _cassandra_node_reset_check: >-
      {{ cassandra_node_standing | community.cassandra.cassandra_add_node_reset_check(
           size=_cassandra_node_standing_read.size,
           explicit=cassandra_add_node_reset | default('auto') | community.cassandra.cassandra_reset_choice == 'true')
         if _cassandra_node_reset_auto | default(false) | bool else {} }}

# The plan, also read by the confirmation from every host of the play
- name: Work out the reset of {{ inventory_hostname }}
  ansible.builtin.set_fact:
    _cassandra_node_reset_plan:
      problems: >-
        {{ _unread if _auto | bool and not _has_data | bool
           else (_cassandra_node_reset_dirs.problems + ([] if _auto | bool else _cassandra_node_reset_ring.problems) + _unread
                 + (['a Cassandra JVM runs that the cassandra unit did not start (by hand?), so it can not stop it: stop it first']
                    if cassandra_node_reset_jvm.rc == 0 and not _active | bool and not _auto | bool else [])
                 + (_cassandra_node_reset_check.problems if _auto | bool else [])) | unique }}
      info: "{{ _cassandra_node_reset_ring.info }}"
      # add_node's: never stops Cassandra (refused when it runs), nothing to do without data
      stop: "{{ (_active or cassandra_node_reset_jvm.rc == 0) and not _auto | bool }}"
      disable: >-
        {{ (_status.UnitFileState | default('') in ['enabled', 'enabled-runtime']
            or cassandra_node_reset_sysv.stdout | default('') | trim == 'enabled')
           and (_has_data | bool or not _auto | bool) }}
      # the plan line (add_node's screen) or the refusal saying what the node holds
      line: "{{ _cassandra_node_reset_check.line | default('') if _auto | bool and _cassandra_node_reset_check.reset else '' }}"
      refusal: "{{ _cassandra_node_reset_check.line | default('') if _auto | bool and not _cassandra_node_reset_check.reset else '' }}"
      unit: "{{ _status.LoadState | default('not-found') != 'not-found' }}"
      # the directories and where they resolved when the plan was made (the guard before the delete)
      paths: "{{ _cassandra_node_reset_listed.dirs | map(attribute='path') | list }}"
      resolved: "{{ cassandra_node_reset_realpath.stdout_lines | default([]) }}"
      # a fresh file system's lost+found stays
      delete: >-
        {{ cassandra_node_reset_found.files | default([]) | map(attribute='path')
           | reject('search', '/lost[+]found$') | sort | list }}
      dirs: >-
        {%- set out = [] -%}
        {%- for d in _cassandra_node_reset_dirs.dirs -%}
        {%-   set where = d.real -%}
        {%-   set held = cassandra_node_reset_found.files | default([]) | map(attribute='path')
                         | select('match', '^' ~ (where ~ '/') | regex_escape ~ '[^/]+$') | reject('search', '/lost[+]found$')
                         | map('basename') | sort | list -%}
        {%-   set _ = out.append(d.path ~ ((' -> ' ~ d.real) if d.real != d.path else '') ~ ' (' ~ d.kinds | join(', ')
                                 ~ '; from ' ~ d.from | join(', ') ~ '): '
                                 ~ ((held | length | string ~ ' entries: ' ~ held[:8] | join(', ') ~ (', ...' if held | length > 8 else ''))
                                    if held else 'empty or missing')) -%}
        {%- endfor -%}
        {{ out }}
  vars:
    _status: "{{ cassandra_node_reset_unit.status | default({}) }}"
    _auto: "{{ _cassandra_node_reset_auto | default(false) }}"
    # read once, where the node stands (node_standing_read.yml)
    _active: "{{ _cassandra_node_standing_read.active }}"
    _has_data: "{{ cassandra_node_standing.holds_data }}"
    # what could not be looked at (add_node's reset of a node that seems empty is refused on it too)
    _unread: "{{ cassandra_node_standing.unreadable }}"

- name: What the reset of {{ inventory_hostname }} would do
  ansible.builtin.debug:
    msg: >-
      {{ (['Reset of ' ~ inventory_hostname ~ (' (replacing ' ~ cassandra_node_reset_replace_address ~ ')'
          if cassandra_node_reset_replace_address | default('') else '') ~ ':']
         + (['  stop Cassandra' ~ (' and keep it from starting at boot' if _p.disable | bool else '')] if _p.stop | bool
            else ['  keep Cassandra from starting at boot'] if _p.disable | bool else [])
         + _p.dirs | map('regex_replace', '^', '  empty ') | list
         + ([] if _p.delete else ['  nothing to delete'])
         + _p.info | map('regex_replace', '^', '  ') | list
         + _p.problems | map('regex_replace', '^', '  REFUSED: ') | list) | join(_nl) }}
  when:
    - not _cassandra_notes_deferred | default(false) | bool  # topology: in its plan
    # add_node, replace_node, reset_node: on their screen (a node with nothing to do is not on it)
    - not _cassandra_node_reset_on_screen | default(false) | bool or not (_p.delete or _p.stop | default(false) | bool or _p.disable | default(false) | bool)
    # add_node's: nothing to say about a node without data
    - not _cassandra_node_reset_auto | default(false) | bool or _p.delete | length > 0
  vars:
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    cassandra_output: true
    _p: "{{ _cassandra_node_reset_plan }}"

- name: Refuse the reset of {{ inventory_hostname }}
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    # the directory problems, besides what the add_node check says
    _other: "{{ _cassandra_node_reset_plan.problems | reject('in', _cassandra_node_reset_check.problems | default([])) | list }}"
  ansible.builtin.fail:
    msg: >-
      {{ (_cassandra_node_reset_plan.refusal ~ ((' Also: ' ~ _other | join('; ') ~ '.') if _other else ''))
         if _cassandra_node_reset_plan.refusal
         else 'Reset of ' ~ inventory_hostname ~ ' refused, nothing was changed: ' ~ _cassandra_node_reset_plan.problems | join('; ') ~ '.' }}
  when:
    - _cassandra_node_reset_plan.problems | length > 0
    - not _cassandra_node_reset_refused_by_caller | default(false) | bool  # add_node: one block for all its nodes
