---
cassandra_version: "50x"
# Download nothing (air-gapped hosts): the role does nothing.
cassandra_offline: false
# false: the repositories are configured by other means, the role does nothing
cassandra_repository_manage: "{{ not cassandra_offline | bool }}"
# How the Cassandra packages are installed (same in cassandra_install):
#   repository  from a yum/apt repository (Apache's, or a mirror of it) this
#               role adds
#   packages    the package files downloaded from cassandra_install_url, a
#               plain directory (no repository metadata): this role adds no
#               repository, and removes the one it added earlier
cassandra_install_method: repository
# The repository, or the directory of the package files: Apache's by default.
cassandra_install_url: >-
  {{ 'https://debian.cassandra.apache.org' if ansible_facts['os_family'] == 'Debian'
     else 'https://redhat.cassandra.apache.org/' ~ cassandra_version ~ '/' }}
# Credentials when the mirror needs them to read (a user and its password, or
# a service account and its token): used for the repository, the package
# files and the key URL. Keep the password in a vault.
cassandra_install_username: ""
cassandra_install_password: ""
debian_packages:
  - apt-transport-https
  - curl
  - gnupg
  - python3-debian
cassandra_apt_keyring_path: /etc/apt/keyrings/apache-cassandra.asc
cassandra_rpm_key_path: /etc/pki/rpm-gpg/apache-cassandra.asc
# Signing keys of the Apache Cassandra releases, downloaded at each run. Every
# key the file holds must have its primary key fingerprint in the list below.
# Offline: point it at a mirror, or at a copy on the node (file:///path).
cassandra_repository_key_url: https://downloads.apache.org/cassandra/KEYS
cassandra_repository_key_fingerprints: "{{ _cassandra_repository_known_fingerprints }}"
