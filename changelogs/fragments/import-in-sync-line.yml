minor_changes:
  - "import_cluster playbook - the head of the screen, of report.txt and of its shareable copy answers whether Ansible is in sync with the cluster: ``in sync with Ansible: yes`` (with what the next apply_config rewrites with no effect on the values, and the restarts that brings), ``not all verified`` (nodes not read, parts kept by hand or not managed by Ansible, files left as is: what and on how many nodes) or ``no`` (how many settings apply_config would change, on how many nodes). The ops callback colours it with Ansible's colours (ok, changed, error); the files have no colour."
