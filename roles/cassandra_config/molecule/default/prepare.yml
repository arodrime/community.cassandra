---
# UBI 8 only ships platform-python 3.6, below ansible-core's target minimum
- name: Bootstrap Python on RHEL 8
  hosts: rhel810
  gather_facts: false
  tasks:
    - name: Install python3.12
      ansible.builtin.raw: test -x /usr/bin/python3.12 || dnf -y install python3.12
      changed_when: false

- name: Prepare
  hosts: all
  tasks:
    - name: Create config dirs (normally created by the Cassandra package)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ '/etc/cassandra/conf' if ansible_facts['os_family'] == 'RedHat' else '/etc/cassandra' }}"
        - /tmp/cassandra-override
        - /tmp/cassandra-40x
        - /tmp/cassandra-41x
        - /tmp/cassandra-40x-override
