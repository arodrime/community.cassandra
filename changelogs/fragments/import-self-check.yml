minor_changes:
  - import_cluster playbook - self-check. For every node read, the files the roles would write with the imported variables (cassandra.yaml, cassandra-env.sh, the jvm options, rackdc, logback, and the JMX users, the unit and medusa.ini when the roles manage them) are compared with the node's, setting by setting as Cassandra, the JVM, bash and systemd read them; any difference is listed in report.txt, the inventory is marked NOT VALID and the playbook fails (``import_cluster_strict`` false writes the same inventory and report without failing).
bugfixes:
  - import_cluster playbook - settings written another way than the role's templates were silently left at the role default (a cluster name or seeds in other quotes or none, a comment after a value, a key set twice or moved, ``True`` or ``yes``, an unquoted heap or JMX port in cassandra-env.sh, a JVM option switched on or added in the middle of a file); text values stay text (a password ``0123``), quotes and comments are no longer kept in values, a shell expansion is not imported as a path or port, directories left out of cassandra.yaml follow the JVM's storage dir, a conf dir that is not the OS family's default is imported, and values that look like templates are written ``!unsafe``.
  - cassandra_config - a file with the same settings as the role's is left as it is in more cases, so that the roles change nothing on an imported node - cassandra-env.sh compared as bash reads its lines (indentation, a trailing comment, quotes that change nothing), the JVM options as the lines bin/cassandra passes (comments and indented lines out), and cassandra.yaml compared on the controller when the node has no PyYAML.
