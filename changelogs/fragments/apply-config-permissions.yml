bugfixes:
  - apply_config playbook - a node whose config files only need another owner, group or mode is no longer skipped as having nothing to apply. When Cassandra runs there, the change is applied without a restart (Cassandra reads its config when it starts; the JMX password file is read at each login).
  - apply_config playbook - a node of the run where Cassandra is not running gets its config. If its unit failed (for example, Cassandra could not read its config; a restart loop or its start limit is cleared first), Cassandra is started once the config is written; if it was stopped, it stays stopped (with ``cassandra_rolling_resume``, a stopped node whose config changed since its last start is taken for the one the interrupted run stopped, and started). preflight lets such a node be a seed that is down, and the health checks of the nodes not restarted let these nodes be down (the second node they read the ring from is never one of them). A run that would restart a node while another node of the run is still down at that point is refused before any change.
  - cassandra_config role - the files whose owner, group or mode the role changes are shown with the diffs.
