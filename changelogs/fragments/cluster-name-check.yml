bugfixes:
  - preflight playbook - the check that the running cluster's name is the inventory's ``cassandra_cluster_name`` now runs before the other checks. It also runs when ``--limit`` leaves out every running node (it reads the name on another node of the cluster). When the inventory's name is the role default ``Test Cluster``, the message first asks whether the inventory's group_vars are loaded; it no longer suggests emptying ``/var/lib/cassandra``. A ``nodetool describecluster`` that fails for another reason than a node still starting (e.g. a JMX login refused) now stops the run at once with its error. When no other node of the cluster answers and the inventory's name is the role default, the run stops (``-e cassandra_accept_default_identity=true`` goes on).
  - start_rack playbook - checks that the other nodes belong to the inventory's cluster before it writes the systemd unit of the rack's nodes; with the role default name, a rack that is the whole cluster is refused too (``-e cassandra_accept_default_identity=true`` goes on).
  - cassandra_config role - when a joined node's cluster_name would become the role default ``Test Cluster``, the refusal first asks whether the inventory's group_vars are loaded.
