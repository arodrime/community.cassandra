minor_changes:
  - "Operation playbooks - one screen layout before every risky operation (header with the operation, cluster and running version, one block per node, labelled warnings together), printed in every mode with the question asked below it; decommission_node shows each node's load and share, where its data goes, where it runs and is checked from, and the order."
  - "Operation playbooks - ``--check`` no longer asks for confirmation (``add_node`` with ``cassandra_token_auto: true`` follows bisect instead of asking which plan); it says that nothing will be changed and names the warnings that only concern a real run instead of printing them."
