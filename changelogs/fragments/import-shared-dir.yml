minor_changes:
  - "import_cluster playbook - ``import_cluster_shared_dir=true`` imports a cluster into an inventory directory shared with other clusters (``inventory = ./inventories`` in ansible.cfg, one inventory for all): its hosts go to ``<cluster group>.yml``, its group_vars and host_vars next to the other clusters', and a re-import (``import_cluster_force``) removes or replaces only this cluster's files. A host or group name another cluster already has, a group the user's own inventory files there give hosts, children or vars, a cluster whose name makes the same group as another's, or a hosts file of the other layout stops the import before anything is written."
  - "import_cluster playbook - the first line of every file written names the cluster (``# Written by community.cassandra.import_cluster for <cluster group>``); a re-import never removes or writes over a file another cluster's import wrote. Files written by an earlier release are handled as before in a directory of their own; in a shared directory, they are taken as this cluster's only when its hosts file alone names their group or host, else kept and listed in the report."
  - "import_cluster playbook - ``import_cluster_report_dir`` writes report.txt (and RUNBOOK.md with ``import_cluster_runbook``) to another directory; with ``import_cluster_shared_dir`` it is ``./reports/<cluster group>`` by default, out of the inventory. Without it, report.txt stays in ``import_cluster_dir`` as before. A report.txt the import did not write for this cluster is kept as a backup."
  - "operation playbooks - the environment variable ``CASSANDRA_CLUSTER`` picks the cluster when ``cassandra_hosts`` is not set (``CASSANDRA_CLUSTER=<group> ansible-playbook ...``): an inventory group, or a ``cassandra_cluster_name`` (the cluster group whose hosts have that name). A value that matches nothing, or a name several groups have, stops the run; ``-e cassandra_hosts`` wins over it. The first task shows the cluster group and where it comes from."
  - "help playbook - ``help_runbook_dir`` writes RUNBOOK.md to that existing directory instead of the inventory's; the commands of a cluster imported into a shared directory name it (``-e cassandra_hosts``), and its re-import command goes to that directory with ``import_cluster_shared_dir=true``."
