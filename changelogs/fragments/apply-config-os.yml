minor_changes:
  - "apply_config playbook - covers the OS settings of ``cassandra_linux`` too (kernel settings, limits, transparent huge pages, swap, time sync, the read-ahead and IO scheduler of the data devices), except on a node with ``cassandra_linux_manage: false``: the ones that differ are shown after the config's (under ``OS settings``, each value with the nodes that differ, ``← differs``), and a real run applies them first, on their nodes at once, live: no restart for them. The files a running Cassandra has open keep their read-ahead until it restarts (said under the node). A time sync (chrony, systemd-timesyncd) to install or start on a node where Cassandra runs is a restart instead (``would apply, then restart (time sync)``): in the node's restart window, one node at a time, Cassandra stopped, its clock let sync, then started; the plan says the node's clock offset to its time source when it can be read, with a WARNING when the clock is ahead. A node started by the run (its unit failed and its config written, a resumed run) gets it the same way before its start; a time sync that fails there starts Cassandra again without it and stops the run; a run interrupted in that window, resumed, starts the node again. Only enabling a running time sync stays live; a unit that cannot run on the node (its condition, e.g. systemd-timesyncd in a container) is left out and said."
bugfixes:
  - "cassandra_linux role - removes the swap lines of ``/etc/fstab`` whatever their mount point (``none`` too, as installers write them); turns swap off live only when what it holds fits twice in the memory available, else says it is left on (``swapoff`` would read it back into memory, the OOM killer picking Cassandra); reports the lines it removes from ``/etc/sysctl.conf`` and the ``limits.conf`` block of earlier versions."
