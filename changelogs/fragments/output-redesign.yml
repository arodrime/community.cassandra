minor_changes:
  - "Operator output - the first line of a run names the cluster, its nodes, its datacenters and the running Cassandra version, read from a node (``prod  5 nodes  2 DCs (dc1, dc2)  Cassandra 4.1.12``); it is not repeated at the end, and no longer says how the cluster was chosen (a disagreement between ``-e cassandra_hosts`` and ``CASSANDRA_CLUSTER`` is refused)."
  - "Operator output - the plan before an operation is a block: the operation in capitals then what it does to whom, where (``ADD NODE  node4, node5 into dc1 of prod``), how it does it, the node table, the notes, then the warnings together just before the question, which says the same thing as the title (``Add node4, node5 into dc1 of prod? Answer yes or no:``). Every warning is written ``WARNING  text``, two lines at most, the way out in the second one. The warnings the preflight checks find (unknown variables, JVM options of another Java, nodes left out, the seed layout) go in the plan too."
  - "Operator output - the warnings about the cluster's posture (no authentication on a reachable address, a heap too small or too large, a failure policy ``ignore``, a replace flag left on a member, ``auto_bootstrap`` false) leave the operation plans: ``health_check`` shows them in a SETTINGS block after the nodes' state, two lines each (the setting, its value, the nodes and why it matters; what to do and how to keep it on purpose), and the ``import_cluster`` report says them the same way. ``apply_config`` shows such a setting in its differences table when it writes it."
  - "cassandra_operation role - ``cassandra_suspicious_ack`` is renamed ``cassandra_settings_kept_on_purpose``; the ids do not change (``auto_bootstrap_false``, ``replace_address``, ``heap_size``, ``allow_all_authenticator``, ``failure_policy_ignore``)."
  - "apply_config playbook - the settings that differ are one table, per file: the setting, its change ``from -> to`` and the nodes that change last; the owner and the mode of a file are two settings. The plan says what each node gets in two words (``write + restart``, ``write, no restart``, ``up to date``) and why."
  - "Operation playbooks - a run that stops ends with one block: ``STOPPED at node2: <the cause>`` (``FAILED`` when a task failed), the nodes' table (one word per node), then ``WAY OUT`` with the command to copy, each said once; the cause is no longer printed by the failing task, in the table and again after it. The recap reads ``DONE  rolling_restart  prod  5 restarted  11m30s``."
  - "Operation playbooks - the prepare of new nodes is one line per group of nodes (``node4, node5  prepared  repository, cassandra 5.0.9, java 17.0.12, config (3 files), seeds 10.0.0.1, 10.0.0.2``); the ``Restarting node2...`` and ``Rebooting node2...`` phase lines are gone (the wait line says it)."
