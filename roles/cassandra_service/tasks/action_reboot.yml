---
# Drains the node, reboots the host and waits until Cassandra (enabled at boot)
# has joined again.
- name: Drain the node
  community.cassandra.cassandra_drain:
  module_defaults:
    community.cassandra.cassandra_drain: "{{ _cassandra_service_jmx }}"
  when: cassandra_operation_drain | bool or not cassandra_service_unit_manage | bool  # a kept unit may not drain
  register: cassandra_service_drain
  # the node a resumed run stopped at may be stopped already (node_operation.yml); drained again, it does nothing
  failed_when: >-
    cassandra_service_drain is failed
    and not (_cassandra_resumed_node | default(false) | bool
             and 'Connection refused' in cassandra_service_drain.stderr | default('') ~ cassandra_service_drain.msg | default(''))

- name: Reboot the host
  ansible.builtin.reboot:
    msg: "Rolling reboot of the Cassandra cluster ({{ lookup('community.cassandra.cassandra_hosts') }})"
    reboot_timeout: "{{ cassandra_reboot_timeout | default(1800) }}"
    reboot_command: "{{ cassandra_reboot_command | default(omit) }}"
    boot_time_command: "{{ cassandra_reboot_boot_time_command | default(omit) }}"

- name: Wait until the node has joined
  ansible.builtin.include_tasks: main.yml
  vars:
    cassandra_service_state: started
