bugfixes:
  - cassandra_schema - the nodes were said to agree as soon as one ``nodetool describecluster`` call succeeded, whatever the number of schema versions it listed; the module now counts the versions (the ``UNREACHABLE`` nodes are not one, they are returned in ``unreachable``), polls until one is left (the expected one with ``uuid``) or ``poll`` runs out, then fails with each version and its nodes. The ``health_check`` playbook and the cluster checks of the other playbooks now see a schema disagreement.
  - cassandra_schema - a run whose every ``nodetool describecluster`` call failed crashed (``schema_status`` unset) instead of failing with nodetool's error.
  - cassandra_schema - an expected ``uuid`` the nodes did not agree on was reported as a consensus; it now fails.
