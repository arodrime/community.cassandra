minor_changes:
  - "change_seeds, decommission_node, topology - a datacenter that still has nodes but would be left with no seed (none of its nodes in ``cassandra_seeds``) is no longer refused: 2 or 3 of its nodes up in the ring, on different racks (the ones it already runs with as seeds first), are made its seeds, shown in the plan (``Change seeds: dc2 gets node7 (dc2/rack_b)``) with a WARNING, covered by the question and applied live before any removal. The end gives the ``cassandra_seeds`` line to put in the inventory; later runs keep those seeds and say so while the inventory and the live seeds differ (add_node leaves the seed lists as they are, for change_seeds, when it would have to make new seeds or a datacenter has none of its nodes up). With none of its nodes up it is still refused."
