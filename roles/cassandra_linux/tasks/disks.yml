---
# The disks: the devices of the data and commitlog directories, from the
# filesystem down to the disks (LVM, md RAID, dm-crypt, multipath, partitions),
# or the ones set in cassandra_data_block_devices (and the devices under
# them). Read-ahead is used at the top, the device the filesystem is mounted
# from; the devices under it are tuned too, whatever else they hold
# (module_utils/cassandra_disks.py says why). The lookups only read, so they
# also run in check mode.
- name: Keep the devices set explicitly
  ansible.builtin.set_fact:
    _cassandra_disks_explicit: >-
      {{ (cassandra_data_block_devices + ([cassandra_data_block_device] if cassandra_data_block_device else [])) | unique | list }}

# The real /sys/block is the host's in a container (unless forced by
# cassandra_linux_apply_live): the udev rule is written where what runs at boot
# is set up, sysfs written only live; tests point at a fake tree
- name: Decide whether the disks are tuned here
  ansible.builtin.set_fact:
    _cassandra_data_tuned_here: "{{ cassandra_data_disk_tuning | bool and (_cassandra_linux_boot or cassandra_sysfs_block_root != '/sys/block') }}"
    _cassandra_data_live_here: "{{ _cassandra_linux_live or cassandra_sysfs_block_root != '/sys/block' }}"
    # lvchange sets the read-ahead live and in the metadata at once: only live, on the real devices
    _cassandra_data_lvm_here: "{{ _cassandra_linux_live | bool and cassandra_sysfs_block_root == '/sys/block' }}"

# hints and saved caches are not tuned (read whole, read-ahead helps
# them) but are Cassandra's: a disk under them holds nothing else for them. A
# directory not created yet (cassandra_config comes after this role) is looked
# up through its nearest existing parent: the filesystem it will be on.
- name: Find the filesystem of each Cassandra directory
  ansible.builtin.shell: |
    d={{ item.dir | quote }}
    [ -e "$d" ] || echo "#missing"
    while [ ! -e "$d" ] && [ "$d" != / ]; do d=$(dirname "$d"); done
    findmnt -J -o MAJ:MIN,SOURCE,FSTYPE,TARGET --target "$d"
  loop: >-
    {%- set out = [] -%}
    {%- for d in _tuned -%}
    {%-   set _ = out.append({'dir': d, 'tune': true, 'commitlog': d == cassandra_commitlog_dir | default('')
                                                          and d not in cassandra_data_file_directories | default([])
                                                          and d != cassandra_data_dir | default('')}) -%}
    {%- endfor -%}
    {%- for d in _others if d not in _tuned -%}{%- set _ = out.append({'dir': d, 'tune': false}) -%}{%- endfor -%}
    {{ out }}
  loop_control:
    label: "{{ item.dir }}"
  register: cassandra_data_findmnt
  changed_when: false
  failed_when: false
  check_mode: false
  when: cassandra_data_disk_tuning | bool
  vars:
    # the data dirs as cassandra_config writes them: data_file_directories, by default [data_dir]
    _tuned: >-
      {{ ((([cassandra_data_file_directories] | flatten) if cassandra_data_file_directories is defined
           else [cassandra_data_dir | default('')])
          + [cassandra_commitlog_dir | default('')]) | select | unique | list }}
    _others: >-
      {{ [cassandra_hints_dir | default(''), cassandra_saved_caches_dir | default('')] | select | unique | list }}

- name: Resolve the devices set explicitly (links such as /dev/vg/lv, /dev/disk/by-id/...)
  ansible.builtin.command:
    argv: [readlink, -f, "{{ item }}"]
  loop: "{{ _cassandra_disks_explicit }}"
  register: cassandra_data_explicit
  changed_when: false
  failed_when: false
  check_mode: false
  when: cassandra_data_disk_tuning | bool

- name: Read the block devices
  ansible.builtin.command:
    argv: [lsblk, -J, -o, "NAME,KNAME,MAJ:MIN,TYPE,MOUNTPOINT,FSTYPE"]
  register: cassandra_data_lsblk
  changed_when: false
  failed_when: false
  check_mode: false
  when: cassandra_data_disk_tuning | bool

# with activation/readahead "none" in lvm.conf, LVM leaves the volumes'
# read-ahead to the kernel: the udev rule keeps it then
- name: Read the LVM volumes
  ansible.builtin.shell: |
    lvs -a --noheadings --separator '|' --units s --nosuffix \
      -o lv_kernel_major,lv_kernel_minor,vg_name,lv_name,lv_read_ahead || exit 1
    lvmconfig --typeconfig full activation/readahead 2>/dev/null | sed 's/^/config|/'

  register: cassandra_data_lvs
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cassandra_data_disk_tuning | bool
    - "'\"lvm\"' in cassandra_data_lsblk.stdout | default('')"

# to name what else a tuned filesystem holds (the same read-ahead applies)
- name: List the filesystems of the data directories
  ansible.builtin.command:
    argv: [ls, -A, "{{ item }}"]
  loop: "{{ cassandra_data_findmnt | community.cassandra.cassandra_disk_mount_targets }}"
  register: cassandra_data_mount_contents
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cassandra_data_disk_tuning | bool
    - _cassandra_disks_explicit | length == 0

# lvchange reloads the volume (its I/O suspended a moment), a tuned profile
# switch applies the profiles again: not under a running Cassandra, unless asked
- name: Look for a running Cassandra
  ansible.builtin.shell: |
    systemctl is-active -q cassandra 2>/dev/null && echo running && exit 0
    for c in /proc/[0-9]*/cmdline; do
      tr '\0' '\n' < "$c" 2>/dev/null | grep -qx org.apache.cassandra.service.CassandraDaemon && echo running && exit 0
    done
    exit 0
  register: cassandra_data_running
  changed_when: false
  check_mode: false
  when:
    - cassandra_data_disk_tuning | bool
    - not (cassandra_data_lvchange_running | bool and cassandra_linux_tuned_switch_running | bool)

- name: Decide whether LVM keeps the read-ahead of its volumes
  ansible.builtin.set_fact:
    # LVM keeps it (lvchange done, or to do)
    _cassandra_data_lvm_here: >-
      {{ _cassandra_data_lvm_here | bool
         and cassandra_data_lvs.stdout_lines | default([]) | select('search', '^config.*readahead="?none') | list | length == 0 }}

- name: Decide whether lvchange runs now (not under a running Cassandra)
  ansible.builtin.set_fact:
    _cassandra_data_running: "{{ 'running' in cassandra_data_running.stdout | default('') }}"
    _cassandra_data_lvchange_now: >-
      {{ _cassandra_data_lvm_here | bool
         and (cassandra_data_lvchange_running | bool or 'running' not in cassandra_data_running.stdout | default('')) }}

# (set either way: a fact left by an earlier run of the role in the play would stay)
- name: Pick the devices to tune
  ansible.builtin.set_fact:
    _cassandra_disk_plan: >-
      {{ cassandra_data_lsblk.stdout | default('') | community.cassandra.cassandra_disk_plan(
           cassandra_data_findmnt, cassandra_data_explicit if _cassandra_disks_explicit else none,
           cassandra_data_lvs.stdout_lines | default([]) | reject('match', '^config') | list,
           cassandra_data_mount_contents, cassandra_data_tune_os_volumes)
         if cassandra_data_disk_tuning | bool
         else {'devices': [], 'stacks': [], 'brief': [], 'warnings': [], 'info': [], 'notes': [], 'unusable': []} }}

- name: Keep the devices to tune
  ansible.builtin.set_fact:
    _cassandra_disks: "{{ _cassandra_disk_plan.devices | default([]) | map(attribute='kname') | list }}"

- name: Check the devices under sysfs
  ansible.builtin.stat:
    path: "{{ cassandra_sysfs_block_root }}/{{ item }}/queue"
  loop: "{{ _cassandra_disks }}"
  register: cassandra_data_disk_stat

- name: Refuse data disks that can't be tuned
  ansible.builtin.fail:
    msg: >-
      {{ (_missing or _cassandra_disks_explicit) | join(', ') }} (from cassandra_data_block_device(s)) can't be tuned
      ({{ cassandra_sysfs_block_root }}/<device>/queue not found, a loop device or a part of an LVM volume): set the
      devices the Cassandra filesystems are on (e.g. /dev/sdb, /dev/nvme0n1, /dev/vg/lv, /dev/md0), or leave the
      variables empty to find them from the Cassandra directories.{{ (' ' ~ _said | join('; ')) if _said else '' }}
  vars:
    _said: "{{ _cassandra_disk_plan.warnings | default([]) + _cassandra_disk_plan.notes | default([]) }}"
    _missing: >-
      {{ _cassandra_disk_plan.unusable | default([])
         + (cassandra_data_disk_stat.results | rejectattr('stat.exists') | map(attribute='item') | list) }}
  when:
    - _cassandra_disks_explicit | length > 0
    - _cassandra_data_tuned_here | bool
    - _missing | length > 0 or (_cassandra_disks | length == 0 and _cassandra_disk_plan.os_skipped | default([]) | length == 0)

# RHEL's default profiles (throughput-performance, virtual-guest) set
# readahead=>4096 on every disk, device-mapper and md device when tuned starts
- name: Read the active tuned profile
  ansible.builtin.shell: |
    if systemctl is-active -q tuned 2>/dev/null; then echo "state|active"
    elif systemctl is-enabled -q tuned 2>/dev/null; then echo "state|enabled"
    else exit 0; fi
    # where the profiles of the admin go (tuned 2.23 moved them under profiles/)
    if [ -d /usr/lib/tuned/profiles ]; then echo "dir|/etc/tuned/profiles"; else echo "dir|/etc/tuned"; fi
    echo "version|$(tuned-adm --version 2>&1 | grep -m1 '^tuned-adm ')"
    todo=$(cat /etc/tuned/active_profile 2>/dev/null) seen= n=0
    echo "active|$todo"
    while [ -n "$todo" ] && [ $n -lt 20 ]; do
      n=$((n + 1)); p=${todo%% *}; todo=$(echo ${todo#"$p"})
      case " $seen " in *" $p "*) continue ;; esac; seen="$seen $p"
      for d in /etc/tuned/profiles/$p /etc/tuned/$p /usr/lib/tuned/profiles/$p /usr/lib/tuned/$p; do
        [ -f "$d/tuned.conf" ] || continue
        # tuned.conf: sections, key = value, # comments (also after a value)
        out=$(awk -v p="$p" '/^[[:space:]]*\[/ {s = $0; sub(/#.*/, "", s); gsub(/[][[:space:]]/, "", s); next}
          /^[[:space:]]*(include|summary|type|enabled|devices|devices_udev_regex|priority|replace|drop|readahead|elevator)[[:space:]]*=/ {
            k = $0; sub(/[[:space:]]*=.*/, "", k); gsub(/[[:space:]]/, "", k)
            v = $0; sub(/^[^=]*=[[:space:]]*/, "", v); sub(/[[:space:]]+#.*$/, "", v); sub(/[[:space:]]*$/, "", v)
            print "opt|" p "|" s "|" k "|" v }' "$d/tuned.conf")
        [ -n "$out" ] && echo "$out"
        todo=$(echo $todo $(echo "$out" | sed -n 's/^opt|[^|]*|main|include|//p' | tr ',;' '  '))
        break
      done
    done
  register: cassandra_data_tuned
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - _cassandra_data_tuned_here | bool
    - _cassandra_disks | length > 0
    - cassandra_sysfs_block_root == '/sys/block'

# Read-ahead is one of the worst default settings for Cassandra's read path
# (see the role README): applied now through sysfs, and kept across reboots by
# LVM (lvchange --readahead, in the volume's metadata) for LVM volumes, by a
# udev rule for the others. The scheduler is only switched to none on SSD/NVMe.
- name: Read the page size
  ansible.builtin.command: getconf PAGESIZE
  register: cassandra_linux_pagesize
  changed_when: false
  failed_when: false
  check_mode: false

# The kernel keeps whole pages: 4 KB reads back as 0 with 64 KB pages
- name: Keep the devices found under sysfs, and the read-ahead the kernel reads back
  ansible.builtin.set_fact:
    _cassandra_readahead_read_back: "{{ cassandra_data_readahead_kb | int // _page_kb | int * _page_kb | int }}"
    _cassandra_disk_devices: >-
      {{ _cassandra_disk_plan.devices
         | selectattr('kname', 'in', cassandra_data_disk_stat.results | selectattr('stat.exists') | map(attribute='item') | list)
         | list if _cassandra_data_tuned_here | bool else [] }}
    _cassandra_disk_changes: []
    _cassandra_disk_changes_seen: []
    _cassandra_disk_lvm_failed: []
    _cassandra_disk_tuned: {}
    _cassandra_disk_tuned_deferred: false
  vars:
    _page_kb: "{{ (cassandra_linux_pagesize.stdout | default('4096') | int // 1024) or 1 }}"

- name: Disk tuning for the Cassandra disks
  when: _cassandra_disk_devices | length > 0
  vars:
    _changes: "{{ _cassandra_disk_changes }}"
  block:
    - name: Read the devices
      ansible.builtin.include_tasks: disk_state.yml

    - name: Read the devices' udev ids (stable across reboots, unlike their names)
      ansible.builtin.command:
        argv: [udevadm, info, --query=property, "--name=/dev/{{ item }}"]
      loop: "{{ _cassandra_disk_devices | rejectattr('kind', 'in', ['lvm', 'dm']) | map(attribute='kname') | list }}"
      register: cassandra_data_udev_info
      changed_when: false
      failed_when: false
      check_mode: false

    # tuned (RHEL's default profiles) would set the read-ahead of every disk,
    # device-mapper and md device at each start: a profile of the role's,
    # including the active one(s), keeps them off the Cassandra devices
    - name: Pick the tuned profile keeping the Cassandra devices out
      ansible.builtin.set_fact:
        _cassandra_disk_tuned: >-
          {{ cassandra_data_tuned.stdout_lines | default([]) | community.cassandra.cassandra_disk_tuned_profile(
               _cassandra_disk_devices, _cassandra_disk_state, cassandra_data_udev_info, _cassandra_readahead_read_back)
             if cassandra_linux_tuned_manage | bool and _cassandra_linux_live | bool
                and cassandra_sysfs_block_root == '/sys/block' else {} }}
        # the profile switch left for later: Cassandra runs
        _cassandra_disk_tuned_deferred: >-
          {{ _cassandra_data_running | default(false) | bool and not cassandra_linux_tuned_switch_running | bool }}
        _cassandra_disk_tuned_dir: >-
          {{ cassandra_data_tuned.stdout_lines | default([]) | select('match', '^dir[|]') | map('regex_replace', '^dir[|]', '')
             | first | default('/etc/tuned') }}

    - name: Keep the Cassandra devices out of tuned's profiles
      when: _cassandra_disk_tuned.name is defined
      block:
        - name: Directory of the tuned profile
          ansible.builtin.file:
            path: "{{ _cassandra_disk_tuned_dir }}/{{ _cassandra_disk_tuned.name }}"
            state: directory
            mode: "0755"

        - name: The tuned profile
          ansible.builtin.template:
            src: cassandra-disks.tuned.conf.j2
            dest: "{{ _cassandra_disk_tuned_dir }}/{{ _cassandra_disk_tuned.name }}/tuned.conf"
            mode: "0644"
          register: cassandra_data_tuned_file

        # tuned rolls back what the profiles set and applies them again with
        # this one, live: the same settings (their scripts run again), none on
        # the Cassandra devices. Not under a running Cassandra, unless asked:
        # the profile is written, the switch left for later (said below)
        - name: Add it to the profiles tuned runs
          ansible.builtin.command:
            argv: "{{ ['tuned-adm', 'profile'] + _cassandra_disk_tuned.profiles }}"
          register: cassandra_data_tuned_switch
          changed_when: cassandra_data_tuned_switch.rc == 0
          failed_when: false
          ignore_errors: true  # a timeout too: the settings are applied again below
          timeout: 300
          when:
            - cassandra_data_tuned_file is changed or _cassandra_disk_tuned.active != _cassandra_disk_tuned.profiles
            - not _cassandra_disk_tuned_deferred | bool

        # what the profiles set live again (also when the switch failed: tuned
        # started them before again), over what the role set earlier in this run
        - name: Apply the kernel settings again
          ansible.builtin.command:
            argv: [sysctl, -p, "{{ cassandra_linux_sysctl_file }}"]
          failed_when: false  # no file without settings
          when: cassandra_data_tuned_switch is not skipped and not ansible_check_mode
          changed_when: false

        - name: Disable THP again
          ansible.builtin.systemd:
            name: disable-thp
            state: restarted
          when:
            - cassandra_data_tuned_switch is not skipped
            - not ansible_check_mode
            - thp is defined  # the unit os.yml installs
            - _cassandra_linux_boot | bool
          changed_when: false

        # (also when it failed: tuned started the profiles before again)
        - name: Read the devices again, as tuned left them
          ansible.builtin.include_tasks: disk_state.yml
          vars:
            _cassandra_disk_reread: true
          when: cassandra_data_tuned_switch is not skipped and not ansible_check_mode

    # LVM sets it again whenever it activates or reloads the volume (at boot,
    # lvextend...); left to "auto", it takes the read-ahead of the disk under it
    # (RHEL's tuned: 4 MB). lvchange reloads the volume: a brief suspend of its
    # I/O, once (only when its read-ahead changes).
    # A volume LVM refuses to change (a missing PV, a shared or read-only VG):
    # set through sysfs below, kept by the udev rule instead, and said
    - name: Set the read-ahead of the LVM volumes (kept in their metadata)
      ansible.builtin.command:
        argv: [lvchange, --readahead, "{{ item.after }}", "{{ item.lv }}"]
      loop: "{{ _changes | selectattr('what', 'equalto', 'lvm') | list }}"
      loop_control:
        label: "{{ item.lv }}"
      register: cassandra_data_lvchange
      changed_when: cassandra_data_lvchange.rc == 0
      failed_when: false

    - name: Set the read-ahead
      ansible.builtin.shell: "echo {{ cassandra_data_readahead_kb | int }} > {{ (cassandra_sysfs_block_root ~ '/' ~ item ~ '/queue/read_ahead_kb') | quote }}"
      loop: "{{ _changes | selectattr('what', 'equalto', 'ra') | map(attribute='kname') | list }}"
      timeout: 60  # a device-mapper device suspended meanwhile (a multipath reload): not waited for forever

    # a device-mapper multipath device is the one whose scheduler is used (its
    # paths' are bypassed): any device that has one to choose
    - name: Set the IO scheduler to none (SSD/NVMe)
      ansible.builtin.shell: "echo none > {{ (cassandra_sysfs_block_root ~ '/' ~ item ~ '/queue/scheduler') | quote }}"
      loop: "{{ _changes | selectattr('what', 'equalto', 'scheduler') | map(attribute='kname') | list }}"
      register: cassandra_data_scheduler_set
      changed_when: cassandra_data_scheduler_set.rc | default(1) == 0
      failed_when: false  # some virtual disks reject the switch
      ignore_errors: true  # a timeout too: said as refused
      timeout: 60

    - name: Ensure the udev rules dir exists (absent on minimal images without udev)
      ansible.builtin.file:
        path: /etc/udev/rules.d
        state: directory
        mode: "0755"

    # LVM keeps the read-ahead of its volumes but those lvchange failed on
    - name: Write down the udev rule lines
      ansible.builtin.set_fact:
        _cassandra_disk_lvm_failed: "{{ _lvm_failed }}"
        _cassandra_disk_udev_lines: >-
          {{ _cassandra_disk_devices | community.cassandra.cassandra_disk_udev_rules(
               _cassandra_disk_state, cassandra_data_udev_info, cassandra_data_readahead_kb, _by_lvm,
               cassandra_sysfs_block_root != '/sys/block') }}
      vars:
        _lvm_failed: >-
          {{ cassandra_data_lvchange.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0)
             | map(attribute='item') | list }}
        # by LVM: set now by lvchange (but where it failed), or before
        # (an OS volume: not reloaded, the udev rule keeps it)
        _by_lvm: >-
          {{ (_cassandra_disk_devices | selectattr('kind', 'equalto', 'lvm') | rejectattr('os') | map(attribute='kname')
              | reject('in', _lvm_failed | map(attribute='kname') | list) | list
              if _cassandra_data_lvchange_now | bool else
              _cassandra_disk_devices | selectattr('kind', 'equalto', 'lvm') | rejectattr('os')
              | selectattr('lv_read_ahead', 'equalto', (_cassandra_readahead_read_back | int * 2) | string)
              | map(attribute='kname') | list)
             if _cassandra_data_lvm_here | bool else [] }}

    - name: Keep the settings across reboots (udev rule)
      ansible.builtin.template:
        src: 64-cassandra-data-disk.rules.j2
        dest: /etc/udev/rules.d/64-cassandra-data-disk.rules
        mode: "0644"
      register: cassandra_data_disk_udev
      when: _cassandra_disk_udev_lines | length > 0

    - name: No udev rule needed (LVM keeps the read-ahead of all the devices)
      ansible.builtin.file:
        path: /etc/udev/rules.d/64-cassandra-data-disk.rules
        state: absent
      register: cassandra_data_disk_udev_absent
      when: _cassandra_disk_udev_lines | length == 0


# what earlier versions wrote, replaced by the rule above (or by LVM; or
# nothing: they also tuned the OS's disks)
- name: Remove the udev rules earlier versions of the role wrote
  ansible.builtin.file:
    path: "/etc/udev/rules.d/{{ item }}"
    state: absent
  loop:
    - 60-cassandra-data-disk.rules
    - 61-cassandra-data-disk.rules
  register: cassandra_data_disk_udev_old
  when: _cassandra_data_tuned_here | bool

# What changes on the disks, for the summary below and the change report (not
# a scheduler the device refused, nor the LVM read-ahead lvchange failed to set)
- name: Compare the disk tuning
  ansible.builtin.set_fact:
    _cassandra_disk_items: >-
      {%- set out = [] -%}
      {%- set refused = cassandra_data_scheduler_set.results | default([]) | rejectattr('skipped', 'defined')
                        | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list -%}
      {%- set failed = _cassandra_disk_lvm_failed | map(attribute='kname') | list -%}
      {%- for c in _cassandra_disk_changes_seen if (c.report | default(true) or c.kname in failed)
                                              and not (c.what == 'lvm' and c.kname in failed)
                                              and not (c.what == 'scheduler' and c.kname in refused) -%}
      {%-   set _ = out.append({'item': c.item, 'before': c.before, 'after': c.after}) -%}
      {%- endfor -%}
      {%- if cassandra_data_tuned_file is defined and cassandra_data_tuned_file is changed -%}
      {%-   set _ = out.append({'item': _cassandra_disk_tuned_dir ~ '/' ~ _cassandra_disk_tuned.name ~ '/tuned.conf',
                               'before': 'absent or different', 'after': 'present'}) -%}
      {%- endif -%}
      {%- if _cassandra_disk_tuned.name is defined and _cassandra_disk_tuned.active != _cassandra_disk_tuned.profiles
             and not _cassandra_disk_tuned_deferred | bool
             and (ansible_check_mode or cassandra_data_tuned_switch.rc | default(1) == 0) -%}
      {%-   set _ = out.append({'item': 'tuned profiles', 'before': _cassandra_disk_tuned.active | join(' '),
                               'after': _cassandra_disk_tuned.profiles | join(' ')}) -%}
      {%- endif -%}
      {%- if cassandra_data_disk_udev is changed -%}
      {%-   set _ = out.append({'item': '/etc/udev/rules.d/64-cassandra-data-disk.rules', 'before': 'absent or different',
                               'after': 'present'}) -%}
      {%- endif -%}
      {%- for r in [cassandra_data_disk_udev_absent | default({})] + cassandra_data_disk_udev_old.results | default([]) if r is changed -%}
      {%-   set _ = out.append({'item': r.path | default(r.item | default('')), 'before': 'present', 'after': 'absent'}) -%}
      {%- endfor -%}
      {{ out }}

# How the disks are tuned, kept for the one summary of the run (main.yml):
# what to act on (warnings; info: not tuned yet), and the explanations (notes,
# shown with -v)
- name: Keep how the data disks are tuned
  ansible.builtin.set_fact:
    _cassandra_disk_summary:
      name: "{{ inventory_hostname }}"
      kb: "{{ _cassandra_readahead_read_back }}"
      changed: "{{ _cassandra_disk_items | length > 0 }}"
      brief: "{{ _cassandra_disk_plan.brief | default([]) }}"
      stacks: "{{ _cassandra_disk_plan.stacks | default([]) }}"
      warnings: >-
        {{ _cassandra_disk_plan.warnings | default([])
           + (_cassandra_disk_lvm_failed | map(attribute='lv') | map('regex_replace', '^', 'lvchange failed on ')
              | map('regex_replace', '$', ': its read-ahead is set now, kept by the udev rule') | list)
           + (['tuned: no stable id for ' ~ _cassandra_disk_tuned.unmatched | join(', ')
               ~ ': its profile still sets them'] if _tuned_ok | bool and _cassandra_disk_tuned.unmatched else [])
           + (['tuned-adm profile ' ~ _cassandra_disk_tuned.profiles | default([]) | join(' ') ~ ' failed: '
               ~ (cassandra_data_tuned_switch.stderr | default('') or cassandra_data_tuned_switch.stdout | default('')).splitlines()
                 | first | default('?')] if _tuned_failed | bool else [])
           + (['tuned: ' ~ ('not switched to ' ~ _cassandra_disk_tuned.profiles | join(' ')
               if _cassandra_disk_tuned.active != _cassandra_disk_tuned.profiles else _cassandra_disk_tuned.name ~ ' updated, not reloaded')
               ~ ' under a running Cassandra (the switch applies the profiles again, live)'
               ~ ('; until then they set the read-ahead of the Cassandra devices again at boot'
                  if _cassandra_disk_tuned.active != _cassandra_disk_tuned.profiles else '')
               ~ ': tuned-adm profile ' ~ _cassandra_disk_tuned.profiles | join(' ')
               ~ ', or a run with Cassandra stopped (or cassandra_linux_tuned_switch_running: true)']
              if _tuned_deferred | bool else [])
           + ([_tuned_warn | regex_replace('^WARNING: ', '')] if _tuned_warn and not _tuned_ok | bool and not _tuned_deferred | bool
              else []) }}
      # (Cassandra not looked for, both *_running true: taken as running, the restart said)
      info: >-
        {{ _cassandra_disk_plan.info | default([])
           + (['LVM keeps the read-ahead of its volumes from a run with Cassandra stopped (or'
               ' cassandra_data_lvchange_running: true), the udev rule meanwhile']
              if _lvm_by_udev | length > 0 and _cassandra_data_lvm_here | bool else [])
           + (['restart Cassandra to read the files it has open with the new read-ahead']
              if _cassandra_disk_changes_seen | selectattr('what', 'in', ['ra', 'lvm']) | list | length > 0
                 and not ansible_check_mode and 'running' in cassandra_data_running.stdout | default('running')
              else []) }}
      notes: >-
        {{ _cassandra_disk_plan.notes | default([])
           + (['LVM volumes kept by the udev rule, not by LVM (not applied live, or lvm.conf activation/readahead'
               ' "none"): LVM may set them back when it activates them']
              if _lvm_by_udev | length > 0 and not _cassandra_data_lvm_here | bool else [])
           + (['LVM volumes of the OS kept by the udev rule (never reloaded with lvchange): LVM may set them back'
               ' when it activates them'] if _cassandra_disk_devices | selectattr('kind', 'equalto', 'lvm') | selectattr('os')
               | rejectattr('lv_read_ahead', 'equalto', (_cassandra_readahead_read_back | int * 2) | string) | list
               | length > 0 else [])
           + (['tuned: ' ~ ('would run' if ansible_check_mode else 'runs') ~ ' ' ~ _cassandra_disk_tuned.profiles | join(' ')
               ~ ' (' ~ _cassandra_disk_tuned.name ~ ': nothing set on the Cassandra devices)'] if _tuned_ok | bool else []) }}
  vars:
    # LVM volumes (not the OS's) whose read-ahead LVM doesn't keep yet: the udev rule does
    _lvm_by_udev: >-
      {{ [] if _cassandra_data_lvchange_now | bool else _cassandra_disk_devices | selectattr('kind', 'equalto', 'lvm')
         | rejectattr('os') | rejectattr('lv_read_ahead', 'equalto', (_cassandra_readahead_read_back | int * 2) | string)
         | list }}
    # (no rc: a timeout)
    _tuned_failed: >-
      {{ _cassandra_disk_tuned.name is defined and cassandra_data_tuned_switch is defined
         and cassandra_data_tuned_switch is not skipped and cassandra_data_tuned_switch.rc | default(1) != 0 }}
    _tuned_deferred: >-
      {{ _cassandra_disk_tuned.name is defined and _cassandra_disk_tuned_deferred | bool
         and (cassandra_data_tuned_file | default({}) is changed or _cassandra_disk_tuned.active != _cassandra_disk_tuned.profiles) }}
    _tuned_ok: "{{ _cassandra_disk_tuned.name is defined and not _tuned_failed | bool and not _tuned_deferred | bool }}"
    _tuned_warn: >-
      {{ cassandra_data_tuned.stdout_lines | default([]) | community.cassandra.cassandra_disk_tuned_conflict(
           _cassandra_readahead_read_back, _cassandra_disk_devices, _cassandra_disk_state | default({}),
           cassandra_data_udev_info | default({}), cassandra_linux_tuned_manage | bool, _cassandra_linux_live | bool) }}
  when: _cassandra_data_tuned_here | bool
