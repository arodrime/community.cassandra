---
# A node without result: not reached when it was in the run (stopped before it, or
# unreachable), else left out of the run (--limit).
- name: Summary
  ansible.builtin.debug:
    msg: >-
      {%- set out = [] -%}
      {%- for h in cassandra_service_summary_hosts | default(query('community.cassandra.cassandra_nodes')) -%}
      {%-   set _ = out.append(h ~ ': ' ~ hostvars[h].cassandra_op_result
                                   | default('not reached' if h in ansible_play_hosts_all else 'not in this run (--limit)')) -%}
      {%- endfor -%}
      {{ out | join(_nl) }}
  run_once: true
  vars:
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    cassandra_output: true
