---
# A Cassandra node and a local storage: Medusa backs it up, as the cassandra account
driver:
  name: docker
platforms:
  - name: rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    user: root
  - name: ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    user: root
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        cassandra_medusa_storage_provider: local
        cassandra_medusa_base_path: /var/backups/medusa
        # a single node listening on 127.0.0.1: its name in the backups, as
        # Medusa finds it in the token map
        cassandra_medusa_fqdn: 127.0.0.1
        cassandra_medusa_resolve_ip_addresses: false
verifier:
  name: testinfra
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
