---
# Removes nodes from a running cluster, one at a time: each one streams its
# data to the others (nodetool decommission), then Cassandra is stopped and
# disabled on it. The cluster is checked before and after each node; the run
# stops at the first problem.
#   ansible-playbook -i inventory community.cassandra.decommission_node -e cassandra_leaving_nodes=node7
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo): the playbook asks for it itself, no -b needed.
# A seed: take it out of cassandra_seeds in the inventory (still in it: refused);
# the seed lists of the other nodes then drop it first, cassandra_seeds applied
# live on each of them (change_seeds' way, no restart). Refused too: a
# datacenter that still has nodes afterwards left with no seed (one removed
# whole needs none), and one left with fewer nodes than a keyspace
# has replicas there (cassandra_decommission_force: true goes on, at the cost
# of those replicas).
# CQL credentials, when authentication is on: cassandra_cql_username/_password.
# Resume an interrupted run (skips the nodes already done): add -e cassandra_rolling_resume=true
# A node still leaving from an earlier run is waited for again, one already
# decommissioned is only stopped and disabled; a failed decommission is refused
# (the operator decides: resume it with nodetool decommission, or cancel it).
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Check the nodes to remove
  hosts: "{{ cassandra_leaving_nodes }}"
  gather_facts: false
  become: true
  any_errors_fatal: true  # remove none of them if one is refused
  vars:
    # the nodes of the cluster and the ones to remove (they may be marked cassandra_node_state: absent)
    _cluster: "{{ (query('community.cassandra.cassandra_nodes') + _leaving) | unique }}"
    _leaving: "{{ ansible_play_hosts_all }}"
    _staying: "{{ _cluster | reject('in', _leaving) | list }}"
    _keyspaces: "{{ cassandra_decommission_keyspaces.out | default('') | community.cassandra.cassandra_keyspaces }}"
    _nodes_left: >-
      {%- set out = {} -%}
      {%- for h in _staying -%}
      {%-   set dc = hostvars[h]._cassandra_preflight.cassandra_dc -%}
      {%-   set _ = out.update({dc: out.get(dc, 0) + 1}) -%}
      {%- endfor -%}
      {{ out }}
    _problems: "{{ _keyspaces | community.cassandra.cassandra_replication_problems(_nodes_left) }}"
    # the seeds the nodes run with, cassandra_seeds (filter cassandra_seed_change)
    _dn_seeds: >-
      {%- set l = [] -%}
      {%- for h in _cluster if hostvars[h]._cassandra_preflight is defined -%}
      {%-   set p = hostvars[h]._cassandra_preflight -%}
      {%-   set _ = l.append({'name': h, 'absent': h in _leaving, 'dc': p.cassandra_dc, 'rack': p.cassandra_rack,
                              'names': hostvars[h]._cassandra_service_names | default([h]), 'live': p.live_seeds | default('')}) -%}
      {%- endfor -%}
      {{ l | community.cassandra.cassandra_seed_change(cassandra_seeds) }}
    # the nodes to remove the others still list as a seed (topology changes the seeds as its own step)
    _dn_seed_step: "{{ [] if _cassandra_screen_asked_by | default('') else _leaving | select('in', _dn_seeds.old_hosts) | list }}"
  tasks:
    - name: Load the cassandra_config defaults (the seeds)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: defaults.yml
        public: true

    - name: Check this node
      block:
        - name: A node to remove is in the cluster
          ansible.builtin.assert:
            that: inventory_hostname in groups[lookup('community.cassandra.cassandra_hosts')]
            fail_msg: "{{ inventory_hostname }} is not in the inventory group {{ lookup('community.cassandra.cassandra_hosts') }}"
            quiet: true

        - name: A node in cassandra_seeds can't be removed
          ansible.builtin.assert:
            that: not _cassandra_service_is_seed | bool
            fail_msg: >-
              {{ inventory_hostname }} is in cassandra_seeds: take it out of cassandra_seeds in the inventory;
              decommission_node then applies the new seed list on the other nodes before it removes it.
            quiet: true

        - name: Every datacenter keeps a seed
          ansible.builtin.assert:
            that: _dn_seed_step | length == 0 or _dn_seeds.problems | length == 0
            fail_msg: "{{ _dn_seeds.problems | join(' ') }}"
            quiet: true
          run_once: true

        # A decommission an earlier run started is waited for (or finished) instead
        - name: Where the node stands
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: leaving_node_state.yml

        - name: Read the keyspaces' replication from a node that stays
          community.cassandra.cassandra_cqlsh:
            execute: "SELECT JSON keyspace_name, replication FROM system_schema.keyspaces;"
            transform: raw
            cqlsh_host: >-
              {{ hostvars[_staying[0]].cassandra_rpc_address | default('')
                 if hostvars[_staying[0]].cassandra_rpc_address | default('') not in ['', 'localhost', '0.0.0.0']
                 else '127.0.0.1' }}
            username: "{{ cassandra_cql_username | default(omit, true) }}"
            password: "{{ cassandra_cql_password | default(omit, true) }}"
            debug: true
          delegate_to: "{{ _staying[0] }}"
          run_once: true
          register: cassandra_decommission_keyspaces
          changed_when: false
          check_mode: false  # read-only: --check checks the replicas too

        - name: Every datacenter keeps enough nodes for its replicas
          ansible.builtin.assert:
            that: _problems | length == 0 or cassandra_decommission_force | default(false) | bool
            fail_msg: >-
              {{ ['Removing ' ~ _leaving | join(', ') ~ ' leaves too few nodes:'] + _problems
                 + ['Lower the replication first (ALTER KEYSPACE, then repair), or set cassandra_decommission_force: true:'
                    ~ ' those replicas are then lost, and QUORUM can fail.'] }}
            quiet: true
          run_once: true
      rescue:
        - name: Record the refusal
          ansible.builtin.set_fact:
            cassandra_op_result: >-
              decommission refused: {{ [ansible_failed_result.msg | default('')] | flatten | join(' ') }}{{
                (': ' ~ _err.splitlines() | last) if _err else '' }}{{
                ' (CQL authentication is on: check cassandra_cql_username and cassandra_cql_password)'
                if 'requires authentication' in _err or 'AuthenticationFailed' in _err else '' }}
          vars:
            # cqlsh's own error (reading the replication)
            _err: "{{ ansible_failed_result.err | default('') | trim }}"

        - name: Print the summary
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: summary.yml
          vars:
            cassandra_service_summary_hosts: "{{ ansible_play_hosts_all }}"

        - name: Stop here
          vars:
            cassandra_output: true  # a verdict: its msg as is
          ansible.builtin.fail:
            msg: No node was removed.

    # a leaving seed: cassandra_seeds applied first; the files already right: reloaded only (a run that
    # stopped between the write and the reload); else the seeds are left as they are
    - name: Note whether the seeds are applied first
      ansible.builtin.set_fact:
        _cassandra_decommission_seeds_apply: "{{ _dn_seed_step | length > 0 or not _dn_seeds.step }}"

    - name: Show the plan and confirm the removal
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: screen.yml
      vars:
        cassandra_screen_session_warning: true
        cassandra_screen_question: "Remove {{ _leaving | join(', ') }} from the cluster?"
        cassandra_screen: >-
          {{ _dn_screen | combine({'intro': ([('First, the seed lists drop ' ~ _dn_seed_step | join(', ') ~ ': cassandra_seeds ('
                                            ~ _dn_seeds.new ~ ') written and reloaded live on ' ~ _staying | join(', ')
                                            ~ ' (no restart).')] if _dn_seed_step else []) + _dn_screen.intro}) }}
        _dn_screen: >-
          {{ _states | community.cassandra.cassandra_decommission_screen(_nodes, ring=_ring, keyspaces=_keyspaces, peer=_staying[0],
               replication_problems=_problems if cassandra_decommission_force | default(false) | bool else []) }}
        _states: >-
          {%- set l = [] -%}
          {%- for h in _leaving -%}
          {%-   set _ = l.append({'name': h, 'state': hostvars[h].cassandra_leaving_node.state | default('normal')}) -%}
          {%- endfor -%}
          {{ l }}
        _nodes: >-
          {%- set l = [] -%}
          {%- for h in _cluster if hostvars[h]._cassandra_preflight is defined -%}
          {%-   set p = hostvars[h]._cassandra_preflight -%}
          {%-   set _ = l.append({'name': h, 'address': p.ring_address, 'dc': p.cassandra_dc, 'rack': p.cassandra_rack,
                                  'seed': h in _dn_seed_step}) -%}
          {%- endfor -%}
          {{ l }}
        # as a node that stays sees it now, else as preflight saw it
        _ring: >-
          {{ (hostvars[_leaving[0]].cassandra_leaving_ring | default({})).cluster_status
             | default((cassandra_preflight_status | default({})).cluster_status | default({}), true) }}

# Before the first one leaves: the other nodes stop listing it as a seed
- name: Take the nodes to remove out of the seed lists
  hosts: >-
    {{ query('community.cassandra.cassandra_nodes') | reject('in', query('ansible.builtin.inventory_hostnames', cassandra_leaving_nodes)) | list
       if not _cassandra_screen_asked_by | default('') else 'localhost:!localhost' }}
  gather_facts: false
  become: true
  any_errors_fatal: true  # no removal while a node still lists it
  tasks:
    - name: Apply cassandra_seeds on the nodes that stay
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: seeds_apply.yml
      when:
        - hostvars[query('ansible.builtin.inventory_hostnames', cassandra_leaving_nodes) | first]._cassandra_decommission_seeds_apply | default(false) | bool
        - not ansible_check_mode

- name: Set up the progress file
  hosts: "{{ cassandra_leaving_nodes }}"
  gather_facts: false
  become: true
  vars:
    cassandra_service_node_action: decommission
  tasks:
    - name: Set up the progress file
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: progress.yml

- name: Remove the nodes, one at a time
  hosts: "{{ cassandra_leaving_nodes }}"
  serial: 1
  any_errors_fatal: true
  become: true
  tasks:
    # read again: a decommission may have moved on since the checks (the confirmation, the nodes before this one)
    - name: Where this node stands now
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: leaving_node_state.yml
      when: inventory_hostname not in cassandra_progress_done | default([])

    - name: Remove this node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: decommission
        # the progress lines' [i/n]
        _cassandra_stream_index: "{{ ansible_play_hosts_all.index(inventory_hostname) + 1 }}"
        _cassandra_stream_steps: "{{ ansible_play_hosts_all | length }}"
        cassandra_service_node_checks_after: false  # stopped: checked from another node
        # the other nodes to remove still in the ring: the ones after this one (--check: before it too) that were
        # in it when checked, not done by an interrupted run
        _others_in_ring: >-
          {%- set n = namespace(count=0) -%}
          {%- set mine = ansible_play_hosts_all.index(inventory_hostname) -%}
          {%- for h in ansible_play_hosts_all if h != inventory_hostname and h not in cassandra_progress_done | default([]) -%}
          {%-   if (ansible_check_mode or ansible_play_hosts_all.index(h) > mine)
                   and (hostvars[h].cassandra_leaving_node | default({})).in_ring | default(true) -%}
          {%-     set n.count = n.count + 1 -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ n.count }}
        # this one may be leaving already (an earlier run): its own checks are skipped, UL expected
        _left: >-
          {{ cassandra_leaving_node.state == 'decommissioned'
             or (cassandra_leaving_node.state == 'leaving' and not cassandra_leaving_node.in_ring) }}
        cassandra_service_node_checks_before: "{{ cassandra_leaving_node.state == 'normal' }}"
        cassandra_service_leaving_before: "{{ [cassandra_leaving_node_address] if cassandra_leaving_node.state == 'leaving' else [] }}"
        # the nodes that stay (not the hosts marked cassandra_node_state: absent), the other ones to remove still in the ring
        _staying: "{{ query('community.cassandra.cassandra_nodes') | reject('in', ansible_play_hosts_all) | list | length }}"
        cassandra_service_expected_before: "{{ _staying | int + _others_in_ring | int + (0 if _left | bool else 1) }}"
        cassandra_service_expected_after: "{{ _staying | int + _others_in_ring | int }}"

- name: Summary
  hosts: "{{ cassandra_leaving_nodes }}"
  gather_facts: false
  become: true
  tasks:
    - name: Print the summary
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: summary.yml
      vars:
        cassandra_service_summary_hosts: "{{ ansible_play_hosts_all }}"
    - name: Say what is left to do
      ansible.builtin.debug:
        msg: >-
          {{ ['TO DO', '  1. remove ' ~ ansible_play_hosts_all | community.cassandra.cassandra_node_list
              ~ ' from the inventory (or mark ' ~ _it ~ ' cassandra_node_state: absent)',
              '  2. wipe ' ~ ('its' if _one else 'their') ~ ' data directories (left in place) before reusing the host'
              ~ ('' if _one else 's')] | join(_nl) }}
      run_once: true
      when: not _cassandra_screen_asked_by | default('')  # topology says it once, at its end
      vars:
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        cassandra_output: true
        _one: "{{ ansible_play_hosts_all | length == 1 }}"
        _it: "{{ 'it' if _one | bool else 'them' }}"
