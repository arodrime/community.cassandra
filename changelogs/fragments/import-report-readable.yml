minor_changes:
  - "import_cluster - the report is in two files: ``report.txt`` says what to do and what is worth a look (TO DO, WORTH A LOOK, HAND EDITS, DIFFERENT ON SOME NODES, LEFT AS THE NODES HAVE THEM, WHAT TO DO NEXT), ``report.details.txt`` holds the rest for reference (the words, where the settings go, the settings, versions, convergence, OS tuning, what was read on each node). Each section opens with its title in a rule (``==== TO REVIEW ====``), a blank line between two entries. A setting that differs between nodes is a table (every value with its nodes) with how to give every node one value (the files to edit, what then happens, the check); a file kept by hand comes with the steps to give it back to Ansible (the variables and where, a node's own address said so, the line to remove, the check, the run). WORTH A LOOK also says what the import saw on the nodes: transparent huge pages on, a large read-ahead on the data SSDs (and tuned setting it again), ``Restart=no`` in Cassandra's unit, Medusa installed without its ``medusa.ini``. The details say the lines every node has once, then each node's own (``<node>``, ``<its address>``). The end of the run is report.txt shorter (the tables and files without their steps). The shareable copy holds both files."
  - "ops callback - a line of ``=`` inside a screen, with a title in it (``==== TO REVIEW ====``) or not, is drawn as its heavy rule."
  - "health_check and import_cluster - two more checks of the settings that weaken the cluster: ``large_sizes`` (``batch_size_fail_threshold`` over 1MiB, ``native_transport_max_frame_size`` over 64MiB) and ``jmx_passwords_readable`` (``jmxremote.password`` readable by other users than its owner)."
bugfixes:
  - "import_cluster - with CQL authentication on and no CQL login, a ``--check`` run no longer tells you to set it in ``group_vars/<cluster>/``, a folder only the run without ``--check`` writes: it says that run asks for the login."
  - "import_cluster - the convergence counted a hand edit made the same on every node but for the node's own address (``-Djava.rmi.server.hostname=<its address>``) as one variant per node: one now, said so."
  - "import_cluster - the shareable copy masked the kernel's settings (``vm.swappiness``) as domains and XML closing tags (``</file>``) as paths: kept as they are."
