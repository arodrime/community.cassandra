minor_changes:
  - cassandra_config - new role writing Cassandra's configuration files for 4.0, 4.1 and 5.0 from variables (``cassandra.yaml``, ``cassandra-env.sh``, the JVM options files, ``cassandra-rackdc.properties``, ``logback.xml``), identical to the stock files by default; it shows the diff and asks before changing a node that is already initialized, refuses to change the identity of a joined node (cluster name, tokens, partitioner, snitch, datacenter, rack, 5.0 storage compatibility mode beyond one step), backs up the files it replaces and creates the missing data and log directories (https://github.com/ansible-collections/community.cassandra/issues/334).
