minor_changes:
  - "topology - the plan screen lists the steps in order (adds, seed change, decommissions), each node with its datacenter and rack, then each datacenter once done, then WARNING lines right above the question, under ``--check`` too: the seeds changing on every node (old and new lists), more than half of a datacenter removed. No cap on the number of removals; the refusals are a datacenter left with fewer nodes than a keyspace has replicas there, and a datacenter that still has nodes after the run left with no seed."
  - "topology, add_node, decommission_node - the seeds follow ``cassandra_seeds``. A new host listed in it joins as a regular node (its ``cassandra.yaml`` never lists itself while it bootstraps), then the list is applied live on every node; a node to remove that is no longer in it is first dropped from the other nodes' seed lists (as change_seeds applies them, no restart). topology also applies a seed change with no node to add or remove."
