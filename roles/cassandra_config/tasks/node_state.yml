---
# A disk in /etc/fstab that did not mount (e.g. nofail, after a reboot)
# leaves an empty mount point: the dirs made there would land on the root
# filesystem, and the node would start on empty dirs. Checked for every
# directory, before anything else: without its data, a joined node would
# also look new. (Read with the node: findmnt --fstab, mountpoint.)
- name: Refuse directories on a disk that is not mounted
  ansible.builtin.assert:
    that: _on_unmounted | length == 0
    fail_msg: >-
      {{ _on_unmounted | join(', ') }}: on a mount point of /etc/fstab that is not mounted (what is there
      is on the filesystem below). Mount it first; nothing is changed.
    quiet: true
  vars:
    _on_unmounted: >-
      {%- set out = [] -%}
      {%- for d in cassandra_config_dirs.results | map(attribute='item') -%}
      {%-   for t in cassandra_config_unmounted.stdout_lines | default([]) -%}
      {%-     if d == t or d.startswith(t ~ '/') -%}{%- set _ = out.append(d ~ ' (' ~ t ~ ')') -%}{%- endif -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out }}

# A node that holds a system keyspace has been initialized: in one of the
# data directories of the inventory, its local_system_data_file_directory
# (cassandra_extra_settings), the package's or a tarball's default one, or
# any absolute path written in the live cassandra.yaml outside comment
# lines (an inventory that does not match the node yet). Paths are picked
# from the text, no YAML parsing: no PyYAML needed on the node. A live
# cassandra.yaml that cannot be read counts as initialized, a running
# Cassandra too.
- name: List the absolute paths of the live cassandra.yaml
  ansible.builtin.set_fact:
    # one expression, so the node's text is never in a var that could be templated; a path with a "{"
    # is never kept in the fact either: a "{" item stands for it, and the node counts as initialized.
    # Paths too long to exist are left out.
    _cassandra_config_live_paths: >-
      {%- set text = (cassandra_config_live.content | b64decode if cassandra_config_live.content is defined else '')
                     | regex_replace(_comment_line, '') -%}
      {%- set paths = (text | regex_findall(_plain) + text | regex_findall(_single_quoted)
                       + text | regex_findall(_double_quoted) + text | regex_findall(_line_value) | map('trim') | list)
                      | map('regex_replace', _trailing_slash, '') | reject('search', '[^/]{256}') | select('match', '.{1,4095}$')
                      | unique | list -%}
      {{ paths | reject('search', '{') | list + (['{'] if paths | select('search', '{') | list else []) }}
  vars:
    _comment_line: '(?m)^[ \t]*#.*$'
    _plain: '(?<![^\s\[,''"])/[^\s''",\]}]*'
    _single_quoted: '''(/[^''\n]*)'''
    _double_quoted: '"(/[^"\n]*)"'
    # the rest of a "- /path" or "key: /path" line (trimmed): a path with spaces
    _line_value: '(?m)^[ \t]*(?:-|[\w"'']+[ \t]*:)[ \t]+(/[^#\n]*)'
    _trailing_slash: '(?<=.)/+$'
  no_log: true  # it may hold secrets

# In one go too (config_read.py, its "dirs" step): <dir>/system in each
# candidate; the directories whose mode bits do not let the account
# Cassandra runs as in, tried as that account (its other groups and ACLs);
# in the data dirs, a sample of the keyspace and table dirs another account
# owns (their content is not changed: a recursive chown of TBs is the
# operator's call), said in apply_config's recap
- name: Look for a system keyspace, and into Cassandra's directories
  ansible.builtin.command:
    argv: ["{{ _cassandra_config_python }}", -c, "{{ lookup('ansible.builtin.file', 'config_read.py') }}"]
    stdin: "{{ {'step': 'dirs', 'system': _system, 'tries': _tries | map(attribute='path') | list, 'foreign': _foreign,
                'user': _cassandra_config_perm_settings.user | string} | to_json }}"
  environment:
    LC_ALL: C  # errors in English, as checked below
  register: cassandra_config_read_dirs
  changed_when: false
  check_mode: false  # reads only
  no_log: true  # the paths may hold secrets
  vars:
    _system: >-
      {{ (cassandra_data_file_directories
          + [cassandra_extra_settings.local_system_data_file_directory | default('', true) | string,
             _cassandra_config_default_data_dir, (cassandra_conf_dir | regex_replace('(?<=.)/+$', '') | dirname) ~ '/data/data']
          + _cassandra_config_live_paths | default([]) | select('match', '/') | list)
         | select | map('regex_replace', '(?<=.)/+$', '') | unique }}
    _tries: >-
      {{ cassandra_config_dir_stat.results
         | community.cassandra.cassandra_dir_permission_changes(_cassandra_config_perm_settings.user,
                                                                _cassandra_config_perm_settings.user_group) }}
    _foreign: >-
      {{ cassandra_config_dir_stat.results | selectattr('item.0', 'equalto', 'data dir') | selectattr('stat.isdir', 'defined')
         | selectattr('stat.isdir') | map(attribute='item.1') | list }}

- name: Stop when the directories could not be looked into
  ansible.builtin.fail:
    msg: "{{ (cassandra_config_read_dirs.stdout | from_json).error }}"
  when: (cassandra_config_read_dirs.stdout | from_json).error is defined

# as the tasks that read them one by one registered them (a stat that failed: its msg, no stat)
- name: Note what was found in the directories
  ansible.builtin.set_fact:
    cassandra_config_system: {results: "{{ _read.system }}"}
    cassandra_config_dir_try:
      results: >-
        {%- set out = [] -%}
        {%- for item in _tries -%}{%- set _ = out.append({'item': item, 'rc': _read.tries[loop.index0]}) -%}{%- endfor -%}
        {{ out }}
    cassandra_config_dir_foreign:
      results: >-
        {%- set out = [] -%}
        {%- for r in _stats -%}{%- set _ = out.append({'item': r, 'stdout_lines': _read.foreign[loop.index0]}) -%}{%- endfor -%}
        {{ out }}
  vars:
    _read: "{{ cassandra_config_read_dirs.stdout | from_json }}"
    _tries: >-
      {{ cassandra_config_dir_stat.results
         | community.cassandra.cassandra_dir_permission_changes(_cassandra_config_perm_settings.user,
                                                                _cassandra_config_perm_settings.user_group) }}
    _stats: >-
      {{ cassandra_config_dir_stat.results | selectattr('item.0', 'equalto', 'data dir') | selectattr('stat.isdir', 'defined')
         | selectattr('stat.isdir') | list }}
  no_log: true  # the paths may hold secrets

# (read with the node when systemd runs it: the cassandra unit only)
- name: Look for a running Cassandra
  ansible.builtin.service_facts:
  when: _cassandra_config_unit_state == 'unread'

# Blank or not, as every operation says it (cassandra_node_standing, from what was read here: no
# ring): nothing in its data directories, Cassandra stopped. When not blank: why and, for a node
# started once by mistake (another config) that never joined the real cluster, the dirs to empty
# to start it over.
- name: Tell whether this node is blank
  ansible.builtin.set_fact:
    _cassandra_config_initialized: "{{ not _standing.blank }}"
    _cassandra_config_initialized_why: "{{ _standing.evidence | join(', ') }}"
    _cassandra_config_reset: >-
      {{ '' if not _found else "ONLY if this node never joined the real cluster (e.g. started once with the stock config),
      it can start over, which DELETES its data: stop Cassandra, check these are this node's dirs (not another
      instance's) and empty them: " ~ (_found + cassandra_data_file_directories
      + [cassandra_commitlog_dir, cassandra_saved_caches_dir, cassandra_hints_dir]
      + _cassandra_config_more_dirs | selectattr(0, 'equalto', 'cdc_raw dir') | map(attribute=1) | flatten) | select
      | map('regex_replace', '(?<=.)/+$', '') | unique | join(', ')
      ~ ", then run again." }}
  vars:
    _found: >-
      {{ cassandra_config_system.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir')
         | map(attribute='item') | list }}
    _running: >-
      {{ _cassandra_config_unit_state == 'running' if _cassandra_config_unit_state | default('unread') != 'unread'
         else (ansible_facts.services['cassandra.service'] | default(ansible_facts.services['cassandra'] | default({}))).state
              | default('') == 'running' }}
    # a stat that failed for another reason than "a file, not a dir" or "cannot exist": not checked
    _unchecked: >-
      {{ cassandra_config_system.results | rejectattr('stat', 'defined')
         | map(attribute='msg', default='') | reject('search', 'Not a directory|too long') | list | length > 0 }}
    _standing: >-
      {{ inventory_hostname | community.cassandra.cassandra_node_standing(cassandra_cluster_name, answers=none,
           running=_running, held=_found | map('regex_replace', '$', '/system') | list,
           system=_found | map('regex_replace', '$', '/system') | list,
           live='absent' if not cassandra_config_live_yaml_stat.stat.exists
                else 'unreadable' if cassandra_config_live.content is not defined else 'read',
           unreadable=(['a data dir that could not be checked'] if _unchecked | bool else [])
                      + (['a path with "{" in the live cassandra.yaml'] if '{' in _cassandra_config_live_paths else [])) }}

# Cassandra reads initial_token at a node's first start only: a joined node
# with none in the inventory keeps the one its cassandra.yaml has
- name: Keep the token a joined node was started with
  ansible.builtin.set_fact:
    cassandra_initial_token: "{{ _live }}"
  vars:
    _line: >-
      {{ cassandra_config_live.content | b64decode
         | regex_findall('(?m)^initial_token:[ \t]*(.*?)[ \t]*$') | last | default('') }}
    _live: >-
      {{ _line | regex_replace('\s+#.*$', '') | replace('"', '') | replace("'", '') | trim }}
  when:
    - cassandra_initial_token | string in ['', 'None']
    - _cassandra_config_initialized | bool
    - cassandra_config_live.content is defined
    - _live != ''
