---
minor_changes:
  - "cassandra_repository, cassandra_install - ``cassandra_install_method`` (``repository``, the default, or ``packages``), ``cassandra_install_url``, ``cassandra_install_username`` and ``cassandra_install_password``. With ``packages``, ``cassandra_install`` downloads the package files of ``cassandra_package_version`` (required) from a plain directory (no repository metadata) and installs them (on the RedHat family without their Java dependency), and ``cassandra_repository`` adds no repository and removes the one it added before. ``cassandra_repository_rpm_url``, ``cassandra_repository_deb_url``, ``cassandra_repository_username`` and ``cassandra_repository_password`` still work, as the defaults of the new variables."
  - "cassandra_repository - the URL is checked to be a yum or apt repository before it is added; a plain directory of package files is refused with a message pointing at ``cassandra_install_method: packages``, instead of a repository that breaks every later dnf/apt call."
  - "import_cluster playbook - a node whose Cassandra package no configured repository offers (installed from a file) is reported so, and gets ``cassandra_install_method: packages`` with a note to set ``cassandra_install_url`` for new nodes."
  - "upgrade playbook - with ``cassandra_install_method: packages``, the target version's files are checked to be there before any node is stopped."
