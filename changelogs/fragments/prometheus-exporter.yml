minor_changes:
  - cassandra_config role - runs the Prometheus JMX exporter as a Java agent when ``cassandra_prometheus_exporter_enabled`` is true (off by default). It downloads the exporter's jar (pinned version, sha256 checksum, the mirror's credentials, ``cassandra_offline``), writes its config (the role's Cassandra rules or ``cassandra_prometheus_exporter_config``, optional HTTPS and basic authentication) and adds ``-javaagent:...`` at the end of ``jvm-server.options``; the old jars it downloaded are removed, and everything when it is turned off.
  - apply_config playbook - restarts the nodes for a change of the Prometheus exporter (on, off, port, version) and for its HTTPS, authentication or openTelemetry settings, also when written by another run (a restart pending); new exporter rules alone are written without a restart, their diff shown with secrets masked.
  - operation playbooks - before restarting or starting a node, check that the Prometheus exporter's agent can start (its jar and config readable by Cassandra's account, its port free), and stop with the way out otherwise; ``apply_config`` and ``update_java`` check the port before anything is written, ``upgrade`` gets the jar before it drains a node.
  - cassandra_firewall role - opens the Prometheus exporter's port to ``cassandra_prometheus_exporter_sources`` only, and warns when the list is empty.
  - import_cluster playbook - imports a running Prometheus JMX exporter agent (in a JVM options file, a ``JVM_OPTS`` line of ``cassandra-env.sh``, or a ``cassandra-env.sh`` block that only adds it) into the ``cassandra_prometheus_exporter_*`` variables, with the sha256 of its jar; ``-e import_cluster_carry_exporter_config=true`` carries its config file's content into the inventory.
  - health_check playbook - with the Prometheus exporter on, warns about a node whose exporter does not answer.
