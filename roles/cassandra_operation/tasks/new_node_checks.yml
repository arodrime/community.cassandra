---
# Checks a host before add_node or replace_node installs anything on it, and
# stops once with every problem found: root access, the Cassandra directories
# (mounted where fstab or systemd expects, empty, free space), the Pythons of
# cqlsh and Medusa, the packages and where they come from, the network to the
# seeds it joins with (join_seeds.yml), its own ports free, no Cassandra running, no *_manage: false switch
# import_cluster wrote (host_vars of a node it found) on a host with no Cassandra. Read-only, also
# under --check. Runs after the preflight play (its facts and ring). A host already
# in the ring is left out when _cassandra_new_node_skip_in_ring (add_node
# checks it next). _cassandra_new_node_reset (the node is reset first): leftovers in
# the directories are only warnings, the reset deals with them (or refuses), and
# a running Cassandra too unless _cassandra_new_node_reset_stops is false (add_node's
# reset, on by default, only resets a node where Cassandra is down).
# cassandra_new_node_checks: false skips them all.
- name: Load the defaults of the roles the node gets
  ansible.builtin.include_role:
    name: "community.cassandra.{{ item }}"
    tasks_from: defaults.yml
    public: true
  loop: [cassandra_config, cassandra_install, cassandra_repository, cassandra_medusa]

- name: Check the host before installing anything
  when: cassandra_new_node_checks | bool
  block:
    - name: Is this host in the ring already
      ansible.builtin.set_fact:
        _cassandra_new_node_check_it: >-
          {{ not (_cassandra_new_node_skip_in_ring | default(false) | bool and _address in _ring) }}
      vars:
        _address: "{{ _cassandra_preflight.address | default(inventory_hostname) }}"
        _ring: >-
          {{ (cassandra_preflight_status.cluster_status | default({}) or {}).values() | map(attribute='nodes') | flatten
             | map(attribute='address') | list }}

    # Before the other checks: no use reading the host for a Java it can't get
    - name: The Java the node gets (the series runs on it, a tarball on offer)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_install
        tasks_from: java_check.yml
      when: _cassandra_new_node_check_it | bool

    - name: Gather what the checks need
      ansible.builtin.import_tasks: new_node_read.yml
      when: _cassandra_new_node_check_it | bool
      vars:
        _dirs: "{{ [cassandra_data_file_directories] | flatten + [cassandra_commitlog_dir, cassandra_hints_dir, cassandra_saved_caches_dir] }}"
        # a Cassandra installed already: the package's init script, or a unit of its own
        _cassandra_new_node_units:
          - /etc/systemd/system/cassandra.service
          - /usr/lib/systemd/system/cassandra.service
          - /lib/systemd/system/cassandra.service
          - /etc/init.d/cassandra

    - name: Every problem found
      ansible.builtin.debug:
        msg: "{{ _lines | join(_nl) }}"
      run_once: true
      when:
        - _lines | length > 0
        - not _cassandra_notes_deferred | default(false) | bool  # topology: in its refusal
      vars:
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        cassandra_output: true
        _lines: >-
          {%- set l = [] -%}
          {%- for h in ansible_play_hosts if hostvars[h]._cassandra_new_node_check is defined -%}
          {%-   for p in hostvars[h]._cassandra_new_node_check.problems -%}{%- set _ = l.append(h ~ ': ' ~ p) -%}{%- endfor -%}
          {%- endfor -%}
          {{ l }}

    # the verdict, printed as is by the ops callback (topology: in its refusal, the same failure unmarked)
    - name: Stop before installing anything
      ansible.builtin.fail:
        msg: >-
          {{ _hosts | join(', ') }} {{ 'is' if _hosts | length == 1 else 'are' }} not ready (the problems are listed above):
          nothing was installed. Fix them and run again, or skip these checks with -e cassandra_new_node_checks=false.
          {{ ('Leftovers of a node that never joined (started once by mistake, a failed bootstrap) or of a host replacing itself:'
              ' add_node empties a new node first when it may (Cassandra down, in no ring, cluster this one or the stock'
              " 'Test Cluster', no user keyspace; unless -e cassandra_add_node_reset=false), replace_node with"
              ' -e cassandra_replace_node_reset=true, if they hold nothing you need.') if _leftovers | bool else '' }}
      run_once: true
      when:
        - _hosts | length > 0
        - not _cassandra_notes_deferred | default(false) | bool
      vars:
        cassandra_output: true
        _leftovers: >-
          {{ _hosts | map('extract', hostvars, ['_cassandra_new_node_check', 'problems']) | flatten
             | select('search', 'is not empty|Cassandra is running here') | list | length > 0 }}
        _hosts: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('_cassandra_new_node_check', 'defined')
             | rejectattr('_cassandra_new_node_check.problems', 'equalto', []) | map(attribute='inventory_hostname') | list }}

    - name: Stop before installing anything (topology)
      ansible.builtin.fail:
        msg: >-
          {{ _hosts | join(', ') }} {{ 'is' if _hosts | length == 1 else 'are' }} not ready (the problems are listed above):
          nothing was installed. Fix them and run again, or skip these checks with -e cassandra_new_node_checks=false.
          {{ ('Leftovers of a node that never joined (started once by mistake, a failed bootstrap) or of a host replacing itself:'
              ' add_node empties a new node first when it may (Cassandra down, in no ring, cluster this one or the stock'
              " 'Test Cluster', no user keyspace; unless -e cassandra_add_node_reset=false), replace_node with"
              ' -e cassandra_replace_node_reset=true, if they hold nothing you need.') if _leftovers | bool else '' }}
      run_once: true
      when:
        - _hosts | length > 0
        - _cassandra_notes_deferred | default(false) | bool
      vars:
        _leftovers: >-
          {{ _hosts | map('extract', hostvars, ['_cassandra_new_node_check', 'problems']) | flatten
             | select('search', 'is not empty|Cassandra is running here') | list | length > 0 }}
        _hosts: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('_cassandra_new_node_check', 'defined')
             | rejectattr('_cassandra_new_node_check.problems', 'equalto', []) | map(attribute='inventory_hostname') | list }}
