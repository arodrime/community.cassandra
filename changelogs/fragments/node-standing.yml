---
minor_changes:
  - add_node, topology, reset_node, replace_node, create_cluster playbooks and cassandra_config role - where a node stands (blank, never joined, former member, data not known to be this cluster's, another cluster's, running outside the ring, member, joining, down, leaving or moving, a dead node's address, an address conflict, unknown) is worked out in one place, from what is read on the node once per step (new task file ``node_standing.yml`` of cassandra_service, filter ``community.cassandra.cassandra_node_standing``); each operation decides from it, and the operator guide lists each state, its words and what each operation does with it.
  - preflight playbook - for add_node, topology, reset_node and replace_node, each running node reads the ring it sees, all at once, instead of each target node asking every other node in turn (add_node plans with that ring); a node whose read failed (JMX not listening yet) is asked again; a node alone in its ring (a host not added yet, the package's own instance) does not stand for the cluster while other nodes did not answer.
  - cassandra_config role - its question and its refusals say ``not blank (...)``, with the reasons, instead of ``already initialized``.
  - import_cluster playbook - a ring node it could not read because Cassandra is stopped there is reported in the words of where a node stands (``in the ring, down (DN): Cassandra stopped there``).
bugfixes:
  - add_node playbook - with ``-e cassandra_add_node_reset=false``, a blank node (an old system keyspace left only in the package's default directory) no longer gets cassandra_config's own question after add_node's.
  - add_node playbook - the ring is read from any node of the cluster that answers up and normal (UN), no longer from the first other host of the inventory only (a stopped run when that one was down); a member left out by ``--limit`` is matched by its ``ansible_host`` too.
  - add_node playbook - a node in the ring, up, under its own host ID, is joined even when its system keyspace is not where the inventory says, no longer refused as another node at its address; a host is matched in the ring by any of its addresses (its interfaces, its live cassandra.yaml's, ``ansible_host``) and its host ID, no longer by its listen or default address only.
  - add_node playbook - a host to add that holds nothing but where Cassandra runs, or that runs in another ring, or whose directories or cassandra.yaml could not be read, is refused with the reason, also with ``-e cassandra_new_node_checks=false``; a host the ring sees down while Cassandra runs there is refused as unknown (no longer told to run replace_node).
  - add_node, replace_node playbooks - a system keyspace left in the package's default directory (``cassandra_data_dir``) that neither the inventory nor the live cassandra.yaml use no longer counts as the host's data (said, left as it is): it is not deleted either.
  - replace_node playbook - the new host must be blank in all its Cassandra directories and its live cassandra.yaml's, Cassandra stopped there, and not in the ring but as the dead node it replaces (as add_node checks a new node), no longer only without a system keyspace in the inventory's data directories.
  - create_cluster playbook - a new cluster needs every node blank in all its Cassandra directories (the inventory's and the live cassandra.yaml's), no longer only without a system keyspace in the first data directory.
