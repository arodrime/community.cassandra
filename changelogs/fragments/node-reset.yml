minor_changes:
  - "add_node playbook - new ``cassandra_add_node_reset`` option: a new node that has data but is not in the ring (started once by mistake, a failed bootstrap) is emptied first instead of refused (Cassandra stopped and disabled, what its data, commitlog, saved_caches, hints and cdc_raw directories hold deleted, from the inventory and the live ``cassandra.yaml``, after showing it and a confirmation). The reset is refused on a node an up node of the cluster lists in its ring (or when no other node answers as up), on a running node with other nodes in its ring, on a node whose live ``cassandra.yaml`` names another cluster, and on paths that look wrong (a system directory, a top-level one that is not a mount point, one holding another mount point, the config or the logs)."
  - "replace_node playbook - new ``cassandra_replace_node_reset`` option: a replacement host that still holds data (typically a host replacing itself, with the dead node's own address) is emptied first, the same way; the other nodes may list its address only as the dead node, down."
  - "New reset_node playbook - empties nodes that are not members of the cluster for a fresh start, with the same checks and confirmation; ``--check`` shows what it would delete."
  - "add_node and replace_node playbooks - the checks of the new hosts name the reset options when a host holds data or runs Cassandra."
  - "preflight playbook - reads the cluster from a running node that is not being added or reset (a new node may run the package's own instance)."
