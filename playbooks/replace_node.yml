---
# Replaces a dead node by a blank host, which takes over its tokens and
# streams their data from the replicas (replace_address_first_boot):
#   ansible-playbook -i inventory community.cassandra.replace_node \
#     -e cassandra_new_nodes=node9 -e cassandra_replace_address=10.0.0.14
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo): the playbook asks for it itself, no -b needed.
# In the inventory, put the new host in the cluster's group and take the dead
# one out (the new host may reuse its address). The dead node must be down
# (DN) in the ring and the new host blank. A dead seed: take it out of
# cassandra_seeds with change_seeds first, replace it, then make the new node
# a seed with change_seeds.
# A new host that still holds data, typically one replacing itself (same
# address, e.g. a lost disk or a reinstall): -e cassandra_replace_node_reset=true stops Cassandra
# and empties its directories first (reset_node.yml: refused unless every node
# that lists this host's address sees it down, as the node being replaced;
# what it deletes is on the screen, the one question covers it).
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

# Before anything is installed: every problem of the new hosts at once
- name: Check the new hosts are ready
  hosts: "{{ cassandra_new_nodes }}"
  gather_facts: false
  become: true
  any_errors_fatal: true  # a host that errors must not drop out of the run
  tasks:
    - name: Check this host
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: new_node_checks.yml
      vars:
        _cassandra_new_node_reset: "{{ cassandra_replace_node_reset | default(false) | bool }}"

- name: Check the replacement
  hosts: "{{ cassandra_new_nodes }}"
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    _from: >-
      {{ query('community.cassandra.cassandra_nodes') | reject('in', ansible_play_hosts_all) | first | default('') }}
  tasks:
    - name: Load the cassandra_service defaults (JMX access)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Check this node
      block:
        - name: One replacement at a time
          ansible.builtin.assert:
            that:
              - ansible_play_hosts_all | length == 1
              - cassandra_replace_address | default('') | length > 0
            fail_msg: >-
              Replace one node per run: one host in cassandra_new_nodes, the dead node's address in
              cassandra_replace_address.
            quiet: true

        - name: The replacement can't be a seed
          ansible.builtin.assert:
            that: not _cassandra_service_is_seed | bool
            fail_msg: >-
              {{ inventory_hostname }} is in cassandra_seeds: seeds don't bootstrap, it would take the dead node's
              tokens without its data. Take it out of cassandra_seeds, replace, then make it a seed with change_seeds.
            quiet: true

        - name: Look for data on the new host
          ansible.builtin.stat:
            path: "{{ cassandra_data_dir | default('/var/lib/cassandra/data') }}/system"
          register: cassandra_replace_system

        - name: The new host is blank
          ansible.builtin.assert:
            that: not cassandra_replace_system.stat.exists or cassandra_replace_node_reset | default(false) | bool
            fail_msg: >-
              {{ inventory_hostname }} has data ({{ cassandra_data_dir | default('/var/lib/cassandra/data') }}/system): a replacement
              starts blank. A host replacing itself (a lost disk, a reinstall) whose leftovers are not needed:
              -e cassandra_replace_node_reset=true empties it first.
            quiet: true

        - name: Read the ring from {{ _from }}
          community.cassandra.cassandra_status:
            down: 10000  # read it whatever the state of the nodes
          module_defaults:
            community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
          delegate_to: "{{ _from }}"
          register: cassandra_replace_ring
          failed_when: cassandra_replace_ring.cluster_status is not defined

        - name: The node to replace is dead
          ansible.builtin.assert:
            that: _dead.status | default('') == 'D'
            fail_msg: >-
              {{ cassandra_replace_address | default('(not set)') }} is {{ (_dead.status ~ _dead.state) if _dead else 'not in the ring' }}
              (seen from {{ _from }}): only a dead (DN) node can be replaced.
              {{ 'A live node leaves with decommission_node.' if _dead else '' }}
            quiet: true
          vars:
            _dead: >-
              {{ cassandra_replace_ring.cluster_status.values() | map(attribute='nodes') | flatten
                 | selectattr('address', 'equalto', cassandra_replace_address) | first | default({}) }}
      rescue:
        - name: Record the refusal
          ansible.builtin.set_fact:
            cassandra_op_result: "replace refused: {{ [ansible_failed_result.msg | default('')] | flatten | join(' ') }}"

        - name: Print the summary
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: summary.yml
          vars:
            cassandra_service_summary_hosts: "{{ ansible_play_hosts_all }}"

        - name: Stop here
          vars:
            cassandra_output: true  # a verdict: its msg as is
          ansible.builtin.fail:
            msg: Nothing was replaced.

    # Read-only: what the reset deletes goes on the screen, refused before any question
    - name: Work out the reset of the host (cassandra_replace_node_reset)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: reset_node_plan.yml
      when: cassandra_replace_node_reset | default(false) | bool
      vars:
        cassandra_node_reset_replace_address: "{{ cassandra_replace_address }}"

    - name: Show the plan and confirm the replacement
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: screen.yml
      vars:
        _p: "{{ _cassandra_preflight }}"
        _dead: >-
          {{ cassandra_replace_ring.cluster_status.values() | map(attribute='nodes') | flatten
             | selectattr('address', 'equalto', cassandra_replace_address) | first | default({}) }}
        _dead_dc: >-
          {%- set out = [] -%}
          {%- for dc, info in cassandra_replace_ring.cluster_status.items()
                if info.nodes | default([]) | selectattr('address', 'equalto', cassandra_replace_address) | list -%}
          {%-   set _ = out.append(dc) -%}
          {%- endfor -%}
          {{ out | first | default('?') }}
        cassandra_screen_session_warning: true
        cassandra_screen_question: "Replace {{ cassandra_replace_address }} with {{ inventory_hostname }}?"
        cassandra_screen:
          operation: replace_node
          summary: "replace the dead node {{ cassandra_replace_address | default('(not set)') }} with {{ inventory_hostname }}"
          blocks:
            - title: "{{ inventory_hostname | community.cassandra.cassandra_screen_title(_p) }}"
              lines:
                - >-
                  replaces {{ cassandra_replace_address }} ({{ _dead.status | default('') }}{{ _dead.state | default('') }} in
                  {{ _dead_dc }} / {{ _dead.rack | default('?') }}, load {{ _dead.load | default('?') }}, as {{ _from }} sees it)
                - takes over its tokens and streams their data from the other replicas (hours on a big node)
                - "end state: {{ inventory_hostname }} up and normal (UN) in its place"
          # cassandra_replace_node_reset: what the reset deletes (reset_node_plan.yml), covered by the one question
          warnings: >-
            {{ [{'name': inventory_hostname, 'plan': _cassandra_node_reset_plan}] | community.cassandra.cassandra_reset_warnings
               if _cassandra_node_reset_plan is defined else [] }}

    # The dead node's address may be this host's: seen down there, as expected
    - name: Reset the host first (cassandra_replace_node_reset)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: reset_node.yml
      when: cassandra_replace_node_reset | default(false) | bool
      vars:
        cassandra_node_reset_replace_address: "{{ cassandra_replace_address }}"
        _cassandra_node_reset_confirmed: true  # on the replace_node screen, the one question

- name: Replace the node
  hosts: "{{ cassandra_new_nodes }}"
  serial: 1
  any_errors_fatal: true
  become: true
  tasks:
    - name: Replace
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: replace
        cassandra_service_node_checks_before: false  # not running yet
        cassandra_service_health_down_ok: ["{{ cassandra_replace_address | default('(not set)') }}"]

- name: Summary
  hosts: "{{ cassandra_new_nodes }}"
  gather_facts: false
  become: true
  tasks:
    - name: Print the summary
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: summary.yml
      vars:
        cassandra_service_summary_hosts: "{{ ansible_play_hosts_all }}"
