---
# The run's first line, once per run and cluster (a playbook that imports
# another says it once): the cluster, its nodes and datacenters, then the
# running Cassandra version when the caller read it (_cassandra_banner_version)
#   prod  5 nodes  2 DCs (dc1, dc2)  Cassandra 4.1.12
# In preflight, right after the cluster is read from a running node; on the
# nodes' first play of the read-only playbooks (status, health_check), before
# any read: the line stops after the datacenters.
- name: Say which cluster the run is on
  ansible.builtin.debug:
    msg: >-
      {{ lookup('community.cassandra.cassandra_hosts', banner=true)
         ~ (('  Cassandra ' ~ _cassandra_banner_version) if _cassandra_banner_version | default('') else '') }}
  run_once: true
  when: hostvars['localhost']['_cassandra_cluster_shown'] | default('') != _group
  tags: [always]  # under --tags too
  vars:
    cassandra_output: true  # an operator message (ops callback)
    cassandra_output_info: true  # in the progress colour
    cassandra_output_gap: true  # a line of its own
    _group: &group "{{ lookup('community.cassandra.cassandra_hosts') }}"

- name: Say it once per run
  ansible.builtin.set_fact:
    _cassandra_cluster_shown: "{{ _group }}"
  run_once: true
  delegate_to: localhost
  delegate_facts: true
  become: false  # on the controller
  tags: [always]
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
    _group: *group
