---
# Cluster health before and after a node operation, seen from this node and
# from another node of the cluster. Waits up to cassandra_service_health_timeout
# for down nodes to come back, then fails listing every problem.
#   include_role: name=community.cassandra.cassandra_service tasks_from=cluster_health.yml
# Expects the cluster's inventory group in cassandra_hosts (default 'cassandra').
# cassandra_service_health_node_checks: false checks from the other node only
# (this node has no Cassandra running yet, e.g. before it is added).
# cassandra_service_health_report_only: true only sets cassandra_health_problems
# (no wait, no failure), for read-only reports.
- name: Work out the node count and a second node to check from
  ansible.builtin.set_fact:
    _cassandra_health_expected: >-
      {{ cassandra_service_health_expected_nodes | default(groups[cassandra_hosts | default('cassandra')] | length) | int }}
    _cassandra_health_peer: >-
      {{ groups[cassandra_hosts | default('cassandra')]
         | reject('in', [inventory_hostname]
                        + (query('ansible.builtin.inventory_hostnames', cassandra_new_nodes)
                           if cassandra_new_nodes | default('') | length > 0 else [])
                        + (query('ansible.builtin.inventory_hostnames', cassandra_leaving_nodes)
                           if cassandra_leaving_nodes | default('') | length > 0 else []))
         | first | default(inventory_hostname) }}

- name: Read the cluster state
  module_defaults:
    community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
    community.cassandra.cassandra_statusgossip: "{{ _cassandra_service_jmx }}"
    community.cassandra.cassandra_statusbinary: "{{ _cassandra_service_jmx }}"
    community.cassandra.cassandra_schema: "{{ _cassandra_service_jmx }}"
    community.cassandra.cassandra_netstats: "{{ _cassandra_service_jmx }}"
  vars:
    _node_checks: "{{ cassandra_service_health_node_checks | default(true) | bool }}"
  block:
    - name: Read the ring from this node (waits for down nodes)
      community.cassandra.cassandra_status:
        poll: "{{ [cassandra_service_health_timeout | int // 10, 1] | max }}"
        interval: 10
      register: cassandra_health_self
      changed_when: false
      failed_when: false
      when: _node_checks

    - name: Read the ring from {{ _cassandra_health_peer }}
      community.cassandra.cassandra_status:
        poll: "{{ [cassandra_service_health_timeout | int // 10, 1] | max }}"
        interval: 10
      register: cassandra_health_peer
      delegate_to: "{{ _cassandra_health_peer }}"
      changed_when: false
      failed_when: false

    # Native transport listens on rpc_address (all interfaces for 0.0.0.0)
    - name: Check the storage and CQL ports on this node
      ansible.builtin.wait_for:
        host: "{{ item.host }}"
        port: "{{ item.port }}"
        timeout: "{{ cassandra_service_health_timeout }}"
      loop:
        - name: storage
          host: "{{ _listen if _listen not in ['', 'localhost'] else ansible_facts['default_ipv4']['address'] | default('127.0.0.1') }}"
          port: "{{ cassandra_storage_port | default(7000) }}"
        - name: CQL
          host: "{{ _rpc if _rpc not in ['', 'localhost', '0.0.0.0'] else '127.0.0.1' }}"
          port: "{{ cassandra_native_transport_port | default(9042) }}"
      loop_control:
        label: "{{ item.name }} {{ item.host }}:{{ item.port }}"
      vars:
        _listen: "{{ cassandra_listen_address | default('') }}"
        _rpc: "{{ cassandra_rpc_address | default('localhost') }}"
      register: cassandra_health_ports
      failed_when: false
      when: _node_checks

    - name: Check gossip on this node
      community.cassandra.cassandra_statusgossip:
      register: cassandra_health_gossip
      failed_when: false
      when: _node_checks

    - name: Check the native transport (CQL) on this node
      community.cassandra.cassandra_statusbinary:
      register: cassandra_health_binary
      failed_when: false
      when: _node_checks

    # Bootstraps, decommissions and moves elsewhere show in the ring (UJ/UL/UM)
    - name: Check for streams on this node
      community.cassandra.cassandra_netstats:
      register: cassandra_health_netstats
      failed_when: false
      when: _node_checks

    - name: Check schema agreement (same answer from any node)
      community.cassandra.cassandra_schema:
        poll: 6
        interval: 10
      register: cassandra_health_schema
      delegate_to: "{{ _cassandra_health_peer }}"
      failed_when: false

    - name: List the problems
      ansible.builtin.set_fact:
        cassandra_health_problems: >-
          {{ (([{'from': inventory_hostname, 'result': cassandra_health_self}] if _node_checks else [])
              + [{'from': _cassandra_health_peer, 'result': cassandra_health_peer}])
             | community.cassandra.cassandra_health_problems(_cassandra_health_expected, inventory_hostname,
                 gossip=cassandra_health_gossip if _node_checks else None,
                 binary=cassandra_health_binary if _node_checks else None,
                 netstats=cassandra_health_netstats if _node_checks else None,
                 schema=cassandra_health_schema,
                 ports=cassandra_health_ports if _node_checks else None) }}

- name: Stop on an unhealthy cluster
  ansible.builtin.fail:
    msg: >-
      {{ ['Cluster not healthy, nothing more is done:'] + cassandra_health_problems
         + (['A node is down: restart it first (the server, then Cassandra). If the server can\'t be recovered, replace'
             ~ ' the node (replace_node); removing it for good (remove_dead_node) is the rare last resort.']
            if cassandra_health_problems | select('search', ' is D[NLJM],') | list else []) }}
  when:
    - cassandra_health_problems | length > 0
    - not cassandra_service_health_force | bool
    - not cassandra_service_health_report_only | default(false) | bool

- name: Go on despite the problems (cassandra_service_health_force)
  ansible.builtin.debug:
    msg: >-
      {{ ['WARNING: cassandra_service_health_force is set, going on with an unhealthy cluster.',
          'Taking this node down now can make data unavailable (reads/writes failing at QUORUM) or lose writes:']
         + cassandra_health_problems }}
  when:
    - cassandra_health_problems | length > 0
    - cassandra_service_health_force | bool
    - not cassandra_service_health_report_only | default(false) | bool
