bugfixes:
  - "start_rack - the check after the start runs from a node of the rack and succeeds once every node of the rack is UN; a node outside the rack that is not UN (down, joining, leaving, moving or any other state) or not reached over ssh is no longer waited for and no longer fails the run (an unreachable host outside the rack is counted ignored, the exit code stays 0): a warning lists it (node, state as ``nodetool status`` shows it, ``not reached over ssh``). A node of the rack not UN or not reached still stops the run. The cluster health check takes ``cassandra_service_health_up_ok`` (addresses expected up in any state; empty by default)."
