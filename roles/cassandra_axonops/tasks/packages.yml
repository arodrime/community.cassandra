---
# axon-agent and the Java agent package, as the plan says (_cassandra_axonops_items), from the repositories of the
# host or from package files (cassandra_axonops_package_files). A Java agent package of another series or Java is
# replaced without a moment where the options file cassandra-env.sh loads is missing: Debian installs the new one
# first (it takes the files over, Replaces), then removes the old one; RedHat swaps them in one transaction.
# (Debian: axon-agent's install script runs adduser, absent from minimal images)
- name: Install adduser (Debian & Ubuntu)
  ansible.builtin.apt:
    name: adduser
  when: ansible_facts['os_family'] == 'Debian'

- name: Note what to install
  ansible.builtin.set_fact:
    # name=version (apt), name-version (dnf), the name alone, or the package file on the node; axon-agent first
    _cassandra_axonops_wanted: >-
      {{ _files | map('basename') | map('regex_replace', '^', '/var/cache/cassandra-axonops/') | list
         if _files else [_agent, _java_agent] }}
    _cassandra_axonops_package_change: >-
      {{ _cassandra_axonops_items | map(attribute='item')
         | select('in', ['package axon-agent', 'package ' ~ _cassandra_axonops_java_package]) | list | length > 0 }}
  vars:
    _files: "{{ _cassandra_axonops_files.paths | default([]) }}"
    _sep: "{{ '=' if ansible_facts['os_family'] == 'Debian' else '-' }}"
    _agent: "axon-agent{{ (_sep ~ cassandra_axonops_agent_version) if cassandra_axonops_agent_version | string else '' }}"
    _java_agent: >-
      {{ _cassandra_axonops_java_package }}{{ (_sep ~ cassandra_axonops_java_agent_version)
      if cassandra_axonops_java_agent_version | string else '' }}

- name: Copy the package files
  when:
    - _cassandra_axonops_files.paths | default([]) | length > 0
    - _cassandra_axonops_package_change | bool
  block:
    - name: Create the directory of the package files
      ansible.builtin.file:
        path: /var/cache/cassandra-axonops
        state: directory
        mode: "0755"

    - name: Copy them
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/var/cache/cassandra-axonops/{{ item | basename }}"
        mode: "0644"
      loop: "{{ _cassandra_axonops_files.paths }}"

- name: Install the AxonOps packages (Debian & Ubuntu)
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _cassandra_axonops_package_change | bool
  block:
    # (the cache refreshed: a mirror updated since the last refresh has the pinned version)
    - name: Install them from the repositories
      ansible.builtin.apt:
        name: "{{ _cassandra_axonops_wanted }}"
        allow_downgrade: true
        update_cache: true
      retries: 3
      register: cassandra_axonops_packages
      until: cassandra_axonops_packages is succeeded
      when: _cassandra_axonops_files.paths | default([]) | length == 0

    # (one at a time, axon-agent first: the Java agent package depends on it)
    - name: Install the package files
      ansible.builtin.apt:
        deb: "{{ item }}"
        allow_downgrade: true
      loop: "{{ _cassandra_axonops_wanted }}"
      register: cassandra_axonops_packages_deb
      when: _cassandra_axonops_files.paths | default([]) | length > 0

    - name: Upgrade the Java agent package to the newest
      ansible.builtin.apt:
        name: "{{ _cassandra_axonops_latest }}"
        state: latest
        update_cache: true
      register: cassandra_axonops_packages_latest
      when: _cassandra_axonops_latest | length > 0

- name: Install the AxonOps packages (RedHat)
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _cassandra_axonops_package_change | bool
  block:
    # (the Java agent too, unless it replaces another one: swapped below)
    - name: Install them
      ansible.builtin.dnf:
        name: "{{ _cassandra_axonops_wanted[:1] if _cassandra_axonops_removed else _cassandra_axonops_wanted }}"
        allow_downgrade: true
        disable_gpg_check: "{{ _cassandra_axonops_files.paths | default([]) | length > 0 }}"
      retries: 3
      register: cassandra_axonops_packages_rpm
      until: cassandra_axonops_packages_rpm is succeeded

    # rpm refuses two packages with the same files: the old one out and the new one in, in one transaction (a failed
    # one changes nothing)
    - name: Replace the Java agent package of another series or Java
      ansible.builtin.command:
        argv: >-
          {{ ['dnf', '-y'] + (['--nogpgcheck'] if _cassandra_axonops_files.paths | default([]) else [])
             + ['swap', _cassandra_axonops_removed[0], _cassandra_axonops_wanted[1]] }}
      register: cassandra_axonops_packages_swap
      changed_when: true
      when: _cassandra_axonops_removed | length > 0

- name: Upgrade the Java agent package to the newest (RedHat)
  ansible.builtin.dnf:
    name: "{{ _cassandra_axonops_latest }}"
    state: latest
  register: cassandra_axonops_packages_latest_rpm
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _cassandra_axonops_latest | length > 0

# its options file gone (deleted by hand): the package installed again puts it back
- name: Install the Java agent package again
  ansible.builtin.command:
    argv: >-
      {{ (['apt-get', '-y', 'install', '--reinstall'] if ansible_facts['os_family'] == 'Debian'
          else ['dnf', '-y', 'reinstall']) + _cassandra_axonops_reinstall }}
  register: cassandra_axonops_packages_reinstall
  changed_when: true
  when: _cassandra_axonops_reinstall | length > 0

- name: Note whether the packages changed
  ansible.builtin.set_fact:
    _cassandra_axonops_packages_changed: >-
      {{ [cassandra_axonops_packages, cassandra_axonops_packages_deb, cassandra_axonops_packages_latest,
          cassandra_axonops_packages_rpm, cassandra_axonops_packages_swap, cassandra_axonops_packages_latest_rpm,
          cassandra_axonops_packages_reinstall]
         | select('changed') | list | length > 0 }}

- name: Check the Java agent package left its options file
  ansible.builtin.stat:
    path: /usr/share/axonops/axonops-jvm.options
  register: cassandra_axonops_jvm_options

# (after the install: a stop, what was installed kept)
- name: Stop without the options file cassandra-env.sh loads
  ansible.builtin.fail:
    msg: "{{ _said | join(_nl) }}"
  when: not cassandra_axonops_jvm_options.stat.exists
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    _said:
      - "STOPPED  cassandra_axonops  {{ inventory_hostname }}"
      - "  {{ _cassandra_axonops_java_package }} is installed"
      - "  /usr/share/axonops/axonops-jvm.options is missing"
      - "  Cassandra does not start while cassandra-env.sh loads it"
      - "WAY OUT  make {{ _cassandra_axonops_java_package }} 1.1.0 or later"
      - "  available (pin cassandra_axonops_java_agent_version), then run again"

- name: Remove the Java agent packages of another series or Java (Debian & Ubuntu)
  ansible.builtin.apt:
    name: "{{ _cassandra_axonops_removed }}"
    state: absent
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _cassandra_axonops_removed | length > 0

- name: Remove the other Java agent packages (RedHat)
  ansible.builtin.dnf:
    name: "{{ _cassandra_axonops_removed[1:] }}"
    state: absent
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _cassandra_axonops_removed | length > 1
