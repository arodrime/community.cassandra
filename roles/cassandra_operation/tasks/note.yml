---
# An operator note of a check (a "WARNING  ..." line, or several lines in one
# string): printed as is (the ops callback's operator message), or kept in
# _cassandra_notes (one item per line) when the playbook shows its notes in
# its own plan: _cassandra_notes_deferred (topology, which also keeps its
# refusals) or _cassandra_notes_in_plan (the operation playbooks: the WARNING
# lines go in the plan, screen.yml, just before the question).
#   include_role: name=community.cassandra.cassandra_operation tasks_from=note.yml
#   vars: _note: "WARNING  ..."
- name: Keep the note for the plan
  ansible.builtin.set_fact:
    # one item per line; a line indented under the one before (a seed list, a command) stays with it
    _cassandra_notes: >-
      {%- set items = _cassandra_notes | default([]) | list -%}
      {%- for line in _note.split('\n') if line.strip() -%}
      {%-   if line.startswith(' ') and items -%}{%- set _ = items.append(items.pop() ~ '\n' ~ line.strip()) -%}
      {%-   else -%}{%- set _ = items.append(line.strip()) -%}{%- endif -%}
      {%- endfor -%}
      {{ items | unique }}
  run_once: true
  when: _kept | bool
  vars:
    _kept: "{{ _cassandra_notes_deferred | default(false) | bool or _cassandra_notes_in_plan | default(false) | bool }}"

- name: Say it
  ansible.builtin.debug:
    msg: "{{ _note }}"
  run_once: true
  when: not _kept | bool
  vars:
    cassandra_output: true
    _kept: "{{ _cassandra_notes_deferred | default(false) | bool or _cassandra_notes_in_plan | default(false) | bool }}"
