bugfixes:
  - "rolling operations (rolling_restart, apply_config, add_node...) - the table of a stopped run says what was done to the node it stopped at (``restarted; cluster health check failed``, ``restart started, not finished; ...``, ``not touched; ...``) instead of ``not done``; ``restarted`` only once the node was seen ``NORMAL`` again. A node the run had not got to is ``not touched``, no longer ``not touched (not reached)``."
minor_changes:
  - "rolling operations - a stopped run ends with a block of 79 columns at most: its verdict (``STOPPED  rolling_restart  prod  at node2``), the cause one fact per line, the nodes' table, then ``WAY OUT`` in numbered steps (the resume command and its progress file), and what to do if a node is lost for good (``replace_node``, ``remove_dead_node`` as the last resort); each command cut between its arguments, `` \\`` at the end of each line but its last."
