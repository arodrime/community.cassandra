minor_changes:
  - "add_node and topology playbooks - ``cassandra_add_node_reset`` is now ``auto`` by default: a new node that has data but is not in the ring is emptied first, but only when Cassandra is down on it, no up node of the cluster sees it in its ring and its data does not show it as a member of another ring, its cluster name is this cluster's or the stock ``Test Cluster``, and it has no user keyspace unless it is a failed bootstrap of this cluster (its user keyspaces among the cluster's, read with CQL: refused when they can't be read; a bootstrap ``add_node`` started, marked on the node until it joined). A node of this cluster with its keyspaces but no such mark is a former member (removed with removenode, put back in the inventory): refused, saying the writes only it holds would be lost, unless ``cassandra_add_node_reset`` is ``true`` (``-e cassandra_add_node_reset=true``; ``true`` set in the inventory counts too). Any other word than ``auto``, ``true`` or ``false`` stops the run. Otherwise it is refused with what it holds (size, cluster, user keyspaces, ring, running or down). add_node's screen shows the reset before the question (``node7 (dc1/rack_b): has data (12.0 GiB, cluster 'Test Cluster', not in any ring, down) — will be reset``); a node without data needs nothing; ``-e cassandra_add_node_reset=false`` refuses every new node with data, as before."
breaking_changes:
  - "add_node and topology playbooks - a new node with data that may be reset safely (down, in no ring, of this cluster or ``Test Cluster``) is now emptied first by default instead of refused; ``-e cassandra_add_node_reset=false`` keeps the refusal. A running Cassandra on a new node is refused even with the reset (stop it first)."
