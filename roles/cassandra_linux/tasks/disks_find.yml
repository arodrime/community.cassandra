---
- name: Keep the devices set explicitly
  ansible.builtin.set_fact:
    _cassandra_disks_explicit: >-
      {{ (cassandra_data_block_devices + ([cassandra_data_block_device] if cassandra_data_block_device else [])) | unique | list }}

# apply_config: what tuned-adm or lvchange refused in a restart window of this
# boot (see the end): no restart for it again, said instead
- name: Read what an earlier restart window could not do
  ansible.builtin.command: cat /run/cassandra-apply-config.refused
  register: cassandra_data_window_refused
  changed_when: false
  failed_when: false
  check_mode: false
  when: cassandra_linux_tune_data_disk | bool

# The real /sys/block is the host's in a container (unless forced by
# cassandra_linux_apply_live): the udev rule is written where what runs at boot
# is set up, sysfs written only live; tests point at a fake tree (and, with
# _cassandra_linux_stand_ins, put stand-ins for tuned-adm and the LVM tools
# first on the PATH: driven as real ones, never on the real /sys/block)
- name: Decide whether the disks are tuned here
  ansible.builtin.set_fact:
    _cassandra_data_tuned_here: "{{ cassandra_linux_tune_data_disk | bool and (_cassandra_linux_boot or cassandra_sysfs_block_root != '/sys/block') }}"
    _cassandra_data_live_here: "{{ _cassandra_linux_live or cassandra_sysfs_block_root != '/sys/block' }}"
    # tuned and LVM act on the real devices: only live (or the tests' stand-ins on a fake tree)
    _cassandra_data_tuned_lvm_here: >-
      {{ (_cassandra_linux_live | bool and cassandra_sysfs_block_root == '/sys/block')
         or (_cassandra_linux_stand_ins | default(false) | bool and cassandra_sysfs_block_root != '/sys/block') }}
    _cassandra_disk_refused: "{{ cassandra_data_window_refused.stdout_lines | default([]) }}"

# (_cassandra_linux_stand_ins: set by the e2e tests kept outside the collection)
- name: Check the stand-ins are the tools run (tests)
  ansible.builtin.shell: |
    for c in tuned-adm lvchange; do
      case "$(command -v $c)" in /usr/local/*) ;; *) echo "$c is $(command -v $c), not a stand-in"; exit 1 ;; esac
    done
  changed_when: false
  check_mode: false
  when: _cassandra_linux_stand_ins | default(false) | bool

# hints and saved caches are not tuned (read whole, read-ahead helps
# them) but are Cassandra's: a disk under them holds nothing else for them. A
# directory not created yet (cassandra_config comes after this role) is looked
# up through its nearest existing parent: the filesystem it will be on.
- name: Find the filesystem of each Cassandra directory
  ansible.builtin.shell: |
    d={{ item.dir | quote }}
    [ -e "$d" ] || echo "#missing"
    while [ ! -e "$d" ] && [ "$d" != / ]; do d=$(dirname "$d"); done
    findmnt -J -o MAJ:MIN,SOURCE,FSTYPE,TARGET --target "$d"
  loop: >-
    {%- set out = [] -%}
    {%- for d in _tuned -%}
    {%-   set _ = out.append({'dir': d, 'tune': true, 'commitlog': d == cassandra_commitlog_dir | default('')
                                                          and d not in cassandra_data_file_directories | default([])
                                                          and d != cassandra_data_dir | default('')}) -%}
    {%- endfor -%}
    {%- for d in _others if d not in _tuned -%}{%- set _ = out.append({'dir': d, 'tune': false}) -%}{%- endfor -%}
    {{ out }}
  loop_control:
    label: "{{ item.dir }}"
  register: cassandra_data_findmnt
  changed_when: false
  failed_when: false
  check_mode: false
  when: cassandra_linux_tune_data_disk | bool
  vars:
    # the data dirs as cassandra_config writes them: data_file_directories, by default [data_dir]
    _tuned: >-
      {{ ((([cassandra_data_file_directories] | flatten) if cassandra_data_file_directories is defined
           else [cassandra_data_dir | default('')])
          + [cassandra_commitlog_dir | default('')]) | select | unique | list }}
    _others: >-
      {{ [cassandra_hints_dir | default(''), cassandra_saved_caches_dir | default('')] | select | unique | list }}

- name: Resolve the devices set explicitly (links such as /dev/vg/lv, /dev/disk/by-id/...)
  ansible.builtin.command:
    argv: [readlink, -f, "{{ item }}"]
  loop: "{{ _cassandra_disks_explicit }}"
  register: cassandra_data_explicit
  changed_when: false
  failed_when: false
  check_mode: false
  when: cassandra_linux_tune_data_disk | bool

- name: Read the block devices
  ansible.builtin.command:
    argv: [lsblk, -J, -o, "NAME,KNAME,MAJ:MIN,TYPE,MOUNTPOINT,FSTYPE"]
  register: cassandra_data_lsblk
  changed_when: false
  failed_when: false
  check_mode: false
  when: cassandra_linux_tune_data_disk | bool

# with activation/readahead "none" in lvm.conf, LVM leaves the volumes'
# read-ahead to the kernel: the udev rule keeps it then
- name: Read the LVM volumes
  ansible.builtin.shell: |
    lvs -a --noheadings --separator '|' --units s --nosuffix \
      -o lv_kernel_major,lv_kernel_minor,vg_name,lv_name,lv_read_ahead || exit 1
    lvmconfig --typeconfig full activation/readahead 2>/dev/null | sed 's/^/config|/'

  register: cassandra_data_lvs
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cassandra_linux_tune_data_disk | bool
    - "'\"lvm\"' in cassandra_data_lsblk.stdout | default('')"

# to name what else a tuned filesystem holds (the same read-ahead applies)
- name: List the filesystems of the data directories
  ansible.builtin.command:
    argv: [ls, -A, "{{ item }}"]
  loop: "{{ cassandra_data_findmnt | community.cassandra.cassandra_disk_mount_targets }}"
  register: cassandra_data_mount_contents
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cassandra_linux_tune_data_disk | bool
    - _cassandra_disks_explicit | length == 0

# lvchange reloads the volume (its I/O suspended a moment), a tuned profile
# switch applies the profiles again: not under a running Cassandra, unless asked
- name: Look for a running Cassandra
  ansible.builtin.shell: |
    systemctl is-active -q cassandra 2>/dev/null && echo running && exit 0
    for c in /proc/[0-9]*/cmdline; do
      tr '\0' '\n' < "$c" 2>/dev/null | grep -qx org.apache.cassandra.service.CassandraDaemon && echo running && exit 0
    done
    exit 0
  register: cassandra_data_running
  changed_when: false
  check_mode: false
  when:
    - cassandra_linux_tune_data_disk | bool
    - not (cassandra_data_lvchange_running | bool and cassandra_linux_tuned_switch_running | bool)

- name: Decide whether LVM keeps the read-ahead of its volumes
  ansible.builtin.set_fact:
    # LVM keeps it (lvchange done, or to do): lvchange sets the read-ahead live and in the metadata at once
    _cassandra_data_lvm_here: >-
      {{ _cassandra_data_tuned_lvm_here | bool
         and cassandra_data_lvs.stdout_lines | default([]) | select('search', '^config.*readahead="?none') | list | length == 0 }}

- name: Decide whether lvchange runs now (not under a running Cassandra)
  ansible.builtin.set_fact:
    _cassandra_data_running: "{{ 'running' in cassandra_data_running.stdout | default('') }}"
    _cassandra_data_lvchange_now: >-
      {{ _cassandra_data_lvm_here | bool
         and (cassandra_data_lvchange_running | bool or 'running' not in cassandra_data_running.stdout | default('')) }}

# (set either way: a fact left by an earlier run of the role in the play would stay)
- name: Pick the devices to tune
  ansible.builtin.set_fact:
    _cassandra_disk_plan: >-
      {{ cassandra_data_lsblk.stdout | default('') | community.cassandra.cassandra_disk_plan(
           cassandra_data_findmnt, cassandra_data_explicit if _cassandra_disks_explicit else none,
           cassandra_data_lvs.stdout_lines | default([]) | reject('match', '^config') | list,
           cassandra_data_mount_contents, cassandra_data_tune_os_volumes)
         if cassandra_linux_tune_data_disk | bool
         else {'devices': [], 'stacks': [], 'brief': [], 'warnings': [], 'info': [], 'notes': [], 'unusable': []} }}

- name: Keep the devices to tune
  ansible.builtin.set_fact:
    _cassandra_disks: "{{ _cassandra_disk_plan.devices | default([]) | map(attribute='kname') | list }}"

- name: Check the devices under sysfs
  ansible.builtin.stat:
    path: "{{ cassandra_sysfs_block_root }}/{{ item }}/queue"
  loop: "{{ _cassandra_disks }}"
  register: cassandra_data_disk_stat

- name: Refuse data disks that can't be tuned
  ansible.builtin.fail:
    msg: >-
      {{ (_missing or _cassandra_disks_explicit) | join(', ') }} (from cassandra_data_block_device(s)) can't be tuned
      ({{ cassandra_sysfs_block_root }}/<device>/queue not found, a loop device or a part of an LVM volume): set the
      devices the Cassandra filesystems are on (e.g. /dev/sdb, /dev/nvme0n1, /dev/vg/lv, /dev/md0), or leave the
      variables empty to find them from the Cassandra directories.{{ (' ' ~ _said | join('; ')) if _said else '' }}
  vars:
    _said: "{{ _cassandra_disk_plan.warnings | default([]) + _cassandra_disk_plan.notes | default([]) }}"
    _missing: >-
      {{ _cassandra_disk_plan.unusable | default([])
         + (cassandra_data_disk_stat.results | rejectattr('stat.exists') | map(attribute='item') | list) }}
  when:
    - _cassandra_disks_explicit | length > 0
    - _cassandra_data_tuned_here | bool
    - _missing | length > 0 or (_cassandra_disks | length == 0 and _cassandra_disk_plan.os_skipped | default([]) | length == 0)

# RHEL's default profiles (throughput-performance, virtual-guest) set
# readahead=>4096 on every disk, device-mapper and md device when tuned starts
- name: Read the active tuned profile
  ansible.builtin.shell: |
    if systemctl is-active -q tuned 2>/dev/null; then echo "state|active"
    elif systemctl is-enabled -q tuned 2>/dev/null; then echo "state|enabled"
    else exit 0; fi
    # where the profiles of the admin go (tuned 2.23 moved them under profiles/)
    if [ -d /usr/lib/tuned/profiles ]; then dir=/etc/tuned/profiles; else dir=/etc/tuned; fi
    echo "dir|$dir"
    echo "version|$(tuned-adm --version 2>&1 | grep -m1 '^tuned-adm ')"
    todo=$(cat /etc/tuned/active_profile 2>/dev/null) seen= n=0
    echo "active|$todo"
    while [ -n "$todo" ] && [ $n -lt 20 ]; do
      n=$((n + 1)); p=${todo%% *}; todo=$(echo ${todo#"$p"})
      case " $seen " in *" $p "*) continue ;; esac; seen="$seen $p"
      for d in /etc/tuned/profiles/$p /etc/tuned/$p /usr/lib/tuned/profiles/$p /usr/lib/tuned/$p; do
        [ -f "$d/tuned.conf" ] || continue
        # tuned.conf: sections, key = value, # comments (also after a value)
        out=$(awk -v p="$p" '/^[[:space:]]*\[/ {s = $0; sub(/#.*/, "", s); gsub(/[][[:space:]]/, "", s); next}
          /^[[:space:]]*(include|summary|type|enabled|devices|devices_udev_regex|priority|replace|drop|readahead|elevator)[[:space:]]*=/ {
            k = $0; sub(/[[:space:]]*=.*/, "", k); gsub(/[[:space:]]/, "", k)
            v = $0; sub(/^[^=]*=[[:space:]]*/, "", v); sub(/[[:space:]]+#.*$/, "", v); sub(/[[:space:]]*$/, "", v)
            print "opt|" p "|" s "|" k "|" v }' "$d/tuned.conf")
        [ -n "$out" ] && echo "$out"
        todo=$(echo $todo $(echo "$out" | sed -n 's/^opt|[^|]*|main|include|//p' | tr ',;' '  '))
        break
      done
    done
    # when tuned last loaded its profiles (its start, a switch: tuned-adm writes active_profile), and when the
    # profile of the role last changed: changed since, its reload is to do (not a time ahead of the clock: written
    # before it was stepped back)
    echo "now|$(date +%s)"
    a=$(stat -c %Y /etc/tuned/active_profile 2>/dev/null || echo 0)
    m=$(systemctl show -p ActiveEnterTimestampMonotonic --value tuned 2>/dev/null)
    b=$(awk '/^btime/ {print $2}' /proc/stat 2>/dev/null)
    s=$(( ${b:-0} + ${m:-0} / 1000000 )); [ "${m:-0}" -gt 0 ] 2>/dev/null || s=0
    echo "loaded|$((a > s ? a : s))"
    [ -f $dir/cassandra-disks/tuned.conf ] && echo "file|$(stat -c %Y $dir/cassandra-disks/tuned.conf)"
  register: cassandra_data_tuned
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - _cassandra_data_tuned_here | bool
    - _cassandra_disks | length > 0
    - cassandra_sysfs_block_root == '/sys/block' or _cassandra_linux_stand_ins | default(false) | bool

# Read-ahead is one of the worst default settings for Cassandra's read path
# (see the role README): applied now through sysfs, and kept across reboots by
# LVM (lvchange --readahead, in the volume's metadata) for LVM volumes, by a
# udev rule for the others. The scheduler is only switched to none on SSD/NVMe.
- name: Read the page size
  ansible.builtin.command: getconf PAGESIZE
  register: cassandra_linux_pagesize
  changed_when: false
  failed_when: false
  check_mode: false

# The kernel keeps whole pages: 4 KB reads back as 0 with 64 KB pages
- name: Keep the devices found under sysfs, and the read-ahead the kernel reads back
  ansible.builtin.set_fact:
    _cassandra_readahead_read_back: "{{ cassandra_data_readahead_kb | int // _page_kb | int * _page_kb | int }}"
    _cassandra_disk_devices: >-
      {{ _cassandra_disk_plan.devices
         | selectattr('kname', 'in', cassandra_data_disk_stat.results | selectattr('stat.exists') | map(attribute='item') | list)
         | list if _cassandra_data_tuned_here | bool else [] }}
    _cassandra_disk_changes: []
    _cassandra_disk_changes_seen: []
    _cassandra_disk_lvm_failed: []
    _cassandra_disk_tuned: {}
    _cassandra_disk_tuned_deferred: false
    _cassandra_disk_tuned_window: false
    _cassandra_disk_tuned_reload: false
  vars:
    _page_kb: "{{ (cassandra_linux_pagesize.stdout | default('4096') | int // 1024) or 1 }}"
