---
# Before Cassandra is stopped to restart, rebooted, or started: on a node with the AxonOps agent on
# (cassandra_axonops_enabled), the options file its cassandra-env.sh sources must be there, or the start fails (sh
# stops on a missing sourced file). Cassandra is not stopped nor started then (what the run wrote before is not
# undone).
- name: Look for the AxonOps Java agent's options file
  ansible.builtin.stat:
    path: /usr/share/axonops/axonops-jvm.options
  register: cassandra_operation_axonops_options
  check_mode: false  # reads only
  when: cassandra_axonops_enabled | default(false) | bool

# start_rack's stop (_cassandra_axonops_check_fit): printed as it is, so fitted to 79 columns here; the others'
# (rolling_restart, rolling_reboot, apply_config, sync_clocks) through the stop block of node_operation.yml, which
# says the node and fits it (its way out ends "then resume": numbered there, the resume command its second step)
- name: Stop without the AxonOps Java agent's options file
  ansible.builtin.fail:
    msg: "{{ _start | community.cassandra.cassandra_fit if _cassandra_axonops_check_fit is defined else _block }}"
  when:
    - cassandra_axonops_enabled | default(false) | bool
    - not cassandra_operation_axonops_options.stat.exists | default(true)
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _cause: >-
      /usr/share/axonops/axonops-jvm.options is missing: cassandra-env.sh sources it (cassandra_axonops_enabled),
      Cassandra would not start
    _apply: run apply_config (it installs the AxonOps Java agent package again)
    _start:
      - "STOPPED  {{ inventory_hostname }}  Cassandra not started"
      - "  {{ _cause }}"
      - "WAY OUT  {{ _apply }}, then run this again"
    _block:
      - "{{ _cause }}"
      - "WAY OUT  {{ _apply }}, then resume"
