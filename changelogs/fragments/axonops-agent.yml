minor_changes:
  - cassandra_axonops role - new role. Installs the AxonOps agent (``axon-agent``) and the AxonOps Java agent package built for the node's Cassandra series (4.0, 4.1, 5.0) and Java, from AxonOps' repository, a mirror of it or package files (air-gapped; named as AxonOps' repositories serve them, a relative path read from the inventory's directory), adds Cassandra's account and ``axonops`` to each other's group, writes ``/etc/axonops/axon-agent.yml`` and keeps ``axon-agent`` running. Its settings, the node's state (a package left half done, a missing account) and the packages the repositories lack are refused before any change, ``--check`` too. The yum repository it adds is ``skip_if_unavailable`` (a mirror that fails stops no other dnf run). Never restarts Cassandra.
  - cassandra_config role - with ``cassandra_axonops_enabled`` true, sources ``/usr/share/axonops/axonops-jvm.options`` at the end of ``cassandra-env.sh`` (the AxonOps Java agent); refuses to write it when the file is missing, and refuses a second loader (the JVM options, the ``cassandra-env.sh`` snippet, ``JVM_OPTS`` or ``JVM_EXTRA_OPTS`` of ``cassandra_service_environment``, a ``cassandra-env.sh`` template of ``cassandra_config_template_overrides`` that does not write ``{{ _cassandra_config_axonops_line }}``).
  - cassandra_config role - ``cassandra-env.sh`` gets a ``# Custom settings`` line above the lines the collection adds at its end (the AxonOps line, the ``cassandra-env.sh`` snippet of ``cassandra_config_template_snippets``), only when there are some (a cluster with neither keeps the same file). On a node already written, ``apply_config`` sees that one comment line as the same settings and leaves the file as it is: the line comes with the next change of the file, or with ``cassandra_config_normalize: true`` (a restart). ``import_cluster`` reads the line as the role's, never into the snippet.
  - create_cluster, add_node, replace_node, add_datacenter and apply_config playbooks - apply the cassandra_axonops role when ``cassandra_axonops_enabled`` is true, before the config is written (``add_node`` and ``replace_node`` check its settings and reach its repository with their other checks); ``apply_config`` shows the agent's and its repository's changes in its plan (section "AxonOps agent", no restart for them; secrets never shown) and restarts each node once for the ``cassandra-env.sh`` line.
  - upgrade, update_java and apply_config playbooks - refuse, before any change and under ``--check`` too, an upgrade or a Java change of the nodes with ``cassandra_axonops_enabled`` true (not supported yet).
  - rolling_restart, rolling_reboot, start_rack and apply_config playbooks - on a node with ``cassandra_axonops_enabled`` true, stop before its restart or start when ``/usr/share/axonops/axonops-jvm.options`` is missing (Cassandra would not start), with the way out.
