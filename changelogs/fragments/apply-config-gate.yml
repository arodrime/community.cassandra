---
minor_changes:
- "apply_config playbook - the compare of ``cassandra_config`` runs the role's plan on every node (``tasks/plan.yml``: its reads, compares and lists), and the rest of the role (``tasks/apply_plan.yml``) only where the plan lists something to write; the checks of the variables run once for the nodes whose values they read are the same (a warning or a refusal they share is said once, naming them); the other screens are the same, the report says how many nodes the plan found unchanged. ``-e apply_full=true`` runs the rest everywhere, the checks per node and does not compare the users' ``~/.cassandra`` files, as before; ``-e apply_verify=true`` runs it everywhere too and stops on a node whose facts it changed although the plan found nothing."
- "apply_config playbook - ``-e apply_only=<parts>`` (``config``, ``unit``, ``java``, ``linux``, ``install``, ``repository``, ``medusa``, ``firewall``, ``axonops``) compares and applies only those parts, ``config`` and ``unit`` always; the plan, the recap and the report say the parts left out. An unknown part, or a part left out that a node needs (a newer release, the AxonOps agent, another Java), stops the run before any change, with the command to run. A resumed run (``-e cassandra_rolling_resume=true``) applies the parts the interrupted one recorded with its progress file: other parts stop it before any change, with the command that resumes with them; a progress file with no record (an earlier version's run, which applied every part) stops it too unless ``-e apply_only`` is given (``all``: every part), with the commands to resume with every part or to start over."
trivial:
- "cassandra_config role - its tasks split into the plan (``plan.yml``: the reads, compares and lists, the JMX users' files compared there too) and the rest (``apply_plan.yml``); ``main.yml`` runs both, as before."
