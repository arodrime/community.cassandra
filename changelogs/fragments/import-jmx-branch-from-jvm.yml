- "import_cluster playbook - the remote JMX branch of ``cassandra-env.sh`` is known to be the one taken from the running JVM's arguments (its remote JMX port, not the local one), no longer from the file's default ``LOCAL_JMX=no``: a ``LOCAL_JMX=yes`` from an ``EnvironmentFile`` or ``/etc/default/cassandra`` keeps the node's lines in that branch as hand edits."
