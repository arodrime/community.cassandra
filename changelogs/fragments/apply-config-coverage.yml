minor_changes:
  - >-
    apply_config - ignores no setting: every variable of the roles has its category (live, a restart, a procedure of
    its own, refused) in ``plugins/plugin_utils/cassandra_apply_config_coverage.py``, which a unit test keeps complete.
    The repository, the packages and tools (jemalloc, cqlsh's Python, dsbulk) and the firewall are compared in the
    plan and applied live (jemalloc said for the next restart); a node running another Java than
    ``cassandra_java_version`` gets it installed and checked in its one restart, as ``update_java`` does (their plan,
    install and check now shared); what the ``cassandra`` unit gives the running Cassandra (user, limits,
    environment) is compared with the running JVM's, a difference restarting it, the unit written in that restart.
  - >-
    apply_config - a newer release of the node's series (``cassandra_package_version``) is applied in the node's one
    restart: the package updated with Cassandra stopped (the upgrade's own step), the config written again, the
    release it runs checked. It stops before any change when the release would not start with the node's settings,
    or is newer than the releases the collection's notes cover (``-e cassandra_allow_unknown_patch=true`` once its
    NEWS.txt is read); the notes of the releases a node crosses are said in the plan.
bugfixes:
  - >-
    apply_config - another series than the one a node runs stopped the run at the config compare with "set
    cassandra_version to the installed series" (and ``--check`` showed the other series' config as differences); it
    now stops before any change with the upgrade's command (``upgrade -e cassandra_upgrade_phase=preflight``). An
    older release, a host not in the ring, a host marked absent still in it, and a joined node's
    ``cassandra_initial_token`` that is not its token stop it too, with the way out; ``--check`` says them in its
    recap.
