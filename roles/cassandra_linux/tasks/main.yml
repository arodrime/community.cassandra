---
# (set either way: what an earlier run of the role in the run found would be
# summed up or reported again, e.g. apply_config's compare in check mode)
- name: Forget what an earlier run of the role found
  ansible.builtin.set_fact:
    _cassandra_disk_summary: {}
    _cassandra_linux_items: []
    _cassandra_disk_items: []

# cassandra_linux_manage: false (e.g. set by import_cluster on a node set up
# by other means): this node's OS settings are left as they are
- name: OS settings for Cassandra
  ansible.builtin.import_tasks: os.yml
  when: cassandra_linux_manage | bool

- name: Say the OS settings are left as they are
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: cassandra_linux_manage is false, its OS settings (kernel, limits, THP, swap, time
      sync, disks) are left as they are.
  when:
    - not cassandra_linux_manage | bool
    - not _cassandra_linux_quiet | default(false) | bool  # (apply_config: said its own way)

# One summary for the nodes of the run, the ones with the same disks grouped
# (not under the conditions above: run_once would skip it for every node when
# the first one has its OS settings left alone). In a prepare of new nodes
# (_cassandra_prepare_lines), said after its step lines instead (cassandra_service
# prepare_lines.yml).
- name: Say how the data disks are tuned
  ansible.builtin.debug:
    msg: "{{ _nodes | community.cassandra.cassandra_disk_summary(check=_cassandra_linux_check, verbose=ansible_verbosity | int > 0) }}"
  run_once: true
  when:
    - _nodes | length > 0
    - not _cassandra_linux_quiet | default(false) | bool
    - not _cassandra_prepare_lines | default(false) | bool
  vars:
    cassandra_output: true
    cassandra_output_info: true  # in the progress colour, except the WARNING lines (ops callback)
    cassandra_output_gap: true  # a block of its own (ops callback)
    _nodes: >-
      {{ ansible_play_batch | map('extract', hostvars) | selectattr('_cassandra_disk_summary', 'defined')
         | map(attribute='_cassandra_disk_summary') | select | list }}
