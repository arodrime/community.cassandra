minor_changes:
  - "cassandra_service - new role running Cassandra under a native systemd unit (``cassandra_user`` and ``cassandra_group``, drain on stop with ``cassandra_service_drain_on_stop``, limits, ``cassandra_service_environment``), enabling and starting it, then waiting until the node is ``NORMAL``; the wait stops as soon as the service is down (Cassandra failed to start), with the end of its journal. Before writing the unit the role refuses an account that does not exist or could not read the files ``cassandra_config`` writes, and it records the config files the node started with, so that a change still to apply is told by content. ``cassandra_service_unit_manage: false`` keeps a unit of your own (https://github.com/ansible-collections/community.cassandra/issues/334)."
