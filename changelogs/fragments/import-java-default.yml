minor_changes:
  - >-
    import_cluster - a node whose ``/usr/bin/java`` is another Java than the one its running Cassandra uses (their Java homes compared) gets ``cassandra_java_set_default: false``, in the cluster's group_vars when every node was read and does, else in its host_vars, so ``site.yml`` after the import leaves the system java as it is; the report says why in a ``SYSTEM JAVA`` line, with what ``true`` would do. A node with no ``/usr/bin/java`` gets nothing (the roles make one). A Java updated while Cassandra runs (a RHEL JDK update) is read as its new build of the same major, with a restart pending said in the node's notes; a node whose unit points ``JAVA_HOME`` at the Java gone is not imported (the error says to fix it with ``systemctl edit cassandra`` and restart first).
  - >-
    update_java - refuses, before any node is restarted, the nodes with ``cassandra_java_set_default: false`` whose ``JAVA_HOME`` (``cassandra_service_environment``, or the unit itself when it is kept; resolved) is not the new Java's home, or with a package Java not installed yet: Cassandra would restart on their old Java. A kept unit's ``JAVA_HOME`` is edited by hand (``systemctl edit cassandra``).
