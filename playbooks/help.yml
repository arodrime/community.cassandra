---
# What the inventory describes and what can be done with it, read from the
# inventory alone (no node contacted, changing nothing):
#   ansible-playbook -i inventory community.cassandra.help
# 1. each cluster group of the inventory: cluster name, Cassandra series and
#    package version, install method, Java, datacenters, racks and their nodes,
#    seeds, the nodes marked cassandra_node_state: absent;
# 2. every operation playbook, by theme, with its command for this inventory
#    (its path, the cluster's group when it is needed, a datacenter and rack, the -e
#    variables it needs; NEW_NODE, NODE...: a value only you know);
# 3. advice from the inventory: nodes marked absent, authentication on without
#    cassandra_cql_username, a variable close to one the collection reads,
#    seeds not one per rack, racks vs allocate_tokens_for_local_replication_factor,
#    mixed versions.
# -e help_topic=<operation>: one operation in detail (its command, its options
# with their defaults, an example, its documentation).
# Shown as plain text with callback_result_format = yaml in ansible.cfg
# ([defaults]) or ANSIBLE_CALLBACK_RESULT_FORMAT=yaml; else as a list of quoted lines.
# -e help_write=true: also writes it as RUNBOOK.md in the inventory's dir
# (changed only when its content changes; --check --diff shows the difference),
# to commit with the inventory (-e help_runbook_dir=<dir>: in that dir
# instead). -e help_inventory=<path> reads that inventory instead of the run's.
# help decrypts nothing, even with the vault password: vault-encrypted vars
# files are skipped (named in the advice), inline vaulted values shown as
# (vaulted), lookups not run, -e variables not read, so no secret reaches the
# output or RUNBOOK.md. The commands carry the vault and connection options
# help was run with (no -b: the playbooks ask for root on the nodes themselves;
# --ask-vault-pass when the inventory has vaulted values and the run no vault
# password). A vault-encrypted file in group_vars/all is read by Ansible for
# localhost too: then help needs the vault password as well (and still shows
# nothing from it).
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts), else every top
# group (one per cluster).
# No root anywhere (no node contacted).
- name: Help
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
    ansible_connection: local  # never an inventory's ssh to localhost
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _model: >-
      {{ lookup('community.cassandra.cassandra_inventory',
                sources=[help_inventory] if help_inventory | default('', true) else []) }}
    # made absolute here: copy would take a relative path from its own working directory
    _runbook_dir: "{{ help_runbook_dir | expanduser | realpath if help_runbook_dir | default('', true) else '' }}"
    _playbooks: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/*.yml') | map('basename') | map('splitext') | map('first') | list }}"
  tasks:
    - name: Read the inventory
      ansible.builtin.set_fact:
        _cassandra_help_model: "{{ _model }}"

    # one string under the default callback's yaml result format (plain text, not
    # wrapped), else a list of lines (not one line with \n in it), the default
    # callback's json one saying how to get plain text
    - name: Show the help
      ansible.builtin.debug:
        msg: "{{ _text if _yaml | bool else ([_plain, ''] if _default | bool else []) + _text.split('\n') }}"
      when: help_show | default(true) | bool  # false: RUNBOOK.md only (import_cluster_runbook)
      vars:
        _default: "{{ lookup('ansible.builtin.config', 'DEFAULT_STDOUT_CALLBACK') in ['default', 'ansible.builtin.default'] }}"
        _yaml: >-
          {{ _default | bool and lookup('ansible.builtin.config', 'result_format', plugin_type='callback',
                                        plugin_name='default', on_missing='skip') == 'yaml' }}
        _plain: "Plain text, without the quotes: callback_result_format = yaml in ansible.cfg ([defaults])"
        _text: >-
          {{ _cassandra_help_model | community.cassandra.cassandra_help(
               _playbooks, topic=help_topic | default(''),
               header=lookup('ansible.builtin.file', playbook_dir ~ '/' ~ help_topic ~ '.yml')
                      if help_topic | default('') in _playbooks else '') }}

    - name: Write RUNBOOK.md next to the inventory
      ansible.builtin.copy:
        content: >-
          {{ _cassandra_help_model | community.cassandra.cassandra_help(_playbooks, markdown=true,
                                                                        runbook_dir=_runbook_dir) }}
        dest: "{{ _cassandra_help_model | community.cassandra.cassandra_help_runbook(_runbook_dir) }}"
        mode: "0644"
      when: help_write | default(false) | bool
