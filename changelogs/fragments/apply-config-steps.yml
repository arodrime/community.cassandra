minor_changes:
- "apply_config playbook - one phase line per step of the run (the checks, the compare, the checks from each node under ``--check``; the OS settings, the config written at once, the config staged in a real run). Under the ops callback each one is a step: on a terminal its line is rewritten in place with the nodes through the task running and the time since it started (``4/24  1m12s``), then ``done in 4m12s`` once over; in a log or a pipe, the phase line, a line every 5 minutes and the ``done in`` line (``cassandra_output_step``, operator output guide)."
