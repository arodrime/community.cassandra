minor_changes:
  - "apply_config - new playbook that applies the inventory's config and OS settings (``cassandra_linux``'s) to a running cluster. Every node is compared first: the settings that differ are shown side by side (the inventory's value, then each other value with its nodes, secrets masked), with what each node will get (written only, restarted, started, left stopped), then one question (``--check`` shows the plan and changes nothing). The OS settings that apply live are applied on their nodes at once; the nodes whose change needs no restart are written at once; the others are written and restarted one at a time, the cluster checked healthy before and after each, stopping at the first problem. A node is restarted only for a change Cassandra has not picked up (the config files it started with are recorded on the node at each start); the OS settings that need Cassandra stopped (a time sync to install, the disk settings) are done in that restart. ``-e cassandra_rolling_resume=true`` resumes an interrupted run (https://github.com/ansible-collections/community.cassandra/issues/334)."
  - "change_seeds - new playbook that writes ``cassandra_seeds`` on every node and reloads it live (``nodetool reloadseeds``, no restart), after one question; a datacenter the list would leave without a seed keeps or gets seeds of its own there (said in a warning, with the line to put in the inventory). A reload that fails fails the run; a later run reloads the nodes whose list was written but not reloaded (https://github.com/ansible-collections/community.cassandra/issues/334)."
