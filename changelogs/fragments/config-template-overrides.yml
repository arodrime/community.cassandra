minor_changes:
  - "cassandra_config role - ``cassandra_env_extra_lines`` adds lines at the end of ``cassandra-env.sh``, ``cassandra_logback_extra_lines`` at the end of ``logback.xml``'s ``<configuration>``, as they are."
  - "cassandra_config role - ``cassandra_config_template_overrides`` gives a config file your own template (``{file name: absolute path on the controller}``), rendered instead of the role's with the same variables and handled as the role's own file (owner and mode, masked diff and question, ``--check``, report, the restart ``apply_config`` does for it). A name the role does not write, a relative or missing path, or a file also in ``cassandra_config_keep_files`` is refused before anything is read."
  - "import_cluster playbook - the lines a node has at the end of ``cassandra-env.sh`` or of ``logback.xml``'s ``<configuration>`` are carried as ``cassandra_env_extra_lines`` and ``cassandra_logback_extra_lines`` (none of them when one sets what a variable or the role's files set, or when they do not make a whole), so that the self-check passes without keeping the file as it is; a secret in such a line or in a JVM option (named as the output masks secrets) goes to ``secrets.yml`` (vaulted, as the passwords) as a ``cassandra_secret_<file>_<name>`` variable the line refers to, never in clear in ``main.yml`` or the report. The self-check renders ``cassandra_config_template_overrides``, and its ``HOW TO MAKE IT PASS`` names both for hand edits."
