---
# Progress file of a rolling operation, on the controller: one line per node
# done. Run it once, in a play without serial, before the rolling play:
#   include_role: name=community.cassandra.cassandra_service tasks_from=progress.yml
# A fresh run starts a new file; -e cassandra_rolling_resume=true reuses the
# latest one of this operation and cluster and skips the nodes it lists.
- name: Set up the progress file
  run_once: true
  delegate_to: localhost
  become: false  # the controller: no sudo there
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
    _prefix: "{{ lookup('community.cassandra.cassandra_hosts') }}-{{ cassandra_service_node_action }}-"
    # a play that must start over whatever -e cassandra_rolling_resume says (extra vars beat the others)
    _progress_resuming: "{{ _cassandra_progress_resume | default(cassandra_rolling_resume) }}"
  block:
    - name: Check the inventory's dir
      ansible.builtin.stat:
        path: "{{ inventory_dir }}"
      register: cassandra_progress_inventory_dir_stat
      when:
        - cassandra_rolling_progress_dir | default('', true) == ''
        - inventory_dir | default('', true) not in ['', 'None']  # 'None' with -i host1,host2

    # made absolute here, on the controller, like import_cluster_dir: a
    # relative path is from the dir the playbook is run from
    - name: Pick the progress dir
      ansible.builtin.set_fact:
        cassandra_progress_dir: >-
          {{ _given if _given is abs else _given | realpath }}
      vars:
        _inv: "{{ cassandra_progress_inventory_dir_stat.stat | default({}) }}"
        _inv_progress: "{{ inventory_dir ~ '/.cassandra_progress' if _inv.exists | default(false) else '' }}"
        _given: >-
          {{ cassandra_rolling_progress_dir | default('', true) | expanduser
             or ((inventory_dir if _inv.writeable | default(false) or (_inv_progress != '' and _inv_progress is directory)
                  else '.') ~ '/.cassandra_progress') }}

    # A run that became root on the controller leaves a dir the user cannot write
    - name: Check the progress dir
      ansible.builtin.stat:
        path: "{{ cassandra_progress_dir }}"
        follow: true  # a link to a dir is fine
      register: cassandra_progress_dir_stat

    - name: Stop if the progress dir is not usable
      ansible.builtin.fail:
        msg: >-
          {{ cassandra_progress_dir }}
          {%- if not _st.isdir %} is not a directory: remove it or set cassandra_rolling_progress_dir.
          {%- else %} is not writable by {{ lookup('ansible.builtin.pipe', 'id -un') }} (owner {{ _st.pw_name }}, mode {{ _st.mode }}),
          left by a run with become on the controller: sudo chown -R {{ lookup('ansible.builtin.pipe', 'id -un') }}: {{ cassandra_progress_dir }}
          (or set cassandra_rolling_progress_dir).{% endif %}
      vars:
        _st: "{{ cassandra_progress_dir_stat.stat }}"
      when:
        - _st.exists
        - not (_st.isdir and _st.readable and _st.writeable and _st.executable)

    - name: Ensure the progress dir exists
      ansible.builtin.file:
        path: "{{ cassandra_progress_dir }}"
        state: directory
        mode: "0755"

    - name: Find old progress files
      ansible.builtin.find:
        paths: "{{ cassandra_progress_dir }}"
        patterns: "*.done"
        age: "{{ cassandra_rolling_progress_days }}d"
      register: cassandra_progress_old

    - name: Remove old progress files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ cassandra_progress_old.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Find the progress file to resume
      ansible.builtin.find:
        paths: "{{ cassandra_progress_dir }}"
        patterns: "{{ _prefix }}*.done"
      register: cassandra_progress_found
      when: _progress_resuming | bool

    - name: Stop if there is nothing to resume
      ansible.builtin.fail:
        msg: "No {{ _prefix }}*.done file in {{ cassandra_progress_dir }} to resume: run without cassandra_rolling_resume"
      when:
        - _progress_resuming | bool
        - cassandra_progress_found.files | length == 0

    - name: Pick the progress file
      ansible.builtin.set_fact:
        cassandra_progress_file: >-
          {{ (cassandra_progress_found.files | sort(attribute='mtime') | last).path if _progress_resuming | bool
             else cassandra_progress_dir ~ '/' ~ _prefix ~ now(fmt='%Y%m%dT%H%M%S') ~ '.done' }}

    - name: Check the progress file to resume
      ansible.builtin.stat:
        path: "{{ cassandra_progress_file }}"
      register: cassandra_progress_file_stat
      when: _progress_resuming | bool

    - name: Stop if the progress file to resume is not writable
      ansible.builtin.fail:
        msg: >-
          {{ cassandra_progress_file }} is not writable by {{ lookup('ansible.builtin.pipe', 'id -un') }}
          (owner {{ cassandra_progress_file_stat.stat.pw_name }}), left by a run with become on the controller:
          sudo chown {{ lookup('ansible.builtin.pipe', 'id -un') }}: {{ cassandra_progress_file }}
      when:
        - _progress_resuming | bool
        - not (cassandra_progress_file_stat.stat.readable and cassandra_progress_file_stat.stat.writeable)

    - name: Create the progress file
      ansible.builtin.file:
        path: "{{ cassandra_progress_file }}"
        state: touch
        mode: "0644"
      when: not _progress_resuming | bool

    - name: Read the nodes already done
      ansible.builtin.set_fact:
        # --check created no new file: nothing done yet
        cassandra_progress_done: >-
          {{ [] if ansible_check_mode and not _progress_resuming | bool
             else lookup('ansible.builtin.file', cassandra_progress_file).splitlines() | select | list }}

    - name: Say what is resumed
      ansible.builtin.debug:
        msg: >-
          {{ ('Nothing left to resume: every node is done in ' ~ cassandra_progress_file
              ~ '. Run without cassandra_rolling_resume to start a new ' ~ cassandra_service_node_action ~ '.')
             if ansible_play_hosts_all | difference(cassandra_progress_done) | length == 0
             else ('Resuming ' ~ cassandra_progress_file ~ ': ' ~ cassandra_progress_done | length
                   ~ ' node(s) already done, skipped: ' ~ cassandra_progress_done | join(', ')) }}
      when: _progress_resuming | bool
