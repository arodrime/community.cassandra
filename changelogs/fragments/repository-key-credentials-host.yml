security_fixes:
  - cassandra_repository - the mirror credentials (``cassandra_install_username`` and ``cassandra_install_password``) were sent with the download of ``cassandra_repository_key_url`` whatever its host (e.g. ``downloads.apache.org``); they are now sent only when the keys are on the mirror itself, the same scheme, host and port as ``cassandra_install_url``.
  - cassandra_install - the mirror credentials go with the Java tarball and DSBulk downloads only when they have the scheme, host and port of ``cassandra_install_url``, not over ``http://`` or to another port of the mirror's host.
