bugfixes:
  - "cassandra_install, cassandra_repository - once ``python3.11`` is installed next to the system ``python3`` (for cqlsh, or by ``cassandra_medusa``), the next runs no longer run the modules with it: ansible-core's interpreter discovery picks it first (2.17 and later on RHEL 9, up to 2.19 on Ubuntu 26.04), without the system python3's packages (e.g. a ``cassandra-driver`` installed for it, which ``cassandra_keyspace``, ``cassandra_role`` and ``cassandra_table`` need). The roles then set ``ansible_python_interpreter`` to ``/usr/bin/python3`` for the rest of the ansible-playbook run, unless an interpreter is set (``ansible_python_interpreter``, even ``auto``, or ``interpreter_python`` / ``ANSIBLE_PYTHON_INTERPRETER``) or ``/usr/bin/python3`` is older than 3.9; ``cassandra_config`` runs its checks with that Python too."
