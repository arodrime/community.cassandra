minor_changes:
  - cassandra_config - new variables for cassandra.yaml settings commented out in stock (empty by default, the line stays commented out) - ``cassandra_disk_access_mode``, ``cassandra_file_cache_size``, ``cassandra_memtable_heap_space``, ``cassandra_memtable_offheap_space``, ``cassandra_memtable_flush_writers``, ``cassandra_concurrent_compactors``, ``cassandra_stream_entire_sstables``, ``cassandra_stream_throughput_outbound``, ``cassandra_inter_dc_stream_throughput_outbound``, ``cassandra_entire_sstable_stream_throughput_outbound``, ``cassandra_entire_sstable_inter_dc_stream_throughput_outbound``, ``cassandra_streaming_connections_per_host``, ``cassandra_internode_streaming_tcp_user_timeout``, ``cassandra_roles_update_interval``, ``cassandra_permissions_update_interval``, ``cassandra_credentials_update_interval``, ``cassandra_gc_log_threshold``, ``cassandra_gc_warn_threshold``; 4.0 has its own under its key names (``cassandra_file_cache_size_in_mb``, ``cassandra_memtable_heap_space_in_mb``, ``cassandra_memtable_offheap_space_in_mb``, ``cassandra_stream_throughput_outbound_megabits_per_sec``, ``cassandra_inter_dc_stream_throughput_outbound_megabits_per_sec``, ``cassandra_internode_streaming_tcp_user_timeout_in_ms``, ``cassandra_roles_update_interval_in_ms``, ``cassandra_permissions_update_interval_in_ms``, ``cassandra_credentials_update_interval_in_ms``, ``cassandra_gc_log_threshold_in_ms``, ``cassandra_gc_warn_threshold_in_ms``); 5.0 only, refused on 4.x - ``cassandra_sstable_format`` (``sstable.selected_format``, ``big`` or ``bti``; ``bti`` refused in ``cassandra_storage_compatibility_mode`` ``CASSANDRA_4``, as Cassandra does), ``cassandra_partition_size_warn_threshold``, ``cassandra_partition_size_fail_threshold``; ``cassandra_column_index_size`` now on 5.0 too (empty there by default).
  - cassandra_config - ``cassandra_cdc_raw_dir`` (``cdc_raw_directory``), created and owned like the data directories when set or with ``cassandra_cdc_enabled``; ``reset_node`` empties it.
  - cassandra_config - ``cassandra_heap_dump_dir`` now also sets the heap dump dir on 4.x (empty by default there, as in stock; an inventory that already set it gets a cassandra-env.sh change) and, when an absolute path, 5.0's ``heap_dump_path`` in cassandra.yaml; the role creates it. It must not be empty on 5.0.
  - cassandra_config - ``cassandra_auto_bootstrap`` (default ``true``, not written); ``add_datacenter`` sets it to false for its new nodes; import_cluster keeps a node's ``false`` in its host_vars.
  - preflight playbook, import_cluster playbook - a WARNING for sensitive or suspicious settings in the inventory (a table, ``cassandra_suspicious_settings``), first ``auto_bootstrap`` false; nothing is refused.
  - cassandra_config - the "same settings" test (a file left as it is on a node already initialized, and the import_cluster self-check) takes the same size, rate or duration of these settings in another unit as the same setting (``209715200B/s`` and ``200MiB/s``), ``auto_bootstrap`` true as no line, and leaves out 5.0's ``heap_dump_path`` (``-XX:HeapDumpPath`` wins; on 4.x, which refuses the key, it is still a difference).
  - import_cluster playbook - the settings above are read into their variables, no longer into ``cassandra_extra_settings``; a size, rate or duration of these settings is written in one unit whatever the node writes it in (``209715200B/s`` as ``200MiB/s``, ``2s`` as ``2000ms``), so that nodes do not differ on it; ``auto_bootstrap`` true (Cassandra's default) is left out.
breaking_changes:
  - cassandra_config - ``cassandra_extra_settings`` refuses the keys that now have a variable, naming it (``auto_bootstrap``, ``disk_access_mode``, ``heap_dump_path``, ``cdc_raw_directory``, ``sstable``, ``file_cache_size``, ``memtable_heap_space``, ``memtable_offheap_space``, ``memtable_flush_writers``, ``concurrent_compactors``, ``column_index_size`` on 5.0, the streaming, auth cache, guardrail and GC log settings listed above, and on 4.0 their 4.0 names), a dotted key such as ``sstable.selected_format`` by its first part, and on 4.1+ the 4.0 name of a key whose variable is set (Cassandra refuses both names) - move them to their variables (a re-import does it).
