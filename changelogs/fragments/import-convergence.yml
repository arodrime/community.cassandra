minor_changes:
  - 'import_cluster playbook - a ``CONVERGENCE`` section in report.txt (report.check.txt under ``--check``) tracks the way from an imported cluster to one group with every setting in ``group_vars/<cluster group>/``: how many settings every node shares (``41/47 settings common to all nodes, 6 differ, 3 files kept by hand``; the addresses and what a node keeps for life not counted), then each other setting, the safest change first: its values and their nodes (by the report''s node groups, an inventory group named when the nodes are exactly its own), the value most nodes have and where to write it (the cluster''s ``group_vars``, removed from the ``group_vars`` and ``host_vars`` below it, never from a shared file of yours such as ``group_vars/all`` (one below the cluster group is named); a sub-key of a dict in the files that keep another value), how many nodes would change and what follows (``no restart`` for an owner, a mode or an OS setting, ``then restart`` for a config file, ``restart unknown`` for what ``apply_config`` does not write; a cluster-wide switch (encryption, authentication) with its procedure first, a keystore checked on the node first, a login the nodes must accept first, a heap sized for the machine, a version only upgraded to the newest, a data directory moved by hand), and the ``apply_config --check --diff`` command to review it (``--limit`` to the nodes that change when they are few; ``change_seeds --check`` for the seeds); then the files kept as edited by hand (``import_cluster_keep_hand_edits``), each edit with the variable and value that would carry it, and how to give the file back to the roles. The end of the run shows the score and the first five actions (the score only while the self-check fails). Output only: the inventory written is the same, secrets are never shown.'
