---
# One node of the upgrade: drain and stop, the target series' repository and
# package, its config, start, wait until joined, check the version it runs.
# The Prometheus exporter's jar in place and its agent able to start (its jar readable, its port free) before
# the drain: a download that fails or a port in use stops the run with the node still running.
- name: Put the Prometheus exporter's jar in place
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_config
    tasks_from: prometheus_exporter_jar.yml
    public: true  # _cassandra_config_jvm_agent, for the check
  when: cassandra_prometheus_exporter_enabled | default(false) | bool

- name: Check the Prometheus exporter's agent can start
  ansible.builtin.include_tasks: exporter_check.yml
  vars:
    _cassandra_exporter_check_option: "{{ _cassandra_config_jvm_agent | default('') }}"
    # (its config: written with the target series' config). Its jar: not when --check left it missing (nothing is
    # downloaded then)
    _cassandra_exporter_check_kinds: >-
      {{ ['port'] if ansible_check_mode and _cassandra_config_exporter_jar_state | default('') == 'missing'
         else ['jar', 'port'] }}
    _cassandra_exporter_check_left: >-
      not drained (still running its former version){{ "; the exporter's jar put in place"
      if cassandra_config_exporter_download | default({}) is changed else '' }}
  when: cassandra_prometheus_exporter_enabled | default(false) | bool

# The AxonOps agent (cassandra_axonops_enabled): its repository, axon-agent, its account, config and service, while
# the node runs; the target's Java agent package downloaded only (installed in the window below: its one step there)
- name: Download the AxonOps packages of the target series
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_axonops
  vars:
    _cassandra_axonops_download_only: true
  when: cassandra_axonops_enabled | default(false) | bool

- name: Drain the node
  ansible.builtin.import_tasks: drain.yml
  vars:
    _cassandra_service_drain_then: flushed, then stopped

# the new version replays as little of the old one's commitlog as it can (best effort: a node drained in part
# may not flush, its start replays the commitlog)
- name: Flush the node instead
  community.cassandra.cassandra_flush:
  module_defaults:
    community.cassandra.cassandra_flush: "{{ _cassandra_service_jmx }}"
  failed_when: false
  ignore_errors: true  # the timeout below
  timeout: "{{ cassandra_service_drain_timeout | int }}"
  when: cassandra_service_drain is not skipped and not cassandra_service_drain.changed | default(false)

- name: Stop Cassandra
  ansible.builtin.systemd_service:
    name: cassandra
    state: stopped

# (Cassandra stopped; a release its repository lacks: the stop says so, its way out the one of the next run, which
# finds this node down)
- name: Install the target version
  ansible.builtin.include_tasks: package_update.yml
  vars:
    _cassandra_install_changed_before: [Cassandra stopped for its upgrade]
    _cassandra_install_again: run this phase again (it says how to start this node first)

# The AxonOps agent (cassandra_axonops_enabled): the Java agent package of the target series and Java put in place
# once the target is installed (a failed install leaves the former version with its own agent), from the packages
# downloaded before the drain (the network part: repository, cache, download; a failure there leaves the node
# running); a failure in the window says Cassandra is stopped, the target installed, and the way out
- name: Set up the AxonOps agent for the target series
  when: cassandra_axonops_enabled | default(false) | bool
  block:
    - name: Install the AxonOps packages of the target series
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_axonops
      vars:
        _cassandra_axonops_cached: true
  rescue:
    - name: Stop on the AxonOps agent, Cassandra stopped for its upgrade
      ansible.builtin.fail:
        msg: "{{ _said | join(_nl) }}"
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        # (a stop of the role's own: its fact lines, without its head and way out)
        _cause: >-
          {{ (ansible_failed_result.msg | default('no cause given') | string).splitlines()
             | reject('match', '(STOPPED|REFUSED|WAY OUT)  ') | map('trim') | select | join(' ') }}
        _head:
          - "STOPPED  upgrade  {{ inventory_hostname }}"
          - "  Cassandra is stopped for its upgrade, {{ cassandra_package_version | default(cassandra_version) }}"
          - "  installed, its config not written"
          - "  the AxonOps agent: {{ ansible_failed_task.name | default('') }}:"
        _way:
          - "WAY OUT  fix the cause on {{ inventory_hostname }}, install"
          - "  {{ _cassandra_axonops_java_package | default('the Java agent package') }} there by hand, then run"
          - "  this phase again: it says how to write the config and start the node"
        _said: "{{ _head + ['    ' ~ (_cause | community.cassandra.cassandra_url_masked)] | community.cassandra.cassandra_fit + _way }}"

- name: Write the target series' config
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_config
  vars:
    cassandra_config_confirm: false  # previewed by the preflight phase, confirmed by the prepare phase
    _cassandra_config_no_question: true  # whatever -e cassandra_config_confirm says
    _cassandra_config_no_newsize_warning: true  # said by the preflight phase (its config preview)
    _cassandra_config_no_restart_warning: true

- name: Start it and wait until it has joined
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: main.yml
    rolespec_validate: false  # as the include it was: no argument check
  vars:
    _cassandra_change_report_quiet: "{{ ansible_verbosity | int == 0 }}"  # the recap says it (-v shows it)
    cassandra_service_state: started
    _cassandra_storage_mode_checked: true  # (storage_mode_guard.yml, before the plan)

- name: Check it runs the target version
  ansible.builtin.include_tasks: version_verify.yml

# the versions are mixed from here until the last node: the plays' cassandra_allow_mixed_versions reads it
- name: Note it as upgraded
  ansible.builtin.set_fact:
    cassandra_upgrade_done: true
  when: not ansible_check_mode
