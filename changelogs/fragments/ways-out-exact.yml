minor_changes:
  - "decommission_node, topology, preflight and the rolling operations - the ways out of a stop are exact options and commands, one per line: a removal that leaves too few replicas offers ``-e cassandra_decommission_force=true`` (no longer ``set cassandra_decommission_force: true`` in a sentence); several Cassandra versions are listed one per row (``Version  Nodes``) with ``ansible-playbook community.cassandra.upgrade`` or ``-e cassandra_allow_mixed_versions=true``; a node down that stops a rolling run gets the full ``replace_node`` and ``remove_dead_node`` commands with its address."
