---
# Records the checksums of the config files (and of the systemd unit) the running Cassandra started with,
# so a later run can tell a change still to apply by content (a file
# rewritten with the same content, or a change applied live, is not pending).
# Run after the start (and its wait): a file written since the JVM started is
# left out (what it read is unknown: pending until a restart), and the JVM is
# recorded (_jvm: its pid and start, as jvm_started.yml finds them), so that
# a later run trusts the record for that JVM only. In one go, as the reader of
# the record reads them.
- name: Record the config Cassandra started with
  ansible.builtin.command:
    argv:
      - "{{ _cassandra_config_python | default(ansible_facts['python']['executable'] | default('/usr/bin/python3')) }}"
      - -c
      - "{{ _record }}"
      - "{{ _cassandra_service_conf_dir | trim }}"
      - /etc/systemd/system/cassandra.service
      - "{{ _cassandra_service_config_snapshot }}"
  changed_when: true
  vars:
    _record: |
      import hashlib, json, os, stat, sys, tempfile, time
      conf, unit, record = [os.path.expanduser(os.path.expandvars(p)) for p in sys.argv[1:4]]
      def sha1(path):
          digest = hashlib.sha1()
          with open(path, "rb") as f:
              for block in iter(lambda: f.read(65536), b""):
                  digest.update(block)
          return digest.hexdigest()
      def jvm():
          try:
              me = os.readlink("/proc/self/ns/pid")
          except OSError:
              me = None
          for pid in sorted((p for p in os.listdir("/proc") if p.isdigit()), key=int):
              try:
                  with open("/proc/%s/comm" % pid) as f:
                      if f.read().strip() != "java":  # as jvm_started.yml (pgrep -x java), not a sudo or a grep
                          continue
                  with open("/proc/%s/cmdline" % pid, "rb") as f:
                      if b"org.apache.cassandra.service.CassandraDaemon" not in f.read().split(b"\0"):
                          continue
                  if me is not None and os.readlink("/proc/%s/ns/pid" % pid) != me:  # a container's on this host
                      continue
                  with open("/proc/%s/stat" % pid) as f:
                      ticks = int(f.read().rsplit(")", 1)[1].split()[19])
                  with open("/proc/uptime") as f:
                      up = float(f.read().split()[0])
                  return {"pid": pid, "start": round(time.time() - up + ticks / float(os.sysconf("SC_CLK_TCK")), 2)}
              except (IOError, OSError, IndexError, ValueError):
                  continue
          return None
      started = jvm()
      out = {}
      names = sorted(os.listdir(conf)) if os.path.isdir(conf) else []
      for path in [os.path.normpath(os.path.join(conf, n)) for n in names if not n.startswith(".")] + [unit]:
          try:
              st = os.lstat(path)
              if stat.S_ISREG(st.st_mode) and (started is None or st.st_ctime <= started["start"]):
                  out[path] = sha1(path)
          except (IOError, OSError):  # gone or unreadable meanwhile: left out (pending until a restart)
              continue
      if started is not None:
          out["_jvm"] = started
      # a file of its own (never one planted in that directory, which Cassandra's account owns), then renamed
      fd, tmp = tempfile.mkstemp(dir=os.path.dirname(record) or ".", prefix=".ansible_config_at_start.")
      try:
          os.fchmod(fd, 0o600)  # root only: it holds the checksum of the JMX password file
          with os.fdopen(fd, "w") as f:
              json.dump(out, f, indent=4, sort_keys=True)
          os.rename(tmp, record)
      except BaseException:
          os.unlink(tmp)
          raise
