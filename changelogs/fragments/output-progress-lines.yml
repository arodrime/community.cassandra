minor_changes:
  - 'ops callback - a node''s progress lines are rewritten in place on a terminal while its step goes on, and left as they are once it is over (``[1/2] node2  bootstrapped  NORMAL  100.0 GiB in 19m02s  avg 90 MiB/s``), stalled or failed; in a log file or a pipe, the first line of a node, then one every 5 minutes and every change of state. No rule above a node''s progress any more.'
  - 'progress lines - the node name is followed by two spaces, the other ends of the streams come after a blank line, a ``STALLED`` line details only the peers in cause (``from node3  13.4/33.0 GiB  41%  nothing for 6m    (node1, node2 done)``); the waits without streams say ``waiting`` then what is waited for (``[2/5] node2  restart  waiting  node4 is DN, waiting for it to come back  9m52s/10m``), and ``cassandra_normal_wait_line`` takes the step''s time (``elapsed``) for its frozen line.'
