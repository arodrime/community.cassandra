minor_changes:
  - cassandra_linux - the disk tuning follows the data and commitlog filesystems down through LVM volumes, md RAID, dm-crypt, multipath and partitions to the disks; the top device, whose read-ahead the kernel uses for the files, is tuned, the devices under it too unless they hold something else (new ``cassandra_data_tune_shared_devices``). The filesystems of the OS (``/``, ``/var``...) and their volumes and disks are not tuned any more; the data gets tuned on a filesystem of its own, and such a device set in ``cassandra_data_block_device(s)`` fails the role. Nodes on LVM, md or dm-crypt, left alone with a warning so far, are tuned at the next run. LVM volumes keep their read-ahead in their metadata (``lvchange --readahead``, which reloads the volume, at a run with Cassandra stopped, unless the new ``cassandra_data_lvchange_running``), the other devices with a udev rule matching them by stable ids (``/etc/udev/rules.d/64-cassandra-data-disk.rules``, which replaces ``61-cassandra-data-disk.rules``). ``cassandra_data_block_device(s)`` also take LVM, md and device-mapper devices. The role shows each filesystem and its devices, and warns when the active tuned profile sets another read-ahead. New ``cassandra_data_disk_tuning`` to leave the disks alone.
  - import_cluster playbook - the OS tuning report shows the devices under the data and commitlog directories (LVM, md RAID, dm-crypt, multipath) with their read-ahead and scheduler, and the read-ahead of the LVM volumes; on a node the roles set up whose data devices' tuning (read-ahead, scheduler, udev rule, tuned profiles) cassandra_linux would change now, ``cassandra_data_disk_tuning`` false in its host_vars keeps them as they are.
