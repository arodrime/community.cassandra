---
# false: the role leaves this node's OS settings as they are (import_cluster
# sets it on the nodes it finds set up by other means)
cassandra_linux_manage: true

# Disk of the Cassandra data, e.g. "/dev/sdb" or "/dev/nvme0n1" (a partition
# is taken as its disk). See the README.
cassandra_data_block_device: ""
# Several disks (JBOD data directories, a commitlog disk). With neither
# variable set: found from the data and commitlog directories with findmnt +
# lsblk; LVM/RAID/dm-crypt are not guessed.
cassandra_data_block_devices: []

# Read-ahead in KB for those disks (queue/read_ahead_kb, not blockdev --setra
# sectors). 4, the practical minimum: read-ahead brings nothing to
# Cassandra's random reads and fills the page cache with unneeded data.
cassandra_data_readahead_kb: 4

# sysfs block root the disk tuning reads and writes. Only meant to be
# overridden by tests, to point at a fake tree instead of the real disks.
cassandra_sysfs_block_root: /sys/block

# Apply kernel settings (sysctl, swapoff, THP) live, not just persist them.
# "auto": live everywhere except containers (Ansible's virtualization facts,
# or a virtualization_type listed below), where /proc/sys and /sys are the
# host's. true/false forces it (e.g. true on a dedicated privileged container
# host that should be tuned from inside).
cassandra_linux_apply_live: auto
cassandra_linux_container_types:
  - docker
  - podman
  - container
  - containerd
  - lxc

# Kernel settings, applied live unless in a container
cassandra_linux_sysctl_file: /etc/sysctl.d/60-cassandra.conf
cassandra_linux_sysctl:
  vm.swappiness: 1
  vm.max_map_count: 1048575
  vm.zone_reclaim_mode: 0
  # TCP settings to prevent timeouts and handle many connections
  net.ipv4.tcp_keepalive_time: 60
  net.ipv4.tcp_keepalive_probes: 3
  net.ipv4.tcp_keepalive_intvl: 10
  net.core.rmem_max: 16777216
  net.core.wmem_max: 16777216
  net.core.rmem_default: 16777216
  net.core.wmem_default: 16777216
  net.core.optmem_max: 40960
  net.ipv4.tcp_rmem: "4096 87380 16777216"
  net.ipv4.tcp_wmem: "4096 65536 16777216"

# Limits of the cassandra user (/etc/security/limits.d/cassandra.conf), for
# tools run by hand as cassandra; the service gets its own from its systemd unit
# (cassandra_service_limit_*), same values by default
cassandra_linux_limits:
  memlock: unlimited
  nofile: 1048576
  nproc: 32768
  as: unlimited

# Install and start time sync (chrony, or systemd-timesyncd on Debian/Ubuntu
# when chrony is not installed). false: the host's time sync is left alone,
# e.g. managed by other means with the site's NTP servers.
cassandra_linux_timesync: true

# Download nothing (see the air-gapped section of the guide): the time sync
# package is not installed, only started when present.
cassandra_offline: false
