---
- name: Prepare
  hosts: all

  tasks:

    - name: Clean package manager cache
      ansible.builtin.shell: dnf clean all || yum clean all
      when: ansible_facts['os_family'] == 'RedHat'
      
    - name: Clean package manager cache
      ansible.builtin.shell: apt-get update && apt-get clean
      when: ansible_facts['os_family'] == 'Debian'

    - name: Run fix firewalld script on RedHat based systems
      ansible.builtin.script: ../files/firewalld_fix.sh
      when: ansible_os_family == "RedHat"

    # firewall-cmd talks to firewalld over the system bus, which a real host
    # always has, and the AlmaLinux 10 image not
    - name: Install the system bus (EL 10)
      ansible.builtin.package:
        name: dbus-broker
        state: present
      when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution_major_version'] == '10'

    - name: Start it (EL 10)
      ansible.builtin.service:
        name: dbus-broker
        state: started
      when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution_major_version'] == '10'
