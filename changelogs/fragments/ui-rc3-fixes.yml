minor_changes:
- "ops callback - a step's last line keeps the count of its tasks (``Comparing the config with the inventory (24 nodes)...  312 tasks  done in 4m50s``); after a Ctrl-C, Ansible's error is the last line, the step's line is not drawn again under it."
- "Operation playbooks and the cassandra_config role - every confirmation names the cluster on a line of its own above the question (``Cluster: prod``), said by the shared question itself; cassandra_config's question is that shared one (``yes`` or ``y``, asked again after another answer, three times at most, why each node is asked said after its files). Its ``no``, three answers that are neither, or no terminal now stop the whole play there (``config not written``), its later ``serial`` batches and its blank nodes too, instead of failing the nodes asked about only."
- "Operation playbooks - a ``cassandra_*`` variable the collection does not know is a warning block of its own: probably a typo, the nodes it is set for, the closest known variable (also for a comment pasted into the key, ``cassandra_# Logging (logback.xml)log_console``) and that this one keeps its default meanwhile."
- "apply_config playbook - a staged config file found changed at its node's turn stops with what was seen (nothing moved, the live files untouched, Cassandra not restarted, ``config not written`` on its row) and the resume that stages the files again, no longer ``config write started, not finished``."
- "drift playbook - refused on a node Ansible does not reach, it also gives ``-e drift_nodes=false`` (the inventory alone, no node contacted) as a way out."
