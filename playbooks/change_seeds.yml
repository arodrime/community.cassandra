---
# Applies a new cassandra_seeds list to every node of a cluster, live (no
# restart): only the seeds line of cassandra.yaml changes. Other differences
# between the inventory and the nodes' config are shown, not applied.
#   ansible-playbook -i inventory community.cassandra.change_seeds
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo): the playbook asks for it itself, no -b needed.
# The preflight check refuses seeds that are not up members of the cluster.
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Update the seed list
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  vars:
    _new: "{{ cassandra_seeds if cassandra_seeds is string else cassandra_seeds | join(',') }}"  # as the template writes it
  tasks:
    - name: Load the cassandra_config defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: defaults.yml
        public: true

    - name: Load the cassandra_service defaults (JMX access)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Show the new seed list and confirm
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: screen.yml
      vars:
        _changed: >-
          {{ ansible_play_hosts | map('extract', hostvars) | rejectattr('_cassandra_preflight.live_seeds', 'equalto', _new)
             | map(attribute='inventory_hostname') | list }}
        _blocks: >-
          {%- set l = [] -%}
          {%- for h in _changed -%}
          {%-   set _ = l.append({'title': h | community.cassandra.cassandra_screen_title(hostvars[h]._cassandra_preflight | default({})), 'lines': ['from: ' ~ hostvars[h]._cassandra_preflight.live_seeds, 'to:   ' ~ _new]}) -%}
          {%- endfor -%}
          {{ l }}
        cassandra_screen_question: "Write and reload the new seed list on {{ _changed | join(', ') }}?"
        cassandra_screen:
          operation: change_seeds
          summary: the seed list in cassandra.yaml, reloaded live (no restart)
          blocks: "{{ _blocks }}"
      when: _changed | length > 0

    - name: Apply the new seed list
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: seeds_apply.yml

    # Nothing is written here: cassandra_config shows its diffs
    - name: Look for other config differences
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        apply:
          check_mode: true
      vars:
        cassandra_config_confirm: false
        cassandra_config_reload_seeds: false

    - name: Say how to apply the other differences
      ansible.builtin.debug:
        msg: >-
          WARNING  the config of {{ _drift | community.cassandra.cassandra_node_list }} differs from the inventory beyond the seeds
          (apply_config --check shows it), not applied by change_seeds. Apply it with the cassandra_config role, e.g.
          {{ 'create_cluster' | community.cassandra.cassandra_command(
               inventory=ansible_inventory_sources,
               default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
               hosts=lookup('community.cassandra.cassandra_hosts'), cwd=lookup('ansible.builtin.env', 'PWD')) }}
          (it starts nothing on a running cluster),
          then restart the nodes with community.cassandra.rolling_restart.
      vars:
        cassandra_output: true
        _drift: >-
          {{ ansible_play_hosts | map('extract', hostvars) | selectattr('_cassandra_config_changes', 'defined')
             | rejectattr('_cassandra_config_changes', 'equalto', []) | map(attribute='inventory_hostname') | list }}
      when: _drift | length > 0
      run_once: true
