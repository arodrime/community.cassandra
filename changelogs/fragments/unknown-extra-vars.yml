breaking_changes:
  - "playbooks - every playbook stops before changing anything when a ``-e`` variable is named like one of the collection's (``cassandra_``, ``import_cluster_``, ``help_``, in any case) but none of its roles or playbooks uses that name (a typo such as ``import_cluster_keep_hand_edit`` was silently ignored), naming the known variable it is close to. A command line that passes a removed or unknown collection variable now stops too: drop it, or let it through with ``-e cassandra_allow_unknown_variables=<name>,<name>`` (``true``: every name), e.g. for variables of your own. The variables set in the inventory are not checked this way (``preflight`` warns about them)."
