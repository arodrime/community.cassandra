---
# Reboots every host of a cluster, one at a time: checks the cluster, drains
# the node, reboots the host, waits until Cassandra has joined, checks the cluster again.
# Stops at the first problem, without touching the next node.
#   ansible-playbook -i inventory community.cassandra.rolling_reboot -e cassandra_hosts=my_cluster
# Resume an interrupted run (skips the nodes already done): add -e cassandra_rolling_resume=true
# cassandra_reboot_timeout (default 1800 s), cassandra_reboot_command and
# cassandra_reboot_boot_time_command pass through to ansible.builtin.reboot.
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Set up the progress file
  hosts: "{{ cassandra_hosts | default('cassandra') }}"
  gather_facts: false
  vars:
    cassandra_service_node_action: reboot
  tasks:
    - name: Set up the progress file
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: progress.yml

- name: Rolling reboot
  hosts: "{{ cassandra_hosts | default('cassandra') }}"
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Reboot this host
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: reboot

- name: Summary
  hosts: "{{ cassandra_hosts | default('cassandra') }}"
  gather_facts: false
  tasks:
    - name: Print the summary
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: summary.yml
