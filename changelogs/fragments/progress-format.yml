minor_changes:
  - "add_node, replace_node, decommission_node, remove_dead_node, add_datacenter, move_node, cleanup - the progress of a streaming operation or cleanup is printed as a short first line (node, operation, bar, percentage, rate), then the bytes and files streamed, each node at the other end by its inventory name with its own progress, and the current, start and expected end times with the controller's time zone; a line about the checks without progress only after a check without any; a single line with the total time and average rate once done, and the same block headed STALLED, FAILED, STOPPED or TOO LONG when the wait stops."
