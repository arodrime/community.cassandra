---
# One check of a streaming operation (stream_wait.yml, through wait_loop.yml)
- name: Check the progress
  when: _cassandra_stream_status == 'going'
  block:
    - name: Read the streams
      community.cassandra.cassandra_netstats:
      module_defaults:
        community.cassandra.cassandra_netstats: >-
          {{ _cassandra_service_jmx | combine({'port': hostvars[item].cassandra_jmx_port | default(_cassandra_service_jmx.port) | int}) }}
      delegate_to: "{{ item }}"
      loop: "{{ _cassandra_stream_from }}"
      register: cassandra_stream_read
      failed_when: false
      ignore_unreachable: true  # a node not answering once is a check without an answer

    # This node's netstats, when it is one of them (a bootstrap: its mode says when it is over). Its own
    # nodetool may not answer though Cassandra runs (5.0.0 to 5.0.4 during a bootstrap: CASSANDRA-19902;
    # JMX login or permissions): the other side is read instead
    - name: Keep this node's answer
      ansible.builtin.set_fact:
        _cassandra_stream_self: "{{ _self }}"
        _cassandra_stream_blind: >-
          {{ (_self | community.cassandra.cassandra_stream_own_error | length > 0)
             and not _self | community.cassandra.cassandra_stream_own_stopped }}
      vars:
        _self: "{{ cassandra_stream_read.results | selectattr('item', 'equalto', inventory_hostname) | first | default({}) }}"

    - name: Read the streams from the other side
      community.cassandra.cassandra_netstats:
      module_defaults:
        community.cassandra.cassandra_netstats: >-
          {{ _cassandra_service_jmx | combine({'port': hostvars[item].cassandra_jmx_port | default(_cassandra_service_jmx.port) | int}) }}
      delegate_to: "{{ item }}"
      loop: "{{ _cassandra_stream_peers | default([]) }}"
      register: cassandra_stream_read_peers
      failed_when: false
      ignore_unreachable: true  # e.g. the dead node of a replace, still in the inventory
      when: _cassandra_stream_blind | bool

    # A join is then over once the other nodes see it UN
    - name: Read how the other nodes see it
      community.cassandra.cassandra_status:
        down: 10000  # read it whatever the state of the nodes
        interval: 0
        port: "{{ hostvars[item].cassandra_jmx_port | default(_cassandra_service_jmx.port) | int }}"
      module_defaults:
        community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
      delegate_to: "{{ item }}"
      # two of them: the ones the preflight found running first, never the ones it found stopped
      loop: >-
        {{ (_cassandra_stream_peers | default([]) | map('extract', hostvars) | selectattr('_cassandra_preflight_running', 'defined')
            | selectattr('_cassandra_preflight_running') | map(attribute='inventory_hostname') | list
            + _cassandra_stream_peers | default([]) | map('extract', hostvars) | rejectattr('_cassandra_preflight_running', 'defined')
              | map(attribute='inventory_hostname') | list)[:2] }}
      register: cassandra_stream_seen
      failed_when: false
      ignore_unreachable: true
      check_mode: false  # read-only
      when:
        - _cassandra_stream_blind | bool
        - _cassandra_stream_join | default(false) | bool

    - name: Check the job
      ansible.builtin.async_status:
        jid: "{{ _cassandra_stream_job.jid | default('') }}"
      delegate_to: "{{ _cassandra_stream_job.host | default(inventory_hostname) }}"
      register: cassandra_stream_job_status
      ignore_errors: true  # a failed job is reported below
      ignore_unreachable: true
      no_log: "{{ cassandra_jmx_password | length > 0 }}"  # a shell job's command line carries it
      when: _cassandra_stream_job.jid | default('') | length > 0

    # removenode resumed (no job to follow): over once that node has no removal left
    # with that node's own JMX port and login (delegate_to keeps this node's variables)
    - name: Check the removal
      ansible.builtin.command: >-
        nodetool -p {{ _h.cassandra_jmx_port | default(_cassandra_service_jmx.port) }}{{ (' -u ' ~ _u | quote) if _u else '' }}{{ (' -pwf ' ~ _pwf | quote) if _pwf else ((' -pw ' ~ _pw | quote) if _pw else '') }} removenode status
      delegate_to: "{{ _cassandra_stream_removal_on | default(inventory_hostname, true) }}"
      register: cassandra_stream_removal
      changed_when: false
      failed_when: false
      check_mode: false  # read-only
      ignore_unreachable: true
      no_log: "{{ (cassandra_jmx_password ~ _pw) | length > 0 }}"
      when: _cassandra_stream_removal_on | default('') | length > 0
      vars:
        _h: "{{ hostvars[_cassandra_stream_removal_on | default(inventory_hostname, true)] }}"
        _u: "{{ _h.cassandra_jmx_username | default(cassandra_jmx_username) }}"
        _pwf: "{{ _h.cassandra_jmx_password_file | default(cassandra_jmx_password_file) }}"
        _pw: "{{ _h.cassandra_jmx_password | default(cassandra_jmx_password) }}"

    - name: Work out the progress
      ansible.builtin.set_fact:
        _cassandra_stream_state: >-
          {{ _views | community.cassandra.cassandra_stream_progress(_cassandra_stream_state | default({}),
               now=now().timestamp() | int, operations=_cassandra_stream_operations,
               peer=(_address if _blind else None), stall_time=cassandra_stream_stall_time | int,
               interval=cassandra_stream_check_interval | int, early_interval=cassandra_stream_early_check_interval | int,
               early_time=cassandra_stream_early_time | int) }}
      vars:
        _blind: "{{ _cassandra_stream_blind | bool }}"
        # the address the other nodes see this node by in their netstats
        _address: >-
          {{ (cassandra_extra_settings | default({})).broadcast_address
             | default(_cassandra_preflight.address | default(cassandra_listen_address
                       if cassandra_listen_address | default('') not in ['', 'localhost']
                       else ansible_facts['default_ipv4']['address'] | default(''), true), true) }}
        _views: "{{ cassandra_stream_read_peers.results if _blind else cassandra_stream_read.results }}"

    - name: Where it stands
      ansible.builtin.set_fact:
        # kept as facts: the skipped tasks of the next checks overwrite registered results
        _cassandra_stream_job_result: >-
          {{ dict(cassandra_stream_job_status | default({}) | dict2items
                  | selectattr('key', 'in', ['msg', 'stderr', 'rc', 'finished', 'failed']) | items2dict) }}
        _cassandra_stream_seen: "{{ _seen }}"
        # the block's condition reads _cassandra_stream_status: set after the progress line
        _cassandra_stream_now: >-
          {{ _cassandra_stream_state | community.cassandra.cassandra_stream_status(
               join=_cassandra_stream_join | default(false) | bool, leave=_cassandra_stream_leave | default(false) | bool,
               own=_cassandra_stream_self, seen=_seen,
               job=(cassandra_stream_job_status if _cassandra_stream_job.jid | default('') | length > 0 else none),
               removal=(cassandra_stream_removal if _cassandra_stream_removal_on | default('') | length > 0 else none),
               max_time=cassandra_stream_max_time | int, now=now().timestamp() | int) }}
      vars:
        _seen: >-
          {{ cassandra_stream_seen.results | default([]) | community.cassandra.cassandra_ring_seen(
               _cassandra_preflight.ring_address | default(_cassandra_preflight.address | default(''), true)) }}

    # One line per check, then always one line for the other ends (and why it waits, when this node can't tell)
    - name: Write the progress
      ansible.builtin.set_fact:
        _cassandra_stream_report: >-
          {{ _cassandra_stream_state | community.cassandra.cassandra_progress_line(
               index=_cassandra_stream_index | default(0) | int, steps=_cassandra_stream_steps | default(0) | int,
               node=inventory_hostname, operation=_cassandra_stream_what,
               mode=_cassandra_stream_self.mode | default(''), names=_names, status=_cassandra_stream_now)
             + (_cassandra_stream_self | community.cassandra.cassandra_stream_waiting(_cassandra_stream_seen,
                  node=inventory_hostname, join=_cassandra_stream_join | default(false) | bool)
                if _cassandra_stream_now == 'going' else []) }}
      vars:
        # the other ends by their inventory names (netstats shows addresses)
        _names: "{{ groups['all'] | community.cassandra.cassandra_host_addresses(hostvars) }}"

    - name: Progress of the {{ _cassandra_stream_what }}
      ansible.builtin.debug:
        msg: "{{ _cassandra_stream_report | join('\n') }}"
      vars:
        cassandra_output: true

    - name: Keep where it stands
      ansible.builtin.set_fact:
        _cassandra_stream_status: "{{ _cassandra_stream_now }}"

    # every cassandra_stream_early_check_interval for cassandra_stream_early_time, then every cassandra_stream_check_interval
    # on the controller, quiet (pause prints "Pausing for ..." on a terminal, between the progress lines)
    - name: Wait before the next check
      ansible.builtin.wait_for:
        timeout: "{{ _cassandra_stream_state.wait }}"
      delegate_to: localhost
      become: false  # the controller: no sudo there
      when: _cassandra_stream_status == 'going'
      vars:
        ansible_become: false  # an inventory ansible_become beats the become keyword
