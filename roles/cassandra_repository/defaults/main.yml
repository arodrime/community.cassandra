---
cassandra_version: "50x"
# Download nothing (air-gapped hosts): the role does nothing. See the guide.
cassandra_offline: false
# false: the repositories are configured by other means, the role does nothing
cassandra_repository_manage: "{{ not cassandra_offline | bool }}"
# How the Cassandra packages are installed (same in cassandra_install):
#   repository  from a yum/apt repository (Apache's, or a mirror of it) this
#               role adds
#   packages    the package files downloaded from cassandra_install_url, a
#               plain directory (no repository metadata): this role adds no
#               repository, and removes the one it added earlier
cassandra_install_method: repository
# The repository, or the directory of the package files. Defaults to the
# older cassandra_repository_deb_url / cassandra_repository_rpm_url.
cassandra_install_url: >-
  {{ cassandra_repository_deb_url | default('https://debian.cassandra.apache.org') if ansible_facts['os_family'] == 'Debian'
     else cassandra_repository_rpm_url | default('https://redhat.cassandra.apache.org/' ~ cassandra_version ~ '/') }}
# Credentials when the mirror needs them to read (a user and its password, or
# a service account and its token): used for the repository, the package
# files and the key URL. Keep the password in a vault. Default to the older
# cassandra_repository_username / cassandra_repository_password.
cassandra_install_username: "{{ cassandra_repository_username | default('') }}"
cassandra_install_password: "{{ cassandra_repository_password | default('') }}"
cassandra_repository_username: ""
cassandra_repository_password: ""
# Older names of cassandra_install_url: the Apache repositories, or a mirror
# of them (a repository manager, reposync...)
cassandra_repository_deb_url: https://debian.cassandra.apache.org
cassandra_repository_rpm_url: "https://redhat.cassandra.apache.org/{{ cassandra_version }}/"
debian_packages:
  - apt-transport-https
  - curl
  - gnupg
  - python3-debian
cassandra_apt_keyring_path: /etc/apt/keyrings/apache-cassandra.asc
cassandra_rpm_key_path: /etc/pki/rpm-gpg/apache-cassandra.asc
# Signing keys of the Apache Cassandra releases. "" = the copy shipped with
# the role (files/KEYS); a URL (e.g. a mirror) is downloaded instead, and
# must hold only keys whose fingerprint is in this list (default: the keys
# of the shipped copy).
cassandra_repository_key_url: ""
cassandra_repository_key_fingerprints: "{{ _cassandra_repository_shipped_fingerprints }}"
