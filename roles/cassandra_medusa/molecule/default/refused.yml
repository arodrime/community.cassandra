---
# The role with the settings in item stops at "Check the settings"
- name: Run the role with {{ item }}
  block:
    - name: Run the role
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_medusa
      vars:
        cassandra_medusa_storage_provider: "{{ item.cassandra_medusa_storage_provider | default('s3_compatible') }}"
        cassandra_medusa_base_path: "{{ item.cassandra_medusa_base_path | default('') }}"
        cassandra_medusa_host: "{{ item.cassandra_medusa_host | default('s3.example.com') }}"
        cassandra_medusa_extra_settings: "{{ item.cassandra_medusa_extra_settings | default({}) }}"

    - name: Should not be reached
      ansible.builtin.fail:
        msg: the role ran with {{ item }}
  rescue:
    - name: Check the refusal
      ansible.builtin.assert:
        that: ansible_failed_task.name == 'Check the settings'
