minor_changes:
  - "operation playbooks - without ``cassandra_hosts``, run on the ``cassandra`` group as before, else on the inventory's cluster group when the inventory holds one cluster laid out as import_cluster writes it (``<cluster>``, ``<cluster>_<dc>``, ``<cluster>_<dc>_<rack>``); otherwise fail naming the groups (new lookup ``community.cassandra.cassandra_hosts``). ``-e cassandra_hosts=<group>`` works as before."
  - "import_cluster playbook - the ``secrets.yml`` files are encrypted with Ansible's own vault password file too (``vault_password_file`` in ``ansible.cfg``, ``ANSIBLE_VAULT_PASSWORD_FILE``), and an executable password file is run (``-client`` scripts with ``--vault-id``); written in clear, a warning ends the run, and a vaulted file already there is never overwritten in clear. A vaulted file whose content is unchanged is left as it is."
  - "import_cluster playbook - every file written starts with a ``# Written by community.cassandra.import_cluster`` line; a re-import (``import_cluster_force``) writes the files at its own paths, removes the files with that line it no longer writes (a node gone from the ring), and keeps any other file in the inventory dir (``group_vars/all/*.yml``, ``ansible.cfg``, notes), listed in the report. Files written by an earlier release have no such line: they are kept, and replaced only at the paths the import writes."
