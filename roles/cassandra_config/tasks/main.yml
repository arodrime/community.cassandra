---
- name: Check the variables
  ansible.builtin.import_tasks: checks.yml

- name: Check that the Cassandra package's config is there
  ansible.builtin.stat:
    path: "{{ _cassandra_config_pkg_conf_dir }}"
  register: cassandra_config_pkg_conf

- name: Stop if Cassandra is not installed
  ansible.builtin.fail:
    msg: "{{ _cassandra_config_pkg_conf_dir }} not found: install Cassandra first (cassandra_install)"
  when:
    - not cassandra_config_pkg_conf.stat.exists
    - not ansible_check_mode

- name: Nothing to compare yet (--check before the package is installed)
  ansible.builtin.set_fact:
    _cassandra_config_items:
      - item: config files
        before: Cassandra not installed yet
        after: "{{ _cassandra_config_files[_cassandra_config_series] | length }} files templated"
  when: not cassandra_config_pkg_conf.stat.exists

- name: Check the variables against the release to install
  ansible.builtin.import_tasks: since.yml
  when: not cassandra_config_pkg_conf.stat.exists

- name: Configure
  when: cassandra_config_pkg_conf.stat.exists
  block:
    - name: Read the node
      ansible.builtin.import_tasks: read.yml

    - name: Tell whether the node is blank
      ansible.builtin.import_tasks: node_state.yml

    - name: Compare the new files with the live ones
      ansible.builtin.import_tasks: compare.yml

    # (its restart, by the run or later, would take it back: Cassandra starts with the earlier mode, or not at all;
    # or more than one step ahead, CASSANDRA_4 to NONE)
    - name: Refuse a storage_compatibility_mode before the one Cassandra runs, or two steps after it
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: storage_mode_guard.yml
      vars:
        _cassandra_storage_mode_written: true  # the inventory's mode, written then restarted with
      when: cassandra_version == '50x'

    - name: Show the changes and confirm them
      ansible.builtin.import_tasks: confirm.yml

    # before the JVM options file that loads them
    - name: The Prometheus exporter's jar and config
      ansible.builtin.include_tasks: prometheus_exporter.yml
      vars:
        _cassandra_config_perm_file: jmx_prometheus.yml  # their owner and group, the config's mode
      when: cassandra_prometheus_exporter_enabled | bool

    - name: Write the files and directories
      ansible.builtin.import_tasks: apply.yml

    # after the JVM options file: the old jars, everything when it is turned off
    - name: Remove what the Prometheus exporter's agent no longer needs
      ansible.builtin.include_tasks: prometheus_exporter_cleanup.yml

- name: JMX users and cqlsh credentials
  ansible.builtin.include_tasks: access.yml
  when: cassandra_config_pkg_conf.stat.exists

- name: Report
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_change_report
  vars:
    cassandra_change_report_role: cassandra_config
    cassandra_change_report_items: "{{ _cassandra_config_items | default([]) }}"
