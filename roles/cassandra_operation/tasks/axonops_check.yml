---
# Before Cassandra is stopped to restart, rebooted, or started: on a node with the AxonOps agent on
# (cassandra_axonops_enabled), the options file its cassandra-env.sh sources must be there, or the start fails (sh
# stops on a missing sourced file). The node is left as it is when it is not.
- name: Look for the AxonOps Java agent's options file
  ansible.builtin.stat:
    path: /usr/share/axonops/axonops-jvm.options
  register: cassandra_operation_axonops_options
  check_mode: false  # reads only
  when: cassandra_axonops_enabled | default(false) | bool

- name: Stop without the AxonOps Java agent's options file
  ansible.builtin.fail:
    msg: "{{ _said | join(_nl) }}"
  when:
    - cassandra_axonops_enabled | default(false) | bool
    - not cassandra_operation_axonops_options.stat.exists | default(true)
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    _said:
      - "STOPPED  {{ inventory_hostname }}  nothing was changed on it"
      - "  /usr/share/axonops/axonops-jvm.options is missing"
      - "  cassandra-env.sh sources it (cassandra_axonops_enabled): Cassandra would not start"
      - "WAY OUT  run apply_config (it installs the AxonOps Java agent package again), then run this again"
