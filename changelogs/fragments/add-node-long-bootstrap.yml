minor_changes:
  - add_node, replace_node, decommission_node, remove_dead_node, add_datacenter, cleanup - streaming operations and cleanups are waited for as long as they make progress, with a progress line every ``cassandra_stream_check_interval`` seconds (percentage, bytes, tables, ETA from ``nodetool netstats`` or ``compactionstats``); the run stops only after ``cassandra_stream_stall_checks`` checks in a row without progress, and ``cassandra_stream_max_time`` sets an optional overall limit.
  - add_node - one confirmation screen before starting (cluster, version, Java, new nodes with their datacenter, rack and estimated data to stream, cleanup choice, warnings for uneven racks and for a run outside tmux or screen); the cleanup command for the nodes that handed data over is printed at the end, or run with ``cassandra_add_node_cleanup`` (``one``, ``rack``, ``dc`` or ``all``).
  - cassandra_netstats - returns the stream sessions with their progress (``sessions``).
bugfixes:
  - add_node - a node's bootstrap was waited for only ``cassandra_service_wait_timeout`` (600 seconds), and a run again then refused the node still joining; the bootstrap is now waited for as long as it makes progress, and a run again waits for a bootstrap still in progress.
