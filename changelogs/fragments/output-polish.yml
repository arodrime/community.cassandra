minor_changes:
  - "ops callback - a line marked ``← differs`` or giving an apply_config outcome (``node1  would apply, then restart``), a reset (``will be reset``) and what it deletes (``DELETED``) is yellow, a ``← down`` one and a recap's failed node red, whatever line it is under (an outcome line when not indented); the rows of a ``FAILED`` recap keep their own colour; ``CHECK`` is yellow when it says what a real run would do (green only with nothing to do, red with a node that failed); ``IMPORT ... PASSED`` green, ``FAILED`` red; the first line of a plan or a screen in the progress colour."
  - "ops callback - the ``WARNING`` lines are in Ansible's own warning colour (``COLOR_WARN``, ``[colors] warn`` in ``ansible.cfg``, bright purple by default), as Ansible's ``[WARNING]`` lines, apart from the changes (yellow); the new ``warning_color`` option (``ANSIBLE_CALLBACK_CASSANDRA_OPS_WARNING_COLOR``) sets another colour."
  - "add_node, decommission_node, rolling_restart, rolling_reboot, replace_node, move_node, update_java, upgrade, cleanup, remove_datacenter - the run ends with a recap (``DONE``, ``FAILED`` or ``CHECK``, then the nodes grouped by outcome, with their times) instead of a line per node (``NOTHING TO DO`` when no node had anything to do; add_datacenter on a failure); in the operations that start, stop or restart Cassandra, apply_config too, the cassandra_service changes (unit, state, start at boot) are no longer listed for each node in the middle of the run (``-v`` or ``cassandra_change_report_dir`` still give them), and say ``would be`` under ``--check`` where they are."
  - "reset_node - the run ends with ``DONE`` (``CHECK`` under ``--check``) and the add_node command for the nodes emptied."
  - "preflight - a setting that must be the same on every node (``cassandra_num_tokens``, the seed list...) stops the run with a sentence: the values by nodes, where to set it once, which host_vars to clean, instead of a Python dict and an internal variable name."
  - "nodetool modules - when nodetool does not reach JMX, the failure names the address, the cause (``Connection refused``, no answer in time, no route to host, unknown host) and what to check, instead of ``Unable to determine Cassandra version``."
  - "import_cluster - under ``--diff``, a file the import writes for the first time is not shown whole (the screen lists it, the report details it); the changes to the files already there are."
