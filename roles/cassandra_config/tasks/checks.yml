---
# The variables checked before anything is read on the node: a value Cassandra would
# refuse to start with stops the run here.
- name: Assert required cassandra_config variables are set
  ansible.builtin.assert:
    that:
      - cassandra_conf_dir is defined and cassandra_conf_dir != ""
      - cassandra_data_file_directories | length > 0
      - cassandra_config_confirm | string | lower in ['auto', 'true', 'false', 'yes', 'no']
      - _cassandra_config_gc_names | reject('in', ['G1', 'CMS', 'custom']) | list | length == 0
      - cassandra_data_dir is defined and cassandra_data_dir != ""
      - cassandra_version in ["40x", "41x", "50x"]
    fail_msg: >-
      cassandra_conf_dir, cassandra_data_dir and cassandra_data_file_directories must not be empty,
      cassandra_version must be one of 40x, 41x, 50x, cassandra_config_confirm auto, true or false, and
      cassandra_jvm_gc (cassandra_jvm<N>_gc) one of G1, CMS, custom

# Cassandra refuses to start without a period above zero in periodic mode
# (4.1+: a duration in ms or a larger unit)
- name: Assert the commit log sync settings
  ansible.builtin.assert:
    that:
      - cassandra_commitlog_sync in ['periodic', 'group', 'batch']
      - >-
        cassandra_commitlog_sync != 'periodic'
        or (cassandra_commitlog_sync_period_in_ms | int > 0 if cassandra_version == '40x'
            else (cassandra_commitlog_sync_period | string) is match(_cassandra_config_duration_ms))
    fail_msg: >-
      cassandra_commitlog_sync must be periodic, group or batch, and in periodic mode
      {{ 'cassandra_commitlog_sync_period_in_ms above zero (milliseconds)' if cassandra_version == '40x'
         else 'cassandra_commitlog_sync_period above zero, in ms or a larger unit (e.g. 10000ms)' }}

# Group mode has no default window, as in Cassandra, which refuses to start without one
- name: Assert the commit log group window is set
  ansible.builtin.assert:
    that: >-
      cassandra_commitlog_sync_group_window_in_ms | float > 0 if cassandra_version == '40x'
      else (cassandra_commitlog_sync_group_window | string) is match(_cassandra_config_duration_ms)
    fail_msg: >-
      cassandra_commitlog_sync is group: set
      {{ 'cassandra_commitlog_sync_group_window_in_ms (e.g. 15' if cassandra_version == '40x'
         else 'cassandra_commitlog_sync_group_window (e.g. 15ms' }}; the time a write may wait for the group fsync),
      above zero
  when: cassandra_commitlog_sync == 'group'

# Your own template for a file the role writes (not one it keeps as it is): a file on the controller
- name: Refuse template overrides the role cannot use
  ansible.builtin.assert:
    that: _wrong | length == 0
    fail_msg: "cassandra_config_template_overrides: {{ _wrong | join('; ') }}. Nothing is changed."
    quiet: true
  vars:
    _files: "{{ _cassandra_config_files[_cassandra_config_series] }}"
    _wrong: >-
      {%- set out = [] -%}
      {%- if cassandra_config_template_overrides is not mapping -%}
      {%-   set _ = out.append('a dict of {file name: template path} is expected') -%}
      {%- else -%}
      {%-   for f, path in cassandra_config_template_overrides.items() -%}
      {%-     if f not in _files -%}
      {%-       set _ = out.append(f ~ ' is not a file the role writes (' ~ _files | join(', ') ~ ')') -%}
      {%-     elif path is not string or path is not match('/') -%}
      {%-       set _ = out.append(f ~ ': an absolute path on the controller is expected (e.g. under inventory_dir)') -%}
      {%-     elif path is not file -%}
      {%-       set _ = out.append(f ~ ': ' ~ path ~ ' not found on the controller') -%}
      {%-     elif f in cassandra_config_keep_files -%}
      {%-       set _ = out.append(f ~ ' is also in cassandra_config_keep_files (left as the node has it): one or the other') -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ out }}

# Variables of the 2.1.0 release candidates no longer read (an inventory imported then): the files would be
# written without their lines (the role run alone too, site.yml: the playbooks refuse them in preflight already)
- name: Refuse the variables no longer read
  ansible.builtin.assert:
    that: _removed | length == 0
    fail_msg: >-
      {%- set out = [] -%}
      {%- for name in _removed -%}
      {%-   set _ = out.append(name ~ ' ' ~ name | community.cassandra.cassandra_former_name_text) -%}
      {%- endfor -%}
      {{ out | join(' ') }} Nothing is changed.
    quiet: true
  vars:
    _removed: "{{ query('ansible.builtin.varnames', '^cassandra_(env|logback)_extra_lines$') | sort }}"

# Your own template pieces: logback.xml and cassandra-env.sh only (their insertion points), a file on the
# controller, for a file the role writes with its own template
- name: Refuse template snippets the role cannot use
  ansible.builtin.assert:
    that: _wrong | length == 0
    fail_msg: "cassandra_config_template_snippets: {{ _wrong | join('; ') }}. Nothing is changed."
    quiet: true
  vars:
    _wrong: >-
      {%- set out = [] -%}
      {%- if cassandra_config_template_snippets is not mapping -%}
      {%-   set _ = out.append('a dict of {file name: template path} is expected') -%}
      {%- else -%}
      {%-   for f, path in cassandra_config_template_snippets.items() -%}
      {%-     if f not in ['logback.xml', 'logback.xml:appenders', 'cassandra-env.sh'] -%}
      {%-       set _ = out.append(f ~ ': only logback.xml, logback.xml:appenders and cassandra-env.sh take a snippet'
                                   ~ ' (the JVM options files: cassandra_jvm*_extra_options)') -%}
      {%-     elif path is not string or path is not match('/') -%}
      {%-       set _ = out.append(f ~ ': an absolute path on the controller is expected (e.g. under inventory_dir)') -%}
      {%-     elif path is not file -%}
      {%-       set _ = out.append(f ~ ': ' ~ path ~ ' not found on the controller') -%}
      {%-     elif f.split(':') | first in cassandra_config_keep_files -%}
      {%-       set _ = out.append(f ~ ': its file is also in cassandra_config_keep_files (left as the node has it): one'
                                   ~ ' or the other') -%}
      {%-     elif f.split(':') | first in cassandra_config_template_overrides -%}
      {%-       set _ = out.append(f ~ ": its file is also in cassandra_config_template_overrides (your whole template):"
                                   ~ " put the lines in it, or use the role's template with the snippet") -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endif -%}
      {{ out }}

# logback.xml: an appender-ref to an appender the file does not define stops logback's configuration at the start
# (logback 1.2 also wants it defined before); a level for a logger a variable of its own sets would be set twice;
# a value the template writes as it is must keep the file XML (else logback reads none of it, on every node)
- name: Refuse logback appender-refs, levels and values the role cannot write
  ansible.builtin.assert:
    that: _wrong | length == 0
    fail_msg: |-
      {{ _wrong | join('\n') }}
      Nothing is changed.
    quiet: true
  vars:
    _known: >-
      {{ _cassandra_config_stock_appenders + (['AUDIT'] if cassandra_log_audit_file | bool else [])
         + (['CQLLOG'] if cassandra_version == '50x' and cassandra_log_cql_table | default(false) | bool else [])
         + (_cassandra_config_snippet_appenders | regex_findall('<appender\s[^>]*?\bname\s*=\s*["\x27]([^"\x27]+)["\x27]')) }}
    # appenders and loggers of your snippet at the end of <configuration>
    _after_root: >-
      {{ _cassandra_config_snippet_logback | regex_findall('<appender\s[^>]*?\bname\s*=\s*["\x27]([^"\x27]+)["\x27]') }}
    _snippet_loggers: >-
      {{ (_cassandra_config_snippet_logback ~ '\n' ~ _cassandra_config_snippet_appenders)
         | regex_findall('<logger\s[^>]*?\bname\s*=\s*["\x27]([^"\x27]+)["\x27]') }}
    _wrong: >-
      {%- set out = [] -%}
      {%- if cassandra_logback_root_extra_refs is string or cassandra_logback_root_extra_refs is mapping -%}
      {%-   set _ = out.append('cassandra_logback_root_extra_refs: a list of appender names is expected') -%}
      {%- else -%}
      {%-   for ref in cassandra_logback_root_extra_refs if ref not in _known -%}
      {%-     if ref in _after_root -%}
      {%-       set _ = out.append('cassandra_logback_root_extra_refs: ' ~ ref ~ ' is defined in your snippet logback.xml,'
                                 ~ ' after <root>, where logback (1.2) does not find it: move it to your snippet'
                                 ~ ' logback.xml:appenders (cassandra_config_template_snippets), before <root>') -%}
      {%-     else -%}
      {%-       set _ = out.append('cassandra_logback_root_extra_refs: ' ~ ref ~ ' is not an appender of logback.xml ('
                                 ~ _known | join(', ') ~ '); define it in your snippet logback.xml:appenders'
                                 ~ ' (cassandra_config_template_snippets), or remove it') -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endif -%}
      {%- if cassandra_log_cql_table | bool and cassandra_version != '50x' -%}
      {%-   set _ = out.append('cassandra_log_cql_table: the system_views.system_logs table is 5.0 only: set it to false'
                             ~ ' for Cassandra ' ~ cassandra_version) -%}
      {%- endif -%}
      {%- if cassandra_log_cql_table | bool and 'CQLLOG' in cassandra_logback_root_extra_refs -%}
      {%-   set _ = out.append('cassandra_logback_root_extra_refs: CQLLOG is named by cassandra_log_cql_table already:'
                             ~ ' remove it from the list') -%}
      {%- endif -%}
      {%- if cassandra_log_levels is not mapping -%}
      {%-   set _ = out.append('cassandra_log_levels: a dict of {logger name: level} is expected') -%}
      {%- else -%}
      {%-   for name, level in cassandra_log_levels.items() -%}
      {%-     set own = 'ROOT' if name | string | upper == 'ROOT' else name -%}
      {%-     if own in _cassandra_config_own_loggers -%}
      {%-       set _ = out.append('cassandra_log_levels: ' ~ name ~ ' is set by ' ~ _cassandra_config_own_loggers[own]
                                 ~ ': set it there, and remove ' ~ name ~ ' from cassandra_log_levels') -%}
      {%-     elif name in _snippet_loggers -%}
      {%-       set _ = out.append('cassandra_log_levels: ' ~ name ~ ' is also a logger of your snippet of logback.xml'
                                 ~ ' (cassandra_config_template_snippets): logback would set it twice; keep one of them') -%}
      {%-     elif (level | string | upper) not in ['TRACE', 'DEBUG', 'INFO', 'WARN', 'ERROR', 'OFF', 'ALL'] -%}
      {%-       set _ = out.append('cassandra_log_levels: ' ~ name ~ ': ' ~ level ~ ' is not a level (TRACE, DEBUG, INFO,'
                                 ~ ' WARN, ERROR, OFF, ALL; quoted: an unquoted OFF is a boolean in YAML)') -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endif -%}
      {#- the values written as they are in logback.xml: [variable, value, in an attribute, the variable that leaves
          the part it is in commented out (false)] -#}
      {%- set audit = '' if cassandra_log_audit_file | bool else 'cassandra_log_audit_file' -%}
      {#- (your own template of logback.xml: its comments are yours) -#}
      {%- set overrides = cassandra_config_template_overrides if cassandra_config_template_overrides is mapping else {} -%}
      {%- set turned_on = {'cassandra_log_audit_file': ': logback.xml then writes the audit events (FileAuditLogger) to'
                                                      ' audit/audit.log, no longer to system.log',
                           'cassandra_log_cql_table': ': logback.xml then writes the logs to the'
                                                     ' system_views.system_logs table too'} -%}
      {%- set xml = [['cassandra_log_level', cassandra_log_level, true, ''],
                     ['cassandra_log_level_cassandra', cassandra_log_level_cassandra, true, ''],
                     ['cassandra_log_pattern', cassandra_log_pattern, false, audit]] -%}
      {%- for var, value, commented in [
            ['cassandra_log_system_max_file_size', cassandra_log_system_max_file_size, ''],
            ['cassandra_log_system_max_history', cassandra_log_system_max_history, ''],
            ['cassandra_log_system_total_size_cap', cassandra_log_system_total_size_cap, ''],
            ['cassandra_log_debug_max_file_size', cassandra_log_debug_max_file_size, ''],
            ['cassandra_log_debug_max_history', cassandra_log_debug_max_history, ''],
            ['cassandra_log_debug_total_size_cap', cassandra_log_debug_total_size_cap, ''],
            ['cassandra_log_audit_max_file_size', cassandra_log_audit_max_file_size, audit],
            ['cassandra_log_audit_max_history', cassandra_log_audit_max_history, audit],
            ['cassandra_log_audit_total_size_cap', cassandra_log_audit_total_size_cap, audit],
            ['cassandra_log_audit_dir', cassandra_log_audit_dir, audit]] -%}
      {%-   set _ = xml.append([var, value, false, commented]) -%}
      {%- endfor -%}
      {%- if cassandra_version == '50x' -%}
      {%-   set _ = xml.append(['cassandra_log_cql_table_level', cassandra_log_cql_table_level, false, '' if
                                cassandra_log_cql_table | bool else 'cassandra_log_cql_table']) -%}
      {%- endif -%}
      {%- for name in (cassandra_log_levels if cassandra_log_levels is mapping else {}) -%}
      {%-   set _ = xml.append(['cassandra_log_levels', name, true, '']) -%}
      {%- endfor -%}
      {%- for ref in ([] if cassandra_logback_root_extra_refs is string or cassandra_logback_root_extra_refs is mapping
                      else cassandra_logback_root_extra_refs) -%}
      {%-   set _ = xml.append(['cassandra_logback_root_extra_refs', ref, true, '']) -%}
      {%- endfor -%}
      {%- for var, value, attribute, commented in xml -%}
      {%-   set text = value | string -%}
      {%-   if '<' in text -%}
      {%-     set _ = out.append(var ~ ': ' ~ text ~ ' has a <, which ends the XML value there: write it &lt;') -%}
      {%-   endif -%}
      {#-   (logback's parser knows only XML's own five entities) -#}
      {%-   if text is search('&(?!(?:amp|lt|gt|quot|apos);|#[0-9]+;|#x[0-9A-Fa-f]+;)') -%}
      {%-     set _ = out.append(var ~ ': ' ~ text ~ ' has an & that starts no XML entity (&amp; &lt; &gt; &quot; &apos;'
                               ~ ' &#number;): write it &amp;') -%}
      {%-   endif -%}
      {%-   if not attribute and ']]>' in text -%}
      {%-     set _ = out.append(var ~ ': ' ~ text ~ ' has a ]]>, which XML does not take in a text: write it ]]&gt;') -%}
      {%-   endif -%}
      {%-   if attribute and '"' in text -%}
      {%-     set _ = out.append(var ~ ': ' ~ text ~ ' has a ", which ends the XML attribute there: write it &quot;') -%}
      {%-   endif -%}
      {%-   if commented and '--' in text and 'logback.xml' not in overrides -%}
      {%-     set _ = out.append(var ~ ': ' ~ text ~ ' has a --, which XML does not take in a comment, where the'
                               ~ ' template writes it while ' ~ commented ~ ' is false. Way out, one of:'
                               ~ '\n  write it without --'
                               ~ '\n  set ' ~ commented ~ ' to true' ~ turned_on[commented]
                               ~ '\n  add logback.xml to cassandra_config_keep_files: the node keeps its logback.xml as it is'
                               ~ '\n  write logback.xml from your own template (cassandra_config_template_overrides)') -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  when: "'logback.xml' not in cassandra_config_keep_files"  # (a file kept as it is: none of them written)

# FileAuditLogger without the audit file: its events go to system.log (logback's root)
- name: Warn about audit events going to system.log
  ansible.builtin.debug:
    msg: >-
      WARNING  {{ inventory_hostname }}: Cassandra audits with FileAuditLogger, and cassandra_log_audit_file is false:
      the audit events go to system.log, not audit/audit.log. Set cassandra_log_audit_file to true for a file of their
      own, or leave it so if wanted.
  vars:
    cassandra_output: true
  when:
    - cassandra_audit_logging_enabled | bool
    - (cassandra_audit_logger_class_name | string).split('.') | last == 'FileAuditLogger'
    - not cassandra_log_audit_file | bool

- name: Refuse audit logger parameters the template cannot write
  ansible.builtin.assert:
    that: cassandra_audit_logger_parameters is mapping and _wrong | length == 0
    fail_msg: >-
      cassandra_audit_logger_parameters: {{ _wrong | join(', ') if _wrong else 'a mapping is expected' }}. A key is
      written plain: a letter or _ first, then letters, digits, _ . or -, not a word YAML reads as a boolean or
      null (on, yes, null...); a value is a text, a number or a boolean, on one line, without control characters
  vars:
    # each key that cannot be written plain (shown as JSON), and the key of each value that cannot be written (the
    # value not shown: it may be a secret)
    _wrong: >-
      {%- set out = [] -%}
      {%- for key, value in (cassandra_audit_logger_parameters.items() if cassandra_audit_logger_parameters is mapping
                             else []) -%}
      {%-   if not (key is string and key is match(_cassandra_config_plain_key)) -%}
      {%-     set _ = out.append('key ' ~ (key | string | to_json)) -%}
      {%-   elif not (value is string or value is number or value is boolean)
                 or value | string is search(_cassandra_config_unwritable_text) -%}
      {%-     set _ = out.append('the value of ' ~ key) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  when: cassandra_audit_logger_parameters | length > 0

- name: Refuse extra settings the template already has
  ansible.builtin.assert:
    that: _taken | length == 0
    fail_msg: >-
      cassandra_extra_settings: {{ _named | join(', ') }} already in cassandra.yaml, or the former name of a key
      whose variable is set (Cassandra refuses both names): set them with their variable
  vars:
    # (the one written: cassandra_config_template_overrides' when set)
    _template: >-
      {{ lookup('ansible.builtin.file', ('' if _cassandra_config_templates['cassandra.yaml'] is match('/') else role_path ~ '/templates/')
                                        ~ _cassandra_config_templates['cassandra.yaml']) }}
    _keys: >-
      {{ _template | regex_findall('(?m)^(?:\{\{[^}]*\}\})?([a-z0-9_]+):') }}
    # a section of _cassandra_config_extra_sections: a dict of other sub-keys than its variables'; a dotted key
    # (sstable.selected_format) by its first part; 4.1+: a former name of a key whose variable is set
    _taken: >-
      {%- set out = cassandra_extra_settings | list | intersect(_keys)
                    | difference(_cassandra_config_extra_sections | list) -%}
      {%- for key in cassandra_extra_settings if key is search('[.]') and key.split('.') | first in _keys -%}
      {%-   set _ = out.append(key) -%}
      {%- endfor -%}
      {%- for key, var in _old.items() if key in cassandra_extra_settings and key not in _keys
                                                                and lookup('ansible.builtin.vars', var) | string not in ['', 'None'] -%}
      {%-   set _ = out.append(key) -%}
      {%- endfor -%}
      {%- for section, own in _cassandra_config_extra_sections.items() if section in cassandra_extra_settings -%}
      {%- set value = cassandra_extra_settings[section] -%}
      {%- set _ = out.extend([section] if value is not mapping
                             else value | list | intersect(own | list) | map('regex_replace', '^', section ~ '.')) -%}
      {%- endfor -%}
      {{ out }}
    # 4.1+: a key's former name -> its variable
    _old: >-
      {{ {} if cassandra_version == '40x'
         else _cassandra_config_old_names | combine(_cassandra_config_old_names_of[_cassandra_config_series] | default({})) }}
    # each with its variable: the one of its template line, a section's sub-key's (_cassandra_config_extra_sections),
    # or the one its former name goes with
    _named: >-
      {%- set out = [] -%}
      {%- for key in _taken -%}
      {%-   set line = _template | regex_findall('(?m)^(?:\{\{[^}]*\}\})?' ~ key.split('.') | first ~ ':.*$') | first | default('') -%}
      {%-   set part = key.split('.') -%}
      {%-   set var = _old[key] if key in _old and key not in _keys
                      else _cassandra_config_extra_sections[part[0]][part[1]]
                           if part | length == 2 and part[1] in _cassandra_config_extra_sections.get(part[0], {})
                      else line | regex_findall('cassandra_\w+') | first | default('') -%}
      {%-   set _ = out.append(key ~ ((' (' ~ var ~ ')') if var else '')) -%}
      {%- endfor -%}
      {{ out }}
  when: cassandra_extra_settings | length > 0

# Cassandra 5.0 refuses to start with BTI in storage_compatibility_mode CASSANDRA_4 (4.x nodes may still read its
# SSTables), and a format name other than big or bti
- name: Refuse an SSTable format Cassandra would not start with
  ansible.builtin.assert:
    that:
      - cassandra_sstable_format | string in ['', 'None', 'big', 'bti']
      - cassandra_sstable_format != 'bti' or cassandra_storage_compatibility_mode != 'CASSANDRA_4'
    fail_msg: >-
      cassandra_sstable_format must be big or bti (lower case), and bti needs cassandra_storage_compatibility_mode
      UPGRADING or NONE (it is {{ cassandra_storage_compatibility_mode }}): Cassandra refuses to start with BTI while in
      CASSANDRA_4. Move on from CASSANDRA_4 first (a rolling restart), or keep big; nothing is changed.
    quiet: true
  when: cassandra_version == '50x'

# Cassandra refuses to start on another value (5.0 also refuses its own direct)
- name: Refuse a disk_access_mode Cassandra would not start with
  ansible.builtin.assert:
    that: cassandra_disk_access_mode | string in ['', 'None', 'auto', 'mmap', 'mmap_index_only', 'standard'] + _legacy
    fail_msg: >-
      cassandra_disk_access_mode {{ cassandra_disk_access_mode }}: Cassandra {{ _cassandra_config_series }} takes auto, mmap,
      mmap_index_only or standard{{ ' (5.0 also legacy)' if _legacy else '' }}; nothing is changed.
    quiet: true
  vars:
    _legacy: "{{ ['legacy'] if cassandra_version == '50x' else [] }}"

# 5.0's cassandra-env.sh always gives -XX:HeapDumpPath: empty, the dumps would go to /
- name: Refuse an empty heap dump dir on 5.0
  ansible.builtin.assert:
    that: cassandra_heap_dump_dir | string not in ['', 'None']
    fail_msg: >-
      cassandra_heap_dump_dir is empty: 5.0's cassandra-env.sh would give the JVM -XX:HeapDumpPath=/cassandra-<time>-pid<pid>.hprof.
      Remove it from the inventory (the log dir, as in stock) or set a directory; nothing is changed.
    quiet: true
  when: cassandra_version == '50x'

# GossipingPropertyFileSnitch takes the node's dc and rack from the file: other lines would
# move it (e.g. kept by import_cluster under SimpleSnitch, then the snitch changed)
- name: Refuse rackdc lines other than the node's dc and rack under a snitch that reads them
  ansible.builtin.assert:
    that: >-
      [cassandra_rackdc_dc | string, cassandra_rackdc_rack | string] == [cassandra_dc | string, cassandra_rack | string]
      or cassandra_endpoint_snitch | regex_replace('^org[.]apache[.]cassandra[.]locator[.]', '')
         in _cassandra_config_snitches_without_rackdc
    fail_msg: >-
      {{ cassandra_endpoint_snitch }} reads the node's dc and rack from cassandra-rackdc.properties: cassandra_rackdc_dc
      ({{ cassandra_rackdc_dc }}) and cassandra_rackdc_rack ({{ cassandra_rackdc_rack }}) must be cassandra_dc
      ({{ cassandra_dc }}) and cassandra_rack ({{ cassandra_rack }}). Remove them from the inventory.
    quiet: true

# Unless G1 is in use, cassandra-env.sh exits when only one of MAX_HEAP_SIZE
# and HEAP_NEWSIZE is set (with G1 it ignores HEAP_NEWSIZE, written as found); the heap in the JVM options writes
# neither (cassandra-env.sh works the young generation out itself without -Xmn)
- name: Assert heap settings are consistent
  ansible.builtin.assert:
    that: >-
      (cassandra_heap_newsize == '' or cassandra_heap_size != '') if cassandra_heap_in_jvm_options | bool
      else (_cassandra_config_gcs | reject('equalto', 'G1') | list | length == 0
            or (cassandra_heap_size == '') == (cassandra_heap_newsize == ''))
    fail_msg: >-
      {{ 'With cassandra_heap_in_jvm_options, cassandra_heap_newsize goes with cassandra_heap_size (-Xmn is written
      with -Xms and -Xmx): set cassandra_heap_size, or cassandra_heap_newsize to ""'
      if cassandra_heap_in_jvm_options | bool else 'Without G1 (cassandra_jvm_gc, cassandra_jvm<N>_gc), set
      cassandra_heap_size and cassandra_heap_newsize together, or neither' }}

# The heap in the JVM options: -Xmn there with G1 stops cassandra-env.sh
- name: Assert no young generation size with G1 when the heap is in the JVM options
  ansible.builtin.assert:
    that: not (cassandra_heap_in_jvm_options | bool) or cassandra_heap_newsize == '' or 'G1' not in _cassandra_config_gcs
    fail_msg: >-
      cassandra_heap_in_jvm_options writes cassandra_heap_newsize as -Xmn in jvm-server.options, which cassandra-env.sh
      refuses with G1 (Cassandra would not start): set cassandra_heap_newsize to "", or cassandra_heap_in_jvm_options
      to false
    quiet: true

# The heap in the JVM options: jvm-server.options written by the role
- name: Refuse the heap in the JVM options with jvm-server.options left as it is
  ansible.builtin.assert:
    that: not (cassandra_heap_in_jvm_options | bool) or 'jvm-server.options' not in cassandra_config_keep_files
    fail_msg: >-
      cassandra_heap_in_jvm_options writes the heap in jvm-server.options, which is in cassandra_config_keep_files (the
      role leaves it as it is): the heap would be in neither file. Remove jvm-server.options from
      cassandra_config_keep_files, or set cassandra_heap_in_jvm_options to false (MAX_HEAP_SIZE in cassandra-env.sh);
      nothing is changed.
    quiet: true

# G1's tuning values, written as they are in the JVM options files: a number (a size for the heap region), or ""
# for the stock line commented out; the JVM refuses another text (300ms, 50%)
- name: Refuse G1 tuning values the JVM would not start with
  ansible.builtin.assert:
    that: _wrong | length == 0
    fail_msg: >-
      {{ 'Values' if _wrong | length > 1 else 'A value' }} cassandra_config does not take: {{ _wrong | join('; ') }}.
      Write a plain number (e.g. 300, no unit; the heap region size a number with k, m or g, e.g. 16m), or "" to
      comment its stock line out; nothing is changed.
    quiet: true
  vars:
    _wrong: >-
      {%- set out = [] -%}
      {%- for name in ['max_tenuring_threshold', 'g1_heap_region_size', 'g1_new_size_percent',
                       'g1_rset_updating_pause_time_percent', 'max_gc_pause_millis',
                       'initiating_heap_occupancy_percent'] -%}
      {%-   for prefix in ['cassandra_jvm_', 'cassandra_jvm8_', 'cassandra_jvm11_', 'cassandra_jvm17_'] -%}
      {%-     set value = lookup('ansible.builtin.vars', prefix ~ name, default='') | string -%}
      {%-     if value is not match('^([0-9]+[kKmMgG]?|)$' if name == 'g1_heap_region_size' else '^([0-9]+|)$') -%}
      {%-       set _ = out.append(prefix ~ name ~ ' ' ~ value) -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ out }}

# 5.0 with G1: HEAP_NEWSIZE is written as given (import_cluster keeps one found), and Cassandra ignores it (its
# cassandra-env.sh says so at each start): said, not refused; once a run (apply_config and upgrade say it in their
# preview, not again at each node's write)
- name: Warn about a young generation size G1 ignores
  ansible.builtin.debug:
    msg: >-
      WARNING  {{ inventory_hostname }}: cassandra_heap_newsize is {{ cassandra_heap_newsize }}, written as HEAP_NEWSIZE
      in cassandra-env.sh, which 5.0 with G1 ignores (it logs "HEAP_NEWSIZE has erroneously been set" at each start).
      Remove cassandra_heap_newsize from the inventory unless the node runs it so on purpose.
  vars:
    cassandra_output: true
  when:
    - cassandra_version == '50x'
    - cassandra_heap_newsize != ''
    - "'G1' in _cassandra_config_gcs"
    - not _cassandra_config_no_newsize_warning | default(false) | bool

# The exporter's agent makes the JVM exit when it cannot start (a jar, a config or an address it cannot use);
# bin/cassandra splits the options file's lines on blanks
- name: Refuse Prometheus exporter settings the agent would not start with
  ansible.builtin.assert:
    that: _wrong | length == 0
    fail_msg: "{{ _wrong | join('; ') }}. Nothing is changed."
    quiet: true
  vars:
    _config: "{{ cassandra_prometheus_exporter_config | trim }}"
    _tls: >-
      {{ [cassandra_prometheus_exporter_tls_keystore, cassandra_prometheus_exporter_tls_keystore_password,
          cassandra_prometheus_exporter_tls_certificate_alias] | select | list | length }}
    _auth: "{{ [cassandra_prometheus_exporter_username, cassandra_prometheus_exporter_password] | select | list | length }}"
    # the JVM options the inventory adds, and your snippet of cassandra-env.sh
    _options: >-
      {{ (cassandra_jvm_extra_options + cassandra_jvm8_extra_options + cassandra_jvm11_extra_options
          + cassandra_jvm17_extra_options + [_cassandra_config_snippet_env]) | map('string') | join(' ') }}
    _wrong: >-
      {%- set out = [] -%}
      {%- if cassandra_prometheus_exporter_version is not string
             or cassandra_prometheus_exporter_version is not match('^[0-9]+([.][0-9]+)*$') -%}
      {%-   set _ = out.append('cassandra_prometheus_exporter_version must be a release number like "1.7.0" (quoted)') -%}
      {%- endif -%}
      {%- if cassandra_prometheus_exporter_port | string is not match('^[0-9]{1,5}$')
             or cassandra_prometheus_exporter_port | int < 1 or cassandra_prometheus_exporter_port | int > 65535 -%}
      {%-   set _ = out.append('cassandra_prometheus_exporter_port must be a port number (1 to 65535)') -%}
      {%- endif -%}
      {%- if cassandra_prometheus_exporter_address | string is not match('^([A-Za-z0-9_.-]+|[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*)?$') -%}
      {%-   set _ = out.append('cassandra_prometheus_exporter_address must be a host name or an address (IPv6 without brackets), or empty for every address') -%}
      {%- elif ':' in cassandra_prometheus_exporter_address | string and '-Djava.net.preferIPv4Stack=false' not in _options -%}
      {%-   set _ = out.append('cassandra_prometheus_exporter_address ' ~ cassandra_prometheus_exporter_address ~ ' is an IPv6'
                               ~ ' address: jvm-server.options sets -Djava.net.preferIPv4Stack=true, the JVM could not listen'
                               ~ ' there and Cassandra would not start (add -Djava.net.preferIPv4Stack=false to'
                               ~ ' cassandra_jvm_extra_options, or give an IPv4 address or none)') -%}
      {%- endif -%}
      {%- set taken = {'cassandra_storage_port': cassandra_storage_port, 'cassandra_ssl_storage_port': cassandra_ssl_storage_port,
                       'cassandra_native_transport_port': cassandra_native_transport_port,
                       'cassandra_jmx_port': cassandra_jmx_port,
                       'native_transport_port_ssl (cassandra_extra_settings)':
                         cassandra_extra_settings.native_transport_port_ssl | default('')} -%}
      {%- for var, port in taken.items() if port | string == cassandra_prometheus_exporter_port | string -%}
      {%-   set _ = out.append('cassandra_prometheus_exporter_port ' ~ port ~ ' is also ' ~ var ~ ': give the exporter another port') -%}
      {%- endfor -%}
      {%- if 'jvm-server.options' in cassandra_config_keep_files -%}
      {%-   set _ = out.append('jvm-server.options is in cassandra_config_keep_files: the role could not write the agent there'
                               ~ ' (remove it from the list, or keep the exporter set up by hand and this variable off)') -%}
      {%- endif -%}
      {%- if _options is search('jmx_prometheus_javaagent') -%}
      {%-   set _ = out.append('a jmx_prometheus_javaagent agent is already in cassandra_jvm*_extra_options or'
                               ~ ' your snippet of cassandra-env.sh (cassandra_config_template_snippets): the JVM would'
                               ~ ' load two (the second exits on its port); remove it there, the role writes it') -%}
      {%- endif -%}
      {%- for var in ['cassandra_prometheus_exporter_dir', 'cassandra_prometheus_exporter_config_file']
              if lookup('ansible.builtin.vars', var) | string not in ['', 'None']
                 and lookup('ansible.builtin.vars', var) | string is not match(_cassandra_config_exporter_path) -%}
      {%-   set _ = out.append(var ~ ' must be an absolute path without blanks, quotes or =') -%}
      {%- endfor -%}
      {%- if cassandra_prometheus_exporter_dir | string in ['', 'None'] -%}
      {%-   set _ = out.append('cassandra_prometheus_exporter_dir must not be empty') -%}
      {%- endif -%}
      {%- if cassandra_prometheus_exporter_config_file and (_config or _tls | int or _auth | int) -%}
      {%-   set _ = out.append('cassandra_prometheus_exporter_config_file names a config managed by other means: the role'
                               ~ ' writes none, so cassandra_prometheus_exporter_config, _tls_* and _username/_password'
                               ~ ' would be ignored (set them in that file, or leave cassandra_prometheus_exporter_config_file empty)') -%}
      {%- endif -%}
      {%- if _tls | int not in [0, 3] -%}
      {%-   set _ = out.append('HTTPS needs cassandra_prometheus_exporter_tls_keystore, _tls_keystore_password and'
                               ~ ' _tls_certificate_alias together') -%}
      {%- endif -%}
      {%- if _auth | int == 1 -%}
      {%-   set _ = out.append('basic authentication needs cassandra_prometheus_exporter_username and _password together') -%}
      {%- endif -%}
      {%- set error = _config | community.cassandra.cassandra_prometheus_config_error -%}
      {%- if error -%}
      {%-   set _ = out.append(error) -%}
      {%- elif _config and 'httpServer' in _config | from_yaml and (_tls | int or _auth | int) -%}
      {%-   set _ = out.append('cassandra_prometheus_exporter_config has its own httpServer: set HTTPS and authentication there,'
                               ~ ' or with the variables, not both') -%}
      {%- endif -%}
      {{ out }}
  when: cassandra_prometheus_exporter_enabled | bool
