bugfixes:
  - cassandra_keyspace - setting ``data_centres`` on an existing SimpleStrategy keyspace now alters it to NetworkTopologyStrategy; it was reported unchanged when ``replication_factor`` matched. A task that already sets ``data_centres`` on a SimpleStrategy keyspace, a no-op until now, alters it on its next run. After a replication change, run a full repair of the keyspace on every node (``nodetool repair -full <keyspace>``), for example for ``system_auth``. On a NetworkTopologyStrategy keyspace, leaving ``data_centres`` unset (or empty) now fails with a clear message instead of an error or a move to SimpleStrategy. Check mode returns the CQL it would run.
