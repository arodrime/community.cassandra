# ===========================================================
- name: Get netstats
  community.cassandra.cassandra_netstats:
    debug: true
  register: netstats

- name: Assert the node is joined and idle
  assert:
    that:
      - netstats.mode == 'NORMAL'
      - not netstats.streaming
      - netstats.streams == []
      - "'Mode: NORMAL' in netstats.stdout"
      - netstats.changed == False

- name: Get netstats in check mode
  community.cassandra.cassandra_netstats:
  check_mode: true
  register: netstats_check

- name: Assert check mode returns the same
  assert:
    that:
      - netstats_check.mode == 'NORMAL'
      - netstats_check.changed == False

- name: Get netstats from a port nothing listens on
  community.cassandra.cassandra_netstats:
    port: 7299
  register: netstats_fail
  ignore_errors: true

- name: Assert it failed
  assert:
    that:
      - netstats_fail.failed
      - "'Failed to connect' in netstats_fail.stderr | default('')"
