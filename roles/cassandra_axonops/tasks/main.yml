---
# The AxonOps agent: axon-agent and the Java agent package built for the
# node's Cassandra and Java, from a repository (AxonOps' or a mirror) or from
# package files; the groups; /etc/axonops/axon-agent.yml; axon-agent enabled
# and running. What changes is worked out first, from what is read on the
# node (_cassandra_axonops_items: the plan of apply_config); under check mode,
# or apply_config's compare (_cassandra_compare), nothing more is done.
# Cassandra is not restarted here: cassandra_config adds the line loading the
# Java agent to cassandra-env.sh, and the playbooks restart it for that.
- name: Gather the settings
  ansible.builtin.set_fact:
    _cassandra_axonops_settings:
      java_agent_package: "{{ cassandra_axonops_java_agent_package }}"
      java_agent_version: "{{ cassandra_axonops_java_agent_version | string }}"
      series: "{{ _series }}"
      java: "{{ _java }}"
      server_host: "{{ cassandra_axonops_server_host }}"
      server_port: "{{ cassandra_axonops_server_port }}"
      org: "{{ cassandra_axonops_org }}"
      key: "{{ cassandra_axonops_key }}"
      tls_mode: "{{ cassandra_axonops_tls_mode }}"
      tls_skip_verify: "{{ cassandra_axonops_tls_skip_verify | bool }}"
      tls_ca_file: "{{ cassandra_axonops_tls_ca_file }}"
      tls_cert_file: "{{ cassandra_axonops_tls_cert_file }}"
      tls_key_file: "{{ cassandra_axonops_tls_key_file }}"
      ntp_hosts: "{{ cassandra_axonops_ntp_hosts }}"
      extra_settings: "{{ cassandra_axonops_extra_settings }}"
      repository_manage: "{{ cassandra_axonops_repository_manage | bool }}"
      repository_username: "{{ cassandra_axonops_repository_username }}"
      repository_password: "{{ cassandra_axonops_repository_password }}"
      repository_key_url: "{{ cassandra_axonops_repository_key_url }}"
      os_family: "{{ ansible_facts['os_family'] }}"
    _cassandra_axonops_java_package: >-
      {{ cassandra_axonops_java_agent_package or _series | community.cassandra.cassandra_axonops_java_agent(_java) }}
    _cassandra_axonops_compare: "{{ ansible_check_mode or _cassandra_compare | default(false) | bool }}"
  vars:
    _series: "{{ cassandra_version | default('50x') }}"
    _java: "{{ cassandra_java_version | default(_by_series[_series] | default('17')) }}"
    _by_series: "{{ cassandra_java_versions | default({'40x': '11', '41x': '11', '50x': '17'}) }}"
  no_log: true  # the agent key

- name: Refuse settings the agent cannot work with
  ansible.builtin.fail:
    msg: "{{ ('cassandra_axonops  ' ~ inventory_hostname) | community.cassandra.cassandra_refused(_said) | join(_nl) }}"
  when: _problems | length > 0
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    _problems: "{{ _cassandra_axonops_settings | community.cassandra.cassandra_axonops_problems }}"
    _said: "{{ _problems + ['WAY OUT  set these variables (cassandra_axonops role), then run again.'] }}"

# (none given: {} and the repositories)
- name: Read the package files given
  ansible.builtin.set_fact:
    _cassandra_axonops_files: >-
      {{ _given | community.cassandra.cassandra_axonops_files(
           _cassandra_axonops_java_package, cassandra_axonops_agent_version | string,
           cassandra_axonops_java_agent_version | string, inventory_dir | default(''), true) if _given else {} }}
  vars:
    _given: "{{ cassandra_axonops_package_files }}"

- name: Refuse package files that do not fit
  ansible.builtin.fail:
    msg: "{{ ('cassandra_axonops  ' ~ inventory_hostname) | community.cassandra.cassandra_refused(_said) | join(_nl) }}"
  when: _cassandra_axonops_files.problems | default([]) | length > 0
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    _said: >-
      {{ _cassandra_axonops_files.problems
         + ['WAY OUT  list one file of axon-agent and one of ' ~ _cassandra_axonops_java_package ~ ' in'
            ~ ' cassandra_axonops_package_files (on the controller, their versions the pinned ones), then run again.'] }}

- name: Read the AxonOps packages, groups, config and service on the node
  ansible.builtin.shell: "{{ lookup('ansible.builtin.file', 'read.sh', rstrip=false) }}"
  environment:
    CASSANDRA_USER: "{{ cassandra_axonops_cassandra_user }}"
  register: cassandra_axonops_read
  changed_when: false
  check_mode: false  # reads only

# (before any change, in the plans too: a package left half done, axon-agent without its account, Cassandra's account
# missing; this one not under --check, which installs no Cassandra on a blank host)
- name: Refuse what the node holds
  ansible.builtin.fail:
    msg: "{{ ('cassandra_axonops  ' ~ inventory_hostname) | community.cassandra.cassandra_refused(_said) | join(_nl) }}"
  when: _said | length > 0
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    _said: >-
      {{ cassandra_axonops_read.stdout_lines | community.cassandra.cassandra_axonops_read_problems(
           cassandra_axonops_cassandra_user, ansible_check_mode) }}

- name: Work out what changes
  ansible.builtin.set_fact:
    _cassandra_axonops_config: "{{ _config }}"
    _cassandra_axonops_changes: >-
      {{ cassandra_axonops_read.stdout_lines | community.cassandra.cassandra_axonops_changes(
           _wanted, _config | hash('sha1'), cassandra_axonops_cassandra_user, cassandra_axonops_cassandra_group,
           _server) }}
  vars:
    _config: "{{ _cassandra_axonops_settings | community.cassandra.cassandra_axonops_config }}"
    _server: "{{ cassandra_axonops_server_host }}:{{ cassandra_axonops_server_port }}, org {{ cassandra_axonops_org }}"
    # (package files: their versions)
    _wanted: "{{ _cassandra_axonops_files.wanted | default(_versions, true) }}"
    _versions:
      - [axon-agent, "{{ cassandra_axonops_agent_version | string }}"]
      - ["{{ _cassandra_axonops_java_package }}", "{{ cassandra_axonops_java_agent_version | string }}"]
  no_log: true  # the agent key

# under check mode too: what it would change, in the plan
- name: The repository
  ansible.builtin.import_tasks: repository.yml
  when: cassandra_axonops_repository_manage | bool

# (apply_config shows them in its plan)
- name: List the changes
  ansible.builtin.set_fact:
    _cassandra_axonops_items: >-
      {{ (_cassandra_axonops_repository_items | default([]) if cassandra_axonops_repository_manage | bool else [])
         + _cassandra_axonops_changes['items'] }}
    _cassandra_axonops_removed: "{{ _cassandra_axonops_changes.removed }}"
    _cassandra_axonops_latest: "{{ _cassandra_axonops_changes.latest }}"
    _cassandra_axonops_reinstall: "{{ _cassandra_axonops_changes.reinstall }}"

# A package to install from the repositories the host has (its own, unchanged by this run: a source written by it is
# read by apt or dnf only once written): looked up first, --check too, so that a version the mirror lacks is refused
# before any change. Read-only (the package manager's cache as it is: on Debian, a mirror updated since its last
# refresh may show an older list). RedHat: the AxonOps repository read first (skip_if_unavailable would hide its
# error: "unreadable <its last error line>"). A package reinstalled is left out (dnf lists an installed version as
# not available)
- name: Look for the packages in the repositories
  ansible.builtin.shell: |
    if [ "$PROBE" = yes ] && ! command -v apt-cache >/dev/null 2>&1; then
      out=$(dnf -q makecache --repo axonops --setopt=axonops.skip_if_unavailable=False 2>&1) || {
        echo "unreadable $(printf '%s\n' "$out" | grep . | tail -1)"; exit 0; }
    fi
    for name in $NAMES; do
      if command -v apt-cache >/dev/null 2>&1; then
        apt-cache madison "$name" 2>/dev/null | awk -v n="$name" '{print "available", n, $3}'
      else
        dnf -q --showduplicates list available "$name" 2>/dev/null | awk -v n="$name" 'NF >= 2 && $1 ~ "^" n "[.]" {print "available", n, $2}'
      fi
    done
    exit 0
  environment:
    NAMES: "{{ _planned | join(' ') }}"
    PROBE: "{{ 'yes' if cassandra_axonops_repository_manage | bool else 'no' }}"
  register: cassandra_axonops_available
  changed_when: false
  check_mode: false  # reads only
  # (dnf's error may carry the URL with its login)
  no_log: "{{ cassandra_axonops_repository_username != '' or '@' in cassandra_axonops_repository_url }}"
  when:
    - _planned | length > 0
    - cassandra_axonops_package_files | length == 0
    - _cassandra_axonops_repository_items | default([]) | length == 0 or not cassandra_axonops_repository_manage | bool
  vars:
    _planned: >-
      {{ _cassandra_axonops_changes['items'] | rejectattr('after', 'in', ['removed', 'reinstalled']) | map(attribute='item')
         | select('match', 'package ') | map('regex_replace', '^package ', '') | list }}

- name: Refuse packages the repositories do not have
  ansible.builtin.fail:
    msg: "{{ ('cassandra_axonops  ' ~ inventory_hostname) | community.cassandra.cassandra_refused(_said) | join(_nl) }}"
  when: _missing | length > 0
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    _lines: "{{ cassandra_axonops_available.stdout_lines | default([]) if cassandra_axonops_available is not skipped else [] }}"
    _unreadable: "{{ _lines | select('match', 'unreadable') | map('regex_replace', '^unreadable ?', '') | list }}"
    _url: "{{ cassandra_axonops_repository_url | community.cassandra.cassandra_url_masked }}"
    _unread: >-
      {{ ['the AxonOps repository ' ~ _url ~ ' cannot be read: '
          ~ (_unreadable[0] or 'no error given') | community.cassandra.cassandra_url_masked] if _unreadable else [] }}
    # (the lookup skipped: package files, a repository this run writes: nothing refused)
    _missing: >-
      {{ [] if cassandra_axonops_available is skipped else _unread
         or _lines | community.cassandra.cassandra_axonops_unavailable(_wanted, _cassandra_axonops_changes['items']) }}
    _wanted:
      - [axon-agent, "{{ cassandra_axonops_agent_version | string }}"]
      - ["{{ _cassandra_axonops_java_package }}", "{{ cassandra_axonops_java_agent_version | string }}"]
    _said: >-
      {{ _missing + (['WAY OUT  check cassandra_axonops_repository_url, _username and _password, then run again.']
                     if _unreadable
                     else ['WAY OUT  put the package on the mirror (on Debian, apt-get update on the node if it is'
                           ~ ' there already), or change the pinned version, then run again.']) }}

- name: Install, configure and start the agent
  when: not _cassandra_axonops_compare | bool
  block:
    - name: The packages
      ansible.builtin.import_tasks: packages.yml

    # (Cassandra's account checked before any change; axonops comes with axon-agent: none is created here)
    - name: Look for the account axonops
      ansible.builtin.command:
        argv: [getent, passwd, axonops]
      register: cassandra_axonops_accounts
      changed_when: false
      failed_when: false

    - name: Stop without the account axonops
      ansible.builtin.fail:
        msg: "{{ _said | join(_nl) }}"
      when: cassandra_axonops_accounts.rc != 0
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _said:
          - "STOPPED  cassandra_axonops  {{ inventory_hostname }}"
          - "  axon-agent is installed, its account axonops is missing"
          - "WAY OUT  on the node: {{ 'apt-get install --reinstall axon-agent' if ansible_facts['os_family'] == 'Debian' else 'dnf reinstall axon-agent' }}, then run again"

    - name: The groups
      ansible.builtin.user:
        name: "{{ item.user }}"
        groups: "{{ item.group }}"
        append: true
      loop:
        - {user: "{{ cassandra_axonops_cassandra_user }}", group: axonops}
        - {user: axonops, group: "{{ cassandra_axonops_cassandra_group }}"}
      register: cassandra_axonops_groups

    # the key: no diff shown, nor the content in a failure (its cause said)
    - name: Write /etc/axonops/axon-agent.yml, or say why not
      block:
        - name: Write /etc/axonops/axon-agent.yml
          ansible.builtin.copy:
            content: "{{ _cassandra_axonops_config }}"
            dest: /etc/axonops/axon-agent.yml
            owner: root
            group: axonops
            mode: "0640"
          diff: false
          no_log: true
          register: cassandra_axonops_config_written
      rescue:
        - name: Stop on the failed write
          ansible.builtin.fail:
            msg: "{{ _said | join(_nl) }}"
          vars:
            cassandra_output: true  # a verdict: its msg as is (ops callback)
            _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
            # (the module's message, never its arguments: the key)
            _cause: "{{ (ansible_failed_result.msg | default('') | string).splitlines() | first | default('') }}"
            _said: >-
              {{ ['STOPPED  cassandra_axonops  ' ~ inventory_hostname, '  /etc/axonops/axon-agent.yml not written:']
                 + ['    ' ~ (_cause or 'no cause given')] | community.cassandra.cassandra_fit
                 + ['WAY OUT  fix the cause on the node, then run again'] }}

    - name: Start axon-agent, or restart it for its new package or config
      ansible.builtin.systemd_service:
        name: axon-agent
        enabled: true
        state: "{{ 'restarted' if cassandra_axonops_config_written is changed or _changed else 'started' }}"
        daemon_reload: "{{ _changed }}"
      vars:
        # (a group joined: the agent's process gets it at its start)
        _changed: "{{ _cassandra_axonops_packages_changed | bool or cassandra_axonops_groups is changed }}"

- name: Report changes
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_change_report
  vars:
    cassandra_change_report_role: cassandra_axonops
    cassandra_change_report_items: "{{ _cassandra_axonops_items }}"
