---
# The clocks of the play's nodes, read at once (clock_probe.yml, its
# _cassandra_clock_wait and _cassandra_clock_query passed through), then
# compared once: _cassandra_clock_verdicts on every node (filter
# cassandra_clock_verdicts). _cassandra_clock_running: whether Cassandra runs
# on a node (false when unset). A node whose clock could not be read is left
# out of the comparison (_cassandra_clock_read_ok false).
- name: Read the clock
  ansible.builtin.include_tasks: clock_probe.yml

- name: Compare the clocks
  ansible.builtin.set_fact:
    _cassandra_clock_verdicts: >-
      {{ _nodes | community.cassandra.cassandra_clock_verdicts(cassandra_clock_max_offset_ms, cassandra_clock_step_ms) }}
  run_once: true
  vars:
    _nodes: >-
      {%- set l = [] -%}
      {%- for h in ansible_play_hosts if hostvars[h]._cassandra_clock_read_ok | default(false) | bool -%}
      {%-   set v = hostvars[h] -%}
      {%-   set _ = l.append({'node': h, 'probe': v._cassandra_clock, 'samples': v._cassandra_clock_samples,
                              'running': v._cassandra_clock_running | default(false) | bool,
                              'manage': v.cassandra_linux_manage | default(true) | bool and v.cassandra_linux_timesync | default(true) | bool,
                              'unmanaged_by': 'cassandra_linux_manage' if not v.cassandra_linux_manage | default(true) | bool
                                              else 'cassandra_linux_timesync',
                              'offline': v.cassandra_offline | default(false) | bool,
                              'addresses': [h, v.ansible_host | default(h), (v._cassandra_preflight | default({})).ring_address | default('')]
                                           + v.ansible_facts.all_ipv4_addresses | default([])}) -%}
      {%- endfor -%}
      {{ l }}
