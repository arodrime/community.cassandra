---
- name: Assert required cassandra_config variables are set
  ansible.builtin.assert:
    that:
      - cassandra_conf_dir is defined and cassandra_conf_dir != ""
      - cassandra_data_file_directories | length > 0
      - cassandra_config_confirm | string | lower in ['auto', 'true', 'false', 'yes', 'no']
      - _cassandra_config_gcs | reject('in', ['G1', 'CMS', 'custom']) | list | length == 0
      - cassandra_data_dir is defined and cassandra_data_dir != ""
      - cassandra_version in ["40x", "41x", "50x"]
    fail_msg: >-
      cassandra_conf_dir, cassandra_data_dir and cassandra_data_file_directories must not be empty,
      cassandra_version must be one of 40x, 41x, 50x, cassandra_config_confirm auto, true or false, and
      cassandra_jvm_gc (cassandra_jvm<N>_gc) one of G1, CMS, custom

- name: Warn about a variable under its former name
  ansible.builtin.debug:
    msg: >-
      WARNING - deprecated name: cassandra_config_owner is now cassandra_config_user ({{ inventory_hostname }}): rename it
      (the former name still wins while it is set).
  when:
    - cassandra_config_owner is defined
    - not _cassandra_config_owner_said | default(false) | bool  # once a run (apply_config includes the role twice)
  vars:
    cassandra_output: true
    cassandra_output_gap: true  # a block of its own: one per node

- name: Note the former name said
  ansible.builtin.set_fact:
    _cassandra_config_owner_said: true
  when: cassandra_config_owner is defined

# Cassandra refuses to start without a period above zero in periodic mode
# (4.1+: a duration in ms or a larger unit)
- name: Assert the commit log sync settings
  ansible.builtin.assert:
    that:
      - cassandra_commitlog_sync in ['periodic', 'group', 'batch']
      - >-
        cassandra_commitlog_sync != 'periodic'
        or (cassandra_commitlog_sync_period_in_ms | int > 0 if cassandra_version == '40x'
            else (cassandra_commitlog_sync_period | string) is match(_cassandra_config_duration_ms))
    fail_msg: >-
      cassandra_commitlog_sync must be periodic, group or batch, and in periodic mode
      {{ 'cassandra_commitlog_sync_period_in_ms above zero (milliseconds)' if cassandra_version == '40x'
         else 'cassandra_commitlog_sync_period above zero, in ms or a larger unit (e.g. 10000ms)' }}

# Group mode has no default window, as in Cassandra, which refuses to start without one
- name: Assert the commit log group window is set
  ansible.builtin.assert:
    that: >-
      cassandra_commitlog_sync_group_window_in_ms | float > 0 if cassandra_version == '40x'
      else (cassandra_commitlog_sync_group_window | string) is match(_cassandra_config_duration_ms)
    fail_msg: >-
      cassandra_commitlog_sync is group: set
      {{ 'cassandra_commitlog_sync_group_window_in_ms (e.g. 15' if cassandra_version == '40x'
         else 'cassandra_commitlog_sync_group_window (e.g. 15ms' }}; the time a write may wait for the group fsync),
      above zero
  when: cassandra_commitlog_sync == 'group'

- name: Refuse extra settings the template already has
  ansible.builtin.assert:
    that: _taken | length == 0
    fail_msg: "cassandra_extra_settings: {{ _taken | join(', ') }} already in cassandra.yaml, set them with their variable"
  vars:
    _keys: >-
      {{ lookup('ansible.builtin.file', role_path ~ '/templates/' ~ _cassandra_config_series ~ '/cassandra.yaml.j2')
         | regex_findall('(?m)^(?:\{\{[^}]*\}\})?([a-z0-9_]+):') }}
    # a section of _cassandra_config_extra_sections: a dict of other sub-keys than its variables'
    _taken: >-
      {%- set out = cassandra_extra_settings | list | intersect(_keys)
                    | difference(_cassandra_config_extra_sections | list) -%}
      {%- for section, own in _cassandra_config_extra_sections.items() if section in cassandra_extra_settings -%}
      {%- set value = cassandra_extra_settings[section] -%}
      {%- set _ = out.extend([section] if value is not mapping
                             else value | list | intersect(own) | map('regex_replace', '^', section ~ '.')) -%}
      {%- endfor -%}
      {{ out }}
  when: cassandra_extra_settings | length > 0

# GossipingPropertyFileSnitch takes the node's dc and rack from the file: other lines would
# move it (e.g. kept by import_cluster under SimpleSnitch, then the snitch changed)
- name: Refuse rackdc lines other than the node's dc and rack under a snitch that reads them
  ansible.builtin.assert:
    that: >-
      [cassandra_rackdc_dc | string, cassandra_rackdc_rack | string] == [cassandra_dc | string, cassandra_rack | string]
      or cassandra_endpoint_snitch | regex_replace('^org[.]apache[.]cassandra[.]locator[.]', '')
         in _cassandra_config_snitches_without_rackdc
    fail_msg: >-
      {{ cassandra_endpoint_snitch }} reads the node's dc and rack from cassandra-rackdc.properties: cassandra_rackdc_dc
      ({{ cassandra_rackdc_dc }}) and cassandra_rackdc_rack ({{ cassandra_rackdc_rack }}) must be cassandra_dc
      ({{ cassandra_dc }}) and cassandra_rack ({{ cassandra_rack }}). Remove them from the inventory.
    quiet: true

# Unless G1 is in use, cassandra-env.sh exits when only one of MAX_HEAP_SIZE
# and HEAP_NEWSIZE is set; 5.0's leaves HEAP_NEWSIZE commented out
- name: Assert heap settings are consistent
  ansible.builtin.assert:
    that: >-
      _cassandra_config_gcs | reject('equalto', 'G1') | list | length == 0
      or (cassandra_heap_size == '' and cassandra_heap_newsize == '')
      or (cassandra_heap_size != '' and cassandra_heap_newsize != '' and cassandra_version != '50x')
    fail_msg: >-
      Without G1 (cassandra_jvm_gc, cassandra_jvm<N>_gc), set cassandra_heap_size and cassandra_heap_newsize
      together on 4.x, and neither on 5.0 (its cassandra-env.sh has no HEAP_NEWSIZE)

- name: Check that the Cassandra package's config is there
  ansible.builtin.stat:
    path: "{{ _cassandra_config_pkg_conf_dir }}"
  register: cassandra_config_pkg_conf

- name: Stop if Cassandra is not installed
  ansible.builtin.fail:
    msg: "{{ _cassandra_config_pkg_conf_dir }} not found: install Cassandra first (cassandra_install)"
  when:
    - not cassandra_config_pkg_conf.stat.exists
    - not ansible_check_mode

- name: Nothing to compare yet (--check before the package is installed)
  ansible.builtin.set_fact:
    _cassandra_config_items:
      - item: config files
        before: Cassandra not installed yet
        after: "{{ _cassandra_config_files[_cassandra_config_series] | length }} files templated"
  when: not cassandra_config_pkg_conf.stat.exists

- name: Configure
  when: cassandra_config_pkg_conf.stat.exists
  block:
    # What the role looks at on the node, read in one go (a task per file or
    # directory would cost a round trip each): files/config_read.py, whose
    # results are shaped as the stat, slurp and command tasks would register
    # them. The package creates the stock directories only: others (a data
    # disk, a log dir) must exist, owned by the service user, before the node
    # first starts (created below, their missing parents root-owned, 0755).
    # The live cassandra.yaml: read for the paths it holds (an initialized
    # node). The owner and mode of the live files (the JMX users' files when
    # the role writes them) and of Cassandra's directories (the top level
    # only: a data dir can hold TBs, a link to a disk followed).
    - name: Read the node's config files and directories
      ansible.builtin.command:
        argv: ["{{ _cassandra_config_python }}", -c, "{{ lookup('ansible.builtin.file', 'config_read.py') }}"]
        stdin: "{{ _request | to_json }}"
      environment:
        LC_ALL: C  # errors in English
      register: cassandra_config_read
      changed_when: false
      check_mode: false  # reads only
      no_log: true  # the live cassandra.yaml may hold passwords
      vars:
        _request:
          step: node
          dirs: >-
            {{ (cassandra_data_file_directories + [cassandra_commitlog_dir, cassandra_saved_caches_dir,
                cassandra_hints_dir, cassandra_log_dir]) | select | unique | list }}
          yaml: "{{ cassandra_conf_dir }}/cassandra.yaml"
          conf_target: "{{ '/etc/cassandra/conf' if ansible_facts['os_family'] == 'RedHat' and cassandra_rpm_conf_alternative != '' else '' }}"
          keep: >-
            {%- set out = [] -%}
            {%- for f in cassandra_config_keep_files | intersect(_cassandra_config_files[_cassandra_config_series]) -%}
            {%-   set _ = out.append([f, cassandra_conf_dir ~ '/' ~ f]) -%}
            {%- endfor -%}
            {{ out }}
          files: >-
            {%- set out = [] -%}
            {%- for f in _cassandra_config_files[_cassandra_config_series]
                         + (['jmxremote.password', 'jmxremote.access'] if cassandra_jmx_users | length > 0 else []) -%}
            {%-   set _ = out.append([f, cassandra_jmx_remote_password_file if f == 'jmxremote.password'
                                         else cassandra_jmx_remote_access_file if f == 'jmxremote.access'
                                         else cassandra_conf_dir ~ '/' ~ f]) -%}
            {%- endfor -%}
            {{ out }}
          dir_stats: >-
            {%- set out = [] -%}
            {%- for kind, paths in [['data dir', cassandra_data_file_directories], ['commitlog dir', [cassandra_commitlog_dir]],
                                    ['saved_caches dir', [cassandra_saved_caches_dir]], ['hints dir', [cassandra_hints_dir]]] -%}
            {%-   for d in paths if d and d not in out | map(attribute=1) -%}{%- set _ = out.append([kind, d]) -%}{%- endfor -%}
            {%- endfor -%}
            {{ out }}

    - name: Stop on a path that could not be looked at
      ansible.builtin.fail:
        msg: "{{ _read.errors | default([_read.error]) | join('; ') }}"
      vars:
        _read: "{{ cassandra_config_read.stdout | from_json }}"
      when: _read.error is defined or _read.errors | length > 0

    # as the tasks that read them one by one registered them
    - name: Note what was read
      ansible.builtin.set_fact:
        cassandra_config_dirs: {results: "{{ _read.dirs }}"}
        cassandra_config_unmounted: {stdout_lines: "{{ _read.unmounted }}"}
        cassandra_config_live_yaml_stat: {stat: "{{ _read.yaml_stat }}"}
        cassandra_config_live: "{{ {'content': _read.yaml} if _read.yaml is not none else {'failed': true} }}"
        cassandra_config_conf_target: "{{ _read.conf_target if _read.conf_target is not none else {'skipped': true} }}"
        cassandra_config_keep_stat: {results: "{{ _read.keep }}"}
        cassandra_config_live_stat: {results: "{{ _read.files }}"}
        cassandra_config_dir_stat: {results: "{{ _read.dir_stats }}"}
        _cassandra_config_package: "{{ _read.package }}"
        # the unit's state (running, else stopped or ''); unread: not systemd, service_facts reads it
        _cassandra_config_unit_state: "{{ 'unread' if _read.running is none else _read.running }}"
        _cassandra_config_links: "{{ _read.links }}"
      vars:
        _read: "{{ cassandra_config_read.stdout | from_json }}"
      no_log: true  # the live cassandra.yaml

    # Templates come from the stock files of one release per series: a later
    # release may accept settings they don't have (cassandra_extra_settings).
    # Not under --check, nor in the upgrade playbook's preflight (check_mode applied to the role, which
    # ansible_check_mode does not tell): it shows the target series' config while the former one is installed
    - name: Refuse the templates of another series than the one installed
      ansible.builtin.assert:
        that: _installed == '' or (_installed ~ '.').startswith(_cassandra_config_series ~ '.')
        fail_msg: >-
          Cassandra {{ _installed }} is installed, not {{ _cassandra_config_series }} (cassandra_version {{ cassandra_version }}):
          set cassandra_version to the installed series.
        quiet: true
      vars:
        _installed: "{{ _cassandra_config_installed }}"
      when:
        - not ansible_check_mode
        - not _cassandra_config_target_preview | default(false) | bool

    # Cassandra refuses to start on a cassandra.yaml key it does not know ("Invalid yaml"): checked against the
    # installed release, else (another series installed, or none) what no release of the series accepts
    - name: Refuse extra settings Cassandra rejects
      ansible.builtin.assert:
        that: _rejected | length == 0
        fail_msg: >-
          {{ inventory_hostname }}: cassandra_extra_settings has {{ _rejected | join(', ') }}, which Cassandra
          {{ _version }} rejects: it would not restart. Remove {{ 'it' if _rejected | length == 1 else 'them' }}
          from the inventory; nothing is changed.
        quiet: true
      vars:
        _version: >-
          {{ _cassandra_config_installed if (_cassandra_config_installed ~ '.').startswith(_cassandra_config_series ~ '.')
             else _cassandra_config_series }}
        _rejected: "{{ cassandra_extra_settings | community.cassandra.cassandra_yaml_rejected(_version) }}"
      when: cassandra_extra_settings | length > 0

    - name: Say when Cassandra is newer than the templates
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: Cassandra {{ _cassandra_config_installed }} is newer than {{ _templates }}, the release the
          {{ _cassandra_config_series }} templates come from: settings it added are not variables, set them with
          cassandra_extra_settings.
      vars:
        cassandra_output: true
        _templates: "{{ _cassandra_config_template_versions[_cassandra_config_series] }}"
      when:
        - _cassandra_config_installed != ''
        - _cassandra_config_installed is version(_templates, '>')

    # A disk in /etc/fstab that did not mount (e.g. nofail, after a reboot)
    # leaves an empty mount point: the dirs made there would land on the root
    # filesystem, and the node would start on empty dirs. Checked for every
    # directory, before anything else: without its data, a joined node would
    # also look new. (Read with the node: findmnt --fstab, mountpoint.)
    - name: Refuse directories on a disk that is not mounted
      ansible.builtin.assert:
        that: _on_unmounted | length == 0
        fail_msg: >-
          {{ _on_unmounted | join(', ') }}: on a mount point of /etc/fstab that is not mounted (what is there
          is on the filesystem below). Mount it first; nothing is changed.
        quiet: true
      vars:
        _on_unmounted: >-
          {%- set out = [] -%}
          {%- for d in cassandra_config_dirs.results | map(attribute='item') -%}
          {%-   for t in cassandra_config_unmounted.stdout_lines | default([]) -%}
          {%-     if d == t or d.startswith(t ~ '/') -%}{%- set _ = out.append(d ~ ' (' ~ t ~ ')') -%}{%- endif -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ out }}

    # A node that holds a system keyspace has been initialized: in one of the
    # data directories of the inventory, its local_system_data_file_directory
    # (cassandra_extra_settings), the package's or a tarball's default one, or
    # any absolute path written in the live cassandra.yaml outside comment
    # lines (an inventory that does not match the node yet). Paths are picked
    # from the text, no YAML parsing: no PyYAML needed on the node. A live
    # cassandra.yaml that cannot be read counts as initialized, a running
    # Cassandra too.
    - name: List the absolute paths of the live cassandra.yaml
      ansible.builtin.set_fact:
        # one expression, so the node's text is never in a var that could be templated; a path with a "{"
        # is never kept in the fact either: a "{" item stands for it, and the node counts as initialized.
        # Paths too long to exist are left out.
        _cassandra_config_live_paths: >-
          {%- set text = (cassandra_config_live.content | b64decode if cassandra_config_live.content is defined else '')
                         | regex_replace(_comment_line, '') -%}
          {%- set paths = (text | regex_findall(_plain) + text | regex_findall(_single_quoted)
                           + text | regex_findall(_double_quoted) + text | regex_findall(_line_value) | map('trim') | list)
                          | map('regex_replace', _trailing_slash, '') | reject('search', '[^/]{256}') | select('match', '.{1,4095}$')
                          | unique | list -%}
          {{ paths | reject('search', '{') | list + (['{'] if paths | select('search', '{') | list else []) }}
      vars:
        _comment_line: '(?m)^[ \t]*#.*$'
        _plain: '(?<![^\s\[,''"])/[^\s''",\]}]*'
        _single_quoted: '''(/[^''\n]*)'''
        _double_quoted: '"(/[^"\n]*)"'
        # the rest of a "- /path" or "key: /path" line (trimmed): a path with spaces
        _line_value: '(?m)^[ \t]*(?:-|[\w"'']+[ \t]*:)[ \t]+(/[^#\n]*)'
        _trailing_slash: '(?<=.)/+$'
      no_log: true  # it may hold secrets

    # In one go too (config_read.py, its "dirs" step): <dir>/system in each
    # candidate; the directories whose mode bits do not let the account
    # Cassandra runs as in, tried as that account (its other groups and ACLs);
    # in the data dirs, a sample of the keyspace and table dirs another account
    # owns (their content is not changed: a recursive chown of TBs is the
    # operator's call), said in apply_config's recap
    - name: Look for a system keyspace, and into Cassandra's directories
      ansible.builtin.command:
        argv: ["{{ _cassandra_config_python }}", -c, "{{ lookup('ansible.builtin.file', 'config_read.py') }}"]
        stdin: "{{ {'step': 'dirs', 'system': _system, 'tries': _tries | map(attribute='path') | list, 'foreign': _foreign,
                    'user': _cassandra_config_perm_settings.user | string} | to_json }}"
      environment:
        LC_ALL: C  # errors in English, as checked below
      register: cassandra_config_read_dirs
      changed_when: false
      check_mode: false  # reads only
      no_log: true  # the paths may hold secrets
      vars:
        _system: >-
          {{ (cassandra_data_file_directories
              + [cassandra_extra_settings.local_system_data_file_directory | default('', true) | string,
                 _cassandra_config_default_data_dir, (cassandra_conf_dir | regex_replace('(?<=.)/+$', '') | dirname) ~ '/data/data']
              + _cassandra_config_live_paths | default([]) | select('match', '/') | list)
             | select | map('regex_replace', '(?<=.)/+$', '') | unique }}
        _tries: >-
          {{ cassandra_config_dir_stat.results
             | community.cassandra.cassandra_dir_permission_changes(_cassandra_config_perm_settings.user,
                                                                    _cassandra_config_perm_settings.user_group) }}
        _foreign: >-
          {{ cassandra_config_dir_stat.results | selectattr('item.0', 'equalto', 'data dir') | selectattr('stat.isdir', 'defined')
             | selectattr('stat.isdir') | map(attribute='item.1') | list }}

    - name: Stop when the directories could not be looked into
      ansible.builtin.fail:
        msg: "{{ (cassandra_config_read_dirs.stdout | from_json).error }}"
      when: (cassandra_config_read_dirs.stdout | from_json).error is defined

    # as the tasks that read them one by one registered them (a stat that failed: its msg, no stat)
    - name: Note what was found in the directories
      ansible.builtin.set_fact:
        cassandra_config_system: {results: "{{ _read.system }}"}
        cassandra_config_dir_try:
          results: >-
            {%- set out = [] -%}
            {%- for item in _tries -%}{%- set _ = out.append({'item': item, 'rc': _read.tries[loop.index0]}) -%}{%- endfor -%}
            {{ out }}
        cassandra_config_dir_foreign:
          results: >-
            {%- set out = [] -%}
            {%- for r in _stats -%}{%- set _ = out.append({'item': r, 'stdout_lines': _read.foreign[loop.index0]}) -%}{%- endfor -%}
            {{ out }}
      vars:
        _read: "{{ cassandra_config_read_dirs.stdout | from_json }}"
        _tries: >-
          {{ cassandra_config_dir_stat.results
             | community.cassandra.cassandra_dir_permission_changes(_cassandra_config_perm_settings.user,
                                                                    _cassandra_config_perm_settings.user_group) }}
        _stats: >-
          {{ cassandra_config_dir_stat.results | selectattr('item.0', 'equalto', 'data dir') | selectattr('stat.isdir', 'defined')
             | selectattr('stat.isdir') | list }}
      no_log: true  # the paths may hold secrets

    # (read with the node when systemd runs it: the cassandra unit only)
    - name: Look for a running Cassandra
      ansible.builtin.service_facts:
      when: _cassandra_config_unit_state == 'unread'

    # Blank or not, as every operation says it (cassandra_node_standing, from what was read here: no
    # ring): nothing in its data directories, Cassandra stopped. When not blank: why and, for a node
    # started once by mistake (another config) that never joined the real cluster, the dirs to empty
    # to start it over.
    # _cassandra_config_new_node (add_node, replace_node, topology; create_cluster after its
    # reset): the operation checked the node is new (in no ring, Cassandra down, its data
    # directories empty or emptied first) and asked its own question: only a system keyspace
    # in the data directories its config uses, or a running Cassandra, still count. One left
    # elsewhere (the package's default dir, a former cassandra.yaml's) is no longer this
    # node's: left as it is, said below; a missing or hand-edited cassandra.yaml is rewritten.
    - name: Tell whether this node is blank
      ansible.builtin.set_fact:
        _cassandra_config_initialized: "{{ not _standing.blank }}"
        _cassandra_config_initialized_why: "{{ _standing.evidence | join(', ') }}"
        _cassandra_config_left: "{{ _found | reject('in', _counted) | list }}"
        _cassandra_config_own_dirs: "{{ _own }}"  # (said with _cassandra_config_left)
        _cassandra_config_reset: >-
          {{ '' if not _counted else "ONLY if this node never joined the real cluster (e.g. started once with the stock config),
          it can start over, which DELETES its data: stop Cassandra, check these are this node's dirs (not another
          instance's) and empty them: " ~ (_counted + cassandra_data_file_directories
          + [cassandra_commitlog_dir, cassandra_saved_caches_dir, cassandra_hints_dir]) | select
          | map('regex_replace', '(?<=.)/+$', '') | unique | join(', ')
          ~ ", then run again." }}
      vars:
        _new: "{{ _cassandra_config_new_node | default(false) | bool }}"
        # the data directories its config uses
        _own: >-
          {{ ([cassandra_data_file_directories] | flatten
              + [cassandra_extra_settings.local_system_data_file_directory | default('', true) | string])
             | select | map('regex_replace', '(?<=.)/+$', '') | unique | list }}
        _found: >-
          {{ cassandra_config_system.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir')
             | map(attribute='item') | list }}
        _counted: "{{ _found | select('in', _own) | list if _new | bool else _found }}"
        _running: >-
          {{ _cassandra_config_unit_state == 'running' if _cassandra_config_unit_state | default('unread') != 'unread'
             else (ansible_facts.services['cassandra.service'] | default(ansible_facts.services['cassandra'] | default({}))).state
                  | default('') == 'running' }}
        # a stat that failed for another reason than "a file, not a dir" or "cannot exist": not checked
        _unchecked: >-
          {{ cassandra_config_system.results | rejectattr('stat', 'defined')
             | selectattr('item', 'in', _own if _new | bool else cassandra_config_system.results | map(attribute='item') | list)
             | map(attribute='msg', default='') | reject('search', 'Not a directory|too long') | list | length > 0 }}
        _standing: >-
          {{ inventory_hostname | community.cassandra.cassandra_node_standing(cassandra_cluster_name, answers=none,
               running=_running, held=_counted | map('regex_replace', '$', '/system') | list,
               system=_counted | map('regex_replace', '$', '/system') | list,
               elsewhere=_found | reject('in', _counted) | map('regex_replace', '$', '/system') | list,
               live='absent' if _new | bool or not cassandra_config_live_yaml_stat.stat.exists
                    else 'unreadable' if cassandra_config_live.content is not defined else 'read',
               unreadable=(['a data dir that could not be checked'] if _unchecked | bool else [])
                          + (['a path with "{" in the live cassandra.yaml'] if '{' in _cassandra_config_live_paths and not _new | bool
                             else [])) }}

    # in a prepare of new nodes (_cassandra_prepare_lines), said once for all of them after
    # its step lines instead (cassandra_service prepare_lines.yml)
    - name: Say what a new node leaves as it is
      ansible.builtin.debug:
        msg: "{{ [{'name': inventory_hostname, 'left': _cassandra_config_left, 'dirs': _cassandra_config_own_dirs}]
                 | community.cassandra.cassandra_left_system_warning }}"
      when:
        - _cassandra_config_left | length > 0
        - not _cassandra_prepare_lines | default(false) | bool
      vars:
        cassandra_output: true

    # Cassandra reads initial_token at a node's first start only: a joined node
    # with none in the inventory keeps the one its cassandra.yaml has
    - name: Keep the token a joined node was started with
      ansible.builtin.set_fact:
        cassandra_initial_token: "{{ _live }}"
      vars:
        _line: >-
          {{ cassandra_config_live.content | b64decode
             | regex_findall('(?m)^initial_token:[ \t]*(.*?)[ \t]*$') | last | default('') }}
        _live: >-
          {{ _line | regex_replace('\s+#.*$', '') | replace('"', '') | replace("'", '') | trim }}
      when:
        - cassandra_initial_token | string in ['', 'None']
        - _cassandra_config_initialized | bool
        - cassandra_config_live.content is defined
        - _live != ''

    # The config files rendered here, on the controller, and compared on the node
    # in one go (config_read.py, its "compare" step), diffed with the Python
    # Ansible runs with (no diff binary needed; Ansible's own diff skips files
    # over 100KB, like the 5.0 cassandra.yaml); the new cassandra.yaml checked
    # when PyYAML is on the node: a cassandra.yaml Cassandra cannot read stops
    # the run before any file is written
    - name: Render the config files
      ansible.builtin.set_fact:
        _cassandra_config_new: >-
          {{ dict(_cassandra_config_files[_cassandra_config_series]
                  | zip(query('ansible.builtin.template', *_cassandra_config_files[_cassandra_config_series]
                                                           | map('regex_replace', '^(.*)$', _cassandra_config_series ~ '/\1.j2')))) }}
      no_log: true  # passwords

    # On a node that is not blank, a file with the same settings is left as it is: the live ones that
    # differ read, their settings compared on the controller, as the import self-check does. Top-level keys
    # and rackdc properties a joined node must keep: plain text, no YAML parser needed on the node. A file
    # left as the node has it (cassandra_config_keep_files) changes none of them.
    - name: Diff them against the live files
      ansible.builtin.command:
        argv: ["{{ _cassandra_config_python }}", -c, "{{ lookup('ansible.builtin.file', 'config_read.py') }}"]
        stdin: >-
          {{ {'step': 'compare', 'conf_dir': cassandra_conf_dir,
              'names': _cassandra_config_files[_cassandra_config_series], 'files': _cassandra_config_new,
              'compare': _cassandra_config_initialized | bool and not cassandra_config_normalize | bool,
              'identity': {'live_yaml': cassandra_conf_dir ~ '/cassandra.yaml',
                           'new_yaml': {'path': cassandra_conf_dir ~ '/cassandra.yaml'}
                                       if 'cassandra.yaml' in cassandra_config_keep_files
                                       else {'text': _cassandra_config_new['cassandra.yaml']},
                           'live_rackdc': cassandra_conf_dir ~ '/cassandra-rackdc.properties',
                           'new_rackdc': {'path': cassandra_conf_dir ~ '/cassandra-rackdc.properties'}
                                         if 'cassandra-rackdc.properties' in cassandra_config_keep_files
                                         else {'text': _cassandra_config_new['cassandra-rackdc.properties']},
                           'snitches': _cassandra_config_snitches_without_rackdc}
                          if _cassandra_config_initialized | bool else none} | to_json }}
      register: cassandra_config_compare
      changed_when: false
      check_mode: false  # reads only
      no_log: true  # the new files and the live ones that differ hold passwords; the diffs are shown masked below

    - name: Check the new cassandra.yaml is valid YAML
      ansible.builtin.fail:
        msg: "{{ _compare.error | default(_compare.yaml_error) }}"
      vars:
        _compare: "{{ cassandra_config_compare.stdout | from_json }}"
      when: _compare.error is defined or _compare.yaml_error is not none

    # (none on a node not initialized: compared in one expression, a var of a null value reads as '' before 2.19)
    - name: Stop when the settings a joined node must keep could not be compared
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }}: the settings a joined node must keep could not be compared:
          {{ (cassandra_config_compare.stdout | from_json).identity.error }}
      when: ((cassandra_config_compare.stdout | from_json).identity or {}).rc | default(0) != 0

    # as the tasks that read them one by one registered them
    - name: Note the comparison
      ansible.builtin.set_fact:
        cassandra_config_preview:
          results: >-
            {%- set out = [] -%}
            {%- for r in _compare.preview -%}
            {%-   set _ = out.append(r | combine({'stdout_lines': r.stdout.splitlines()})) -%}
            {%- endfor -%}
            {{ out }}
        # the live files that differ, read on a node that is not blank: {name: base64 content, none when unreadable}
        _cassandra_config_compared: "{{ _compare.live }}"
        cassandra_config_identity: "{{ {'stdout': _compare.identity.changes | to_json} if _compare.identity is not none else {'skipped': true} }}"
      vars:
        _compare: "{{ cassandra_config_compare.stdout | from_json }}"
      no_log: true  # the live files

    # the directories cassandra.yaml leaves out are under its -Dcassandra.storagedir
    - name: Read where the running Cassandra keeps the directories cassandra.yaml leaves out
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: jvm_started.yml
      when:
        - cassandra_config_storage_dir == ''
        - "'cassandra.yaml' in _cassandra_config_compared"

    - name: Refuse to change the identity of a joined node
      ansible.builtin.assert:
        that: _changes | length == 0 or cassandra_config_force_identity_change | bool
        fail_msg: >-
          {{ inventory_hostname }} is not blank ({{ _cassandra_config_initialized_why }}) and these settings
          would change: {{ _changes | join('; ') }}.{{ _not_loaded }} A node keeps them for life: a new cluster_name, partitioner or
          num_tokens stops it from starting, a new dc or rack too (unless forced), a new snitch or forced dc/rack moves
          data ownership without streaming, and storage_compatibility_mode (5.0) only moves one step at a time,
          CASSANDRA_4 (also when absent, write it first), UPGRADING, NONE, never back. Fix the inventory to match the
          node, or follow the documented procedure and set cassandra_config_force_identity_change: true.
          {{ _cassandra_config_reset }}
        quiet: true
      vars:
        _changes: "{{ cassandra_config_identity.stdout | default('[]') | from_json }}"
        # the likely cause first
        _not_loaded: >-
          {{ " cassandra_cluster_name is the role default 'Test Cluster': are the inventory's group_vars loaded? Check with
          ansible-inventory -i <inventory> --host " ~ inventory_hostname ~ " (group_vars are read next to the inventory
          file or directory given, not in its subdirectories)."
          if cassandra_cluster_name == 'Test Cluster' and _changes | select('match', 'cluster_name: ') | list | length > 0 else '' }}
      when: _cassandra_config_initialized | bool

    # On a node that is not blank, a file with the same settings (only comments,
    # blank lines or their layout differ, e.g. no header: set up by hand) is left as it is
    - name: List the files to change and whether to ask first
      ansible.builtin.set_fact:
        _cassandra_config_kept: "{{ _kept }}"
        # kept as the node has them, but not there: written from the template, the hand edits lost
        _cassandra_config_keep_missing: >-
          {{ cassandra_config_keep_stat.results | selectattr('stat.exists', 'defined') | rejectattr('stat.exists')
             | map(attribute='item') | list if _cassandra_config_initialized | bool else [] }}
        _cassandra_config_changes: >-
          {{ cassandra_config_preview.results | selectattr('stdout') | map(attribute='cassandra_config_file')
             | reject('in', _kept) | list }}
        # _cassandra_config_no_question: the caller's own question covered it (an -e cassandra_config_confirm
        # beats the caller's cassandra_config_confirm: false, not this)
        _cassandra_config_ask: >-
          {{ cassandra_config_preview.results | selectattr('stdout') | rejectattr('cassandra_config_file', 'in', _kept)
             | list | length > 0
             and not _cassandra_config_no_question | default(false) | bool
             and (_cassandra_config_initialized | bool if cassandra_config_confirm | string | lower == 'auto'
                  else cassandra_config_confirm | bool) }}
      vars:
        _kept: >-
          {%- set out = [] -%}
          {%- for f in cassandra_config_preview.results | map(attribute='cassandra_config_file') if f in _cassandra_config_compared -%}
          {%-   set live = _cassandra_config_compared[f] -%}
          {%-   if live is not none and live | b64decode | community.cassandra.cassandra_same_settings(
                     _cassandra_config_new[f], f, cassandra_config_storage_dir or cassandra_jvm.storagedir | default('')) -%}
          {%-     set _ = out.append(f) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out + _keep }}
        # (where the node has them, on a node that is not blank: a new one's are the package's)
        _keep: >-
          {{ cassandra_config_keep_stat.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists')
             | map(attribute='item') | list if _cassandra_config_initialized | bool else [] }}

    - name: Warn that a file kept by hand is missing
      ansible.builtin.debug:
        msg: >-
          WARNING - {{ inventory_hostname }}: {{ _cassandra_config_keep_missing | join(', ') }} kept by hand
          (cassandra_config_keep_files) {{ 'is' if _cassandra_config_keep_missing | length == 1 else 'are' }} missing:
          written back from the template, the hand edits are lost. Restore your copy first to keep them.
      when:
        - _cassandra_config_keep_missing | length > 0
        - not _cassandra_config_quiet | default(false)  # said by the caller (apply_config: in its plan and recap)

    - name: Show the config changes
      ansible.builtin.debug:
        msg: >-
          {{ cassandra_config_preview.results | selectattr('stdout') | rejectattr('cassandra_config_file', 'in', _cassandra_config_kept)
             | map(attribute='stdout_lines') | flatten }}
      when:
        - _cassandra_config_changes | length > 0
        - not _cassandra_config_quiet | default(false)  # shown by the caller (apply_config: before its run)
        - not (_cassandra_config_ask | bool and not ansible_check_mode)  # asked below: shown with its question

    # the diffs the question below is about: printed by the ops callback too, each node's under its name
    - name: Show the config changes to confirm
      ansible.builtin.debug:
        msg: >-
          {{ [inventory_hostname ~ ':'] + cassandra_config_preview.results | selectattr('stdout')
             | rejectattr('cassandra_config_file', 'in', _cassandra_config_kept) | map(attribute='stdout_lines') | flatten }}
      when:
        - _cassandra_config_changes | length > 0
        - not _cassandra_config_quiet | default(false)
        - _cassandra_config_ask | bool and not ansible_check_mode
      vars:
        cassandra_output: true

    - name: Say which files are left as they are
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ _same | join(', ') }} left as they are: same settings as the
          role's, written another way (cassandra_config_normalize: true rewrites them).
      vars:
        _same: "{{ _cassandra_config_kept | reject('in', cassandra_config_keep_files) | list }}"
      when: _same | length > 0

    - name: Say which files are kept as they are (cassandra_config_keep_files)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ _kept | join(', ') }} left as they are (cassandra_config_keep_files)"
      vars:
        _kept: "{{ _cassandra_config_kept | select('in', cassandra_config_keep_files) | list }}"
      when: _kept | length > 0

    # Cassandra cannot start on a file its account cannot read: changed even when the content is not
    - name: List the owner, group and mode changes
      ansible.builtin.set_fact:
        _cassandra_config_perm_changes: >-
          {{ cassandra_config_live_stat.results | community.cassandra.cassandra_permission_changes(_cassandra_config_perm_settings) }}
        # the files the template task writes: all of them (but the ones kept), as before the role compared
        # them, unless the live one is a regular file with the same content, owner, group and mode (a file
        # missing or not read, a link, or /etc/cassandra/conf about to point elsewhere: written)
        _cassandra_config_write: >-
          {%- set alternative = cassandra_rpm_conf_alternative | regex_replace('(?<=.)/+$', '') -%}
          {%- set target = cassandra_config_conf_target.stat.lnk_source | default('') if cassandra_config_conf_target is not skipped
                           else alternative -%}
          {%- set out = [] -%}
          {%- for r in cassandra_config_preview.results -%}
          {%-   set f = r.cassandra_config_file -%}
          {%-   set live = cassandra_config_live_stat.results | selectattr('cassandra_config_file', 'equalto', f) | first -%}
          {%-   if r.rc != 0 or f in _cassandra_config_links or target != alternative or not live.stat.exists | default(false)
                   or [live] | community.cassandra.cassandra_permission_changes(_cassandra_config_perm_settings) -%}
          {%-     set _ = out.append(f) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

    - name: List the owner, group and mode changes of the directories
      ansible.builtin.set_fact:
        _cassandra_config_dir_changes: >-
          {%- set out = [] -%}
          {%- for r in cassandra_config_dir_try.results | default([]) if r.rc | default(1) != 0 -%}{%- set _ = out.append(r.item) -%}{%- endfor -%}
          {{ out }}

    - name: Note the dirs another account owns
      ansible.builtin.set_fact:
        _cassandra_config_dir_notes: >-
          {%- set out = [] -%}
          {%- for r in cassandra_config_dir_foreign.results | default([]) if r.stdout_lines | default([]) -%}
          {%-   set _ = out.append('WARNING - data dir ' ~ r.item.item.1 ~ ': not owned by ' ~ _cassandra_config_perm_settings.user ~ ': '
                                   ~ r.stdout_lines[:3] | join(', ') ~ (', ...' if r.stdout_lines | length > 3 else '')
                                   ~ ' (left as they are: chown -R them if Cassandra cannot read them)') -%}
          {%- endfor -%}
          {{ out }}

    - name: Show the owner, group and mode changes
      ansible.builtin.debug:
        msg: >-
          {%- set out = [] -%}
          {%- for c in _cassandra_config_perm_changes + _cassandra_config_dir_changes -%}
          {%-   set _ = out.append(c.item ~ ': ' ~ c.before ~ ' -> ' ~ c.after) -%}
          {%- endfor -%}
          {{ out + _cassandra_config_dir_notes }}
      when:
        - (_cassandra_config_perm_changes + _cassandra_config_dir_changes + _cassandra_config_dir_notes) | length > 0
        - not _cassandra_config_quiet | default(false)

    # The diffs are masked above: no password reaches the report
    - name: Record the changes for the report
      ansible.builtin.set_fact:
        _cassandra_config_items: >-
          {{ ([{'item': '/etc/cassandra/conf', 'before': _conf_target, 'after': cassandra_rpm_conf_alternative}]
              if _conf_target | default(cassandra_rpm_conf_alternative, true) != cassandra_rpm_conf_alternative else [])
             + _files + _cassandra_config_perm_changes + _cassandra_config_dir_changes }}
      vars:
        _conf_target: "{{ cassandra_config_conf_target.stat.lnk_source | default('') if cassandra_config_conf_target is not skipped else '' }}"
        _files: >-
          {% set out = [] %}{% for r in cassandra_config_preview.results if r.stdout and r.cassandra_config_file not in _cassandra_config_kept %}{% set _ = out.append({
            'item': cassandra_conf_dir ~ '/' ~ r.cassandra_config_file,
            'before': 'current',
            'after': '%d line(s) changed' % (r.stdout_lines | select('match', '^[-+](?![-+]{2} )') | list | length),
            'diff': r.stdout}) %}{% endfor %}{{ out }}

    # One prompt per batch (with serial, once per batch). run_once: its answer registered on every
    # host of the batch (pause runs once anyway, but without run_once only its own host gets the answer)
    - name: Confirm config changes
      ansible.builtin.pause:
        prompt: |-
          cassandra_config is about to change (diffs above):
          {% for h in ansible_play_batch if hostvars[h]._cassandra_config_ask | default(false) | bool %}
            {{ h }}: {{ hostvars[h]._cassandra_config_changes | join(', ') }}
          {% endfor %}
          Nodes are NOT restarted by this role. Type 'yes' to apply
      register: cassandra_config_answer
      run_once: true
      when:
        - not ansible_check_mode
        - ansible_play_batch | map('extract', hostvars) | map(attribute='_cassandra_config_ask', default=false) | map('bool') | select | list | length > 0

    - name: Stop unless the changes were confirmed
      ansible.builtin.assert:
        that: (cassandra_config_answer.user_input | default('')) == 'yes'
        fail_msg: >-
          Config changes not confirmed on {{ inventory_hostname }}{{ (' (not blank: ' ~ _cassandra_config_initialized_why ~ ')')
          if _cassandra_config_initialized | bool else '' }}. Run interactively and answer 'yes',
          or set cassandra_config_confirm: false to apply without asking.
      when:
        - not ansible_check_mode
        - _cassandra_config_ask | bool

    # a running node started another way (e.g. imported): what it runs with, before the change
    # (apply_config then knows the change waits for a restart, and an owner or mode change does not)
    - name: Record the config the running Cassandra started with
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: config_seed.yml
      when:
        - not ansible_check_mode
        - (_cassandra_config_changes + _cassandra_config_perm_changes) | length > 0

    # Once the changes are confirmed, so that nothing changes on a refusal
    - name: Set up the RPM conf dir alternative
      when:
        - ansible_facts['os_family'] == 'RedHat'
        - cassandra_rpm_conf_alternative != ""
      block:
        # Only seeded once: later runs must not overwrite files the templates
        # don't manage. From the dir in use (default.conf on a new install,
        # another alternative with keystores...), owners and modes kept; into
        # a temp name first (<dir>.seed, replaced), so an interrupted copy is
        # never selected.
        - name: Seed the alternative conf dir from the one in use
          ansible.builtin.command:
            argv:
              - sh
              - -c
              - >-
                if [ ! -d "$1" ]; then echo "conf dir in use ($1) missing: restore it or pick another (alternatives --config cassandra)" >&2; exit 1; fi;
                mkdir -p -- "$(dirname -- "$2")" && rm -rf -- "$2.seed" && cp -aT -- "$1" "$2.seed" && mv -T -- "$2.seed" "$2"
              - sh
              - "{{ cassandra_config_conf_target.stat.lnk_source | default('/etc/cassandra/conf')
                    if cassandra_config_conf_target.stat.exists else '/etc/cassandra/default.conf' }}"
              - "{{ _dest }}"
            creates: "{{ _dest }}"
          vars:
            _dest: "{{ cassandra_rpm_conf_alternative | regex_replace('(?<=.)/+$', '') }}"

        # Not seeded in check mode, --check or check_mode applied to the role
        # (apply_config's compare, which ansible_check_mode does not tell): only
        # a dir that is there is selected
        - name: Check for the alternative conf dir
          ansible.builtin.stat:
            path: "{{ cassandra_rpm_conf_alternative }}"
          register: cassandra_rpm_conf_alternative_stat

        - name: Select the alternative conf dir
          community.general.alternatives:
            name: cassandra
            link: /etc/cassandra/conf
            path: "{{ cassandra_rpm_conf_alternative }}"
            priority: "{{ cassandra_rpm_conf_alternative_priority }}"
            state: selected
          when: cassandra_rpm_conf_alternative_stat.stat.exists

    # (cassandra.yaml checked by the preview, when PyYAML is on the node); the regular files the
    # preview found the same, with the right owner and mode, are left as they are
    - name: Template Cassandra config files
      ansible.builtin.template:
        src: "{{ _cassandra_config_series }}/{{ cassandra_config_file }}.j2"
        dest: "{{ cassandra_conf_dir }}/{{ cassandra_config_file }}"
        owner: "{{ _cassandra_config_perm.owner }}"
        group: "{{ _cassandra_config_perm.group }}"
        mode: "{{ _cassandra_config_perm.mode }}"
        backup: "{{ cassandra_config_backup }}"
      diff: false  # shown above, with secrets masked
      loop: "{{ _cassandra_config_files[_cassandra_config_series] }}"
      loop_control:
        loop_var: cassandra_config_file
      vars:
        _cassandra_config_perm_file: "{{ cassandra_config_file }}"
      register: cassandra_config_applied
      when:
        - cassandra_config_file not in _cassandra_config_kept
        - cassandra_config_file in _cassandra_config_write

    # their content stays, not their owner, group and mode
    - name: Set the owner and mode of the files left as they are
      ansible.builtin.file:
        path: "{{ cassandra_conf_dir }}/{{ cassandra_config_file }}"
        owner: "{{ _cassandra_config_perm.owner }}"
        group: "{{ _cassandra_config_perm.group }}"
        mode: "{{ _cassandra_config_perm.mode }}"
      diff: false  # shown above (or by the caller: apply_config's view)
      loop: "{{ _cassandra_config_kept }}"
      loop_control:
        loop_var: cassandra_config_file
      vars:
        _cassandra_config_perm_file: "{{ cassandra_config_file }}"

    # Missing directories (looked for above): created once the files are written
    - name: Create the parents of the missing ones
      ansible.builtin.command:
        argv: [sh, -c, 'umask 022 && mkdir -p "$1"', sh, "{{ item.item | dirname }}"]  # 0755 whatever the umask
        creates: "{{ item.item | dirname }}"
      loop: "{{ cassandra_config_dirs.results | rejectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item | dirname }}"

    - name: Create the missing ones
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: directory
        owner: "{{ _cassandra_config_perm_settings.user }}"
        group: "{{ _cassandra_config_perm_settings.user_group }}"
        mode: "0750"
      loop: "{{ cassandra_config_dirs.results | rejectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Set the owner and mode of the existing ones
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory  # not recursive: what is in it stays as it is
        owner: "{{ _cassandra_config_perm_settings.user }}"  # as in item (the filter's), from the same variables
        group: "{{ _cassandra_config_perm_settings.user_group }}"
        mode: "{{ item.mode }}"
      diff: false  # shown above (or by the caller: apply_config's view)
      loop: "{{ _cassandra_config_dir_changes }}"
      loop_control:
        label: "{{ item.path }}"

    # for the two tasks below
    - name: Check whether Cassandra is running
      ansible.builtin.service_facts:
      when:
        - cassandra_config_applied.changed
        - cassandra_config_reload_seeds | bool or (_cassandra_config_changes | length > 0 and not _cassandra_config_no_restart_warning | default(false))

    # seeds are re-read live by 4.0+ (nodetool reloadseeds), no restart needed
    - name: Reload the seed list on the running node
      community.cassandra.cassandra_reload:
        reload: seeds
        port: "{{ cassandra_jmx_port }}"
        # remote JMX with authentication: the login of cassandra_service
        username: "{{ cassandra_jmx_username | default(omit, true) }}"
        password_file: "{{ cassandra_jmx_password_file | default(omit, true) }}"
        password: "{{ omit if cassandra_jmx_password_file | default('') else cassandra_jmx_password | default(omit, true) }}"
      when:
        - cassandra_config_reload_seeds
        - cassandra_config_applied.changed
        - (ansible_facts.services['cassandra.service'] | default(ansible_facts.services['cassandra'] | default({}))).state
          | default('') == 'running'
        - cassandra_config_preview.results | selectattr('cassandra_config_file', 'equalto', 'cassandra.yaml')
          | map(attribute='stdout') | first | default('') is search('^\+\s*- seeds:', multiline=True)
      register: cassandra_config_seeds_reload
      failed_when: false  # the file is written: said below, the list applies at the next restart

    - name: Say the seed reload failed
      ansible.builtin.debug:
        msg: >-
          WARNING - {{ inventory_hostname }}: the new seed list is written in cassandra.yaml but nodetool reloadseeds
          failed: {{ _error }}{{
          '. The running node cannot load its cassandra.yaml again (system.log: Error while getting seed node list
          says why, e.g. a key it does not know): fix the file before any restart, or the node will not start; then
          run community.cassandra.change_seeds.'
          if cassandra_config_seeds_reload.stdout | default('') is search('Failed to reload the seed node list') else
          '. The list applies at the next restart of the node, or fix the cause and run community.cassandra.change_seeds.' }}
      when:  # its result is never "failed" past its failed_when: the module's msg says
        - cassandra_config_seeds_reload is not skipped
        - cassandra_config_seeds_reload.msg | default('') != 'nodetool reloadseeds executed successfully'
      vars:
        cassandra_output: true
        cassandra_output_gap: true  # a block of its own: one per node
        _error: "{{ cassandra_config_seeds_reload.error | default(cassandra_config_seeds_reload.msg, true) }}"

    - name: Warn that a restart is needed
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ _cassandra_config_changes | join(', ') }} changed while Cassandra is running;
          the new settings apply at the next restart (not done by this role).
      when:
        - _cassandra_config_changes | length > 0  # not for an owner or mode alone
        - cassandra_config_applied.changed
        - (ansible_facts.services['cassandra.service'] | default(ansible_facts.services['cassandra'] | default({}))).state
          | default('') == 'running'
        - not _cassandra_config_no_restart_warning | default(false)  # apply_config restarts itself

- name: JMX users and cqlsh credentials
  ansible.builtin.include_tasks: access.yml
  when: cassandra_config_pkg_conf.stat.exists

- name: Report
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_change_report
  vars:
    cassandra_change_report_role: cassandra_config
    cassandra_change_report_items: "{{ _cassandra_config_items | default([]) }}"
