minor_changes:
  - "import_cluster - the screen and report.txt stay readable on a large cluster: from 12 nodes on, node lists by node groups defined once at the top (``G1 + db074``, ``all except db111``), a setting with a value per node on one screen line; a dict value (``cassandra_extra_settings``, ``cassandra_linux_limits``...) is one row per sub-key; a hand edit of a setting shows its value, the other hand edits are counted per file; the host_vars written are counted; long values and node lists wrap, the screen fits the terminal. apply_config's settings that differ name their nodes by groups the same way."
  - "import_cluster - a value that follows each node's inventory name the same way on every node (``<node>.example.net``) is imported once as a template (``{{ inventory_hostname }}.example.net``) instead of one value per node; the self-check renders it for each node. A node's addresses, token and Medusa fqdn stay its own."
  - "cassandra_config - ``cassandra_extra_settings.audit_logging_options`` adds the sub-keys no variable covers (``included_categories``...) to the template's ``audit_logging_options`` section."
bugfixes:
  - "import_cluster - a cassandra.yaml section the template does not have (``sstable``, ``full_query_logging_options``...) is imported whole into ``cassandra_extra_settings``, its types kept, instead of ``null`` with its sub-keys left as hand edits; so are the sub-keys of ``audit_logging_options`` no variable covers."
