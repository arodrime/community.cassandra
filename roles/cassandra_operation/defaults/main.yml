---
# defaults file for cassandra_operation (the task files of the collection's playbooks)

# Read by these task files too: the same values as cassandra_service's defaults
# (a unit test keeps them equal)
cassandra_service_enabled: true
cassandra_service_state: started
cassandra_service_restart_on_change: false
cassandra_service_allow_new_seed: false
cassandra_service_unit_manage: true
cassandra_service_environment: {}  # extra Environment= lines, e.g. {JAVA_HOME: /usr/lib/jvm/java-17}
cassandra_service_drain_timeout: 120  # seconds, below cassandra_service_timeout_stop
cassandra_service_wait_for_normal: true
cassandra_service_wait_timeout: 600  # seconds
cassandra_stream_check_interval: 30  # seconds
cassandra_stream_early_check_interval: 10  # seconds
cassandra_stream_early_time: 300  # seconds
cassandra_jmx_username: ""
cassandra_jmx_password: ""
cassandra_jmx_password_file: ""
_cassandra_service_jmx: >-
  {{ {'port': cassandra_jmx_port | default(7199) | int}
     | combine({'username': cassandra_jmx_username} if cassandra_jmx_username else {})
     | combine({'password_file': cassandra_jmx_password_file} if cassandra_jmx_password_file
               else ({'password': cassandra_jmx_password} if cassandra_jmx_password else {})) }}

# The rows of the preflight's sensitive or suspicious settings a node keeps on
# purpose (their WARNING silenced), e.g. [heap_size]: auto_bootstrap_false,
# replace_address, heap_size, allow_all_authenticator, failure_policy_ignore
cassandra_suspicious_ack: []
# add_node and replace_node check the new hosts before installing anything
# (root access, directories and their mounts, Pythons, packages and their
# sources, network, no Cassandra there yet) and stop with every problem
# found. false skips these checks.
cassandra_new_node_checks: true
# Minimum free space (GiB) on each data directory's file system, 0 = no minimum
cassandra_new_node_min_free_gb: 0
# The checks refuse a new host with no Cassandra yet that has the *_manage:
# false switches import_cluster wrote for the node the host had before
# (cassandra_linux_manage, cassandra_cqlsh_python_manage,
# cassandra_service_unit_manage, with cassandra_imported_host: true in its
# host_vars). true accepts it: its setup is done another way.
cassandra_new_node_allow_kept_setup: false

# Streaming operations (add_node, replace_node, decommission_node,
# remove_dead_node, add_datacenter's rebuild, move_node, topology) and
# cleanups are waited for as long as they make progress: nodetool netstats
# (compactionstats) is read and the progress printed every
# cassandra_stream_early_check_interval seconds during the first
# cassandra_stream_early_time seconds (a short operation ends in seconds),
# then every cassandra_stream_check_interval seconds. After
# cassandra_stream_stall_warn_time seconds with nothing streamed (no byte,
# no file, no session started or ended; on a node that receives, a
# bootstrap, replace or rebuild, the space used on its data and commitlog
# filesystems not growing either: a stream of whole SSTables counts a file's
# bytes once it is over) the progress line says STALLED, and the run fails
# only after cassandra_stream_stall_time seconds (a decommission or a move
# goes by netstats only: raise both for very big SSTables). No overall limit
# unless cassandra_stream_max_time is set (seconds, 0: none).
cassandra_stream_stall_warn_time: 300  # seconds
cassandra_stream_stall_time: 1800  # seconds
cassandra_stream_max_time: 0  # seconds, 0: no limit
# add_node: the cleanup of the nodes that handed data over. none: print the
# command; sequential: run it one node at a time (one: the same); rack, dc: a
# rack, a datacenter at a time; all: every node at once (heavy I/O).
cassandra_add_node_cleanup: none
# add_node: a new node with data but not in the ring (started once by
# mistake, a failed bootstrap) is emptied first (deletes what its directories
# hold, shown and confirmed; reset_node.yml), only when Cassandra is down there,
# no up node sees it in its ring, its cluster is this one or the stock 'Test
# Cluster' and it has no user keyspace but a failed bootstrap's of this
# cluster; else refused with what it holds. auto (default): a node of this
# cluster with its keyspaces and no bootstrap add_node left unfinished there
# (a former member, removed with removenode) is refused too; true (given)
# resets it; false refuses every node with data.
# replace_node: true empties a replacement host that still holds data,
# typically a host replacing itself (same address).
cassandra_add_node_reset: auto
cassandra_replace_node_reset: false
# The inventory is the desired state: a host of the cluster's group marked
# absent (a host var or a group var) is no longer part of the cluster, the
# playbooks leave it out and topology removes it from the ring
# (decommission). topology asks before it changes anything, the plan on the
# screen.
cassandra_node_state: present
# create_cluster: true rebuilds a cluster that runs already, all its data
# lost (another snitch, datacenters, racks); the operator types the cluster
# name, or gives it in cassandra_create_cluster_reset_confirm (no terminal)
cassandra_create_cluster_reset: false
cassandra_create_cluster_reset_confirm: ""
# One token per node (cassandra_num_tokens: 1): where add_node puts the new
# nodes without cassandra_initial_token (false: refused; bisect; balanced;
# true: shows both, asks), the replication factor the shares assume when no
# keyspace gives one, a datacenter where only some nodes have a token
# (create_cluster), and move_node's options
cassandra_token_auto: false
cassandra_token_rf: 3
cassandra_token_allow_partial: false
cassandra_move_tokens: {}
cassandra_move_cleanup: none
cassandra_move_min_free_percent: 20
cassandra_move_force_disk: false
# decommission_node, topology, remove_dead_node: go on when a datacenter would
# keep fewer nodes than a keyspace has replicas there (nodetool decommission --force)
cassandra_decommission_force: false

# the words of an action in a --check result ("would restart")
_cassandra_service_would:
  apply_config: apply the config
  update_java: update Java
  upgradesstables: upgrade the SSTables

# The screens of long operations (screen.yml: session=) warn when the
# controller's shell is not inside tmux or screen (a lost SSH session would stop the run)
_cassandra_session_warning: >-
  {{ '' if lookup('ansible.builtin.env', 'TMUX') or lookup('ansible.builtin.env', 'STY')
     else 'this run is not inside tmux or screen: if the SSH session to this machine drops, the run stops'
          ~ ' (the operation itself goes on, unwatched). Run it inside tmux or screen.' }}
# the lifetime of the background job of a decommission, removenode or rebuild
# (outlives cassandra_stream_max_time: the wait reports it, the job is not killed)
_cassandra_stream_async: "{{ cassandra_stream_max_time | int + 86400 if cassandra_stream_max_time | int > 0 else 2592000 }}"

# Cluster health check run by the operation playbooks before and after each
# node: how long to wait for down nodes to come back, and whether to go on
# anyway (risky: a second replica down can make data unavailable).
cassandra_service_health_timeout: 600  # seconds
cassandra_service_health_force: false

# The clocks of the nodes (sync_clocks, and the check before create_cluster and
# add_node start nodes): a node is in sync when its time sync daemon reports
# it synchronised, its offset plus the daemon's error bound within
# cassandra_clock_max_offset_ms (milliseconds). A correction over
# cassandra_clock_step_ms steps the clock rather than slewing it (timesyncd
# steps past 400 ms): on a node where Cassandra runs, sync_clocks does it in a
# restart window. cassandra_clock_sync_timeout: seconds to wait for a time sync
# just started (chrony's error bound only shrinks with its first polls, ~64 s
# apart). cassandra_clock_check: false skips the check before the starts.
cassandra_clock_max_offset_ms: 50
cassandra_clock_step_ms: 400
cassandra_clock_sync_timeout: 180
cassandra_clock_check: true

# CQL access for the checks that read the schema (e.g. replication before a
# decommission), when authentication is on
cassandra_cql_username: ""
cassandra_cql_password: ""
# add_node's mark of a bootstrap it started on a node, removed once the node
# joined: data of this cluster without it is a former member's (reset_node_plan.yml)
_cassandra_service_bootstrap_mark: /var/lib/cassandra/.ansible_bootstrap_started
# seeds_apply's mark of a seed list written while the node runs, removed once reloaded:
# a rerun reloads it (an earlier run stopped before the reload, or its reload failed)
_cassandra_service_seeds_reload_mark: /var/lib/cassandra/.ansible_seeds_reload_owed
# sync_clocks' mark of a restart window open on a node (Cassandra stopped for its clock)
_cassandra_clock_window_mark: /var/lib/cassandra/.ansible_clock_window
# an older mark is not trusted (a node that may have joined since, its end not seen)
_cassandra_service_bootstrap_mark_days: 7
# The files of the conf dir cassandra_config writes: the config a restart picks up
# (and the JMX access file, in the conf dir on Debian and Ubuntu; not the password
# file, read at each login: a new one needs no restart)
_cassandra_service_config_files: [cassandra.yaml, cassandra-env.sh, jvm*-server.options, cassandra-rackdc.properties, logback.xml,
                                  jmxremote.access]
_cassandra_service_nodetool: >-
  nodetool -p {{ _cassandra_service_jmx.port }}{{ (' -u ' ~ cassandra_jmx_username | quote) if cassandra_jmx_username else '' }}{{
  (' -pwf ' ~ cassandra_jmx_password_file | quote) if cassandra_jmx_password_file
  else ((' -pw ' ~ cassandra_jmx_password | quote) if cassandra_jmx_password else '') }}

# Operator confirmation before an operation that asks for one (confirm.yml):
# true asks, false goes on without asking (non-interactive runs). --check
# never asks: nothing changes, the screen is the plan.
cassandra_operation_confirm: true

# Rolling restarts and stop_rack drain each node (nodetool drain, with the JMX
# settings above) before stopping it. The role's unit drains on stop too
# (cassandra_service_drain_on_stop): a second drain is harmless. false leaves
# it to the unit, except on a node whose own unit is kept
# (cassandra_service_unit_manage: false), which may not drain: drained anyway.
cassandra_operation_drain: true

# Rolling operations keep a progress file on the controller; resume an
# interrupted one with -e cassandra_rolling_resume=true. Empty: .cassandra_progress
# in the inventory's dir, or in the current dir when that one is not writable.
cassandra_rolling_resume: false
cassandra_rolling_progress_dir: ""
cassandra_rolling_progress_days: 30

# The variables the playbooks are run with (-e): a name set close to one of them
# is pointed out (hosts_check.yml), preflight warns about cassandra_*
# variables no role or playbook knows, and a -e one under a prefix of the
# collection that none knows stops the run (variables_check.yml; -e
# cassandra_allow_unknown_variables=true lets it through)
_cassandra_playbook_variables: [cassandra_hosts, cassandra_target_nodes, cassandra_target_dc, cassandra_target_rack,
                                cassandra_upgrade_phase, cassandra_rolling_resume, cassandra_rolling_mode, cassandra_dead_node_method,
                                cassandra_dead_node_new_removal, cassandra_replace_address,
                                cassandra_rebuild_source_dc, cassandra_cleanup_mode, cassandra_status_raw,
                                cassandra_allow_down_nodes, cassandra_accept_default_identity,
                                cassandra_add_node_reset, cassandra_replace_node_reset, cassandra_create_cluster_reset,
                                cassandra_create_cluster_reset_confirm, cassandra_allow_unknown_variables,
                                # import_cluster's and help's options (their header)
                                import_cluster_dir, import_cluster_report_dir, import_cluster_force, import_cluster_host_names,
                                import_cluster_set_ansible_host, import_cluster_vault_password_file, import_cluster_vault_id,
                                import_cluster_medusa_path, import_cluster_keep_hand_edits, import_cluster_allow_unread,
                                import_cluster_keep_unread_jvm_options,
                                import_cluster_adopt, import_cluster_strict, import_cluster_debug,
                                help_topic, help_write, help_runbook_dir, help_inventory]
