minor_changes:
  - cassandra_install - installs the Java the series needs (11 for 4.0/4.1, 17 for 5.0; cassandra_java_version), and python3.11 for cqlsh where the system python3 is outside the range cqlsh supports (then a /usr/local/bin/cqlsh wrapper, /etc/profile.d/cqlsh.sh and /etc/sudoers.d/cqlsh point cqlsh at it).
  - cassandra_install - on Debian/Ubuntu, the package no longer starts Cassandra with the stock configuration before the node is configured.
  - cassandra_install - cassandra-tools is installed on the RHEL family too, and jemalloc where a repository has it.
  - cassandra_install - on the RHEL family, the rpm's cqlshlib is linked into the site-packages of the Pythons cqlsh may use (it only ships for python3.6).
