---
argument_specs:
  main:
    short_description: Configure the Apache Cassandra package repository.
    description:
      - Adds the Apache Cassandra apt or yum repository for one release series.
      - With O(cassandra_install_method=packages), adds none and removes the ones it added.
    options:
      cassandra_version:
        type: str
        default: 50x
        description:
          - Release series of the repository, for example C(40x), C(41x) or C(50x).
      cassandra_install_method:
        type: str
        default: repository
        description:
          - How the Cassandra packages are installed, the same in C(cassandra_repository)
            and C(cassandra_install).
          - V(repository), from the yum/apt repository C(cassandra_repository) adds at
            O(cassandra_install_url) (Apache's, or a mirror of it). The URL is checked
            first (C(repodata/repomd.xml), or the suite's C(InRelease) or C(Release)), and a
            plain directory of package files is refused, nothing is added.
          - V(packages), the package files are downloaded from O(cassandra_install_url),
            a plain directory of files (e.g. a generic folder of a repository manager),
            and installed (on the RedHat family without their Java dependency, like with a
            Java tarball). No repository is added, and the
            ones C(cassandra_repository) added earlier are removed.
            C(cassandra_package_version) is required.
      cassandra_install_url:
        type: str
        description:
          - The repository (V(repository)), or the directory of the package files
            (V(packages)).
          - Defaults to O(cassandra_repository_rpm_url) or O(cassandra_repository_deb_url)
            (Apache's repositories). Apache's RPM directory
            (C(https://redhat.cassandra.apache.org/<series>/)) also works with V(packages);
            its Debian files are under C(https://debian.cassandra.apache.org/pool/main/c/cassandra/).
      cassandra_install_username:
        type: str
        description:
          - User for O(cassandra_install_url) when it needs credentials to read (an
            account, or a service account with a token as O(cassandra_install_password)).
            Defaults to O(cassandra_repository_username).
      cassandra_install_password:
        type: str
        no_log: true
        description:
          - Password or token for O(cassandra_install_username). Keep it in a vault.
            Defaults to O(cassandra_repository_password).
      debian_packages:
        type: list
        elements: str
        default: [apt-transport-https, curl, gnupg, python3-debian]
        description:
          - Packages needed to add the repository on Debian and Ubuntu.
      cassandra_apt_keyring_path:
        type: path
        default: /etc/apt/keyrings/apache-cassandra.asc
        description:
          - Where the repository signing key is stored on Debian and Ubuntu.
      cassandra_rpm_key_path:
        type: path
        default: /etc/pki/rpm-gpg/apache-cassandra.asc
        description:
          - Where the signing keys are installed on RedHat.
      cassandra_repository_key_url:
        type: str
        default: ""
        description:
          - Where the release signing keys come from. Empty uses the copy of
            U(https://downloads.apache.org/cassandra/KEYS) shipped with the role,
            so nothing is downloaded.
          - A URL (e.g. a local mirror) is downloaded instead; every key it holds
            must be in O(cassandra_repository_key_fingerprints).
      cassandra_repository_key_fingerprints:
        type: list
        elements: str
        description:
          - Primary key fingerprints accepted from O(cassandra_repository_key_url).
            Defaults to the keys of the shipped copy.
      cassandra_offline:
        type: bool
        default: false
        description:
          - Air-gapped hosts, nothing is downloaded. Here it only sets the default
            of O(cassandra_repository_manage) to V(false).
      cassandra_repository_manage:
        type: bool
        description:
          - V(false) when the repositories are configured by other means (a
            Satellite/Foreman, the system image, an internal mirror already set up),
            so the role does nothing.
          - Defaults to V(true), V(false) with O(cassandra_offline).
      cassandra_repository_username:
        type: str
        default: ""
        description:
          - Older name of O(cassandra_install_username), its default.
          - User for a mirror that needs credentials to read (an account, or a service
            account with a token as O(cassandra_repository_password)). Used for the
            repository and for O(cassandra_repository_key_url).
          - On RedHat the credentials go in the yum repository file (then mode 0600),
            on Debian/Ubuntu in C(/etc/apt/auth.conf.d/cassandra.conf) (0600).
      cassandra_repository_password:
        type: str
        default: ""
        no_log: true
        description:
          - Older name of O(cassandra_install_password), its default.
      cassandra_repository_deb_url:
        type: str
        default: https://debian.cassandra.apache.org
        description:
          - Older name of O(cassandra_install_url) on Debian and Ubuntu, its default
            there (the Cassandra apt repository, or a mirror of it).
      cassandra_repository_rpm_url:
        type: str
        description:
          - Older name of O(cassandra_install_url) on the RedHat family, its default
            there (the Cassandra yum/dnf repository, or a mirror of it).
            Defaults to C(https://redhat.cassandra.apache.org/<cassandra_version>/).
