---
# Reboots every host of a cluster, one at a time: checks the cluster, drains
# the node, reboots the host, waits until Cassandra has joined, checks the cluster again.
# Stops at the first problem, without touching the next node. Asks once first
# (cassandra_operation_confirm: false, or --check, asks nothing).
#   ansible-playbook -i inventory community.cassandra.rolling_reboot
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo): the playbook asks for it itself, no -b needed.
# Resume an interrupted run (skips the nodes already done): add -e cassandra_rolling_resume=true
# cassandra_reboot_timeout (default 1800 s), cassandra_reboot_command and
# cassandra_reboot_boot_time_command pass through to ansible.builtin.reboot.
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Set up the progress file
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  vars:
    cassandra_service_node_action: reboot
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    # before the progress file: a run stopped here leaves none (a resume takes the latest)
    - name: Show the plan and confirm the run
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: screen.yml
      vars:
        _nodes: "{{ ansible_play_hosts | community.cassandra.cassandra_node_list }}"
        cassandra_screen_question: "Reboot {{ _nodes }}, one host at a time?"
        cassandra_screen_session_warning: true
        cassandra_screen:
          operation: rolling_reboot
          summary: "reboot {{ _nodes }}, one host at a time"
          intro:
            - >-
              Drains each node in turn and reboots its host, the cluster checked healthy before and after each;
              stops at the first problem, without touching the next node.{{
                ' The nodes the interrupted run finished are skipped (cassandra_rolling_resume).'
                if cassandra_rolling_resume | default(false) | bool else '' }}

    - name: Set up the progress file
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: progress.yml

- name: Rolling reboot
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  serial: 1
  any_errors_fatal: true
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Reboot this host
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: reboot

- name: Summary
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Print the summary
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: summary.yml
