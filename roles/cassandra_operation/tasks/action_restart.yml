---
# The Prometheus exporter's agent able to start first (its jar, its config, its port): else Cassandra would not
# come up; the node not stopped when it cannot (the caller says what it wrote: _cassandra_exporter_check_left)
- name: Check the Prometheus exporter's agent can start
  ansible.builtin.include_tasks: exporter_check.yml

# The unit written first: a run that can't write it (no root) stops with the
# node still running, not drained
- name: Install the cassandra systemd unit
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: unit.yml

- name: Drain the node
  ansible.builtin.import_tasks: drain.yml
  # a kept unit, or the package's init script, may not drain
  when: >-
    cassandra_operation_drain | bool or not cassandra_service_unit_manage | default(true) | bool
    or cassandra_service_start | default('unit') != 'unit'
  vars:
    _cassandra_service_drain_then: restarted

# apply_config: its OS settings done with Cassandra stopped (os_window.yml): its time sync, its disk settings
- name: Apply the OS settings with Cassandra stopped
  ansible.builtin.include_tasks: os_window.yml
  when:
    - _cassandra_restart_timesync | default(false) | bool or _cassandra_restart_disks | default(false) | bool
    - not ansible_check_mode

# a restart with something done while Cassandra is stopped (sync_clocks steps the clock: action_sync_clock.yml)
- name: Do what is done while it is stopped
  when: _cassandra_service_while_stopped | default('') | length > 0
  block:
    # apply_config's release window: the mark before the stop (a stop interrupted, its JVM slow to exit, leaves a node
    # a resumed run starts), its reasons in it (apply_config_window.yml removes it once Cassandra runs again)
    - name: Mark the node stopped by this run
      ansible.builtin.copy:
        dest: /run/cassandra-apply-config.restart
        content: "{{ cassandra_apply_config_why | default('', true) or 'Cassandra ' ~ cassandra_package_version }}\n"
        mode: "0600"
      when: _cassandra_service_while_stopped == 'apply_config_window.yml'

    - name: Stop cassandra
      ansible.builtin.systemd_service:
        name: cassandra
        state: stopped

    - name: Run what is done while it is stopped
      ansible.builtin.include_tasks: "{{ _cassandra_service_while_stopped }}"

- name: Restart it and wait until it has joined
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: main.yml
    rolespec_validate: false  # as the include it was: no argument check
  vars:
    _cassandra_change_report_quiet: "{{ ansible_verbosity | int == 0 }}"  # the recap says it (-v shows it)
    cassandra_service_state: restarted
    _cassandra_storage_mode_checked: true  # (storage_mode_guard.yml, before the plan)
    _cassandra_service_unit_written: true
  when: _cassandra_service_while_stopped | default('') != 'apply_config_window.yml'

# apply_config's release window: the package updated, a failed start said as such (the release installed, Cassandra
# left stopped, the mark kept: a resume starts it), not as the start task's own words alone
- name: Start it on the new release and wait until it has joined
  when: _cassandra_service_while_stopped | default('') == 'apply_config_window.yml'
  block:
    - name: Start it on the new release and wait until it has joined
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: main.yml
        rolespec_validate: false  # as the include it was: no argument check
      vars:
        _cassandra_change_report_quiet: "{{ ansible_verbosity | int == 0 }}"  # the recap says it (-v shows it)
        cassandra_service_state: restarted
        _cassandra_storage_mode_checked: true  # (storage_mode_guard.yml, before the plan)
        _cassandra_service_unit_written: true
  rescue:
    - name: Note the step that failed
      ansible.builtin.set_fact:
        _cassandra_stop_word: start failed after the package update
        _cassandra_restart_cause: >-
          {{ ansible_failed_result | default({}) | community.cassandra.cassandra_failure_cause(ansible_failed_task.name | default('')) }}

    # (a start that timed out waiting for the node to join may have left it running: said as observed)
    - name: Note the state the failed start left
      ansible.builtin.include_tasks: start_failed_state.yml

    # (the release installed, as read now: not read, not known)
    - name: Read the installed packages after the failed start
      ansible.builtin.package_facts:
      register: cassandra_restart_packages
      ignore_errors: true  # (not read: said as not known)
      check_mode: false  # a read

    - name: Stop the run on the failed start
      ansible.builtin.fail:
        msg: "{{ [_failed, _installed, cassandra_start_failed_state, 'WAY OUT  fix it, then resume'] | join(_nl) }}"
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _failed: >-
          {{ inventory_hostname }}: the start after the update to {{ cassandra_package_version }} failed:
          {{ _cassandra_restart_cause }}
        _version: >-
          {{ (((cassandra_restart_packages.ansible_facts | default({})).packages | default({})).get('cassandra', [{}])
              | first).version | default('') | regex_replace('^([0-9]+\.[0-9]+\.[0-9]+).*$', '\1') }}
        _installed: "Package installed: Cassandra {{ _version or 'not known' }}."
