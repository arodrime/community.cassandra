bugfixes:
  - decommission_node - a run again after an interruption was refused while the node was still leaving, and once the node had left, Cassandra was left running and enabled on it; a run again now waits for the decommission in progress, or stops and disables Cassandra on a node already decommissioned. A failed decommission is refused with what to do.
  - remove_dead_node - a run again while the removal was still in progress failed (the coordinating node refuses a second removal) and a run again after it ended was refused; it now waits for the removal in progress, whichever node coordinates it, and does nothing when the node is already out of the ring. A node being removed (gossip, or DL) with no node of the run coordinating it is refused instead of removed a second time (``cassandra_dead_node_new_removal=true`` starts a removal).
