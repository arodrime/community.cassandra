minor_changes:
  - cassandra_config - new variables for cassandra.yaml settings commented out in stock (empty by default, the line stays commented out) - ``cassandra_native_transport_max_frame_size`` (on 4.0 ``cassandra_native_transport_max_frame_size_in_mb``), ``cassandra_auto_snapshot_ttl`` and ``cassandra_streaming_stats_enabled`` (4.1+, refused on 4.0; ``cassandra_streaming_stats_enabled`` refused before 4.1.1, which added the key).
  - cassandra_config - new variables for sub-keys of ``audit_logging_options``, written at their stock line in the section - ``cassandra_audit_logs_dir``, ``cassandra_audit_included_categories``, ``cassandra_audit_excluded_keyspaces``, ``cassandra_audit_excluded_users``, ``cassandra_audit_max_queue_weight``, ``cassandra_audit_max_log_size`` (the three comma-separated lists also take a list, written joined with commas).
  - import_cluster playbook - reads these settings into their variables (a 4.1+ node's ``native_transport_max_frame_size_in_mb`` into ``cassandra_native_transport_max_frame_size``, converted), the audit sub-keys wherever the node has them in the section; the cdc_raw directory is read with the data directories (owner and mode), and a cdc_raw directory that differs between nodes is a move, as for the other data directories.
  - cassandra_config - a variable of a key a later series or patch release added is checked against the installed release (else, and in the upgrade playbook's preflight, ``cassandra_package_version`` when pinned, else the series' latest release known), with one message naming the variable, the release, the release that added the key and the way out; the check runs after the node is read (before anything is written).
breaking_changes:
  - cassandra_config - ``cassandra_extra_settings`` refuses ``native_transport_max_frame_size`` (on 4.0 ``native_transport_max_frame_size_in_mb``), ``auto_snapshot_ttl``, ``streaming_stats_enabled`` and the ``audit_logging_options`` sub-keys above, naming their variable, and on 4.1+ ``native_transport_max_frame_size_in_mb`` when ``cassandra_native_transport_max_frame_size`` is set - move them to their variables (a re-import does it).
  - cassandra_config - ``cassandra_prepared_statements_cache_size``, ``cassandra_key_cache_size``, ``cassandra_counter_cache_size`` and ``cassandra_index_summary_capacity`` (4.1+ keys) are refused on 4.0, where they were ignored.
