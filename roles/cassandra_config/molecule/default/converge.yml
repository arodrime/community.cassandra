---
- name: Converge
  hosts: all
  tasks:
    - name: Render with stock defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config

    - name: Render with overrides
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
      vars:
        cassandra_conf_dir: /tmp/cassandra-override
        cassandra_data_dir: /data/cassandra/data
        cassandra_cluster_name: "Molecule Cluster"
        cassandra_num_tokens: 4
        cassandra_seeds: "10.0.0.1:7000,10.0.0.2:7000"
        cassandra_endpoint_snitch: GossipingPropertyFileSnitch
        cassandra_heap_size: 512M
        cassandra_jvm_max_gc_pause_millis: 500
        cassandra_jvm17_max_gc_pause_millis: 200
        cassandra_jvm_parallel_gc_threads: 8
        cassandra_jvm_extra_options: ["-Dmolecule.a=1", "-Dmolecule.b=2"]
        cassandra_local_jmx: false
        cassandra_dc: DC_A
        cassandra_rack: RACK_1
        cassandra_prefer_local: true
        cassandra_log_level: WARN
        cassandra_debug_log_enabled: false

    - name: Render 4.x series with defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
      vars:
        cassandra_version: "{{ series }}"
        cassandra_conf_dir: "/tmp/cassandra-{{ series }}"
      loop: [40x, 41x]
      loop_control:
        loop_var: series

    - name: Render 4.0 with overrides
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
      vars:
        cassandra_version: 40x
        cassandra_conf_dir: /tmp/cassandra-40x-override
        cassandra_key_cache_save_period: 3600
        cassandra_read_request_timeout_in_ms: 7000
        cassandra_heap_size: 512M
        cassandra_heap_newsize: 128M
        cassandra_jvm8_extra_options: ["-Dmolecule.jvm8=1"]

    - name: Render 4.x with a heap size but no newsize
      block:
        - name: Run the role, expecting its heap assert to fail
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_config
          vars:
            cassandra_version: 41x
            cassandra_conf_dir: /tmp/cassandra-41x
            cassandra_heap_size: 512M

        - name: Fail if the role accepted a heap size without newsize on 4.x
          ansible.builtin.fail:
            msg: cassandra_config accepted cassandra_heap_size without cassandra_heap_newsize on 4.x
      rescue:
        - name: Assert the failure came from the role's heap assert
          ansible.builtin.assert:
            that: ansible_failed_task.name == "Assert heap settings are consistent (4.x)"

    - name: Render with an empty cassandra_conf_dir
      block:
        - name: Run the role, expecting its assert to fail
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_config
          vars:
            cassandra_conf_dir: ""

        - name: Fail if the role did not stop on the empty cassandra_conf_dir
          ansible.builtin.fail:
            msg: cassandra_config accepted an empty cassandra_conf_dir
      rescue:
        - name: Assert the failure came from the role's own assert
          ansible.builtin.assert:
            that: ansible_failed_task.name == "Assert required cassandra_config variables are set"

    - name: Render with an unsupported cassandra_version
      block:
        - name: Run the role, expecting its assert to fail
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_config
          vars:
            cassandra_version: "30x"

        - name: Fail if the role accepted an unsupported cassandra_version
          ansible.builtin.fail:
            msg: cassandra_config accepted cassandra_version 30x
      rescue:
        - name: Assert the failure came from the role's own assert
          ansible.builtin.assert:
            that: ansible_failed_task.name == "Assert required cassandra_config variables are set"
