minor_changes:
  - 'cassandra_service role - the unit runs Cassandra as ``cassandra_user`` and ``cassandra_group``, the variables that also give ``cassandra_config``''s files their group and its directories and JMX users'' files their owner (``cassandra_service_user`` and ``cassandra_service_group`` override them for the unit and those directories and files). Before writing the unit, the role refuses an account that could not read the config files ``cassandra_config`` writes (a kept unit: its own ``User=`` and ``Group=``), or that does not exist; the preflight playbook, run first by the operation playbooks, makes the same check.'
  - 'apply_config playbook - a node whose systemd unit changed since Cassandra started (e.g. a new ``User=`` or ``Group=``) is restarted, like one whose config files changed.'
