---
argument_specs:
  main:
    short_description: Linux settings for Cassandra nodes.
    description:
      - Kernel settings, swap, transparent huge pages, time sync, limits,
        and read-ahead and IO scheduler of the data disk.
      - In containers, settings are written but not applied live unless
        O(cassandra_linux_apply_live=true).
    options:
      cassandra_data_block_device:
        type: str
        default: ""
        description:
          - Disk of the Cassandra data, for example C(/dev/sdb) or C(/dev/nvme0n1);
            a partition is taken as its disk. A disk that can't be tuned fails the role.
          - When empty (and O(cassandra_data_block_devices) too), the disks are found
            from the data and commitlog directories. LVM, md RAID and dm-crypt are
            not guessed.
      cassandra_data_dir:
        type: path
        description:
          - Cassandra's data directory, used to find the data disk. No default in this role.
      cassandra_data_readahead_kb:
        type: int
        default: 4
        description:
          - Read-ahead of the data disks, in KB. The IO scheduler is set to none
            on SSD/NVMe disks only.
      cassandra_sysfs_block_root:
        type: path
        default: /sys/block
        description:
          - sysfs block root used for the disk tuning. Only meant for tests.
      cassandra_linux_timesync:
        type: bool
        default: true
        description:
          - Install and start time sync. chrony (kept where already installed), or
            systemd-timesyncd on Debian/Ubuntu without chrony.
          - V(false) leaves the host's time sync alone, for example when it is
            managed by other means with the site's NTP servers.
      cassandra_offline:
        type: bool
        default: false
        description:
          - Air-gapped hosts, nothing is downloaded. The time sync package is not
            installed, only started when present (a warning otherwise).
      cassandra_linux_apply_live:
        type: raw
        default: auto
        description:
          - Apply kernel settings live (sysctl, swapoff, THP, disk tuning), not just persist them.
          - C(auto) applies them everywhere except in containers (Ansible's
            virtualization facts, or O(cassandra_linux_container_types)), where they
            belong to the host. V(true) or V(false) forces it.
      cassandra_linux_container_types:
        type: list
        elements: str
        default: [docker, podman, container, containerd, lxc]
        description:
          - Values of C(ansible_virtualization_type) treated as containers.
      cassandra_linux_sysctl:
        type: dict
        default:
          vm.swappiness: 1
          vm.max_map_count: 1048575
          vm.zone_reclaim_mode: 0
          net.ipv4.tcp_keepalive_time: 60
          net.ipv4.tcp_keepalive_probes: 3
          net.ipv4.tcp_keepalive_intvl: 10
          net.core.rmem_max: 16777216
          net.core.wmem_max: 16777216
          net.core.rmem_default: 16777216
          net.core.wmem_default: 16777216
          net.core.optmem_max: 40960
          net.ipv4.tcp_rmem: "4096 87380 16777216"
          net.ipv4.tcp_wmem: "4096 65536 16777216"
        description:
          - Kernel settings, written to O(cassandra_linux_sysctl_file) and
            applied live (not from a container, which shares the host kernel).
      cassandra_linux_sysctl_file:
        type: path
        default: /etc/sysctl.d/60-cassandra.conf
        description:
          - Where O(cassandra_linux_sysctl) is written. The same keys are removed
            from C(/etc/sysctl.conf), which is read last and would win.
      cassandra_linux_limits:
        type: dict
        default: {memlock: unlimited, nofile: 1048576, nproc: 32768, as: unlimited}
        description:
          - Limits of the cassandra user, in C(/etc/security/limits.d/cassandra.conf),
            for tools run by hand as cassandra. The service gets its own limits from
            its systemd unit (C(cassandra_service_limit_*)).
      cassandra_data_block_devices:
        type: list
        elements: str
        default: []
        description:
          - Several disks to tune (JBOD data directories, a commitlog disk),
            e.g. C(["/dev/nvme0n1", "/dev/nvme1n1"]). Empty uses
            O(cassandra_data_block_device), else auto-detects the disks of the
            data directories and of C(cassandra_commitlog_dir).
