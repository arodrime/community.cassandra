minor_changes:
  - preflight playbook, import_cluster playbook - more sensitive or suspicious settings warned about (nothing refused) - a ``-Dcassandra.replace_address`` or ``replace_address_first_boot`` flag left on a member of the ring (the JVM options, ``cassandra_service_environment``, a line of the node's config), with what to remove; the heap (``cassandra_heap_size``, a ``-Xmx`` option, the unit's ``MAX_HEAP_SIZE``) not set on a 4.x host with 64G of RAM or more, under 2G, 32G or more, or over half the RAM (RAM-based checks in preflight only); ``AllowAllAuthenticator`` with an rpc address other hosts reach; ``disk_failure_policy`` or ``commit_failure_policy`` ``ignore``.
  - cassandra_service - ``cassandra_suspicious_ack`` (per host or group), the ids of the suspicious settings a node keeps on purpose, whose WARNING is left out; each WARNING names its id, an unknown id gets a WARNING.
