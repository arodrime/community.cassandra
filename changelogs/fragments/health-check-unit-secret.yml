minor_changes:
  - >-
    health_check playbook - a secret in the inventory's ``cassandra_service_environment`` is said as a WARNING, with
    the file ``apply_config`` writes it to (the cassandra unit, or the drop-in of the package's init script), which
    every local user can read and ``systemctl show`` prints, and the way out ``apply_config`` gives. It is said of
    the inventory's value: the file on the node is not read. A node whose value can't be read (a variable it uses
    is not defined there) is said not checked, with the variable's name, and the check goes on.
