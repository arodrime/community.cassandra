minor_changes:
  - 'cassandra_config role - new ``cassandra_audit_logger_parameters`` (default ``{}``): the audit logger''s parameters, a mapping written under its ``audit_logging_options.logger`` entry as the one item of its ``parameters`` list Cassandra reads, each value written quoted, so the logger gets text (for a custom logger: the stock ones ignore them); a key YAML would not read back as written plain (``on``, ``yes``, ``null``, a number, ``:`` or ``#`` in it) and a value that is not a text, a number or a boolean on one line without control characters are refused.'
  - 'cassandra_config role - the refusal of a logger in ``cassandra_extra_settings.audit_logging_options`` (already refused) now names the variables to use, ``cassandra_audit_logger_class_name`` and ``cassandra_audit_logger_parameters``.'
  - 'import_cluster playbook - reads the audit logger''s class and its one mapping of parameters into ``cassandra_audit_logger_class_name`` and ``cassandra_audit_logger_parameters``, keys in their order, values as text; such a node no longer fails the self-check, and the role leaves its ``cassandra.yaml`` as it is. A null value is left out; several mappings, an empty list or mapping, a value that is a list, a mapping or on several lines, or a key the role could not write plain stay a hand edit.'
