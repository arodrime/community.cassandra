breaking_changes:
  - "operation playbooks - no group is taken by default any more: without ``-e cassandra_hosts`` nor ``CASSANDRA_CLUSTER``, a group named ``cassandra`` is no longer picked, the playbooks run on the inventory's only cluster, laid out as import_cluster writes it (``<group>`` with its ``<group>_<dc>`` groups; a lone group such as ``[linux]`` or ``[cassandra]`` is none), else stop, naming the clusters found (a group ``cassandra`` among them: how to name it). To run on a group ``cassandra`` alone or next to groups of other names (``dc1``, ``rack1``, ``monitoring``), name it: ``-e cassandra_hosts=cassandra`` or ``CASSANDRA_CLUSTER=cassandra``."
minor_changes:
  - "operation playbooks - ``-e cassandra_hosts`` and ``CASSANDRA_CLUSTER`` naming two different clusters stop the run before anything is done, naming both; so do a ``cassandra_hosts`` set in the inventory (``group_vars``, ``host_vars``: the plays' hosts do not see it) and an empty ``-e cassandra_hosts=``. The help playbook picks the cluster the same way; none named on an inventory that is not one cluster, it shows the operations for any cluster (``CLUSTER_GROUP`` in their commands) and the clusters found, without what one cluster's inventory says; import_cluster refuses the two names disagreeing too."
  - "operation playbooks - the first line of every run (import_cluster excepted: it reads the cluster from its nodes) names the cluster, its nodes and datacenters, and how it was picked (``CLUSTER prod (5 nodes, dc1) | chosen by: -e cassandra_hosts``, ``CASSANDRA_CLUSTER (environment)``, ``the only cluster in the inventory``); the ``community.cassandra.ops`` callback says it again as the run's last line."
