---
# Apply the inventory's config (and OS settings) to a running cluster.
#
#   ansible-playbook community.cassandra.apply_config
#
# The settings that differ are shown first, then one question. Only the nodes
# that need it are touched, and only the ones whose change needs it are
# restarted, one at a time, the cluster checked before and after each (files
# staged first on all nodes at once, .<file>.ansible-next, put in place just
# before each restart).
#
# --check shows the differences, changing nothing. The run stops at the first
# problem; -e cassandra_rolling_resume=true resumes it.
#
# Options and defaults: ansible-playbook community.cassandra.help -e help_topic=apply_config
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight
  vars:
    _cassandra_notes_in_plan: true  # the checks' WARNING lines in the plan, before the question
    _cassandra_preflight_seeds_down_ok: true  # a seed of this run not running: written, maybe started
    _cassandra_preflight_release_update: true  # releases of one series, the inventory's among them: its own update
    _cassandra_preflight_step: true  # its phase line a step of the run (ops callback: tasks counted, time said)
    # -e apply_only with a part apply_config does not have: refused by preflight's first play and its nodes' one
    # (the first under --limit: target_nodes_check.yml); drift's compare: every part, whatever apply_only says
    _cassandra_preflight_refused: >-
      {{ [] if _cassandra_apply_config_compare_only | default(false) | bool or not _cassandra_apply_only_refused
         else ('apply_config  ' ~ lookup('community.cassandra.cassandra_hosts', errors='ignore') | default('', true))
              | community.cassandra.cassandra_refused(_cassandra_apply_only_refused) }}
    _cassandra_apply_only_refused: >-
      {{ (apply_only | default('') | community.cassandra.cassandra_apply_only(
            'apply_config' | community.cassandra.cassandra_command(
              options=['--check'] if ansible_check_mode else [],
              extra=['-e cassandra_rolling_resume=true'] if cassandra_rolling_resume | default(false) | bool else [],
              inventory=ansible_inventory_sources | default([]),
              default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
              hosts=cassandra_hosts | default(''), limit=ansible_limit | default(''),
              cwd=lookup('ansible.builtin.env', 'PWD')))).refused }}

# (a node that fails here would be left out of the plan: nothing done then)
# _cassandra_apply_config_compare_only (the drift playbook's import): the compare alone, as a real run does it before
# its plan (read only), then nothing: no stop, no plan, no question, no node to do, no summary
- name: Find what each node needs
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  any_errors_fatal: true
  gather_facts: false
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    # the cluster's nodes read once for the run (query cassandra_nodes reads every node's variables at each call,
    # many calls per node and per task otherwise); read again if the group's hosts change
    - name: Note the cluster's nodes for the run
      ansible.builtin.set_fact:
        _cassandra_nodes_memo: "{{ lookup('community.cassandra.cassandra_nodes', memo=true) }}"
      run_once: true
      tags: [always]  # under --tags too

    - name: Say what the run does
      ansible.builtin.debug:
        msg: "{{ 'compare_config' | community.cassandra.cassandra_phase(count=ansible_play_hosts_all | length) }}"
      run_once: true
      vars:
        cassandra_output: true  # a phase line (ops callback)
        cassandra_output_gap: true  # a block of its own
        cassandra_output_step: true  # a step: its tasks counted, its time said

    - name: Note when the run started
      ansible.builtin.set_fact:
        _cassandra_apply_config_start: "{{ now().timestamp() | int }}"
      run_once: true

    # -e apply_only=<parts>: only these parts compared and applied (config and unit always: the restart decision reads
    # them); -e apply_full=true: the whole cassandra_config compare on every node, as before its plan was split from
    # the rest (a fallback while the roles are split into a plan and the rest: meant to go once they all are, and
    # proven); -e apply_verify=true (tests, support): the whole compare too, each node the plan found unchanged
    # checked to end with the facts it said
    - name: Note the parts of the run
      ansible.builtin.set_fact:
        # (drift's compare: every part, whatever -e apply_only says)
        _cassandra_apply_parts: >-
          {{ ('' if _cassandra_apply_config_compare_only | default(false) | bool else apply_only | default(''))
             | community.cassandra.cassandra_apply_only(_command) }}
        _cassandra_apply_full: "{{ apply_full | default(false) | bool }}"
        _cassandra_apply_verify: "{{ apply_verify | default(false) | bool }}"
        _cassandra_apply_command: "{{ _command }}"
        # (a resume: the command that starts over, the run's parts kept with the interrupted one's)
        _cassandra_apply_command_over: >-
          {{ 'apply_config' | community.cassandra.cassandra_command(options=_options, **_args)
             if cassandra_rolling_resume | default(false) | bool else '' }}
      vars:
        # this run's command, for the ways out that give it with other options (--check, a resume kept)
        _command: >-
          {{ 'apply_config' | community.cassandra.cassandra_command(options=_options, extra=_extra, **_args) }}
        _options: "{{ ['--check'] if ansible_check_mode else [] }}"
        _extra: "{{ ['-e cassandra_rolling_resume=true'] if cassandra_rolling_resume | default(false) | bool else [] }}"
        _args:
          inventory: "{{ ansible_inventory_sources | default([]) }}"
          default_inventory: "{{ lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST') }}"
          hosts: "{{ cassandra_hosts | default('') }}"
          cwd: "{{ lookup('ansible.builtin.env', 'PWD') }}"
      run_once: true

    # apply_only: a resumed run (-e cassandra_rolling_resume=true) applies the parts the interrupted one did (recorded
    # next to its progress file, the one the resume picks: progress_find.yml; none: every part, as before apply_only).
    # Here, before anything is written (the JMX password file, a mark forgotten); --check too
    - name: Find the progress file a resume picks
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: progress_find.yml
      vars:
        cassandra_service_node_action: apply_config
        _prefix: "{{ lookup('community.cassandra.cassandra_hosts') }}-apply_config-"
        _progress_resuming: true
      when:
        - cassandra_rolling_resume | default(false) | bool
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: no resume

    - name: Refuse to resume with other parts than the interrupted run
      ansible.builtin.fail:
        msg: "{{ ('apply_config  ' ~ _cluster) | community.cassandra.cassandra_refused(_said) | join(_nl) }}"
      run_once: true
      when:
        - cassandra_rolling_resume | default(false) | bool
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: no resume
        - _resumed | length > 0
        - _said | length > 0
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"
        # (the file the resume picks; none: nothing to resume, said by the progress file's own check)
        _resumed: "{{ (cassandra_progress_found.files | default([]) | sort(attribute='mtime') | last | default({})).path | default('') }}"
        # (none: not recorded; a resume given -e apply_only goes on, its parts recorded)
        _recorded: >-
          {{ lookup('ansible.builtin.file', _resumed | regex_replace('[.]done$', '.parts'), errors='ignore')
             | default('', true) | trim }}
        # ('': no -e apply_only given)
        _current: >-
          {{ '' if apply_only | default('') | string in ['', 'None']
             else _cassandra_apply_parts.parts | join(',') if _cassandra_apply_parts.left_out else 'all' }}
        # (this run's command, --check kept: _cassandra_apply_command_over, a resume's without resuming)
        _resume: >-
          {{ _cassandra_apply_command_over ~ ' -e cassandra_rolling_resume=true -e apply_only=' ~ (_recorded or 'all') }}
        _said: >-
          {{ _resumed | community.cassandra.cassandra_apply_resume_refusal(_recorded, _current, _resume,
                                                                            _cassandra_apply_command_over) }}

    # in the plan of a real run, said under --check (the checks' notes)
    - name: Say the parts left out
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: note.yml
      run_once: true
      when: _cassandra_apply_parts.left_out | length > 0
      vars:
        _cassandra_notes_in_plan: true
        _note: "WARNING  not checked (apply_only):{{ _cassandra_apply_parts.left_out | map('regex_replace', '^', _nl ~ '  ') | join }}"
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)

    # What apply_config covers besides the files (plugin_utils cassandra_apply_config_coverage: every variable of the
    # roles in its category): what it cannot do on a live cluster, or leaves to a procedure of its own, stops the run
    # here, before anything is compared (a real run's compare refuses the templates of another series than the one
    # installed); --check goes on and says it in its recap
    - name: Load the role defaults
      ansible.builtin.include_role:
        name: "community.cassandra.{{ item }}"
        tasks_from: defaults.yml
        public: true
      loop: [cassandra_install, cassandra_operation]

    # (the one running, else the installed package's: a node not running)
    - name: Read the installed Cassandra package
      ansible.builtin.command:
        argv: >-
          {{ ['dpkg-query', '-W', '-f=${db:Status-Status} ${Version}', 'cassandra'] if ansible_facts['os_family'] == 'Debian'
             else ['rpm', '-q', '--qf', 'installed %{VERSION}\n', 'cassandra'] }}
      register: cassandra_apply_config_package
      changed_when: false
      failed_when: false  # none: a host not set up yet
      check_mode: false  # reads only

    # another series: an upgrade (C); a newer release of the series: the package in the node's restart (B), unless it
    # would not start with the node's settings or the collection's notes do not cover it (plugin_utils
    # cassandra_patch_notes); an older release: refused (C)
    - name: Note the version change
      ansible.builtin.set_fact:
        cassandra_apply_config_version: >-
          {{ cassandra_version | community.cassandra.cassandra_apply_config_version(
               cassandra_package_version | default(''), _running, _settings, cassandra_allow_unknown_patch | default(false),
               _installed, _unfinished) }}
        # (refused for a restart or a start: below, once the plan knows them)
        cassandra_apply_config_unfinished: "{{ _unfinished }}"
      vars:
        _described: "{{ cassandra_preflight_describe.stdout | default('') | community.cassandra.cassandra_described_versions }}"
        # (one line per package: rpm lists two after a transaction left half done; dpkg its state, then its version)
        _package: >-
          {{ cassandra_apply_config_package.stdout_lines | default([]) | community.cassandra.cassandra_package_state }}
        _installed: "{{ _package.installed }}"
        # a package left half installed or configured (an interrupted dpkg or rpm transaction): what was read
        _unfinished: "{{ _package.unfinished }}"
        _running: "{{ _described[_cassandra_preflight.ring_address | default('')] | default(_installed) }}"
        _settings:
          cassandra_jvm_options: >-
            {{ [cassandra_jvm_extra_options | default([]), cassandra_jvm8_extra_options | default([]),
                cassandra_jvm11_extra_options | default([]), cassandra_jvm17_extra_options | default([])] | flatten }}
          cassandra_memtable_allocation_type: "{{ cassandra_memtable_allocation_type | default('') }}"
          cassandra_memtable_offheap_space: "{{ cassandra_memtable_offheap_space | default('') }}"

    # a joined node whose inventory gives another initial_token than its cassandra.yaml: the tokens it owns, to tell a
    # record of its token (after move_node) from another one
    - name: Read the tokens of the ring
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: ring_tokens.yml
      run_once: true
      when:
        - _cassandra_preflight_running_nodes | default([]) | length > 0
        - _differ | length > 0
      vars:
        _differ: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts if hostvars[h]._cassandra_preflight is defined -%}
          {%-   set p = hostvars[h]._cassandra_preflight -%}
          {%-   if p.cassandra_initial_token | default('') not in ['', 'None'] and p.cassandra_initial_token != p.live_initial_token | default('') -%}
          {%-     set _ = out.append(h) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

    - name: Note what stops the run before any change
      ansible.builtin.set_fact:
        # the ring against the inventory (topology's): the hosts to add or remove, the ring's nodes it lacks
        _cassandra_apply_config_ring: "{{ _ring }}"
        _cassandra_apply_config_stops: >-
          {{ _nodes | community.cassandra.cassandra_apply_config_stops(_ring, {
               'upgrade': 'upgrade' | community.cassandra.cassandra_command(extra=['-e cassandra_upgrade_phase=preflight'], **_args),
               'topology_check': 'topology' | community.cassandra.cassandra_command(options=['--check'], **_args),
               'topology': 'topology' | community.cassandra.cassandra_command(**_args)}) }}
      run_once: true
      vars:
        _args:
          inventory: "{{ ansible_inventory_sources | default([]) }}"
          default_inventory: "{{ lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST') }}"
          hosts: "{{ cassandra_hosts | default('') }}"
          cwd: "{{ lookup('ansible.builtin.env', 'PWD') }}"
        _status: "{{ (cassandra_preflight_status | default({})).cluster_status | default({}, true) }}"
        _absent: "{{ query('community.cassandra.cassandra_nodes', state='absent') }}"
        _ring: >-
          {%- set nodes, absent, known = [], [], [] -%}
          {%- for h in ansible_play_hosts -%}
          {%-   set p = hostvars[h]._cassandra_preflight | default({}) -%}
          {%-   set _ = nodes.append({'name': h, 'address': p.ring_address | default('')}) -%}
          {%- endfor -%}
          {%- for h in query('community.cassandra.cassandra_nodes') + _absent -%}
          {%-   set v = hostvars[h] -%}
          {%-   set p = v._cassandra_preflight | default({}) -%}
          {%-   set addresses = [p.ring_address | default(''), p.address | default(''), v.cassandra_listen_address | default(''),
                                 (v.cassandra_extra_settings | default({})).broadcast_address | default(''),
                                 v.ansible_host | default(''), h] | select | list -%}
          {%-   set _ = known.extend(addresses) -%}
          {%-   if h in _absent -%}{%- set _ = absent.append({'name': h, 'addresses': addresses}) -%}{%- endif -%}
          {%- endfor -%}
          {{ nodes | community.cassandra.cassandra_apply_config_ring(absent, known, _status) }}
        # the ring's tokens read and failed (not read, no node running: nothing judged)
        _ring_unread: >-
          {{ cassandra_apply_config_tokens is defined and cassandra_apply_config_tokens is not skipped
             and cassandra_apply_config_tokens.ring is not defined }}
        # by ring address: the tokens each node owns
        _owned: >-
          {%- set out = {} -%}
          {%- for dc, entries in (cassandra_apply_config_tokens.ring | default({})).items() -%}
          {%-   for e in entries -%}{%- set _ = out.update({e.address: out.get(e.address, []) + [e.token | string]}) -%}{%- endfor -%}
          {%- endfor -%}
          {{ out }}
        _nodes: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts -%}
          {%-   set v = hostvars[h] -%}
          {%-   set p = v._cassandra_preflight | default({}) -%}
          {%-   set _ = out.append({'name': h, 'series': v.cassandra_version | default(''),
                                    'version': v.cassandra_apply_config_version | default({}),
                                    'token': p.cassandra_initial_token | default('')
                                             | community.cassandra.cassandra_apply_config_token(
                                                 p.live_initial_token | default(''),
                                                 none if _ring_unread | bool else _owned.get(p.ring_address | default(''), []))}) -%}
          {%- endfor -%}
          {{ out }}

    # (--check too: it stops where the real run stops, with the same refusal and way out, not later on the state the
    # refusal describes)
    - name: Stop before any change
      ansible.builtin.fail:
        msg: >-
          {{ ('apply_config  ' ~ _cluster) | community.cassandra.cassandra_refused(_cassandra_apply_config_stops) | join(_nl) }}
      run_once: true
      when:
        - _cassandra_apply_config_stops | length > 0
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: nothing changed, no stop
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"

    # (drift's compare: where a real run stops, no compare either, which another series would fail; drift says the
    # stop in IN SYNC)
    - name: End the compare where a real run stops
      ansible.builtin.meta: end_play
      when:
        - _cassandra_apply_config_stops | length > 0
        - _cassandra_apply_config_compare_only | default(false) | bool

    # Check mode: shows the diffs, writes nothing. The role's plan (plan.yml: what it reads, compares and lists) on
    # every node; the rest of the role (apply_plan.yml: its messages, its writes) only where the plan lists something
    # it would write (_cassandra_config_plan_writes): elsewhere it would say nothing and leave the plan's facts as
    # they are, its own ones empty, set so here. apply_full: the rest on every node; apply_verify: the rest on every
    # node too, then the facts checked
    - name: Compare the config
      vars:
        cassandra_config_confirm: false
        _cassandra_config_no_question: true  # a preview (apply: check_mode asks anyway), whatever -e cassandra_config_confirm says
        cassandra_config_reload_seeds: false
        cassandra_change_report_dir: ""  # the real run reports
        _cassandra_config_no_restart_warning: true
        # the changes once: in the plan of a real run (before its question), in the recap under --check
        _cassandra_config_quiet: true
        _cassandra_change_report_quiet: true
        # (every node of the play runs the plan: its checks once per set of values; apply_full, apply_verify: per node,
        # as before)
        _cassandra_config_checks_once: "{{ not (_cassandra_apply_full | bool or _cassandra_apply_verify | bool) }}"
        # (apply_full: the users' ~/.cassandra files not compared, as before)
        _cassandra_config_user_files_compare: "{{ not _cassandra_apply_full | bool }}"
        _rest: "{{ _cassandra_apply_full | bool or _cassandra_apply_verify | bool or _cassandra_config_plan_writes | length > 0 }}"
        # the facts of cassandra_config this run reads that the rest of the role sets (tests/unit: test_apply_config_gate)
        _gate_facts: [_cassandra_config_items, _cassandra_config_exporter_changes, _cassandra_change_report_seen,
                      _cassandra_config_header, _cassandra_config_same_as, cassandra_jvm]
        _seen_config: >-
          {{ _cassandra_change_report_seen | default({}) | combine({'cassandra_config': {'items': [], 'state': {}}}) }}
        _gate: false
        # the facts as they are, the gate's own as it sets them when _gate (apply_verify); {fact: sha1 of its JSON}
        _gate_values:
          _cassandra_config_items: []
          _cassandra_config_exporter_changes: []
          _cassandra_change_report_seen: "{{ _seen_config }}"
        _values: >-
          {{ dict(_gate_facts | zip(query('ansible.builtin.vars', *_gate_facts, default='(not set)')))
             | combine(_gate_values if _gate | bool else {}) }}
        _sums: "{{ dict(_values | list | zip(_values.values() | map('to_json', sort_keys=true) | map('hash', 'sha1'))) }}"
      block:
        - name: Work out what the config role would change
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_config
            tasks_from: plan.yml
            public: true  # cassandra_conf_dir for the next tasks
            apply:
              check_mode: true
              diff: false  # (the files' diffs: said in WILL/WOULD CHANGE, --diff, and in the .diff file)

        # (said in the report; the rest runs there too with apply_full or apply_verify)
        - name: Note whether the plan found the config unchanged
          ansible.builtin.set_fact:
            _cassandra_apply_config_gate: "{{ 'role' if _cassandra_config_plan_writes else 'unchanged' }}"

        # (a sha1 of each fact the rest may set, as the plan leaves it and the gate sets it: no secret kept)
        - name: Keep the facts the plan leaves, to check the rest of the role against them (apply_verify)
          ansible.builtin.set_fact:
            _cassandra_apply_config_verify: "{{ _sums }}"
          when:
            - _cassandra_apply_verify | bool
            - _cassandra_config_plan_writes | length == 0
          vars:
            _gate: true
          no_log: true  # (the facts read hold secrets)

        - name: Compare the config with the rest of the role
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_config
            tasks_from: apply_plan.yml
            public: true
            apply:
              check_mode: true
              diff: false  # (the files' diffs: said in WILL/WOULD CHANGE, --diff, and in the .diff file)
          when: _rest | bool

        # (_gate_facts, the rest of the role on a node where its plan lists nothing; the others as the plan set them)
        - name: Note what the rest of the config role leaves on a node it would not change
          ansible.builtin.set_fact:
            _cassandra_config_items: []
            _cassandra_config_exporter_changes: []
            _cassandra_change_report_seen: "{{ _seen_config }}"  # (_gate_values)
          when: not _rest | bool

        - name: Check the rest of the role left the facts its plan said (apply_verify)
          ansible.builtin.fail:
            msg: "{{ ('apply_config  ' ~ _cluster) | community.cassandra.cassandra_refused(_said) | join(_nl) }}"
          when:
            - _cassandra_apply_verify | bool
            - _cassandra_config_plan_writes | length == 0
            - _differ | length > 0
          vars:
            cassandra_output: true  # a verdict: its msg as is (ops callback)
            _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
            _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"
            _gate: false
            _differ: >-
              {%- set out = [] -%}
              {%- for n, v in _sums.items() if _cassandra_apply_config_verify.get(n) != v -%}{%- set _ = out.append(n) -%}{%- endfor -%}
              {{ out }}
            _said:
              - "{{ inventory_hostname }}: apply_verify: cassandra_config's plan found nothing to change"
              - "{{ inventory_hostname }}: the rest of the role left other facts: {{ _differ | join(', ') }}"
              - "a bug of the collection's fast compare: please report it"
              - "WAY OUT  the whole compare on every node, as before it:"
              - "  {{ _cassandra_apply_command }} -e apply_full=true"

    # nothing on a node with cassandra_linux_manage false (its OS settings kept as they are)
    - name: Compare the OS settings
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_linux
        apply:
          check_mode: true
          diff: "{{ ansible_diff_mode | bool and ansible_verbosity | int > 0 }}"  # said in the OS settings view (-v: the file diffs too)
      vars:
        cassandra_change_report_dir: ""  # the real run reports
        _cassandra_change_report_quiet: true
        _cassandra_linux_quiet: true  # in the settings that differ
        _cassandra_linux_compare: true  # (check mode applied to it, which ansible_check_mode does not tell)
        _cassandra_linux_swap_said: true  # in the plan
        _cassandra_linux_restart_window: true  # what is not done under a running Cassandra: a reason of its restart
      when: "'linux' in _cassandra_apply_parts.parts"

    # Medusa (cassandra_medusa_enabled): its version, medusa.ini, its credentials file, its link and profile.d; never
    # on a node where it is false (left as it is). Not Cassandra's: no restart for it. A node that cannot get it
    # (cassandra_offline without it installed, its fqdn about to change) stops the run here, before anything is done
    - name: Compare Medusa
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_medusa
        apply:
          check_mode: true
      vars:
        cassandra_change_report_dir: ""  # the real run reports
        _cassandra_change_report_quiet: true  # in the settings that differ
        _cassandra_medusa_compare: true  # (check mode applied to it, which ansible_check_mode does not tell)
      when:
        - cassandra_medusa_enabled | default(false) | bool
        - "'medusa' in _cassandra_apply_parts.parts"

    # The package repository, the packages and tools (cassandra_install: cqlsh's Python, dsbulk, jemalloc), the firewall,
    # the AxonOps agent (cassandra_axonops_enabled): not read by the running Cassandra (jemalloc, the AxonOps Java agent:
    # at its next start), applied at the node's turn, no restart for them.
    # Compared as Medusa is (check mode applied to them: _cassandra_compare); never on a node whose version changes by
    # another procedure (stopped before any change); on a newer release of its series, with the release check of its
    # restart window (applied live all the same, its package kept at the release installed). The firewall only with
    # cassandra_manage_firewall, as create_cluster and add_node run it
    - name: Compare the repository, the packages and the firewall
      ansible.builtin.include_role:
        name: "community.cassandra.{{ _cassandra_compared_role }}"
        apply:
          check_mode: true
      # (the parts of the run: apply_only)
      loop: "{{ _roles | select('in', _cassandra_apply_parts.parts | map('regex_replace', '^', 'cassandra_')) | list }}"
      loop_control:
        loop_var: _cassandra_compared_role  # their own loops use item (else a warning on screen for each)
      vars:
        _roles: >-
          {{ ['cassandra_repository', 'cassandra_install']
             + (['cassandra_firewall'] if cassandra_manage_firewall | default(false) | bool else [])
             + (['cassandra_axonops'] if cassandra_axonops_enabled | default(false) | bool else []) }}
        cassandra_change_report_dir: ""  # the real run reports
        _cassandra_change_report_quiet: true  # in the settings that differ
        _cassandra_compare: true  # (check mode applied to them, which ansible_check_mode does not tell)
        cassandra_install_java: false  # a Java move is worked out below (as update_java does)
        # a newer release of its series: compared as its restart window installs it (the package itself is the
        # Cassandra row of the restart)
        _cassandra_install_upgrade: "{{ (cassandra_apply_config_version | default({})).kind | default('') == 'release' }}"
        # (a release its repository does not list: refused before any change, as the run's other stops say it)
        _cassandra_install_refused_head: >-
          apply_config  {{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}
      when:
        - (cassandra_apply_config_version | default({})).kind | default('') in ['', 'release']
        # a package left half done: its install not compared (its version is not one; e2e: "has Cassandra 5.0.8, the
        # inventory asks for 5.0.9" from the first of two packages, before the refusal of its start below)
        - _cassandra_compared_role != 'cassandra_install' or not cassandra_apply_config_unfinished | default('')

    # A node running another Java than cassandra_java_version (the plan of update_java, shared): installed, made the
    # one Cassandra starts with, then the node's one restart, checked to run it (action_apply_config.yml)
    - name: Work out the Java of the nodes running another one
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: java_plan.yml
      vars:
        _cassandra_java_plan_run: apply_config  # (its ways out)
        _cassandra_java_plan_running_only: true  # a node not running starts on the Java its unit gives
        _cassandra_java_plan_check_all: false
        _cassandra_java_plan_user: "{{ cassandra_user | default('cassandra') }}"

    # a part left out (apply_only) that a node needs: its newer release (install), the AxonOps agent cassandra-env.sh
    # loads (axonops), the Java it moves to (java: its plan read all the same, above); --check too, where the real run
    # stops; before anything is written
    - name: Refuse to leave out a part a node needs
      ansible.builtin.fail:
        msg: "{{ ('apply_config  ' ~ _cluster) | community.cassandra.cassandra_refused(_said) | join(_nl) }}"
      run_once: true
      when:
        - _cassandra_apply_parts.left_out | length > 0
        - _said | length > 0
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: nothing changed, no stop
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"
        _said: >-
          {{ ansible_play_hosts | community.cassandra.cassandra_apply_only_stops(hostvars, _cassandra_apply_parts.parts,
                                                                                  _cassandra_apply_command,
                                                                                  _cassandra_apply_command_over) }}


    # The AxonOps agent (cassandra_axonops_enabled): a Java move swaps its Java agent package, which is not supported
    # yet (update_java refuses it too): refused before any change, --check too (not drift's compare, which changes
    # nothing and says it)
    - name: Refuse a Java move with the AxonOps agent
      ansible.builtin.fail:
        msg: "{{ ('apply_config  ' ~ _cluster) | community.cassandra.cassandra_refused(_said) | join(_nl) }}"
      run_once: true
      when:
        - _axonops | length > 0
        - not _cassandra_apply_config_compare_only | default(false) | bool
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"
        _axonops: >-
          {{ ansible_play_hosts | community.cassandra.cassandra_axonops_enabled_hosts(hostvars, 'cassandra_java_plan_todo') }}
        _said:
          - "{{ _axonops | join(', ') }}: cassandra_axonops_enabled is true, and cassandra_java_version moves them to another Java"
          - "a Java change with the AxonOps agent: not supported yet in this version"
          - "WAY OUT  move these nodes to the new Java by hand, following AxonOps' agent docs for the Java agent package of the new Java, or wait for the next version of the collection"

    # What the running Cassandra got from its unit (cassandra_service: its user, its limits, its environment), against
    # what the role's unit gives at its next start: a difference restarts it, the unit written in that restart
    # (action_restart.yml); a unit file that differs in systemd's handling only is written at its next restart
    - name: Compare the cassandra unit
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: unit_compare.yml
        public: true  # its defaults: what the unit gives, compared below
      when: cassandra_service_unit_manage | default(true) | bool

    - name: Read what the running Cassandra got from its unit
      ansible.builtin.shell: |
        echo "user=$(ps -o user= -p "$CASSANDRA_PID" | tr -d ' ')"
        echo "group=$(ps -o group= -p "$CASSANDRA_PID" | tr -d ' ')"
        echo "limits=$(base64 -w0 < "/proc/$CASSANDRA_PID/limits")"
        echo "environment=$(systemctl show cassandra -p Environment --value 2>/dev/null)"
        # (the environment of the JVM itself: a unit reloaded since its start is not what it runs; used only when
        # the unit file or a drop-in is newer than the JVM. A generator's output, rewritten at every daemon-reload,
        # left out: for the package's init script, its script, SourcePath)
        echo "environ=$(base64 -w0 < "/proc/$CASSANDRA_PID/environ")"
        echo "unitmtime=$(stat -c %Y $(systemctl show cassandra -p FragmentPath -p SourcePath -p DropInPaths --value \
          2>/dev/null | tr ' ' '\n' | grep -v '^/run/systemd/\(generator\|transient\)') 2>/dev/null | sort -n | tail -1)"
        # in a container, systemd gives no more than its own hard limits (a limit above them: the JVM gets the cap)
        systemd-detect-virt -cq 2>/dev/null && echo "ceiling=$(base64 -w0 < /proc/1/limits)"
        exit 0
      environment:
        CASSANDRA_PID: "{{ cassandra_jvm.pid }}"
      register: cassandra_apply_config_unit_read
      changed_when: false
      failed_when: false  # not read: nothing compared
      check_mode: false  # reads only
      no_log: true  # its environment can hold passwords
      when:
        - cassandra_jvm.pid is defined
        - cassandra_service_unit_manage | default(true) | bool
        - cassandra_service_start | default('unit') in ['unit', 'package_script']

    - name: Look for a restart still pending
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: config_pending.yml

    # A file written back with the content the running Cassandra started with (deleted or edited by hand
    # since): no restart for it. Only when the record is that JVM's (its pid and start, recorded with it:
    # a start outside the roles leaves the one of an earlier JVM), nor when the conf directory itself changes
    # (rpm alternative). cassandra.yaml too: Cassandra re-reads only its seeds from it once started (nodetool
    # reloadseeds, a hand edit may have loaded others): reloaded once written back (action_apply_config.yml)
    - name: Note the files written back as the running Cassandra started with them
      ansible.builtin.set_fact:
        # (the conf directory changes: what Cassandra runs with is not what is compared, nothing proven of it)
        _cassandra_apply_config_conf_switch: "{{ _switch }}"
        _cassandra_apply_config_as_started: >-
          {%- set out = [] -%}
          {%- set conf = cassandra_conf_dir | trim | regex_replace('/+$', '') -%}
          {%- for f in _cassandra_config_changes | default([]) if f in _new and not _switch -%}
          {%-   for path, sum in _record.items() if path | basename == f and path | dirname | regex_replace('/+$', '') == conf -%}
          {%-     if _new[f] | hash('sha1') in [sum, _settings.get(path)] and f not in out -%}{%- set _ = out.append(f) -%}{%- endif -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ out }}
      vars:
        _record: "{{ cassandra_pending_snapshot.content | b64decode | from_json if cassandra_pending_snapshot.content is defined else {} }}"
        _new: "{{ _cassandra_config_new | default({}) }}"  # the files as cassandra_config renders them
        # (a file that start read, left as it is by cassandra_config: the sha1 of the role's rendering of its settings)
        _settings: "{{ _record._same_settings | default({}) }}"
        _target: "{{ cassandra_config_conf_target.stat.lnk_source | default('') if cassandra_config_conf_target is defined
                     and cassandra_config_conf_target is not skipped else '' }}"
        _switch: >-
          {{ _target | length > 0 and _target | regex_replace('/+$', '')
             != cassandra_rpm_conf_alternative | default(_target) | regex_replace('/+$', '') }}

    # no record of the files it started with: an edit made since may be applied or not
    - name: Say which files changed since Cassandra started, with no record of the ones it started with
      ansible.builtin.debug:
        msg: >-
          {{ (inventory_hostname ~ ': ' ~ _unknown | join(', ') ~ ' written after Cassandra started, not by the roles'
              ~ ' (they record the files it starts with): it may not run what they say. No restart is planned for'
              ~ ' them alone; rolling_restart applies them.')
             | wordwrap(77, break_long_words=false, wrapstring=_nl ~ '  ', break_on_hyphens=false) }}
      vars:
        cassandra_output: true
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        # (77 columns: the next lines are 2 in. "not restarted for them" read as a contradiction when
        # the plan restarts the node for the inventory's changes; one line of ~240 columns per node)
        # (5.0: not cassandra.yaml when Cassandra runs an earlier storage_compatibility_mode than it has: restarted)
        _unknown: >-
          {{ cassandra_config_unknown_files | reject('equalto', 'cassandra.yaml') | list
             if cassandra_version | default('') == '50x'
                and {'inventory_hostname': inventory_hostname,
                     'cassandra_storage_mode_read': cassandra_storage_mode_read | default({}),
                     'cassandra_storage_mode_cql': cassandra_storage_mode_cql | default({}),
                     'cassandra_storage_mode_running': cassandra_storage_mode_running | default('')}
                    | community.cassandra.cassandra_storage_mode_ahead
             else cassandra_config_unknown_files }}
      when: _unknown | length > 0

    # its unit not running: a JVM started another way still runs the config it read
    - name: Look for a Cassandra JVM the unit did not start
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: jvm_started.yml
      when: not _cassandra_preflight_running | default(true) | bool

    # outside the control group of its unit (started by hand, or by a script of its own), not the unit's own JVM
    # whatever the unit's state says (an init script's unit shows "active (exited)")
    - name: Tell whether its unit started that JVM
      ansible.builtin.shell: |
        {{ lookup('ansible.builtin.file', playbook_dir ~ '/files/jvm_proof.sh') }}
        jvm_untrusted "$CASSANDRA_PID" | grep 'not started by the cassandra unit' || true
      environment:
        CASSANDRA_PID: "{{ cassandra_jvm.pid }}"
      register: cassandra_apply_config_jvm_outside
      changed_when: false
      check_mode: false  # reads only
      when:
        - not _cassandra_preflight_running | default(true) | bool
        - cassandra_jvm.pid is defined

    # failed (it could not start, or crashed) or restarting after a failure: it was to run; else stopped on purpose
    - name: Read the state of its unit
      ansible.builtin.systemd_service:
        name: cassandra
      register: cassandra_apply_config_unit
      failed_when: false  # no unit: not started by it
      when: not _cassandra_preflight_running | default(true) | bool

    # (one command per node) a node an interrupted run stopped in its restart window (the mark: its reasons); for a
    # node whose time sync is to start: whether its unit can run here (its condition, e.g. no container for
    # timesyncd), and its clock
    # against its time source when chrony tells it (chronyd -Q: installed, not running; nothing that would start
    # a daemon), "ahead" its offset in seconds, positive when its clock is ahead
    - name: Read the clock and the mark of a restart in progress
      ansible.builtin.shell: |
        m=/run/cassandra-apply-config.restart
        # (empty: by an earlier version, for its time sync only)
        [ -e $m ] && echo "mark=yes" && { [ ! -s $m ] || grep -q 'time sync' $m; } && echo "mark_timesync=yes"
        [ -n "$CASSANDRA_TIMESYNC" ] || exit 0
        # (a unit not found, or never started since boot, says "no" too: no start tried, its timestamp 0)
        systemctl show -p LoadState,ConditionResult,ConditionTimestampMonotonic "$CASSANDRA_TIMESYNC" 2>/dev/null \
          | awk -F= '{v[$1] = $2} END {if (v["LoadState"] == "loaded" && v["ConditionResult"] == "no" &&
                                            v["ConditionTimestampMonotonic"] != "0") print "condition=no"}'
        if chronyc -n tracking >/dev/null 2>&1; then
          chronyc -n tracking | awk -F': *' '/^Leap status/ && /Not synchronised/ {unsynced = 1}
            /^System time/ {split($2, a, " "); ahead = (a[3] == "fast" ? "" : "-") a[1]}
            END {if (ahead != "" && !unsynced) {print "ahead=" ahead; print "source=chrony"}}'
        elif command -v chronyd >/dev/null 2>&1; then
          o=$(timeout 30 chronyd -Q -t 20 2>&1 | sed -n 's/.*System clock wrong by \([-+0-9.e]*\) seconds.*/\1/p' | tail -1)
          [ -n "$o" ] && awk -v o="$o" 'BEGIN {print "ahead=" (-o); print "source=chronyd -Q"}'
        fi
        exit 0
      environment:
        # the time sync service to start, if any (its item: the one not a package)
        CASSANDRA_TIMESYNC: >-
          {{ _cassandra_linux_items | default([]) | selectattr('timesync', 'defined') | map(attribute='item')
             | reject('match', 'package ') | first | default('') }}
      register: cassandra_apply_config_clock
      changed_when: false
      failed_when: false
      check_mode: false  # reads only

    # The proof that the files to write change nothing for the running Cassandra, so that it is not restarted for
    # them (the import self-check's, cassandra_apply_config_no_effect): its arguments, the version of the Java it
    # runs, the environment its unit gives it (what cassandra-env.sh reads). Read only when every file to write
    # is one such a proof covers (cassandra-env.sh, the JVM options files, logback.xml); anything else restarts
    - name: Read the running JVM's arguments, its Java and the environment of its unit
      ansible.builtin.shell: |
        [ -r "/proc/$CASSANDRA_PID/cmdline" ] || exit 0
        # (not the arguments and environment of the unit, or not known: no proof, as the import reads them)
        {{ lookup('ansible.builtin.file', playbook_dir ~ '/files/jvm_proof.sh') }}
        [ -z "$(jvm_untrusted "$CASSANDRA_PID")" ] || exit 0
        echo "heapdump_before=$(heapdump_before "$CASSANDRA_PID" | tr '\n' ' ')"
        echo "cmdline=$(base64 -w0 < "/proc/$CASSANDRA_PID/cmdline")"
        echo "java=$("/proc/$CASSANDRA_PID/exe" -XshowSettings:properties -version 2>&1 \
          | sed -n 's/^ *java.specification.version = //p' | head -1)"
        # (the unit's, as the import reads it: the JVM's own environment has the JVM_OPTS bin/cassandra exports)
        echo "unitenv=$(systemctl show cassandra -p Environment --value 2>/dev/null)"
        # and the variables bin/cassandra passes on as they are, as the JVM has them whatever set them (an
        # EnvironmentFile, /etc/default/cassandra the init script reads); the ones the Java launcher adds options from
        echo "jvmenv=$(tr '\0' '\n' < "/proc/$CASSANDRA_PID/environ" 2>/dev/null \
          | grep -E '^(JVM_EXTRA_OPTS|MX4J_ADDRESS|MX4J_PORT|CASSANDRA_HEAPDUMP_DIR|_JAVA_OPTIONS|JDK_JAVA_OPTIONS|JAVA_TOOL_OPTIONS)=' | base64 -w0)"
        exit 0
      environment:
        CASSANDRA_PID: "{{ cassandra_jvm.pid }}"
      register: cassandra_apply_config_jvm_read
      changed_when: false
      failed_when: false  # not read: no proof, a restart as for any change
      check_mode: false  # reads only
      no_log: true  # its arguments and environment can hold passwords
      when:
        - cassandra_jvm.pid is defined
        - _cassandra_preflight_running | default(true) | bool
        - _files | length > 0
        - _files | reject('in', _provable) | list | length == 0
      vars:
        _files: "{{ _cassandra_config_changes | default([]) }}"
        _provable: [cassandra-env.sh, jvm-server.options, jvm8-server.options, jvm11-server.options, jvm17-server.options,
                    logback.xml]

    # (not under --check) a mark left by a run stopped after the start
    - name: Forget a mark of a restart done
      ansible.builtin.file:
        path: /run/cassandra-apply-config.restart
        state: absent
      when:
        - "'mark=yes' in cassandra_apply_config_clock.stdout_lines | default([])"
        - _cassandra_preflight_running | default(true) | bool
        - not ansible_check_mode
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: nothing changed, no stop

    # Only the nodes whose config changes, or whose running Cassandra did not start with its config files or
    # its systemd unit (written by cassandra_config or cassandra_service, which do not restart, or by a run
    # stopped before the restart), are touched. Cassandra reads its config at start: a node whose files only
    # need another owner, group or mode is not restarted (the JMX password file is read at each login: its new
    # owner and mode, or its content, apply at once, written first once the run is confirmed; the JMX access
    # file is read at start: written back or changed, the node is restarted), nor one whose files are only
    # written back as its running Cassandra
    # started with them (deleted or edited by hand since; cassandra.yaml too, its seeds reloaded). A node where Cassandra failed (e.g. it could not read its config) is started once its config is
    # written; one stopped on purpose gets its config and stays stopped.
    - name: Note what this node needs
      ansible.builtin.set_fact:
        cassandra_apply_config_todo: "{{ _todo }}"
        # Medusa's changes, applied at the node's turn (action_apply_config.yml), no restart for them
        cassandra_apply_config_medusa: "{{ _medusa }}"
        # the repository, the packages and tools, the firewall: applied at the node's turn, no restart for them
        # ([{section, item, before, after}], the plan's view)
        cassandra_apply_config_extras: "{{ _extras }}"
        # its one restart for these too (restarted): the Java it moves to (java_plan.yml), a newer release of its
        # series (the package updated with Cassandra stopped), what its unit gives the running Cassandra
        cassandra_apply_config_java: "{{ _java }}"
        cassandra_apply_config_release: "{{ _release }}"
        cassandra_apply_config_unit_changes: "{{ _unit_changes }}"
        # the Java, the package, the unit, as the plan's view shows the settings ([{section, item, before, after}])
        cassandra_apply_config_restart_items: "{{ _restart_items }}"
        cassandra_apply_config_then: "{{ _then }}"
        cassandra_apply_config_unit_failed: "{{ _unit_failed }}"  # (the refusal below names it)
        # checked again before the write (action_apply_config.yml): that JVM still runs
        cassandra_apply_config_as_started: >-
          {{ {'files': _as_started, 'pid': cassandra_jvm.pid, 'start': cassandra_jvm.start,
              'sha1': dict(_as_started | zip(_as_started | map('extract', _cassandra_config_new) | map('hash', 'sha1')))}
             if _as_started else {} }}
        # written with no restart, proven to change nothing for the running Cassandra (_no_effect): checked again
        # before the write (that JVM still runs) and after it (the files as planned), then recorded as the ones it
        # runs with (action_apply_config.yml), so that no restart is told pending for them later
        cassandra_apply_config_proven: >-
          {{ {'files': _proven, 'pid': cassandra_jvm.pid, 'start': cassandra_jvm.start, 'why': _no_effect,
              'sha1': dict(_proven | zip(_proven | map('extract', _cassandra_config_new) | map('hash', 'sha1')))}
             if _proven and _then == 'none' else {} }}
        # the OS settings that differ (applied live, on their own: no restart for them), and those applied live
        # (not the time sync of a running Cassandra, nor what the role leaves to the restart: in its restart window)
        cassandra_apply_config_os: "{{ _os | reject('in', _no_unit) | list }}"
        cassandra_apply_config_os_live: >-
          {{ _os | reject('in', _no_unit + _disks_window) | rejectattr('timesync', 'defined') | list if _timesync | bool
             else _os | reject('in', _no_unit + _disks_window) | list }}
        cassandra_apply_config_timesync: "{{ _timesync }}"
        cassandra_apply_config_timesync_later: "{{ _timesync | bool or _no_unit | length > 0 }}"
        # the disk settings done in its restart window (cassandra_linux's disk tuning, Cassandra stopped)
        cassandra_apply_config_disks_window: "{{ _disks_window }}"
        # why it is restarted when not for its config alone (said with the restart, in the plan and the recap)
        cassandra_apply_config_why: "{{ (([_os_why] if _os_why else []) + _b_why) | join(', ') }}"
        # (said in the plan and the recap: that, else the JMX access file alone, read at start)
        cassandra_apply_config_restart_why: "{{ (([_os_why] if _os_why else []) + _b_why) | join(', ') or _restart_why }}"
        # (the plan and the --check recap) what a real run does to it, in the order it does it: its intentions,
        # never their outcome; [] for a node not restarted nor started (its usual words)
        # (the AxonOps agent set up before the config is written: cassandra-env.sh loads its Java agent)
        cassandra_apply_config_steps: "{{ _steps | community.cassandra.cassandra_apply_config_axonops_steps(_extras) }}"
        # stopped by an interrupted run in its window for its time sync: its clock let sync before the start
        cassandra_apply_config_resumed_stop: "{{ _stopped | bool and _clock.mark_timesync is defined }}"
        # left stopped by an interrupted run of its own (the mark of its restart window: a resume starts it)
        cassandra_apply_config_marked: "{{ not _running | bool and _clock.mark is defined }}"
        cassandra_apply_config_timesync_items: "{{ _os | selectattr('timesync', 'defined') | list }}"
        # said under the node's outcome, in the plan and the recap (whatever the outcome); its WARNING lines in
        # the plan's warnings only (the recap says how many)
        cassandra_apply_config_notes: >-
          {{ (['restart pending (' ~ _newer | join(', ') ~ ' changed since the running Cassandra started)']
              if _pending | bool and cassandra_config_restart_pending | bool and _newer else [])
             + (['restart pending (its cassandra.yaml has storage_compatibility_mode ' ~ _mode_ahead.file
                 ~ ', Cassandra runs ' ~ _mode_ahead.running
                 ~ (' as given with -e' if _mode_ahead.given | default(false) else '') ~ ')'] if _pending | bool and _mode_ahead else [])
             + ([_as_started | join(', ') ~ ' written back as the running Cassandra started with '
                 ~ ('it' if _as_started | length == 1 else 'them') ~ ': no restart for ' ~ ('it' if _as_started | length == 1 else 'them')]
                if _as_started and _running | bool else [])
             + ([_same_newer | default([]) | join(', ') ~ ' changed since the running Cassandra started, same settings: no restart for '
                 ~ ('it' if _same_newer | default([]) | length == 1 else 'them')]
                if _same_newer | default([]) and _running | bool else [])
             + (['stopped by an interrupted run in its restart window: started once written'] if _stopped | bool else [])
             + (['WARNING  stopped by an interrupted run in its restart window: left stopped; to start it, run again with'
                 ' -e cassandra_rolling_resume=true']
                if not _running | bool and _clock.mark is defined and not _stopped | bool
                else [])
             + (['its cassandra unit failed and nothing is to apply: not started by this run (see systemctl status cassandra'
                 ' / journalctl -u cassandra there, fix it and start it on this node alone: '
                 ~ 'start_rack' | community.cassandra.cassandra_command(
                     inventory=ansible_inventory_sources | default([]),
                     default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
                     hosts=cassandra_hosts | default(''), cwd=lookup('ansible.builtin.env', 'PWD'), limit=[inventory_hostname],
                     extra={'cassandra_target_dc': _cassandra_preflight.cassandra_dc | default(cassandra_dc),
                            'cassandra_target_rack': _cassandra_preflight.cassandra_rack | default(cassandra_rack)}) ~ ')']
                if _unit_failed | bool and not _running | bool and not _todo | bool else [])
             + (_no_unit | map(attribute='item') | reject('match', 'package ') | map('regex_replace', '$',
                ' cannot run here (the condition of its unit): left as it is') | list)
             + ((['clock ' ~ ('%.3f' | format(_ahead | float | abs)) ~ ' s '
                  ~ ('ahead of' if _ahead | float > 0 else 'behind' if _ahead | float < 0 else 'in step with')
                  ~ ' its time source (' ~ _clock.source ~ ')'] if _clock.ahead is defined
                 else ['clock offset to its time source not readable'])
                + (['WARNING  clock ahead of its time source: writes made with future timestamps can mask later writes'
                    ' until real time passes them'] if _ahead | float > 0.01 else [])
                if _timesync | bool else [])
             + (['read-ahead set live: the files Cassandra has open keep the old one until it restarts']
                if _running | bool and _then != 'restart'
                   and _os | map(attribute='item') | select('match', '(read_ahead_kb|LVM read-ahead) ') | list | length > 0
                else [])
             + (['WARNING  ' ~ _unit_secret] if _unit_secret else [])
             + (['WARNING  ' ~ ([_cql_warning[0] | regex_replace('^WARNING  ' ~ (inventory_hostname | regex_escape) ~ ': ', '')]
                                + _cql_warning[1:] | map('trim') | list) | join(_lines_nl)] if _cql_warning else [])
             + _cassandra_config_dir_notes | default([])
             + _cassandra_disk_summary.warnings | default([]) | map('regex_replace', '^', 'WARNING  data disks: ') | list
             + (['WARNING  swap left on: what it holds would not fit easily in the memory available']
                if _cassandra_linux_live | default(false) | bool and _cassandra_linux_before['swap|active'] | default(0) | int > 0
                   and not _cassandra_linux_swapoff | default(true) | bool and cassandra_linux_swap_off | default(true) | bool
                else [])
             + (['WARNING  ' ~ _keep_missing | join(', ') ~ ' kept by hand (cassandra_config_keep_files) '
                 ~ ('is' if _keep_missing | length == 1 else 'are') ~ ' missing: written back from the template, the hand'
                 ~ ' edits are lost. Restore your copy first to keep them.'] if _keep_missing else [])
             + _outside_warning
             + (['next restart: jemalloc loaded (installed now; no effect now)']
                if _running | bool and _then != 'restart'
                   and _extras | default([]) | map(attribute='item') | select('match', 'package (libjemalloc2|jemalloc)$') | list
                else [])
             + (["next restart: the cassandra unit written (it differs in systemd's handling of the service only; no effect"
                 " now)"] if _running | bool and _then != 'restart' and cassandra_service_unit_differs | default(false) | bool
                         and not _unit_changes | default([]) else [])
             + (cassandra_apply_config_version.notes | default([]) | map('regex_replace', '^', 'Cassandra ') | list
                if _release | default(false) | bool else []) }}
        # A node restarted for its config files alone (no Java, release, package, Medusa, owner or mode, JMX or
        # exporter file, header line, conf directory switch, link, missing directory; no Prometheus exporter nor
        # AxonOps agent, whose files and checks the role writes and runs at the node's turn): its files staged next
        # to the live ones on every such node at once (cassandra_config stage.yml), then put in place at its turn,
        # just before its restart (staged.yml): its turn does no compare again. The others: the role at their turn
        cassandra_apply_config_stage: >-
          {{ _todo | bool and _then == 'restart' and not _stage_other_changes | bool and not _stage_role_steps | bool
             and not _stage_paths | bool }}
        cassandra_apply_config_stage_files: "{{ _stage_files }}"
        # why a node written while it runs is not restarted, said in the plan (the outcomes' own reason otherwise)
        cassandra_apply_config_kept_running: >-
          {%- set out = [_perms_why] if _perms + _dirs else [] -%}
          {%- if 'jmxremote.password' in _jmx -%}{%- set _ = out.append('jmxremote.password: read at each JMX login') -%}{%- endif -%}
          {%- if 'jmxremote.access' in _jmx and not _rights -%}{%- set _ = out.append('jmxremote.access: local JMX checks no login') -%}{%- endif -%}
          {%- set kinds = _exporter | map(attribute='kind') | list -%}
          {%- if 'perms' in kinds and not _perms + _dirs -%}{%- set _ = out.append('an owner, group or mode: read at start') -%}{%- endif -%}
          {%- if 'config' in kinds -%}{%- set _ = out.append('the exporter rules: reloaded at its next scrape') -%}{%- endif -%}
          {%- if 'jar' in kinds -%}{%- set _ = out.append('the exporter jar: loaded at the next start') -%}{%- endif -%}
          {%- if 'removed' in kinds -%}{%- set _ = out.append('the exporter files removed: the running Cassandra keeps the ones it opened until its next restart') -%}{%- endif -%}
          {{ out + (_no_effect if _then == 'none' else [])
             + ([_header_added] if _header and _then == 'none' else [])
             + ([_users_live] if _users and _then == 'none' else [])
             + ([_medusa_live] if _medusa and _then == 'none' else [])
             + ([_extras_live] if _extras and _then == 'none' else []) }}
      vars:
        # a Cassandra outside its unit whose config needs a restart: a real run refuses it, with this way out
        _outside_warning: >-
          {{ ['WARNING  Cassandra runs (pid ' ~ cassandra_jvm.pid ~ ') outside its cassandra unit (not in its control'
              ~ ' group): a real run refuses its restart (it would start a second Cassandra). ' ~ _outside_way_out]
             if _hand_started | default(false) | bool else [] }}
        _files: "{{ _cassandra_config_changes | default([]) }}"
        # the files the role's template task writes (cassandra_config apply.yml): the ones it does not leave as they are
        _stage_files: "{{ _cassandra_config_write | default([]) | reject('in', _cassandra_config_kept | default([])) | list }}"
        # the files left as they are that get the role's header line, nothing else: a comment, no restart for it
        # (cassandra_config_header: the file with it has the same settings; recorded as the running Cassandra's)
        _header: "{{ _cassandra_config_header | default([]) | map(attribute='file') | list }}"
        _header_added: "the role's header line added: a comment, no setting changes"
        # Medusa's changes (cassandra_medusa, on a node with cassandra_medusa_enabled): applied at the node's turn, no
        # restart for them
        _medusa: "{{ _cassandra_medusa_items | default([]) if cassandra_medusa_enabled | default(false) | bool else [] }}"
        _medusa_live: "Medusa: not read by Cassandra"
        # the repository, packages and tools, firewall (compared on a node whose version stays: _cassandra_compare)
        _seen: "{{ _cassandra_change_report_seen | default({}) }}"
        _extras_repository: >-
          {{ _cassandra_repository_items | default([]) | map('combine', {'section': 'Repository'}) | list
             + _seen.get('cassandra_install', {}).get('items', []) | map('combine', {'section': 'Packages'}) | list }}
        _extras_others: >-
          {{ _seen.get('cassandra_firewall', {}).get('items', []) | map('combine', {'section': 'Firewall'}) | list
             + (_seen.get('cassandra_axonops', {}).get('items', []) | map('combine', {'section': 'AxonOps'}) | list
                if cassandra_axonops_enabled | default(false) | bool else []) }}
        _extras: >-
          {{ [] if (cassandra_apply_config_version | default({})).kind | default('') not in ['', 'release']
             else _extras_repository + _extras_others }}
        _axonops: "{{ _extras | selectattr('section', 'eq', 'AxonOps') | list }}"
        _others: "{{ _extras | rejectattr('section', 'eq', 'AxonOps') | list }}"
        # (EXTRAS_LIVE, AXONOPS_LIVE, both: EXTRAS_AXONOPS_LIVE)
        _extras_live: >-
          {{ ['the repository, packages, firewall: not read by Cassandra' if _others else '',
              'the AxonOps agent: a new Java agent package loads at the next restart of Cassandra' if _axonops else '']
             | select | join('; ') }}
        _java: "{{ cassandra_java_plan_todo | default(false) | bool and cassandra_jvm.pid is defined }}"
        _release: "{{ (cassandra_apply_config_version | default({})).kind | default('') == 'release' }}"
        # a secret in the environment the unit (or the drop-in of the package's init script) is written with: its file
        # world-readable, systemctl show prints it (cassandra_service says it too, when it writes it)
        # the storage_compatibility_mode it runs not read over CQL (storage_mode_read.yml said it, its lines): in the
        # plan's warnings, the recap and the report too
        _cql_warning: "{{ cassandra_storage_mode_cql_warning | default([]) }}"
        _lines_nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _unit_secret: >-
          {{ cassandra_service_environment | default({}) | community.cassandra.cassandra_unit_secret_warning(
               cassandra_service_start | default('unit'), cassandra_service_unit_manage | default(true)) }}
        # the release it runs (a node stopped: the one it last ran, as the ring knows it) and the package installed
        # when that is another one (updated by a run that stopped before its start)
        _release_installed: "{{ (cassandra_apply_config_version | default({})).installed | default('') }}"
        _release_before: >-
          {{ cassandra_apply_config_version.running
             ~ (', ' ~ _release_installed ~ ' installed' if _release_installed not in ['', cassandra_apply_config_version.running]
                else '') if _release | bool else '' }}
        # what the running Cassandra got from its unit against what the role's unit gives (none read: nothing)
        _unit_read: "{{ dict(cassandra_apply_config_unit_read.stdout_lines | default([]) | select('search', '=') | map('split', '=', 1)) }}"
        _unit_changes: >-
          {{ ({'user': _unit_read.user | default(''), 'group': _unit_read.group | default(''),
               'limits': _unit_read.limits | default('') | b64decode, 'environment': _unit_read.environment | default(''),
               'ceiling': _unit_read.ceiling | default('') | b64decode, 'environ': _unit_read.environ | default('') | b64decode,
               'unit_mtime': _unit_read.unitmtime | default(''), 'start': cassandra_jvm.start | default('')}
              if _unit_read.limits is defined else {})
             | community.cassandra.cassandra_apply_config_unit(
                 {'user': cassandra_service_user | default(cassandra_user | default('cassandra')),
                  'group': cassandra_service_group | default(cassandra_group | default('cassandra')),
                  'limits': {'nofile': cassandra_service_limit_nofile | default(''), 'nproc': cassandra_service_limit_nproc | default(''),
                             'memlock': cassandra_service_limit_memlock | default(''), 'as': cassandra_service_limit_as | default('')}
                            if cassandra_service_start | default('unit') == 'unit' else {},
                  'environment': cassandra_service_environment | default({})}) }}
        _restart_items: >-
          {{ ([{'section': 'Java', 'item': 'Java', 'before': cassandra_java_plan_major | default('') or 'unknown',
                'after': cassandra_java_version | string ~ ' (to install)'}] if _java | bool else [])
             + ([{'section': 'Cassandra', 'item': 'Cassandra', 'before': _release_before,
                  'after': cassandra_apply_config_version.wanted
                           ~ (' (installed)' if _release_installed == cassandra_apply_config_version.wanted else ' (package)')}]
                if _release | bool else [])
             + _unit_changes | map('combine', {'section': 'cassandra unit'}) | list }}
        # reasons of the node's one restart besides its config and OS settings (said with the restart)
        _b_why: >-
          {{ (['Java ' ~ (cassandra_java_plan_major | default('') or '?') ~ ' -> ' ~ cassandra_java_version] if _java | bool else [])
             + (['Cassandra ' ~ cassandra_apply_config_version.running ~ ' -> ' ~ cassandra_apply_config_version.wanted]
                if _release | bool else [])
             + (['its unit: ' ~ _unit_changes | map(attribute='item') | map('regex_replace', '^unit ', '') | join(', ')]
                if _unit_changes else []) }}
        _keep_missing: "{{ _cassandra_config_keep_missing | default([]) }}"
        # the JMX files written (missing, or other users or rights); the access file is read at start: written
        # back or changed, the rights the running Cassandra has are not known to be these (local JMX logs in no one)
        _jmx: "{{ _cassandra_config_jmx_changes | default([]) | map(attribute='file') | list }}"
        # cqlsh's and nodetool's files of the users' ~/.cassandra (cassandra_config): read by those tools, no restart
        _users: "{{ _cassandra_config_user_file_changes | default([]) | map(attribute='item') | list }}"
        _users_live: "the users' ~/.cassandra files: read by cqlsh and nodetool, not by Cassandra"
        _rights: >-
          {{ _jmx | select('equalto', 'jmxremote.access') | list if not cassandra_local_jmx | default(false) | bool else [] }}
        _os: "{{ _cassandra_linux_items | default([]) }}"
        # the Prometheus exporter's files written or removed (cassandra_config): its httpServer and openTelemetry parts
        # are read at start (a restart), its rules reloaded at its next scrape
        _exporter: "{{ _cassandra_config_exporter_changes | default([]) }}"
        _exporter_restart: "{{ _exporter | selectattr('restart') | list | length > 0 }}"
        # (trusted for the JVM the record was written for: the same pid, the same start)
        _record: "{{ cassandra_pending_snapshot.content | b64decode | from_json if cassandra_pending_snapshot.content is defined else {} }}"
        _jvm: "{{ _record._jvm | default({}) }}"
        _current: >-
          {{ cassandra_jvm.start is defined and _jvm.pid | default('') | string == cassandra_jvm.pid | default('-') | string
             and (_jvm.start | default(0) | float - cassandra_jvm.start | float) | abs < 2 }}
        _as_started: "{{ _cassandra_apply_config_as_started | default([]) if _current | bool else [] }}"
        # the files changed since the start, but the ones written back as they were then
        # a file changed since the start but left as it is by cassandra_config (same settings, only comments
        # or spelling): nothing for Cassandra to pick up when it runs those settings, i.e. started with the file as
        # cassandra_config renders it (the record of that start has its checksum). Else (e.g. UPGRADING written ahead
        # of a node that runs CASSANDRA_4) written since its start, not running yet: a restart
        _same: >-
          {%- set out = [] -%}
          {%- set conf = cassandra_conf_dir | default('') | trim | regex_replace('/+$', '') -%}
          {%- set new = _cassandra_config_new | default({}) -%}
          {%- for f in _cassandra_config_kept | default([]) if f in new and f not in cassandra_config_keep_files | default([])
                                                                and _current | bool -%}
          {%-   for path, sum in _record.items() if path | basename == f and path | dirname | regex_replace('/+$', '') == conf -%}
          {%-     if new[f] | hash('sha1') in [sum, (_record._same_settings | default({})).get(path)] and f not in out -%}
          {%-       set _ = out.append(f) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ out }}
        # 5.0: Cassandra runs an earlier storage_compatibility_mode than its cassandra.yaml has (read over CQL, logged
        # at its start, or given by hand, cassandra_storage_mode_running): written since its start, not running yet (also
        # with no record of that start)
        _mode_ahead: >-
          {{ {'inventory_hostname': inventory_hostname,
              'cassandra_storage_mode_read': cassandra_storage_mode_read | default({}),
              'cassandra_storage_mode_cql': cassandra_storage_mode_cql | default({}),
              'cassandra_storage_mode_running': cassandra_storage_mode_running | default('')}
             | community.cassandra.cassandra_storage_mode_ahead if cassandra_version | default('') == '50x' else {} }}
        _newer: "{{ cassandra_config_newer_files | default([]) | reject('in', _as_started) | reject('in', _same) | list }}"
        _perms: "{{ _cassandra_config_perm_changes | default([]) | map(attribute='item') | map('regex_replace', ' [(].*$', '') | map('basename') | list }}"
        _dirs: "{{ _cassandra_config_dir_changes | default([]) | map(attribute='item') | map('regex_replace', ' [(].*$', '') | list }}"
        # why an owner, group or mode change alone restarts nothing: jmxremote.password's at each JMX login
        _perms_why: >-
          {{ 'jmxremote.password (owner, group or mode): read at each JMX login'
             if _perms | unique == ['jmxremote.password'] and not _dirs else 'an owner, group or mode: read at start' }}
        _running: "{{ _cassandra_preflight_running | default(true) | bool or cassandra_jvm.pid is defined }}"
        # the files to write proven to change nothing for the running Cassandra: [the reasons] (none: a restart)
        _jvm_read: "{{ dict(cassandra_apply_config_jvm_read.stdout_lines | default([]) | select('search', '=') | map('split', '=', 1)) }}"
        _no_effect: >-
          {%- set live = {} -%}
          {%- set compared = _cassandra_config_compared | default({}) -%}
          {%- for f in _cassandra_config_new | default({}) -%}
          {%-   if f in compared and compared[f] is not none -%}{%- set _ = live.update({f: compared[f] | b64decode}) -%}
          {%-   elif f not in compared and f not in _files -%}{%- set _ = live.update({f: _cassandra_config_new[f]}) -%}
          {%-   endif -%}
          {%- endfor -%}
          {#- (the one the next start gets too: the unit stays as it is, a change of it is cassandra_service's) -#}
          {%- set env = dict(_jvm_read.unitenv | default('') | community.cassandra.cassandra_unit_environment,
                             **dict(_jvm_read.jvmenv | default('') | b64decode | split('\n') | select
                                    | map('split', '=', 1))) -%}
          {{ _files | reject('in', _as_started) | list | community.cassandra.cassandra_apply_config_no_effect(
               live, _cassandra_config_new | default({}), _jvm_read.cmdline | default('') | b64decode,
               cassandra_version | default(''), _jvm_read.java | default(''), env,
               cassandra_config_newer_files | default([]) + cassandra_config_unknown_files | default([]),
               ansible_facts | default({}), _jvm_read.heapdump_before | default('') | trim)
             if _jvm_read.cmdline | default('') and _running | bool and not _cassandra_apply_config_conf_switch | bool
             else [] }}
        _proven: "{{ _files | reject('in', _as_started) | list if _no_effect else [] }}"
        # a node not running reads its files when it starts: pending only under a resumed run, taken for the
        # node the interrupted run stopped (then started)
        _same_newer: "{{ cassandra_config_newer_files | default([]) | select('in', _same) | list }}"
        _pending: >-
          {{ (cassandra_config_restart_pending | bool and _newer | length > 0 or _mode_ahead | length > 0)
             and (_running | bool or cassandra_rolling_resume | default(false) | bool) }}
        _unit: "{{ cassandra_apply_config_unit.status | default({}) }}"
        # failed, or restarting after a failure; not a stop that ended failed (SIGTERM's 143 with no
        # SuccessExitStatus=143 in a unit kept as it was, a timeout: a stop's, or a forking unit's start)
        _unit_failed: >-
          {{ _unit.ActiveState | default('') in ['failed', 'activating']
             and _unit.Result | default('') != 'timeout' and _unit.ExecMainStatus | default('') | string != '143' }}
        _clock: "{{ dict(cassandra_apply_config_clock.stdout_lines | default([]) | select('search', '=') | map('split', '=', 1)) }}"
        # time sync to install or start (not one only to enable, nor a unit that cannot run here: it would not start),
        # on a node Cassandra runs on or is to be started: in its restart window, Cassandra stopped
        _ts_items: >-
          {{ [] if _clock.condition | default('') == 'no'
             else _os | selectattr('timesync', 'defined') | rejectattr('before', 'equalto', 'active') | list }}
        # stopped by an interrupted run in its restart window: started by the resumed run (as a restart pending)
        _stopped: >-
          {{ not _running | bool and _clock.mark is defined and cassandra_rolling_resume | default(false) | bool }}
        # not running, started by this run anyway (its config written: see _then)
        _starts: >-
          {{ not _running | bool and (_pending | bool or _stopped | bool
                                      or (_unit_failed | bool and (_files + _perms + _dirs) | length > 0)) }}
        _timesync: "{{ _ts_items | length > 0 and (_running | bool or _starts | bool) }}"
        _ahead: "{{ _clock.ahead | default(0) }}"
        # what the role leaves to the restart of a running Cassandra (its tuned profile, the LVM read-ahead): in its
        # restart window
        _disks_window: "{{ _os | selectattr('restart', 'defined') | list if _running | bool else [] }}"
        _os_why: >-
          {{ ((['time sync'] if _timesync | bool else []) + _disks_window | map(attribute='restart') | unique | list) | join(', ') }}
        # a time sync unit that cannot run here (its condition): left out, said
        _no_unit: "{{ _os | selectattr('timesync', 'defined') | list if _clock.condition | default('') == 'no' else [] }}"
        _todo: >-
          {{ _files | length > 0 or (_perms + _dirs + _jmx + _users + _exporter + _header + _medusa + _extras) | length > 0 or _pending | bool
             or _java | bool or _release | bool or _unit_changes | length > 0
             or _timesync | bool
             or _stopped | bool or _disks_window | length > 0 }}
        # Cassandra running: restart (new settings or a restart pending), none (an owner or mode alone: read at
        # start); not running: start (_starts: its unit failed and its config is written, e.g. it was unreadable;
        # or the node a resumed run stopped), write (stopped on purpose, or failed with nothing to write: left as it is)
        _then: >-
          {{ ('restart' if _files | reject('in', _as_started + _proven) | list | length > 0 or _rights | length > 0 or _pending | bool
                            or _b_why | length > 0
                            or _timesync | bool or _disks_window | length > 0 or _exporter_restart | bool
              else 'none') if _running | bool
             else 'start' if _starts | bool else 'write' }}
        # a JVM outside its unit's control group (started by hand, or by a script of its own), to restart
        _hand_started: >-
          {{ cassandra_apply_config_jvm_outside.stdout | default('') | length > 0 and _then == 'restart' }}
        # a restart for a file read at start alone (no setting of the config changes)
        _restart_why: >-
          {{ 'jmxremote.access: read at start'
             if _running | bool and _rights | length > 0 and _files | reject('in', _as_started + _proven) | list | length == 0
                and not _pending | bool
             else 'the exporter HTTPS, authentication or openTelemetry: read at start'
             if _running | bool and _exporter_restart | bool and _files | reject('in', _as_started + _proven) | list | length == 0
                and not _pending | bool else '' }}
        # what a real run does, in its order (action_apply_config.yml, action_restart.yml, os_window.yml, the
        # cassandra_linux tasks it runs there): the config written; drained (as action_restart.yml decides) and
        # stopped; the disk settings left to the window (disks.yml); the time sync installed, started, its chrony
        # servers set (timesync.yml), the clock waited for (2 minutes at most: Cassandra starts all the same); started
        _steps: >-
          {%- set ts = _ts_items | map(attribute='item') | list -%}
          {%- set window = (_timesync | bool or _disks_window | length > 0 or _release | bool) -%}
          {%- set drain = cassandra_operation_drain | default(true) | bool or not cassandra_service_unit_manage | default(true) | bool
                          or cassandra_service_start | default('unit') != 'unit' -%}
          {%- set reason = '' if _os_why else (_b_why | join(', ') or _restart_why) -%}
          {%- set os = [] -%}
          {%- for d in _disks_window -%}
          {%-   set _ = os.append('switch the tuned profile' if d.item == 'tuned profiles'
                                  else 'reload the tuned profile' if d.item is match('tuned profile ')
                                  else 'set the LVM read-ahead (lvchange)') -%}
          {%- endfor -%}
          {%- if _release | bool -%}
          {%-   set v = cassandra_apply_config_version -%}
          {%-   set _ = os.append(('Cassandra ' ~ v.wanted ~ ' installed already' if v.installed | default('') == v.wanted
                                   else 'update Cassandra to ' ~ v.wanted) ~ ', write its config again') -%}
          {%- endif -%}
          {%- if _timesync | bool -%}
          {%-   for i in ts if i is match('package ') -%}{%- set _ = os.append('install ' ~ i[8:]) -%}{%- endfor -%}
          {%-   for i in ts if i is not match('package ') and i != 'chrony server line' -%}
          {%-     set _ = os.append('start ' ~ i) -%}
          {%-   endfor -%}
          {%-   if 'chrony server line' in ts -%}{%- set _ = os.append("set chrony's servers, restart chrony") -%}{%- endif -%}
          {%- endif -%}
          {%- if _timesync | bool or (_then == 'start' and _stopped | bool and _clock.mark_timesync is defined) -%}
          {%-   set _ = os.append('wait up to 2m for clock sync') -%}
          {%- endif -%}
          {#- (a release: the repository and packages too, its package kept at the release installed; the repository
              first, the release looked for in it before any other change) -#}
          {%- set repo_first = _release | bool and 'Repository' in _extras | map(attribute='section') -%}
          {%- set write = (['apply the repository, look for Cassandra ' ~ cassandra_apply_config_version.wanted ~ ' in it']
                           if repo_first else [])
                          + (['install Java ' ~ cassandra_java_version] if _java | bool else [])
                          + (['write the config'] if (_files + _perms + _dirs + _jmx + _users + _exporter + _header) | length > 0 else [])
                          + (['set up Medusa'] if _medusa else [])
                          + (['apply the packages, firewall'] if repo_first and _extras | rejectattr('section', 'equalto', 'Repository') | list
                             else [] if repo_first else ['apply the repository, packages, firewall'] if _extras else []) -%}
          {%- if _then == 'restart' and window -%}
          {{ write + [('drain and stop' if drain else 'stop') ~ ' Cassandra'] + os | unique | list + ['start Cassandra'] }}
          {%- elif _then == 'restart' -%}
          {{ write + [('drain and restart' if drain else 'restart') ~ ' Cassandra' ~ (' (' ~ reason ~ ')' if reason else '')] }}
          {%- elif _then == 'start' -%}
          {{ write + os | unique | list + ['start Cassandra'] }}
          {%- else -%}
          {{ [] }}
          {%- endif -%}
        # (not staged) other changes than the config files' content, or a JVM started by hand
        _stage_other_changes: >-
          {{ _java | bool or _release | bool or _hand_started | bool
             or (_perms + _dirs + _jmx + _users + _exporter + _header + _medusa + _extras) | length > 0 }}
        # (not staged) what the role does at the node's turn besides its files: the exporter's and the AxonOps
        # agent's steps, the switch of the conf directory
        _stage_role_steps: >-
          {{ cassandra_prometheus_exporter_enabled | default(false) | bool or cassandra_axonops_enabled | default(false) | bool
             or _cassandra_apply_config_conf_switch | default(false) | bool }}
        # (not staged) a file to write that is a link, a directory missing
        _stage_paths: >-
          {{ _stage_files | select('in', _cassandra_config_links | default([])) | list | length > 0
             or (cassandra_config_dirs | default({})).results | default([]) | rejectattr('stat.exists') | list | length > 0 }}

    # What the run's later steps read of every node, read once here (on ansible-core 2.16 each read of a node's
    # variables builds all of them, its facts included: read for every node from every node, the cost grew with
    # the square of the nodes): its plan, its address and rack, under the variable names the filters read. Names,
    # addresses and words of the plan only (a fact is templated again at each read on 2.16)
    - name: Note what the run needs of every node
      ansible.builtin.set_fact:
        _cassandra_apply_config_view: "{{ ansible_play_hosts | community.cassandra.cassandra_apply_config_view(hostvars) }}"
        # the inventory names of the ring's addresses, for the health checks (cluster_health_read.yml)
        _cassandra_run_addresses: >-
          {{ query('community.cassandra.cassandra_nodes') | community.cassandra.cassandra_host_addresses(hostvars) }}
      run_once: true

    # the other nodes each one lets be down in its health checks (the plays that write the config below)
    - name: Note the other nodes each node may find down
      ansible.builtin.set_fact:
        _cassandra_apply_config_down_ok_all: >-
          {{ _cassandra_apply_config_view | community.cassandra.cassandra_apply_config_down_ok_all(
               query('community.cassandra.cassandra_nodes'), ansible_check_mode) }}
      run_once: true

    # A Cassandra outside its unit's control group (a JVM started by hand or by a script of its own): the restart
    # through the unit would start a second one next to it. A real run refuses before any change; --check goes on to
    # show everything (the node's WARNING says it)
    - name: Refuse to restart a Cassandra its unit did not start
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }}: Cassandra runs (pid {{ cassandra_jvm.pid }}) outside its cassandra unit (not in
          its control group). The restart this run plans ({{ _why }}) would start a second Cassandra next to it.
          Nothing was changed. {{ _outside_way_out }}
      vars:
        _why: "{{ cassandra_apply_config_restart_why | default('') or 'its config' }}"
      when:
        - cassandra_apply_config_then == 'restart'
        - cassandra_apply_config_jvm_outside.stdout | default('') | length > 0
        - not ansible_check_mode
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: nothing changed, no stop

    # A Cassandra package left half done (two rpm packages, a dpkg run interrupted): a node this run restarts or starts
    # (a node left stopped by an interrupted run too: its resume starts it; a node down while another one restarts:
    # the way out below would start it with start_rack) would start Cassandra on those files (two
    # releases' jars, or the new release's with no plan). Refused before any change, --check too, with the way out of
    # that state
    - name: Refuse to restart or start a node whose Cassandra package is left half done
      ansible.builtin.fail:
        msg: >-
          {{ ('apply_config  ' ~ _cluster) | community.cassandra.cassandra_refused(_refusal) | join(_nl) }}
      run_once: true
      when:
        - _refusal | length > 0
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: nothing changed, no stop
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"
        _refusal: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts if hostvars[h].cassandra_apply_config_unfinished | default('') -%}
          {%-   set v = hostvars[h] -%}
          {%-   if v.cassandra_apply_config_then | default('') in ['restart', 'start']
                   or v.cassandra_apply_config_marked | default(false) | bool
                   or (v.cassandra_apply_config_then | default('') == 'write' and _restarts | bool) -%}
          {%-     set _ = out.append({'name': h, 'unfinished': v.cassandra_apply_config_unfinished,
                                      'what': 'restart' if v.cassandra_apply_config_then == 'restart' else 'start'}) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out | community.cassandra.cassandra_package_unfinished_refusal }}
        # (a restart refuses the nodes down, whose way out would then be to start them with start_rack: on that package
        # too, a node stopped with nothing to apply among them)
        _restarts: >-
          {{ _cassandra_apply_config_view.values() | selectattr('cassandra_apply_config_then', 'equalto', 'restart') | list
             | length > 0 }}

    # 5.0: a node not running that this run starts (its unit failed, or an interrupted run stopped it): the mode it
    # last ran against the one it starts with (back, two steps on, into NONE unread), before the plan (the compare
    # checked them as nodes, before it was known which ones are started)
    - name: Refuse a start into another storage_compatibility_mode than one step from the one it last ran
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: storage_mode_guard.yml
      vars:
        _cassandra_storage_mode_written: true  # the inventory's mode, written then started with
        _cassandra_storage_mode_read_done: true  # read by the compare
        _cassandra_storage_mode_starts: "{{ _starting }}"
        _starting: >-
          {{ ansible_play_hosts | select('in', _cassandra_apply_config_view)
             | select('in', _cassandra_apply_config_view | dict2items | selectattr('value.cassandra_apply_config_then', 'equalto', 'start')
                            | map(attribute='key') | list) | list }}
      when:
        - cassandra_version | default('') == '50x'
        - _starting | length > 0
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: nothing changed, no stop

    # The Prometheus exporter's port free on a node to restart or start, before anything is written (the agent
    # would make the JVM exit; its jar and config are put in place by the write, checked again before the restart)
    - name: Check the Prometheus exporter's port is free
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: exporter_check.yml
      vars:
        _cassandra_exporter_check_option: "{{ _cassandra_config_jvm_agent | default('') }}"
        _cassandra_exporter_check_kinds: [port]
        _cassandra_exporter_check_left: nothing was changed
      when:
        - cassandra_apply_config_todo | bool
        - cassandra_apply_config_then in ['restart', 'start']
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: nothing changed, no stop

    # a restart waits for every other node up (cluster health): a node not running that this run leaves
    # down, or starts after the restart (nodes go in inventory order), would stop it halfway. A real run refuses
    # here; --check (nothing restarted) goes on to show everything, the refusal said in its recap
    - name: Note whether restarts are refused while a node is not running
      ansible.builtin.set_fact:
        # [why, then the way out: a fact per line, a command on a line of its own (to paste)]
        _cassandra_apply_config_refused: >-
          {{ [] if not _down else
             [_down | join(', ') ~ ': Cassandra not running, and ' ~ _restart | join(', ') ~ ' would be restarted, which needs'
              ~ ' every other node up.']
             + ([_early | join(', ') ~ ': left stopped by an interrupted apply_config (in its restart window): see'
                 ~ ' systemctl status cassandra / journalctl -u cassandra there, fix what stopped its start, then resume'
                 ~ ' (the same command plus -e cassandra_rolling_resume=true), which starts '
                 ~ ('them' if _early | length > 1 else 'it') ~ ' first.']
                if _early else [])
             + ([_late | join(', ') ~ ': left stopped by an interrupted apply_config (in its restart window), reached'
                 ~ ' by a resume only after ' ~ _restart[0] ~ ' (inventory order), whose restart needs every'
                 ~ ' other node up: see systemctl status cassandra / journalctl -u cassandra there, fix what stopped its'
                 ~ ' start, then resume on ' ~ ('them' if _late | length > 1 else 'it') ~ ' alone first (the same'
                 ~ ' command plus ' ~ ('' if cassandra_rolling_resume | default(false) | bool
                                      else '-e cassandra_rolling_resume=true ')
                 ~ '--limit ' ~ _late | join(',') ~ '), then resume again without --limit.']
                if _late else [])
             + (['stopped on purpose: apply the config there first (--limit ' ~ _limit | join(',') ~ '), then start '
                 ~ _them ~ ' with start_rack, which checks the start first:']
                + _start_rack.limit | map('regex_replace', '^', '    ') | list if _limit else [])
             + ([_failed | join(', ') ~ ': the cassandra unit failed and nothing is to apply: see systemctl status cassandra'
                 ~ ' / journalctl -u cassandra there, fix it, then start it with start_rack, which checks the start first:']
                + _start_rack.failed | map('regex_replace', '^', '    ') | list if _failed else [])
             + (['a restart for the tuned profile or the LVM read-ahead can be left for later:',
                 '    -e cassandra_linux_tuned_switch_restart=false -e cassandra_data_lvchange_restart=false']
                if _restart | map('extract', _view) | selectattr('disks_window') | list else [])
             + (['then run again.'] if _limit or _failed else []) }}
      run_once: true
      vars:
        _view: "{{ _cassandra_apply_config_view }}"  # (every node's plan, read once)
        _restart: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts -%}
          {%-   set v = _view[h] -%}
          {%-   if v.cassandra_apply_config_todo | bool and v.cassandra_apply_config_then == 'restart' -%}
          {%-     set _ = out.append(h) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}
        _down: >-
          {%- set out = [] -%}
          {%- if _restart -%}
          {%-   set first = ansible_play_hosts.index(_restart[0]) -%}
          {%-   for h in ansible_play_hosts -%}
          {%-     set v = _view[h] -%}
          {%-     if v.cassandra_apply_config_then == 'write'
                     or (v.cassandra_apply_config_then == 'start'
                         and (not v.cassandra_apply_config_todo | bool or ansible_play_hosts.index(h) > first)) -%}
          {%-       set _ = out.append(h) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%- endif -%}
          {{ out }}
        # the nodes an interrupted run of apply_config left stopped (its mark): a resume starts them; this run that
        # resume, still down here (after a restart in the inventory's order): the resume on them alone first
        _marked: >-
          {%- set out = [] -%}
          {%- for h in _down if _view[h].cassandra_apply_config_marked -%}
          {%-   set _ = out.append(h) -%}
          {%- endfor -%}
          {{ out }}
        # (a resume starts them in the inventory's order: those after the first node to restart are reached only after
        # its restart, refused while they are down: a resume on them alone first)
        _late: >-
          {{ _marked | select('in', ansible_play_hosts[ansible_play_hosts.index(_restart[0]) + 1:]) | list
             if _restart else [] }}
        _early: "{{ _marked | reject('in', _late) | list }}"
        # the nodes down whose unit failed with nothing to write: this run does not start them
        _failed: >-
          {%- set out = [] -%}
          {%- for h in _down if _view[h].cassandra_apply_config_unit_failed and h not in _marked -%}
          {%-   set _ = out.append(h) -%}
          {%- endfor -%}
          {{ out }}
        # the other nodes down: their config applied with --limit, then started
        _limit: "{{ _down | reject('in', _failed + _marked) | list }}"
        _them: "{{ 'them' if _limit | length > 1 else 'it' }}"
        # start_rack on these nodes alone, a command per rack (without --limit, it starts every stopped node of the
        # rack, one stopped on purpose too)
        _start_rack: >-
          {%- set out = {} -%}
          {%- for kind, nodes in [['limit', _limit], ['failed', _failed]] -%}
          {%-   set racks = {} -%}
          {%-   for h in nodes -%}
          {%-     set p = _view[h]._cassandra_preflight -%}
          {%-     set key = (p.cassandra_dc, p.cassandra_rack) -%}
          {%-     set _ = racks.update({key: racks.get(key, []) + [h]}) -%}
          {%-   endfor -%}
          {%-   set _ = out.update({kind: []}) -%}
          {%-   for key in racks -%}
          {%-     set _ = out[kind].append('start_rack' | community.cassandra.cassandra_command(
                          inventory=ansible_inventory_sources | default([]),
                          default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
                          hosts=cassandra_hosts | default(''), cwd=lookup('ansible.builtin.env', 'PWD'), limit=racks[key],
                          extra={'cassandra_target_dc': key[0], 'cassandra_target_rack': key[1]})) -%}
          {%-   endfor -%}
          {%- endfor -%}
          {{ out }}

    - name: Refuse restarts while a node is not running
      ansible.builtin.fail:
        msg: >-
          {{ ('apply_config  ' ~ _cluster) | community.cassandra.cassandra_refused(_cassandra_apply_config_refused)
             | join(_nl) }}
      run_once: true
      when:
        - _cassandra_apply_config_refused | length > 0
        - not ansible_check_mode
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: nothing changed, no stop
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"

    # every node's value of the settings that differ somewhere: the live files that differ on a node (listed
    # once for all), read on each one in one go (only shown masked; one not on this node or not readable: no
    # value of its own shown)
    - name: List the files that differ on a node
      ansible.builtin.set_fact:
        _cassandra_apply_config_differ: >-
          {{ ansible_play_hosts | map('extract', hostvars) | map(attribute='_cassandra_config_items', default=[]) | flatten
             | selectattr('diff', 'defined') | map(attribute='item') | map('basename') | unique | list }}
      run_once: true

    - name: Read the live files that differ on a node
      ansible.builtin.command:
        argv: >-
          {{ [_cassandra_config_python, '-c', _read] + [cassandra_conf_dir] | product(_cassandra_apply_config_differ) | map('join', '/')
             | list }}
      register: cassandra_apply_config_read
      changed_when: false
      check_mode: false  # reads only
      no_log: true  # passwords
      when: _cassandra_apply_config_differ | length > 0
      vars:
        _read: |
          import base64, json, os, sys
          out = []
          for path in sys.argv[1:]:
              try:
                  with open(path, "rb") as f:
                      out.append([os.path.basename(path), base64.b64encode(f.read()).decode("ascii")])
              except (IOError, OSError):
                  out.append([os.path.basename(path), None])
          sys.stdout.write(json.dumps(out))

    # as a slurp per file registers them
    - name: Note the live files that differ on a node
      ansible.builtin.set_fact:
        cassandra_apply_config_live:
          results: >-
            {%- set out = [] -%}
            {%- for f, content in (cassandra_apply_config_read.stdout | from_json if cassandra_apply_config_read.stdout is defined else []) -%}
            {%-   set _ = out.append({'cassandra_apply_config_file': f} | combine({'content': content} if content is not none else {})) -%}
            {%- endfor -%}
            {{ out }}
      no_log: true  # passwords

    # The settings that differ are shown first, each with the inventory's value and the nodes already on it,
    # then the value of each node to change, and what each node gets (--check: the settings in the recap at
    # the end); the whole run is confirmed once.
    # setting-centric, the nodes grouped: in the plan of a real run (before its question), in the recap under --check
    - name: Put the settings that differ side by side
      ansible.builtin.set_fact:
        # laid out at the terminal's width less the plan's indent (2); with -v, a device-mapper device's dm-N too
        # what changes, the nodes with the same changes together (cassandra_apply_config_changes): its title first;
        # with --diff the files' diffs under them, else the .diff file named
        cassandra_apply_config_diff: >-
          {{ _nodes | community.cassandra.cassandra_apply_config_changes(check=ansible_check_mode, width='terminal',
               margin=2, show_diff=ansible_diff_mode | bool, diff_file=_diff_path, cwd=lookup('ansible.builtin.env', 'PWD')) }}
        # the same naming no .diff file: the view when it could not be written (below)
        _cassandra_apply_config_diff_unnamed: >-
          {{ _nodes | community.cassandra.cassandra_apply_config_changes(check=ansible_check_mode, width='terminal',
               margin=2, show_diff=ansible_diff_mode | bool) }}
        # every file's diff, once per group of nodes with the same one: written next to the run's report (below)
        cassandra_apply_config_diff_path: "{{ _diff_path }}"
        cassandra_apply_config_diff_text: >-
          {{ _nodes | community.cassandra.cassandra_apply_config_diff_text(_cluster, ansible_check_mode,
               cassandra_operation_confirm | default(true) | bool) }}
        # 5.0: the nodes the run moves to storage_compatibility_mode NONE (the plan says it is the point of no return):
        # their cassandra.yaml written with it, or at NONE already while Cassandra runs an earlier mode (restarted);
        # not one that runs NONE already (read over CQL or logged at its start: its file written back)
        cassandra_apply_config_no_return: >-
          {{ (_nodes | community.cassandra.cassandra_apply_config_no_return
              + ansible_play_hosts | select('in', _moved) | list
                | community.cassandra.cassandra_storage_mode_restarts_into_none(hostvars)) | unique
             | reject('in', ansible_play_hosts | community.cassandra.cassandra_storage_mode_running_none(hostvars)) | list }}
      run_once: true
      no_log: true  # (masked, but the diffs are the files' lines)
      vars:
        _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"
        _diff_path: >-
          {{ (ansible_inventory_sources | default([])
              | community.cassandra.cassandra_reports_dir(lookup('community.cassandra.cassandra_hosts'),
                                                         cassandra_run_report_dir | default(''),
                                                         lookup('ansible.builtin.env', 'PWD')))
             ~ '/' ~ _diff_name }}
        _diff_name: >-
          {{ 'apply_config' | community.cassandra.cassandra_run_report_name(ansible_check_mode, _cassandra_apply_config_start)
             | regex_replace('[.]txt$', '.diff') }}
        # restarted or started by the run (a node left stopped is not moved)
        _moved: >-
          {{ ansible_play_hosts | select('in', _cassandra_apply_config_view)
             | select('in', _cassandra_apply_config_view | dict2items
                            | selectattr('value.cassandra_apply_config_then', 'in', ['restart', 'start']) | map(attribute='key') | list)
             | list }}
        _nodes: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts -%}
          {%-   set v = hostvars[h] -%}
          {%-   set _ = out.append({'name': h, 'items': v._cassandra_config_items | default([]),
                                    'live': v.cassandra_apply_config_live.results | default([]),
                                    'stats': v.cassandra_config_live_stat.results | default([]),
                                    'dir_stats': v.cassandra_config_dir_stat.results | default([]),
                                    'os': v.cassandra_apply_config_os | default([]),
                                    'medusa': v.cassandra_apply_config_medusa | default([]),
                                    'extra': v.cassandra_apply_config_restart_items | default([])
                                             + v.cassandra_apply_config_extras | default([])}) -%}
          {%- endfor -%}
          {{ out }}

    # the files' diffs the plan names (on the controller, read by its user only), before its question: under --check
    # what a real run would write, in a real run what it writes once the answer is yes (the report's NODES say what
    # was applied)
    - name: Write the files' diffs next to the report of the run
      delegate_to: localhost
      run_once: true
      become: false
      check_mode: false  # (a file on the controller, under --check too)
      diff: false
      when:
        - cassandra_apply_config_diff_text | default('') | length > 0
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: drift reports
      vars:
        ansible_become: false
      # (a failure ignored, not rescued: a run_once task's failure fails every node of the play on ansible-core
      # 2.21, and failed_when: false hides its error there; a write that did not happen said, the run goes on)
      block:
        # (the first run of an inventory: no report written yet, its dir not there)
        - name: Make the dir of the reports
          ansible.builtin.file:
            path: "{{ cassandra_apply_config_diff_path | dirname }}"
            state: directory
            mode: "0755"
          register: _cassandra_apply_config_diff_dir
          ignore_errors: true

        - name: Write the diffs
          ansible.builtin.copy:
            content: "{{ cassandra_apply_config_diff_text }}\n"
            dest: "{{ cassandra_apply_config_diff_path }}"
            mode: "0600"
          register: _cassandra_apply_config_diff_written
          ignore_errors: true
          no_log: true  # (masked, but the files' lines)
          when: _cassandra_apply_config_diff_dir is not failed

        - name: Say the diffs were not written
          ansible.builtin.debug:
            msg: >-
              {{ _error | community.cassandra.cassandra_apply_config_diff_warning(cassandra_apply_config_diff_path) }}
          when: _cassandra_apply_config_diff_dir is failed or _cassandra_apply_config_diff_written is failed
          vars:
            cassandra_output: true
            # (the error observed: the dir's, else the file's)
            _error: >-
              {{ (_cassandra_apply_config_diff_dir if _cassandra_apply_config_diff_dir is failed
                  else _cassandra_apply_config_diff_written).msg | default('') }}

        # (the view named a file that is not there: the one naming none instead)
        - name: Name no diffs file in the view
          ansible.builtin.set_fact:
            cassandra_apply_config_diff: "{{ _cassandra_apply_config_diff_unnamed }}"
          when: _cassandra_apply_config_diff_dir is failed or _cassandra_apply_config_diff_written is failed

    - name: Group the nodes to do
      ansible.builtin.group_by:
        key: "cassandra_apply_config_{{ cassandra_apply_config_todo | bool }}"
      changed_when: false
      when: not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: no node to do

    - name: Group the nodes whose OS settings differ
      ansible.builtin.group_by:
        key: "cassandra_apply_config_os_{{ cassandra_apply_config_os_live | length > 0 }}"
      changed_when: false
      when: not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: no node to do

    # the ones no restart or start takes down, and every one under --check (nothing is restarted): done at once; but
    # a firewall change (a wrong port cuts the node off): one node at a time, the cluster checked around each
    - name: Group the nodes to do at once
      ansible.builtin.group_by:
        key: "cassandra_apply_config_batch_{{ cassandra_apply_config_todo | bool and (ansible_check_mode or _at_once | bool) }}"
      vars:
        _then: "{{ cassandra_apply_config_then }}"
        _firewall: "{{ cassandra_apply_config_extras | default([]) | selectattr('section', 'equalto', 'Firewall') | list | length > 0 }}"
        _at_once: "{{ _then in ['none', 'write'] and not _firewall | bool }}"
      changed_when: false
      when: not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: no node to do

    - name: Group the nodes whose config is staged
      ansible.builtin.group_by:
        key: "cassandra_apply_config_stage_{{ cassandra_apply_config_stage | bool and not ansible_check_mode }}"
      changed_when: false
      when: not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: no node to do

    - name: Nothing to do on this node
      ansible.builtin.set_fact:
        cassandra_op_result: "{{ 'not done (the run stopped before it)' if cassandra_apply_config_os_live | length > 0 else 'nothing to apply' }}"
      when: not cassandra_apply_config_todo | bool

    # the nodes whose warnings the plan shows: the recap points at them (said again only for the others)
    # (--check shows no plan: the recap is the plan, said once)
    - name: Note the nodes of the plan
      ansible.builtin.set_fact:
        _cassandra_apply_config_planned: "{{ ansible_play_hosts }}"
      run_once: true
      when:
        - _todo | length > 0
        - not ansible_check_mode

    # no plan to show (nothing to do, or --check: its recap is the plan): the checks' notes (a typo in a variable, the
    # JVM options...) are still said
    - name: Say the checks' notes
      ansible.builtin.debug:
        msg: "{{ _notes | community.cassandra.cassandra_notes_lines | join(_nl) }}"
      run_once: true
      when:
        - _todo | length == 0 or ansible_check_mode
        - _notes | length > 0
      vars:
        cassandra_output: true  # operator messages (ops callback)
        cassandra_output_gap: true  # a block of their own
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _notes: "{{ hostvars[ansible_play_hosts_all | first]._cassandra_notes | default([]) }}"

    # the run's report (run_report.yml): the plan shown next, kept for the end of the run, or its stop (a real run;
    # --check: its recap holds it); its warnings in full there
    - name: Keep the plan for the report of the run
      ansible.builtin.set_fact:
        _cassandra_run_report_operation: apply_config
        _cassandra_run_report_started: "{{ _cassandra_apply_config_start }}"
        _cassandra_run_report_plan: >-
          {{ [] if ansible_check_mode or _todo | length == 0 else
             [{'title': _diff[0], 'lines': _diff[1:]},
              {'title': 'WHAT HAPPENS', 'lines': _nodes | community.cassandra.cassandra_apply_config_happens},
              {'title': 'CHECKS', 'lines': hostvars[ansible_play_hosts_all | first]._cassandra_notes | default([]),
               'mask': true}] }}
      delegate_to: localhost
      delegate_facts: true
      run_once: true
      become: false
      when: not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: drift reports
      vars:
        ansible_become: false
        _nodes: "{{ ansible_play_hosts | community.cassandra.cassandra_apply_config_nodes(hostvars) }}"
        _diff: "{{ cassandra_apply_config_diff | default([]) or ['WILL CHANGE'] }}"  # (WILL CHANGE: its title first)

    # a real run: the plan, then its question; --check: none, the recap at the end is the plan, said once
    - name: Show the plan and confirm the run
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: screen.yml
      when:
        - _todo | length > 0
        - not ansible_check_mode
      vars:
        _nodes: "{{ ansible_play_hosts | community.cassandra.cassandra_apply_config_nodes(hostvars) }}"
        _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default((_cassandra_preflight | default({})).cassandra_cluster_name | default('')) }}"
        # the ring's nodes the inventory does not have: left as they are (topology shows them)
        _ring_unknown: "{{ _cassandra_apply_config_ring | default({}) | community.cassandra.cassandra_apply_config_ring_unknown }}"
        _up_to_date: "{{ ansible_play_hosts | reject('in', _todo) | list }}"
        # the question and the head name the most disruptive effect: a Cassandra restart (the OS settings done with
        # Cassandra stopped are done in that restart), else a start of a Cassandra not running, else no restart
        _restarts: "{{ _todo | select('in', _then_nodes['restart'] | default([])) | list }}"
        _starts: "{{ _todo | select('in', _then_nodes['start'] | default([])) | list }}"
        _then_nodes: >-
          {%- set out = {} -%}
          {%- for h in _todo -%}
          {%-   set _ = out.setdefault(_cassandra_apply_config_view[h].cassandra_apply_config_then, []).append(h) -%}
          {%- endfor -%}
          {{ out }}
        # the most disruptive effect, on which nodes ("Apply changes and restart Cassandra on node1?"; the cluster
        # is the head's): 61 columns at most, " Answer yes or no:" after it fitting 79; too long, the counts (the
        # plan's rows above name the nodes), the starts left out last
        cassandra_screen_question: >-
          {%- set n = _todo | length -%}
          {%- set count = n ~ (' node' if n == 1 else ' nodes') -%}
          {%- set ask = [] -%}
          {%- set every = 'all ' ~ n ~ ' nodes' if n > 5 and n == ansible_play_hosts | length else '' -%}
          {%- for nodes, r, s in [(every or _todo | community.cassandra.cassandra_node_list, _restarts | community.cassandra.cassandra_node_list,
                                   _starts | community.cassandra.cassandra_node_list),
                                  (count, _restarts | length, _starts | length), (count, _restarts | length, '')] -%}
          {%-   if _restarts | length == n -%}{%- set q = 'Apply changes and restart Cassandra on ' ~ nodes ~ '?' -%}
          {%-   elif _starts | length == n -%}{%- set q = 'Apply changes and start Cassandra on ' ~ nodes ~ '?' -%}
          {%-   else -%}
          {%-     set q = 'Apply changes on ' ~ nodes ~ (', restart Cassandra on ' ~ r if _restarts else '')
                          ~ ((', start it on ' if _restarts else ', start Cassandra on ') ~ s if _starts and s != '' else '')
                          ~ (', no Cassandra restart' if not _restarts and not _starts else '') ~ '?' -%}
          {%-   endif -%}
          {%-   set _ = ask.append(q) -%}
          {%- endfor -%}
          {%- set fit = [] -%}
          {%- for q in ask if q | length <= 61 -%}{%- set _ = fit.append(q) -%}{%- endfor -%}
          {{ (fit + ask[-1:]) | first }}
        cassandra_screen:
          operation: apply_config
          build: true  # (the collection's version and commit under the title)
          # (the effects first, the most disruptive first, then the nodes up to date: "prod  Cassandra restarts on
          # 1 node, 2 up to date"; the table below says what each node gets)
          summary: >-
            {%- set live = _todo | reject('in', _restarts + _starts) | list -%}
            {%- set said = (['Cassandra restarts on ' ~ _restarts | length ~ (' node' if _restarts | length == 1 else ' nodes')]
                            if _restarts else [])
                           + ([('starts on ' if _restarts else 'Cassandra starts on ') ~ _starts | length
                               ~ ('' if _restarts else (' node' if _starts | length == 1 else ' nodes'))] if _starts else [])
                           + ([live | length ~ (' with no restart' if _restarts or _starts
                                                else (' node' if live | length == 1 else ' nodes') ~ ' with no Cassandra restart')]
                              if live else [])
                           + ([_up_to_date | length ~ ' up to date'] if _up_to_date else []) -%}
            {{ _cluster }}  {{ said | join(', ') }}
          # a real run: the settings that differ before its question (--check: in the recap, no question)
          sections:
            # (as --check's recap: what changes, then how the run goes, the order in it)
            - "{{ [] if ansible_check_mode or not cassandra_apply_config_diff | default([])
                  else [{'title': cassandra_apply_config_diff[0], 'pre': cassandra_apply_config_diff[1:]}] }}"
            - - title: WHAT HAPPENS
                pre: "{{ _nodes | community.cassandra.cassandra_apply_config_happens(width='terminal', margin=2) }}"
          # the nodes' warnings, each one once (a real run: --check, which shows no plan, says the refusal in its recap)
          warnings: >-
            {{ _nodes | community.cassandra.cassandra_apply_config_warnings
               + [{'label': cassandra_apply_config_no_return | default([]) | community.cassandra.cassandra_node_list,
                   'text': ('storage_compatibility_mode moves to NONE: the point of no return. Once a node runs with it,'
                            ~ ' it cannot go back to UPGRADING or CASSANDRA_4, nor to its former Cassandra version.')
                           if cassandra_apply_config_no_return | default([]) else ''},
                  {'label': 'the ring', 'text': _ring_unknown | default('')}] }}

    # first, once the run is confirmed: read at each JMX login (no restart), the checks before a node's turn
    # log in with it; a node it fails on stops the run, as a write at its turn would

    - name: Write the JMX password file where it is missing or other
      any_errors_fatal: true
      when:
        - not ansible_check_mode
        - not _cassandra_apply_config_compare_only | default(false) | bool  # drift's compare: nothing changed, no stop
        - _password | length > 0
      vars:
        _password: "{{ _cassandra_config_jmx_changes | default([]) | selectattr('file', 'equalto', 'jmxremote.password') | list }}"
      block:
        - name: Write the JMX password file where it is missing or other
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_config
            tasks_from: jmx_password.yml

        # (reported with the node's other changes, at its turn: by then the same)
        - name: Note it for the report of the node's turn
          ansible.builtin.set_fact:
            _cassandra_config_jmx_written: >-
              {{ [{'item': _password[0].path, 'before': 'absent' if _password[0].missing else 'other users or rights',
                   'after': 'written whole', 'whole': true}] }}
      rescue:
        # (its error hidden: the file holds passwords)
        - name: Stop the run
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }}: its JMX password file {{ _password[0].path }} could not be written (its directory,
              disk space?), nothing else was changed on it. The other nodes' password files may be written already
              (read at each login: no restart needed). Fix it, then run again.
  vars:
    # (from the groups the nodes to do are put in: each node's when reads them, no other node's variables)
    _os_nodes: "{{ ansible_play_hosts | select('in', groups['cassandra_apply_config_os_True'] | default([])) | list }}"
    _config_nodes: "{{ ansible_play_hosts | select('in', groups['cassandra_apply_config_True'] | default([])) | list }}"
    _todo: "{{ ansible_play_hosts | select('in', _config_nodes + _os_nodes) | list }}"
    # the way out of a Cassandra outside its unit whose config needs a restart: the refusal and --check's WARNING
    _outside_way_out: >-
      Stop that Cassandra (nodetool drain, then stop what started it), start it with its unit (systemctl start
      cassandra), then run apply_config again.

- name: Set up the progress file
  hosts: "{{ query('community.cassandra.cassandra_nodes') | select('in', groups['cassandra_apply_config_True'] | default([])) | list }}"
  gather_facts: false
  # the files' diffs: said once in the plan (WILL CHANGE, --diff) and in the .diff file, not by each task
  diff: false
  become: true
  vars:
    cassandra_service_node_action: apply_config
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Set up the progress file
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: progress.yml
      vars:
        # the parts it applies, next to the progress file (apply_only; all: every part): a resume must give them
        _cassandra_progress_parts: "{{ _cassandra_apply_parts.parts | join(',') if _cassandra_apply_parts.left_out else 'all' }}"

    # -e cassandra_rolling_resume=true: an interrupted run resumes, skipping the nodes already done
    # said by the summary of a run that stops before them (the nodes written at once go first, in their own play)
    - name: Note the nodes not reached yet
      ansible.builtin.set_fact:
        cassandra_op_result: not done (the run stopped before it)

# The OS settings of cassandra_linux (kernel settings, limits, THP, swap, time
# sync, the read-ahead and scheduler of the data devices) too, except on a node
# with cassandra_linux_manage false: the ones that differ are shown with the
# config's, and applied first, on their nodes at once, live (no restart for
# them: the files Cassandra has open keep their read-ahead until it restarts),
# but those not done under a running Cassandra, done in its restart window
# (drained, Cassandra stopped, done, started again; the reason of the restart
# said): its time sync to install or start (its clock let sync, said with its
# offset to its time source when it can be read), a tuned profile switch or
# reload (cassandra_linux_tuned_switch_restart), the LVM read-ahead
# (cassandra_data_lvchange_restart).
# The OS settings that differ (cassandra_linux), on their nodes at once: they apply live, no restart for them
# (what is not done under a running Cassandra: in its restart window; under --check: shown already, nothing to do)
- name: Apply the OS settings, on these nodes at once
  hosts: "{{ query('community.cassandra.cassandra_nodes') | select('in', groups['cassandra_apply_config_os_True'] | default([])) | list }}"
  any_errors_fatal: true
  gather_facts: false  # gathered by the preflight
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Say what the run does
      ansible.builtin.debug:
        msg: "{{ 'apply_os' | community.cassandra.cassandra_phase(count=ansible_play_hosts | length) }}"
      run_once: true
      when: not ansible_check_mode
      vars:
        cassandra_output: true  # a phase line (ops callback)
        cassandra_output_gap: true  # a block of its own
        cassandra_output_step: true  # a step: its tasks counted, its time said

    - name: Apply the OS settings
      when: not ansible_check_mode
      block:
        # the Cassandra directories the disk tuning looks under, as they were compared
        - name: Load the cassandra_config defaults
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_config
            tasks_from: defaults.yml
            public: true

        # (its summary of the data disks said here, after the question: what was set, what is left for later)
        - name: Apply the OS settings
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_linux
            apply:
              diff: "{{ ansible_diff_mode | bool and ansible_verbosity | int > 0 }}"  # said in the OS settings view before the question
          vars:
            _cassandra_change_report_quiet: true  # shown before the question
            _cassandra_linux_swap_said: true  # in the plan
            # the warnings of the data disks the plan said: not again
            _cassandra_disk_warned: >-
              {%- set said = {} -%}
              {%- for h in ansible_play_hosts if h in _cassandra_apply_config_view -%}
              {%-   set _ = said.update({h: _cassandra_apply_config_view[h].disk_warned}) -%}
              {%- endfor -%}
              {{ said }}
            # in its restart window, or not at all (a unit that cannot run here)
            _cassandra_linux_timesync_later: "{{ cassandra_apply_config_timesync_later }}"
            # what the plan left to its restart window (anything else not done under a running Cassandra: said)
            _cassandra_linux_restart_window: "{{ cassandra_apply_config_disks_window | length > 0 }}"
            _cassandra_linux_restart_follows: >-
              {{ cassandra_apply_config_todo | bool and cassandra_apply_config_then == 'restart' }}
      rescue:
        # (a node stopped because another one failed: ansible-core 2.17+ rescues it too)
        - name: Record the failure
          ansible.builtin.set_fact:
            cassandra_op_result: >-
              {{ ('OS settings FAILED: ' ~ [ansible_failed_result.msg | default('')] | flatten | join(' '))
                 if ansible_failed_task is defined else 'OS settings not finished: the run stopped at another node' }}

        - name: Print the summary
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_operation
            tasks_from: summary.yml

        - name: Stop here
          ansible.builtin.fail:
            msg: >-
              {{ ('Stopped at ' ~ inventory_hostname ~ ' (' ~ ansible_failed_task.name | default('') ~ '): no config was written, no node
                  restarted; the OS settings of the other nodes may be applied in part. Once fixed, run apply_config again.')
                 if ansible_failed_task is defined else 'Stopped with the node that failed.' }}
          vars:
            cassandra_output: true  # a verdict: its msg as is

    # (--check: as a real run would have)
    - name: Note the OS settings applied
      ansible.builtin.set_fact:
        cassandra_apply_config_os_done: true

    # what the summary says of it if a node fails later (its config, if any, not reached yet)
    - name: Note the result
      ansible.builtin.set_fact:
        cassandra_op_result: >-
          {{ (cassandra_op_result if ansible_check_mode else 'not done (the run stopped before it), its OS settings applied') if cassandra_apply_config_todo | bool
             else 'OS settings ' ~ ('would be applied (--check: nothing was changed)' if ansible_check_mode else 'applied') }}

# The nodes whose Cassandra keeps running as it is (an owner, group or mode alone) or stays stopped (stopped on
# purpose), and every node under --check: written at once, the cluster checked before and after (its ring and
# schema read once for them)
- name: Apply the config where nothing is restarted, on these nodes at once
  hosts: "{{ query('community.cassandra.cassandra_nodes') | select('in', groups['cassandra_apply_config_batch_True'] | default([])) | list }}"
  any_errors_fatal: true
  # the files' diffs: said once in the plan (WILL CHANGE, --diff) and in the .diff file, not by each task
  diff: false
  gather_facts: false  # gathered by the preflight
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    # cassandra_java_version (the series' Java when the inventory has none) and the others the Java move reads
    # (java_install.yml, shared with update_java): the defaults loaded in an earlier play are not kept
    - name: Load the cassandra_install defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_install
        tasks_from: defaults.yml
        public: true

    # a step of the run (node_operation's own phase line left out); under --check, the checks from each node
    - name: Say what the run does
      ansible.builtin.debug:
        msg: >-
          {{ 'check_from_nodes' | community.cassandra.cassandra_phase(count=_names | length) if ansible_check_mode
             else 'write_config' | community.cassandra.cassandra_phase(_names) }}
      run_once: true
      when: _names | length > 0
      vars:
        cassandra_output: true  # a phase line (ops callback)
        cassandra_output_gap: true  # a block of its own
        cassandra_output_step: true  # a step: its tasks counted, its time said
        _names: "{{ ansible_play_hosts | reject('in', cassandra_progress_done | default([])) | list }}"

    - name: Apply the config on these nodes
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: apply_config
        cassandra_service_node_batch: true
        _cassandra_operation_phase_said: true  # (above)
        # --check: a node whose JMX password file is missing or other (a real run writes it first) refuses
        # the JMX login: checked from the others
        _no_login: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts_all if ansible_check_mode -%}  {#- (any such node is to do: in this play) -#}
          {%-   if _cassandra_apply_config_view[h].jmx_password -%}
          {%-     set _ = out.append(h) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}
        cassandra_service_node_checks_before: "{{ inventory_hostname not in _no_login }}"
        _cassandra_health_not_peers: "{{ _no_login | join(',') or cassandra_target_nodes | default('') }}"
        # the other nodes where Cassandra is not running may stay down: those started later in the run, those
        # left stopped (computed once for every node in the find play)
        cassandra_service_health_down_ok: "{{ _cassandra_apply_config_down_ok_all.batch[inventory_hostname] }}"
        _cassandra_health_no_wait: "{{ cassandra_service_health_down_ok | length > 0 }}"  # they will not come back

# The nodes restarted for their config files alone: those files rendered and staged next to the live ones, on
# these nodes at once (nothing live changes: the running Cassandra reads none of them), then put in place at the
# node's turn, just before its restart, which then does no compare again (cassandra_config stage.yml, staged.yml)
- name: Stage the config of the nodes to restart, on these nodes at once
  hosts: "{{ query('community.cassandra.cassandra_nodes') | select('in', groups['cassandra_apply_config_stage_True'] | default([])) | list }}"
  any_errors_fatal: true
  gather_facts: false  # gathered by the preflight
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Say what the run does
      ansible.builtin.debug:
        msg: "{{ 'stage_config' | community.cassandra.cassandra_phase(count=_names | length) }}"
      run_once: true
      when: _names | length > 0
      vars:
        cassandra_output: true  # a phase line (ops callback)
        cassandra_output_gap: true  # a block of its own
        cassandra_output_step: true  # a step: its tasks counted, its time said
        _names: "{{ ansible_play_hosts | reject('in', cassandra_progress_done | default([])) | list }}"

    - name: Stage the config files
      when: inventory_hostname not in cassandra_progress_done | default([])  # (done by the interrupted run)
      block:
        - name: Stage the config files
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_config
            tasks_from: stage.yml
          vars:
            _cassandra_config_staged_files: "{{ cassandra_apply_config_stage_files }}"
      rescue:
        # (a node stopped because another one failed: ansible-core 2.17+ rescues it too)
        - name: Stop here
          ansible.builtin.fail:
            msg: >-
              Stopped at {{ inventory_hostname }} ({{ ansible_failed_task.name | default('another node failed') }}):
              nothing put in place, no restart yet; the staged .ansible-next files are not read by Cassandra.
              WAY OUT  fix it, then run apply_config again.
          vars:
            cassandra_output: true  # a verdict: its msg as is

# The others one at a time: cluster checked, config written, node drained and
# restarted, cluster checked again (--check: every node at once, in the play
# above, nothing is restarted). The health checks let the nodes not running
# that this run leaves down or starts later be down, except before a restart:
# any other node down stops the run. Stops at the first problem.
- name: Apply the config, one node at a time
  hosts: >-
    {{ query('community.cassandra.cassandra_nodes') | select('in', groups['cassandra_apply_config_True'] | default([]))
       | reject('in', groups['cassandra_apply_config_batch_True'] | default([])) | list }}
  serial: 1
  gather_facts: false  # gathered by the preflight
  any_errors_fatal: true
  # the files' diffs: said once in the plan (WILL CHANGE, --diff) and in the .diff file, not by each task
  diff: false
  become: true
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    # cassandra_java_version (the series' Java when the inventory has none) and the others the Java move reads
    # (java_install.yml, shared with update_java): the defaults loaded in an earlier play are not kept
    - name: Load the cassandra_install defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_install
        tasks_from: defaults.yml
        public: true

    - name: Apply the config on this node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: apply_config
        # the other nodes where Cassandra is not running may stay down while a node is written without
        # being taken down (none, start, write): those started later in the run (or not to do), those left
        # stopped; a restart waits for every other node up (under --check, the nodes before it were not started)
        cassandra_service_health_down_ok: "{{ _cassandra_apply_config_down_ok_all.serial[inventory_hostname] }}"
        _cassandra_health_no_wait: "{{ cassandra_service_health_down_ok | length > 0 }}"  # they will not come back

# What each node got; under --check, first the settings that differ (secrets masked), owner/mode changes included
- name: Summary
  hosts: "{{ [] if _cassandra_apply_config_compare_only | default(false) | bool else query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  # (what the recap and the report of the run read)
  vars:
    _start: >-
      {{ query('community.cassandra.cassandra_nodes') | map('extract', hostvars) | selectattr('_cassandra_apply_config_start', 'defined')
         | map(attribute='_cassandra_apply_config_start') | first | default('') }}
    _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"
    # the nodes the plan showed the warnings of (none: no plan)
    _planned: >-
      {{ query('community.cassandra.cassandra_nodes') | map('extract', hostvars) | selectattr('_cassandra_apply_config_planned', 'defined')
         | map(attribute='_cassandra_apply_config_planned') | first | default(none) }}
    # --check: why a real run would refuse (a node not running, restarts to do)
    _refused: >-
      {{ (query('community.cassandra.cassandra_nodes') | map('extract', hostvars) | selectattr('_cassandra_apply_config_stops', 'defined')
          | map(attribute='_cassandra_apply_config_stops') | first | default([]))
         + (query('community.cassandra.cassandra_nodes') | map('extract', hostvars) | selectattr('_cassandra_apply_config_refused', 'defined')
            | map(attribute='_cassandra_apply_config_refused') | first | default([])) }}
    # (the TODO of the nodes whose read-ahead was set live: the cluster named as this run named it)
    _restart_command: >-
      {{ 'rolling_restart' | community.cassandra.cassandra_command(
           inventory=ansible_inventory_sources | default([]), default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
           hosts=cassandra_hosts | default(''), cwd=lookup('ansible.builtin.env', 'PWD')) }}
    # --check: the plan's own warning, said here (no plan shown); a real run: a limits file left to the node that
    # the package update changed
    _more: >-
      {{ (_no_return_warning if ansible_check_mode and _no_return else [])
         + ([{'label': 'the ring', 'text': _ring_unknown}] if ansible_check_mode else []) + _limits_changed
         + _unknown_vars }}
    # a variable not known (a typo?): said mid-run by preflight, repeated here with the grep that finds it
    _unknown_vars: >-
      {{ query('community.cassandra.cassandra_nodes') | map('extract', hostvars)
         | map(attribute='_cassandra_preflight_unknown', default={}) | list
         | community.cassandra.cassandra_unknown_recap(ansible_inventory_sources | default([]), lookup('ansible.builtin.env', 'PWD')) }}
    _no_return_warning:
      - label: "{{ _no_return | community.cassandra.cassandra_node_list }}"
        text: >-
          storage_compatibility_mode moves to NONE: the point of no return. Once a node runs with it, it cannot go back
          to UPGRADING or CASSANDRA_4, nor to its former Cassandra version.
    # a limits file left to the node that a package update changed, its saved copy said from the run's directory
    _limits_changed: >-
      {{ query('community.cassandra.cassandra_nodes')
         | community.cassandra.cassandra_limits_changed(hostvars, lookup('ansible.builtin.env', 'PWD')) }}
    # the ring's nodes the inventory does not have (the plan's warning, said here under --check)
    _ring: "{{ hostvars[ansible_play_hosts_all | first]._cassandra_apply_config_ring | default({}) }}"
    _ring_unknown: "{{ _ring | community.cassandra.cassandra_apply_config_ring_unknown }}"
    _no_return: >-
      {{ query('community.cassandra.cassandra_nodes') | map('extract', hostvars) | selectattr('cassandra_apply_config_no_return', 'defined')
         | map(attribute='cassandra_apply_config_no_return') | first | default([]) }}
    # the settings that differ (said under --check only: a real run showed them before its question)
    _diff: >-
      {{ query('community.cassandra.cassandra_nodes') | map('extract', hostvars) | selectattr('cassandra_apply_config_diff', 'defined')
         | map(attribute='cassandra_apply_config_diff') | first | default([]) }}
    _nodes: >-
      {{ query('community.cassandra.cassandra_nodes')
         | community.cassandra.cassandra_apply_config_nodes(hostvars, ran=ansible_play_hosts_all) }}
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    # the files staged for a restart and not put in place (a node not reached by an earlier run, stopped): removed
    - name: Remove the staged config files left
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: staged_clean.yml
      when: not ansible_check_mode

    - name: Print the changes
      ansible.builtin.debug:
        msg: >-
          {{ _nodes | community.cassandra.cassandra_apply_config_recap(check=ansible_check_mode, cluster=_cluster,
                                                                        seconds=(now().timestamp() | int - _start | int) if _start else none,
                                                                        diff=_diff, refused=_refused, planned=_planned, width='terminal',
                                                                        restart_command=_restart_command, more=_more) }}
      run_once: true
      vars:
        cassandra_output: true
        cassandra_output_gap: true  # a block of its own (ops callback)

    # the report of the run on the controller (run_report.yml): a real run's plan, its recap (what was done, every
    # warning in full), when each node's turn started and how it ended; --check: its recap (the differences, what a
    # real run would do, the warnings)
    - name: Write the report of the run
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: run_report.yml
      run_once: true
      vars:
        _cassandra_run_report_operation: apply_config
        _cassandra_run_report_started: "{{ _start }}"
        _cassandra_run_report_status: "{{ _recap[0].split() | first }}"
        _recap: >-
          {{ _nodes | community.cassandra.cassandra_apply_config_recap(check=ansible_check_mode, cluster=_cluster,
                                                                        seconds=(now().timestamp() | int - _start | int) if _start else none,
                                                                        diff=_diff, refused=_refused, planned=none,
                                                                        restart_command=_restart_command, more=_more) }}
        _cassandra_run_report_sections: >-
          {{ hostvars['localhost']._cassandra_run_report_plan | default([])
             + [{'title': 'RECAP', 'lines': _recap, 'mask': true}]
             + ([] if ansible_check_mode else [{'title': 'NODES', 'lines': _times}])
             + ([{'title': 'COMPARE', 'lines': _compare}] if _compare else []) }}
        # the nodes whose config the plan of cassandra_config found unchanged (the rest of the role not run there),
        # the parts left out (apply_only)
        _gates: >-
          {{ query('community.cassandra.cassandra_nodes') | map('extract', hostvars, '_cassandra_apply_config_gate')
             | map('default', '') | list }}
        _left_out: "{{ (hostvars[ansible_play_hosts_all | first]._cassandra_apply_parts | default({})).left_out | default([]) }}"
        _compare: >-
          {{ _gates | community.cassandra.cassandra_apply_gate_lines(_left_out,
               full=hostvars[ansible_play_hosts_all | first]._cassandra_apply_full | default(false),
               verify=hostvars[ansible_play_hosts_all | first]._cassandra_apply_verify | default(false)) }}
        # (when each node's turn started: node_operation.yml's start)
        _times: >-
          {{ _nodes | community.cassandra.cassandra_run_report_times(dict(query('community.cassandra.cassandra_nodes')
               | zip(query('community.cassandra.cassandra_nodes') | map('extract', hostvars)
                     | map(attribute='_cassandra_op_start', default='') | list))) }}
