---
trivial:
- "cassandra_install, cassandra_repository, cassandra_linux, cassandra_medusa, cassandra_config, cassandra_change_report and cassandra_operation roles - the parts a run usually does not need (the Java package with ``cassandra_install_java`` false, the Java tarball checks without one, dsbulk already installed, python3.11 for cqlsh, the apt tasks on RedHat, a signing keys URL, time sync with ``cassandra_linux_timesync`` false, Medusa's Python with its virtualenv there, a change report without changes, the restart window's steps of another case) are behind one ``include_tasks`` each: a skipped part costs the controller one task per node, not one per task of it (each costs the same, run or skipped)."
- "cassandra_linux role - the kernel settings are read once (both files, the live values), and ``ansible.posix.sysctl`` runs only for the keys it would change (set, or removed from ``/etc/sysctl.conf``); every key when something could not be read, or when a file names a key twice."
