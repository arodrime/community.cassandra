---
argument_specs:
  main:
    short_description: Run Cassandra under a systemd unit.
    description:
      - Installs a native systemd unit, enables it, starts the node and waits
        until it has joined the cluster.
      - "Handles the node it runs on. Order several nodes in the playbook
        (C(serial: 1), seeds first for a new cluster)."
    options:
      cassandra_service_enabled:
        type: bool
        default: true
        description:
          - Start Cassandra at boot.
      cassandra_service_state:
        type: str
        default: started
        choices: [started, stopped, restarted]
        description:
          - State of the service.
      cassandra_service_restart_on_change:
        type: bool
        default: false
        description:
          - Restart a running node when the unit changes. Otherwise the change
            applies at the next restart.
      cassandra_service_allow_new_seed:
        type: bool
        default: false
        description:
          - Start a node that never started even when it is listed in
            C(cassandra_seeds) and another seed already answers. Seeds don't
            bootstrap, so such a node would join without its data.
      cassandra_new_node_checks:
        type: bool
        default: true
        description:
          - C(add_node) and C(replace_node) check the new hosts before installing anything (root access,
            the Cassandra directories and their mounts, free space, the Pythons of cqlsh and Medusa, the
            packages and their sources, the seeds' ports, no Cassandra there yet) and stop with every
            problem found. V(false) skips these checks.
      cassandra_new_node_min_free_gb:
        type: int
        default: 0
        description:
          - Minimum free space, in GiB, on the file system of each data directory of a new host. V(0)
            checks none, the free space is only shown.
      cassandra_new_node_allow_kept_setup:
        type: bool
        default: false
        description:
          - The new host checks refuse a host with no Cassandra installed yet that still has the host_vars
            C(import_cluster) wrote for the node that had its name (C(cassandra_imported_host=true) with
            C(cassandra_linux_manage), C(cassandra_cqlsh_python_manage) or C(cassandra_service_unit_manage)
            V(false)), as the roles would leave it half set up. The same switches set by the operator are not
            refused. V(true) accepts it, when that host is set up another way.
      cassandra_imported_host:
        type: bool
        description:
          - Written by C(import_cluster) in the host_vars of a node next to the C(*_manage) switches it sets
            there. The new host checks use it to tell those switches from the operator's own.
      cassandra_user:
        type: str
        default: cassandra
        description:
          - The account Cassandra runs as (the unit's C(User=)), also the owner of the directories and JMX users' files
            of C(cassandra_config). The role does not create it.
      cassandra_group:
        type: str
        default: cassandra
        description:
          - The group Cassandra runs as (the unit's C(Group=)), also the default group of the config files of
            C(cassandra_config).
      cassandra_service_user:
        type: str
        description:
          - The unit's C(User=), and the owner of the directories and JMX users' files of C(cassandra_config).
            Defaults to O(cassandra_user); set that one instead.
      cassandra_service_group:
        type: str
        description:
          - The unit's C(Group=), and the group of the directories and JMX users' files of C(cassandra_config) (not of
            its config files). Defaults to O(cassandra_group); set that one instead. The role refuses an account that
            could not read the config files C(cassandra_config) writes.
      cassandra_service_unit_manage:
        type: bool
        default: true
        description:
          - V(false) keeps the node's own unit (or the package's init script) instead of writing the role's; the
            unit variables below then have no effect on it. The C(import_cluster) playbook sets it on the nodes it
            finds started another way.
      cassandra_service_restart:
        type: str
        default: "no"
        choices: ["no", on-failure, always]
        description:
          - systemd C(Restart=). With V(no), a node that died stays down until
            someone looks at it.
      cassandra_service_start_limit_burst:
        type: int
        default: 3
        description:
          - Maximum automatic restarts per O(cassandra_service_start_limit_interval),
            when O(cassandra_service_restart) is not V(no).
      cassandra_service_start_limit_interval:
        type: int
        default: 1800
        description:
          - Interval for O(cassandra_service_start_limit_burst), in seconds.
      cassandra_service_limit_nofile:
        type: raw
        default: 1048576
        description:
          - systemd C(LimitNOFILE=).
      cassandra_service_limit_nproc:
        type: raw
        default: 32768
        description:
          - systemd C(LimitNPROC=).
      cassandra_service_limit_memlock:
        type: raw
        default: infinity
        description:
          - systemd C(LimitMEMLOCK=).
      cassandra_service_limit_as:
        type: raw
        default: infinity
        description:
          - systemd C(LimitAS=).
      cassandra_service_timeout_stop:
        type: int
        default: 180
        description:
          - Seconds systemd waits for Cassandra to stop before killing it.
      cassandra_service_environment:
        type: dict
        default: {}
        description:
          - "Extra environment variables for the unit, for example C({JAVA_HOME: /usr/lib/jvm/java-17})."
      cassandra_service_wait_for_normal:
        type: bool
        default: true
        description:
          - "Wait until C(nodetool netstats) reports C(Mode: NORMAL)."
      cassandra_service_wait_timeout:
        type: int
        default: 600
        description:
          - "How long to wait for a started node to reach C(Mode: NORMAL), in seconds."
          - For a node being added or replaced, how long to wait for it to answer on JMX (then
            the bootstrap is waited for as long as it makes progress, see C(cassandra_stream_stall_checks)).
      cassandra_add_node_cleanup:
        type: str
        default: none
        choices: [none, sequential, one, rack, dc, all]
        description:
          - What the C(add_node) playbook does, after the add, about the cleanup of the nodes that handed
            data over (the datacenter's nodes, or only the new nodes' racks when every keyspace has as many
            replicas as racks there), with the words of the C(cleanup) playbook's C(cassandra_cleanup_mode).
            C(none) prints the command; C(sequential) runs it one node at a time (C(one) is the same);
            C(rack) a rack at a time, C(dc) a datacenter at a time; C(all) every node at once (heavy I/O).
            The cluster is checked before each batch.
      cassandra_add_node_reset:
        type: bool
        default: false
        description:
          - What the C(add_node) playbook does with a new node that has data but is not in the ring (started
            once by mistake, a failed bootstrap). C(false) refuses it. C(true) resets it first, the same way as
            the C(reset_node) playbook. It stops Cassandra, keeps it from starting at boot, then deletes what its
            data, commitlog, saved_caches, hints and cdc_raw directories hold, from the inventory and the live
            C(cassandra.yaml). The list is shown and confirmed first.
          - The reset is refused when an up node of the cluster lists one of the node's addresses in its ring,
            when no other node answers as up, when Cassandra runs there with other nodes in its ring, and on
            paths that look wrong (a system directory, a top-level one that is not a mount point, one holding
            another mount point, the config or the logs).
      cassandra_replace_node_reset:
        type: bool
        default: false
        description:
          - What the C(replace_node) playbook does with a replacement host that still holds data, typically a
            host replacing itself (the dead node's address is its own, e.g. a lost disk or a reinstall).
            C(false) refuses it, C(true) resets it first as C(cassandra_add_node_reset) does. The other nodes
            may list the host's address only as the dead node being replaced, down.
      cassandra_node_state:
        type: str
        default: present
        choices: [present, absent]
        description:
          - The state this host should be in, the inventory being the desired state of the cluster. C(absent)
            (a host var, or a group var for a group of hosts) takes the host out of the cluster - every operation
            playbook leaves it out (preflight, health checks and their node counts, rolling operations, status,
            import), and the C(topology) playbook decommissions it if it is still in the ring.
          - Delete the host from the inventory once C(topology) has removed it, or leave it marked absent.
      cassandra_topology_max_removals:
        type: int
        default: 2
        description:
          - C(topology) - the most nodes one run removes from the ring; a plan that removes more is refused
            (a group var marking hosts absent by mistake), as is one that removes more than half of a datacenter.
      cassandra_topology_allow_large_removal:
        type: bool
        default: false
        description:
          - C(topology) - C(true) goes on with a plan the guard refuses (more removals than
            C(cassandra_topology_max_removals), or more than half of a datacenter).
      cassandra_create_cluster_reset:
        type: bool
        default: false
        description:
          - C(true) makes the C(create_cluster) playbook rebuild a cluster that runs already, ALL ITS DATA
            LOST, e.g. to move it to another snitch, datacenters or racks (a node keeps them for life once it
            has joined). Every node is stopped, kept from starting at boot and emptied as by the C(reset_node)
            playbook, then the cluster is created with the inventory's settings.
          - Refused when C(--limit) leaves a host of the group out, when no node answers C(nodetool status),
            when the ring has a node the group does not have, when a running node is not in that ring or the
            running nodes see different rings, when a node holding data is not in that ring, or when a node's
            live C(cassandra.yaml) names another cluster. The plan is shown, then the operator types the cluster name. C(--check) shows
            the plan only.
      cassandra_create_cluster_reset_confirm:
        type: str
        default: ""
        description:
          - The cluster name, for C(cassandra_create_cluster_reset) without a terminal (it replaces typing
            it). Any other value is refused.
      cassandra_token_auto:
        type: raw
        default: false
        description:
          - One token per node (I(cassandra_num_tokens=1)), C(add_node) - where the new nodes without
            C(cassandra_initial_token) go. C(false) refuses them; C(bisect) splits the largest ranges, no node
            moves; C(balanced) gives an even ring for the new node count, the new nodes join at their final
            tokens and C(move_node) moves the others afterwards; C(true) shows both plans and asks which
            (refused when C(cassandra_operation_confirm) is false; C(--check) follows bisect without asking).
      cassandra_token_rf:
        type: int
        default: 3
        description:
          - One token per node - the replication factor the shares shown by C(create_cluster), C(add_node),
            C(add_datacenter) and C(move_node) assume in a datacenter no keyspace is replicated to.
            Otherwise the largest replication factor of the datacenter's keyspaces.
      cassandra_token_allow_partial:
        type: bool
        default: false
        description:
          - One token per node, C(create_cluster) - a datacenter where only some nodes have
            C(cassandra_initial_token) is refused; C(true) gives the others the middles of the largest ranges.
      cassandra_move_tokens:
        type: dict
        default: {}
        description:
          - "C(move_node) - the nodes to move and their new tokens, a dict node name to token. Empty, each single-token
            datacenter is evened out with the fewest moves."
      cassandra_move_cleanup:
        type: str
        default: none
        choices: [none, sequential, one, rack, dc, all]
        description:
          - What C(move_node) does about the cleanup of the nodes that lost ranges (this run's and the ones an
            interrupted run recorded), as C(cassandra_add_node_cleanup).
      cassandra_move_min_free_percent:
        type: int
        default: 20
        description:
          - C(move_node) - before each move, the nodes that receive data must keep this share of their data
            directories' disks free, counting the data the move streams to them (estimated from the loads,
            data spread evenly along the ring).
      cassandra_move_force_disk:
        type: bool
        default: false
        description:
          - C(move_node) - go on with a move the disk check refuses.
      cassandra_move_timeout:
        type: int
        description:
          - C(move_node) - seconds the job running C(nodetool move) may last; by default as long as the
            streams make progress (see C(cassandra_stream_max_time)).
      cassandra_stream_check_interval:
        type: int
        default: 300
        description:
          - Seconds between two progress checks of a streaming operation (bootstrap of C(add_node),
            C(replace_node), C(decommission_node), C(remove_dead_node), rebuild of C(add_datacenter),
            C(move_node)) and of a cleanup; the first checks come sooner (after 10 s, 30 s, 1, 2 and 4
            minutes, each at most this long), so a short operation ends in seconds.
            Each check reads C(nodetool netstats) and prints the progress, a short line (bar, percentage,
            rate) then the data, the other nodes and the times, one item per line.
      cassandra_stream_stall_checks:
        type: int
        default: 3
        description:
          - A streaming operation fails only after this many checks in a row without any progress in
            C(nodetool netstats) (no byte or file streamed, no session started or ended), 4 times as
            many while nothing is left to transfer (before the first session, index or view builds).
            Only the checks C(cassandra_stream_check_interval) apart count, not the sooner first ones.
            Nothing is stopped then; the node stays as it is.
      cassandra_stream_max_time:
        type: int
        default: 0
        description:
          - Optional limit, in seconds, on the whole streaming operation. C(0) (default) sets none.
      cassandra_service_tasks_max:
        type: str
        default: infinity
        description:
          - systemd C(TasksMax=). systemd's own default (15% of C(pid_max)) can
            be low enough to make a busy node fail with "unable to create native thread".
      cassandra_service_drain_on_stop:
        type: bool
        default: true
        description:
          - Run C(nodetool drain) before the JVM gets SIGTERM, so a plain
            C(systemctl stop cassandra) (OS patching, reboot) is clean. Never
            blocks the stop.
          - With JMX authentication it needs O(cassandra_jmx_username) and
            O(cassandra_jmx_password_file) (the unit file is world-readable).
      cassandra_service_drain_timeout:
        type: int
        default: 120
        description:
          - Seconds before the drain is abandoned and the JVM stopped anyway.
            Must stay 10 below O(cassandra_service_timeout_stop).
      cassandra_service_health_timeout:
        type: int
        default: 600
        description:
          - Operation playbooks, cluster health check before and after each
            node. Seconds to wait for down nodes to come back.
      cassandra_service_health_force:
        type: bool
        default: false
        description:
          - Go on although the cluster is not healthy. Risky, a second replica
            down can make data unavailable.
      cassandra_jmx_username:
        type: str
        default: ""
        description:
          - JMX user for the modules and C(nodetool) calls, when remote JMX
            authentication is on.
      cassandra_jmx_password:
        type: str
        default: ""
        no_log: true
        description:
          - JMX password. Prefer O(cassandra_jmx_password_file).
      cassandra_jmx_password_file:
        type: str
        default: ""
        description:
          - File holding the JMX password, on the nodes.
      cassandra_operation_confirm:
        type: bool
        default: true
        description:
          - Ask the operator before a risky operation. C(false) for non-interactive runs. C(--check) never asks
            (nothing changes, the plan only).
      cassandra_operation_drain:
        type: bool
        default: true
        description:
          - Rolling restarts and C(stop_rack) drain each node before stopping it (the role's unit drains
            on stop too, a second drain is harmless). V(false) leaves it to the unit, except on a node whose own
            unit is kept (C(cassandra_service_unit_manage=false)), which is drained anyway.
      cassandra_rolling_resume:
        type: bool
        default: false
        description:
          - Resume the latest interrupted rolling operation of this cluster,
            skipping the nodes already done.
      cassandra_rolling_progress_dir:
        type: path
        default: ""
        description:
          - Where rolling operations keep their progress files, on the
            controller. A relative path is from the current dir.
          - Empty (default) means C(.cassandra_progress) in the inventory's
            dir, or in the current dir when the inventory's dir is not writable
            and has no C(.cassandra_progress) yet (or there is none, as with
            C(-i host1,host2)). With several inventories, the one of the first
            host of the play.
      cassandra_rolling_progress_days:
        type: int
        default: 30
        description:
          - Progress files older than this are removed.
      cassandra_cql_username:
        type: str
        default: ""
        description:
          - CQL user for the checks that read the schema (e.g. the keyspaces'
            replication before a decommission), when authentication is on.
      cassandra_cql_password:
        type: str
        default: ""
        no_log: true
        description:
          - Password of O(cassandra_cql_username).
