---
argument_specs:
  main:
    short_description: Open the Cassandra ports in the host firewall.
    description:
      - Uses firewalld on RedHat family systems and ufw on Debian and Ubuntu.
    options:
      cassandra_firewall_manage:
        type: bool
        default: true
        description:
          - V(false) leaves the firewall as it is on this node, nothing installed, started or opened.
          - Set it for the nodes whose firewall you keep as it is. C(import_cluster) writes it with
            C(-e import_keep_hand_edits=firewall), and on the nodes it could not read; else it carries the nodes'
            firewall, or none.
      cassandra_firewall_enabled:
        type: bool
        default: true
        description:
          - V(false), no firewall on this node, nothing installed; firewalld (RedHat) or ufw (Debian) stopped and
            disabled where it runs. C(import_cluster) sets it for nodes that run none.
      cassandra_offline:
        type: bool
        default: false
        description:
          - Air-gapped hosts, nothing is downloaded. The firewall package
            (firewalld or ufw) is checked instead of installed.
      open_ports:
        type: list
        elements: str
        default: [22/tcp, 7199/tcp, 7000/tcp, 7001/tcp, 9042/tcp]
        description:
          - Ports to open, as C(port/protocol).
      cassandra_firewall_port_sources:
        type: dict
        default: {}
        description:
          - 'Ports open only to some sources instead of everyone, e.g. JMX for a
            remote repair scheduler, C({"7199/tcp": ["10.0.9.0/24"]}). A port
            listed here is closed to the others even when it is in O(open_ports).'
      cassandra_prometheus_exporter_sources:
        type: list
        elements: str
        default: []
        description:
          - 'With the Prometheus exporter on (C(cassandra_prometheus_exporter_enabled), cassandra_config), its
            port (C(cassandra_prometheus_exporter_port), 9404 by default) open to these sources only, e.g. the
            Prometheus servers, C(["10.0.20.0/24"]). Empty leaves it closed, with a warning.'
