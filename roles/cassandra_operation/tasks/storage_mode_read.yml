---
# 5.0: storage_compatibility_mode on this node, as its cassandra.yaml has it (what Cassandra reads at its start), and
# the one the running Cassandra runs: the one it logged at its start ("Node configuration:[...]", the last one of its
# system.log, written since that start) when it is there (gone once the log rolled over), else its cassandra.yaml's
# unless the file changed since the process started (by content against the record of the config it started with,
# else by the file mtime and ctime against /proc/<pid>). cassandra_storage_mode_read.stdout_lines: yaml_read=yes|no, yaml=<value, "" without the line>,
# logged=<the logged mode> when found, pending=yes when the file changed since its start and nothing was logged.
# file=<its path>. Read-only, under --check too. start_read=no: its start or the file time not read, after-now: its
# start reads as after now; future=yes: the file has a time after now.
- name: Load the cassandra_service defaults (the record of the config Cassandra started with)
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: defaults.yml
    public: true

- name: Read storage_compatibility_mode in its cassandra.yaml and in the running Cassandra
  ansible.builtin.shell: |
    echo "file=$F"
    if [ -r "$F" ]; then
      echo "yaml_read=yes"
      echo "yaml=$(sed -n 's/^storage_compatibility_mode:[ \t]*//p' "$F" | sed 's/[ \t]*#.*$//; s/[ \t]*$//' | tail -1)"
    else
      echo "yaml_read=no"
    fi
    pid=
    for p in $(pgrep -x java); do
      tr '\0' '\n' < /proc/$p/cmdline 2>/dev/null | grep -qx org.apache.cassandra.service.CassandraDaemon && { pid=$p; break; }
    done
    [ -n "$pid" ] || { echo "running=no"; exit 0; }
    echo "running=yes"
    # its start in seconds since the epoch: the boot time (btime of /proc/stat) and its start in clock ticks since
    # boot (field 22 of stat, the 20th after the command name). Not known: start_read=no; after now (a boot time a
    # virtual machine got wrong): start_read=after-now; both refused, never taken as not pending. A file time after
    # now (a clock set back): future=yes
    ticks=$(sed 's/^.*) //' /proc/$pid/stat 2>/dev/null | awk '{print $20}')
    btime=$(awk '$1 == "btime" {print $2}' /proc/stat 2>/dev/null)
    hz=$(getconf CLK_TCK 2>/dev/null); [ -n "$hz" ] || hz=100
    start=
    [ -n "$ticks" ] && [ -n "$btime" ] && start=$(awk -v b="$btime" -v t="$ticks" -v h="$hz" 'BEGIN {printf "%d", b + t / h}')
    set -- $(stat -L -c '%Y %Z' "$F" 2>/dev/null)
    mtime=${1:-} ctime=${2:-}
    now=$(date +%s)
    if [ -z "$start" ] || [ -z "$mtime" ]; then
      echo "start_read=no"
      exit 0
    elif [ "$start" -gt "$now" ]; then
      echo "start_read=after-now"
      exit 0
    fi
    # the mode it logged at its start: the last "Node configuration" line of its system.log, taken only when that
    # log was written since this JVM started (else the line may be of an earlier start, or of another log)
    log="$(tr '\0' '\n' < /proc/$pid/cmdline | sed -n 's/^-Dcassandra[.]logdir=//p' | head -1)"
    log="${log:-/var/log/cassandra}/system.log"
    m=
    lt=$(stat -c '%Y' "$log" 2>/dev/null)
    if [ -n "$lt" ] && [ "$lt" -ge "$start" ]; then
      m=$(grep -a 'Node configuration:\[' "$log" 2>/dev/null | tail -1 \
          | sed -n 's/.*[[; ]storage_compatibility_mode=\([A-Z_0-9]*\).*/\1/p')
    fi
    [ -z "$m" ] || echo "logged=$m"
    if [ "$mtime" -gt "$now" ]; then
      echo "future=yes"
      exit 0
    fi
    # Changed since that start, by content when the record of the config it started with (config_snapshot.yml of
    # cassandra_service) is the record of this JVM (its pid, its start within 2 seconds) and has the file: its
    # checksum then (a chmod, a chown or a relabel is no change). Else by the later of its mtime and ctime (a file
    # moved or copied in with its old mtime has a new ctime; a chmod then reads as a change too: a restart clears
    # it). A change is pending only when the mode it logged at that start is not there to tell (with it, the logged
    # mode against the file decides)
    rpid= rstart= rsum=
    if [ -r "$R" ]; then
      rpid=$(sed -n 's/^ *"pid": *"*\([0-9]*\)"*,*$/\1/p' "$R" | head -1)
      rstart=$(sed -n 's/^ *"start": *\([0-9.]*\),*$/\1/p' "$R" | head -1)
      rsum=$(sed -n 's/^ *"[^"]*\/cassandra[.]yaml": *"\([0-9a-f]*\)",*$/\1/p' "$R" | head -1)
    fi
    changed=
    if [ "$rpid" = "$pid" ] && [ -n "$rsum" ] && [ -n "$rstart" ] \
        && awk -v a="$rstart" -v b="$start" 'BEGIN {d = a - b; exit !(d < 2 && d > -2)}'; then
      [ "$(sha1sum < "$F" 2>/dev/null | cut -c1-40)" = "$rsum" ] || changed=yes
    elif [ "$mtime" -gt "$start" ] || [ "${ctime:-0}" -gt "$start" ]; then
      changed=yes
    fi
    [ -z "$changed" ] || [ -n "$m" ] || echo "pending=yes"
    exit 0
  environment:
    F: "{{ _cassandra_service_conf_dir }}/cassandra.yaml"
    R: "{{ _cassandra_service_config_snapshot }}"
  register: cassandra_storage_mode_read
  changed_when: false
  check_mode: false  # a read

# The mode it runs, live: system_views.settings has the storage_compatibility_mode it read at its start (empty when
# its cassandra.yaml had no such line: CASSANDRA_4). Over CQL as the operations log in (keyspaces.yml); not read
# (cqlsh missing, a login refused, the node not up): the log line, the record or the file times tell instead
- name: Read the storage_compatibility_mode the running Cassandra runs (system_views.settings)
  community.cassandra.cassandra_cqlsh:
    execute: "SELECT value FROM system_views.settings WHERE name = 'storage_compatibility_mode';"
    transform: raw
    cqlsh_host: >-
      {{ cassandra_rpc_address | default('')
         if cassandra_rpc_address | default('') not in ['', 'localhost', '0.0.0.0'] else '127.0.0.1' }}
    username: "{{ cassandra_cql_username | default(omit, true) }}"
    cqlsh_cmd: "{{ cassandra_cqlsh_command | default(omit, true) }}"  # (a cqlsh outside root's PATH, e.g. a virtualenv)
    password: "{{ cassandra_cql_password | default(omit, true) }}"
  register: cassandra_storage_mode_cql
  failed_when: false
  changed_when: false
  check_mode: false  # a SELECT
  when: "'running=yes' in cassandra_storage_mode_read.stdout_lines"
