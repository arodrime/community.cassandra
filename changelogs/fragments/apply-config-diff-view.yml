minor_changes:
  - "apply_config playbook - shows the settings that differ instead of each node's diff: per file, each setting with the inventory's value and the nodes already on it, then the value of each node to change, with its nodes (``← differs``); the JVM options and ``cassandra-env.sh`` lines are settings too, the owner, group and mode of a file or a data directory one setting, secrets masked. Then what each node gets, grouped (``node2, node4  would apply, then restart``). In the plan before the question of a real run, in the recap under ``--check``; a real run ends with the outcomes."
  - "import_cluster playbook - the report's settings share the aligned columns of apply_config (one column for the nodes up to 30 characters, ``← differs`` aligned; a setting name over 40 characters on a line of its own)."
