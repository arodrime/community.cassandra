trivial:
- "import_cluster - a ``-Djava.rmi.server.hostname`` line added outside any block of ``cassandra-env.sh`` at another place than the stock one (at the end of the file, the stock line still commented out) no longer fails the self-check when Cassandra is not running or the file changed since it started: the import read it as ``cassandra_jmx_rmi_hostname``, and bash adds the same option wherever the line sits, unless another line or the unit's ``JVM_EXTRA_OPTS`` sets it too (still a difference then)."
