minor_changes:
  - >-
    cassandra_config role - remote JMX over TLS with ``cassandra_jmx_ssl_enabled``, ``cassandra_jmx_ssl_keystore``,
    ``cassandra_jmx_ssl_keystore_password``, ``cassandra_jmx_ssl_truststore``,
    ``cassandra_jmx_ssl_truststore_password``, ``cassandra_jmx_ssl_need_client_auth``,
    ``cassandra_jmx_ssl_protocols`` and ``cassandra_jmx_ssl_cipher_suites``, which switch on the stock lines of the
    remote branch of ``cassandra-env.sh`` (4.0, 4.1, 5.0); refused with ``cassandra_local_jmx: true``, without a
    keystore and its password, client authentication without a truststore, a value bash would split or expand.
    Enabled, the role writes ``~/.cassandra/nodetool-ssl.properties`` for root and ``cassandra_user``.
  - >-
    nodetool modules - new option ``ssl`` (``nodetool --ssl``); the collection's playbooks and roles set it, and add
    ``--ssl`` to their own nodetool commands, with ``cassandra_jmx_ssl_enabled``. ``status`` and ``health_check``
    then run nodetool as root (its ``nodetool-ssl.properties``).
  - >-
    cassandra_medusa role - ``cassandra_medusa_nodetool_ssl`` defaults to ``true`` with
    ``cassandra_jmx_ssl_enabled``.
  - >-
    import_cluster playbook - reads remote JMX over TLS into the ``cassandra_jmx_ssl_*`` variables (its passwords to
    ``secrets.yml``), finds it from the running JVM's options before running nodetool (then with ``--ssl``), and
    stops with the way out when root has no ``~/.cassandra/nodetool-ssl.properties`` on such a node.
