minor_changes:
  - import_cluster playbook - the OS tuning already on the nodes (sysctl files and live values, the cassandra user's limits, the unit's limits, transparent huge pages, the data disks' read-ahead and scheduler and their udev rules, tuned, swap, time sync, firewall) is listed in the report, compared with what the roles set; what a variable covers is carried into the inventory (``cassandra_linux_sysctl`` and the file the nodes use, ``cassandra_linux_limits``, ``cassandra_service_limit_*``, ``cassandra_data_readahead_kb``, ``cassandra_linux_timesync``) so that nodes added later get the same tuning.
