---
# Empty nodes that are not members of the cluster, for a fresh start.
#
#   ansible-playbook community.cassandra.reset_node -e cassandra_target_nodes=node7
#
# For a node started once with the wrong config, or a failed bootstrap:
# Cassandra stopped and disabled, its data directories emptied. Refused on a
# node the ring lists, a running member, a node of another cluster.
#
# One screen, one question; --check shows it only.
#
# Options and defaults: ansible-playbook community.cassandra.help -e help_topic=reset_node
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight
  vars:
    _cassandra_preflight_target: reset  # what cassandra_target_nodes are
    _cassandra_preflight_node_views: true  # where the nodes stand (node_standing.yml)

- name: Reset the nodes
  hosts: "{{ cassandra_target_nodes }}"
  gather_facts: false
  become: true
  any_errors_fatal: true  # reset none of them if one is refused
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    # what an earlier play (or playbook of this run) read may no longer stand: this step reads it again
    - name: Read where the nodes stand again
      ansible.builtin.set_fact:
        _cassandra_node_standing_read: {}

    - name: Say what the run does
      ansible.builtin.debug:
        msg: "{{ 'read_reset' | community.cassandra.cassandra_phase(ansible_play_hosts_all) }}"
      run_once: true
      vars:
        cassandra_output: true  # a phase line (ops callback)
        cassandra_output_gap: true  # a block of its own

    # Cassandra is stopped and kept from starting at boot, then what its data,
    # commitlog, saved_caches, hints and cdc_raw directories hold is deleted (from
    # the inventory and the live cassandra.yaml). Refused on a node any up node of
    # the cluster lists in its ring (or when no other node answers as up), on a
    # running member, on a node of another cluster, and on paths that look wrong
    # (the full list: reset_node.yml of cassandra_service). Shown, then confirmed
    # once (cassandra_operation_confirm: false skips it); --check shows it only.
    # add_node (cassandra_add_node_reset) and replace_node
    # (cassandra_replace_node_reset) run the same reset themselves.
    - name: Reset this node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: reset_node.yml

    # DONE (CHECK under --check), then the add_node command for the nodes emptied
    - name: Say what was done
      ansible.builtin.debug:
        msg: >-
          {{ _nodes | community.cassandra.cassandra_reset_recap(
               check=ansible_check_mode, cluster=cassandra_cluster_name | default(''),
               add_command='add_node' | community.cassandra.cassandra_command(
                 inventory=ansible_inventory_sources, default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
                 hosts=cassandra_hosts | default(''), cwd=lookup('ansible.builtin.env', 'PWD'),
                 extra={'cassandra_target_nodes': _nodes | selectattr('todo') | map(attribute='node') | join(',')})) }}
      run_once: true
      vars:
        cassandra_output: true
        cassandra_output_gap: true  # a block of its own (ops callback)
        _nodes: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts_all if hostvars[h]._cassandra_node_reset_plan is defined -%}
          {%-   set p = hostvars[h]._cassandra_node_reset_plan -%}
          {%-   set _ = out.append({'node': h, 'delete': p.delete | default([]), 'stop': p.stop | default(false) | bool,
                                    'disable': p.disable | default(false) | bool,
                                    'todo': (p.delete | default([]) | length > 0) or p.stop | default(false) | bool
                                            or p.disable | default(false) | bool}) -%}
          {%- endfor -%}
          {{ out }}
