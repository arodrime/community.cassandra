---
# Records the checksums of the config files (and of the systemd unit, its drop-in) the running Cassandra started
# with, so a later run can tell a change still to apply by content (a file rewritten with the same content, or a
# change applied live, is not pending). Run after the start (and its wait): a file written since the JVM started is
# left out (what it read is unknown: pending until a restart), and the JVM is recorded (_jvm: its pid and start, as
# jvm_started.yml finds them), so that a later run trusts the record for that JVM only. A file cassandra_config left
# as it is (the same settings as its rendering, written another way: _cassandra_config_same_as) is recorded with the
# checksum of that rendering too, so that the file written back later as the role renders it is no restart. In one
# go (plugins/plugin_utils/cassandra_config_record.py, start), as the reader of the record reads them.
- name: Record the config Cassandra started with
  ansible.builtin.command:
    argv:
      - "{{ _cassandra_config_python | default(ansible_facts['python']['executable'] | default('/usr/bin/python3')) }}"
      - -c
      - "{{ lookup('ansible.builtin.file', role_path ~ '/../../plugins/plugin_utils/cassandra_config_record.py') }}"
      - start
      - "{{ _cassandra_service_config_snapshot }}"
      - "{{ _cassandra_service_conf_dir }}"
      - "--same={{ _cassandra_config_same_as | default({}) | to_json }}"
      - /etc/systemd/system/cassandra.service
      - "{{ _cassandra_service_environment_dropin }}"
  changed_when: true
