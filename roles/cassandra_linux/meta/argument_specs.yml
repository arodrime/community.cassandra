---
argument_specs:
  main:
    short_description: Linux settings for Cassandra nodes.
    description:
      - Kernel settings, swap, transparent huge pages, time sync, limits,
        and read-ahead and IO scheduler of the data disk.
      - In containers, settings are written but not applied live, and what runs
        at boot (the THP unit, the disks' udev rule) is left out, unless
        O(cassandra_linux_apply_live=true).
    options:
      cassandra_linux_manage:
        type: bool
        default: true
        description:
          - V(false) leaves the OS settings of this node as they are, the role changes nothing on it.
            The C(import_cluster) playbook sets it on the nodes it finds set up by other means.
      cassandra_data_disk_tuning:
        type: bool
        default: true
        description:
          - Tune the read-ahead and IO scheduler of the devices under the Cassandra
            data and commitlog directories. V(false) leaves them as they are, and what an
            earlier run set to keep them (udev rule, LVM metadata) too.
      cassandra_data_block_device:
        type: str
        default: ""
        description:
          - Device to tune instead of finding it from the directories, for example C(/dev/sdb),
            C(/dev/nvme0n1), C(/dev/vg/lv) or C(/dev/md0); a partition is taken as its disk, the
            devices under it are tuned too, unless shared (O(cassandra_data_tune_shared_devices)).
            A device that can't be tuned fails the role.
          - When empty (and O(cassandra_data_block_devices) too), the devices are found
            from the data and commitlog directories, from the filesystem's device (LVM volume,
            md array, dm-crypt, multipath) down to the disks.
      cassandra_data_tune_shared_devices:
        type: bool
        default: false
        description:
          - Also tune the devices under the top one that hold something else, for example the
            disk of a volume group shared with the OS. By default they are left alone and the
            role says so.
      cassandra_data_dir:
        type: path
        description:
          - Cassandra's data directory, used to find the data disk. No default in this role.
      cassandra_data_lvchange_running:
        type: bool
        default: false
        description:
          - C(lvchange --readahead), which keeps the read-ahead of an LVM volume in its metadata, reloads the
            volume (its I/O suspended a moment). By default it is done at a run with Cassandra stopped (a new node,
            before it starts); meanwhile the read-ahead is set live and kept by the udev rule.
          - V(true) also runs it under a running Cassandra.
      cassandra_data_tune_os_volumes:
        type: bool
        default: true
        description:
          - Tune the filesystem Cassandra's directories are on also when it is one of the OS (C(/), C(/var)...),
            with a note (its other files read with the same read-ahead). An LVM volume of the OS is kept by the
            udev rule, not reloaded with C(lvchange).
          - V(false) leaves it alone, with a note.
      cassandra_data_readahead_kb:
        type: int
        default: 4
        description:
          - Read-ahead of the data devices, in KB. The IO scheduler is set to none
            on SSD/NVMe only.
      cassandra_linux_tuned_manage:
        type: bool
        default: true
        description:
          - When the profiles tuned runs would set the read-ahead or IO scheduler of the Cassandra devices
            (RHEL's default profiles set C(readahead=>4096)), have it run the role's C(cassandra-disks)
            profile after them, which leaves those devices alone (it applies the profiles again, live, once).
          - V(false) only warns.
      cassandra_linux_tuned_switch_running:
        type: bool
        default: false
        description:
          - Switching tuned to the C(cassandra-disks) profile applies the active profiles again, live (kernel
            settings, CPU, disks, their scripts). By default it is done at a run with Cassandra stopped (a new node,
            before it starts); under a running Cassandra the profile is only written and the role says how to switch
            (C(tuned-adm profile ...)). Until then tuned sets its read-ahead on the Cassandra devices again when it
            starts.
          - V(true) also switches under a running Cassandra.
      cassandra_sysfs_block_root:
        type: path
        default: /sys/block
        description:
          - sysfs block root used for the disk tuning. Only meant for tests.
      cassandra_linux_timesync:
        type: bool
        default: true
        description:
          - Install and start time sync. chrony (kept where already installed), or
            systemd-timesyncd on Debian/Ubuntu without chrony.
          - V(false) leaves the host's time sync alone, for example when it is
            managed by other means with the site's NTP servers.
      cassandra_offline:
        type: bool
        default: false
        description:
          - Air-gapped hosts, nothing is downloaded. The time sync package is not
            installed, only started when present (a warning otherwise).
      cassandra_linux_apply_live:
        type: raw
        default: auto
        description:
          - Apply kernel settings live (sysctl, swapoff, THP, disk tuning), not just persist them.
          - C(auto) applies them everywhere except in containers (Ansible's
            virtualization facts, or O(cassandra_linux_container_types)), where they
            belong to the host. V(true) or V(false) forces it; anything else fails the role.
      cassandra_linux_container_types:
        type: list
        elements: str
        default: [docker, podman, container, containerd, lxc]
        description:
          - Values of C(ansible_virtualization_type) treated as containers.
      cassandra_linux_sysctl:
        type: dict
        default:
          vm.swappiness: 1
          vm.max_map_count: 1048575
          vm.zone_reclaim_mode: 0
          net.ipv4.tcp_keepalive_time: 60
          net.ipv4.tcp_keepalive_probes: 3
          net.ipv4.tcp_keepalive_intvl: 10
          net.core.rmem_max: 16777216
          net.core.wmem_max: 16777216
          net.core.rmem_default: 16777216
          net.core.wmem_default: 16777216
          net.core.optmem_max: 40960
          net.ipv4.tcp_rmem: "4096 87380 16777216"
          net.ipv4.tcp_wmem: "4096 65536 16777216"
        description:
          - Kernel settings, written to O(cassandra_linux_sysctl_file) and
            applied live (not from a container, which shares the host kernel).
      cassandra_linux_sysctl_file:
        type: path
        default: /etc/sysctl.d/60-cassandra.conf
        description:
          - Where O(cassandra_linux_sysctl) is written. The same keys are removed
            from C(/etc/sysctl.conf), which is read last and would win.
      cassandra_linux_limits:
        type: dict
        default: {memlock: unlimited, nofile: 1048576, nproc: 32768, as: unlimited}
        description:
          - Limits of the cassandra user, in C(/etc/security/limits.d/cassandra.conf),
            for tools run by hand as cassandra. The service gets its own limits from
            its systemd unit (C(cassandra_service_limit_*)).
      cassandra_data_block_devices:
        type: list
        elements: str
        default: []
        description:
          - Several devices to tune (JBOD data directories, a commitlog disk),
            e.g. C(["/dev/nvme0n1", "/dev/nvme1n1"]). Empty uses
            O(cassandra_data_block_device), else finds the devices of the
            data directories and of C(cassandra_commitlog_dir).
