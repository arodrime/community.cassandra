minor_changes:
  - import_cluster playbook - reads the account Cassandra runs as (its running process) and the owner, group and mode of the config files, the JMX users' files and the data, commitlog, hints, saved caches and log directories; writes ``cassandra_user``, ``cassandra_group``, ``cassandra_config_user``, ``cassandra_config_group``, ``cassandra_config_mode``, ``cassandra_config_public_mode`` and ``cassandra_config_file_permissions`` so that the roles keep them, and its self-check compares the owner, group and mode the roles would set with the nodes' (a difference makes the inventory not valid).
  - cassandra_config role - ``cassandra_user`` and ``cassandra_group`` (default ``cassandra``, the account Cassandra runs as, also used by ``cassandra_service``) own the directories the role creates and the JMX users' files, and ``cassandra_group`` is the default group of the config files. ``cassandra.yaml`` and the ``jvm*-server.options`` files are mode ``0640`` (``cassandra_config_mode``), the other config files ``0644`` (``cassandra_config_public_mode``) so that ``nodetool`` run by any user reads the JMX port in ``cassandra-env.sh``; ``cassandra_config_file_permissions`` sets a file apart. The owner, group and mode are set on the files whose content the role leaves as it is too, and listed in the report.
