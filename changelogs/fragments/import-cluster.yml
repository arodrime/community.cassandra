minor_changes:
  - New import_cluster playbook - reads a running cluster into an inventory for the roles (groups, variables, hand edits and drift in a report), without changing anything on the nodes; passwords go to separate files, vaulted when a vault password file is given. Nodes are named by their hostname (``import_cluster_host_names``: hostname, fqdn or ip) with ``ansible_host`` their address in the ring, the variables are grouped by subject, and the report starts with the differences between nodes.
