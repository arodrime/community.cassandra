---
# Runs nodetool cleanup on a cluster (removes the data a node no longer owns,
# after nodes were added), with the cluster checked before each batch:
#   ansible-playbook -i inventory community.cassandra.cleanup -e cassandra_hosts=my_cluster
# cassandra_cleanup_mode: sequential (default, one node at a time), rack (the
# nodes of one rack together, rack by rack), dc (one datacenter at a time) or
# all (every node at once: heavy disk I/O everywhere). cassandra_cleanup_jobs:
# compaction threads per node (default 2). Resume an interrupted run with
# -e cassandra_rolling_resume=true.
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Cleanup
  hosts: "{{ cassandra_hosts | default('cassandra') }}"
  gather_facts: false
  vars:
    cassandra_service_node_action: cleanup
    cassandra_cleanup_mode: sequential
    cassandra_cleanup_jobs: 2
    cassandra_cleanup_timeout: 86400  # seconds, per batch
  tasks:
    - name: Check the mode
      ansible.builtin.assert:
        that: cassandra_cleanup_mode in ['sequential', 'rack', 'dc', 'all']
        fail_msg: "cassandra_cleanup_mode must be sequential, rack, dc or all (got {{ cassandra_cleanup_mode }})"
        quiet: true
      run_once: true

    - name: Set up the progress file
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: progress.yml
        public: true

    # Batches in inventory order, grouped by the dc/rack each node declares
    - name: Work out the batches
      ansible.builtin.set_fact:
        _cassandra_cleanup_batches: >-
          {%- set batches = {} -%}
          {%- for h in ansible_play_hosts -%}
          {%-   set p = hostvars[h]._cassandra_preflight -%}
          {%-   set key = {'sequential': h, 'rack': p.cassandra_dc ~ '/' ~ p.cassandra_rack,
                          'dc': p.cassandra_dc, 'all': 'all'}[cassandra_cleanup_mode] -%}
          {%-   set _ = batches.update({key: batches.get(key, []) + [h]}) -%}
          {%- endfor -%}
          {{ batches.values() | list }}
      run_once: true

    - name: Run the batches
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: cleanup_batch.yml
        apply:
          run_once: true
      loop: "{{ _cassandra_cleanup_batches }}"
      loop_control:
        loop_var: cassandra_cleanup_batch
        label: "{{ cassandra_cleanup_batch | join(', ') }}"
      run_once: true

    - name: Check the cluster after the last batch
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: cluster_health.yml
        apply:
          run_once: true
      run_once: true

    - name: Print the summary
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: summary.yml
