---
# upgrade, before its drain (_cassandra_axonops_download_only), Cassandra still running: the repository is in place
# already (main.yml). The packages the plan installs are downloaded as files into /var/cache/cassandra-axonops (a
# package manager's own cache does not keep them: dnf drops them at its next transaction), or the package files
# given copied there; axon-agent installed from its file (the running Cassandra does not read it; its account,
# config and service are set up next). In the node's window (_cassandra_axonops_cached) the Java agent package is
# installed from its file, the repositories not read (_cassandra_axonops_downloaded: the files, read as package
# files then).
- name: Note what to install
  ansible.builtin.import_tasks: wanted.yml

- name: The directory of the package files
  ansible.builtin.file:
    path: /var/cache/cassandra-axonops
    state: directory
    mode: "0755"

- name: Copy the package files given
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/var/cache/cassandra-axonops/{{ item | basename }}"
    mode: "0644"
  loop: "{{ _cassandra_axonops_files.paths | default([]) }}"

- name: Download the packages from the repositories
  when:
    - _cassandra_axonops_files.paths | default([]) | length == 0
    - _cassandra_axonops_package_change | bool or (_cassandra_axonops_latest + _cassandra_axonops_reinstall) | length > 0
  block:
    - name: Refresh the apt cache (Debian & Ubuntu)
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      register: cassandra_axonops_download_cache
      until: cassandra_axonops_download_cache is succeeded
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Read the AxonOps repository (RedHat)
      ansible.builtin.import_tasks: repository_read.yml

    # (an earlier download's files out first: the ones there are this run's)
    - name: Remove the files of an earlier download
      ansible.builtin.shell: rm -f /var/cache/cassandra-axonops/*axon-*.deb /var/cache/cassandra-axonops/*axon-*.rpm
      changed_when: false

    # dnf download: dnf-plugins-core on dnf 4 (built in on dnf 5)
    - name: Install the download command of dnf (RedHat)
      ansible.builtin.dnf:
        name: "dnf-command(download)"
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Download the packages
      ansible.builtin.command:
        argv: >-
          {{ ['apt-get', 'download'] + _specs if ansible_facts['os_family'] == 'Debian'
             else ['dnf', 'download', '--destdir', '/var/cache/cassandra-axonops',
                   '--arch', ansible_facts['architecture'], '--arch', 'noarch'] + _specs }}
        chdir: /var/cache/cassandra-axonops
      environment:
        DEBIAN_FRONTEND: noninteractive
      vars:
        # axon-agent and the Java agent package, pinned or the newest
        _sep: "{{ '=' if ansible_facts['os_family'] == 'Debian' else '-' }}"
        _specs:
          - "axon-agent{{ (_sep ~ cassandra_axonops_agent_version) if cassandra_axonops_agent_version | string else '' }}"
          - >-
            {{ _cassandra_axonops_java_package }}{{ (_sep ~ cassandra_axonops_java_agent_version)
            if cassandra_axonops_java_agent_version | string else '' }}
      register: cassandra_axonops_download
      changed_when: true
      retries: 3
      until: cassandra_axonops_download is succeeded

    # (dnf download names a file <its checksum>-<name>.rpm when the repository lists a name twice)
    - name: Name the files downloaded as their packages
      ansible.builtin.shell: |
        cd /var/cache/cassandra-axonops || exit 1
        for f in *-axon-*.rpm; do
          case "$f" in axon-*) ;; *) [ -e "$f" ] && mv -f "$f" "axon-${f#*-axon-}" ;; esac
        done
        exit 0
      changed_when: false
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Find the files downloaded
      ansible.builtin.find:
        paths: /var/cache/cassandra-axonops
        patterns: ["axon-*.deb", "axon-*.rpm"]
      register: cassandra_axonops_downloaded_files
  rescue:
    - name: Stop on the download, Cassandra still running
      ansible.builtin.fail:
        msg: "{{ _said | join(_nl) }}"
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _parts: "{{ (ansible_failed_result | default({})).stderr | default('') or ansible_failed_result.msg | default('') }}"
        _cause: "{{ (_parts | community.cassandra.cassandra_axonops_stop_parts).cause | community.cassandra.cassandra_url_masked }}"
        _said: >-
          {{ ['STOPPED  cassandra_axonops  ' ~ inventory_hostname, '  Cassandra still runs, not drained',
              '  the AxonOps packages could not be downloaded:']
             + ['    ' ~ _cause, 'WAY OUT  check cassandra_axonops_repository_url and the login, then run'
                ~ ' this phase again'] | community.cassandra.cassandra_fit }}

- name: Note the files to install in the node's window
  ansible.builtin.set_fact:
    _cassandra_axonops_downloaded: >-
      {{ cassandra_axonops_downloaded_files.files | default([]) | map(attribute='path') | list
         if _cassandra_axonops_files.paths | default([]) | length == 0
         else _cassandra_axonops_files.paths | map('basename') | map('regex_replace', '^', '/var/cache/cassandra-axonops/')
              | list }}

# (axon-agent's install script runs adduser, absent from minimal images)
- name: Install adduser (Debian & Ubuntu)
  ansible.builtin.apt:
    name: adduser
  when:
    - ansible_facts['os_family'] == 'Debian'
    - "'package axon-agent' in _cassandra_axonops_items | map(attribute='item')"

- name: Install axon-agent from its file (Debian & Ubuntu)
  ansible.builtin.apt:
    deb: "{{ _agent_file }}"
    allow_downgrade: true
  vars:
    _agent_file: "{{ _cassandra_axonops_downloaded | select('search', '/axon-agent[-_][0-9]') | first }}"
  register: cassandra_axonops_packages
  when:
    - ansible_facts['os_family'] == 'Debian'
    - "'package axon-agent' in _cassandra_axonops_items | map(attribute='item')"

- name: Install axon-agent from its file (RedHat)
  ansible.builtin.dnf:
    name: "{{ _agent_file }}"
    allow_downgrade: true
    disable_gpg_check: true
  vars:
    _agent_file: "{{ _cassandra_axonops_downloaded | select('search', '/axon-agent[-_][0-9]') | first }}"
  register: cassandra_axonops_packages_rpm
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - "'package axon-agent' in _cassandra_axonops_items | map(attribute='item')"

- name: Note whether the packages changed
  ansible.builtin.set_fact:
    _cassandra_axonops_packages_changed: >-
      {{ cassandra_axonops_packages is changed or cassandra_axonops_packages_rpm is changed }}
