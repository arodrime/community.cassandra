---
# The recap of a node operation: DONE, FAILED or CHECK, then the nodes grouped
# by outcome (cassandra_op_recap, the results of _cassandra_op_results).
# cassandra_service_summary_operation: the playbook's name, else from
# cassandra_service_node_action, else from the actions recorded.
- name: Summary
  ansible.builtin.debug:
    msg: >-
      {{ _cassandra_op_results | community.cassandra.cassandra_op_recap(check=ansible_check_mode,
                                                                        cluster=_cluster,
                                                                        operation=cassandra_service_summary_operation | default(''),
                                                                        action=cassandra_service_node_action | default(''),
                                                                        seconds=_seconds) }}
  run_once: true
  vars:
    cassandra_output: true
    cassandra_output_gap: true  # a block of its own (ops callback)
    _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"
    # the run's time, from its first line (cluster_banner.yml)
    _seconds: >-
      {{ (now().timestamp() | int - _localhost['_cassandra_run_start'] | int)
         if _localhost['_cassandra_run_start'] | default('') else none }}
    _localhost: "{{ hostvars['localhost'] | default({}) }}"
