minor_changes:
  - "update_java - new playbook that moves a running cluster to the Java in ``cassandra_java_version``: checked first (a Java the series runs on, no JVM option it reads that a move to it is refused with, the options file the role writes for it), one question, then one node at a time Java installed and made the default, the config written, the node drained and restarted, the cluster checked healthy before and after. Nodes already on that Java are skipped; ``-e cassandra_rolling_resume=true`` resumes an interrupted run (https://github.com/ansible-collections/community.cassandra/issues/334)."
  - "upgrade - new playbook that upgrades a running cluster to the version in the inventory, one phase per run (``-e cassandra_upgrade_phase=``): ``preflight`` (the target packages available, an upgrade path the series allows, the target series' Java and JVM options, free space, the target config shown, the settings the target series ignores; nothing changed), ``prepare`` (a snapshot of every keyspace and a copy of the config on each node, after one question), ``canary`` (one node, ``cassandra_target_nodes`` or the first non-seed), ``rolling`` (the other nodes one at a time, the cluster checked around each, an upgraded node skipped), ``sstables`` (``nodetool upgradesstables`` one node at a time; ``cassandra_upgrade_sstables_jobs``, ``cassandra_upgrade_sstables_timeout``) and ``cleanup`` (the pre-upgrade snapshots removed). Each phase says the next (https://github.com/ansible-collections/community.cassandra/issues/334)."
  - "sync_clocks - new playbook that shows each node's clock as its time sync daemon reports it (synchronised, source, offset, error bound) with a verdict, then, after one question, brings time sync up where it is missing and corrects the clocks: small corrections live, a running node whose clock needs a step in a restart window (drained, stopped, the clock set, started again), one node at a time. ``--check`` changes nothing; a run interrupted in a window finds it and ends it first. Settings ``cassandra_clock_max_offset_ms``, ``cassandra_clock_step_ms``, ``cassandra_clock_sync_timeout`` (https://github.com/ansible-collections/community.cassandra/issues/334)."
  - "create_cluster - the clocks of the nodes are checked the way ``sync_clocks`` does before the first node starts (time sync just started by ``cassandra_linux`` waited for); refused, nothing started, when a node is not in sync. ``cassandra_clock_check: false`` skips it (https://github.com/ansible-collections/community.cassandra/issues/334)."
