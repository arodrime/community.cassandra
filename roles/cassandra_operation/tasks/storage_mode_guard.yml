---
# 5.0: refuse a restart that would take Cassandra back to an earlier storage_compatibility_mode than the one it
# runs (a cassandra.yaml edited back by hand, or an inventory behind the node: Cassandra starts with the earlier
# mode, or refuses to start on the sstables it wrote). The mode it runs as storage_mode_read.yml reads it (over CQL,
# else the line it logged at its start); not known: nothing refused. Once for the nodes of the play: one of them
# refused stops the run before any is restarted. _cassandra_storage_mode_written: true when the inventory's mode is
# written first (cassandra_config), else the file's mode is the one restarted with. Read-only, under --check too.
- name: Read the mode Cassandra runs
  ansible.builtin.include_tasks: storage_mode_read.yml
  when: cassandra_version | default('') == '50x'

- name: The restarts keep the storage_compatibility_mode Cassandra runs, or a later one
  ansible.builtin.assert:
    that: _back | length == 0
    fail_msg: >-
      {{ (['A restart would take ' ~ _back | map(attribute='node') | join(', ') ~ ' back to an earlier'
           ~ ' storage_compatibility_mode than the one Cassandra runs (5.0 moves CASSANDRA_4, UPGRADING, NONE, never'
           ~ ' back). Nothing was changed.']
          + _back | map(attribute='row') | list
          + ['WAY OUT  ' ~ _back | map(attribute='way_out') | join(' ') ~ ' Then run this again.']) | join(_nl) }}
    quiet: true
  run_once: true
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"
    _written: "{{ _cassandra_storage_mode_written | default(false) | bool }}"
    _back: >-
      {%- set out = [] -%}
      {%- for h in ansible_play_hosts if hostvars[h].cassandra_version | default('') == '50x' -%}
      {%-   set hv = hostvars[h] -%}
      {%-   set inventory = hv.cassandra_storage_compatibility_mode | default('NONE') -%}
      {%-   set read = {'inventory_hostname': h,
                        'cassandra_storage_mode_read': hv.cassandra_storage_mode_read | default({}),
                        'cassandra_storage_mode_cql': hv.cassandra_storage_mode_cql | default({})} -%}
      {%-   set running = read | community.cassandra.cassandra_storage_mode_back(inventory if _written else none) -%}
      {%-   if running -%}
      {%-     set file = hv.cassandra_storage_mode_read.stdout_lines | default([]) | select('match', '^yaml=')
                         | map('regex_replace', '^yaml=', '') | first | default('') or 'CASSANDRA_4 (no such line)' -%}
      {%-     set _ = out.append({
                'node': h,
                'row': '  ' ~ h ~ '  runs ' ~ running ~ ', its cassandra.yaml '
                       ~ ('would have ' ~ inventory if _written else 'has ' ~ file),
                'way_out': ('On ' ~ h ~ ', set cassandra_storage_compatibility_mode: ' ~ running ~ ' in the inventory'
                            ~ (' (apply_config then writes it).' if _written
                               else ', then run apply_config --limit ' ~ h ~ ' (it writes it back).'))
                           if inventory != running
                           else 'On ' ~ h ~ ', run apply_config --limit ' ~ h ~ ' (it writes ' ~ running ~ ' back).'}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  when: cassandra_version | default('') == '50x'
