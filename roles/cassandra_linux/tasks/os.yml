---
# The OS settings for Cassandra (see main.yml)
- name: Include vars for OS family
  ansible.builtin.include_vars:
    file: "{{ ansible_facts['os_family'] }}.yml"

# Persistent settings (sysctl.conf, fstab, THP unit) are always written;
# applying them live is skipped in containers, where /proc/sys and /sys
# belong to the host kernel (read-only, or worse, the host's if privileged).
- name: Decide whether kernel settings are applied live
  ansible.builtin.set_fact:
    _cassandra_linux_live: >-
      {{ not ('container' in ansible_facts['virtualization_tech_guest'] | default([])
              or ansible_facts['virtualization_type'] | default('') in cassandra_linux_container_types)
         if cassandra_linux_apply_live | string | lower == 'auto' else cassandra_linux_apply_live | bool }}

- name: Look for chrony (kept rather than replaced)
  ansible.builtin.stat:
    path: /usr/sbin/chronyd
  register: cassandra_linux_chrony

- name: Keep what was found
  ansible.builtin.set_fact:
    _cassandra_chrony_present: "{{ cassandra_linux_chrony.stat.exists }}"

- name: Snapshot the current OS settings (change report)
  ansible.builtin.include_tasks: snapshot.yml

- name: Disable Swap
  ansible.builtin.command: swapoff -a
  when:
    - _cassandra_linux_live
    - ansible_facts['swaptotal_mb'] > 0

- name: Remove swap partitions
  ansible.posix.mount:
    path: swap
    state: absent

# Absent on minimal images
- name: Directory of the kernel settings file
  ansible.builtin.file:
    path: "{{ cassandra_linux_sysctl_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Kernel settings for Cassandra
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: "{{ cassandra_linux_sysctl_file }}"
    sysctl_set: "{{ _cassandra_linux_live }}"
    reload: "{{ _cassandra_linux_live }}"
  loop: "{{ cassandra_linux_sysctl | dict2items }}"

# /etc/sysctl.conf is read last: a line left there by an earlier version of
# the role would win over the file above
- name: Remove the same settings from /etc/sysctl.conf
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    state: absent
    sysctl_file: /etc/sysctl.conf
    reload: false
  loop: "{{ cassandra_linux_sysctl | dict2items }}"
  when: cassandra_linux_sysctl_file != '/etc/sysctl.conf'

- name: Install time sync package
  ansible.builtin.package:
    name: "{{ _cassandra_timesync_pkg }}"
    state: present
  retries: 3
  register: cassandra_timesync_install
  # --check: without the repositories cassandra_repository removes (no_repository.yml)
  module_defaults:
    ansible.builtin.dnf:
      disablerepo: "{{ _cassandra_repository_check_removed | default([]) }}"
    ansible.legacy.dnf:
      disablerepo: "{{ _cassandra_repository_check_removed | default([]) }}"
  when:
    - cassandra_linux_timesync | bool
    - not cassandra_offline | bool

- name: Look for the time sync service (offline)
  ansible.builtin.command:
    argv: [systemctl, cat, "{{ _cassandra_timesync_service }}"]
  register: cassandra_timesync_unit
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cassandra_linux_timesync | bool
    - cassandra_offline | bool

- name: Say the time sync service is missing (offline)
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ _cassandra_timesync_pkg }} is not installed on {{ inventory_hostname }} and cassandra_offline
      downloads nothing: install it from your image or mirror (Cassandra needs synchronized clocks), or set
      cassandra_linux_timesync to false if the host's time sync is managed another way.
  when:
    - cassandra_linux_timesync | bool
    - cassandra_offline | bool
    - cassandra_timesync_unit.rc != 0

- name: Ensure timesync service starts
  ansible.builtin.service:
    name: "{{ _cassandra_timesync_service }}"
    enabled: yes
    state: started
  when:
    - cassandra_linux_timesync | bool
    - not (cassandra_offline | bool and cassandra_timesync_unit.rc != 0)
    - not (ansible_check_mode and cassandra_timesync_install is changed)  # not installed yet under --check
  register: cassandra_timesync_service_result
  tags:
  - molecule-idempotence-notest # Ubuntu 2404 timesyncd issue

# For what runs as cassandra outside the systemd unit (tools run by hand):
# the unit sets its own limits, systemd ignores these files
- name: Limits of the cassandra user
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (community.cassandra.cassandra_linux)
      {% for name, value in cassandra_linux_limits.items() %}
      cassandra - {{ name }} {{ value }}
      {% endfor %}
    dest: /etc/security/limits.d/cassandra.conf
    mode: "0644"

- name: Remove the block earlier versions of the role wrote to limits.conf
  ansible.builtin.blockinfile:
    path: /etc/security/limits.conf
    marker: "#<!-- {mark} ANSIBLE MANAGED BLOCK -->"
    state: absent

- name: Extra Limit for RH Derived Distros
  ansible.builtin.lineinfile:
    path: /etc/security/limits.d/90-nproc.conf
    regexp: "^\\* - nproc 32768"
    line: "* - nproc 32768"
    create: yes
  when: ansible_facts['os_family'] == "RedHat"
  register: cassandra_linux_nproc

- name: Ensure disable-thp service file exists
  ansible.builtin.copy:
    src: disable-thp.service
    dest: /etc/systemd/system/
    mode: "0644"
  register: thp

- name: Ensure service to disable THP is enabled and started
  ansible.builtin.systemd:
    name: disable-thp
    daemon_reload: true
    state: started
    enabled: true
  when:
    - _cassandra_linux_live
    - thp.changed
    - not ansible_check_mode  # the unit file only exists once really copied

# The disks to tune: cassandra_data_block_devices (or the single
# cassandra_data_block_device), or else the disks of the data and commitlog
# directories. A partition resolves to its disk. LVM, md RAID and dm-crypt
# devices are not guessed: set the variables to the disks. The lookups only
# read, so they also run in check mode.
- name: Keep the disks set explicitly
  ansible.builtin.set_fact:
    _cassandra_disks_explicit: >-
      {{ (cassandra_data_block_devices + ([cassandra_data_block_device] if cassandra_data_block_device else [])) | unique | list }}

- name: Find the device backing each data and commitlog directory
  ansible.builtin.command:
    argv: [findmnt, -n, -o, SOURCE, --target, "{{ item }}"]
  loop: "{{ _paths }}"
  register: cassandra_data_findmnt
  changed_when: false
  failed_when: false
  check_mode: false
  when: _cassandra_disks_explicit | length == 0
  vars:
    _paths: >-
      {{ ((cassandra_data_file_directories | default([])) + [cassandra_data_dir | default('')]
          + [cassandra_commitlog_dir | default('')]) | select | unique | list }}

# findmnt shows a btrfs subvolume as /dev/sda1[/@]
- name: Keep the devices to resolve
  ansible.builtin.set_fact:
    _cassandra_disk_sources: >-
      {{ _cassandra_disks_explicit if _cassandra_disks_explicit | length > 0
         else cassandra_data_findmnt.results | default([]) | selectattr('stdout', 'defined')
              | map(attribute='stdout') | map('regex_replace', '\[.*\]$', '') | map('trim') | select | unique | list }}

- name: Resolve the devices
  ansible.builtin.command:
    argv: [lsblk, -J, -nd, -o, "KNAME,PKNAME,TYPE", "{{ item }}"]
  loop: "{{ _cassandra_disk_sources | select('match', '/dev/') | list }}"
  register: cassandra_data_lsblk
  changed_when: false
  failed_when: false
  check_mode: false

# An explicit device lsblk can't read (e.g. no udev in a container) is taken
# as a disk name as is; the sysfs check below then confirms it.
- name: Pick the disks to tune
  ansible.builtin.set_fact:
    _cassandra_disks: >-
      {%- set out = [] -%}
      {%- for source in _cassandra_disk_sources -%}
      {%-   set r = cassandra_data_lsblk.results | selectattr('item', 'equalto', source) | first | default({}) -%}
      {%-   set dev = ((r.stdout | from_json).blockdevices | first | default({}))
                      if r.rc | default(1) == 0 and r.stdout | default('') != '' else {} -%}
      {%-   if dev.type | default('') == 'part' -%}{%- set _ = out.append(dev.pkname) -%}
      {%-   elif dev.type | default('') == 'disk' -%}{%- set _ = out.append(dev.kname) -%}
      {%-   elif _cassandra_disks_explicit | length > 0 and dev == {} -%}{%- set _ = out.append(source | basename) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out | unique | list }}

- name: Find the explicit devices that are not disks or partitions (LVM, RAID...)
  ansible.builtin.set_fact:
    _cassandra_disks_unusable: >-
      {{ cassandra_data_lsblk.results | default([]) | selectattr('stdout', 'defined')
         | rejectattr('stdout', 'search', '"type": ?"(disk|part)"') | selectattr('rc', 'equalto', 0)
         | map(attribute='item') | list if _cassandra_disks_explicit | length > 0 else [] }}

- name: Check the disks under sysfs
  ansible.builtin.stat:
    path: "{{ cassandra_sysfs_block_root }}/{{ item }}/queue"
  loop: "{{ _cassandra_disks }}"
  register: cassandra_data_disk_stat

- name: Refuse data disks that can't be tuned
  ansible.builtin.fail:
    msg: >-
      {{ (_missing or _cassandra_disks_explicit) | join(', ') }} (from cassandra_data_block_device(s)) can't be tuned
      ({{ cassandra_sysfs_block_root }}/<disk>/queue not found): set the whole disks (e.g. /dev/sdb, /dev/nvme0n1),
      or leave the variables empty to skip the disk tuning.
  vars:
    _missing: >-
      {{ _cassandra_disks_unusable + (cassandra_data_disk_stat.results | rejectattr('stat.exists') | map(attribute='item') | list) }}
  when:
    - _cassandra_disks_explicit | length > 0
    - _missing | length > 0 or _cassandra_disks | length == 0

- name: Say which data directories are not tuned
  ansible.builtin.debug:
    msg: >-
      WARNING: not tuned: {{ _untuned | join(', ') }} - not a plain disk or partition (LVM, RAID, dm-crypt, overlay...).
      Set cassandra_data_block_devices to the disks.
  vars:
    _untuned: >-
      {{ (_cassandra_disk_sources | reject('in', cassandra_data_lsblk.results | default([])
           | selectattr('stdout', 'defined') | selectattr('stdout', 'search', '"type": ?"(disk|part)"')
           | map(attribute='item') | list) | list)
         + (cassandra_data_findmnt.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0)
            | map(attribute='item') | map('regex_replace', '$', ' (not found yet)') | list) }}
  when:
    - _cassandra_disks_explicit | length == 0
    - _untuned | length > 0

# Read-ahead is one of the worst default settings for Cassandra's read path
# (see the role README): applied now through sysfs, and kept across reboots
# with a udev rule. The scheduler is only switched to none on SSD/NVMe disks.
- name: Disk tuning for the Cassandra disks
  when:
    - _tuned | length > 0
    # the real /sys/block is the host's in a container; tests point at a fake tree
    - _cassandra_linux_live or cassandra_sysfs_block_root != '/sys/block'
  vars:
    _tuned: "{{ cassandra_data_disk_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
  block:
    # read_ahead_kb|scheduler|rotational, also for the change report
    - name: Read the disks' read-ahead, scheduler and type
      ansible.builtin.shell: >-
        q={{ (cassandra_sysfs_block_root ~ '/' ~ item ~ '/queue') | quote }};
        echo "$(cat "$q/read_ahead_kb")|$(sed -n 's/.*\[\(.*\)\].*/\1/p;t;p' "$q/scheduler")|$(cat "$q/rotational" 2>/dev/null || echo 1)"
      loop: "{{ _tuned }}"
      register: cassandra_data_disk_before
      changed_when: false
      check_mode: false

    - name: Set the read-ahead
      ansible.builtin.shell: "echo {{ cassandra_data_readahead_kb | int }} > {{ (cassandra_sysfs_block_root ~ '/' ~ item.item ~ '/queue/read_ahead_kb') | quote }}"
      loop: "{{ cassandra_data_disk_before.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout.split('|')[0] != cassandra_data_readahead_kb | int | string

    - name: Set the IO scheduler to none (SSD/NVMe)
      ansible.builtin.shell: "echo none > {{ (cassandra_sysfs_block_root ~ '/' ~ item.item ~ '/queue/scheduler') | quote }}"
      loop: "{{ cassandra_data_disk_before.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stdout.split('|')[2] == '0'
        - item.stdout.split('|')[1] != 'none'
      register: cassandra_data_scheduler_set
      changed_when: cassandra_data_scheduler_set.rc == 0
      failed_when: false  # some virtual disks reject the switch

    - name: Read the disks' serial numbers (stable across reboots, unlike their names)
      ansible.builtin.command:
        argv: [udevadm, info, --query=property, "--name=/dev/{{ item }}"]
      loop: "{{ _tuned }}"
      register: cassandra_data_udev_info
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Ensure the udev rules dir exists (absent on minimal images without udev)
      ansible.builtin.file:
        path: /etc/udev/rules.d
        state: directory
        mode: "0755"

    - name: Keep the settings across reboots (udev rule)
      ansible.builtin.template:
        src: 61-cassandra-data-disk.rules.j2
        dest: /etc/udev/rules.d/61-cassandra-data-disk.rules
        mode: "0644"
      register: cassandra_data_disk_udev

- name: Remove the udev rule earlier versions of the role wrote
  ansible.builtin.file:
    path: /etc/udev/rules.d/60-cassandra-data-disk.rules
    state: absent

- name: Report changes
  ansible.builtin.include_tasks: report.yml
