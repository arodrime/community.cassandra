---
# Python, for a new virtualenv (an existing one keeps its own) or without one
- name: Prepare the Python
  when: cassandra_medusa_venv == '' or not cassandra_medusa_venv_python.stat.exists
  block:
    - name: Get the system python3 version
      ansible.builtin.command: python3 -c "import sys; print('%d.%d' % sys.version_info[:2])"
      register: cassandra_medusa_python3_version
      changed_when: false
      failed_when: false
      check_mode: false  # read-only

    - name: Tell whether python3 fits
      ansible.builtin.set_fact:
        _cassandra_medusa_python3_fits: >-
          {{ cassandra_medusa_python3_version.rc == 0
             and cassandra_medusa_python3_version.stdout is version(cassandra_medusa_python_supported[0], '>=')
             and cassandra_medusa_python3_version.stdout is version(cassandra_medusa_python_supported[1], '<=') }}

    # Ubuntu 26.04 (python3 3.14): a virtualenv on python3.11, when a repository
    # has it (the deadsnakes PPA cassandra_install adds there when cqlsh needs it)
    - name: Look up python3.11 for the virtualenv (Debian & Ubuntu)
      ansible.builtin.command: apt-cache policy python3.11
      environment:
        LC_ALL: C  # its labels are translated
      register: cassandra_medusa_python311_policy
      changed_when: false
      check_mode: false  # read-only
      when:
        - ansible_facts['os_family'] == 'Debian'
        - cassandra_medusa_python == ''
        - cassandra_medusa_venv != ''
        - not _cassandra_medusa_python3_fits

    # --check on a blank Ubuntu host: the PPA cassandra_install adds in the
    # real run is not there yet
    - name: Tell whether python3.11 comes later (--check)
      ansible.builtin.set_fact:
        _cassandra_medusa_python_pending: >-
          {{ ansible_check_mode and ansible_facts['distribution'] == 'Ubuntu' and not cassandra_offline | bool
             and cassandra_medusa_python311_policy is not skipped
             and cassandra_medusa_python311_policy.stdout | default('') is not search('(Installed|Candidate): [0-9]')
             and cassandra_cqlsh_python_repo_uri | default('deadsnakes') != ''
             and cassandra_cqlsh_python_manage | default(true) | bool
             and cassandra_cqlsh_python | default('') in ['', '/usr/bin/python3.11'] }}

    - name: Pick the Python
      ansible.builtin.set_fact:
        _cassandra_medusa_python: >-
          {{ cassandra_medusa_python if cassandra_medusa_python != ''
             else '/usr/bin/python3' if _cassandra_medusa_python3_fits
             else '/usr/bin/python3.11' if ansible_facts['os_family'] == 'RedHat' or _cassandra_medusa_python_pending | bool
                  or cassandra_medusa_python311_policy.stdout | default('') is search('(Installed|Candidate): [0-9]')
             else '' }}

    - name: Say python3.11 is not offered yet (--check)
      ansible.builtin.debug:
        msg: >-
          --check: no repository of {{ inventory_hostname }} offers python3.11 yet (cassandra_install adds the
          deadsnakes PPA in the real run when cqlsh needs it); the real run stops if none does.
      when: _cassandra_medusa_python_pending | bool
      vars:
        cassandra_output: true

    - name: Stop when no Python fits
      ansible.builtin.assert:
        that: _cassandra_medusa_python != ''
        fail_msg: >-
          Medusa {{ cassandra_medusa_version }} runs on Python {{ cassandra_medusa_python_supported | join(' to ') }},
          python3 on {{ inventory_hostname }} is {{ cassandra_medusa_python3_version.stdout | default('') or 'missing' }}:
          set cassandra_medusa_python to such an interpreter (installed by other means){{
          ', or, with a virtualenv (cassandra_medusa_venv), make python3.11 available (e.g. the deadsnakes PPA,
          which cassandra_install adds on Ubuntu when cqlsh needs it)' if ansible_facts['os_family'] == 'Debian' else '' }}.
        quiet: true

    # Without a virtualenv: nothing more to do when Medusa is there already
    - name: Read the Medusa version of this Python
      ansible.builtin.command:
        argv:
          - "{{ _cassandra_medusa_python }}"
          - -c
          - "from importlib.metadata import version; print(version('cassandra-medusa'))"
      register: cassandra_medusa_system_installed
      changed_when: false
      failed_when: false  # none yet
      check_mode: false  # read-only
      when: cassandra_medusa_venv == ''

    - name: Tell whether this Python gets Medusa
      ansible.builtin.set_fact:
        _cassandra_medusa_system_install: >-
          {{ cassandra_medusa_venv == '' and cassandra_medusa_system_installed.stdout | default('') | trim
             != cassandra_medusa_version | string }}

    # PEP 668 (Debian 12, Ubuntu 23.04 and later): pip refuses the system Python
    - name: Look for a system Python pip must not install into
      ansible.builtin.command:
        argv:
          - "{{ _cassandra_medusa_python }}"
          - -c
          - "import os, sysconfig; print(os.path.isfile(os.path.join(sysconfig.get_path('stdlib'), 'EXTERNALLY-MANAGED')))"
      register: cassandra_medusa_externally_managed
      changed_when: false
      failed_when: false  # a python3.11 not installed yet is not
      check_mode: false  # read-only
      when: _cassandra_medusa_system_install

    - name: Refuse an externally managed Python
      ansible.builtin.assert:
        that: cassandra_medusa_externally_managed.stdout | default('') | trim != 'True'
        fail_msg: >-
          {{ _cassandra_medusa_python }} on {{ inventory_hostname }} is managed by the system (PEP 668): pip does not
          install Medusa into it. Set cassandra_medusa_venv to a virtualenv path, e.g. /opt/cassandra-medusa.
        quiet: true
      when: _cassandra_medusa_system_install

    # venv needs ensurepip: python3-venv (python3.X-venv) on Debian, the
    # python3.11 packages on RedHat; without a virtualenv, pip. A
    # cassandra_medusa_python of your own is yours.
    - name: Packages the Python needs
      ansible.builtin.set_fact:
        _cassandra_medusa_packages: >-
          {{ [] if cassandra_medusa_venv == '' and not _cassandra_medusa_system_install
             else ['python3.11', 'python3.11-pip'] if _cassandra_medusa_python == '/usr/bin/python3.11'
                                                     and ansible_facts['os_family'] == 'RedHat'
             else ['python3-pip'] if cassandra_medusa_venv == '' and _cassandra_medusa_python in ['', '/usr/bin/python3']
             else [] if cassandra_medusa_python != ''
             else ['python3-pip'] if cassandra_medusa_venv == ''
             else [(_cassandra_medusa_python | basename) ~ '-venv'] if ansible_facts['os_family'] == 'Debian'
             else [] }}

    # first: the ones installed already need no package manager call (it reads every repository's
    # metadata, and fails when a mirror is down though nothing is to install)
    - name: Read the installed packages
      ansible.builtin.package_facts:
      check_mode: false
      when: _cassandra_medusa_packages | length > 0

    - name: Install them
      ansible.builtin.package:
        name: "{{ _cassandra_medusa_packages }}"
        state: present
      retries: 3
      when:
        - _cassandra_medusa_packages | reject('in', ansible_facts['packages'] | default({})) | list | length > 0
        - not cassandra_offline | bool
        - not _cassandra_medusa_python_pending | bool  # apt can't resolve them yet

    - name: Every package the virtualenv needs is installed (offline)
      ansible.builtin.assert:
        that: _missing | length == 0
        fail_msg: >-
          cassandra_offline downloads nothing, and {{ inventory_hostname }} lacks {{ _missing | join(', ') }}
          (Medusa's Python needs it): install it from your image or internal mirror first.
        quiet: true
      vars:
        _missing: "{{ _cassandra_medusa_packages | reject('in', ansible_facts['packages'] | default({})) | list }}"
      when:
        - _cassandra_medusa_packages | length > 0
        - cassandra_offline | bool
