---
minor_changes:
- "preflight - a WARNING for an extra JVM option worth a look among the ones the node's Java reads (``-Xss`` far from the usual 256k to 1m, e.g. ``-Xss1024M``; ``-XX:-UseBiasedLocking`` on Java 17), with why and the variable to change; nothing is changed."
- "update_java, upgrade, cassandra_install, new nodes - a Java change is refused, before anything changes, while the JVM options that Java reads hold one it does not start with (``-XX:-UseBiasedLocking`` on Java 21, or any Java after 17 cassandra_java_allow_unsupported allows: the JVM does not start with it), the role's own template lines included (4.x's ``jvm-server.options``)."
- "update_java, upgrade (to another series) - refused, before anything changes, when the options file the node then reads is in ``cassandra_config_keep_files`` (e.g. a jvm11-server.options kept with import_cluster's ``import_keep_hand_edits``): it would be read as it is."
- "import_cluster - the extra options of a jvm<N>-server.options the running Java does not read (e.g. a heap in jvm11-server.options on Java 17) are imported as they are: the role writes that file the same, and the JVM keeps not reading it (an exporter agent there is not taken for a second one)."
- "import_cluster - the report's TODO has a WARNING for an imported JVM option worth a look (as preflight), the option imported as it is."
- "cassandra_jvm_option_checks, cassandra_jvm_options_file, cassandra_jvm_options_variable filters - the JVM options checks (a table in plugin_utils ``cassandra_jvm_options``), the options file a Java reads."
trivial:
- "update_java, upgrade - refused, before anything changes, when cassandra-env.sh would stop with what the new Java reads (the files the role writes, or the node's own jvm-server.options and cassandra-env.sh when cassandra_config keeps them; it greps the letters Xmx, Xms and Xmn: ``-Xmx`` or ``-Xms`` alone, ``-Xmn`` without ``-Xmx``, ``-Xmn`` under G1, a GC change included; ``-XX:MaxNewSize`` is not refused), or when that Java's options file holds a Prometheus exporter agent while the role writes one; the message names the variable or kept file that holds the option and the way out. Nothing is checked when the node keeps its options file and its GC (upgrade compares with the Java the node runs, in the same series too). A heap that changes with the options file is a line of update_java's plan (upgrade: of the prepare phase), e.g. ``heap after the move: 24 GiB (cassandra_jvm11_extra_options: -Xms24G -Xmx24G); inventory now: 31 GiB (cassandra_heap_size)``."
- "import_cluster - an option the role's template writes already (``-Xss256k``), found at another place in the file, is no longer imported again as an extra option, and the file is not listed as a hand edit (the role leaves it as it is)."
- "import_cluster - the self-check names the jvm<N>-server.options a 4.x node on Java 17 reads (jvm11-server.options, not jvm17)."
