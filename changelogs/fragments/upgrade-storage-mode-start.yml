bugfixes:
  - >-
    upgrade sstables - the mode the running Cassandra runs is read live over CQL (``system_views.settings``), else
    the one it logged at its start when its system.log has it and was written since that start, else its
    ``cassandra.yaml``'s unless the file changed since that start: by content against the record of the config it
    started with (the record of that JVM: a ``chmod``, ``chown`` or relabel is no change), else by the later of the
    file's mtime and ctime against the start read from the boot time and the process's own start. A start not read,
    or after now, refuses (it is never taken as "no restart pending"); a ``cassandra.yaml`` with a time after now (a
    clock set back) is said as such. A cluster in the middle of its move to ``NONE`` is told its next step (from the
    earliest of the inventory's, the file's and the running mode), and a restart pending is always said. Each way
    out ends with what to do: a file time after now, the clock set right, then the file touched and the node
    restarted; no Cassandra process, start it; a node running an earlier mode than its file (an ``apply_config`` cut
    before its restart), a restart only (a step between written by hand first, two steps apart); a file with an
    earlier mode than the node runs, that mode written back (``apply_config`` when it is the inventory's, one step;
    else by hand), never a restart; the mode it runs not known and its file changed since its start, the CQL query
    that reads it and what follows each answer; then run this phase again.
