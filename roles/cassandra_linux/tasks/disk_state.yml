---
# What the devices to tune have now (disks.yml), and what is to change on
# them; read again after a tuned switch (what tuned took back), the report
# keeping what they had before the run
- name: Read the devices' read-ahead, scheduler, type and ids
  ansible.builtin.shell: |
    set -f
    d={{ (cassandra_sysfs_block_root ~ '/' ~ item) | quote }}
    echo "ra=$(cat "$d/queue/read_ahead_kb")"
    s=$(cat "$d/queue/scheduler" 2>/dev/null)
    echo "sched=$(echo "$s" | sed -n 's/.*\[\(.*\)\].*/\1/p;t;p')"
    echo "choices=$(echo $s | wc -w)"
    echo "rot=$(cat "$d/queue/rotational" 2>/dev/null || echo 1)"
    for f in dm/uuid dm/name md/uuid; do
      [ -r "$d/$f" ] && echo "${f%/*}_${f#*/}=$(cat "$d/$f")"
    done
    exit 0
  loop: "{{ _cassandra_disk_devices | map(attribute='kname') | list }}"
  register: cassandra_data_disk_before
  changed_when: false
  check_mode: false

- name: Keep what was read, and what is to change
  ansible.builtin.set_fact:
    _cassandra_disk_state: "{{ _state }}"
    _cassandra_disk_changes: >-
      {{ _cassandra_disk_devices | community.cassandra.cassandra_disk_changes(
           _state, _cassandra_readahead_read_back, _cassandra_data_lvchange_now) if _cassandra_data_live_here | bool else [] }}
  vars:
    _state: "{{ cassandra_data_disk_before | community.cassandra.cassandra_disk_state }}"

- name: Keep what changes from what the devices had before the run
  ansible.builtin.set_fact:
    _cassandra_disk_changes_seen: "{{ _cassandra_disk_changes }}"
  when: not _cassandra_disk_reread | default(false) | bool
