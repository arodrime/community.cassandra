---
# AxonOps' repository, or a mirror of it (cassandra_axonops_repository_url). Its settings are checked with the
# others (cassandra_axonops_problems). Run under check mode too (--check, apply_config's compare): what would
# change goes into the plan (_cassandra_axonops_repository_items); the key is downloaded to compare it, nothing
# else is written then.
- name: The AxonOps apt repository (Debian & Ubuntu)
  when: ansible_facts['os_family'] == 'Debian'
  block:
    # apt reads credentials from auth.conf.d (apt_auth.conf(5)), not from the sources
    - name: Credentials of the AxonOps apt repository
      ansible.builtin.copy:
        content: |
          # Managed by Ansible (community.cassandra.cassandra_axonops)
          machine {{ 'http://' if _url.scheme == 'http' else '' }}{{ _url.hostname }}{{ (':' ~ _url.port) if _url.port else '' }} login {{ cassandra_axonops_repository_username }} password {{ cassandra_axonops_repository_password }}
        dest: /etc/apt/auth.conf.d/axonops.conf
        owner: root
        group: root
        mode: "0600"
      vars:
        _url: "{{ cassandra_axonops_repository_url | urlsplit }}"
      no_log: true
      diff: false
      register: cassandra_axonops_credentials
      when: cassandra_axonops_repository_username != ''

    - name: No credentials left for the AxonOps apt repository
      ansible.builtin.file:
        path: /etc/apt/auth.conf.d/axonops.conf
        state: absent
      register: cassandra_axonops_credentials_removed
      when: cassandra_axonops_repository_username == ''

    # (none created under check mode: a key directory missing is a key to put in place)
    - name: Create the key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # The key downloaded to a temporary file outside /etc (under check mode too: to compare it), compared with the one
    # in place, put in place when it differs (not under check mode), the temporary file always removed
    - name: Compare the signing key, put it in place when it differs
      block:
        - name: Make a temporary file for the key
          ansible.builtin.tempfile:
            suffix: .axonops-key
          register: cassandra_axonops_key_tmp
          check_mode: false

        - name: Download the signing key
          ansible.builtin.get_url:
            url: "{{ cassandra_axonops_repository_key_url }}"
            dest: "{{ cassandra_axonops_key_tmp.path }}"
            mode: "0644"
            force: true
            url_username: "{{ cassandra_axonops_repository_username if _same_server else omit }}"
            url_password: "{{ cassandra_axonops_repository_password if _same_server else omit }}"
            force_basic_auth: "{{ _same_server }}"
          vars:
            # the credentials only to the repository's own server
            _same_server: >-
              {{ cassandra_axonops_repository_username != ''
                 and (cassandra_axonops_repository_key_url | urlsplit('netloc'))
                     == (cassandra_axonops_repository_url | urlsplit('netloc')) }}
          changed_when: false  # a download: the comparison below says the change
          check_mode: false
          retries: 3
          register: cassandra_axonops_key_download
          until: cassandra_axonops_key_download is succeeded
          no_log: "{{ cassandra_axonops_repository_password != '' }}"

        # apt tells an armored key from a binary one by its file name: .asc or .gpg
        - name: Compare the signing key with the one in place
          ansible.builtin.shell: |
            if grep -q 'BEGIN PGP PUBLIC KEY' "$NEW"; then ext=asc; else ext=gpg; fi
            if cmp -s "$NEW" "/etc/apt/keyrings/axonops.$ext"; then echo "same $ext"; else echo "changed $ext"; fi
          environment:
            NEW: "{{ cassandra_axonops_key_tmp.path }}"
          register: cassandra_axonops_signing_key
          changed_when: cassandra_axonops_signing_key.stdout is match('changed')
          check_mode: false  # reads only

        - name: Put the signing key in place
          ansible.builtin.copy:
            src: "{{ cassandra_axonops_key_tmp.path }}"
            remote_src: true
            dest: "/etc/apt/keyrings/axonops.{{ _ext }}"
            mode: "0644"
          when:
            - cassandra_axonops_signing_key is changed
            - not _cassandra_axonops_compare | bool  # (check mode: its directory may not be there yet)

        # (the other kind of the key, left by an earlier key)
        - name: Remove the signing key of the other kind
          ansible.builtin.file:
            path: "/etc/apt/keyrings/axonops.{{ 'gpg' if _ext == 'asc' else 'asc' }}"
            state: absent
      vars:
        _ext: "{{ cassandra_axonops_signing_key.stdout.split() | last }}"
      always:
        - name: Remove the temporary key file
          ansible.builtin.file:
            path: "{{ cassandra_axonops_key_tmp.path }}"
            state: absent
          check_mode: false
          when: cassandra_axonops_key_tmp.path is defined

    # deb822_repository needs python3-debian (cassandra_repository installs it; --check on a blank host does not):
    # installed here in a real run; missing under check mode, the source is said to be written
    - name: Look for python3-debian
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${db:Status-Status}", python3-debian]
      register: cassandra_axonops_python_debian
      changed_when: false
      failed_when: false
      check_mode: false  # reads only

    - name: Install python3-debian
      ansible.builtin.apt:
        name: python3-debian
      when:
        - not _cassandra_axonops_compare | bool
        - cassandra_axonops_python_debian.stdout != 'installed'

    - name: The AxonOps apt source
      when: not (_cassandra_axonops_compare | bool and cassandra_axonops_python_debian.stdout != 'installed')
      ansible.builtin.deb822_repository:
        name: axonops
        types: deb
        uris: "{{ cassandra_axonops_repository_url }}"
        suites: "{{ cassandra_axonops_repository_suite }}"
        components: "{{ cassandra_axonops_repository_component }}"
        signed_by: "/etc/apt/keyrings/axonops.{{ cassandra_axonops_signing_key.stdout.split() | last }}"
      register: cassandra_axonops_source

    - name: Refresh the apt cache
      ansible.builtin.apt:
        update_cache: true
      retries: 3
      register: cassandra_axonops_apt_update
      until: cassandra_axonops_apt_update is succeeded
      when:
        - not _cassandra_axonops_compare | bool
        - cassandra_axonops_source is changed or cassandra_axonops_signing_key is changed

  # (a download refused, a source apt rejects, a cache refresh failing: what failed and why, the URLs masked)
  rescue:
    - name: Stop on the AxonOps apt repository
      ansible.builtin.fail:
        msg: "{{ _said | join(_nl) }}"
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        _r: "{{ ansible_failed_result | default({}) }}"
        _cause: >-
          {{ (('HTTP ' ~ _r.status_code ~ ': ') if _r.status_code | default(-1) | int > 0 else '')
             ~ (_r.msg | default('no cause given') | string).splitlines() | first | default('')
             | community.cassandra.cassandra_url_masked }}
        _said: >-
          {{ ['STOPPED  cassandra_axonops  ' ~ inventory_hostname,
              '  ' ~ ansible_failed_task.name | default('the AxonOps apt repository') ~ ' failed:']
             + ['    ' ~ _cause] | community.cassandra.cassandra_fit
             + ['WAY OUT  check cassandra_axonops_repository_url, _key_url, login; run again'] }}

- name: The AxonOps yum repository (RedHat)
  ansible.builtin.yum_repository:
    name: axonops
    description: AxonOps
    baseurl: "{{ cassandra_axonops_repository_url }}"
    gpgcheck: "{{ cassandra_axonops_repository_key_url != '' }}"
    gpgkey: "{{ cassandra_axonops_repository_key_url or omit }}"
    username: "{{ cassandra_axonops_repository_username or omit }}"
    password: "{{ cassandra_axonops_repository_password or omit }}"
    mode: "{{ '0600' if cassandra_axonops_repository_username != '' else '0644' }}"  # (the password in it)
    # (a mirror that does not answer, or refuses the login, must not stop every other dnf run: Cassandra's own
    # packages, the collection's compare)
    skip_if_unavailable: true
  diff: false
  no_log: "{{ cassandra_axonops_repository_password != '' }}"
  register: cassandra_axonops_yum
  when: ansible_facts['os_family'] == 'RedHat'

# (the plan's rows: secrets never shown)
- name: Note what the repository changes
  ansible.builtin.set_fact:
    _cassandra_axonops_repository_items: >-
      {{ _changed | community.cassandra.cassandra_axonops_repository_items(
           cassandra_axonops_repository_url | community.cassandra.cassandra_url_masked,
           cassandra_axonops_repository_key_url | community.cassandra.cassandra_url_masked) }}
  vars:
    _changed:
      source: >-
        {{ cassandra_axonops_source | default({}) is changed or cassandra_axonops_yum | default({}) is changed
           or cassandra_axonops_source | default({}) is skipped and _cassandra_axonops_compare | bool
              and ansible_facts['os_family'] == 'Debian' }}
      key: "{{ cassandra_axonops_signing_key | default({}) is changed }}"
      credentials: "{{ cassandra_axonops_credentials | default({}) is changed }}"
      credentials_removed: "{{ cassandra_axonops_credentials_removed | default({}) is changed }}"
