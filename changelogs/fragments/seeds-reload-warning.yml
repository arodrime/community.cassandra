bugfixes:
  - "add_node, decommission_node, topology playbooks, cassandra_config role - a ``nodetool reloadseeds`` that fails once the new seed list is written in ``cassandra.yaml`` is a ``WARNING`` naming the node and nodetool's error, and the run goes on; the TO DO at the end names the nodes and the change_seeds command that reloads them once the cause is fixed. When nodetool says ``Failed to reload the seed node list`` (the running node cannot load its ``cassandra.yaml`` again: a key it does not know, an unreadable file), the WARNING says to fix the file before any restart, or the node will not start. change_seeds, whose job the reload is, still fails, its message pointing at the node's ``system.log`` (``Error while getting seed node list``)."
  - "add_node, decommission_node, topology playbooks - a node whose seed list does not change is not reloaded any more (a decommission of a node that is not a seed reloaded the seeds of every node, and stopped when one could not load its ``cassandra.yaml`` again). A reload an earlier run owes (stopped before it, or failed) is still done: a mark in ``/var/lib/cassandra``, written before the seed list, kept until the reload succeeds."
