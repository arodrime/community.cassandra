---
# Confirmed once for the whole run by the apply_config playbook, which tells
# what follows in cassandra_apply_config_then:
#   restart: new settings, the node is drained and restarted;
#   start: its unit failed (it could not start, or crashed) or a resumed run
#     stopped it: started once written;
#   none: an owner, group or mode alone, read when Cassandra started;
#   write: stopped on purpose, left stopped.
# A unit restarting in a loop (Restart=on-failure) or past its start limit
# would not start again: it is stopped before the write, so that the loop does
# not bring it up on the former config.
- name: Clear the unit's failed starts
  when: cassandra_apply_config_then | default('restart') == 'start'
  vars:
    # restarting in a loop at the plan (its JVM may be up for a moment, on the config that fails)
    _looping: "{{ cassandra_apply_config_unit.status.ActiveState | default('') == 'activating' }}"
    _now: "{{ cassandra_apply_config_unit_now.status | default({}) }}"
    _up: "{{ _now.ActiveState | default('') == 'active' and _now.SubState | default('') == 'running' }}"
  block:
    # read again: it may have come up since the plan
    - name: Read the state of its unit
      ansible.builtin.systemd_service:
        name: cassandra
      register: cassandra_apply_config_unit_now
      failed_when: false  # no unit (not-found) is not a failure; anything else, the checks below

    # failed or stopped at the plan, running now: started by hand on the former config, which the start
    # would not change
    - name: Stop if it came up since the plan
      ansible.builtin.assert:
        that: _looping | bool or not _up | bool
        fail_msg: >-
          {{ inventory_hostname }}: Cassandra came up since the plan was shown, with the config it had then. Nothing was
          changed on it: run apply_config again (it then restarts it if its config changes).
        quiet: true

    - name: Stop its restart loop
      ansible.builtin.systemd_service:
        name: cassandra
        state: stopped
      when: _looping | bool or _now.ActiveState | default('') == 'activating'

    # no module resets a unit's failed state
    - name: Reset its start limit
      ansible.builtin.command: systemctl reset-failed cassandra
      changed_when: false
      failed_when: false  # not failed: nothing to reset

- name: Write the config
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_config
  vars:
    cassandra_config_confirm: false
    cassandra_config_reload_seeds: false  # the restart loads them
    _cassandra_config_no_restart_warning: true
    # shown before the run was confirmed, and in its recap at the end
    _cassandra_config_quiet: true
    _cassandra_change_report_quiet: true

- name: Drain and restart the node
  ansible.builtin.include_tasks: action_restart.yml
  when: cassandra_apply_config_then | default('restart') == 'restart'

- name: Start the node and wait until it has joined
  ansible.builtin.include_tasks: main.yml
  vars:
    cassandra_service_state: started
  when: cassandra_apply_config_then | default('restart') == 'start'
