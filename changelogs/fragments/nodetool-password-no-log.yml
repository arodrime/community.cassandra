bugfixes:
  - >-
    upgrade, change_seeds, apply_config, import_cluster - the nodetool commands that carry the JMX password
    (``-pw``) no longer show it with ``-v`` or in a failure (``no_log``, as the other nodetool tasks); a unit test
    keeps every such task hidden. A node that runs another release than the one its package update asked for is
    told what to check (the installed package, the unit) and to run the same command again.
