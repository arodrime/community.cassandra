---
# Waits for the cleanups of a batch (cleanup_batch.yml) as long as they make
# progress: every cassandra_stream_check_interval seconds, reads nodetool
# compactionstats on the batch's nodes, prints one progress line (bytes
# cleaned by the running Cleanup tasks), and fails only after
# cassandra_stream_stall_checks checks in a row without progress. Rounds of
# _cassandra_stream_round_size checks (cleanup_check.yml), then includes itself until
# every cleanup job has ended. Run once; expects
# cassandra_cleanup_jobs_started (the async jobs) and _cassandra_stream_state
# reset to {} before the first include.
- name: Start a round of checks
  ansible.builtin.set_fact:
    _cassandra_cleanup_status: going

- name: Check the progress, every {{ cassandra_stream_check_interval }}s
  ansible.builtin.include_tasks: cleanup_check.yml
  loop: "{{ range(_cassandra_stream_round_size | int) | list }}"
  loop_control:
    loop_var: _cassandra_stream_round
    label: "{{ _cassandra_stream_round + 1 }}"

- name: Next round of checks
  ansible.builtin.include_tasks: cleanup_wait.yml
  when: _cassandra_cleanup_status == 'going'
