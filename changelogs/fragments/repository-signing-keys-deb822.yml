minor_changes:
  - cassandra_repository - the Apache Cassandra signing keys ship with the role, or are downloaded from cassandra_repository_key_url (a mirror or a local copy) and checked against cassandra_repository_key_fingerprints before being installed; on the RHEL family the role installs them too, not yum. Apt sources are written in the deb822 format (the old one-line .list file is removed).
