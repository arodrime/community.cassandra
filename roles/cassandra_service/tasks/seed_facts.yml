---
# A node is a seed when one of its addresses is in cassandra_seeds (port ignored; an IPv6 entry
# with a port is written in brackets: "[2001:db8::4]:7000")
- name: Work out whether this node is a seed
  ansible.builtin.set_fact:
    _cassandra_service_seeds: "{{ _seeds }}"
    _cassandra_service_is_seed: "{{ _seeds | intersect(_mine) | length > 0 }}"
    _cassandra_service_seed_entry: "{{ _seeds | intersect(_mine) | first | default('') }}"
    _cassandra_service_names: "{{ _mine }}"  # what a seed entry may name it by
  vars:
    _seeds: >-
      {{ ((cassandra_seeds | default([])) if cassandra_seeds | default([]) is not string else cassandra_seeds.split(','))
         | map('trim') | select | map('community.cassandra.cassandra_seed_host') | list }}
    _mine: >-
      {{ ([inventory_hostname, ansible_host | default(''), ansible_facts['fqdn'] | default(''),
           ansible_facts['hostname'] | default(''), cassandra_listen_address | default('')]
          + ansible_facts['all_ipv4_addresses'] | default([]) + ansible_facts['all_ipv6_addresses'] | default([])) | select | list }}
