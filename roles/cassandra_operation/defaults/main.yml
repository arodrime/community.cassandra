---
# defaults file for cassandra_operation (the task files of the collection's playbooks)

# Read by these task files too: the same values as cassandra_service's defaults
# (a unit test keeps them equal)
cassandra_service_state: started
cassandra_service_unit_manage: true
cassandra_service_drain_timeout: 120  # seconds, below cassandra_service_timeout_stop
cassandra_service_wait_timeout: 600  # seconds
cassandra_stream_check_interval: 30  # seconds
cassandra_stream_early_check_interval: 10  # seconds
cassandra_stream_early_time: 300  # seconds
cassandra_jmx_username: ""
cassandra_jmx_password: ""
cassandra_jmx_password_file: ""
_cassandra_service_jmx: >-
  {{ {'port': cassandra_jmx_port | default(7199) | int}
     | combine({'username': cassandra_jmx_username} if cassandra_jmx_username else {})
     | combine({'password_file': cassandra_jmx_password_file} if cassandra_jmx_password_file
               else ({'password': cassandra_jmx_password} if cassandra_jmx_password else {})) }}

# The rows of the preflight's sensitive or suspicious settings a node keeps on
# purpose (their WARNING silenced), e.g. [heap_size]: auto_bootstrap_false,
# replace_address, heap_size, allow_all_authenticator, failure_policy_ignore
cassandra_suspicious_ack: []
# The inventory is the desired state: a host of the cluster's group marked
# absent (a host var or a group var) is no longer part of the cluster: the
# playbooks leave it out (and say so when the ring still has it).
cassandra_node_state: present
# One token per node (cassandra_num_tokens: 1): the replication factor the
# shares create_cluster shows assume when no keyspace gives one, and a
# datacenter where only some nodes have cassandra_initial_token (false: refused)
cassandra_token_rf: 3
cassandra_token_allow_partial: false

# The screens of long operations (screen.yml: session=) warn when the
# controller's shell is not inside tmux or screen (a lost SSH session would stop the run)
_cassandra_session_warning: >-
  {{ '' if lookup('ansible.builtin.env', 'TMUX') or lookup('ansible.builtin.env', 'STY')
     else 'this run is not inside tmux or screen: if the SSH session to this machine drops, the run stops'
          ~ ' (the operation itself goes on, unwatched). Run it inside tmux or screen.' }}
# Cluster health check run by the operation playbooks before and after each
# node: how long to wait for down nodes to come back, and whether to go on
# anyway (risky: a second replica down can make data unavailable).
cassandra_service_health_timeout: 600  # seconds
cassandra_service_health_force: false

# CQL access for the checks that read the schema (the keyspaces' replication
# before a rack goes down), when authentication is on
cassandra_cql_username: ""
cassandra_cql_password: ""
_cassandra_service_nodetool: >-
  nodetool -p {{ _cassandra_service_jmx.port }}{{ (' -u ' ~ cassandra_jmx_username | quote) if cassandra_jmx_username else '' }}{{
  (' -pwf ' ~ cassandra_jmx_password_file | quote) if cassandra_jmx_password_file
  else ((' -pw ' ~ cassandra_jmx_password | quote) if cassandra_jmx_password else '') }}

# Operator confirmation before an operation that asks for one (confirm.yml):
# true asks, false goes on without asking (non-interactive runs). --check
# never asks: nothing changes, the screen is the plan.
cassandra_operation_confirm: true

# Rolling restarts and stop_rack drain each node (nodetool drain, with the JMX
# settings above) before stopping it. The role's unit drains on stop too
# (cassandra_service_drain_on_stop): a second drain is harmless. false leaves
# it to the unit, except on a node whose own unit is kept
# (cassandra_service_unit_manage: false), which may not drain: drained anyway.
cassandra_operation_drain: true

# Rolling operations keep a progress file on the controller; resume an
# interrupted one with -e cassandra_rolling_resume=true. Empty: .cassandra_progress
# in the inventory's dir, or in the current dir when that one is not writable.
cassandra_rolling_resume: false
cassandra_rolling_progress_dir: ""
cassandra_rolling_progress_days: 30

# The variables the playbooks are run with (-e): a name set close to one of them
# is pointed out (hosts_check.yml), preflight warns about cassandra_*
# variables no role or playbook knows, and a -e one under a prefix of the
# collection that none knows stops the run (variables_check.yml; -e
# cassandra_allow_unknown_variables=true lets it through)
_cassandra_playbook_variables: [cassandra_hosts, cassandra_target_nodes, cassandra_target_dc, cassandra_target_rack,
                                cassandra_rolling_resume, cassandra_rolling_mode, cassandra_status_raw, cassandra_allow_down_nodes,
                                cassandra_accept_default_identity, cassandra_allow_unknown_variables]
