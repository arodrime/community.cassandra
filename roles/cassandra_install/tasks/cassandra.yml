---
# The Debian package starts Cassandra from its postinst, with stock config,
# before the node is configured: it would initialise as "Test Cluster" and
# later refuse the real cluster_name. policy-rc.d (exit 101) tells
# invoke-rc.d not to start or restart services during package operations.
# A policy-rc.d holding the marker below is ours, left by an interrupted run:
# it is rewritten and removed like a missing one (rc 0 or 2). Anyone else's
# (rc 1) is left alone.
- name: Look for a policy-rc.d not written by this role (Debian)
  ansible.builtin.command: grep -qF "Managed by Ansible (cassandra_install)" /usr/sbin/policy-rc.d
  register: cassandra_policy_rc_d
  changed_when: false
  failed_when: false
  check_mode: false  # read-only
  when: ansible_facts['os_family'] == 'Debian'

# Under --check the Cassandra repository is not really added: skip what
# can't be resolved yet instead of failing (the report says so)
- name: Check that the Cassandra packages are available (--check)
  ansible.builtin.shell: >-
    {% if ansible_facts['os_family'] == 'Debian' %}
    apt-cache policy cassandra | grep -q 'Candidate: [0-9]'
    {% else %}
    dnf -q repoquery cassandra 2>/dev/null | grep -q .
    {% endif %}
  register: cassandra_install_available
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - _cassandra_install_check
    - not cassandra_offline | bool
    - cassandra_install_method in ['repository', 'system']
    - _cassandra_packages | reject('in', _cassandra_install_before) | list | length > 0

- name: Check the installed version against cassandra_package_version
  when: cassandra_package_version != ""
  block:
    - name: Read the installed packages
      ansible.builtin.package_facts:
      check_mode: false

    - name: Refuse to change the version of an installed node
      ansible.builtin.assert:
        that: _installed == '' or _installed == cassandra_package_version or _cassandra_install_upgrade | default(false)
        fail_msg: >-
          {{ inventory_hostname }} has Cassandra {{ _installed }}, the inventory asks for {{ cassandra_package_version }}.
          This role never changes the version of an installed node: that is an upgrade (drain, stop, package,
          config, start, one node at a time). Set cassandra_package_version to {{ _installed }} to keep it.
        quiet: true
      vars:
        _installed: >-
          {{ (ansible_facts.packages['cassandra'] | default([{}]) | first).version | default('')
             | regex_replace('^([0-9]+\.[0-9]+\.[0-9]+).*$', '\1') }}

# Another release of an installed node (the upgrade's, apply_config's in its restart; under --check, at its plan): in
# the repository the node reads, as the install below sees it, else a stop with the package manager's own words,
# before the package is changed (else dnf or apt failed later, its reason dropped)
# (dnf exits 1 when it lists nothing, or cannot read a repository; apt-cache madison reads the apt cache only: no
# match is said by an echo of our own)
- name: Look for the release in the repository
  ansible.builtin.shell: >-
    {% if ansible_facts['os_family'] == 'Debian' %}
    apt-cache madison cassandra 2>&1 | grep -E "[|] *{{ cassandra_package_version | regex_escape }}([-~+][^ ]*)? *[|]"
    || { apt-cache madison cassandra 2>&1 | head -5; echo "no cassandra {{ cassandra_package_version }} in apt-cache madison cassandra"; exit 1; }
    {% else %}
    dnf -q --showduplicates list available
    {{ '--disableexcludes=all' if _cassandra_java_home != '' else '' }}
    {{ ("--disablerepo='*' --enablerepo=" ~ ('cassandra-' ~ cassandra_version) | quote) if _own_repo | bool else '' }}
    {{ ('cassandra-' ~ cassandra_package_version) | quote }} 2>&1
    {% endif %}
  vars:
    # the repository the role manages alone, as the download reads it (an unreachable OS repository on an
    # air-gapped site is not read); the excludes and versionlock as the install honours them (the package module),
    # not the download (cassandra_java_home: dnf download ignores them)
    _own_repo: "{{ cassandra_repository_manage | default(not cassandra_offline | default(false) | bool) | bool }}"
  register: cassandra_install_release
  changed_when: false
  failed_when: false
  check_mode: false  # a read
  when:
    - _cassandra_install_upgrade | default(false) | bool
    - cassandra_package_version != ''
    - not cassandra_offline | bool
    - cassandra_install_method in ['repository', 'system']
    - "'cassandra' in _cassandra_install_before"
    # (the plan, the repository changed by this run: not written yet, read by the window's own update)
    - not (_cassandra_install_check and _cassandra_repository_items | default([]) | length > 0)
    - >-
      (_cassandra_install_before['cassandra'][0].version | regex_replace('^([0-9]+\.[0-9]+\.[0-9]+).*$', '\1'))
      != cassandra_package_version

# one fact per line: what the package manager said (a repository it could not read named as such), what this run
# changed, the way out
- name: Stop when the release is not in the repository
  ansible.builtin.fail:
    msg: "{{ [_said, _changed, _way_out] | join(_nl) }}"
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    _tool: "{{ 'apt-cache madison cassandra' if ansible_facts['os_family'] == 'Debian' else 'dnf' }}"
    _lines: "{{ (cassandra_install_release.stdout_lines | default([]) | select | list)[-3:] }}"
    _unread: "{{ {'msg': cassandra_install_release.stdout | default('')} | community.cassandra.cassandra_failure_repos | length > 0 }}"
    _said: >-
      {{ inventory_hostname }}: {{ _tool }} did not list Cassandra {{ cassandra_package_version }}{{
      ' (it could not read a repository)' if _unread | bool else '' }}: {{ _lines | join('; ') or 'nothing listed' }}.
    _changed: >-
      Its Cassandra package was not changed{{ '; its repository file was written by this run'
      if not _cassandra_install_check and _cassandra_repository_items | default([]) | length > 0 else '' }}.
    _way_out: >-
      {{ 'Way out: make that repository answer on the node, then run again.' if _unread | bool else
         'Way out: set cassandra_package_version to a release it lists (' ~ ('apt-cache madison cassandra'
         if ansible_facts['os_family'] == 'Debian' else 'dnf --showduplicates list cassandra') ~ ' there), or add that'
         ~ ' release to the repository, then run again.' }}
  when:
    - cassandra_install_release is not skipped
    - cassandra_install_release.rc | default(0) != 0

- name: Install Cassandra Packages
  when:
    - not cassandra_offline | bool
    - not _cassandra_install_check or cassandra_install_method == 'packages' or cassandra_install_available.rc | default(0) == 0
  vars:
    _cassandra_install_names: >-
      {{ _cassandra_packages if cassandra_package_version == ''
         else _cassandra_packages | map('regex_replace', '$',
              ('=' if ansible_facts['os_family'] == 'Debian' else '-') ~ cassandra_package_version) | list }}
  block:
    - name: Block service starts during package install (Debian)
      ansible.builtin.copy:
        content: "#!/bin/sh\n# Managed by Ansible (cassandra_install), removed after the install\nexit 101\n"
        dest: /usr/sbin/policy-rc.d
        mode: "0755"
      when:
        - ansible_facts['os_family'] == 'Debian'
        - cassandra_policy_rc_d.rc != 1
      changed_when: false

    # installed already by these names (a version given: never skipped)
    - name: Install Cassandra Packages
      ansible.builtin.package:
        name: "{{ _cassandra_install_names }}"
        state: present
      retries: 3
      when:
        - cassandra_install_method in ['repository', 'system']
        - not (_cassandra_install_upgrade | default(false) and ansible_facts['os_family'] == 'Debian')
        - _cassandra_java_home == '' or ansible_facts['os_family'] == 'Debian'
        - _cassandra_install_names | reject('in', _cassandra_install_before) | list | length > 0

    # The RedHat packages depend on a Java package: with Java from a tarball
    # they are installed without their dependencies, plus the ones Cassandra
    # runs with. (Debian: a local package provides Java, see java_tarball.yml.)
    - name: Install the Cassandra packages without a Java package (cassandra_java_home)
      when:
        - cassandra_install_method in ['repository', 'system']
        - _cassandra_java_home != ''
        - ansible_facts['os_family'] == 'RedHat'
        - >-
          'cassandra' not in _cassandra_install_before
          or (_cassandra_install_upgrade | default(false)
              and _cassandra_install_before['cassandra'][0].version != cassandra_package_version)
      vars:
        _rpms: /var/tmp/cassandra-rpms
      block:
        - name: Install what Cassandra needs besides Java
          ansible.builtin.package:
            name: [procps-ng, python3, shadow-utils]
            state: present
          retries: 3
          when: "['procps-ng', 'python3', 'shadow-utils'] | reject('in', _cassandra_install_before) | list | length > 0"

        - name: Start from an empty download directory
          ansible.builtin.file:
            path: "{{ _rpms }}"
            state: absent
          changed_when: false

        # dnf download, not the dnf module's download_only: that one resolves
        # the dependencies, and fails where no repository offers the Java
        # package they need (EL 10 has no Java 11 or 17)
        # installed already: no dnf call (it reads every enabled repository, and an unreachable OS one fails it
        # on an air-gapped site)
        - name: Look for the dnf download command
          ansible.builtin.command:
            argv: [rpm, -q, --whatprovides, dnf-command(download)]
          register: cassandra_install_dnf_download
          changed_when: false
          failed_when: false
          check_mode: false  # a read

        - name: Install the dnf download command
          when: cassandra_install_dnf_download.rc != 0
          block:
            - name: Install the dnf download command
              ansible.builtin.package:
                name: dnf-command(download)
                state: present
              retries: 3
          rescue:
            # dnf's own failure (it ran: rc, failures), else the task's (e.g. a variable): said as such
            - name: Stop where the dnf download command could not be installed
              ansible.builtin.fail:
                msg: >-
                  {{ ('The dnf download command (dnf-command(download), from dnf-plugins-core) is not installed, and dnf'
                      ~ ' could not install it: ' ~ ansible_failed_result | community.cassandra.cassandra_failure_cause
                      ~ '. Make the repositories it names answer (or disable them), or install dnf-plugins-core by other'
                      ~ ' means, then run again.')
                     if ansible_failed_result.rc is defined or ansible_failed_result.failures is defined
                        or ansible_failed_result.results is defined
                     else 'Install the dnf download command: ' ~ ansible_failed_result.msg | default('failed') }}

        # excludepkgs/versionlock (kept from routine upgrades) don't apply here. The repository the role manages
        # alone (cassandra-<series>): dnf reads no other one (an unreachable OS repository on an air-gapped site);
        # repositories set up by other means: every enabled one, the failure naming those dnf could not read
        - name: Download the Cassandra packages
          when: not _cassandra_install_check
          block:
            - name: Download the Cassandra packages
              ansible.builtin.command:
                argv: >-
                  {{ ['dnf', '-q', 'download', '--disableexcludes=all', '--destdir', _rpms]
                     + (['--disablerepo=*', '--enablerepo=cassandra-' ~ cassandra_version] if _own_repo | bool else [])
                     + _cassandra_install_names }}
              register: cassandra_install_download
              until: cassandra_install_download is succeeded
              retries: 3
              changed_when: false
              vars:
                _own_repo: "{{ cassandra_repository_manage | default(not cassandra_offline | default(false) | bool) | bool }}"
          rescue:
            - name: Stop where the Cassandra packages could not be downloaded
              ansible.builtin.fail:
                msg: >-
                  {{ ('dnf could not download ' ~ _cassandra_install_names | join(', ') ~ ': '
                      ~ ansible_failed_result | community.cassandra.cassandra_failure_cause ~ '. Nothing was installed.'
                      ~ ' Make the repositories it names answer (or disable them), then run again.')
                     if ansible_failed_result.rc is defined
                     else 'Download the Cassandra packages: ' ~ ansible_failed_result.msg | default('failed') }}

        - name: Find them among the downloads
          ansible.builtin.find:
            paths: "{{ _rpms }}"
            patterns: "{{ _cassandra_packages | map('regex_replace', '$', '-[0-9]*.rpm') | list }}"
          register: cassandra_install_rpms
          when: not _cassandra_install_check

        - name: Every package was downloaded
          ansible.builtin.assert:
            that: cassandra_install_rpms.files | length == _cassandra_packages | length
            fail_msg: >-
              Downloaded {{ cassandra_install_rpms.files | map(attribute='path') | map('basename') | join(', ') or 'nothing' }}
              for {{ _cassandra_packages | join(', ') }}.
            quiet: true
          when: not _cassandra_install_check

        - name: Install them without their Java dependency
          ansible.builtin.command:
            argv: "{{ ['rpm', '-U', '--nodeps', '--oldpackage'] + cassandra_install_rpms.files | map(attribute='path') | list }}"
          changed_when: true
          when: not _cassandra_install_check

      always:
        - name: Remove the downloaded packages
          ansible.builtin.file:
            path: "{{ _rpms }}"
            state: absent
          changed_when: false

    - name: Install the Cassandra package files (packages)
      ansible.builtin.include_tasks: packages.yml
      when: cassandra_install_method == 'packages'

    # The upgrade playbook, node stopped: the pinned packages are held
    - name: Upgrade the Cassandra packages (Debian)
      ansible.builtin.apt:
        name: "{{ _cassandra_install_names }}"
        state: present
        allow_change_held_packages: true
      retries: 3
      when:
        - cassandra_install_method in ['repository', 'system']
        - _cassandra_install_upgrade | default(false) and ansible_facts['os_family'] == 'Debian'

    - name: Hold the pinned packages (Debian)
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ _cassandra_packages }}"
      when:
        - ansible_facts['os_family'] == 'Debian'
        - cassandra_package_version != ""
        - cassandra_package_hold | bool
        - not _cassandra_install_check or item in _cassandra_install_before  # not installed under --check
  always:
    - name: Remove the temporary policy-rc.d (Debian)
      ansible.builtin.file:
        path: /usr/sbin/policy-rc.d
        state: absent
      when:
        - ansible_facts['os_family'] == 'Debian'
        - cassandra_policy_rc_d.rc != 1
      changed_when: false

# jemalloc is preloaded by the cassandra script when found; RedHat-likes
# only have it in EPEL (or Amazon's base repos), so it is optional there.
- name: Look up jemalloc in the enabled repos (RedHat)
  ansible.builtin.command:
    # --check: without the repositories cassandra_repository removes
    argv: >-
      {{ ['dnf', '-q', 'repoquery'] + _cassandra_repository_check_removed | default([]) | map('regex_replace', '^', '--disablerepo=') | list
         + ['jemalloc'] }}
  register: cassandra_jemalloc_query
  changed_when: false
  failed_when: false  # no repository answers (air-gapped): no jemalloc
  check_mode: false  # read-only
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - cassandra_install_jemalloc | bool
    - not cassandra_offline | bool
    - "'jemalloc' not in _cassandra_install_before"

- name: Install jemalloc
  ansible.builtin.package:
    name: "{{ _jemalloc }}"
    state: present
  retries: 3
  when:
    - cassandra_install_jemalloc | bool
    - not cassandra_offline | bool
    - _jemalloc not in _cassandra_install_before
    - ansible_facts['os_family'] == 'Debian' or cassandra_jemalloc_query.stdout | default('') != ''
  vars:
    _jemalloc: "{{ 'libjemalloc2' if ansible_facts['os_family'] == 'Debian' else 'jemalloc' }}"
