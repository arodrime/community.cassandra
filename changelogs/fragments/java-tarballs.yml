---
minor_changes:
  - "cassandra_install - refuses a ``cassandra_java_version`` the series does not support (4.0/4.1: 8 or 11, 5.0: 11 or 17), as ``update_java`` and ``upgrade`` already did; ``cassandra_java_allow_unsupported: true`` installs it anyway (import_cluster sets it for a node running such a Java). The three read one table (the new ``cassandra_java_*`` filters)."
  - "cassandra_install - a Java whose ``release`` file names another major version than ``cassandra_java_version`` is refused: a tarball once unpacked, before it is made the system ``java``, and a Java already there (``cassandra_java_home``, a tarball unpacked earlier) before anything changes, so ``update_java`` and ``upgrade`` stop before stopping the node."
  - "cassandra_install - ``cassandra_java_tarballs`` offers Java tarballs by major version (``url``, optional ``checksum``, ``username`` and ``password``), e.g. once for every cluster next to the mirror: ``cassandra_java_tarball`` and its checksum and credentials default to the entry of ``cassandra_java_version`` (unless ``cassandra_install_java`` is false), and a version without one is refused with the versions on offer. ``update_java``, ``upgrade`` and the new node checks of ``add_node``/``replace_node`` follow it; ``import_cluster`` writes ``cassandra_java_tarballs: {}`` for a node on a Java package, which keeps it."
