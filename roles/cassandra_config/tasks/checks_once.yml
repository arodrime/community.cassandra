---
# cassandra_config's checks (checks.yml) once for the nodes of the play whose variables they read are the same (the
# same names, the same values: _cassandra_config_check_vars, and those it looks up by name), on the first of them,
# its messages naming them all: they read the variables only, so the verdicts are theirs too. Every node of the play
# must run it (plan.yml: apply_config's compare); a node in no group (not in ansible_play_hosts when they were made)
# is checked on its own.
- name: Note the variables the checks read
  ansible.builtin.set_fact:
    _cassandra_config_check_key: >-
      {{ dict(_names | zip(query('ansible.builtin.vars', *_names, default=_unread))) | to_json(sort_keys=true)
         | hash('sha1') }}
  no_log: true  # (a sha1, but of values that hold secrets)
  # a value that cannot be read (a template of yours that fails...): no key (2.17+: the task fails), or a value of
  # its own (2.16: the default): the node checked on its own, its checks saying what fails
  ignore_errors: true
  vars:
    # the ones the node has: those listed, and those checks.yml looks up by name (_cassandra_config_check_names)
    _names: >-
      {{ (_cassandra_config_check_vars | select('in', query('ansible.builtin.varnames', '^_?cassandra_')) | list
          + query('ansible.builtin.varnames', *_cassandra_config_check_names)) | unique | sort }}
    _unread: "(not read) {{ inventory_hostname }}"

- name: Group the nodes whose checks read the same variables
  ansible.builtin.set_fact:
    _cassandra_config_check_groups: >-
      {{ ansible_play_hosts | community.cassandra.cassandra_check_groups(hostvars) }}
  run_once: true

# a check that fails stops the nodes of the group, its message naming them (its verdict is theirs). The rescue
# fails closed: it lets a node go on only when its checks ended (on ansible-core 2.17+ with any_errors_fatal a node
# whose checks passed comes here too when another's failed), or when no failure of its own came since they started
# (a node stopped in its checks by another's failure: no failed result, or the one of an earlier failure, handled)
- name: Note the failure a node had before its checks
  ansible.builtin.set_fact:
    _cassandra_config_failed_before: "{{ ansible_failed_result | default(none) | to_json | hash('sha1') }}"
    _cassandra_config_checks_ended: false
  no_log: true  # (a sha1 of a result that may hold secrets)

- name: Check the variables of these nodes
  when: inventory_hostname in _cassandra_config_check_groups or inventory_hostname not in _grouped
  vars:
    _grouped: "{{ _cassandra_config_check_groups.values() | flatten }}"
    _cassandra_config_checked: "{{ _cassandra_config_check_groups.get(inventory_hostname, [inventory_hostname]) }}"
    cassandra_output_rescued: true  # (the rescue says what failed, the nodes it stands for)
  block:
    - name: Check the variables of these nodes
      ansible.builtin.include_tasks: checks.yml

    - name: Note the checks of these nodes ended
      ansible.builtin.set_fact:
        _cassandra_config_checks_ended: true
  rescue:
    - name: Stop the nodes these checks stand for
      when:
        - not _cassandra_config_checks_ended | bool
        - ansible_failed_result | default(none) | to_json | hash('sha1') != _cassandra_config_failed_before
      ansible.builtin.fail:
        msg: >-
          {{ _msg if _msg is match('REFUSED ') else _cassandra_config_checked_names ~ ': ' ~ _msg }}
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _msg: "{{ ansible_failed_result.msg | default('a check failed') }}"  # (a refusal names them already)
