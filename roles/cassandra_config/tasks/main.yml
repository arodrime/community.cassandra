---
- name: Assert required cassandra_config variables are set
  ansible.builtin.assert:
    that:
      - cassandra_conf_dir is defined and cassandra_conf_dir != ""
      - cassandra_data_dir is defined and cassandra_data_dir != ""
      - cassandra_version in ["50x"]
    fail_msg: "cassandra_version must be one of: 50x"

- name: Template Cassandra config files
  ansible.builtin.template:
    src: "{{ cassandra_version[0] }}.{{ cassandra_version[1] }}/{{ item }}.j2"
    dest: "{{ cassandra_conf_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - cassandra.yaml
    - cassandra-env.sh
    - jvm-server.options
    - jvm11-server.options
    - jvm17-server.options
    - cassandra-rackdc.properties
    - logback.xml
