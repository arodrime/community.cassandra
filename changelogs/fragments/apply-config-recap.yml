minor_changes:
  - apply_config playbook - a run that goes through ends with the changes of each node (the settings lines of the diffs, secrets masked as in the diffs, and the owner, group and mode changes), the nodes with the same outcome on one line (``node3..node5``); this replaces the final summary. The changes are no longer shown again while each node is written, nor by the change report. Under ``--check``, its screen says what a real run would do.
  - cassandra_config role - a data, commitlog, saved_caches or hints directory the account Cassandra runs as could not read, write and search (for example owned by root) gets that account as owner and group and ``u+rwx`` (the directory itself only, not what it holds); apply_config shows it as an owner, group or mode change, and names keyspace and table directories another account owns.
bugfixes:
  - "Operation playbooks - under ``--check``, the final summary says what a node would get (for example ``would restart``) instead of ``done in``."
  - cassandra_config role - in the diff preview, the last line of a live file with no final newline is no longer joined to the next line of the diff.
