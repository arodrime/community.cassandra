---
minor_changes:
- "import_cluster playbook - ``in sync with Ansible`` (yes, or not all verified: on the nodes read, named) lists what the next apply_config writes, one fact per line: each file ``rewritten`` or ``created`` with why (``layout``, ``heap placement``: the heap goes to ``jvm-server.options``, ``Java N does not read it``, a cassandra.yaml key its Cassandra rejects removed, the stock JMX password file option back when the JVM never reads it) or ``header line added``; under it the restart apply_config makes for it, decided as apply_config decides it (its own proof of no restart, with the running JVM's arguments, Java, environment and the files written since it started; none when Cassandra is not running), with why (Cassandra reads it at its start only, the running JVM's arguments not read, its Java not known, a file changed since it started), or the restart a real run refuses (Cassandra outside its unit) with apply_config's way out; then its nodes when not all of them. ``no restart`` is said only when none. With no difference found, the diffs of the files written are in ``report.details.txt`` (``REWRITES OF THE NEXT APPLY_CONFIG``, secrets masked). The next step's ``expected`` line names that count of files, the restarts and the refusals; it said only the JVM's files, and nothing of the heap's other file nor of the header lines. A file that differs only where Cassandra reads nothing takes the role's layout once; the next apply_config after it finds nothing to do."
bugfixes:
- "import_cluster playbook - the config files written since the running Cassandra started are taken as apply_config takes them: with apply_config's record of that start (``/var/lib/cassandra/.ansible_config_at_start.json``), the files that differ from it; only without a record, the files changed since that start. A cluster apply_config manages was said to have files written since the start that apply_config itself does not count."
