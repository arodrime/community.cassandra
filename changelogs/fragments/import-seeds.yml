bugfixes:
  - import_cluster - reads the seeds, cluster name, num_tokens, partitioner and snitch from cassandra.yaml whatever their quoting, indentation or trailing comment (an unquoted seed list was imported as the role default), and fails on a node where one of them can't be read instead of writing the role default. An absent num_tokens is imported as 1 and, on 5.0, an absent storage_compatibility_mode as CASSANDRA_4 (Cassandra's own defaults). Other unquoted settings with a trailing comment, and true/false settings written yes/on/True, are read too.
  - cassandra_config - a cluster name with a single quote is written as valid YAML, and the check of the settings a joined node keeps reads quoted values, trailing comments and an absent num_tokens (1) the way Cassandra does.
