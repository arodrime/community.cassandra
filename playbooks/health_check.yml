---
# Read-only health report of a cluster, changing nothing: from every node, the
# ring (every node up and normal, none joining/leaving/moving), gossip, native
# transport, streams, schema agreement and the storage and CQL ports. The
# report starts with the verdict (HEALTHY or NOT HEALTHY), then each problem
# once with the nodes that saw it, then what to do. Fails (non-zero exit)
# when there is a problem, so it can be scheduled.
#   ansible-playbook -i inventory community.cassandra.health_check
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo) only to read cassandra_jmx_password_file when it is
# set (the playbook then asks for it itself, no -b needed); none otherwise.
- name: Check the cluster's group
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
  tasks:
    - name: Check the cluster's group
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: hosts_check.yml

- name: Cluster health
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: true
  gather_subset: [network]
  # root only to read the JMX password file (the service account's, 0400);
  # nodetool needs no root otherwise
  become: "{{ cassandra_jmx_password_file | default('', true) | length > 0 }}"
  tasks:
    # also run by the first play, which --limit skips
    - name: Check the ansible-core version
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: core_check.yml

    - name: Load the cassandra_config defaults (ports)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: defaults.yml
        public: true

    - name: Check the cluster from this node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: cluster_health.yml
      vars:
        cassandra_service_health_report_only: true
        cassandra_service_health_timeout: 5  # a report: no waiting for down nodes

    # the verdict first, each problem once with the nodes that saw it; fails the run
    # (non-zero exit) when there is one
    - name: Report
      ansible.builtin.assert:
        that: _report.healthy
        fail_msg: "{{ _report.lines }}"
        success_msg: "{{ _report.lines }}"
        quiet: false
      vars:
        cassandra_output: true
        # the hosts whose check ran (the others: not reached)
        _checked: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts if hostvars[h].cassandra_health_findings is defined -%}
          {%-   set _ = out.append(h) -%}
          {%- endfor -%}
          {{ out }}
        _findings: >-
          {%- set out = {} -%}
          {%- for h in _checked -%}{%- set _ = out.update({h: hostvars[h].cassandra_health_findings}) -%}{%- endfor -%}
          {{ out }}
        _first_ring: >-
          {{ (hostvars[_checked | first].cassandra_health_self | default({})).cluster_status | default({}, true)
             if _checked else {} }}
        _report: >-
          {{ _findings | community.cassandra.cassandra_health_report(
               lookup('community.cassandra.cassandra_hosts'), ansible_play_hosts_all,
               unreachable=ansible_play_hosts_all | reject('in', _checked) | list,
               absent=query('community.cassandra.cassandra_nodes', state='absent'),
               names=ansible_play_hosts_all | community.cassandra.cassandra_host_addresses(hostvars),
               members=_first_ring.values() | map(attribute='nodes') | flatten | length if _first_ring else none,
               topology_command='topology' | community.cassandra.cassandra_command(
                 inventory=ansible_inventory_sources,
                 default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'),
                 hosts=cassandra_hosts | default(''), cwd=lookup('ansible.builtin.env', 'PWD'))) }}
      run_once: true
