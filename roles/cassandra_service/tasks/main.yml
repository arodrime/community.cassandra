---
# Status only: nothing is started or changed here
- name: Read the current service state
  ansible.builtin.systemd_service:
    name: cassandra
  register: cassandra_service_before
  failed_when: false
  check_mode: false

# Under --check on a host without Cassandra there is no unit to act on yet
- name: Tell whether there is a unit to act on
  ansible.builtin.set_fact:
    _cassandra_service_act: >-
      {{ not (ansible_check_mode
              and (cassandra_service_before.status | default({})).LoadState | default('not-found') == 'not-found') }}

- name: Leave time for the drain within the stop timeout
  ansible.builtin.assert:
    that: cassandra_service_drain_timeout | int + 10 < cassandra_service_timeout_stop | int
    fail_msg: >-
      cassandra_service_drain_timeout ({{ cassandra_service_drain_timeout }}) + 10 must be below
      cassandra_service_timeout_stop ({{ cassandra_service_timeout_stop }}), or systemd kills the JVM mid-drain.
    quiet: true
  when: cassandra_service_drain_on_stop

# Seeds don't bootstrap: a new node listed in cassandra_seeds would join an
# existing cluster without its data. Read only, also under --check.
- name: Refuse a new seed node in a running cluster
  ansible.builtin.include_tasks: new_seed.yml
  when:
    - cassandra_service_state in ['started', 'restarted']
    - not cassandra_service_allow_new_seed | bool

# Same name as the package's init script: systemd prefers a native unit
# over the SysV-generated one, so service/systemctl both use this.
- name: Install the cassandra systemd unit
  ansible.builtin.template:
    src: cassandra.service.j2
    dest: /etc/systemd/system/cassandra.service
    mode: "0644"
  register: cassandra_service_unit

# The package's init script can leave the unit "active (exited)" with no JVM
# (e.g. Cassandra died after a SysV start): systemd then sees nothing to start.
- name: Read the unit state
  ansible.builtin.systemd_service:
    name: cassandra
    daemon_reload: true
  register: cassandra_service_unit_state
  changed_when: false
  when: _cassandra_service_act

- name: Look for a running Cassandra JVM
  ansible.builtin.command: pgrep -f org.apache.cassandra.service.CassandraDaemon
  register: cassandra_service_jvm
  changed_when: false
  failed_when: cassandra_service_jvm.rc > 1
  check_mode: false  # read only: --check shows the reset below
  when:
    - _cassandra_service_act
    - cassandra_service_unit_state.status.ActiveState == 'active'
    - cassandra_service_unit_state.status.MainPID | int == 0

- name: Reset a unit left active with no Cassandra running
  ansible.builtin.systemd_service:
    name: cassandra
    state: stopped
  when: cassandra_service_jvm.rc | default(0) == 1

# Taking over a node started by the init script: its JVM is not the unit's
# main process. Stopping it is a restart, which this role never does alone.
- name: Warn that a Cassandra started by the init script keeps running
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: Cassandra runs under the package's init script; the native unit
      takes over at the next restart.
  when:
    - cassandra_service_jvm.rc | default(1) == 0
    - cassandra_service_state != 'stopped'

# Stopped before the boot setting: an init script that fails to disable
# (e.g. no chkconfig for systemd-sysv-install) must not leave the node running.
- name: Stop cassandra
  ansible.builtin.systemd_service:
    name: cassandra
    state: stopped
  when:
    - cassandra_service_state == 'stopped'
    - _cassandra_service_act

- name: Enable cassandra at boot
  ansible.builtin.systemd_service:
    name: cassandra
    enabled: "{{ cassandra_service_enabled }}"
    daemon_reload: true
  when: _cassandra_service_act

- name: Start or restart this node
  when:
    - cassandra_service_state in ['started', 'restarted']
    - _cassandra_service_act
  block:
    - name: Start or restart cassandra
      ansible.builtin.systemd_service:
        name: cassandra
        state: >-
          {{ 'restarted' if cassandra_service_state == 'restarted'
                            or (cassandra_service_restart_on_change and cassandra_service_unit is changed)
             else 'started' }}

    # The password, if given inline, is on nodetool's command line: no_log
    - name: Wait for the node to be joined (Mode NORMAL)
      ansible.builtin.command:
        argv: >-
          {{ ['nodetool', '-p', cassandra_jmx_port | default(7199) | string]
             + ((['-u', cassandra_jmx_username]
                 + (['-pwf', cassandra_jmx_password_file] if cassandra_jmx_password_file
                    else (['-pw', cassandra_jmx_password] if cassandra_jmx_password else [])))
                if cassandra_jmx_username else [])
             + ['netstats'] }}
      register: cassandra_service_netstats
      until: >-
        cassandra_service_netstats.stdout | default('') is search('^Mode: NORMAL$', multiline=True)
      retries: "{{ (cassandra_service_wait_timeout | int / 10) | int }}"
      delay: 10
      changed_when: false
      failed_when: >-
        cassandra_service_netstats.stdout | default('') is not search('^Mode: NORMAL$', multiline=True)
      no_log: "{{ (cassandra_jmx_username and cassandra_jmx_password and not cassandra_jmx_password_file) | bool }}"
      when:
        - cassandra_service_wait_for_normal
        - not ansible_check_mode
