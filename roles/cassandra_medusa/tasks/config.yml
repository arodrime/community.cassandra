---
# /etc/medusa, medusa.ini and the S3 credentials file
# An existing one keeps its owner and mode
- name: Look for /etc/medusa
  ansible.builtin.stat:
    path: /etc/medusa
  register: cassandra_medusa_config_dir

- name: Create /etc/medusa
  when: not cassandra_medusa_config_dir.stat.exists
  ansible.builtin.file:
    path: /etc/medusa
    state: directory
    owner: root
    group: "{{ cassandra_medusa_config_group }}"
    mode: "0750"

# Medusa stores the backups under the fqdn: a new one starts a new folder in
# the bucket (full backups)
- name: Read the fqdn of the current medusa.ini
  ansible.builtin.slurp:
    path: /etc/medusa/medusa.ini
  register: cassandra_medusa_ini_current
  failed_when: false
  no_log: true  # passwords

- name: Keep this node's name in the backups
  ansible.builtin.assert:
    that: cassandra_medusa_ini_current.content is not defined or _old == _new or cassandra_medusa_fqdn_change | bool
    fail_msg: >-
      /etc/medusa/medusa.ini has fqdn {{ _old or '(none: Medusa works it out)' }}, this run would write
      {{ _new or '(none: Medusa works it out)' }}. Medusa stores the backups under it: a change starts a new folder in the
      bucket and full backups. Set cassandra_medusa_fqdn (or cassandra_medusa_fqdn_domain) to keep it, or
      cassandra_medusa_fqdn_change=true to change it.
    quiet: true
  vars:
    _old: >-
      {{ ((cassandra_medusa_ini_current.content | default('') | b64decode | community.cassandra.cassandra_medusa_ini).storage
          | default({})).fqdn | default('') }}
    _new: >-
      {{ ((lookup('ansible.builtin.template', 'medusa.ini.j2') | community.cassandra.cassandra_medusa_ini).storage
          | default({})).fqdn | default('') }}

- name: Write medusa.ini
  ansible.builtin.include_tasks: ini_file.yml
  vars:
    _cassandra_medusa_ini_path: /etc/medusa/medusa.ini
    _cassandra_medusa_ini_content: "{{ lookup('ansible.builtin.template', 'medusa.ini.j2') }}"
    _cassandra_medusa_ini_owner: "{{ cassandra_medusa_config_user }}"
    _cassandra_medusa_ini_group: "{{ cassandra_medusa_config_group }}"
    _cassandra_medusa_ini_mode: "{{ cassandra_medusa_config_mode }}"

# Written only from the keys given here: a key file of your own is left alone
- name: Write the S3 credentials
  ansible.builtin.include_tasks: ini_file.yml
  vars:
    _cassandra_medusa_ini_path: "{{ cassandra_medusa_key_file }}"
    _cassandra_medusa_ini_owner: "{{ cassandra_medusa_key_file_user }}"
    _cassandra_medusa_ini_group: "{{ cassandra_medusa_key_file_group }}"
    _cassandra_medusa_ini_mode: "{{ cassandra_medusa_key_file_mode }}"
    _cassandra_medusa_ini_content: |
      # Managed by Ansible (community.cassandra.cassandra_medusa)
      [{{ cassandra_medusa_api_profile or 'default' }}]
      aws_access_key_id = {{ cassandra_medusa_s3_access_key_id }}
      aws_secret_access_key = {{ cassandra_medusa_s3_secret_access_key }}
  when:
    - cassandra_medusa_s3_access_key_id != ''
    - cassandra_medusa_key_file != ''
