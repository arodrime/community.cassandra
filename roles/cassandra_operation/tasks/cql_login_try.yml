---
# One CQL login of cql_login.yml (_cassandra_cql_try_user, _password, _asked):
# a query on _cassandra_cql_login_from, its outcome in cassandra_cql_login.
- name: Log in over CQL on {{ _cassandra_cql_login_from }}
  community.cassandra.cassandra_cqlsh:
    execute: "SELECT release_version FROM system.local;"
    # as the operations log in (keyspaces.yml): what works here works for them
    cqlsh_host: "{{ _cassandra_cql_login_host }}"
    cqlsh_cmd: "{{ cassandra_cqlsh_command | default(omit, true) }}"  # (a cqlsh outside root's PATH, e.g. a virtualenv)
    username: "{{ _cassandra_cql_try_user }}"
    password: "{{ _cassandra_cql_try_password }}"
    debug: true  # its error, to tell a refused login from a node cqlsh can't reach
  delegate_to: "{{ _cassandra_cql_login_from }}"
  run_once: true
  register: _cassandra_cql_try
  failed_when: false
  changed_when: false
  check_mode: false  # a SELECT
  no_log: true  # the password

# the reason from a fixed list: nothing of cqlsh's own text (it could quote the login)
- name: Keep the outcome of the CQL login
  ansible.builtin.set_fact:
    cassandra_cql_login:
      state: >-
        {{ 'ok' if _cassandra_cql_try.rc | default(1) == 0
           else 'refused' if _err is search(_refused)
           else 'unchecked' }}
      why: >-
        {{ '' if _cassandra_cql_try.rc | default(1) == 0 or _err is search(_refused)
           else 'no cqlsh in the PATH of root on ' ~ _cassandra_cql_login_from ~ ': cassandra_cqlsh_command gives the'
                ~ ' full path of one' if _cassandra_cql_try.rc | default(1) == 127 and _cqlsh == 'cqlsh'
                or _cqlsh == 'cqlsh' and _err is search(_not_found)
           else _cqlsh ~ ' not found on ' ~ _cassandra_cql_login_from ~ ' (cassandra_cqlsh_command): give the full path'
                ~ ' of a cqlsh there' if _cassandra_cql_try.rc | default(1) == 127 or _err is search(_not_found)
           else 'cqlsh failed on ' ~ _cassandra_cql_login_from ~ ': it could not open a file it needs as root'
                ~ ' (cqlshrc, certificate...)' ~ _see if _err is search('No such file or directory|FileNotFoundError')
           else 'cqlsh could not reach ' ~ _cassandra_cql_login_host ~ ' from ' ~ _cassandra_cql_login_from if _err is search('Unable to connect|Connection refused|timed out|NoHostAvailable')
           else 'cqlsh failed on ' ~ _cassandra_cql_login_from ~ ': its Python could not load a module it needs' ~ _see
                if _err is search('No module named|ImportError|ModuleNotFoundError')
           else 'cqlsh failed on ' ~ _cassandra_cql_login_from ~ _see }}
      user: "{{ _cassandra_cql_try_user }}"
      password: "{{ _cassandra_cql_try_password }}"
      asked: "{{ _cassandra_cql_try_asked | bool }}"
  run_once: true
  no_log: true
  vars:
    _err: "{{ (_cassandra_cql_try.err | default('')) ~ ' ' ~ (_cassandra_cql_try.msg | default('')) }}"
    _refused: "AuthenticationFailed|Bad credentials|username and/or password are incorrect"
    # the program run: not found only when the error names it (cqlsh ran and missed another file: not this)
    _cqlsh: "{{ (cassandra_cqlsh_command | default('cqlsh', true)).split() | first | default('cqlsh') }}"
    _not_found: >-
      {{ "No such file or directory: b?'([^']*/)?" ~ (_cqlsh | basename | regex_escape) ~ "'|(^|[ /])"
         ~ (_cqlsh | basename | regex_escape) ~ ": (command )?not found" }}
    # its error is not quoted (it could hold the login): the same command as root shows it
    _see: >-
      {{ '; to see its error, run as root on ' ~ _cassandra_cql_login_from ~ ': '
         ~ cassandra_cqlsh_command | default('cqlsh', true) ~ ' ' ~ _cassandra_cql_login_host ~ ' -u ' ~ _cassandra_cql_try_user }}
