minor_changes:
  - "Operation playbooks - they ask for root on the nodes themselves (``become: true`` on their plays on the nodes), so neither ``-b`` nor ``become = true`` in ``ansible.cfg`` is needed and ad hoc commands stay unprivileged; ``status`` and ``health_check`` become root only to read ``cassandra_jmx_password_file``, ``help`` nowhere. ``help`` no longer adds ``-b`` to the commands it prints. The roles still leave become to the play that applies them (documented in each role README)."
