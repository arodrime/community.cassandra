minor_changes:
  - cassandra_linux - in containers, kernel settings (sysctl, swapoff, transparent huge pages) are no longer applied live, where they belong to the host; the files are still written. cassandra_linux_apply_live forces it either way.
  - cassandra_linux - new disk tuning of the Cassandra data disk, when cassandra_data_block_device or cassandra_data_dir is set - read-ahead (cassandra_data_readahead_kb, 4 KB), and the none IO scheduler on SSD/NVMe, applied now and kept across reboots with a udev rule.
