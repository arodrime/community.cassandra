---
# Installs the Java the inventory asks for (made the default java), writes the
# config (the jvm<N>-server.options of that Java apply), drains and restarts,
# then checks the restarted node runs the Java installed for it: the same
# binary and the same version, not only the same major.

- name: Install the Java this node moves to
  ansible.builtin.include_tasks: java_install.yml

- name: Write the config
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_config
  vars:
    cassandra_config_confirm: false  # confirmed once for the whole run
    _cassandra_config_axonops_later: true  # (the AxonOps role, next, installs the options file and checks it)
    _cassandra_config_no_restart_warning: true  # restarted next

# The AxonOps agent (cassandra_axonops_enabled): the Java agent package of the new Java, once the config is written
# (its refusals first: nothing swapped on one; its check of the agent's options file left to the role, which
# installs it), before the restart that loads it (the running JVM keeps the jar it opened)
- name: Set up the AxonOps agent for the new Java
  when: cassandra_axonops_enabled | default(false) | bool
  block:
    - name: Install the AxonOps packages of the new Java
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_axonops
      vars:
        _cassandra_change_report_quiet: true  # in the plan
  rescue:
    - name: Stop on the AxonOps agent, Cassandra still running
      ansible.builtin.fail:
        msg: "{{ _said | join(_nl) }}"
      vars:
        cassandra_output: true  # a verdict: its msg as is (ops callback)
        _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
        # (a stop of the role's own: its facts, its way out apart)
        _parts: "{{ ansible_failed_result.msg | default('') | community.cassandra.cassandra_axonops_stop_parts }}"
        _head:
          - "STOPPED  update_java  {{ inventory_hostname }}"
          - "  Cassandra still runs on its former Java"
          - "  the config of the new Java is written"
          - "  the AxonOps agent failed: {{ ansible_failed_task.name | default('') }}"
        _remedy: "{{ _parts.way_out | regex_replace('[,;]? *then run again[.]?$', '') or 'fix the cause' }}"
        _lines: >-
          {{ _head + ['    ' ~ (_parts.cause | community.cassandra.cassandra_url_masked),
                      'WAY OUT  ' ~ _remedy ~ ', then run update_java again'] }}
        _said: "{{ _lines | community.cassandra.cassandra_fit }}"

- name: Drain and restart the node
  ansible.builtin.include_tasks: action_restart.yml
  vars:
    _cassandra_exporter_check_left: >-
      not stopped (left running as it is); the Java and the config put in place apply at its next start

- name: Check it runs the new Java
  ansible.builtin.include_tasks: java_verify.yml
