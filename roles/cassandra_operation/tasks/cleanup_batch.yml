---
# One batch of the cleanup playbook, run once: cluster health, nodetool
# cleanup on every node of the batch at the same time, progress recorded.
# Expects cassandra_cleanup_batch (host names) and cassandra_cleanup_jobs.
- name: Batch {{ cassandra_cleanup_batch | join(', ') }}
  vars:
    _todo: "{{ cassandra_cleanup_batch | reject('in', cassandra_progress_done | default([])) | list }}"
  when: _todo | length > 0
  block:
    - name: Note the start time
      ansible.builtin.set_fact:
        _cassandra_cleanup_start: "{{ now().timestamp() | int }}"

    - name: Say what the batch does
      ansible.builtin.debug:
        msg: "{{ 'cleanup' | community.cassandra.cassandra_phase(_todo) }}"
      when: not ansible_check_mode
      vars:
        cassandra_output: true  # a phase line (ops callback)
        cassandra_output_gap: true  # a block of its own

    - name: Check the cluster before the batch
      ansible.builtin.include_tasks: cluster_health.yml

    - name: Start the cleanups
      community.cassandra.cassandra_cleanup:
        num_jobs: "{{ cassandra_cleanup_jobs }}"
      module_defaults:
        community.cassandra.cassandra_cleanup: >-
          {{ _cassandra_service_jmx | combine({'port': hostvars[item].cassandra_jmx_port | default(_cassandra_service_jmx.port) | int}) }}
      delegate_to: "{{ item }}"
      loop: "{{ _todo }}"
      async: "{{ cassandra_cleanup_timeout | default(_cassandra_stream_async) }}"
      poll: 0
      register: cassandra_cleanup_jobs_started
      when: not ansible_check_mode  # async has no check mode: the plan only

    - name: Start following the cleanups
      ansible.builtin.set_fact:
        _cassandra_stream_state: {}
        _cassandra_cleanup_states: {}

    - name: Follow the cleanups
      ansible.builtin.include_tasks: cleanup_wait.yml
      when: not ansible_check_mode

    - name: Add the batch to the progress file
      ansible.builtin.lineinfile:
        path: "{{ cassandra_progress_file }}"
        line: "{{ item }}"
      delegate_to: localhost
      become: false  # the controller: no sudo there
      vars:
        ansible_become: false  # an inventory ansible_become beats the become keyword
      loop: "{{ _todo }}"
      when: cassandra_progress_file is defined and not ansible_check_mode  # --check made no file

    - name: Record the result
      ansible.builtin.set_fact:
        cassandra_op_result: >-
          {{ 'would clean up' if ansible_check_mode
             else 'cleanup done in ' ~ (now().timestamp() | int - _cassandra_cleanup_start | int) ~ 's' }}
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ _todo }}"
  rescue:
    - name: Record the failure
      ansible.builtin.set_fact:
        cassandra_op_result: "cleanup FAILED: {{ [ansible_failed_result.msg | default('')] | flatten | join(' ') }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ _todo }}"

    # the cause once (the stop block), the nodes' table, the way out: no later batch was started
    - name: Stop here
      vars:
        cassandra_output: true  # a verdict: its msg as is
        cassandra_output_gap: true  # a block of its own
      ansible.builtin.fail:
        msg: >-
          {{ _cassandra_op_results | community.cassandra.cassandra_stop_block(
               'the batch ' ~ _todo | join(', '), ansible_failed_result.msg | default(''), check=ansible_check_mode,
               cluster=cassandra_cluster_name | default(''), operation=cassandra_service_summary_operation | default(''),
               action='cleanup', resume=cassandra_progress_file is defined, progress_file=cassandra_progress_file | default(''),
               task=ansible_failed_task.name | default(''), stderr=ansible_failed_result.stderr | default(''),
               hint=cassandra_service_resume_hint | default('' if cassandra_progress_file is defined
                                                            else 'clean up this batch and the ones after it with the cleanup playbook (--limit those nodes)'),
               batch=true, **_cassandra_run_command_args) }}
