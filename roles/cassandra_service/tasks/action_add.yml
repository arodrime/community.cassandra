---
# Prepares a new node with the roles (action_add_prepare.yml; add_node did it
# already for all of them at once: _cassandra_add_prepared) and starts it (it
# bootstraps into the ring)
- name: Prepare the node
  ansible.builtin.include_tasks: action_add_prepare.yml
  when: not _cassandra_add_prepared | default(false) | bool

- name: Start it
  ansible.builtin.include_tasks: main.yml
  vars:
    cassandra_service_wait_for_normal: false  # the bootstrap is waited for below
    cassandra_service_allow_new_seed: true  # in cassandra_seeds or not, it joins with _cassandra_join_seeds

# A bootstrap streams the node's share of the data: hours on big nodes. The
# wait goes on as long as the streams make progress (stream_wait.yml). Stopping
# to wait leaves the node as it is: running add_node again waits for the same
# bootstrap.
- name: Wait for the bootstrap
  when:
    - cassandra_service_wait_for_normal
    - not ansible_check_mode
  module_defaults:
    community.cassandra.cassandra_netstats: "{{ _cassandra_service_jmx }}"
  block:
    # Before 5.0.5 the StorageService MBean is only there once the bootstrap is
    # over (CASSANDRA-19902); a JMX login or permission refused: JMX answering
    # is enough here (the bootstrap is then followed from the other nodes)
    - name: Wait for Cassandra to answer on JMX
      community.cassandra.cassandra_netstats:
      register: cassandra_service_netstats
      until: _answers | bool
      retries: "{{ (cassandra_service_wait_timeout | int / 10) | int }}"
      delay: 10
      failed_when: not _answers | bool
      vars:
        _error: "{{ cassandra_service_netstats.stderr | default('') ~ ' ' ~ cassandra_service_netstats.msg | default('') }}"
        # nodetool reaches it (not refused) and gets an answer, if only a refusal
        _answers: >-
          {{ cassandra_service_netstats.mode | default('') | length > 0
             or ('Connection refused' not in _error
                 and _error is search('InstanceNotFoundException|SecurityException|Authentication failed|Access denied|Credentials')) }}

    - name: Start following the bootstrap
      ansible.builtin.set_fact:
        _cassandra_stream_state: {}

    - name: Follow the bootstrap
      ansible.builtin.include_tasks: stream_wait.yml
      vars:
        _cassandra_stream_what: "{{ _cassandra_join_what | default('bootstrap') }}"
        _cassandra_stream_operations: [Bootstrap]
        _cassandra_stream_from: ["{{ inventory_hostname }}"]
        _cassandra_stream_join: true
        _cassandra_stream_peers: >-
          {{ query('community.cassandra.cassandra_nodes')
             | reject('in', query('ansible.builtin.inventory_hostnames', cassandra_target_nodes | default(inventory_hostname)))
             | list }}
        _cassandra_stream_advice: >-
          {{ _cassandra_join_then | default('if nodetool netstats on it still shows streams, run add_node again to go on waiting.') }}
          JOINING with no stream left is a failed bootstrap on 4.0 and 4.1 (see system.log): nodetool bootstrap resume
          on it retries the missing ranges. To start over instead (a bootstrap that failed): stop Cassandra, empty its data, commitlog, saved_caches and
          hints directories, wait until it is gone from nodetool status (seen from another node), then
          {{ _cassandra_join_over | default('run add_node again.') }}
