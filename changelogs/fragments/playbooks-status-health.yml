minor_changes:
  - "preflight, status and health_check - new playbooks (``ansible-playbook community.cassandra.<name>``) on the cluster one inventory group describes (``-e cassandra_hosts=<group>``, the ``CASSANDRA_CLUSTER`` environment variable, else the inventory's only cluster). ``preflight`` checks the cluster against its inventory before an operation changes it: the settings that must match on every node, the racks the token allocator accepts, every seed an up member, one Cassandra version, root on the nodes, the cluster name nodetool reports, the account Cassandra runs as able to read the config; it warns about ``cassandra_*`` variables no role or playbook knows and about sensitive or suspicious settings (``cassandra_suspicious_ack`` silences one a node keeps on purpose). ``status`` shows the ring from one node, where it and the inventory differ, and a verdict; ``health_check`` checks the ring, gossip, the native transport, streams, schema agreement and the ports from every node and fails on a problem (https://github.com/ansible-collections/community.cassandra/issues/334)."
  - "cassandra_operation - new internal role holding the task files of the playbooks (preflight checks, cluster health) and the settings they read (``cassandra_node_state``, ``cassandra_suspicious_ack``; ``cassandra_service_health_timeout`` and ``cassandra_service_health_force`` for the operations that wait for the cluster, ``health_check`` reads it once); not a role to run on its own."
