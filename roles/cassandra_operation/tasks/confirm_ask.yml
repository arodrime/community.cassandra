---
# One question of confirm.yml (every confirmation of the collection asks
# here). It names the cluster itself, on a line above the question (the
# banner's name, else cassandra_cluster_name): the callers' questions do not.
# It includes itself again after an answer that is neither yes nor no (pause
# has no until on every ansible-core version). _cassandra_confirm_skip: the
# variable that skips the question, said without a terminal (default
# cassandra_operation_confirm); _cassandra_confirm_unchanged: what its stops
# say was left as it was (default "nothing changed"; cassandra_config, after
# other roles of the same play: "config not written"). A stop stops the play
# (run_once), every node of it.
- name: Count the answers
  ansible.builtin.set_fact:
    _cassandra_confirm_tries: "{{ _cassandra_confirm_tries | int + 1 }}"
  run_once: true

# (pause ends the prompt line with ':', the mark of a question)
- name: Confirm the operation
  ansible.builtin.pause:
    prompt: >-
      {{ (('Cluster: ' ~ _cluster ~ _nl if _cluster else '') ~ cassandra_confirm_prompt ~ ' Answer yes or no')
         if _cassandra_confirm_tries | int == 1 else 'Please answer yes or no' }}
  register: _cassandra_confirm_reply
  run_once: true
  vars:
    cassandra_output_gap: true  # a rule above the question (ops callback)
    _cluster: "{{ hostvars['localhost']._cassandra_cluster_shown | default(cassandra_cluster_name | default('')) }}"
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)

- name: Read the answer
  ansible.builtin.set_fact:
    _cassandra_confirm_answer: "{{ _cassandra_confirm_reply | community.cassandra.cassandra_confirm_answer }}"
  run_once: true

- name: Stop, no terminal to answer on
  ansible.builtin.fail:
    msg: |-
      No terminal to answer the confirmation on, {{ _cassandra_confirm_unchanged | default('nothing changed') }}. The question:
      {{ cassandra_confirm_prompt }}
      Run it from a terminal, or add -e {{ _cassandra_confirm_skip | default('cassandra_operation_confirm') }}=false to go on without asking.
  run_once: true
  when: _cassandra_confirm_answer == 'no_terminal'
  vars:
    cassandra_output: true

# Only go and again carry on, whatever else the answer turned into
- name: Stop at the operator's request
  ansible.builtin.fail:
    msg: "Stopped at your request, {{ _cassandra_confirm_unchanged | default('nothing changed') }}."
  run_once: true
  when: _cassandra_confirm_answer not in ['go', 'again']
  vars:
    cassandra_output: true

- name: Stop after 3 answers that are neither yes nor no
  ansible.builtin.fail:
    msg: "No yes or no after 3 answers, stopped, {{ _cassandra_confirm_unchanged | default('nothing changed') }}."
  run_once: true
  when:
    - _cassandra_confirm_answer == 'again'
    - _cassandra_confirm_tries | int >= 3
  vars:
    cassandra_output: true

- name: Ask again
  ansible.builtin.include_tasks: confirm_ask.yml
  when: _cassandra_confirm_answer == 'again'
