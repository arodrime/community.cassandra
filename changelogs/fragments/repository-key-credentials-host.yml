security_fixes:
  - cassandra_repository - the mirror credentials (``cassandra_install_username`` and ``cassandra_install_password``) were sent with the download of ``cassandra_repository_key_url`` whatever its host (e.g. ``downloads.apache.org``); they are now sent only when the keys are on the host of ``cassandra_install_url``, as for the Java tarball and DSBulk.
