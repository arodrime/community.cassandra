- name: Get read timeout
  ansible.builtin.shell: nodetool -h 127.0.0.1 gettimeout read
  register: read

- name: Assert starting status of timeout read
  ansible.builtin.assert:
    that: "'Current timeout for type read: 5000 ms' == read.stdout"

- name: Read the read timeout with module (no value)
  community.cassandra.cassandra_timeout:
    timeout_type: read
  register: read_mode

- name: Assert the module returned the starting read timeout and changed nothing
  ansible.builtin.assert:
    that:
      - read_mode.changed == False
      - read_mode.current == 5000
      - read_mode.unit == 'ms'
      - read_mode.current_raw == read.stdout

- name: Set read timeout with module and get the value before the change
  community.cassandra.cassandra_timeout:
    timeout_type: read
    timeout: 7000
  register: set_mode

- name: Assert the set returned the value before the change
  ansible.builtin.assert:
    that:
      - set_mode.changed == True
      - set_mode.current == read_mode.current

- name: Read the read timeout again with module
  community.cassandra.cassandra_timeout:
    timeout_type: read
  register: read_mode

- name: Assert the module read the new read timeout
  ansible.builtin.assert:
    that:
      - read_mode.changed == False
      - read_mode.current == 7000

- name: Increase read timeout with module
  community.cassandra.cassandra_timeout:
    timeout: 15000
    timeout_type: read
    debug: true
  register: read

- ansible.builtin.assert:
    that: 
      - read.changed
      - "read.msg == 'read timeout changed'"

- name: Get read timeout
  ansible.builtin.shell: nodetool -h 127.0.0.1 gettimeout read
  register: timeout

- name: Assert timeout is 15000 ms
  ansible.builtin.assert:
    that: "'Current timeout for type read: 15000 ms' == timeout.stdout"

- name: Set throughput to 15000 again
  community.cassandra.cassandra_timeout:
    timeout: 15000
    timeout_type: read
    debug: true
  register: timeout

- ansible.builtin.assert:
    that: 
      - "timeout.changed == False"
      - "timeout.msg == 'read timeout unchanged'"

- name: Set timeout to 0 (check mode)
  community.cassandra.cassandra_timeout:
    timeout: 0
    timeout_type: read
    debug: true
  check_mode: yes
  register: timeout

- ansible.builtin.assert:
    that:
      - timeout.changed
      - "timeout.msg == 'read timeout changed'"

- name: Get read timeout - Should still be 15000
  ansible.builtin.shell: nodetool -h 127.0.0.1 gettimeout read
  register: timeout

- name: Ensure timeout is 15000
  ansible.builtin.assert:
    that:
      - "timeout.stdout == 'Current timeout for type read: 15000 ms'"

- name: Set timeout to 0 
  community.cassandra.cassandra_timeout:
    timeout: 0
    timeout_type: read
    debug: true
  register: timeout  

- ansible.builtin.assert:
    that:
      - timeout.changed
      - "timeout.msg == 'read timeout changed'"

- name: Get read timeout
  ansible.builtin.shell: nodetool -h 127.0.0.1 gettimeout read
  register: timeout

- name: Ensure timeout is 0
  ansible.builtin.assert:
    that:
      - "timeout.stdout == 'Current timeout for type read: 0 ms'"

- name: Return timeout to something high otherwise we mess up later tests
  community.cassandra.cassandra_timeout:
    username: "{{ cassandra_admin_user }}"
    password: "{{ cassandra_admin_pwd }}"
    timeout: 5000
    timeout_type: read

- ansible.builtin.include_tasks: ../../setup_cassandra/tasks/cassandra_auth.yml
  when: cassandra_auth_tests == True

- name: Test various timeout settings in loop
  ansible.builtin.include_tasks: timeout_test.yml
  with_items: "{{ cassandra_3_timeouts if cassandra_version.startswith('3') else cassandra_4_timeouts }}"


- name: Test login failure handling
  community.cassandra.cassandra_timeout:
    timeout: 1000
    timeout_type: read
    username: "{{ cassandra_admin_user }}"
    password: XXXXXXXXXXXXXXXXXXXXX
    debug: true
  register: login_status
  ignore_errors: true
  when: cassandra_auth_tests == True

- name: Assert failed login
  ansible.builtin.assert:
    that:
      - login_status.failed == True
      - "'Invalid username or password' in login_status.stderr"
  when: cassandra_auth_tests == True

- name: Test incorrect nodetool_path handling
  community.cassandra.cassandra_timeout:
    timeout: 1000
    timeout_type: read
    nodetool_path: /tmp
    debug: true
  register: nodetool_path_error
  ignore_errors: true
  when: cassandra_auth_tests == True

- name: Assert no such file
  ansible.builtin.assert:
    that:
      - "'Error executing command' in nodetool_path_error.msg or 'No such file or directory' in nodetool_path_error.msg"
