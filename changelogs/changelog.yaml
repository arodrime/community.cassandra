        description: Returns the status of gossip (#324).
  2.0.0:
    release_summary: |
      Cassandra 5.0 officially supported.
    roles:
      - cassandra_repository: (#328) apt key handling modernized to signed-by keyring (the old apt_key approach fails GPG verification for the 50x repo).
      - cassandra_linux: (#328) fixed ansible.builtin.mount resolution, added missing ansible.posix dependency.
    modules:
      - cassandra_streamthroughput / cassandra_interdcstreamthroughput: (#328) fixed a pre-existing bug (present since 4.1) where the -d flag never actually reached nodetool, causing both to fail on 4.1+/5.0.
      - cassandra_verify: (#328) extended the existing 4.1 "verify disabled by default" test skip to 50x (same restriction applies).
      - cassandra_role: (#328) 5.0's Dynamic Data Masking adds 2 implicit permissions (UNMASK, SELECT_MASKED). Test now expects the right row count per version instead of a hardcoded one.
      - cassandra_status: (#331,#332) various bugfixes and enhancements.
  2.1.0:
    release_summary: |
      New cassandra_config and cassandra_service roles: a blank host becomes a running Cassandra 4.0, 4.1 or 5.0 node using the roles only.
    breaking_changes:
      - cassandra_repository / cassandra_install: default cassandra_version is now 50x (was 41x).
      - cassandra_firewall: port 9160 (Thrift, removed in 4.0) is no longer opened by default.
      - cassandra_linux: is_docker.txt is gone; in containers, kernel settings are written but not applied live unless cassandra_linux_apply_live is true.
      - cassandra_config: G1 is the default GC on every series, including 4.x (stock 4.x runs CMS); set cassandra_jvm_gc to CMS to keep it.
    roles:
      - cassandra_config: new role. Templates cassandra.yaml, cassandra-env.sh, jvm*-server.options, cassandra-rackdc.properties and logback.xml from the stock files of 4.0.21, 4.1.12 and 5.0.9, one variable per setting, defaults equal to stock (generated by tools/gen_templates.py).
      - cassandra_config: TLS/mTLS keystore and truststore passwords, outbound keystore (5.0) and optional flags exposed; on RedHat the live config is an alternatives-selected copy of default.conf (cassandra_rpm_conf_alternative), leaving the package files untouched.
      - cassandra_service: new role. Native systemd unit (the packages only ship a SysV script), start, wait for Mode NORMAL. Restart=no by default (a node that died stays down for a human to look at); on-failure is opt-in with a restart cap.
      - cassandra_install: installs the Java version matching the series (11 for 4.x, 17 for 5.0) and cassandra-tools on RedHat; keeps the Debian package from starting Cassandra before it is configured; installs jemalloc; fixes cqlsh on RedHat when python3 is not 3.6 (CASSANDRA-19206).
      - cassandra_install: cqlsh runs with python3.11 when the system python3 is outside the range the series supports (4.x 3.6-3.11, e.g. Ubuntu 24.04; 5.0 3.8-3.13, e.g. EL8 with python 3.6), installed next to it (deadsnakes PPA on Ubuntu, configurable).
      - cassandra_repository: runs apt update before installing prerequisites.
      - cassandra_linux: read-ahead and IO scheduler tuning of the data disk.
      - cassandra_firewall: FQCNs for firewalld/ufw; tests now actually run.
