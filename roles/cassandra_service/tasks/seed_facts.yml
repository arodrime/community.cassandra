---
# A node is a seed when one of its addresses is in cassandra_seeds (port ignored)
- name: Work out whether this node is a seed
  ansible.builtin.set_fact:
    _cassandra_service_seeds: "{{ _seeds }}"
    _cassandra_service_is_seed: "{{ _seeds | intersect(_mine) | length > 0 }}"
  vars:
    _seeds: >-
      {{ ((cassandra_seeds | default([])) if cassandra_seeds | default([]) is not string else cassandra_seeds.split(','))
         | map('trim') | map('regex_replace', ':[0-9]+$', '') | select | list }}
    _mine: >-
      {{ ([inventory_hostname, ansible_host | default(''), ansible_facts['fqdn'] | default(''),
           ansible_facts['hostname'] | default(''), cassandra_listen_address | default('')]
          + ansible_facts['all_ipv4_addresses'] | default([])) | select | list }}
