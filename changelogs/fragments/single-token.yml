minor_changes:
  - "cassandra_config role - new ``cassandra_initial_token`` option (``initial_token``); a node that has joined keeps the ``initial_token`` its ``cassandra.yaml`` has when the option is empty, and ``initial_token`` is no longer refused as an identity change (Cassandra reads it at a node's first start only). ``cassandra_allocate_tokens_for_local_replication_factor`` defaults to empty (commented out) with one token per node (``cassandra_num_tokens: 1``): a single-token node set up without it set explicitly gets that line commented out."
  - "import_cluster playbook - ``initial_token`` is imported as ``cassandra_initial_token`` (it was kept in ``cassandra_extra_settings``). An inventory that still has ``initial_token`` in ``cassandra_extra_settings`` is refused by cassandra_config (the template has the setting now): move it to ``cassandra_initial_token``."
  - "create_cluster playbook - with one token per node, the nodes without ``cassandra_initial_token`` get evenly spaced tokens (racks in turn, datacenters 100 tokens apart), shown with each node's share and confirmed; a datacenter where only some nodes have one is refused unless ``cassandra_token_allow_partial``. A rerun keeps the tokens of the running nodes."
  - "add_node playbook - with one token per node, a new node needs ``cassandra_initial_token`` or ``cassandra_token_auto`` (``bisect``, ``balanced``, or ``true`` to choose after seeing both plans)."
  - "add_datacenter playbook - with one token per node, the new nodes without ``cassandra_initial_token`` get evenly spaced tokens."
  - "preflight playbook - ``cassandra_partitioner`` must match on every node; the racks are not checked for the token allocator with one token per node; a moving seed counts as up."
  - "New move_node playbook - moves single-token nodes one at a time (by default, the fewest moves that even out each datacenter), with a disk space check before each move; the nodes that lost ranges are recorded until a run cleans them up (``cassandra_move_cleanup``), the cleanup command is printed otherwise."
