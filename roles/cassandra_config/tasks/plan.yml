---
# The plan: what the role would change on the node, worked out from what it reads there; nothing is written
# (apply_plan.yml says, confirms and writes what it lists). The only code that decides what the role changes:
# apply_config's compare runs it on every node.
- name: Check the variables
  ansible.builtin.include_tasks: checks.yml
  when: not _cassandra_config_checks_once | default(false) | bool

# _cassandra_config_checks_once (apply_config's compare, every node of the play running this): the checks once for
# the nodes whose values they read are the same (checks_once.yml)
- name: Check the variables once for the nodes that share them
  ansible.builtin.include_tasks: checks_once.yml
  when: _cassandra_config_checks_once | default(false) | bool

- name: Check that the Cassandra package's config is there
  ansible.builtin.stat:
    path: "{{ _cassandra_config_pkg_conf_dir }}"
  register: cassandra_config_pkg_conf

- name: Stop if Cassandra is not installed
  ansible.builtin.fail:
    msg: "{{ _cassandra_config_pkg_conf_dir }} not found: install Cassandra first (cassandra_install)"
  when:
    - not cassandra_config_pkg_conf.stat.exists
    - not ansible_check_mode

- name: Nothing to compare yet (--check before the package is installed)
  ansible.builtin.set_fact:
    _cassandra_config_items:
      - item: config files
        before: Cassandra not installed yet
        after: "{{ _cassandra_config_files[_cassandra_config_series] | length }} files templated"
  when: not cassandra_config_pkg_conf.stat.exists

- name: Check the variables against the release to install
  ansible.builtin.import_tasks: since.yml
  when: not cassandra_config_pkg_conf.stat.exists

- name: Work out the changes
  when: cassandra_config_pkg_conf.stat.exists
  block:
    - name: Read the node
      ansible.builtin.import_tasks: read.yml

    - name: Tell whether the node is blank
      ansible.builtin.import_tasks: node_state.yml

    - name: Compare the new files with the live ones
      ansible.builtin.import_tasks: compare.yml

    # (its restart, by the run or later, would take it back: Cassandra starts with the earlier mode, or not at all;
    # or more than one step ahead, CASSANDRA_4 to NONE)
    - name: Refuse a storage_compatibility_mode before the one Cassandra runs, or two steps after it
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: storage_mode_guard.yml
      vars:
        _cassandra_storage_mode_written: true  # the inventory's mode, written then restarted with
      when: cassandra_version == '50x'

    - name: List what to change
      ansible.builtin.import_tasks: changes.yml

    # (included only with JMX users, cqlsh credentials or JMX TLS: a task skipped costs each node a build of its
    # variables)
    - name: The users' files
      ansible.builtin.include_tasks: access_plan.yml
      when: cassandra_jmx_users | length > 0 or cassandra_cqlsh_credentials | length > 0 or cassandra_jmx_ssl_enabled | bool

    # Skipped in check mode (--check, or check_mode applied to the role, as apply_config's preview does): this run
    # only looks, else it writes the files
    - name: Tell a run that writes from one that only looks
      ansible.builtin.command: "true"
      register: _cassandra_config_exporter_writes
      changed_when: false

    # (in a run that writes: once the JVM options file is written, prometheus_exporter_cleanup.yml)
    - name: Find what the exporter's agent no longer needs (a run that only looks)
      ansible.builtin.include_tasks: prometheus_exporter_find.yml
      when: _cassandra_config_exporter_writes is skipped

# What the rest of the role (apply_plan.yml) would write or say on this node, by what the plan found ([] nothing:
# it would leave the facts the plan set as they are, _cassandra_config_items and _cassandra_config_exporter_changes
# empty, and say nothing). apply_config's compare runs the rest only where it is not empty. "exporter": the
# Prometheus exporter on (its files compared by the rest), or its files no longer needed not read by the plan (a
# run that writes reads them once the JVM options file is written)
- name: Note what the rest of the role would write
  ansible.builtin.set_fact:
    _cassandra_config_plan_writes: "{{ _found | dict2items | selectattr('value') | map(attribute='key') | list }}"
  vars:
    _found:
      not installed: "{{ not cassandra_config_pkg_conf.stat.exists }}"
      files: >-
        {{ (_cassandra_config_changes | default([])
            + _cassandra_config_write | default([]) | reject('in', _cassandra_config_kept | default([])) | list) | length > 0 }}
      # (RedHat: /etc/cassandra/conf to point at cassandra_rpm_conf_alternative, every file kept or not: confirm.yml's
      # item of it)
      conf directory: >-
        {{ cassandra_config_conf_target is defined and cassandra_config_conf_target is not skipped
           and cassandra_config_conf_target.stat.lnk_source | default('') != cassandra_rpm_conf_alternative }}
      owner, group, mode: "{{ _cassandra_config_perm_changes | default([]) | length > 0 }}"
      directories: >-
        {{ (_cassandra_config_dir_changes | default([])
            + cassandra_config_dirs.results | default([]) | rejectattr('stat.exists') | list) | length > 0 }}
      header: "{{ _cassandra_config_header | default([]) | length > 0 }}"
      # (a node not blank compares both files with the users: written only when missing or other)
      JMX files: >-
        {{ cassandra_jmx_users | length > 0
           and (cassandra_config_jmx_same.stdout is not defined or _cassandra_config_jmx_changes | default([]) | length > 0
                or cassandra_config_jmx_header.stdout | default('[]') | from_json | length > 0) }}
      # (cqlsh's and nodetool's files of the users' ~/.cassandra)
      users' files: "{{ _cassandra_config_user_file_changes | default([]) | length > 0 }}"
      exporter: >-
        {{ cassandra_prometheus_exporter_enabled | bool or cassandra_config_exporter_unused.stdout_lines is not defined
           or cassandra_config_exporter_unused.stdout_lines | length > 0 }}
