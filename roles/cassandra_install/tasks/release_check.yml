---
# Another release of an installed node (the upgrade's, apply_config's in its restart; under --check, at its plan; and
# apply_config's once it wrote the repository live, before the drain and the stop): in the repository the node
# reads, as the install sees it, else a stop with the package manager's own words, before the package is changed
# (else dnf or apt failed later, its reason dropped). Run from cassandra.yml, after _cassandra_install_before is
# read (install.yml), or on its own (tasks_from, _cassandra_install_before given).
# (dnf exits 1 when it lists nothing, or cannot read a repository; apt-cache madison reads the apt cache only: no
# match is said by an echo of our own)
- name: Look for the release in the repository
  ansible.builtin.shell: >-
    {% if ansible_facts['os_family'] == 'Debian' %}
    apt-cache madison cassandra 2>&1 | grep -E "[|] *{{ cassandra_package_version | regex_escape }}([-~+][^ ]*)? *[|]"
    || { apt-cache madison cassandra 2>&1 | head -5; echo "no cassandra {{ cassandra_package_version }} in apt-cache madison cassandra"; exit 1; }
    {% else %}
    dnf -q --showduplicates list available
    {{ '--disableexcludes=all' if _cassandra_java_home != '' else '' }} {{ _repos }} {{ _name }} 2>&1
    {% if _cassandra_java_home == '' %}
    || { dnf -q --showduplicates list available --disableexcludes=all {{ _repos }} {{ _name }} >/dev/null 2>&1 &&
    echo "{{ _name }} is in the repository, excluded on this node (dnf excludepkgs or versionlock)"; exit 1; }
    {% endif %}
    {% endif %}
  vars:
    # the repository the role manages alone, as the download reads it (an unreachable OS repository on an
    # air-gapped site is not read); the excludes and versionlock as the install honours them (the package module),
    # not the download (cassandra_java_home: dnf download ignores them)
    _own_repo: "{{ cassandra_repository_manage | default(not cassandra_offline | default(false) | bool) | bool }}"
    _repos: >-
      {{ ("--disablerepo='*' --enablerepo=" ~ ('cassandra-' ~ cassandra_version) | quote) if _own_repo | bool else '' }}
    _name: "{{ ('cassandra-' ~ cassandra_package_version) | quote }}"
  register: cassandra_install_release
  changed_when: false
  failed_when: false
  check_mode: false  # a read
  when:
    - _cassandra_install_upgrade | default(false) | bool
    - cassandra_package_version != ''
    - not cassandra_offline | bool
    - cassandra_install_method in ['repository', 'system']
    - "'cassandra' in _cassandra_install_before"
    # (the plan, the repository changed by this run: not written yet, read by the window's own update)
    - not (_cassandra_install_check and _cassandra_repository_items | default([]) | length > 0)
    - >-
      (_cassandra_install_before['cassandra'][0].version | regex_replace('^([0-9]+\.[0-9]+\.[0-9]+).*$', '\1'))
      != cassandra_package_version

# one fact per line: what the package manager said (a repository it could not read named as such), what this run
# changed, the way out. A caller whose run goes on from the node (_cassandra_install_again: "resume", apply_config's
# node turn; "start Cassandra ..., then run ...", upgrade's node, stopped) gets its way out as the stop block takes
# it (WAY OUT, then that end: one way out), with what it changed on the node before (_cassandra_install_changed_before)
- name: Stop when the release is not in the repository
  ansible.builtin.fail:
    # (nothing changed, the caller's head given, its plan: the REFUSED block of a stop before any change)
    msg: >-
      {{ (_cassandra_install_refused_head | community.cassandra.cassandra_refused([_said, 'Way out: ' ~ _fix ~ ', then run again.'])
          | join(_nl))
         if _cassandra_install_refused_head | default('') | trim and not _written | bool
         else ([_said, _changed] + _before + ['WAY OUT  ' ~ _fix ~ ', then ' ~ _cassandra_install_again]) | join(_nl)
         if _cassandra_install_again | default('') | trim
         else [_said, _changed, 'Way out: ' ~ _fix ~ ', then run again.'] | join(_nl) }}
  vars:
    _written: "{{ not _cassandra_install_check and _cassandra_repository_items | default([]) | length > 0 }}"
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    _tool: "{{ 'apt-cache madison cassandra' if ansible_facts['os_family'] == 'Debian' else 'dnf' }}"
    _lines: "{{ (cassandra_install_release.stdout_lines | default([]) | select | list)[-3:] }}"
    _unread: "{{ {'msg': cassandra_install_release.stdout | default('')} | community.cassandra.cassandra_failure_repos | length > 0 }}"
    _said: >-
      {{ inventory_hostname }}: {{ _tool }} did not list Cassandra {{ cassandra_package_version }}{{
      ' (it could not read a repository)' if _unread | bool else '' }}: {{ _lines | join('; ') or 'nothing listed' }}.
    _changed: >-
      Its Cassandra package was not changed{{ '; its repository file was written by this run' if _written | bool else '' }}.
    # (what the caller changed on it before: each on a line)
    _before: >-
      {{ ['Changed on it by this run before: ' ~ _cassandra_install_changed_before | join(', ') ~ '.']
         if _cassandra_install_changed_before | default([]) else [] }}
    _excluded: "{{ cassandra_install_release.stdout | default('') is search('excluded on this node') }}"
    _fix: >-
      {{ 'make that repository answer on the node' if _unread | bool else
         'lift the exclusion of cassandra on the node (excludepkgs in dnf.conf or the repository file, or'
         ~ ' dnf versionlock delete cassandra)' if _excluded | bool else
         'set cassandra_package_version to a release it lists (' ~ ('apt-cache madison cassandra'
         if ansible_facts['os_family'] == 'Debian' else 'dnf --showduplicates list cassandra') ~ ' there), or add that'
         ~ ' release to the repository' }}
  when:
    - cassandra_install_release is not skipped
    - cassandra_install_release.rc | default(0) != 0
