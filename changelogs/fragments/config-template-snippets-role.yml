minor_changes:
  - 'cassandra_config role - ``cassandra_config_template_snippets`` adds template pieces of yours to the role''s files, rendered with the same variables, at insertion points: ``logback.xml`` (the end of its ``<configuration>``, after ``cassandra_logback_extra_lines``), ``logback.xml:appenders`` (before ``<root>``) and ``cassandra-env.sh`` (its end, after ``cassandra_env_extra_lines``): blocks kept in template files rather than as lines in the inventory.'
