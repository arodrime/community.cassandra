---
- name: Keep the modules on the system python3
  ansible.builtin.import_tasks: python_interpreter.yml

# (the change report of an earlier run of the role for this host is not shown again)
- name: Forget what an earlier run of the role found
  ansible.builtin.set_fact:
    _cassandra_install_items: []
    _cassandra_install_dsbulk_change: {}

- name: Check the install method
  ansible.builtin.assert:
    that:
      - cassandra_install_method in ['repository', 'packages', 'system']
      - cassandra_install_method != 'packages' or cassandra_package_version != ''
    fail_msg: >-
      {{ ('cassandra_install_method is ' ~ cassandra_install_method ~ ': '
          ~ ('not supported yet' if cassandra_install_method == 'tarball' else 'unknown')
          ~ ', use repository, packages or system.')
         if cassandra_install_method not in ['repository', 'packages', 'system']
         else 'cassandra_install_method packages needs cassandra_package_version (e.g. "5.0.7"): it names the files to download.' }}
    quiet: true

- name: Check the Java
  ansible.builtin.import_tasks: java_check.yml

- name: Snapshot installed packages (change report)
  ansible.builtin.package_facts:
  check_mode: false

- name: Keep the snapshot
  ansible.builtin.set_fact:
    _cassandra_install_before: "{{ ansible_facts['packages'] }}"

- name: Java, the package or a tarball, as the default java
  ansible.builtin.import_tasks: java.yml

- name: Cassandra's packages and jemalloc
  ansible.builtin.import_tasks: cassandra.yml

# (a typo would leave the package's cqlsh set up, or not, without a word)
- name: Check cassandra_cqlsh_source
  ansible.builtin.assert:
    that:
      - cassandra_cqlsh_source in ['package', 'external']
      - cassandra_cqlsh_source == 'package' or cassandra_cqlsh_command | default('cqlsh', true) != 'cqlsh'
    fail_msg: >-
      {{ 'cassandra_cqlsh_source must be package or external, not ' ~ cassandra_cqlsh_source
         if cassandra_cqlsh_source not in ['package', 'external']
         else 'cassandra_cqlsh_source is external: set cassandra_cqlsh_command to the full path of that cqlsh (a file only'
              ~ ' root can write, the playbooks run it as root), or set cassandra_cqlsh_source to package' }}
    quiet: true

- name: The Python cqlsh runs with
  ansible.builtin.import_tasks: cqlsh_python.yml

- name: Link cqlshlib and point cqlsh at its Python
  ansible.builtin.import_tasks: cqlsh_links.yml

# DataStax Bulk Loader, next to the tools
- name: Install dsbulk
  ansible.builtin.include_tasks: dsbulk.yml
  when: cassandra_dsbulk_install | bool

- name: Report changes
  ansible.builtin.include_tasks: report.yml
