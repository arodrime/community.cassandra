minor_changes:
  - "cassandra_service - a node that never started and is listed in ``cassandra_seeds`` is refused when the cluster already runs, i.e. another seed answers or a host of the run linked to it by the seed lists started before (seeds don't bootstrap, it would join without its data); seeds started by the same run don't count, nodes with ``auto_bootstrap`` false or another seed provider than ``SimpleSeedProvider`` are not checked, ``cassandra_service_allow_new_seed`` skips the check (https://github.com/ansible-collections/community.cassandra/issues/334)."
  - "cassandra_config - on a running node the seed list is applied live (``nodetool reloadseeds``) on every run, with the JMX login in ``cassandra_jmx_username`` and ``cassandra_jmx_password_file`` or ``cassandra_jmx_password``; a reload that fails is reported and the list applies at the next restart; a change of the seeds alone that was applied live is not reported as needing a restart. ``cassandra_config_reload_seeds: false`` turns it off (https://github.com/ansible-collections/community.cassandra/issues/334)."
