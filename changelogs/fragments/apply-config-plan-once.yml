minor_changes:
  - "apply_config playbook - under ``--check`` the plan is said once, at the end: the verdict (the restarts first: ``CHECK  apply_config  prod  1 would restart, 2 up to date``), ``nothing was changed (--check)``, ``WHAT CHANGES`` (the settings that differ), ``WHAT HAPPENS`` (each node's outcome), then the warnings; no plan screen before it. The settings that differ come in one table (``Setting``, ``Node``, ``Inventory``, ``Nodes``) with the node's value and the inventory's in aligned columns and fixed words (``absent``, ``present``, ``**** (another)``) instead of ``a -> b``; a file's nodes once on its row when all its settings change on the same nodes; the read-ahead in KB everywhere (LVM's sectors converted); a row too wide has its nodes on the next line, a value is never cut. A nodes' outcome list is aligned, ``up to date`` everywhere for a node with nothing to apply, and the real run's plan says its order in one line."
