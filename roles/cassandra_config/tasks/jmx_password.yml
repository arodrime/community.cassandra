---
# The JMX password file (cassandra_jmx_users), from access.yml; apply_config
# also writes it on its own first, where it is missing or other: the JVM reads
# it at each login, and the checks before a node's turn log in with it.
# (its directory made first if gone, as access.yml does for both files)
- name: Create the directory of the JMX password file
  ansible.builtin.command:
    argv: [mkdir, -p, -m, "0755", "{{ cassandra_jmx_remote_password_file | dirname }}"]
    creates: "{{ cassandra_jmx_remote_password_file | dirname }}"

- name: Write jmxremote.password
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.template', 'jmxremote.password.j2') }}"
    dest: "{{ cassandra_jmx_remote_password_file }}"
    owner: "{{ _cassandra_config_perm.owner }}"
    group: "{{ _cassandra_config_perm.group }}"
    mode: "{{ _cassandra_config_perm.mode }}"
  no_log: true
  diff: false
  vars:
    _cassandra_config_perm_file: jmxremote.password
