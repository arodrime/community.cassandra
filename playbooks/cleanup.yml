---
# Remove the data each node no longer owns (nodetool cleanup).
#
#   ansible-playbook community.cassandra.cleanup -e cassandra_cleanup_mode=rack
#
# Run it after nodes were added. One node at a time by default, or a rack, a
# datacenter or every node at once; the cluster is checked before each batch.
#
# An interrupted run resumes with -e cassandra_rolling_resume=true.
#
# Options and defaults: ansible-playbook community.cassandra.help -e help_topic=cleanup
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Cleanup
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  vars:
    cassandra_service_node_action: cleanup
    # sequential (one node at a time), rack (the nodes of one rack together,
    # rack by rack), dc (one datacenter at a time) or all (every node at once:
    # heavy disk I/O everywhere)
    cassandra_cleanup_mode: sequential
    # compaction threads per node (0: all the compaction threads)
    cassandra_cleanup_jobs: 2
  tasks:
    # first: each node its own facts before any run_once task (ansible/ansible#87148)
    - name: Give each node its own facts
      ansible.builtin.set_fact:
        _cassandra_own_facts: "{{ inventory_hostname }}"
        cacheable: true  # its first facts (ansible/ansible#87148); the first node plays check them
      tags: [always]  # under --tags too

    - name: Check the mode
      ansible.builtin.assert:
        that: cassandra_cleanup_mode in ['sequential', 'rack', 'dc', 'all']
        fail_msg: >-
          cassandra_cleanup_mode must be sequential (one node at a time, default), rack (a rack at a time),
          dc (a datacenter at a time) or all (every node at once: heavy I/O) (got {{ cassandra_cleanup_mode }})
        quiet: true
      run_once: true

    # -e cassandra_rolling_resume=true: an interrupted run skips the nodes already done
    - name: Set up the progress file
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: progress.yml
        public: true

    # Batches in inventory order, grouped by the dc/rack each node declares
    - name: Work out the batches
      ansible.builtin.set_fact:
        _cassandra_cleanup_batches: >-
          {%- set batches = {} -%}
          {%- for h in ansible_play_hosts -%}
          {%-   set p = hostvars[h]._cassandra_preflight -%}
          {%-   set key = {'sequential': h, 'rack': p.cassandra_dc ~ '/' ~ p.cassandra_rack,
                          'dc': p.cassandra_dc, 'all': 'all'}[cassandra_cleanup_mode] -%}
          {%-   set _ = batches.update({key: batches.get(key, []) + [h]}) -%}
          {%- endfor -%}
          {{ batches.values() | list }}
      run_once: true

    - name: Run the batches
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: cleanup_batch.yml
        apply:
          run_once: true
      loop: "{{ _cassandra_cleanup_batches }}"
      loop_control:
        loop_var: cassandra_cleanup_batch
        label: "{{ cassandra_cleanup_batch | join(', ') }}"
      run_once: true

    - name: Check the cluster after the last batch
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: cluster_health.yml
        apply:
          run_once: true
      run_once: true

    - name: Print the summary
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: summary.yml
