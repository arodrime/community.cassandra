---
# One CQL login of cql_login.yml (_cassandra_cql_try_user, _password, _asked):
# a query on _cassandra_cql_login_from, its outcome in cassandra_cql_login.
- name: Log in over CQL on {{ _cassandra_cql_login_from }}
  community.cassandra.cassandra_cqlsh:
    execute: "SELECT release_version FROM system.local;"
    # as the operations log in (keyspaces.yml): what works here works for them
    cqlsh_host: "{{ _cassandra_cql_login_host }}"
    cqlsh_port: "{{ _cassandra_cql_login_port | default(9042) }}"
    cqlsh_cmd: "{{ cassandra_cqlsh_command | default(omit, true) }}"  # (a cqlsh outside root's PATH, e.g. a virtualenv)
    username: "{{ _cassandra_cql_try_user }}"
    password: "{{ _cassandra_cql_try_password }}"
    debug: true  # its error, to tell a refused login from a node cqlsh can't reach
  delegate_to: "{{ _cassandra_cql_login_from }}"
  # on that node: the import's play is connection: local, which a node with no ansible_connection of its own
  # would inherit (cqlsh then run on the controller). A keyword, not an ansible_connection var: a delegated
  # task's vars are templated in the node's variables, where localhost's facts (the import's) are undefined.
  connection: "{{ hostvars[_cassandra_cql_login_from].ansible_connection | default('ssh') }}"
  run_once: true
  register: _cassandra_cql_try
  failed_when: false
  changed_when: false
  check_mode: false  # a SELECT
  no_log: true  # the password

# ok, refused, or unchecked and why: the reason from a fixed list, each from a matched error text (never from the
# exit code alone); nothing of cqlsh's own text (it could quote the login)
- name: Keep the outcome of the CQL login
  ansible.builtin.set_fact:
    cassandra_cql_login:
      state: "{{ _outcome.state }}"
      why: "{{ _outcome.why }}"
      user: "{{ _cassandra_cql_try_user }}"
      password: "{{ _cassandra_cql_try_password }}"
      asked: "{{ _cassandra_cql_try_asked | bool }}"
  run_once: true
  no_log: true
  vars:
    _outcome: >-
      {{ _cassandra_cql_try | community.cassandra.cassandra_cql_login_outcome(
           _cassandra_cql_login_from, _cassandra_cql_login_host, _cassandra_cql_login_port | default(9042),
           _cassandra_cql_try_user, cassandra_cqlsh_command | default('cqlsh', true)) }}
