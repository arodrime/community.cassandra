---
# cassandra_java_version: a Java the series runs on, no JVM option it reads
# that a move to it is refused with, and a tarball for it when tarballs are on
# offer. Also run by update_java, upgrade and the new node
# checks before they change anything.
- name: The series runs on this Java
  ansible.builtin.assert:
    that: _why == ''
    fail_msg: "{{ inventory_hostname }}: {{ _why }}"
    quiet: true
  vars:
    _why: >-
      {{ cassandra_java_version | community.cassandra.cassandra_java_check(cassandra_version,
                                                                          cassandra_java_allow_unsupported | bool) }}

# A JVM option a move to that Java is refused with (plugin_utils cassandra_jvm_options, e.g.
# -XX:-UseBiasedLocking after Java 17), in the files that Java reads: before anything changes
- name: The JVM options suit this Java
  ansible.builtin.assert:
    that: _refused | length == 0
    fail_msg: "{{ inventory_hostname }}: {{ _refused | join(' ') }}"
    quiet: true
  vars:
    _refused: >-
      {{ {'cassandra_jvm_extra_options': cassandra_jvm_extra_options | default([]),
          'cassandra_jvm8_extra_options': cassandra_jvm8_extra_options | default([]),
          'cassandra_jvm11_extra_options': cassandra_jvm11_extra_options | default([]),
          'cassandra_jvm17_extra_options': cassandra_jvm17_extra_options | default([])}
         | community.cassandra.cassandra_jvm_option_checks(cassandra_version, cassandra_java_version, refusals=true,
                                                           kept=cassandra_config_keep_files | default([])) }}

# A Java given by its directory (cassandra_java_home, e.g. imported) needs no tarball
- name: A tarball on offer for this Java
  ansible.builtin.assert:
    that: >-
      (cassandra_java_tarballs or {}) | length == 0 or cassandra_java_tarball != '' or cassandra_java_home != ''
      or not cassandra_install_java | bool
    fail_msg: >-
      {{ inventory_hostname }}: cassandra_java_version is {{ cassandra_java_version }}, and cassandra_java_tarballs
      only offers Java {{ (cassandra_java_tarballs or {}).keys() | map('string') | sort | join(', ') }}.
      Add a "{{ cassandra_java_version }}" entry there, pick one of those, or set cassandra_java_tarball
      (cassandra_java_tarballs: {} for a Java package).
    quiet: true

# Its name makes its temporary file and its directory: without one (or with
# "." or ".."), the role would remove /var/tmp, /var or cassandra_java_tarball_dir
- name: The tarball has a file name
  ansible.builtin.assert:
    that: >-
      cassandra_java_tarball == ''
      or _cassandra_java_tarball_name | regex_replace('[.](tar[.]gz|tgz|tar)$', '') not in ['', '.', '..']
    fail_msg: "cassandra_java_tarball is {{ cassandra_java_tarball }}: give a tarball file with a name of its own."
    quiet: true

# A Java already there (cassandra_java_home, e.g. imported, or a tarball
# unpacked on an earlier run) must be that Java: checked before anything
# changes (upgrade and update_java check it before the node is stopped). Not
# one this role left half unpacked (a refused tarball): it is unpacked again.
- name: Look for an unpack left half done
  ansible.builtin.stat:
    path: "{{ _cassandra_java_home }}/.unpacking"
  register: cassandra_java_check_unpacking
  when: _cassandra_java_home != ''

- name: Check the Java already there is cassandra_java_version
  ansible.builtin.include_tasks: java_release.yml
  vars:
    _cassandra_java_release_of_tarball: "{{ cassandra_java_home == '' }}"
  when:
    - _cassandra_java_home != ''
    - not cassandra_java_check_unpacking.stat.exists

# The unpack empties the Java directory first: one that exists already (e.g.
# cassandra_java_home or cassandra_java_tarball_dir pointing at /opt or
# /usr/lib/jvm, or a directory of the same name there) is emptied only when
# this role made it: its marks (.unpacking, .unpacked), or empty (a run
# stopped right after making it). A cassandra_java_home with a Java is kept
# as it is (java_tarball.yml).
- name: Look for the Java directory
  ansible.builtin.stat:
    path: "{{ _cassandra_java_home }}"
  register: cassandra_java_check_dir
  when: cassandra_java_tarball != ''

# stat does not follow the last link: a cassandra_java_home linked to a Java is found here
- name: Look for a Java already in cassandra_java_home
  ansible.builtin.stat:
    path: "{{ _cassandra_java_home }}/bin/java"
  register: cassandra_java_check_java
  when:
    - cassandra_java_tarball != ''
    - cassandra_java_home != ''

- name: Look for the unpacked Java
  ansible.builtin.stat:
    path: "{{ _cassandra_java_home }}/.unpacked"
  register: cassandra_java_check_unpacked
  when: cassandra_java_tarball != ''

- name: Look for files in the Java directory
  ansible.builtin.find:
    paths: "{{ _cassandra_java_home }}"
    file_type: any
    hidden: true
  register: cassandra_java_check_files
  check_mode: false  # read-only
  when:
    - cassandra_java_tarball != ''
    - cassandra_java_check_dir.stat.isdir | default(false)

- name: The Java directory is new, empty or this role's
  ansible.builtin.assert:
    that: >-
      not cassandra_java_check_dir.stat.exists
      or cassandra_java_check_java.stat.exists | default(false)
      or (cassandra_java_check_dir.stat.isdir
          and (cassandra_java_check_unpacking.stat.exists or cassandra_java_check_unpacked.stat.exists
               or cassandra_java_check_files.matched | default(1) == 0))
    fail_msg: >-
      {{ _cassandra_java_home }} exists on {{ inventory_hostname }} and holds something else than a Java this role
      unpacked: the tarball is unpacked only into a new or empty directory, which it empties first. Set
      cassandra_java_home (or cassandra_java_tarball_dir) to another directory, or move that one away.
    quiet: true
  when: cassandra_java_tarball != ''
