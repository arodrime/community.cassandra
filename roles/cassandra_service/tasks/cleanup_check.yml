---
# One check of the cleanups of a batch (cleanup_wait.yml), in a round of checks: skipped once it has ended.
- name: Check {{ _cassandra_stream_round + 1 }}
  when: _cassandra_cleanup_status == 'going'
  block:
    - name: Read the cleanups
      ansible.builtin.command: "{{ _cassandra_service_nodetool | regex_replace('^nodetool -p [0-9]+', 'nodetool -p ' ~ _port) }} compactionstats"
      vars:
        # each node's own JMX port (delegated tasks see this host's variables)
        _port: "{{ hostvars[item.item].cassandra_jmx_port | default(_cassandra_service_jmx.port) | int }}"
      delegate_to: "{{ item.item }}"
      loop: "{{ cassandra_cleanup_jobs_started.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: cassandra_cleanup_read
      changed_when: false
      failed_when: false
      ignore_unreachable: true  # a node not answering once is a check without an answer
      no_log: "{{ cassandra_jmx_password | length > 0 }}"

    - name: Check the jobs
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      delegate_to: "{{ item.item }}"
      loop: "{{ cassandra_cleanup_jobs_started.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: cassandra_cleanup_job
      ignore_errors: true  # a failed job is reported below
      ignore_unreachable: true  # read again at the next check

    - name: Work out the progress
      ansible.builtin.set_fact:
        _cassandra_stream_state: >-
          {{ _views | community.cassandra.cassandra_stream_progress(_cassandra_stream_state | default({}),
               now=now().timestamp() | int, operations=['Cleanup'], stall_checks=cassandra_stream_stall_checks | int) }}
      vars:
        _views: >-
          {{ cassandra_cleanup_read.results | zip(cassandra_cleanup_jobs_started.results | map(attribute='item'))
             | map('community.cassandra.cassandra_cleanup_view') | list }}

    - name: Progress of the cleanups
      ansible.builtin.debug:
        msg: "{{ now().strftime('%H:%M') }} {{ _cassandra_stream_state.line }}  ({{ _left | length }} of {{ _all | length }} nodes still cleaning)"
      vars:
        _all: "{{ cassandra_cleanup_job.results }}"
        _left: "{{ _all | rejectattr('finished', 'equalto', 1) | list }}"

    - name: Where it stands
      ansible.builtin.set_fact:
        # kept as a fact: the skipped tasks of the next checks overwrite registered results
        _cassandra_cleanup_jobs: "{{ cassandra_cleanup_job.results }}"
        _cassandra_cleanup_status: >-
          {{ 'failed' if _ended | selectattr('failed', 'defined') | selectattr('failed') | list
             else 'failed' if _reached | rejectattr('finished', 'defined') | list
             else 'done' if _ended | length == cassandra_cleanup_job.results | length
             else 'stalled' if _cassandra_stream_state.stalled
             else 'going' }}
      vars:
        _reached: "{{ cassandra_cleanup_job.results | rejectattr('unreachable', 'defined') | list }}"
        _ended: "{{ _reached | selectattr('finished', 'defined') | selectattr('finished', 'equalto', 1) | list }}"

    - name: Wait before the next check
      ansible.builtin.pause:
        seconds: "{{ cassandra_stream_check_interval | int }}"
      when: _cassandra_cleanup_status == 'going'
