minor_changes:
  - "cassandra_linux - one summary of the data disks for the run instead of a block per node: the nodes with the same filesystems and devices grouped (``node1, node2:`` then ``/data/c/{data,commitlog} → vg-data → sdb``), a headline saying whether the read-ahead was already set, set now on how many nodes, or would be set under ``--check``, then what to act on (a restart for the files Cassandra has open, ``WARNING - ...`` lines for ``lvchange`` or ``tuned-adm`` failing, a conflicting tuned profile, a filesystem on NFS, ZFS or btrfs). The kernel names (``dm-4``) and the explanations (a shared mount point, a device-mapper device that may get back another read-ahead) only with ``-v``."
  - "ops callback - a message whose task also sets ``cassandra_output_info: true`` is printed in the progress colour, its ``WARNING`` lines in the warning colour (Ansible's ``COLOR_WARN``, option ``warning_color``)."
breaking_changes:
  - "cassandra_linux - ``cassandra_data_tune_shared_devices`` is removed: the whole device stack under the data directories is now tuned, whatever else the disks hold (another volume of the volume group, other partitions; ``cassandra_data_tune_os_volumes: false`` still leaves a disk that also holds an OS filesystem alone). The variable is no longer read; passed with ``-e`` it stops the run as an unknown collection variable, set in the inventory it is ignored (``preflight`` warns about it)."
