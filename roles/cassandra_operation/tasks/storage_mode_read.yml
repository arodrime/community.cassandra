---
# 5.0: storage_compatibility_mode on this node, as its cassandra.yaml has it (what Cassandra reads at its start), and
# the one the running Cassandra runs: its cassandra.yaml's when the process started after the file was last changed
# (both observed: /proc/<pid> start, the file's mtime), else a restart is pending. The "Node configuration:[...]" line
# Cassandra logs at its start (the last one of its system.log) confirms it when it is there (gone once the log rolled
# over); never required. cassandra_storage_mode_read.stdout_lines: yaml_read=yes|no, yaml=<value, "" without the
# line>, pending=yes when the file is newer than the process, logged=<the logged mode> when found. Read-only, under
# --check too. start_read=no: its start or the file's time not read; future=yes: the file has a time after now.
- name: Read storage_compatibility_mode in its cassandra.yaml and in the running Cassandra
  ansible.builtin.shell: |
    if [ -r "$F" ]; then
      echo "yaml_read=yes"
      echo "yaml=$(sed -n 's/^storage_compatibility_mode:[ \t]*//p' "$F" | sed 's/[ \t]*#.*$//; s/[ \t]*$//' | tail -1)"
    else
      echo "yaml_read=no"
    fi
    pid=
    for p in $(pgrep -x java); do
      tr '\0' '\n' < /proc/$p/cmdline 2>/dev/null | grep -qx org.apache.cassandra.service.CassandraDaemon && { pid=$p; break; }
    done
    [ -n "$pid" ] || { echo "running=no"; exit 0; }
    echo "running=yes"
    # its start in seconds since the epoch: the boot time (btime of /proc/stat) and its start in clock ticks since
    # boot (field 22 of stat, the 20th after the command name); against the last write of the file (mtime or ctime,
    # the later). Either not known: start_read=no (refused, never taken as not pending); a file time after now (a
    # clock set back): future=yes
    ticks=$(sed 's/^.*) //' /proc/$pid/stat 2>/dev/null | awk '{print $20}')
    btime=$(awk '$1 == "btime" {print $2}' /proc/stat 2>/dev/null)
    hz=$(getconf CLK_TCK 2>/dev/null); [ -n "$hz" ] || hz=100
    start=
    [ -n "$ticks" ] && [ -n "$btime" ] && start=$(awk -v b="$btime" -v t="$ticks" -v h="$hz" 'BEGIN {printf "%d", b + t / h}')
    ftime=$(stat -L -c '%Y %Z' "$F" 2>/dev/null | awk '{print ($1 > $2) ? $1 : $2}')
    if [ -z "$start" ] || [ -z "$ftime" ]; then
      echo "start_read=no"
    elif [ "$ftime" -gt "$(date +%s)" ]; then
      echo "future=yes"
    elif [ "$ftime" -gt "$start" ]; then
      echo "pending=yes"
    fi
    logdir=$(tr '\0' '\n' < /proc/$pid/cmdline | sed -n 's/^-Dcassandra[.]logdir=//p' | head -1)
    m=$(grep -a 'Node configuration:\[' "${logdir:-/var/log/cassandra}/system.log" 2>/dev/null | tail -1 \
        | sed -n 's/.*[[; ]storage_compatibility_mode=\([A-Z_0-9]*\).*/\1/p')
    [ -z "$m" ] || echo "logged=$m"
    exit 0
  environment:
    F: "{{ cassandra_conf_dir | regex_replace('(?<=.)/+$', '') }}/cassandra.yaml"
  register: cassandra_storage_mode_read
  changed_when: false
  check_mode: false  # a read
