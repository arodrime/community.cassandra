---
# The credentials file this role wrote (its mark): one written another way is
# someone else's, left as it is
- name: Look for the mark of this role in the apt credentials file
  ansible.builtin.command:
    argv: [grep, -qsF, "Managed by Ansible (community.cassandra.cassandra_repository)", /etc/apt/auth.conf.d/cassandra.conf]
  register: _cassandra_repository_auth_mark
  changed_when: false
  failed_when: _cassandra_repository_auth_mark.rc > 2
  check_mode: false  # read-only

- name: Remove the apt credentials file this role wrote
  ansible.builtin.file:
    path: /etc/apt/auth.conf.d/cassandra.conf
    state: absent
  when: _cassandra_repository_auth_mark.rc == 0
