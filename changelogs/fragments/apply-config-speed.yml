minor_changes:
  - cassandra_install, cassandra_linux, cassandra_firewall and cassandra_medusa roles, and the operation playbooks (preflight, apply_config) - the installed packages and the state of the cassandra unit are read by name (``rpm -q``, ``dpkg-query -W``, ``systemctl show``) instead of ``package_facts`` and ``service_facts``, which put every package and service of the node in its facts; ansible-core 2.16 copies those facts again for each task, seconds per task with the packages of a real server.
  - apply_config playbook - the cluster checks read each node's addresses once, the list of the nodes to restart reads each node once; the JMX users and cqlsh credentials tasks are left out when none is set.
breaking_changes:
  - cassandra_install, cassandra_linux, cassandra_firewall and cassandra_medusa roles - they no longer fill ``ansible_facts.packages`` and ``ansible_facts.services`` as a side effect (``package_facts`` and ``service_facts`` are no longer run); a play that reads them after these roles now runs ``ansible.builtin.package_facts`` or ``ansible.builtin.service_facts`` itself.
