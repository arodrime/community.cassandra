minor_changes:
  - "cassandra_config - a G1 tuning variable (``cassandra_jvm<N>_`` or ``cassandra_jvm_max_tenuring_threshold``, ``g1_heap_region_size``, ``g1_new_size_percent`` with its unlock option, the new ``g1_rset_updating_pause_time_percent`` (default 5), ``max_gc_pause_millis``, ``initiating_heap_occupancy_percent``) set to ``\"\"`` comments its stock line out (4.0 has no tenuring nor region line, 4.x no new size line: nothing written there); the defaults write the files as before; a value the JVM would refuse (``300ms``, ``50%``) is refused."
  - "cassandra_config - new ``cassandra_heap_in_jvm_options`` (default false): ``cassandra_heap_size`` as ``-Xms``/``-Xmx`` (``cassandra_heap_newsize`` as ``-Xmn``, refused with G1) in jvm-server.options instead of ``MAX_HEAP_SIZE`` in cassandra-env.sh, refused with jvm-server.options in ``cassandra_config_keep_files``; import_cluster sets it for a node with an ``-Xms``/``-Xmx`` pair of the same size (an ``-Xmn`` too without G1) among the extra options its Java reads, when Cassandra runs and its arguments show the same, jvm-server.options is not kept and cassandra-env.sh sets no heap of its own; with it on (read as a boolean, the string ``false`` off) the heap checks ask for no ``cassandra_heap_newsize`` on CMS (cassandra-env.sh works the young generation out)."
  - "import_cluster - a stock line a later release added that the node's file predates (5.0's ``-Dchronicle.analytics.disable=true``, CASSANDRA-19656) is no longer a difference: apply_config adds it, the report says so under WORTH A LOOK."
  - "cassandra_config - new ``cassandra_log_audit_dir``: the dir of logback.xml's audit file (``audit.log`` of the ``AUDIT`` appender, ``cassandra_log_audit_file``), ``${cassandra.logdir}/audit`` by default as before; import_cluster reads it from the node's ``AUDIT`` appender."
bugfixes:
  - "import_cluster - an option written in the place of a G1 line of jvm<N>-server.options (``-Xmx31G`` for ``-XX:MaxTenuringThreshold=2``) is carried in ``cassandra_jvm<N>_extra_options``; it was dropped, so the heap the JVM runs with was not imported."
  - "import_cluster - a GC block the stock one cannot write as the node has it is imported as its G1 block with the tuning lines the node has not on commented out (their variables ``\"\"``), else as ``cassandra_jvm<N>_gc: custom`` with all the node's GC lines (its threads and unlock options too) in ``cassandra_jvm<N>_extra_options``, in the node's order; either only when it removes the GC's differences and adds none (another hand edit of the file stays one, alone), else the lines stay hand edits; a node the stock block reads as it is stays so."
  - "import_cluster - an option carried in the extra options at another place than the node has it (``-Xss1024M`` in the place of ``-Xss256k``) is no longer also listed as a hand edit when the file has other edits."
  - "import_cluster - an active ``-Djava.rmi.server.hostname`` line of cassandra-env.sh outside any block, below the stock comment or at the end of the file, is imported as ``cassandra_jmx_rmi_hostname`` (the node's address in its group form)."
  - "import_cluster - a hand edit of a JVM options file (a stock line removed) no longer stops the move of cassandra-env.sh's JVM_OPTS lines and the Prometheus exporter's block, nor fails the self-check on those files: it is said on its own."
  - "import_cluster report - an edit that differs between nodes only by each node's own address is one entry (``<its address>``), in HAND EDITS and in SELF-CHECK."
  - "import_cluster - remote JMX set up in the else branch of cassandra-env.sh's LOCAL_JMX test (the password and access file lines and ``-Djava.rmi.server.hostname`` there, the stock password file line commented out) is carried by ``cassandra_jmx_rmi_hostname`` and the JMX users when the running JVM shows that branch ran; the self-check no longer shows that shape as a stray ``fi``."
  - "import_cluster - logback.xml writing the log dir as itself (``/data/cassandra/log/system.log``) where it is the dir the JVM gets as ``${cassandra.logdir}`` (its last ``-Dcassandra.logdir``, else cassandra-env.sh's or the unit's ``CASSANDRA_LOG_DIR``) is no longer a hand edit; when that dir is not sure, it stays one."
  - "import_cluster report - a hand edit of lines of logback.xml or cassandra-env.sh names its way out besides keeping the file: your own template of it (``cassandra_config_template_overrides``) or a piece of it (``cassandra_config_template_snippets``: at the end of cassandra-env.sh, at the end of logback.xml or for appenders before ``<root>``); keeping a JVM options file whose node had cassandra-env.sh lines moved to variables says to keep cassandra-env.sh with it."
  - "import_cluster - cassandra-env.sh lines that are only at another place for the JVM (shown by the running JVM's arguments) are listed with the layout-only edits, no effect, instead of nothing at all."
  - "cassandra_config - the heap checks (``cassandra_heap_size`` with ``cassandra_heap_newsize`` without G1) follow the GC of the jvm<N>-server.options file the node's Java reads (``cassandra_java_version``, else the series' default), no longer every file of the series; a custom GC whose extra options turn ``-XX:+UseG1GC`` on counts as G1."
  - "import_cluster - a cassandra-env.sh line at another place than the role's (e.g. the rmi hostname at the end) is no longer shown to give the JVM the same arguments when the unit gives JVM_EXTRA_OPTS or MX4J options, which it would come after."
  - "import_cluster - the log dir is not read from cassandra-env.sh when its stock guard has another branch, or the dir is set empty or unset there."
  - "import_cluster - the Prometheus exporter's agent is not imported only when the file that gives it (or jvm-server.options, where the role writes it) is kept as it is."
  - "import_cluster - a later release's stock line counts as missing (the file predates it) only when the node's file has nothing of it: no line naming its option, on or commented out, nor its stock comment."
  - "import_cluster - the heap pair of an options file is left in the extra options when cassandra-env.sh, jvm-server.options or the options file the Java reads is kept as it is (it was set twice, the self-check passing while apply_config changed jvm-server.options)."
  - "cassandra_config - with the Prometheus exporter off, its jar and config are kept while the next start may still load one of them (a jar of ``cassandra_prometheus_exporter_dir``, an agent's jar through a variable, the conf dir's ``jmx_prometheus.yml``; an exporter of your own elsewhere no longer keeps them), read in cassandra-env.sh and every JVM options file of the series (as written; with ``--check`` and in apply_config's preview, those kept by hand as they are on the node, the others as the role is to write them), cassandra.in.sh (the conf dir's, ``/usr/share/cassandra``'s), the unit ``/etc/systemd/system/cassandra.service`` and its drop-ins, and ``cassandra_service_environment``; they were removed with the agent in the unit's environment or in a JVM options file of another Java, and the preview could differ from the run."
  - "import_cluster - the Prometheus exporter's agent is looked for in the options files the running Java reads only, its jar and config read for that agent (another agent's not taken: said not read); the report says the heap moves to jvm-server.options only when it came from another file, naming each file's options; any heap cassandra-env.sh sets itself, however written (a default ``${MAX_HEAP_SIZE:=8G}`` too), leaves the pair where it is; an agent of a version cassandra_config does not take is skipped when its jar and config are read, as the import skips it."
