---
# Stops every node of one rack at once (maintenance of the rack's hosts,
# network, power...), each one drained by its unit on stop:
#   ansible-playbook -i inventory community.cassandra.stop_rack -e cassandra_hosts=my_cluster \
#     -e cassandra_target_dc=dc1 -e cassandra_target_rack=rack2
# With at least as many racks as replicas in the datacenter, one rack down is
# one replica down. Refused when a keyspace would lose more than that (more
# replicas in the datacenter than racks, SimpleStrategy with RF > 1) or when a
# node is already down elsewhere in the datacenter; cassandra_rack_force: true
# goes on anyway, at the risk of unavailable or lost data. Start the rack again
# with start_rack. CQL credentials, when authentication is on:
# cassandra_cql_username/_password.
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Check that the rack can go down
  hosts: "{{ cassandra_hosts | default('cassandra') }}"
  gather_facts: false
  vars:
    _dc_nodes: >-
      {{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('_cassandra_preflight.cassandra_dc', 'equalto', cassandra_target_dc)
         | list }}
    _rack_nodes: >-
      {{ _dc_nodes | selectattr('_cassandra_preflight.cassandra_rack', 'equalto', cassandra_target_rack)
         | map(attribute='inventory_hostname') | list }}
    _racks: "{{ _dc_nodes | map(attribute='_cassandra_preflight.cassandra_rack') | unique | list }}"
    _checker: "{{ ansible_play_hosts_all | reject('in', _rack_nodes) | first | default('') }}"
  tasks:
    - name: Load the cassandra_service defaults (JMX access)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: The rack has nodes, and the cluster has others
      ansible.builtin.assert:
        that:
          - _rack_nodes | length > 0
          - _checker | length > 0
        fail_msg: >-
          {{ 'No node declares cassandra_dc=' ~ cassandra_target_dc ~ ' and cassandra_rack=' ~ cassandra_target_rack
             if _rack_nodes | length == 0 else 'Every node is in that rack: nothing would stay up.' }}
        quiet: true
      run_once: true

    - name: Read the ring from {{ _checker }}
      community.cassandra.cassandra_status:
        down: 10000  # read it whatever the state of the nodes
      module_defaults:
        community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
      delegate_to: "{{ _checker }}"
      run_once: true
      register: cassandra_rack_ring
      failed_when: cassandra_rack_ring.cluster_status is not defined

    - name: Read the keyspaces' replication from {{ _checker }}
      community.cassandra.cassandra_cqlsh:
        execute: "SELECT JSON keyspace_name, replication FROM system_schema.keyspaces;"
        transform: raw
        cqlsh_host: >-
          {{ hostvars[_checker].cassandra_rpc_address | default('')
             if hostvars[_checker].cassandra_rpc_address | default('') not in ['', 'localhost', '0.0.0.0']
             else '127.0.0.1' }}
        username: "{{ cassandra_cql_username | default(omit, true) }}"
        password: "{{ cassandra_cql_password | default(omit, true) }}"
        debug: true
      delegate_to: "{{ _checker }}"
      run_once: true
      register: cassandra_rack_keyspaces
      changed_when: false

    - name: Work out the risks
      ansible.builtin.set_fact:
        _cassandra_rack_check: >-
          {{ cassandra_rack_keyspaces.out | default('') | community.cassandra.cassandra_keyspaces
             | community.cassandra.cassandra_rack_down_problems(cassandra_target_dc, _racks | length) }}
        # addresses of the rack's nodes, to tell them apart in the ring
        _cassandra_rack_down_here: >-
          {{ cassandra_rack_ring.cluster_status[cassandra_target_dc].nodes | default([])
             | selectattr('status', 'equalto', 'D') | map(attribute='address')
             | reject('in', _rack_addresses) | list }}
        _cassandra_rack_down_elsewhere: >-
          {{ cassandra_rack_ring.cluster_status | dict2items | rejectattr('key', 'equalto', cassandra_target_dc)
             | map(attribute='value.nodes') | flatten | selectattr('status', 'equalto', 'D')
             | map(attribute='address') | list }}
      vars:
        _rack_addresses: "{{ _rack_nodes | map('extract', hostvars, ['_cassandra_preflight', 'address']) | list }}"
      run_once: true

    - name: Warnings
      ansible.builtin.debug:
        msg: >-
          {{ (_cassandra_rack_check.warnings
              + (['down in another datacenter: ' ~ _cassandra_rack_down_elsewhere | join(', ')]
                 if _cassandra_rack_down_elsewhere else []))
             | map('regex_replace', '^', 'WARNING: ') | list }}
      run_once: true
      when: (_cassandra_rack_check.warnings + _cassandra_rack_down_elsewhere) | length > 0

    - name: Refuse when a keyspace would lose more than one replica
      ansible.builtin.assert:
        that: _problems | length == 0 or cassandra_rack_force | default(false) | bool
        fail_msg: >-
          {{ ['Stopping ' ~ cassandra_target_dc ~ '/' ~ cassandra_target_rack ~ ' (' ~ _rack_nodes | join(', ')
              ~ ') would take down more than one replica of some data:'] + _problems
             + ['Fix that first, or set cassandra_rack_force: true: reads and writes needing those replicas then fail,'
                ~ ' and data only on them is unavailable until the rack is back.'] }}
        quiet: true
      vars:
        _problems: >-
          {{ _cassandra_rack_check.problems
             + (['already down in ' ~ cassandra_target_dc ~ ': ' ~ _cassandra_rack_down_here | join(', ')]
                if _cassandra_rack_down_here else []) }}
      run_once: true

    - name: Confirm
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: confirm.yml
      vars:
        cassandra_confirm_prompt: |-
          stop_rack will stop Cassandra on every node of {{ cassandra_target_dc | default('(not set)') }}/{{ cassandra_target_rack | default('(not set)') }}
          at once: {{ _rack_nodes | join(', ') }}. They stay down until start_rack.

    - name: Group the rack's nodes
      ansible.builtin.group_by:
        key: cassandra_target_rack_nodes
      when: inventory_hostname in _rack_nodes
      changed_when: false

- name: Stop the rack
  hosts: "{{ cassandra_hosts | default('cassandra') }}:&cassandra_target_rack_nodes"
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Stop Cassandra (the unit drains first)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
      vars:
        cassandra_service_state: stopped

    - name: Say how to start it again
      ansible.builtin.debug:
        msg: >-
          {{ cassandra_target_dc | default('(not set)') }}/{{ cassandra_target_rack | default('(not set)') }} is down ({{ ansible_play_hosts_all | join(', ') }}).
          Start it with: ansible-playbook -i <inventory> community.cassandra.start_rack -e cassandra_hosts={{
          cassandra_hosts | default('cassandra') }} -e cassandra_target_dc={{ cassandra_target_dc | default('(not set)') }}
          -e cassandra_target_rack={{ cassandra_target_rack | default('(not set)') }}
      run_once: true
