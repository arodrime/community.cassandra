minor_changes:
  - New help playbook - read-only, from the inventory alone (no node contacted, no vault password needed) - shows each cluster as the inventory describes it, every operation playbook with its command filled for this inventory, and advice (nodes marked absent, missing CQL user, misspelt variables, seeds, racks, mixed versions); ``help_topic`` details one operation, ``help_write`` writes it as ``RUNBOOK.md`` next to the inventory.
  - New lookup cassandra_inventory - the clusters of an inventory with their nodes' non-secret settings, read without connecting to the nodes and skipping the vault-encrypted files it can't decrypt.
  - import_cluster - ``import_cluster_runbook`` also writes ``RUNBOOK.md`` (the help playbook) into the inventory written.
