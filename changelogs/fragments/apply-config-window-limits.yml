---
trivial:
- "apply_config, upgrade - a package update of Cassandra (apply_config's move to a newer release, the upgrade) writes cassandra_linux's limits file (``/etc/security/limits.d/cassandra.conf``) again right after it: the RPM ships that file as a plain one, and its update put the package's own (``nofile 100000``) in place of the inventory's. A run stopped between the package update and that write leaves the package's file (a resume does not write it again); the next apply_config finds it and writes it live, no restart."
