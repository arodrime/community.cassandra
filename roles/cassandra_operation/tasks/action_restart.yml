---
# The unit written first: a run that can't write it (no root) stops with the
# node still running, not drained
- name: Install the cassandra systemd unit
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: unit.yml

- name: Drain the node
  ansible.builtin.import_tasks: drain.yml
  when: cassandra_operation_drain | bool or not cassandra_service_unit_manage | bool  # a kept unit may not drain
  vars:
    _cassandra_service_drain_then: restarted

- name: Restart it and wait until it has joined
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: main.yml
    rolespec_validate: false  # as the include it was: no argument check
  vars:
    cassandra_service_state: restarted
    _cassandra_service_unit_written: true
