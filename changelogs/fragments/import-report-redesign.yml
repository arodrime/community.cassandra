minor_changes:
  - "import_cluster - report.txt is ordered by urgency for a reader new to Cassandra and to the collection: a head with the verdict and its counts (``IMPORT orders  12 nodes  4 to act on: 1 TODO, 2 hand edits, 1 file left as is``), what the report is in three lines and the words it uses, then TODO (numbered steps, each with why, the command to copy and what to check after), TO REVIEW (hand edits, files left as is, settings to review, settings that differ between nodes; one entry in two lines, what and on which nodes then what to do), FOR INFO (the settings that are not the default, the versions, the convergence...) and WHAT TO DO NEXT. A setting or file is said in plain words the first time; node lists are in their shortest exact form with their count (``all (12 nodes)``, ``all - n4 (11 nodes)``, ``dc1 + n7 (7 nodes)``); a long value is summarised (``20 lines (first: ...)``), whole in the files written. The end of the run shows the head, TODO, TO REVIEW and what to do next."
  - "import_cluster - with ``-e import_report_shareable=true`` (off by default), also writes ``report.shareable.txt``, a copy of the report to share: node names ``n1``.., clusters ``c1``.., addresses ``IP``, the site's host names, domains, URLs, data center and rack names, directories, your own groups, paths outside the stock ones, Medusa buckets and user names replaced, secrets masked (every line masked again); the sections, the hand edits and their lines, the versions and the import's notes kept. Its key (``n1 = <real name>``) goes to ``report.shareable.key.txt``, mode 0600 before anything is written in it, never in the copy, not written under ``--check``. An earlier import's copy and key (and ``report.shareable.map``, an earlier release candidate's key) are never removed nor overwritten: with it off, or when this import writes another text in their place, they are moved aside as ``<file>.<date>@<time>~`` and said (the run's time and build left out of the comparison), the copy and its key together; a link this import writes over is moved aside itself, the file it points to unchanged, another link kept; under ``--check`` it is only said, except for the copy ``--check`` writes itself (``report.check.shareable.txt``); a file ``mv -n`` could not move aside (a name taken meanwhile, or its error shown) stops the run, after what was moved is said, before anything is written over it."
  - "import_cluster - a JVM option set twice with another value (``-Xss1024M`` in jvm-server.options, ``-Xss256k`` in jvm17-server.options) is flagged in the report: the JVM takes the last one, the other is never used (and what it would do if it applied); a password option's values are masked."
bugfixes:
  - "import_cluster - a file's mode (``cassandra_config_file_permissions``' ``jmxremote.password``) is no longer taken for a secret because of the file's name: shown in the report, written in main.yml instead of secrets.yml."
  - "import_cluster - an empty value shows as ``''`` in the report, a null as ``(empty)``, instead of nothing."
  - "import_cluster - on a re-import, a template of yours that the import can work out (the address and host name facts it writes itself, a template of the node's name) is compared with each node instead of being left to check by hand."
