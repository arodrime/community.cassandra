---
# Adds nodes to a running cluster, one at a time. Add them to the cluster's
# inventory group first (not to cassandra_seeds), then:
#   ansible-playbook -i inventory community.cassandra.add_node -e cassandra_new_nodes=node7,node8
# Without -e cassandra_hosts=<group>: the group cassandra, else the inventory's
# cluster group (lookup community.cassandra.cassandra_hosts).
# The cluster is checked before and after each node; the run stops at the
# first problem. Nodes already in the ring are only checked (re-running is safe),
# a node still bootstrapping (an earlier run that stopped waiting) is waited for
# again; a node half added (in the ring without data, data without ring) is refused.
# -e cassandra_add_node_reset=true starts a new node over that has data but is
# not in the ring (started once by mistake, a failed bootstrap): Cassandra
# stopped, its directories emptied (reset_node.yml: refused on a node any up
# node of the cluster sees in its ring; shown, then a confirmation of its
# own), then added.
# One screen first, one confirmation (cassandra_operation_confirm: false skips
# it): cluster, version, Java, Medusa, each new node (address, dc, rack, data
# to stream, Medusa fqdn), the cleanup choice, and warnings (uneven racks, a run
# outside tmux/screen).
# A bootstrap can take hours: a progress line every cassandra_stream_check_interval
# seconds (300); the run stops only after cassandra_stream_stall_checks checks (3)
# in a row with nothing streamed. Afterwards the cleanup command is printed, or
# run with cassandra_add_node_cleanup: one, rack, dc or all (default none).
# One token per node (cassandra_num_tokens: 1): each new node needs
# cassandra_initial_token, or -e cassandra_token_auto=bisect (each one splits
# the largest range, nothing moves), balanced (an even ring: move_node then
# moves the nodes the screen marks) or true (shows both, asks which).
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

# Before anything is installed: every problem of the new hosts at once
- name: Check the new hosts are ready
  hosts: "{{ cassandra_new_nodes }}"
  gather_facts: false
  any_errors_fatal: true  # a host that errors must not drop out of the run
  tasks:
    - name: Check this host
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: new_node_checks.yml
      vars:
        _cassandra_new_node_skip_in_ring: true  # an interrupted run: checked next
        _cassandra_new_node_reset: "{{ cassandra_add_node_reset | default(false) | bool }}"

# Seeds don't bootstrap: a new node listed in cassandra_seeds would join without its data
- name: Check the new nodes
  hosts: "{{ cassandra_new_nodes }}"
  gather_facts: false
  any_errors_fatal: true  # add none of them if one is refused
  vars:
    # the new nodes not in the ring yet, the nodes of the cluster
    _new: "{{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('cassandra_new_node_state', 'defined')
              | selectattr('cassandra_new_node_state', 'equalto', 'new') | map(attribute='inventory_hostname') | list }}"
    _joining: "{{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('cassandra_new_node_state', 'defined')
                  | selectattr('cassandra_new_node_state', 'equalto', 'joining') | map(attribute='inventory_hostname') | list }}"
    _existing: "{{ groups[lookup('community.cassandra.cassandra_hosts')] | reject('in', ansible_play_hosts_all) | list }}"
    # one token per node: the new nodes' tokens (cassandra_token_auto)
    _p0: "{{ hostvars[ansible_play_hosts_all[0]]._cassandra_preflight }}"
    _single: "{{ _p0.cassandra_num_tokens | int == 1 }}"
    _auto: "{{ cassandra_token_auto | default(false) | string | lower }}"
    _no_token: >-
      {{ _new | map('extract', hostvars, ['_cassandra_preflight', 'cassandra_initial_token']) | zip(_new)
         | selectattr(0, 'equalto', '') | map(attribute=1) | list }}
  tasks:
    - name: Load the cassandra_service defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Check this node
      block:
        - name: A new node can't be a seed
          ansible.builtin.assert:
            that: not _cassandra_service_is_seed | bool
            fail_msg: >-
              {{ inventory_hostname }} is in cassandra_seeds: seeds don't bootstrap, it would join without
              its data. Add it as a regular node, then make it a seed with change_seeds.
            quiet: true

        - name: Find which ones already joined (an interrupted run)
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: new_node_state.yml

        # Cassandra starts no bootstrap while another one runs: this node would fail to start
        - name: A still bootstrapping node goes before the new ones
          ansible.builtin.assert:
            that: cassandra_new_node_state != 'new' or _joining_after | length == 0
            fail_msg: >-
              {{ _joining_after | join(', ') }} still bootstrapping (an earlier run): put
              {{ 'it' if _joining_after | length == 1 else 'them' }} before {{ inventory_hostname }} in cassandra_new_nodes,
              so add_node waits for it before starting a new node.
            quiet: true
          vars:
            _joining_after: >-
              {{ ansible_play_hosts_all[ansible_play_hosts_all.index(inventory_hostname) + 1:]
                 | map('extract', hostvars) | selectattr('cassandra_new_node_state', 'defined')
                 | selectattr('cassandra_new_node_state', 'equalto', 'joining')
                 | map(attribute='inventory_hostname') | list }}
      rescue:
        - name: Record the refusal
          ansible.builtin.set_fact:
            cassandra_op_result: "add refused: {{ [ansible_failed_result.msg | default('')] | flatten | join(' ') }}"

        - name: Print the summary
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: summary.yml
          vars:
            cassandra_service_summary_hosts: "{{ ansible_play_hosts_all }}"

        - name: Stop here
          ansible.builtin.fail:
            msg: No node was added.

    # Without the replication (no CQL access), the plan assumes the whole datacenter hands over data
    - name: Read the keyspaces' replication
      block:
        - name: Read the keyspaces' replication
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_service
            tasks_from: keyspaces.yml
            apply:
              run_once: true
          vars:
            cassandra_keyspaces_from: "{{ _existing | first }}"
          run_once: true
      rescue:
        - name: Go on without it
          ansible.builtin.set_fact:
            cassandra_keyspaces: null
          run_once: true

    # also on a run again after the nodes joined: the cleanup is still to do
    - name: Work out what the add means for the cluster
      ansible.builtin.set_fact:
        cassandra_add_node_plan: >-
          {{ hostvars[ansible_play_hosts_all[0]].cassandra_new_node_ring.cluster_status
             | community.cassandra.cassandra_add_node_plan(_new_info, hosts=_hosts, keyspaces=cassandra_keyspaces | default(none)) }}
      vars:
        _new_info: >-
          {%- set l = [] -%}
          {%- for h in ansible_play_hosts_all -%}
          {%-   set p = hostvars[h]._cassandra_preflight -%}
          {%-   set _ = l.append({'host': h, 'address': p.address, 'dc': p.cassandra_dc, 'rack': p.cassandra_rack,
                                  'in_ring': h not in _new, 'state': hostvars[h].cassandra_new_node_state}) -%}
          {%- endfor -%}
          {{ l }}
        _hosts: >-
          {{ dict(_existing | map('extract', hostvars, ['_cassandra_preflight', 'address']) | zip(_existing)) }}
      run_once: true

    # One token per node: where the new nodes go (plugins/filter/cassandra_tokens.py)
    - name: Plan the tokens of the new nodes (one token per node)
      when: _single | bool
      run_once: true
      block:
        - name: Check the token choice
          ansible.builtin.assert:
            that:
              - _auto in ['false', 'true', 'bisect', 'balanced']
              - _auto != 'true' or cassandra_operation_confirm | bool or _new | length == 0
              - _auto != 'false' or _no_token | length == 0
            fail_msg: >-
              {{ ('cassandra_token_auto must be false, true, bisect or balanced (got ' ~ _auto ~ ')')
                 if _auto not in ['false', 'true', 'bisect', 'balanced']
                 else ('cassandra_token_auto=true asks which plan to follow: choose one on the command line instead'
                       ' (-e cassandra_token_auto=bisect or balanced), the run being non-interactive'
                       ' (cassandra_operation_confirm false)') if _auto == 'true'
                 else ('One token per node: ' ~ _no_token | join(', ') ~ ' ' ~ ('has' if _no_token | length == 1 else 'have')
                       ~ ' no cassandra_initial_token. Set it, or -e cassandra_token_auto=true to see where they would'
                       ' go (bisect: no node moves; balanced: an even ring, other nodes move) and choose') }}
            quiet: true

        - name: Read the tokens of the ring
          community.cassandra.cassandra_ring:
          module_defaults:
            community.cassandra.cassandra_ring: >-
              {{ _cassandra_service_jmx | combine({'port': hostvars[_existing[0]].cassandra_jmx_port | default(_cassandra_service_jmx.port) | int}) }}
          delegate_to: "{{ _existing | first }}"
          register: cassandra_add_node_ring

        - name: Work out where the new nodes go
          ansible.builtin.set_fact:
            cassandra_add_node_tokens: >-
              {{ cassandra_add_node_ring.ring | community.cassandra.cassandra_token_add_plan(_new_tokens,
                   _p0.cassandra_partitioner, keyspaces=cassandra_keyspaces | default(none),
                   default_rf=cassandra_token_rf | default(3), hosts=_hosts) }}
          vars:
            _new_tokens: >-
              {%- set l = [] -%}
              {%- for h in ansible_play_hosts_all -%}
              {%-   set p = hostvars[h]._cassandra_preflight -%}
              {%-   set _ = l.append({'name': h, 'address': p.ring_address, 'dc': p.cassandra_dc, 'rack': p.cassandra_rack,
                                      'token': p.cassandra_initial_token}) -%}
              {%- endfor -%}
              {{ l }}
            _hosts: >-
              {{ dict(groups[lookup('community.cassandra.cassandra_hosts')]
                      | map('extract', hostvars, ['_cassandra_preflight', 'ring_address'])
                      | zip(groups[lookup('community.cassandra.cassandra_hosts')])) }}

        - name: Refuse tokens that can't be worked out
          ansible.builtin.assert:
            that:
              - cassandra_add_node_tokens.problems | length == 0
              - _auto != 'balanced' or cassandra_add_node_tokens.balanced_problems | length == 0
            fail_msg: "{{ cassandra_add_node_tokens.problems + (cassandra_add_node_tokens.balanced_problems if _auto == 'balanced' else []) }}"
            quiet: true

    - name: Check the cleanup choice
      ansible.builtin.assert:
        that: cassandra_add_node_cleanup | default('none') in ['none', 'one', 'rack', 'dc', 'all']
        fail_msg: "cassandra_add_node_cleanup must be none, one, rack, dc or all (got {{ cassandra_add_node_cleanup | default('') }})"
        quiet: true
      run_once: true

    # One screen, printed whatever cassandra_operation_confirm: what will be done,
    # with what, the warnings; then one confirmation
    - name: Show what the add will do
      ansible.builtin.debug:
        msg: "{{ _summary.split('\n') | reject('equalto', '') | list }}"
      run_once: true
      when: _new | length > 0 or _joining | length > 0 or cassandra_add_node_cleanup | default('none') != 'none'
      vars:
        _p: "{{ hostvars[(_new + ansible_play_hosts_all) | first]._cassandra_preflight }}"
        _running: >-
          {{ (hostvars[_existing[0]].cassandra_preflight_describe.stdout | default('') ~ '\n').split('Database versions:')[1:]
             | first | default('') | regex_findall('(?m)^\s+([0-9][^:]*): \[') | join(', ') }}
        _cleanup: "{{ cassandra_add_node_cleanup | default('none') }}"
        # cassandra_medusa's defaults are not loaded here: the version and virtualenv defaults are copied
        # on when a new node gets it (each node's line says which)
        _medusa: >-
          {{ (_new + _joining) | map('extract', hostvars) | selectattr('cassandra_medusa_enabled', 'defined')
             | map(attribute='cassandra_medusa_enabled') | map('bool') | select | list | length > 0 }}
        _summary: |-
            add_node on cluster '{{ _p.cassandra_cluster_name }}'{{ (' (running ' ~ _running ~ ')') if _running else '' }}:
            {% for h in _new %}
              {{ h }} ({{ hostvars[h]._cassandra_preflight.address }}): datacenter {{ hostvars[h]._cassandra_preflight.cassandra_dc }}, rack {{ hostvars[h]._cassandra_preflight.cassandra_rack }}{% for e in cassandra_add_node_plan.estimate | selectattr('host', 'equalto', h) %}, about {{ (e.bytes / 1073741824) | round(1) }} GiB to stream ({{ e.basis }}){% endfor %}{% set m = hostvars[h] %}{% if m.cassandra_medusa_enabled | default(false) | bool %}, Medusa fqdn {{ (m.cassandra_medusa_fqdn if m.cassandra_medusa_fqdn is defined else (((m.ansible_facts.hostname | default(h)) ~ '.' ~ m.cassandra_medusa_fqdn_domain) if m.cassandra_medusa_fqdn_domain | default('') else '')) or '(Medusa works it out)' }}{% endif %}

            {% endfor %}
            {% if _joining %}
              still bootstrapping, waited for first: {{ _joining | join(', ') }}
            {% endif %}
            {% if cassandra_add_node_reset | default(false) | bool and _new %}
            cassandra_add_node_reset: what the new nodes hold (a failed first start or bootstrap) is DELETED first, shown and confirmed next.
            {% endif %}
            Cassandra {{ cassandra_package_version | default('', true) or ('series ' ~ _p.cassandra_version) }}, Java {{ cassandra_java_tarball | default('', true) or ('package, version ' ~ (cassandra_java_version | default('of the series'))) }}, Medusa {{ ('on (' ~ cassandra_medusa_version | default('0.30.1') ~ ' in ' ~ (cassandra_medusa_venv | default('/opt/cassandra-medusa') or 'the system Python') ~ ')') if _medusa else 'off' }}
            {% if _new or _joining %}
            One node at a time; each one streams its share of the data (hours on big nodes), with a progress line
            every {{ cassandra_stream_check_interval }}s; the run stops after {{ cassandra_stream_stall_checks }} checks in a row without progress.
            {% else %}
            No node to add ({{ ansible_play_hosts_all | join(', ') }} already in the ring).
            {% endif %}
            Cleanup afterwards (cassandra_add_node_cleanup={{ _cleanup }}): {{ {'none': 'none, the commands are printed at the end',
              'one': 'one node at a time', 'rack': 'the nodes of a rack together, rack after rack',
              'dc': 'the nodes of a datacenter together', 'all': 'every node at once (heavy I/O everywhere)'}[_cleanup] }}
            ({{ cassandra_add_node_plan.cleanup | dict2items | map(attribute='value') | flatten | length }} nodes: {{ cassandra_add_node_plan.scope | dict2items | map(attribute='key') | zip(cassandra_add_node_plan.scope | dict2items | map(attribute='value') | map('replace', 'rack', "the new nodes' racks") | map('replace', 'dc', 'whole datacenter')) | map('join', ' ') | join(', ') }}).
            {% for w in cassandra_add_node_plan.warnings %}
            WARNING: {{ w }}
            {% endfor %}
            {% if _single | bool and _new %}
            One token per node (shares with the largest replication factor of each datacenter, else cassandra_token_rf):
            {% for line in cassandra_add_node_tokens.lines %}
            {{ line }}
            {% endfor %}
            {% for w in cassandra_add_node_tokens.warnings %}
            WARNING: {{ w }}
            {% endfor %}
            {{ {'false': 'Tokens from the inventory (cassandra_initial_token).',
                'bisect': 'Following bisect: no node moves.',
                'balanced': ('Following balanced: then run move_node to move ' ~ cassandra_add_node_tokens.moves | map(attribute='name') | join(', ')
                             ~ ' (until then the ring is uneven).') if cassandra_add_node_tokens.moves else 'Following balanced: no node moves.',
                'true': 'You choose next: bisect or balanced.'}[_auto] }}
            {% endif %}
            {{ _cassandra_session_warning }}

    - name: Confirm the add
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: confirm.yml
      when: _new | length > 0 or _joining | length > 0 or cassandra_add_node_cleanup | default('none') != 'none'
      vars:
        cassandra_confirm_prompt: "add_node: go on with the {{ 'add' if _new or _joining else 'cleanup' }} shown above?"

    - name: Choose where the new nodes go
      ansible.builtin.pause:
        prompt: "bisect (no node moves) or balanced (an even ring, move_node moves other nodes afterwards)? Answer bisect or balanced"
      register: cassandra_token_choice
      run_once: true
      when: _single | bool and _auto == 'true' and _new | length > 0

    - name: Check the choice
      ansible.builtin.assert:
        that:
          - _choice in ['bisect', 'balanced']
          - _choice != 'balanced' or cassandra_add_node_tokens.balanced_problems | length == 0
        fail_msg: >-
          {{ ('Answer bisect or balanced (got ' ~ _choice ~ '): nothing was done, run it again')
             if _choice not in ['bisect', 'balanced'] else cassandra_add_node_tokens.balanced_problems | join(' ') }}
        quiet: true
      run_once: true
      when: _single | bool and _auto == 'true' and _new | length > 0
      vars:
        _choice: "{{ cassandra_token_choice.user_input | default('') | trim | lower }}"

    - name: Give the new node its token
      ansible.builtin.set_fact:
        cassandra_initial_token: "{{ cassandra_add_node_tokens[_kind][inventory_hostname] }}"
        cassandra_add_node_token_kind: "{{ _kind }}"
      when:
        - _single | bool
        - _auto != 'false'
        - inventory_hostname in cassandra_add_node_tokens[_kind] | default({})
      vars:
        _kind: >-
          {{ (hostvars[ansible_play_hosts_all[0]].cassandra_token_choice.user_input | default('') | trim | lower)
             if _auto == 'true' else _auto }}

    # After every refusal above: a node with data of its own (a failed first
    # start or bootstrap, not in the ring) starts over empty
    - name: Reset the new nodes first (cassandra_add_node_reset)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: reset_node.yml
      when:
        - cassandra_add_node_reset | default(false) | bool
        - cassandra_new_node_state == 'new'

- name: Add the new nodes, one at a time
  hosts: "{{ cassandra_new_nodes }}"
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Add this node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: add
        cassandra_service_node_checks_before: false
        # not in the ring yet: this node and the ones after it that never started (--check: all of them)
        _pending: >-
          {{ ansible_play_hosts_all[0 if ansible_check_mode else ansible_play_hosts_all.index(inventory_hostname):]
             | map('extract', hostvars, 'cassandra_new_node_state') | select('equalto', 'new') | list | length }}
        cassandra_service_expected_before: "{{ groups[lookup('community.cassandra.cassandra_hosts')] | length - _pending | int }}"
        cassandra_service_expected_after: >-
          {{ groups[lookup('community.cassandra.cassandra_hosts')] | length - _pending | int + (1 if cassandra_new_node_state == 'new' else 0) }}
        # bootstraps an earlier run started (UJ, waited for in turn): not a problem around the
        # nodes before them (a new node never comes before them, see above)
        _joining: >-
          {{ ansible_play_hosts_all[ansible_play_hosts_all.index(inventory_hostname):]
             | map('extract', hostvars) | selectattr('cassandra_new_node_state', 'equalto', 'joining')
             | map(attribute='cassandra_new_node_address') | list }}
        cassandra_service_joining_before: "{{ _joining }}"
        cassandra_service_joining_after: "{{ _joining | reject('equalto', cassandra_new_node_address) | list }}"

- name: Summary
  hosts: "{{ cassandra_new_nodes }}"
  gather_facts: false
  tasks:
    - name: Print the summary
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: summary.yml
      vars:
        cassandra_service_summary_hosts: "{{ ansible_play_hosts_all }}"

    - name: Say which nodes to move (one token per node, balanced)
      ansible.builtin.debug:
        msg:
          - "The ring is even once {{ _moves | map(attribute='name') | join(', ') }} move, one at a time (the plan shown at the start):"
          - "  ansible-playbook -i {{ ansible_inventory_sources | first }} community.cassandra.move_node -e cassandra_hosts={{ lookup('community.cassandra.cassandra_hosts') }}"
      run_once: true
      when:
        - _moves | length > 0
        - ansible_play_hosts_all | map('extract', hostvars) | selectattr('cassandra_add_node_token_kind', 'defined')
          | selectattr('cassandra_add_node_token_kind', 'equalto', 'balanced') | list | length > 0
      vars:
        _moves: "{{ hostvars[ansible_play_hosts_all[0]].cassandra_add_node_tokens.moves | default([]) }}"

# The nodes that handed ranges over still hold that data until a cleanup: the
# datacenter's nodes, or only the new nodes' racks when every keyspace has as
# many replicas there as racks. cassandra_add_node_cleanup: none (default)
# prints the command; one, rack, dc or all runs it here, by batches (one node,
# the nodes of a rack, of a datacenter, or all of them at once), the cluster
# checked before each batch.
- name: Clean up the nodes that handed data over
  hosts: "{{ lookup('community.cassandra.cassandra_hosts') }}"
  gather_facts: false
  vars:
    _plan: >-
      {{ hostvars[query('ansible.builtin.inventory_hostnames', cassandra_new_nodes) | first].cassandra_add_node_plan | default({}) }}
    _targets: >-
      {{ _plan.cleanup | default({}) | dict2items | map(attribute='value') | flatten | select('in', ansible_play_hosts) | list }}
    _mode: "{{ cassandra_add_node_cleanup | default('none') }}"
    cassandra_service_node_action: cleanup
    cassandra_cleanup_jobs: 2
  tasks:
    - name: Say which cleanups to run
      ansible.builtin.debug:
        msg:
          - "Once the cluster is fine, clean up the nodes that handed data over ({{ _scope }}), e.g. one at a time:"
          - "  ansible-playbook -i {{ ansible_inventory_sources | first }} community.cassandra.cleanup
            -e cassandra_hosts={{ lookup('community.cassandra.cassandra_hosts') }} --limit {{ _targets | join(',') }}"
          - "  (-e cassandra_cleanup_mode=rack|dc|all for batches of nodes together)"
      run_once: true
      when:
        - _targets | length > 0
        - _mode == 'none'
      vars:
        _scope: >-
          {{ _plan.scope | dict2items | map(attribute='key') | zip(_plan.scope | dict2items | map(attribute='value')
             | map('replace', 'rack', "the new nodes' racks only") | map('replace', 'dc', 'the whole datacenter'))
             | map('join', ': ') | join(', ') }}

    - name: Clean up, by batches
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: cleanup_batch.yml
        apply:
          run_once: true
      loop: "{{ _batches }}"
      loop_control:
        loop_var: cassandra_cleanup_batch
        label: "{{ cassandra_cleanup_batch | join(', ') }}"
      run_once: true
      when: _mode != 'none'
      vars:
        _batches: >-
          {%- set batches = {} -%}
          {%- for h in _targets -%}
          {%-   set p = hostvars[h]._cassandra_preflight -%}
          {%-   set key = {'one': h, 'rack': p.cassandra_dc ~ '/' ~ p.cassandra_rack, 'dc': p.cassandra_dc, 'all': 'all'}[_mode] -%}
          {%-   set _ = batches.update({key: batches.get(key, []) + [h]}) -%}
          {%- endfor -%}
          {{ batches.values() | list }}
