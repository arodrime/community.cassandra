minor_changes:
  - "cassandra_config - new variables for the ``cassandra.yaml`` settings commented out in stock (memtables, compaction, streaming, auth caches, guardrails, GC log, ``auto_bootstrap``, ``cassandra_initial_token`` and more), empty by default so that the line stays commented out; ``cassandra_extra_settings`` refuses a key that has a variable, naming it, and a key Cassandra rejects for the installed release (https://github.com/ansible-collections/community.cassandra/issues/334)."
  - "cassandra_config - remote JMX users (``cassandra_jmx_users``, their password and access files) and cqlsh credentials files; the data, commitlog, saved caches, hints, CDC and heap dump directories are created and owned by the account Cassandra runs as; the owner, group and mode of each file (``cassandra_config_user``, ``cassandra_config_group``, ``cassandra_config_mode``), ``cassandra-env.sh`` no longer readable by all."
  - "cassandra_config - a file with the same settings as the role's (other comments or layout, no header) is left as it is on a node that is not blank; ``cassandra_config_keep_files`` leaves some files as they are; ``cassandra_config_template_overrides`` renders your own template for a file; ``cassandra_env_extra_lines`` and ``cassandra_logback_extra_lines`` add lines; the replaced files are backed up (``cassandra_config_backup``); ``cassandra.yaml`` is checked to be valid YAML before it replaces the current one."
  - "cassandra_config - the diffs it shows mask every line of a secret value; a password is quoted in ``cassandra.yaml`` unless YAML reads it back as written; a node is blank or not from the system keyspaces in all its data directories (``cassandra_data_file_directories``, ``local_system_data_file_directory``) and the live ``cassandra.yaml``'s, and its question and refusals say why; the seed list is reloaded live with the JMX credentials."
  - "cassandra_install - a Java is refused, before anything changes, while the JVM options it reads hold one it does not start with (``-XX:-UseBiasedLocking`` after Java 17), the role's own template lines included."
