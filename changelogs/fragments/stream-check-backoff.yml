minor_changes:
  - "add_node, replace_node, decommission_node, remove_dead_node, add_datacenter, move_node, cleanup - the first progress checks of a streaming operation or cleanup come after 10 s, 30 s, 1, 2 and 4 minutes, then every ``cassandra_stream_check_interval``: a short operation (a cleanup on a small cluster) ends in seconds instead of a full interval. Only the checks that far apart count towards ``cassandra_stream_stall_checks``."
