---
# Confirmed once for the whole run by the apply_config playbook, which tells
# what follows in cassandra_apply_config_then:
#   restart: new settings, the node is drained and restarted;
#   start: its unit failed (it could not start, or crashed) or a resumed run
#     stopped it: started once written;
#   none: an owner, group or mode alone, read when Cassandra started;
#   write: stopped on purpose, left stopped.
# A unit restarting in a loop (Restart=on-failure) or past its start limit
# would not start again: it is stopped before the write, so that the loop does
# not bring it up on the former config.
- name: Clear the unit's failed starts
  when: cassandra_apply_config_then | default('restart') == 'start'
  vars:
    # restarting in a loop at the plan (its JVM may be up for a moment, on the config that fails)
    _looping: "{{ cassandra_apply_config_unit.status.ActiveState | default('') == 'activating' }}"
    _now: "{{ cassandra_apply_config_unit_now.status | default({}) }}"
    _up: "{{ _now.ActiveState | default('') == 'active' and _now.SubState | default('') == 'running' }}"
  block:
    # read again: it may have come up since the plan
    - name: Read the state of its unit
      ansible.builtin.systemd_service:
        name: cassandra
      register: cassandra_apply_config_unit_now
      failed_when: false  # no unit (not-found) is not a failure; anything else, the checks below

    # failed or stopped at the plan, running now: started by hand on the former config, which the start
    # would not change
    - name: Stop if it came up since the plan
      ansible.builtin.assert:
        that: _looping | bool or not _up | bool
        fail_msg: >-
          {{ inventory_hostname }}: Cassandra came up since the plan was shown, with the config it had then. Nothing was
          changed on it: run apply_config again (it then restarts it if its config changes).
        quiet: true

    - name: Stop its restart loop
      ansible.builtin.systemd_service:
        name: cassandra
        state: stopped
      when: _looping | bool or _now.ActiveState | default('') == 'activating'

    # no module resets a unit's failed state
    - name: Reset its start limit
      ansible.builtin.command: systemctl reset-failed cassandra
      changed_when: false
      failed_when: false  # not failed: nothing to reset

# A file written back as the running Cassandra started with it, no restart planned for it: that JVM
# must still be the one running (restarted since the plan, it may have started without that file)
- name: Check the JVM a file is written back for still runs
  when:
    - cassandra_apply_config_as_started | default({}) | length > 0
    - cassandra_apply_config_then | default('restart') == 'none'
  block:
    - name: Read the running Cassandra again
      ansible.builtin.include_tasks: jvm_started.yml

    - name: Stop if it restarted since the plan
      ansible.builtin.assert:
        that:
          - cassandra_jvm.pid | default('') | string == _plan.pid | string
          - (cassandra_jvm.start | default(0) | float - _plan.start | float) | abs < 2
        fail_msg: >-
          Cassandra restarted since the plan was shown, maybe without
          {{ _plan.files | join(', ') }}, which the plan wrote back with no restart. Nothing was changed on it:
          run apply_config again (it then restarts it if it needs it).
        quiet: true
      vars:
        _plan: "{{ cassandra_apply_config_as_started }}"

- name: Write the config
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_config
  vars:
    cassandra_config_confirm: false
    _cassandra_config_no_question: true  # the run's own question covered it, whatever -e cassandra_config_confirm says
    cassandra_config_reload_seeds: false  # the restart loads them
    _cassandra_config_no_restart_warning: true
    # shown before the run was confirmed, and in its recap at the end
    _cassandra_config_quiet: true
    _cassandra_change_report_quiet: true
  when: not ansible_check_mode

# what the plan wrote back with no restart is on disk as the running Cassandra started with it
- name: Check the files written back
  when:
    - cassandra_apply_config_as_started | default({}) | length > 0
    - cassandra_apply_config_then | default('restart') == 'none'
    - not ansible_check_mode
  block:
    - name: Checksum the files written back
      ansible.builtin.stat:
        path: "{{ _cassandra_service_conf_dir | trim | regex_replace('/+$', '') }}/{{ item }}"
        checksum_algorithm: sha1
        get_mime: false
        get_attributes: false
      loop: "{{ cassandra_apply_config_as_started.files }}"
      register: cassandra_apply_config_written_back

    - name: Stop if one differs from what Cassandra started with
      ansible.builtin.assert:
        that: _differ | length == 0
        fail_msg: >-
          {{ _differ | join(', ') }} written with another content than the running Cassandra started with (the plan
          said no restart for {{ 'it' if _differ | length == 1 else 'them' }}): restart it (rolling_restart
          -e cassandra_target_nodes={{ inventory_hostname }}) so that it runs with the inventory's config.
        quiet: true
      vars:
        _differ: >-
          {%- set out = [] -%}
          {%- for r in cassandra_apply_config_written_back.results -%}
          {%-   if r.stat.checksum | default('') != cassandra_apply_config_as_started.sha1[r.item] -%}
          {%-     set _ = out.append(r.item) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

# --check writes nothing: what the plan found on this node (the same role run in check mode, just before),
# reported as a real run reports what it writes
- name: Report what would be written
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_change_report
  vars:
    cassandra_change_report_role: cassandra_config
    cassandra_change_report_items: "{{ _cassandra_config_items | default([]) }}"
    _cassandra_change_report_quiet: true
  when: ansible_check_mode

- name: Say the restart of {{ inventory_hostname }}
  ansible.builtin.debug:
    msg: "{{ 'restart' | community.cassandra.cassandra_phase(node=inventory_hostname) }}"
  when:
    - not ansible_check_mode
    - cassandra_apply_config_then | default('restart') == 'restart'
  vars:
    cassandra_output: true  # a phase line (ops callback)
    cassandra_output_gap: true  # a block of its own

- name: Drain and restart the node
  ansible.builtin.include_tasks: action_restart.yml
  when: cassandra_apply_config_then | default('restart') == 'restart'

- name: Start the node and wait until it has joined
  ansible.builtin.include_tasks: main.yml
  vars:
    _cassandra_change_report_quiet: "{{ ansible_verbosity | int == 0 }}"  # the recap says it (-v shows it)
    cassandra_service_state: started
  when: cassandra_apply_config_then | default('restart') == 'start'
