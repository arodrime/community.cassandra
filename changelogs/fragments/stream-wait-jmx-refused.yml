minor_changes:
  - "add_node, replace_node, decommission_node, remove_dead_node, add_datacenter, move_node, topology, cleanup - a JMX login or permission refused while an operation is waited for stops the wait at that check, naming the node and ``cassandra_jmx_username``/``cassandra_jmx_password``, instead of after ``cassandra_stream_stall_time`` without progress. On the node being added, only the refusals of the JDK's file-based authenticator count (Cassandra's own refuses every login until the node has joined: its bootstrap is then followed from the other nodes, as before); a node that answered earlier in the wait (a passing refusal) or that has a JMX login of its own in the inventory is not counted."
