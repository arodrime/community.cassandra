---
# Adds nodes to a running cluster, one at a time. Add them to the cluster's
# inventory group first (not to cassandra_seeds), then:
#   ansible-playbook -i inventory community.cassandra.add_node -e cassandra_hosts=my_cluster -e cassandra_new_nodes=node7,node8
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Add the new nodes, one at a time
  hosts: "{{ cassandra_new_nodes }}"
  serial: 1
  pre_tasks:
    - name: A new node can't be a seed
      ansible.builtin.assert:
        that: not _cassandra_service_is_seed | bool
        fail_msg: >-
          {{ inventory_hostname }} is in cassandra_seeds: seeds don't bootstrap, it would join without
          its data. Add it as a regular node, then make it a seed with change_seeds.
        quiet: true
  roles:
    - community.cassandra.cassandra_repository
    - community.cassandra.cassandra_install
    - community.cassandra.cassandra_linux
    - community.cassandra.cassandra_config
    - role: community.cassandra.cassandra_firewall
      when: cassandra_manage_firewall | default(false) | bool
    - community.cassandra.cassandra_service
