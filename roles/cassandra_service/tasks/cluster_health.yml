---
# Cluster health before and after a node operation, seen from this node and
# from another node of the cluster. Waits up to cassandra_service_health_timeout
# for down nodes to come back (and this node's ports to answer), a progress
# line at each read (every cassandra_stream_check_interval seconds, sooner at
# first, as the bootstrap's), then fails listing every problem.
#   include_role: name=community.cassandra.cassandra_service tasks_from=cluster_health.yml
# Expects the cluster's inventory group in cassandra_hosts (default: the
# cluster CASSANDRA_CLUSTER names, else the inventory's cluster group, see the
# lookup community.cassandra.cassandra_hosts).
# cassandra_service_health_node_checks: false checks from the other node only
# (this node has no Cassandra running yet, e.g. before it is added).
# cassandra_service_health_down_ok: addresses expected down (a dead node being replaced);
# cassandra_service_health_resumed_down: the same, for the node a resumed run stopped at.
# _cassandra_health_no_wait: true reads once, no wait for down nodes (the ones
# down_ok lists will not come back).
# cassandra_service_health_joining_ok: addresses expected joining (UJ: a bootstrap to wait for).
# cassandra_service_health_leaving_ok: addresses expected leaving (UL: a decommission to wait for).
# cassandra_service_health_report_only: true only sets cassandra_health_problems
# and cassandra_health_findings (no wait, no failure), for read-only reports.
# cassandra_service_health_batch: true for the hosts of a play checked at once:
# the ring and the schema are read once for them, from the same node.
# Under --check nothing waits: one read of each, the ports asked for 5s.
- name: Work out the node count and a second node to check from
  ansible.builtin.set_fact:
    _cassandra_health_expected: >-
      {{ cassandra_service_health_expected_nodes | default(query('community.cassandra.cassandra_nodes') | length) | int }}
    # the nodes of a batch, checked at once (cassandra_service_health_batch): the ring and the schema read
    # once, from the same node, not one of them when another is up
    # (each variable read once: the node list costs every node's variables)
    _cassandra_health_peer: >-
      {%- set c = _candidates -%}
      {{ (c | reject('in', ansible_play_hosts) | list + c) | first | default(inventory_hostname)
         if cassandra_service_health_batch | default(false) | bool
         else c | reject('in', [inventory_hostname]) | first | default(inventory_hostname) }}
  vars:
    # the hosts the operation adds or removes (cassandra_target_nodes), else _cassandra_health_not_peers
    # (remove_datacenter: its group; remove_dead_node: none, its target is an address)
    _not_peers: "{{ _cassandra_health_not_peers | default(cassandra_target_nodes | default('')) }}"
    # nodes expected down (by their ring address): not asked
    _down: "{{ cassandra_service_health_down_ok | default([]) + cassandra_service_health_resumed_down | default([]) }}"
    _nodes: "{{ query('community.cassandra.cassandra_nodes') }}"
    _down_hosts: >-
      {%- set out = [] -%}
      {%- set down = _down -%}
      {%- for h in (_nodes if down else []) -%}
      {%-   if (hostvars[h]._cassandra_preflight | default({})).ring_address | default('') in down -%}{%- set _ = out.append(h) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
    _candidates: >-
      {{ _nodes | reject('in', (query('ansible.builtin.inventory_hostnames', _not_peers) if _not_peers | length > 0 else []))
         | reject('in', _down_hosts) | list }}

# Each read is a nodetool run (a JVM, seconds each): the ones on this node run at once (async), then are collected
# (cluster_health_read.yml). Read once; a real run reads again while a node is down or a port of this node does
# not answer, up to cassandra_service_health_timeout, with a progress line each time (cluster_health_wait.yml)
- name: Check the cluster state
  vars:
    _node_checks: "{{ cassandra_service_health_node_checks | default(true) | bool }}"
    _down_ok: "{{ cassandra_service_health_down_ok | default([]) + cassandra_service_health_resumed_down | default([]) }}"
    # waits for down nodes to come back, not for the one a resumed run left down (one read), nor under --check
    # (nothing was started: one read), nor for a report (health_check)
    _cassandra_health_wait_on: >-
      {{ not (cassandra_service_health_resumed_down | default([]) or _cassandra_health_no_wait | default(false) | bool
              or ansible_check_mode or cassandra_service_health_report_only | default(false) | bool)
         and cassandra_service_health_timeout | int // 10 > 1 }}
    # the longest a read may take: a minute each at most (a slow JMX), the schema's polls
    _async: 370
    # read once for the nodes of a batch, on the same node
    _batch: "{{ cassandra_service_health_batch | default(false) | bool }}"
    # the nodes whose findings are waited for: this one, or every node of a batch (all wait together)
    _cassandra_health_hosts: "{{ ansible_play_hosts if _batch | bool else [inventory_hostname] }}"
    _cassandra_health_waiting: >-
      {%- set out = [] -%}
      {%- for h in _cassandra_health_hosts -%}
      {%-   set _ = out.extend(hostvars[h].cassandra_health_findings | default([]) | community.cassandra.cassandra_health_waiting) -%}
      {%- endfor -%}
      {{ out | community.cassandra.cassandra_health_waiting }}
    # the head of the progress lines: [2/5] node2 restart (a node of a rolling operation), the nodes of a
    # batch, else this node
    _cassandra_health_rolling: "{{ cassandra_service_node_action is defined and not _batch | bool }}"
    _cassandra_health_head:
      index: "{{ ansible_play_hosts_all.index(inventory_hostname) + 1 if _cassandra_health_rolling | bool else 0 }}"
      steps: "{{ ansible_play_hosts_all | length if _cassandra_health_rolling | bool else 0 }}"
      node: "{{ ansible_play_hosts | community.cassandra.cassandra_node_list if _batch | bool else inventory_hostname }}"
      operation: >-
        {{ {'apply_config': 'write_config'}.get(cassandra_service_node_action, cassandra_service_node_action)
           if cassandra_service_node_action is defined else 'cluster check' }}
  block:
    - name: Read the cluster state
      ansible.builtin.include_tasks: cluster_health_read.yml

    - name: Note what is waited for
      ansible.builtin.set_fact:
        _cassandra_health_waited: false
        _cassandra_health_wait_start: "{{ now().timestamp() | int }}"
        _cassandra_health_going: "{{ _cassandra_health_wait_on | bool and _cassandra_health_waiting | length > 0 }}"
      run_once: "{{ _batch }}"  # (a batch: on all its nodes)

    - name: Start the wait
      ansible.builtin.set_fact:
        _cassandra_health_waited: true
      run_once: "{{ _batch }}"
      when: _cassandra_health_going | bool
      vars:
        cassandra_output_gap: true  # its progress lines, a block of their own (ops callback)

    - name: Wait for the nodes down to come back
      ansible.builtin.include_tasks: wait_loop.yml
      when: _cassandra_health_going | bool
      vars:
        _cassandra_wait_check: cluster_health_wait.yml
        _cassandra_wait_going: "{{ _cassandra_health_going | bool }}"

    - name: Say the nodes waited for are back
      ansible.builtin.debug:
        msg: >-
          {{ [] | community.cassandra.cassandra_health_wait_line(done=true, waited=now().timestamp() | int - _cassandra_health_wait_start | int,
                                                                  index=_head.index, steps=_head.steps, node=_head.node, operation=_head.operation) }}
      run_once: "{{ _batch }}"
      when:
        - _cassandra_health_waited | bool
        - _cassandra_health_waiting | length == 0
      vars:
        cassandra_output: true
        _head: "{{ _cassandra_health_head }}"

- name: Stop on an unhealthy cluster
  ansible.builtin.fail:
    msg: >-
      {{ ['Cluster not healthy, nothing more is done:'] + cassandra_health_problems
         + (['Waited ' ~ (now().timestamp() | int - _cassandra_health_wait_start | int) | community.cassandra.cassandra_duration
             ~ ' for them to come back (cassandra_service_health_timeout ' ~ cassandra_service_health_timeout ~ 's).']
            if _cassandra_health_waited | default(false) | bool else [])
         + (["A node is down: restart it first (the server, then Cassandra). If the server can't be recovered, replace"
             ~ ' the node (replace_node); removing it for good (remove_dead_node) is the rare last resort.']
            if cassandra_health_problems | select('search', ' is D[NLJM],') | list else [])
         + (['Not counted, marked cassandra_node_state: absent: ' ~ _absent | join(', ')
             ~ '. Still in the ring? The playbook topology removes them.']
            if _absent and cassandra_health_problems | select('search', '^the ring has ') | list else []) }}
  vars:
    cassandra_output: true
    _absent: "{{ query('community.cassandra.cassandra_nodes', state='absent') }}"
  when:
    - cassandra_health_problems | length > 0
    - not cassandra_service_health_force | bool
    - not cassandra_service_health_report_only | default(false) | bool

- name: Go on despite the problems (cassandra_service_health_force)
  ansible.builtin.debug:
    msg: >-
      {{ (['WARNING  cassandra_service_health_force is set, going on with an unhealthy cluster: taking this node down'
           ~ ' now can make data unavailable (reads/writes failing at QUORUM) or lose writes:']
          + cassandra_health_problems | map('regex_replace', '^', '  ') | list) | join(_nl) }}
  when:
    - cassandra_health_problems | length > 0
    - cassandra_service_health_force | bool
    - not cassandra_service_health_report_only | default(false) | bool
  vars:
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    cassandra_output: true
