---
# A node moving to another Java (update_java, apply_config): the Java it moves to noted, then installed and made
# the one Cassandra starts with (cassandra_install). The caller writes the config and restarts the node, then
# checks it with java_verify.yml.
# Before anything changes, also under --check: the Java this node moves to, and the java it must run then: the one
# of the JAVA_HOME Cassandra is given (read before the plan, which checked it leads to the new Java), else the Java
# home's, else the system java
- name: Note the Java this node moves to
  ansible.builtin.set_fact:
    _cassandra_java_plan_wanted: "{{ cassandra_java_version | community.cassandra.cassandra_java_major }}"
    _cassandra_java_plan_expected: >-
      {{ (_given ~ '/bin/java') if _given != ''
         else (_cassandra_java_home ~ '/bin/java') if _cassandra_java_home != ''
         else '/usr/bin/java' }}
  vars:
    _given: "{{ (cassandra_java_plan_given.stdout_lines | default([''], true) | first) | regex_replace('(?<=.)/+$', '') }}"

# (_cassandra_java_install_later: apply_config's node moving to a newer release too, Java installed with it in its
# restart window, apply_config_window.yml)
- name: Install Java
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_install
  when: not _cassandra_java_install_later | default(false) | bool
