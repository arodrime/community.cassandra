bugfixes:
  - 'cassandra_config role - a value written as it is into ``logback.xml`` that would leave it unreadable (a ``<``, an ``&`` that starts no entity, a ``"`` in an attribute, a ``--`` in a part commented out such as ``cassandra_log_pattern`` in the audit appender while ``cassandra_log_audit_file`` is false) is refused before anything is changed, with the way out; an appender of your snippet named in single quotes (``name=''Q''``) counts as defined, as does the audit appender with its ``class`` before its ``name``.'
  - 'import_cluster playbook - a logger whose level is a logback property (``level="${LVL:-INFO}"``) stays an end line of the ``logback.xml`` snippet, no longer in ``cassandra_log_levels`` (which ``cassandra_config`` refuses); an appender named in single quotes keeps the ref of ``<root>`` to it; lines sent whole to ``secrets.yml`` because one holds ``endraw`` are said so, not said to hold a secret.'
