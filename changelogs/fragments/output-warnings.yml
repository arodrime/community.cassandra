minor_changes:
  - operation playbooks - every warning is written ``WARNING  ...``, the warnings of a plan together just above its question, each one said once where it is decided; apply_config shows the warnings of its nodes in its plan only (its recap says how many are above, for which nodes), no longer under each node in the plan and again in the recap, and a real run's data disk summary leaves out the ones its plan said.
  - cassandra_service role - the wait for a node to be NORMAL after its start prints a progress line at each read of its mode (``node2  restart  waiting  mode STARTING, waiting for NORMAL  40s/10m``, ``UJ, waiting for UN`` while it joins), every ``cassandra_stream_early_check_interval`` seconds, then every ``cassandra_stream_check_interval`` seconds after ``cassandra_stream_early_time``, as the health wait.
