---
# The node's Cassandra package moved to cassandra_package_version, Cassandra stopped: its series' repository, then
# the package (cassandra_install, which refuses another version otherwise). The node of an upgrade
# (action_upgrade.yml), and apply_config's move to a newer release of the same series, in the node's restart
# (apply_config_window.yml). The caller writes the config and starts it, then checks it with version_verify.yml.
- name: Add the target series' repository
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_repository

# a node whose OS settings are its own (cassandra_linux_manage: false): the limits file the package ships (the RPM's
# plain file, whatever cassandra_linux_limits_file says; a link followed), read before and after the package update.
# A change is said at once (a later stop or Ctrl-C would lose it) and in the recap, its former content kept on the
# controller next to the run's reports; the file is never written back.
- name: Read the limits file before the update
  ansible.builtin.stat:
    path: /etc/security/limits.d/cassandra.conf
    get_checksum: true
    follow: true
  register: cassandra_package_limits_before
  check_mode: false  # reads only
  when: not cassandra_linux_manage | default(true) | bool

# (a link: its target read above, the link itself here; the package may put a plain file in its place)
- name: Read whether it is a link before the update
  ansible.builtin.stat:
    path: /etc/security/limits.d/cassandra.conf
    get_checksum: false
    follow: false
  register: cassandra_package_limits_link_before
  check_mode: false  # reads only
  when: not cassandra_linux_manage | default(true) | bool

- name: Read its content
  ansible.builtin.slurp:
    src: /etc/security/limits.d/cassandra.conf
  register: cassandra_package_limits_content
  failed_when: false  # (not read: said with the change, if any)
  check_mode: false  # reads only
  when:
    - not cassandra_linux_manage | default(true) | bool
    - cassandra_package_limits_before.stat.exists | default(false)

- name: Install the target version
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_install
  vars:
    _cassandra_install_upgrade: true

- name: Read the limits file after the update
  ansible.builtin.stat:
    path: /etc/security/limits.d/cassandra.conf
    get_checksum: true
    follow: true
  register: cassandra_package_limits_after
  check_mode: false  # reads only
  when: not cassandra_linux_manage | default(true) | bool

- name: Read whether it is a link after the update
  ansible.builtin.stat:
    path: /etc/security/limits.d/cassandra.conf
    get_checksum: false
    follow: false
  register: cassandra_package_limits_link_after
  check_mode: false  # reads only
  when: not cassandra_linux_manage | default(true) | bool

- name: Say the package changed the limits file
  when:
    - not cassandra_linux_manage | default(true) | bool
    - (cassandra_package_limits_before.stat | default({})).checksum | default('')
      != (cassandra_package_limits_after.stat | default({})).checksum | default('')
  vars:
    _created: "{{ not (cassandra_package_limits_before.stat | default({})).exists | default(false) }}"
    _read: "{{ (cassandra_package_limits_content | default({})).content is defined }}"
  block:
    # <the reports' dir>/<operation>-<the run's start>-<node>-limits.conf, named as the run's report (run_report.yml,
    # apply_config's start), kept: never removed with the reports (the only copy of the operator's former file)
    - name: Keep its former content on the controller
      delegate_to: localhost
      become: false
      check_mode: false  # (a change: not under --check, whose update changes nothing)
      diff: false
      when: not _created | bool and _read | bool
      vars:
        ansible_become: false  # (an inventory's ansible_become beats the keyword: a file the user can read)
        _dir: >-
          {{ ansible_inventory_sources | default([])
             | community.cassandra.cassandra_reports_dir(lookup('community.cassandra.cassandra_hosts'),
                                                            cassandra_run_report_dir | default(''),
                                                            lookup('ansible.builtin.env', 'PWD')) }}
        _saved: >-
          {{ _dir ~ '/' ~ (cassandra_service_node_action | default('cassandra')
                           | community.cassandra.cassandra_run_report_name(false,
                               hostvars['localhost']._cassandra_run_report_started
                               | default(hostvars['localhost']._cassandra_run_start | default('')))
                           | regex_replace('[.]txt$', '')) ~ '-' ~ inventory_hostname ~ '-limits.conf' }}
      block:
        - name: Make the dir of the reports
          ansible.builtin.file:
            path: "{{ _dir }}"
            state: directory
            mode: "0755"

        - name: Write the former limits file
          ansible.builtin.copy:
            content: "{{ cassandra_package_limits_content.content | b64decode }}"
            dest: "{{ _saved }}"
            mode: "0600"
          register: cassandra_package_limits_kept
      rescue:
        - name: Note it was not kept
          ansible.builtin.set_fact:
            cassandra_package_limits_kept: {failed: true, msg: "{{ ansible_failed_result.msg | default('failed') }}"}

    # said in the recap too (cassandra_limits_changed)
    - name: Note the package changed the limits file
      ansible.builtin.set_fact:
        cassandra_package_limits_changed: >-
          {{ {'path': '/etc/security/limits.d/cassandra.conf', 'created': _created | bool, 'saved': _saved,
              'removed': _removed | bool, 'link': _link,
              'error': '' if _saved or _created | bool else _kept.msg | default(_unread.msg | default('not read'))} }}
      vars:
        _kept: "{{ cassandra_package_limits_kept | default({}) }}"
        _saved: "{{ '' if _kept.failed | default(false) else _kept.dest | default('') }}"
        _unread: "{{ cassandra_package_limits_content | default({}) }}"  # (its msg when it could not be read)
        _removed: "{{ not _created | bool and not (cassandra_package_limits_after.stat | default({})).exists | default(false) }}"
        # a link before, no longer the same link: its target (the saved content is the one read through it)
        _link_before: "{{ cassandra_package_limits_link_before.stat | default({}) }}"
        _link_after: "{{ cassandra_package_limits_link_after.stat | default({}) }}"
        _link: >-
          {{ _link_before.lnk_target | default('') if _link_before.islnk | default(false)
             and not (_link_after.islnk | default(false) and _link_after.lnk_target | default('') == _link_before.lnk_target | default(''))
             else '' }}

    - name: Say it now
      ansible.builtin.debug:
        msg: >-
          {{ [inventory_hostname] | community.cassandra.cassandra_limits_changed(hostvars)
             | community.cassandra.cassandra_warnings }}
      vars:
        cassandra_output: true  # an operator message (ops callback)

# (the package ships /etc/security/limits.d/cassandra.conf as a plain file: its update puts its own back in place of
# cassandra_linux's, which the next run would find changed)
- name: Write the limits file of the cassandra user again
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_linux
    tasks_from: limits.yml
  when: cassandra_linux_manage | default(true) | bool
