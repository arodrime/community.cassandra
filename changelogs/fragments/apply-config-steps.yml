---
minor_changes:
- "apply_config playbook - one phase line per step of the run (the checks, the compare, the checks from each node under ``--check``; the OS settings, the config written at once, the config staged in a real run). Under the ops callback each one is a step: on a terminal its line is rewritten in place with the tasks it has done and the time since it started (``task 37  1m12s``), then ``done in 4m12s`` once over (from 1 s on); in a log or a pipe, the phase line, a line at a result 5 minutes or more after the last one, and the ``done in`` line (``cassandra_output_step``, operator output guide)."
