---
# Waits for this node to be NORMAL, until _cassandra_service_wait_deadline (an
# epoch the caller sets: now + cassandra_service_wait_timeout): reads of its
# mode (netstats) through wait_loop.yml, the service read before each one, so
# a Cassandra that stopped (it failed to start: no java, a bad setting...)
# fails at the next read, with the end of its journal, rather than after the
# whole timeout. While it is not NORMAL, a progress line per read
# ("node2 restart  waiting for NORMAL (mode STARTING)  40s/10m"), every
# cassandra_stream_early_check_interval seconds, every
# cassandra_stream_check_interval seconds after cassandra_stream_early_time
# (as the health wait). (A kept SysV init script's unit stays "active
# (exited)": waited for as before.)
- name: Note what is waited for
  ansible.builtin.set_fact:
    _cassandra_normal_start: "{{ now().timestamp() | int }}"
    _cassandra_normal_going: true
    _cassandra_normal_said: false
    # the head of its progress lines: this node and what it does
    _cassandra_normal_head:
      node: "{{ inventory_hostname }}"
      operation: >-
        {{ 'restart' if cassandra_service_state | default('') == 'restarted'
                        or (cassandra_service_restart_on_change | default(false) | bool and cassandra_service_unit is changed)
           else 'start' }}

# read once first: a node NORMAL at once (most restarts take seconds) does not go through the loop
- name: Read its mode
  ansible.builtin.include_tasks: wait_normal_check.yml

- name: Wait for the node to be joined (Mode NORMAL)
  ansible.builtin.include_tasks: wait_loop.yml
  when: _cassandra_normal_going | bool
  vars:
    _cassandra_wait_check: wait_normal_check.yml
    _cassandra_wait_going: "{{ _cassandra_normal_going | bool }}"

- name: Say it is NORMAL
  ansible.builtin.debug:
    msg: >-
      {{ 'NORMAL' | community.cassandra.cassandra_normal_wait_line(
           done=true, waited=now().timestamp() | int - _cassandra_normal_start | int,
           node=_head.node, operation=_head.operation) }}
  when:
    - _cassandra_normal_said | bool  # after its progress lines
    - cassandra_service_netstats.mode | default('') == 'NORMAL'
  vars:
    cassandra_output: true  # a progress line (ops callback)
    _head: "{{ _cassandra_normal_head }}"

- name: Give up after cassandra_service_wait_timeout
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} is not NORMAL after {{ cassandra_service_wait_timeout }}s (cassandra_service_wait_timeout):
      {{ ('mode ' ~ cassandra_service_netstats.mode) if cassandra_service_netstats.mode | default('')
         else (cassandra_service_netstats.msg | default('no answer on JMX')) }}
  when: cassandra_service_netstats.mode | default('') != 'NORMAL'
