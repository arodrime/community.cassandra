---
# Read-only health report of a cluster, changing nothing: from every node, the
# ring (every node up and normal, none joining/leaving/moving), gossip, native
# transport, streams, schema agreement and the storage and CQL ports. Fails
# (non-zero exit) when there is a problem, so it can be scheduled.
#   ansible-playbook -i inventory community.cassandra.health_check
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo) only to read cassandra_jmx_password_file when it is
# set (the playbook then asks for it itself, no -b needed); none otherwise.
- name: Check the cluster's group
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
  tasks:
    - name: Check the cluster's group
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: hosts_check.yml

- name: Cluster health
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: true
  gather_subset: [network]
  # root only to read the JMX password file (the service account's, 0400);
  # nodetool needs no root otherwise
  become: "{{ cassandra_jmx_password_file | default('', true) | length > 0 }}"
  tasks:
    - name: Load the cassandra_config defaults (ports)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: defaults.yml
        public: true

    - name: Check the cluster from this node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: cluster_health.yml
      vars:
        cassandra_service_health_report_only: true
        cassandra_service_health_timeout: 5  # a report: no waiting for down nodes

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts_all -%}
          {%-   set problems = hostvars[h].cassandra_health_problems | default(['unreachable']) -%}
          {%-   set _ = out.append(h ~ ': ' ~ ('OK' if problems | length == 0 else problems | join('; '))) -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    - name: Fail on problems
      ansible.builtin.assert:
        that: _unhealthy | length == 0
        fail_msg: >-
          Cluster not healthy: see the report above ({{ _unhealthy | join(', ') }}).{{
          (' Not counted, marked cassandra_node_state: absent: ' ~ _absent | join(', ')
           ~ ' (still in the ring? the playbook topology removes them).') if _absent and _count_problems else '' }}
        success_msg: "Cluster healthy: {{ ansible_play_hosts_all | length }} node(s) checked"
      vars:
        _absent: "{{ query('community.cassandra.cassandra_nodes', state='absent') }}"
        _count_problems: >-
          {{ ansible_play_hosts | map('extract', hostvars, 'cassandra_health_problems') | flatten
             | select('search', '^the ring has ') | list | length > 0 }}
        _unhealthy: >-
          {{ ansible_play_hosts_all | reject('in', ansible_play_hosts) | list
             + (ansible_play_hosts | map('extract', hostvars) | selectattr('cassandra_health_problems')
                | map(attribute='inventory_hostname') | list) }}
      run_once: true
