minor_changes:
  - >-
    cassandra_config - a password in ``cassandra.yaml`` is single-quoted unless it is a plain word YAML reads back
    as written (``#``, ``: ``, quotes, a leading ``*``, ``&`` or ``!``, ``yes``, ``0123``...). import_cluster reads
    the password itself, however the node quotes it; an inventory from an earlier import (or written by hand) that
    kept the quotes in such a value must drop them.
