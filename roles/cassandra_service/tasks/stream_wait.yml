---
# Waits for a streaming operation as long as it makes progress: every
# cassandra_stream_check_interval seconds (sooner at first), reads nodetool netstats where the
# data streams, prints the progress (cassandra_stream_report), and fails only after
# cassandra_stream_stall_checks checks in a row without any byte or file
# streamed (or after cassandra_stream_max_time,
# when set). The checks (stream_check.yml) run in wait_loop.yml, which stops
# right after the one that ends it.
# The caller sets:
#   _cassandra_stream_what: what is waited for, for the messages (e.g. "bootstrap of node7")
#   _cassandra_stream_operations: netstats session operations to follow (e.g. ['Bootstrap'])
#   _cassandra_stream_from: hosts whose netstats show the streams
#   _cassandra_stream_join: true: done when this node is NORMAL (bootstrap, replace)
#   _cassandra_stream_leave: true: done when this node is DECOMMISSIONED (decommission)
#   _cassandra_stream_job: {'jid': ..., 'host': ...}: done when this async job ends (with _leave, when it
#     changed something: a decommission of a node already LEAVING waits for DECOMMISSIONED)
#   _cassandra_stream_removal_on: host whose nodetool removenode status says when
#     a removenode an earlier run started is over (no job to follow)
#   _cassandra_stream_peers: hosts to read instead, from the other side, when this
#     node's nodetool can't answer during its bootstrap (5.0.0 to 5.0.4, CASSANDRA-19902)
#   _cassandra_stream_advice: what to check when it stalls
# and resets _cassandra_stream_state to {} before the include.
- name: Start following it
  ansible.builtin.set_fact:
    _cassandra_stream_status: going
  vars:
    cassandra_output_gap: true  # its progress lines, a block of their own (ops callback)

- name: Check the progress, then every {{ cassandra_stream_check_interval }}s
  ansible.builtin.include_tasks: wait_loop.yml
  vars:
    _cassandra_wait_check: stream_check.yml
    _cassandra_wait_going: "{{ _cassandra_stream_status == 'going' }}"

- name: Stop when it failed or stopped moving
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }}, {{ _cassandra_stream_what }}:
      {%- if _cassandra_stream_status == 'job_failed' %}
      failed: {{ [_cassandra_stream_job_result.msg | default('')] | flatten | join(' ') }} {{ _cassandra_stream_job_result.stderr | default('') }}
      {%- elif _cassandra_stream_status == 'job_lost' %}
      the job running it can't be read ({{ _cassandra_stream_job_result.msg | default('') }}): check the node (nodetool netstats, system.log).
      {%- elif _cassandra_stream_status == 'join_failed' %}
      the bootstrap failed (Mode JOINING_FAILED): see why in its system.log. {{ _cassandra_stream_advice | default('') }}
      {%- elif _cassandra_stream_status == 'leave_failed' %}
      the decommission failed (Mode DECOMMISSION_FAILED): see why in its system.log. Once fixed, nodetool decommission
      on it resumes it (the ranges already streamed are skipped), or restart Cassandra on it to cancel it (it comes back UN).
      {%- elif _cassandra_stream_status == 'stopped' %}
      Cassandra stopped during the {{ _cassandra_stream_what }}: see why in its system.log. {{ _cassandra_stream_advice | default('') }}
      {%- elif _cassandra_stream_status == 'stalled' %}
      no streaming progress in {{ _cassandra_stream_state.idle_checks }} checks in a row, {{ cassandra_stream_check_interval }}s
      apart (cassandra_stream_stall_checks, 4 times as many while nothing is left to transfer). Nothing was
      stopped: {{ _cassandra_stream_advice | default('check nodetool netstats and system.log on the nodes.') }}
      {%- else %}
      still going after {{ cassandra_stream_max_time }}s (cassandra_stream_max_time). Nothing was stopped:
      {{ _cassandra_stream_advice | default('check nodetool netstats and system.log on the nodes.') }}
      {%- endif %}
      Last progress: {{ _cassandra_stream_report | first }}
  when: _cassandra_stream_status not in ['done', 'going']
