---
_cassandra_config_series: "{{ cassandra_version[0] }}.{{ cassandra_version[1] }}"
_cassandra_config_files:
  "5.0": [cassandra.yaml, cassandra-env.sh, jvm-server.options, jvm11-server.options, jvm17-server.options,
          cassandra-rackdc.properties, logback.xml]
  "4.1": [cassandra.yaml, cassandra-env.sh, jvm-server.options, jvm8-server.options, jvm11-server.options,
          cassandra-rackdc.properties, logback.xml]
  "4.0": [cassandra.yaml, cassandra-env.sh, jvm-server.options, jvm8-server.options, jvm11-server.options,
          cassandra-rackdc.properties, logback.xml]
# Stock release each series' templates come from (tools/gen_templates.py)
_cassandra_config_template_versions:
  "5.0": 5.0.9
  "4.1": 4.1.12
  "4.0": 4.0.21
_cassandra_config_python: >-
  {{ ansible_facts['python']['executable'] if ansible_facts['python'] is defined
     else ansible_python_interpreter | default('/usr/bin/python3') }}
# Snitches that don't take the node's dc and rack from cassandra-rackdc.properties'
# dc= and rack= (Cassandra 4.0 to 5.0; the cloud ones may read its other settings)
_cassandra_config_snitches_without_rackdc: [SimpleSnitch, RackInferringSnitch, PropertyFileSnitch, Ec2Snitch,
                                            Ec2MultiRegionSnitch, GoogleCloudSnitch, CloudstackSnitch,
                                            AlibabaCloudSnitch, AzureSnitch]
