---
# Confirmed once for the whole run by the apply_config playbook, which tells
# what follows in cassandra_apply_config_then:
#   restart: new settings, the node is drained and restarted;
#   start: its unit failed (it could not start, or crashed) or a resumed run
#     stopped it: started once written;
#   none: an owner, group or mode alone, read when Cassandra started; the JMX
#     password file (read at each login, written first by apply_config); the
#     role's header line alone (a comment); Medusa (not read by Cassandra);
#     the AxonOps agent (its Java agent read at the next start);
#   write: stopped on purpose, left stopped.
# A unit restarting in a loop (Restart=on-failure) or past its start limit
# would not start again: it is stopped before the write, so that the loop does
# not bring it up on the former config.
- name: Clear the unit's failed starts
  when: cassandra_apply_config_then | default('restart') == 'start'
  vars:
    # restarting in a loop at the plan (its JVM may be up for a moment, on the config that fails)
    _looping: "{{ cassandra_apply_config_unit.status.ActiveState | default('') == 'activating' }}"
    _now: "{{ cassandra_apply_config_unit_now.status | default({}) }}"
    _up: "{{ _now.ActiveState | default('') == 'active' and _now.SubState | default('') == 'running' }}"
  block:
    # read again: it may have come up since the plan
    - name: Read the state of its unit
      ansible.builtin.systemd_service:
        name: cassandra
      register: cassandra_apply_config_unit_now
      failed_when: false  # no unit (not-found) is not a failure; anything else, the checks below

    # failed or stopped at the plan, running now: started by hand on the former config, which the start
    # would not change
    - name: Stop if it came up since the plan
      ansible.builtin.assert:
        that: _looping | bool or not _up | bool
        fail_msg: >-
          {{ inventory_hostname }}: Cassandra came up since the plan was shown, with the config it had then. Nothing was
          changed on it: run apply_config again (it then restarts it if its config changes).
        quiet: true

    - name: Stop its restart loop
      ansible.builtin.systemd_service:
        name: cassandra
        state: stopped
      when: _looping | bool or _now.ActiveState | default('') == 'activating'

    # no module resets a unit's failed state
    - name: Reset its start limit
      ansible.builtin.command: systemctl reset-failed cassandra
      changed_when: false
      failed_when: false  # not failed: nothing to reset

# A file written back as the running Cassandra started with it, no restart planned for it: that JVM
# must still be the one running (restarted since the plan, it may have started without that file)
- name: Check the JVM a file is written back for still runs
  when:
    - (cassandra_apply_config_as_started | default({}) | length > 0) or (cassandra_apply_config_proven | default({}) | length > 0)
    - cassandra_apply_config_then | default('restart') == 'none'
  block:
    - name: Read the running Cassandra again
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: jvm_started.yml

    - name: Stop if it restarted since the plan
      ansible.builtin.assert:
        that:
          - cassandra_jvm.pid | default('') | string == _plan.pid | string
          - (cassandra_jvm.start | default(0) | float - _plan.start | float) | abs < 2
        fail_msg: >-
          Cassandra restarted since the plan was shown, maybe without
          {{ _plan.files | join(', ') }}, which the plan wrote with no restart. Nothing was changed on it:
          run apply_config again (it then restarts it if it needs it).
        quiet: true
      vars:
        _plan: "{{ cassandra_apply_config_as_started if cassandra_apply_config_as_started | default({}) else cassandra_apply_config_proven }}"

# A newer release with the repository changed by this run (the plan could not look in it; after the checks above,
# which change nothing but a restart loop stopped): that repository written first, then the release looked for in it, before anything else is changed on the node (its Java, its config, the
# package of a node not running), so that a release it lacks stops the run with Cassandra as it was, its package
# unchanged; the stop says what was changed on it before its turn (its OS settings, its JMX password file), then the
# one way out: fix it, then resume
- name: Apply the repository of the release, then look for the release in it
  when:
    - not ansible_check_mode
    - cassandra_apply_config_release | default(false) | bool
    - "'Repository' in cassandra_apply_config_extras | default([]) | map(attribute='section')"
  block:
    - name: Apply the repository of the release
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_repository
      vars:
        _cassandra_change_report_quiet: true  # shown before the run was confirmed, and in its recap at the end

    - name: Read the installed packages
      ansible.builtin.command:
        argv: "{{ ['cassandra'] | community.cassandra.cassandra_package_query(ansible_facts['os_family']) }}"
      environment:
        LC_ALL: C  # "not installed" said in English, as the filter reads it
      register: cassandra_apply_config_packages_read
      changed_when: false
      failed_when: false  # not installed; nothing read at all: the check below fails
      check_mode: false  # a read

    - name: Look for the release in the repository written
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_install
        tasks_from: release_check.yml
      vars:
        _cassandra_install_upgrade: true  # (cassandra_package_version: the inventory's, the release wanted)
        _cassandra_install_before: "{{ cassandra_apply_config_packages_read | community.cassandra.cassandra_installed_packages }}"
        _cassandra_install_again: resume
        _cassandra_install_changed_before: >-
          {{ (['its OS settings (' ~ cassandra_apply_config_os_live | map(attribute='item') | join(', ') ~ ')']
              if cassandra_apply_config_os_done | default(false) | bool and cassandra_apply_config_os_live | default([])
              else [])
             + (['its JMX password file'] if _cassandra_config_jmx_written is defined else []) }}

# Another Java (java_plan.yml found it): installed and made the one Cassandra starts with, before the config (its
# jvm<N>-server.options) is written, Cassandra still running (a failure leaves it up); the node's one restart below
# starts it, java_verify.yml checks it
- name: Install the Java this node moves to
  ansible.builtin.include_tasks: java_install.yml
  when:
    - cassandra_apply_config_java | default(false) | bool
    - not cassandra_apply_config_release | default(false) | bool

# with a newer release of its series: the same, its Cassandra package kept at the release installed (cassandra_install
# refuses another version outside the restart window, which updates it: apply_config_window.yml)
- name: Install the Java this node moves to, its Cassandra release kept
  ansible.builtin.include_tasks: java_install.yml
  vars:
    cassandra_package_version: "{{ cassandra_apply_config_version.installed | default(cassandra_apply_config_version.running) }}"
  when:
    - cassandra_apply_config_java | default(false) | bool
    - cassandra_apply_config_release | default(false) | bool

# A newer release of its series on a node not running (stopped on purpose, or to start): its package now, Cassandra
# stopped (a running node gets it in its restart: apply_config_window.yml)
- name: Update the Cassandra package of a node not running
  ansible.builtin.include_tasks: package_update.yml
  vars:
    cassandra_install_java: false  # (the Java a node not running starts with is left as it is)
  when:
    - cassandra_apply_config_release | default(false) | bool
    - cassandra_apply_config_then | default('restart') in ['start', 'write']
    - not ansible_check_mode

# The AxonOps agent (cassandra_axonops_enabled, its changes found by the plan: section AxonOps): before the config,
# whose cassandra-env.sh loads its Java agent (the file it sources installed first); not read by the running Cassandra
# (its Java agent and axon-agent.yml at its next start), no restart for it
- name: Set up the AxonOps agent
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_axonops
  vars:
    _cassandra_change_report_quiet: true  # shown before the run was confirmed, and in its recap at the end
  when:
    - not ansible_check_mode
    - "'AxonOps' in cassandra_apply_config_extras | default([]) | map(attribute='section')"

# (the stop's row says how far it went: its config not written, its write started, its config written)
- name: Note that the config is being written
  ansible.builtin.set_fact:
    _cassandra_op_stage: writing
  when: not ansible_check_mode

- name: Write the config
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_config
  vars:
    cassandra_config_confirm: false
    _cassandra_config_no_question: true  # the run's own question covered it, whatever -e cassandra_config_confirm says
    _cassandra_config_no_newsize_warning: true  # said by the run's preview (Compare the config)
    # the restart loads them; cassandra.yaml written back with no restart: reloaded (a hand edit may have loaded others)
    cassandra_config_reload_seeds: "{{ 'cassandra.yaml' in cassandra_apply_config_as_started.files | default([]) }}"
    _cassandra_config_no_restart_warning: true
    # shown before the run was confirmed, and in its recap at the end
    _cassandra_config_quiet: true
    _cassandra_change_report_quiet: true
  when: not ansible_check_mode

- name: Note that the config is written
  ansible.builtin.set_fact:
    _cassandra_op_stage: written
  when: not ansible_check_mode

# Medusa (cassandra_medusa_enabled, its changes found by the plan): its version, medusa.ini, its credentials, link and
# profile.d; not read by Cassandra: no restart for it (pip respects cassandra_offline and the PyPI mirror, as the role
# does everywhere)
- name: Set up Medusa
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_medusa
  vars:
    _cassandra_change_report_quiet: true  # shown before the run was confirmed, and in its recap at the end
  when:
    - not ansible_check_mode
    - cassandra_apply_config_medusa | default([]) | length > 0

# The repository, the packages and tools, the firewall (their changes found by the plan): not read by the running
# Cassandra (jemalloc at its next start, said in the plan), no restart for them. The Java is not touched here (a move
# is java_install.yml's, above). A newer release of its series: its repository at the top; Cassandra running, its
# packages and tools with its package kept at the release installed (below; the package itself in its window,
# package_update.yml: a failure among the tools never leaves it stopped); not running, here (its package updated)
- name: Apply the repository, the packages and the firewall
  ansible.builtin.include_role:
    name: "community.cassandra.{{ item.role }}"
  vars:
    _cassandra_change_report_quiet: true  # shown before the run was confirmed, and in its recap at the end
    cassandra_install_java: false  # (a Java move: java_install.yml's, or its restart window's)
  loop:
    - {section: Repository, role: cassandra_repository}
    - {section: Packages, role: cassandra_install}
    - {section: Firewall, role: cassandra_firewall}
  loop_control:
    label: "{{ item.role }}"
  when:
    - not ansible_check_mode
    - item.section in cassandra_apply_config_extras | default([]) | map(attribute='section')
    - >-
      item.section == 'Firewall' or not cassandra_apply_config_release | default(false) | bool
      or (item.section == 'Packages' and cassandra_apply_config_then | default('restart') in ['start', 'write'])

# (its repository applied first, at the top; a node not running has its package updated already, its packages and
# tools applied with the others' above: here, they would take it back to the release it had)
- name: Apply the packages, its Cassandra release kept
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_install
  vars:
    _cassandra_change_report_quiet: true  # shown before the run was confirmed, and in its recap at the end
    cassandra_install_java: false  # (a Java move: java_install.yml's, above)
    cassandra_package_version: "{{ cassandra_apply_config_version.installed | default(cassandra_apply_config_version.running) }}"
  when:
    - not ansible_check_mode
    - "'Packages' in cassandra_apply_config_extras | default([]) | map(attribute='section')"
    - cassandra_apply_config_release | default(false) | bool
    - cassandra_apply_config_then | default('restart') == 'restart'

# what the plan wrote back with no restart is on disk as the running Cassandra started with it, and that
# Cassandra still runs (restarted during the write, it may have read the files before)
- name: Check the files written back
  when:
    - cassandra_apply_config_as_started | default({}) | length > 0
    - cassandra_apply_config_then | default('restart') == 'none'
    - not ansible_check_mode
  block:
    - name: Load the cassandra_service defaults (the conf dir)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Checksum the files written back
      ansible.builtin.stat:
        path: "{{ _cassandra_service_conf_dir }}/{{ item }}"
        checksum_algorithm: sha1
        get_mime: false
        get_attributes: false
      loop: "{{ cassandra_apply_config_as_started.files }}"
      register: cassandra_apply_config_written_back

    - name: Read the running Cassandra once written
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: jvm_started.yml

    - name: Stop if one differs from what Cassandra started with
      ansible.builtin.assert:
        that:
          - _differ | length == 0
          - cassandra_jvm.pid | default('') | string == cassandra_apply_config_as_started.pid | string
          - (cassandra_jvm.start | default(0) | float - cassandra_apply_config_as_started.start | float) | abs < 2
        fail_msg: >-
          {{ _what }} (the plan said no restart): {{ ("restart it so that it runs with the inventory's config: " ~ _restart)
          if cassandra_jvm.pid is defined else 'start Cassandra on it with start_rack (which checks the start first): '
          ~ _start ~ '; then run apply_config again' }}
        quiet: true
      vars:
        _what: >-
          {{ (_differ | join(', ') ~ ' written with another content than the running Cassandra started with')
             if _differ else ('Cassandra restarted or stopped while ' ~ cassandra_apply_config_as_started.files | join(', ')
                              ~ (' were' if cassandra_apply_config_as_started.files | length > 1 else ' was') ~ ' written back') }}
        # start_rack on this node alone (without --limit, every stopped node of its rack)
        _start: >-
          {{ 'start_rack' | community.cassandra.cassandra_command(inventory=ansible_inventory_sources,
               default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'), hosts=cassandra_hosts | default(''),
               limit=inventory_hostname, cwd=lookup('ansible.builtin.env', 'PWD'),
               extra={'cassandra_target_dc': _cassandra_preflight.cassandra_dc | default(cassandra_dc),
                      'cassandra_target_rack': _cassandra_preflight.cassandra_rack | default(cassandra_rack)}) }}
        _restart: >-
          {{ 'rolling_restart' | community.cassandra.cassandra_command(inventory=ansible_inventory_sources,
               default_inventory=lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST'), hosts=cassandra_hosts | default(''),
               limit=inventory_hostname, cwd=lookup('ansible.builtin.env', 'PWD')) }}
        _differ: >-
          {%- set out = [] -%}
          {%- for r in cassandra_apply_config_written_back.results -%}
          {%-   if r.stat.checksum | default('') != cassandra_apply_config_as_started.sha1[r.item] -%}
          {%-     set _ = out.append(r.item) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out }}

# Written with no restart, proven to change nothing for the running Cassandra (apply_config.yml, _no_effect): on disk
# as planned and that Cassandra still runs, they are recorded as the files it runs with (the record of its start,
# when it is that JVM's), so that no restart is told pending for them later; else (another content, a restart since,
# no record of that JVM) left unrecorded: a later run restarts it if it needs it
- name: Record the files written with no effect as the ones the running Cassandra runs with
  when:
    - cassandra_apply_config_proven | default({}) | length > 0
    - cassandra_apply_config_then | default('restart') == 'none'
    - not ansible_check_mode
  block:
    - name: Load the cassandra_service defaults (the conf dir, the record)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Read the running Cassandra once written
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        tasks_from: jvm_started.yml

    - name: Record them when they are on disk as planned and that Cassandra still runs
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: config_record_update.yml
      vars:
        _cassandra_service_record_request:
          jvm: {pid: "{{ cassandra_apply_config_proven.pid }}", start: "{{ cassandra_apply_config_proven.start }}"}
          files: >-
            {%- set out = {} -%}
            {%- for f, sum in cassandra_apply_config_proven.sha1.items() -%}
            {%-   set _ = out.update({_cassandra_service_conf_dir ~ '/' ~ f: sum}) -%}
            {%- endfor -%}
            {{ out }}
      when:
        - cassandra_jvm.pid | default('') | string == cassandra_apply_config_proven.pid | string
        - (cassandra_jvm.start | default(0) | float - cassandra_apply_config_proven.start | float) | abs < 2

# --check writes nothing: what the plan found on this node (the same role run in check mode, just before),
# reported as a real run reports what it writes
- name: Report what would be written
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_change_report
  vars:
    cassandra_change_report_role: cassandra_config
    cassandra_change_report_items: "{{ _cassandra_config_items | default([]) }}"
    _cassandra_change_report_quiet: true
  when: ansible_check_mode

- name: Report what the repository, the packages and the firewall would get
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_change_report
  vars:
    cassandra_change_report_role: apply_config_extras
    cassandra_change_report_items: "{{ cassandra_apply_config_extras | default([]) }}"
    _cassandra_change_report_quiet: true
  when:
    - ansible_check_mode
    - cassandra_apply_config_extras | default([]) | length > 0

- name: Report what Medusa would get
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_change_report
  vars:
    cassandra_change_report_role: cassandra_medusa
    cassandra_change_report_items: "{{ cassandra_apply_config_medusa | default([]) }}"
    _cassandra_change_report_quiet: true
  when:
    - ansible_check_mode
    - cassandra_apply_config_medusa | default([]) | length > 0

# (no "Restarting node..." line: the wait line of the restart says it)
- name: Drain and restart the node
  ansible.builtin.include_tasks: action_restart.yml
  vars:
    _cassandra_restart_timesync: "{{ cassandra_apply_config_timesync | default(false) }}"
    _cassandra_restart_disks: "{{ cassandra_apply_config_disks_window | default([]) | length > 0 }}"
    # a newer release of its series: the package updated with Cassandra stopped, its config written again
    _cassandra_service_while_stopped: "{{ 'apply_config_window.yml' if cassandra_apply_config_release | default(false) | bool else '' }}"
    _cassandra_exporter_check_left: not stopped (left running as it is); the config written applies at its next start
  when: cassandra_apply_config_then | default('restart') == 'restart'

# its time sync before Cassandra starts (os_window.yml)
# (a node an interrupted run stopped there, its time sync started already: its clock let sync)
- name: Start the time sync before Cassandra starts
  ansible.builtin.include_tasks: os_window.yml
  vars:
    _cassandra_timesync_wait_only: "{{ not cassandra_apply_config_timesync | default(false) | bool }}"
  when:
    - cassandra_apply_config_then | default('restart') == 'start'
    - cassandra_apply_config_timesync | default(false) | bool or cassandra_apply_config_resumed_stop | default(false) | bool
    - not ansible_check_mode

- name: Check the Prometheus exporter's agent can start
  ansible.builtin.include_tasks: exporter_check.yml
  vars:
    _cassandra_exporter_check_left: not started (left as it is), its config written
  when: cassandra_apply_config_then | default('restart') == 'start'

- name: Start the node and wait until it has joined
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: main.yml
    rolespec_validate: false  # as the include it was: no argument check
  vars:
    _cassandra_change_report_quiet: "{{ ansible_verbosity | int == 0 }}"  # the recap says it (-v shows it)
    cassandra_service_state: started
    _cassandra_storage_mode_checked: true  # (storage_mode_guard.yml, before the plan)
  when: cassandra_apply_config_then | default('restart') == 'start'

# the Java it moved to, the release it was updated to: running them (the same failure and way out as update_java's,
# the upgrade's)
- name: Check it runs the new Java
  ansible.builtin.include_tasks: java_verify.yml
  when:
    - cassandra_apply_config_java | default(false) | bool
    - cassandra_apply_config_then | default('restart') == 'restart'

- name: Check it runs the new release
  ansible.builtin.include_tasks: version_verify.yml
  when:
    - cassandra_apply_config_release | default(false) | bool
    - cassandra_apply_config_then | default('restart') in ['restart', 'start']

# (once Cassandra is up again: the mark of a stop in its restart window)
- name: Forget the restart in progress
  ansible.builtin.file:
    path: /run/cassandra-apply-config.restart
    state: absent
  when:
    - not ansible_check_mode
    - cassandra_apply_config_then | default('restart') in ['restart', 'start']
