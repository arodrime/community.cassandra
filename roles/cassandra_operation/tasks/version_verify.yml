---
# A node started on a new Cassandra package (package_update.yml): it must run cassandra_package_version
# (action_upgrade.yml, apply_config).
# --check upgrades nothing: no new version to find
- name: Read the version it runs
  ansible.builtin.command: "{{ _cassandra_service_nodetool }} version"
  register: cassandra_version_verify
  changed_when: false
  failed_when: false  # said below, the password masked
  when: not ansible_check_mode
  no_log: "{{ cassandra_jmx_password | default('') | length > 0 }}"  # (nodetool -pw)

# (no_log hides its failure: said here, the password masked)
- name: Stop where nodetool version failed
  ansible.builtin.fail:
    msg: "{{ _failed | join(_nl) }}"
  when: _failed | length > 0
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"  # a newline (Jinja keeps a backslash in its string literals here)
    _failed: "{{ cassandra_version_verify | default({}) | community.cassandra.cassandra_nodetool_failure(inventory_hostname, 'version') }}"

- name: Check it runs the target version
  ansible.builtin.assert:
    that: >-
      cassandra_version_verify.stdout is search('ReleaseVersion: ' ~ cassandra_package_version | regex_escape ~ '$', multiline=True)
    fail_msg: >-
      {{ inventory_hostname }} runs {{ cassandra_version_verify.stdout | default('') | trim }}, not
      {{ cassandra_package_version }}, once its package was updated and Cassandra started. See which package is installed
      there ({{ 'dpkg -s cassandra' if ansible_facts['os_family'] | default('') == 'Debian' else 'rpm -q cassandra' }}) and
      what its cassandra unit starts (systemctl cat cassandra); fix it, then run the same command again.
    quiet: true
  when: not ansible_check_mode
