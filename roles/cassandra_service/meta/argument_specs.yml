---
argument_specs:
  main:
    short_description: Run Cassandra under a systemd unit.
    description:
    - Installs a native systemd unit, enables it, starts the node and waits until it has joined the cluster.
    - 'Handles the node it runs on. Order several nodes in the playbook (C(serial: 1), seeds first for a new cluster).'
    options:
      cassandra_service_enabled:
        type: bool
        default: true
        description:
        - Start Cassandra at boot.
      cassandra_service_state:
        type: str
        default: started
        choices: [started, stopped, restarted]
        description:
        - State of the service.
      cassandra_service_restart_on_change:
        type: bool
        default: false
        description:
        - Restart a running node when the unit changes. Otherwise the change applies at the next restart.
      cassandra_user:
        type: str
        default: cassandra
        description:
        - Account the Cassandra service runs as (C(User=) of the unit), the same variable as in the C(cassandra_config) role.
          The deb and rpm packages create C(cassandra); the role does not create it.
      cassandra_group:
        type: str
        default: cassandra
        description:
        - Group the Cassandra service runs as (C(Group=) of the unit), the same variable as in the C(cassandra_config) role.
      cassandra_service_restart:
        type: str
        default: "no"
        choices: ["no", on-failure, always]
        description:
        - systemd C(Restart=). With V(no), a node that died stays down until someone looks at it.
      cassandra_service_start_limit_burst:
        type: int
        default: 3
        description:
        - Maximum starts per O(cassandra_service_start_limit_interval), when O(cassandra_service_restart) is not V(no).
          Manual starts count too; past the limit, systemd refuses to start the unit until the interval is over (or
          C(systemctl reset-failed cassandra)).
      cassandra_service_start_limit_interval:
        type: int
        default: 1800
        description:
        - Interval for O(cassandra_service_start_limit_burst), in seconds.
      cassandra_service_limit_nofile:
        type: raw
        default: 1048576
        description:
        - systemd C(LimitNOFILE=).
      cassandra_service_limit_nproc:
        type: raw
        default: 32768
        description:
        - systemd C(LimitNPROC=).
      cassandra_service_limit_memlock:
        type: raw
        default: infinity
        description:
        - systemd C(LimitMEMLOCK=).
      cassandra_service_limit_as:
        type: raw
        default: infinity
        description:
        - systemd C(LimitAS=).
      cassandra_service_timeout_stop:
        type: int
        default: 180
        description:
        - Seconds systemd waits for the drain, then again for the JVM after SIGTERM, before killing it.
      cassandra_service_environment:
        type: dict
        default: {}
        description:
        - 'Extra environment variables for the unit, for example C({JAVA_HOME: /usr/lib/jvm/java-17}). The unit file is
          world-readable: no secrets here.'
        - The unit does not read C(/etc/default/cassandra), which the deb init script sources.
      cassandra_service_tasks_max:
        type: raw
        default: infinity
        description:
        - systemd C(TasksMax=). systemd's own default (15% of C(pid_max)) can be low enough to make a busy node fail with
          "unable to create native thread".
      cassandra_service_drain_on_stop:
        type: bool
        default: true
        description:
        - Run C(nodetool drain) before the JVM gets SIGTERM, so a plain C(systemctl stop cassandra) (OS patching, reboot)
          is clean. Never blocks the stop.
        - With JMX authentication it needs O(cassandra_jmx_username) and O(cassandra_jmx_password_file) (the unit file is
          world-readable).
      cassandra_service_drain_timeout:
        type: int
        default: 120
        description:
        - Seconds before the drain is abandoned and the JVM stopped anyway. Must stay more than 10 below
          O(cassandra_service_timeout_stop).
      cassandra_service_wait_for_normal:
        type: bool
        default: true
        description:
        - 'Wait until C(nodetool netstats) reports C(Mode: NORMAL).'
      cassandra_service_wait_timeout:
        type: int
        default: 600
        description:
        - 'How long to wait for a started node to reach C(Mode: NORMAL), in seconds.'
      cassandra_jmx_username:
        type: str
        default: ""
        description:
        - JMX user for the drain on stop and the wait, when JMX authentication is on.
      cassandra_jmx_password:
        type: str
        default: ""
        no_log: true
        description:
        - JMX password, used by the wait only (never written to the unit), with O(cassandra_jmx_username). It is on the
          C(nodetool) command line while the wait runs, visible to C(ps) on the node; prefer
          O(cassandra_jmx_password_file).
      cassandra_jmx_password_file:
        type: str
        default: ""
        description:
        - 'File on the node in the C(jmxremote.password) format (C(<user> <password>) lines; C(nodetool) takes the line
          of O(cassandra_jmx_username)), readable by O(cassandra_user) for the drain on stop. The
          C(/etc/cassandra/jmxremote.password) that C(cassandra_config) writes from C(cassandra_jmx_users) works as is.'
