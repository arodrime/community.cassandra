---
# No firewall on this node (cassandra_firewall_enabled: false): nothing installed; firewalld (RedHat) or ufw
# (Debian) stopped and disabled where it runs
- name: Include vars for os family
  ansible.builtin.include_vars:
    file: "{{ ansible_facts['os_family'] }}.yml"

- name: Read the firewall state (change report)
  ansible.builtin.shell: |
    svc={{ _cassandra_firewall_service }}
    {% if ansible_facts['os_family'] == 'RedHat' %}
    echo "active|$(systemctl is-active $svc 2>/dev/null)"
    e=$(systemctl is-enabled $svc 2>/dev/null); [ "$e" = not-found ] && e=absent
    echo "enabled|${e:-absent}"
    {% else %}
    command -v ufw >/dev/null 2>&1 && ufw status 2>/dev/null | grep -q '^Status: active' && echo "active|active" \
      || echo "active|inactive"
    # (at boot: ufw.conf ENABLED, yes or no)
    echo "enabled|$(sed -n 's/^ENABLED=//p' /etc/ufw/ufw.conf 2>/dev/null | grep . || echo absent)"
    {% endif %}
  register: cassandra_firewall_snapshot
  changed_when: false
  check_mode: false

- name: Keep the snapshot
  ansible.builtin.set_fact:
    _cassandra_firewall_before: "{{ dict(cassandra_firewall_snapshot.stdout_lines | map('split', '|', 1)) }}"

- name: Stop and disable firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: stopped
    enabled: false
  register: cassandra_firewall_stopped
  when:
    - ansible_facts['os_family'] == 'RedHat'
    # (what systemctl is-enabled says of a unit started at boot)
    - >-
      _cassandra_firewall_before.active == 'active'
      or _cassandra_firewall_before.enabled in ['enabled', 'enabled-runtime', 'static', 'alias', 'indirect', 'generated']

- name: Disable ufw
  community.general.ufw:
    state: disabled
  register: cassandra_firewall_stopped
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _cassandra_firewall_before.active == 'active'

- name: Report
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_change_report
  vars:
    cassandra_change_report_role: cassandra_firewall
    cassandra_change_report_items: >-
      {{ [{'item': _cassandra_firewall_service, 'before': _cassandra_firewall_before.active ~ ', at boot '
                                                         ~ _cassandra_firewall_before.enabled,
           'after': 'stopped, disabled'}] if cassandra_firewall_stopped is changed else [] }}
