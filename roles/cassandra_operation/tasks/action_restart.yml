---
# The unit written first: a run that can't write it (no root) stops with the
# node still running, not drained
- name: Install the cassandra systemd unit
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: unit.yml

- name: Drain the node
  ansible.builtin.import_tasks: drain.yml
  when: cassandra_operation_drain | bool or not cassandra_service_unit_manage | bool  # a kept unit may not drain
  vars:
    _cassandra_service_drain_then: restarted

# apply_config: its OS settings done with Cassandra stopped (os_window.yml): its time sync, its disk settings
- name: Apply the OS settings with Cassandra stopped
  ansible.builtin.include_tasks: os_window.yml
  when:
    - _cassandra_restart_timesync | default(false) | bool or _cassandra_restart_disks | default(false) | bool
    - not ansible_check_mode

# a restart with something done while Cassandra is stopped (sync_clocks steps the clock: action_sync_clock.yml)
- name: Do what is done while it is stopped
  when: _cassandra_service_while_stopped | default('') | length > 0
  block:
    - name: Stop cassandra
      ansible.builtin.systemd_service:
        name: cassandra
        state: stopped

    - name: Run what is done while it is stopped
      ansible.builtin.include_tasks: "{{ _cassandra_service_while_stopped }}"

- name: Restart it and wait until it has joined
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: main.yml
    rolespec_validate: false  # as the include it was: no argument check
  vars:
    _cassandra_change_report_quiet: "{{ ansible_verbosity | int == 0 }}"  # the recap says it (-v shows it)
    cassandra_service_state: restarted
    _cassandra_service_unit_written: true
