---
# Prepares a blank node and starts it in place of a dead one: it takes over the
# dead node's tokens and streams their data from the replicas. The replace
# flag is only in the unit for that first start
# (replace_unit_check.yml, before the question: the replacement gets the role's unit).

# Computed first: a var can't be defined from itself (recursive template)
- name: Add the replace flag to the unit environment
  ansible.builtin.set_fact:
    _cassandra_service_replace_environment: >-
      {{ cassandra_service_environment | combine({'JVM_EXTRA_OPTS':
         (cassandra_service_environment.JVM_EXTRA_OPTS | default('') ~ ' -Dcassandra.replace_address_first_boot='
          ~ cassandra_replace_address) | trim}) }}

- name: Prepare the node and start it as the replacement
  ansible.builtin.include_tasks: action_add.yml
  vars:
    cassandra_service_environment: "{{ _cassandra_service_replace_environment }}"
    _cassandra_join_what: replacement
    _cassandra_join_then: >-
      if nodetool netstats on it still shows streams, wait until it is UN in nodetool status
      (replace_node does not wait again for a replacement it started).
    _cassandra_join_over: run replace_node again.

- name: Read the unit the replacement started with
  ansible.builtin.stat:
    path: /etc/systemd/system/cassandra.service
    checksum_algorithm: sha1
  register: _cassandra_replace_unit_before

- name: Take the replace flag out of the unit (no restart)
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: main.yml
    rolespec_validate: false  # as the include it was: no argument check
  vars:
    _cassandra_change_report_quiet: "{{ ansible_verbosity | int == 0 }}"  # the recap says it (-v shows it)
    cassandra_service_restart_on_change: false

# the running Cassandra read the flag at its first boot only: that rewrite is no restart pending (apply_config)
- name: Record the unit without the flag as the one the replacement runs with
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_service
    tasks_from: unit_no_restart.yml
    rolespec_validate: false
  vars:
    _cassandra_service_unit_before: "{{ _cassandra_replace_unit_before.stat.checksum | default('') }}"
  when: _cassandra_replace_unit_before.stat.checksum is defined
