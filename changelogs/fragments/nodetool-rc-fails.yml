bugfixes:
  - "cassandra_drain, cassandra_reload, cassandra_cleanup, cassandra_flush, cassandra_garbagecollect, cassandra_truncatehints, cassandra_upgradesstables, cassandra_verify - a nodetool command that returns a non-zero code fails explicitly, with nodetool's error line and what to check in the message, and ``error`` (that line), ``stdout`` and ``stderr`` in the result (before, a bare ``did not execute successfully``, with ``stdout`` and ``stderr`` only under ``debug``)."
  - "cassandra_reload - ``reload: seeds`` fails when nodetool says ``Failed to reload the seed node list.`` (it then returns 0: the node kept its old seeds and the task was ok)."
  - "rolling_restart, rolling_reboot, upgrade playbooks - a drain that nodetool fails (non-zero rc) or that times out (``cassandra_service_drain_timeout``, new for these) is a ``WARNING`` with nodetool's error, and the node is restarted or rebooted all the same (upgrade: flushed, then stopped), never left drained and running; a node that does not answer at all (JMX), in rack mode every node of the rack, still stops the run, nothing drained nor restarted. When a rack fails, the recap names the node that failed with its error, the others of the rack ``not finished``."
  - "stop_rack playbook - the ``WARNING`` of a node stopped without a drain (nodetool's error, no answer, the timeout) and the start_rack command are shown under the ``community.cassandra.ops`` callback."
  - "cassandra_hosts lookup - ``-e cassandra_hosts=<group>`` naming no group with hosts fails, instead of running no play at all under ``--limit``."
