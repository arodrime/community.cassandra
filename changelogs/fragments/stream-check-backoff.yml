minor_changes:
  - "add_node, replace_node, decommission_node, remove_dead_node, add_datacenter, move_node, topology, cleanup - the progress of a streaming operation or cleanup is checked every ``cassandra_stream_early_check_interval`` seconds (10) during the first ``cassandra_stream_early_time`` seconds (300), then every ``cassandra_stream_check_interval`` seconds (30): a short operation (a cleanup on a small cluster) ends in seconds. The run stops after ``cassandra_stream_stall_time`` seconds (900) without progress, 4 times as long while nothing is left to transfer."
