security_fixes:
  - "import_cluster - a secret's value on several lines (a YAML block value ``key: |``, a plain value going on to more indented lines, the value under ``key:``, a quote or a flow ``[``/``{`` left open, a shell quote or array, a line ending with a backslash) is masked on every line in the HAND EDITS of report.txt and report.check.txt, on the end screen and in the self-check stop; only the line with the key was, the next lines showed the value in clear, as did a properties setting written ``key value`` and the text of an XML element of a secret's name (``<password>`` in logback.xml)."
  - "cassandra_config - the diff of the config changes (``--diff``, the confirmation) masks every line of a secret's value too, also when only a line of its value changes, and the values of the other secret names the collection hides (``sse_c_key``, ``ca_key``, ``auth_token`` and the like)."
  - "cassandra_changed_lines filter - each side of each hunk is masked as one text with its context lines, a secret's value no longer shows when its key is a context line."
bugfixes:
  - "apply_config - the view of the config changes says a change of a secret's value on several lines (a YAML block, the mapping or list under a secret's key, a line going on from a secret's) on the secret's key, as ``(masked)``; a line written twice that holds a secret is said when its second copy changes too."
