breaking_changes:
  - rolling_restart, rolling_reboot - the plan is shown and the run asked once before anything starts, like the other node operations. A run without a terminal (cron, CI, AWX) now stops, saying so - add ``-e cassandra_operation_confirm=false`` to go on without asking; ``--check`` asks nothing.
minor_changes:
  - cassandra_service - the cluster health check before and after a node no longer waits in silence for a node down (up to ``cassandra_service_health_timeout``, 10 minutes by default) - it reads the cluster again (a node down; this node's ports, gossip or native transport not up yet; ``nodetool status`` with JMX refused or not answering on a node another one sees down) about every ``cassandra_stream_check_interval`` seconds (sooner at first), with a progress line naming what it waits for (``[2/5] node2 restart  waiting for node4 (10.0.0.4) DN to come back  1m30s/10m``); a stop after the wait says how long it waited. Any other problem (a ``nodetool`` login refused, nodetool failing on a node seen up, a schema disagreement) stops the run at once.
