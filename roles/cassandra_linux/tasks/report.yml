---
# What this run changed (or, with --check, would change): current -> wanted
- name: Compare kernel settings
  ansible.builtin.set_fact:
    _cassandra_linux_items: >-
      {{ _cassandra_linux_items | default([])
         + ([{'item': 'sysctl ' ~ item.key ~ ' (live)', 'before': _cassandra_linux_before['sysctl|' ~ item.key], 'after': item.value | string}]
            if _cassandra_linux_live and _cassandra_linux_before['sysctl|' ~ item.key] != item.value | string else [])
         + ([{'item': 'sysctl ' ~ item.key ~ ' (' ~ cassandra_linux_sysctl_file ~ ')', 'before': _cassandra_linux_before_file[item.key], 'after': item.value | string}]
            if _cassandra_linux_before_file[item.key] != item.value | string else []) }}
  loop: "{{ cassandra_linux_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# one task per item, each with its condition
- name: Add swap to the change list
  ansible.builtin.set_fact:
    _cassandra_linux_items: "{{ _cassandra_linux_items + [{'item': 'swap', 'before': 'on', 'after': 'off'}] }}"
  when: _cassandra_linux_live and _cassandra_linux_swapoff | bool

- name: Add the swap entries of /etc/fstab to the change list
  ansible.builtin.set_fact:
    _cassandra_linux_items: >-
      {{ _cassandra_linux_items
         + [{'item': 'swap entries in /etc/fstab', 'before': _cassandra_linux_before['swap|fstab'] | int, 'after': 0}] }}
  when: _cassandra_linux_before['swap|fstab'] | int > 0

- name: Add the THP unit to the change list
  ansible.builtin.set_fact:
    _cassandra_linux_items: >-
      {{ _cassandra_linux_items
         + [{'item': 'disable-thp.service',
             'before': _cassandra_linux_before['thp|unit']
                       ~ (', another unit file' if thp is changed and _cassandra_linux_before['thp|unit'] != 'absent' else ''),
             'after': 'enabled' if _cassandra_linux_boot else 'installed'}] }}
  when: thp is changed or (_cassandra_linux_boot and _cassandra_linux_before['thp|unit'] != 'enabled')

- name: Add transparent_hugepage to the change list
  ansible.builtin.set_fact:
    _cassandra_linux_items: >-
      {{ _cassandra_linux_items
         + [{'item': 'transparent_hugepage', 'before': _cassandra_linux_before['thp|enabled'], 'after': 'never'}] }}
  when: _cassandra_linux_live and _cassandra_linux_before['thp|enabled'] not in ['never', '']

# (left to apply_config's restart window, _cassandra_linux_timesync_later: what an earlier run registered is
# not this one's)
- name: Add the time sync package to the change list
  ansible.builtin.set_fact:
    _cassandra_linux_items: >-
      {{ _cassandra_linux_items
         + [{'item': 'package ' ~ _cassandra_timesync_pkg, 'before': 'absent', 'after': 'present', 'timesync': true}] }}
  when:
    - not _cassandra_linux_timesync_later | default(false) | bool
    - cassandra_timesync_install | default({}) is changed

- name: Add the time sync service to the change list
  ansible.builtin.set_fact:
    _cassandra_linux_items: >-
      {{ _cassandra_linux_items
         + [{'item': _cassandra_timesync_service, 'before': _cassandra_linux_before['timesync|service'] or 'inactive',
             'after': 'active', 'timesync': true}] }}
  when:
    - not _cassandra_linux_timesync_later | default(false) | bool
    - >-
      (cassandra_timesync_service_result | default({})) is changed
      or (_cassandra_linux_check and (cassandra_timesync_service_result | default({})) is skipped
          and _cassandra_linux_before['timesync|service'] != 'active'
          and cassandra_linux_timesync | bool
          and not (cassandra_offline | bool and cassandra_timesync_unit.rc | default(1) != 0))

- name: Add the nproc limit to the change list
  ansible.builtin.set_fact:
    _cassandra_linux_items: >-
      {{ _cassandra_linux_items
         + [{'item': '/etc/security/limits.d/90-nproc.conf', 'before': 'no "* - nproc 32768"', 'after': '* - nproc 32768'}] }}
  when: cassandra_linux_nproc is changed

- name: Add the limits.conf block of earlier versions to the change list
  ansible.builtin.set_fact:
    _cassandra_linux_items: >-
      {{ _cassandra_linux_items
         + [{'item': '/etc/security/limits.conf block of earlier versions', 'before': 'present', 'after': 'absent'}] }}
  when: cassandra_linux_limits_old is changed

- name: Compare the limits of the cassandra user
  ansible.builtin.set_fact:
    _cassandra_linux_items: >-
      {{ _cassandra_linux_items
         + ([{'item': 'limit cassandra ' ~ item.key, 'before': _cassandra_linux_before['limit|' ~ item.key] or 'unset', 'after': item.value}]
            if _cassandra_linux_before['limit|' ~ item.key] != item.value | string else []) }}
  loop: "{{ cassandra_linux_limits | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# a line left there by an earlier version of the role (it would win at boot)
- name: Compare the lines the role removes from /etc/sysctl.conf
  ansible.builtin.set_fact:
    _cassandra_linux_items: >-
      {{ _cassandra_linux_items + [{'item': 'sysctl ' ~ item.item.key ~ ' (/etc/sysctl.conf)', 'before': 'present',
                                    'after': 'absent'}] }}
  loop: "{{ cassandra_linux_sysctl_conf.results | default([]) | select('changed') | list }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Add the disk tuning (compared in disks_summary.yml)
  ansible.builtin.set_fact:
    _cassandra_linux_items: "{{ _cassandra_linux_items + _cassandra_disk_items | default([]) }}"

- name: Report
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_change_report
  vars:
    cassandra_change_report_role: cassandra_linux
    # (without the mark of the time sync items, apply_config's)
    cassandra_change_report_items: >-
      {{ _cassandra_linux_items | default([]) | map('dict2items') | map('rejectattr', 'key', 'equalto', 'timesync')
         | map('items2dict') | list }}
    cassandra_change_report_state:
      disk_changes: "{{ _cassandra_disk_items | default([]) | length }}"  # the last ones of the items
