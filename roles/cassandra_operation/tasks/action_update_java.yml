---
# Installs the Java the inventory asks for (made the default java), writes the
# config (the jvm<N>-server.options of that Java apply), drains and restarts,
# then checks the Java the restarted node runs.
- name: Install Java
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_install

- name: Write the config
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_config
  vars:
    cassandra_config_confirm: false  # confirmed once for the whole run
    _cassandra_config_no_restart_warning: true  # restarted next

- name: Drain and restart the node
  ansible.builtin.include_tasks: action_restart.yml

# --check restarts nothing: the running Java is the one found before
- name: Find the restarted Cassandra and its java
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_config
    tasks_from: jvm_started.yml
  when: not ansible_check_mode

- name: Read the Java version it runs
  ansible.builtin.command:
    argv: ["/proc/{{ cassandra_jvm.pid | default('') }}/exe", -XshowSettings:properties, -version]
  register: cassandra_update_java_restarted
  changed_when: false
  failed_when: false
  check_mode: false  # read-only
  when:
    - not ansible_check_mode
    - cassandra_jvm.pid is defined

- name: Check it runs Java {{ cassandra_java_version }}
  ansible.builtin.assert:
    that: _major == _wanted
    fail_msg: >-
      {{ inventory_hostname }} restarted on Java {{ _major or 'unknown' }} ({{ cassandra_jvm.exe | default('not running', true) }}),
      not {{ _wanted }}: the default java was not switched. Check update-alternatives --display java
      (alternatives on RedHat) there and set it by hand, or set cassandra_java_home to the Java {{ cassandra_java_version }}
      home; then run update_java again (this node is done again).
    quiet: true
  vars:
    _spec: >-
      {{ cassandra_update_java_restarted.stderr | default('') | regex_findall('java[.]specification[.]version = (\S+)')
         | first | default('') }}
    _major: "{{ _spec | community.cassandra.cassandra_java_major }}"
    _wanted: "{{ cassandra_java_version | community.cassandra.cassandra_java_major }}"  # "1.8" in the inventory: 8
  when: not ansible_check_mode
