minor_changes:
  - New sync_clocks playbook - shows each node's clock as its time sync daemon reports it (chrony, systemd-timesyncd or ntpd; synchronised, source, offset and error bound) with a verdict, warns about nodes that follow unrelated sources, and brings time sync up where it is missing the cassandra_linux way (no NTP server configured). A running node whose clock needs a step gets a restart window, one node at a time (drain, stop, step, start, the cluster checked before and after); an interrupted run is run again as it was, a node it left stopped is started again. New ``cassandra_service`` variables ``cassandra_clock_max_offset_ms`` (50), ``cassandra_clock_step_ms`` (400), ``cassandra_clock_sync_timeout`` (180) and ``cassandra_clock_check``.
  - create_cluster, add_node - before starting any node (and create_cluster with ``cassandra_create_cluster_reset`` before the wipe), check that the clocks of the nodes (the running ones too for add_node) are in sync, as ``sync_clocks`` does; a node off by more than ``cassandra_clock_max_offset_ms`` or without a synchronised source stops the run with nothing started, and the way out. A time sync just started (its error bound still converging) is waited for, up to ``cassandra_clock_sync_timeout``, on a progress line. ``-e cassandra_clock_check=false`` skips the check.
