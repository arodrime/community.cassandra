minor_changes:
  - apply_config - a config file deleted or edited by hand on a running node and written back with the content Cassandra started with (the checksums recorded at its start) no longer restarts it, Cassandra runs with exactly that content; the plan and the recap say so (``jvm17-server.options written back as the running Cassandra started with it: no restart for it``). Only for the JVM that record was written for (its pid and start, now recorded with it, and checked again just before the write), never for ``cassandra.yaml`` (settings changed live, seeds reloaded) nor when the conf directory switches; any other change, a restart pending for another file or the unit, an older record or none still restart the node.
bugfixes:
  - cassandra_service - the record of the config Cassandra started with leaves out a file written after the JVM started (what it read is unknown: a restart stays pending for it), and says which JVM it is for.
