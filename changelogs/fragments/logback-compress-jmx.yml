minor_changes:
  - 'cassandra_config role - ``cassandra_log_compress`` and ``cassandra_log_audit_compress`` (default ``true``, the stock ``.zip``): ``false`` leaves the rolled files of ``system.log`` and ``debug.log`` (of the audit file) not zipped; ``cassandra_log_jmx_configurator``: logback''s JMX MBean (``<jmxConfigurator />``), the series'' stock file by default (on in 4.x, off in 5.0), true restores the line Cassandra 3.x''s stock file had; import_cluster reads them back.'
  - 'cassandra_config role - ``cassandra_log_system_dir`` and ``cassandra_log_debug_dir`` (default ``${cassandra.logdir}``, the stock lines): the dir of ``system.log`` and of ``debug.log`` with their rolled files in ``logback.xml``, a path of their own when set; import_cluster reads them back from each appender''s ``<file>`` and ``<fileNamePattern>`` when both agree (else a hand edit), the log dir the JVM gets written as itself staying ``${cassandra.logdir}``.'
