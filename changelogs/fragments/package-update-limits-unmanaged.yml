minor_changes:
  - >-
    apply_config, upgrade - on a node with ``cassandra_linux_manage: false``, a package update that changes
    ``/etc/security/limits.d/cassandra.conf`` (the RPM ships it as a plain file) is said in the recap as a WARNING,
    with the way out (put your settings back in it, or set ``cassandra_linux_manage: true``); the file is left as
    the package wrote it.
