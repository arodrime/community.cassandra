---
# Once the JVM options file is written (apply.yml): what the Prometheus exporter's agent no longer loads, as
# cassandra_install removes the dsbulk versions it installed before. On: the jars of other versions the role
# downloaded into cassandra_prometheus_exporter_dir (listed in its .cassandra_config; a jar put there by other
# means stays). Off: those jars, that list (and the directory when it is then empty), the role's config (its
# header line) and the record of its parts read at start; nothing while a line a start reads still names the
# exporter (jmx_prometheus: its jar or its config, however reached, yours too; kept, it costs a warning), in:
#   - cassandra-env.sh and every JVM options file of the series: in a run that writes, as written on the node; in one
#     that only looks (--check, apply_config's preview), those kept as they are on the node (one not there yet as the
#     role is to write it), the others as the role is to write them (your templates and snippets, the extra options);
#   - the unit and its drop-ins (systemctl cat cassandra, else /etc, /run, /usr/lib and /lib/systemd/system), the
#     EnvironmentFiles they name, /etc/default/cassandra, the cassandra.in.sh files bin/cassandra may source
#     (CASSANDRA_INCLUDE of cassandra_service_environment, ~<cassandra_service_user>/.cassandra.in.sh,
#     /usr/share/cassandra, /usr/sbin, /usr/local/share/cassandra, /opt/cassandra), as they are on the node;
#   - cassandra_service_environment (the unit's environment cassandra_service writes, JVM_EXTRA_OPTS).
# Removed, they would stop Cassandra at its next start. A running Cassandra keeps the jar it opened until its
# restart (the one the JVM options file now gives is there).
# Skipped in check mode (--check, or check_mode applied to the role, as apply_config's preview does): this run
# only looks, else it writes the files
- name: Tell a run that writes from one that only looks
  ansible.builtin.command: "true"
  register: _cassandra_config_exporter_writes
  changed_when: false

- name: Find what the exporter's agent no longer needs
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        dir=$1 keep=$2 conf=$3 on=$4 files=$5 to_write=$6 if_missing=$7 user=$8 include=$9
        list="$dir/.cassandra_config"
        unused=$(
          if [ -f "$list" ]; then
            while IFS= read -r jar; do
              case "$jar" in ''|*/*) continue ;; esac
              if [ "$on" != on ] || [ "$jar" != "$keep" ]; then [ -f "$dir/$jar" ] && echo "jar|$dir/$jar"; fi
            done < "$list"
            [ "$on" = on ] || echo "list|$list"
          fi
          if [ "$on" != on ]; then
            grep -qs '^# Managed by Ansible (community.cassandra.cassandra_config)' "$conf/jmx_prometheus.yml" \
              && echo "config|$conf/jmx_prometheus.yml"
            [ -f "$conf/jmx_prometheus.at_start" ] && echo "record|$conf/jmx_prometheus.at_start"
          fi
        )
        [ -n "$unused" ] || exit 0
        # off, the next start may still load the role's jar or config: nothing removed while a line a start reads
        # names the exporter (jmx_prometheus: its jar or its config, however reached; kept, it costs a warning,
        # removed, Cassandra would not start)
        if [ "$on" != on ]; then
          # the unit and its drop-ins (systemd's own list, else where they can be), the EnvironmentFiles they name
          units=$(systemctl cat cassandra 2>/dev/null | sed -n 's|^# \(/.*\)$|\1|p')
          [ -n "$units" ] || units=$(ls -d /etc/systemd/system/cassandra.service /run/systemd/system/cassandra.service \
            /usr/lib/systemd/system/cassandra.service /lib/systemd/system/cassandra.service \
            /etc/systemd/system/cassandra.service.d/*.conf /run/systemd/system/cassandra.service.d/*.conf \
            /usr/lib/systemd/system/cassandra.service.d/*.conf /lib/systemd/system/cassandra.service.d/*.conf 2>/dev/null)
          env_files=$(for u in $units; do sed -n 's/^[[:space:]]*EnvironmentFile=-\{0,1\}//p' "$u" 2>/dev/null; done)
          # the cassandra.in.sh bin/cassandra sources (CASSANDRA_INCLUDE, else the first of these there), the
          # package's /etc/default/cassandra
          home=$(getent passwd "$user" 2>/dev/null | cut -d: -f6)
          start_files="$include ${home:+$home/.cassandra.in.sh} /usr/share/cassandra/cassandra.in.sh
            /usr/sbin/cassandra.in.sh /usr/local/share/cassandra/cassandra.in.sh /opt/cassandra/cassandra.in.sh
            /etc/default/cassandra $env_files"
          {
            for f in $files $units $start_files; do
              case "$f" in /*) path=$f ;; *) path=$conf/$f ;; esac
              grep -v '^[[:space:]]*#' "$path" 2>/dev/null | grep -qF jmx_prometheus || continue
              case " $(echo $units) " in
                *" $f "*) case "$f" in
                    *.service.d/*) kind=drop-in ;;
                    *) grep -qs '^# Managed by Ansible (community.cassandra.cassandra_service)' "$f" \
                         && kind=role-unit || kind=unit ;;
                  esac ;;
                *) case "$f" in /*) kind=file ;; *) kind=conf ;; esac ;;
              esac
              echo "kept|$f|$kind"
            done
            for f in $if_missing; do [ -e "$conf/$f" ] || echo "kept|$f|conf"; done
            for f in $to_write; do
              case "$f" in cassandra_service_environment) echo "kept|$f|role-unit" ;; *) echo "kept|$f|conf" ;; esac
            done
          } | awk '!seen[$0]++' | grep . && exit 0
        fi
        echo "$unused"
      - sh
      - "{{ cassandra_prometheus_exporter_dir | regex_replace('(?<=.)/+$', '') }}"
      - "{{ _cassandra_config_exporter_jar | basename }}"
      - "{{ cassandra_conf_dir | regex_replace('(?<=.)/+$', '') }}"
      - "{{ 'on' if cassandra_prometheus_exporter_enabled | bool else 'off' }}"
      - "{{ _on_node | join(' ') }}"
      - "{{ _to_write | join(' ') }}"
      - "{{ _if_missing | join(' ') }}"
      - "{{ cassandra_service_user | default(cassandra_user) }}"
      - "{{ _unit_env.CASSANDRA_INCLUDE | default('') }}"
  register: cassandra_config_exporter_unused
  changed_when: false
  check_mode: false  # reads only
  vars:
    # (as the script finds it: any line naming the exporter's jar or config, jmx_prometheus)
    _agent: jmx_prometheus
    # the series' cassandra-env.sh and JVM options files: all of them (a Java other than cassandra_java_version's
    # reads another)
    _jvm_files: >-
      {{ _cassandra_config_files[_cassandra_config_series]
         | select('match', '^(jvm[0-9]*-server[.]options|cassandra-env[.]sh)$') | list }}
    _writes: "{{ _cassandra_config_exporter_writes is not skipped }}"
    _unit_env: >-
      {{ cassandra_service_environment | default({}) if cassandra_service_environment | default({}) is mapping
         else {} }}
    # read on the node: in a run that writes, as written; in one that only looks, the ones kept as they are
    _on_node: "{{ _jvm_files if _writes | bool else _jvm_files | select('in', cassandra_config_keep_files) | list }}"
    # (the role's render, their lines but comments)
    _render_gives: >-
      {%- set out = [] -%}
      {%- for f in _jvm_files -%}
      {%-   if (_cassandra_config_new | default({}))[f] | default('') | regex_replace('(?m)^[ \t]*#.*$', '')
               is search(_agent) -%}
      {%-     set _ = out.append(f) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
    # what is to be written: only looking, the files the role writes as it renders them; the unit's environment
    # cassandra_service writes
    _to_write: >-
      {{ ([] if _writes | bool else _render_gives | reject('in', cassandra_config_keep_files) | list)
         + (['cassandra_service_environment'] if _unit_env.values() | map('string') | join(' ') is search(_agent)
            else []) }}
    # only looking: a file kept but not on the node yet, written as the role renders it
    _if_missing: "{{ [] if _writes | bool else _render_gives | select('in', cassandra_config_keep_files) | list }}"

- name: Say what the exporter's agent in a file still needs is left in place
  ansible.builtin.debug:
    msg: >-
      WARNING  {{ inventory_hostname }}: the Prometheus exporter is off, but {{ _kept | map('first') | join(', ') }}
      still {{ 'names' if _kept | length == 1 else 'name' }} its agent or config (jmx_prometheus): the role's jar and
      config are left in place, or Cassandra would not start. Remove or comment the agent's line in
      {% for source, kind in _kept %}{{ source }} ({{ _ways[kind] }}){{ ', ' if not loop.last else '' }}{% endfor %}.
      Or, if that agent is your own exporter and not the role's, delete
      {{ cassandra_prometheus_exporter_dir | regex_replace('(?<=.)/+$', '') }}/.cassandra_config so the role forgets
      its files (then remove the role's jar and the role's config by hand if wanted).
  vars:
    cassandra_output: true
    _kept: >-
      {{ cassandra_config_exporter_unused.stdout_lines | select('match', 'kept[|]')
         | map('regex_replace', '^kept[|]', '') | map('split', '|') | list }}
    _ways:
      conf: the file, or your copy or template, your snippet, the extra options
      role-unit: change cassandra_service_environment, then run cassandra_service
      drop-in: systemctl edit cassandra
      unit: systemctl edit --full cassandra
      file: the file
  when: _kept | length > 0

- name: Remove them
  ansible.builtin.file:
    path: "{{ item.split('|', 1)[1] }}"
    state: absent
  loop: "{{ cassandra_config_exporter_unused.stdout_lines | reject('match', 'kept[|]') | list }}"

- name: Forget the jars removed
  ansible.builtin.lineinfile:
    path: "{{ cassandra_prometheus_exporter_dir | regex_replace('(?<=.)/+$', '') }}/.cassandra_config"
    line: "{{ item.split('|', 1)[1] | basename }}"
    state: absent
  loop: "{{ cassandra_config_exporter_unused.stdout_lines | select('match', 'jar[|]') | list }}"
  when: cassandra_prometheus_exporter_enabled | bool

# (only the directory of the jars the role downloaded, once empty: one with other files stays)
- name: Remove the exporter's directory once empty
  ansible.builtin.command:
    argv: [rmdir, --ignore-fail-on-non-empty, "{{ cassandra_prometheus_exporter_dir }}"]
  changed_when: false
  when:
    - not cassandra_prometheus_exporter_enabled | bool
    - cassandra_config_exporter_unused.stdout_lines | select('match', 'list[|]') | list | length > 0
    - not ansible_check_mode

# for the report and apply_config (no restart for them: the running JVM keeps what it opened until its restart)
- name: Note what is removed
  ansible.builtin.set_fact:
    _cassandra_config_exporter_changes: "{{ _before + _removed }}"
    _cassandra_config_items: "{{ _cassandra_config_items | default([]) + _removed }}"
  vars:
    _before: "{{ _cassandra_config_exporter_changes | default([]) if cassandra_prometheus_exporter_enabled | bool else [] }}"
    _removed: >-
      {%- set out = [] -%}
      {%- for line in cassandra_config_exporter_unused.stdout_lines if line.split('|', 1)[0] not in ['list', 'kept'] -%}
      {#-   (by its name: a path is shown as where a link points, in apply_config's plan) -#}
      {%-   set _ = out.append({'item': line.split('|', 1)[1] | basename, 'kind': 'removed', 'restart': false,
                                'before': 'present', 'after': 'removed'}) -%}
      {%- endfor -%}
      {{ out }}
