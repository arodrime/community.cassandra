name: CI_roles
on:
  pull_request:
  workflow_dispatch:  # manual full run
  schedule:
    - cron: "0 6 * * *"

# A new push to a pull request cancels its runs still going
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  roles_matrix:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible_collections/community/cassandra
    outputs:
      matrix: ${{ steps.json-list.outputs.roles-to-test }}

    steps:

      - name: Check out code
        uses: actions/checkout@v6
        with:
          path: ansible_collections/community/cassandra

      # Pull requests test the roles they change; scheduled and manual runs test every role
      - name: Find changed files
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          list-files: shell
          filters: |
            global:
              - 'plugins/filter/**'
              - 'plugins/lookup/**'
              - 'plugins/module_utils/**'
              - 'plugins/plugin_utils/**'
              - 'meta/runtime.yml'
              - '.github/workflows/test-roles.yml'
              - 'galaxy.yml'
            roles:
              - 'roles/**'
            modules:
              - 'plugins/modules/*.py'

      # One job per role and docker scenario (a vagrant scenario needs a VM)
      - name: Generate role and scenario list
        env:
          TEST_ALL: ${{ github.event_name != 'pull_request' || steps.changes.outputs.global == 'true' }}
          ROLES: ${{ steps.changes.outputs.roles_files }}
          MODULES: ${{ steps.changes.outputs.modules_files }}
        run: |
          all=$(find roles -mindepth 1 -maxdepth 1 -type d -not -name cassandra_medusa | cut -d/ -f2)
          if [ "$TEST_ALL" = true ]; then
            selected="$all"
          else
            changed=$(for f in $ROLES; do echo "$f" | cut -d/ -f2; done | sort -u)
            # roles/cassandra_linux/tasks/main.yml -> cassandra_linux, plugins/modules/cassandra_flush.py -> cassandra_flush
            names=$(echo "$changed"; for f in $MODULES; do basename "$f" .py; done)
            selected=$(
              echo "$changed"
              # the roles whose tasks or scenarios use a changed role or module
              for n in $names; do grep -rlw "community.cassandra.$n" roles || true; done | cut -d/ -f2
            )
          fi
          for role in $(echo "$selected" | sort -u | { grep -Fx "$all" || true; }); do
            for m in roles/"$role"/molecule/*/molecule.yml; do
              if [ -f "$m" ] && grep -qE '^ +name: docker' "$m"; then
                echo "$role $(basename "$(dirname "$m")")"
              fi
            done
          done | jq -nRc '[inputs | split(" ") | {role: .[0], scenario: .[1]}]' > int_test_roles.json

      - name: Set output variable
        id: json-list
        run: |
          output=$(cat int_test_roles.json)
          echo "roles-to-test=$output" >> $GITHUB_OUTPUT
          echo "$output"

  roles:
    name: molecule ${{ matrix.molecule.role }} (${{ matrix.molecule.scenario }})
    runs-on: ubuntu-24.04
    needs: roles_matrix
    if: needs.roles_matrix.outputs.matrix != '[]'
    defaults:
      run:
        working-directory: ansible_collections/community/cassandra

    strategy:
      fail-fast: false  # a failing scenario must not stop the others
      matrix:
        python_version:
          - "3.12"
        molecule: ${{ fromJson(needs.roles_matrix.outputs.matrix) }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          path: ansible_collections/community/cassandra

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Uninstall existing ansible
        run: sudo apt remove ansible

      - name: Ensure wheel is installed
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: pip install wheel

      - name: Install requirements
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: |
            pip install molecule molecule-docker pytest-testinfra

      # Galaxy has short outages: fall back to the release on GitHub, and retry both for a few minutes
      - name: Install ansible.posix
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 5
          retry_wait_seconds: 60
          command: >-
            ansible-galaxy collection install ansible.posix -p ansible_collections/
            || ansible-galaxy collection install --no-deps git+https://github.com/ansible-collections/ansible.posix.git,2.2.2 -p ansible_collections/

      - name: Add molecule location to path
        run: echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Build the collection
        run: ansible-galaxy collection build

      - name: Rename the build artifact
        run: mv community-cassandra-*.tar.gz community-cassandra-latest.tar.gz

      # Its dependencies and community.docker (molecule's docker driver) come from Galaxy: 10 attempts, a minute apart.
      # --no-cache: else ansible-galaxy's own retry of a failed Galaxy request fails on the blank cache entry it left
      - name: Install collection
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 10
          retry_wait_seconds: 60
          # uses: steps don't get the job's working-directory
          command: cd ansible_collections/community/cassandra && ansible-galaxy collection install --no-cache community-cassandra-*.tar.gz 'community.docker:>=3.0.2'

      - name: Run molecule test for ${{ matrix.molecule.role }} (${{ matrix.molecule.scenario }})
        run: molecule test -s ${{ matrix.molecule.scenario }}
        working-directory: ansible_collections/community/cassandra/roles/${{ matrix.molecule.role }}
        env:
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: 1  # need for  TASK [Set async_dir for HOME env]
