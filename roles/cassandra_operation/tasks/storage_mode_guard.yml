---
# 5.0: refuse a restart that would take Cassandra back to an earlier storage_compatibility_mode than the one it
# runs (a cassandra.yaml edited back by hand, or an inventory behind the node: Cassandra starts with the earlier
# mode, or refuses to start on the sstables it wrote), or more than one step after it (CASSANDRA_4 to NONE). The mode
# it runs as storage_mode_read.yml reads it (over CQL, else the line it logged at its start, else as
# -e cassandra_storage_mode_running gives it); not known: refused only when its file may have changed since its
# start (the last check). Once for the nodes of the play (under serial, as update_java and the upgrade's rolling phase run their
# nodes, those of its batch: a node of a later batch is checked at its turn): one of them refused stops the run
# before any of them is restarted. _cassandra_storage_mode_written: true when the inventory's mode is
# written first (cassandra_config), else the file's mode is the one restarted with. _cassandra_storage_mode_hosts:
# the nodes the run restarts (default: those of the play); _cassandra_storage_mode_kept: true when the run writes the
# inventory's config without showing it (update_java): a node whose inventory has another mode than its file is
# refused (apply_config shows that change first). Read-only, under --check too.
- name: Read the mode Cassandra runs
  ansible.builtin.include_tasks: storage_mode_read.yml
  when: cassandra_version | default('') == '50x'

# -e cassandra_storage_mode_running=<node>:<mode>: the mode read by hand, taken only where nothing else tells it
# (over CQL, logged at its start, its cassandra.yaml unchanged since that start); one that says another mode than
# those, not a mode, or names no node of the run is refused, never left aside
- name: The mode given with -e is taken only where nothing else tells it
  ansible.builtin.assert:
    that: _wrong | length == 0
    fail_msg: >-
      {{ (['-e cassandra_storage_mode_running gives a mode this run cannot take (node:MODE, the inventory name of a'
           ~ ' node of this run, where the mode it runs is not read). Nothing was changed.']
          + _wrong
          + ['WAY OUT  Fix or drop these items of -e cassandra_storage_mode_running. Then run this again.']) | join(_nl) }}
    quiet: true
  run_once: true
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"
    _given: "{{ cassandra_storage_mode_running | default('') }}"
    _wrong: >-
      {%- set out = [] -%}
      {%- for h in _cassandra_storage_mode_hosts | default(ansible_play_hosts)
            if hostvars[h].cassandra_version | default('') == '50x' -%}
      {%-   set hv = hostvars[h] -%}
      {%-   set row = {'inventory_hostname': h,
                       'cassandra_storage_mode_read': hv.cassandra_storage_mode_read | default({}),
                       'cassandra_storage_mode_cql': hv.cassandra_storage_mode_cql | default({}),
                       'cassandra_storage_mode_running': _given} | community.cassandra.cassandra_storage_mode_given_wrong -%}
      {%-   if row -%}{%- set _ = out.append(row) -%}{%- endif -%}
      {%- endfor -%}
      {{ out + _given | community.cassandra.cassandra_storage_mode_given_unknown(ansible_play_hosts_all) }}
  when:
    - cassandra_version | default('') == '50x'
    - cassandra_storage_mode_running | default('') | length > 0

# update_java writes the inventory's config before each restart, without showing it: a storage_compatibility_mode
# change there would cross a step (NONE: the point of no return) unseen. apply_config shows it first, with its warning
- name: The run keeps the storage_compatibility_mode of each cassandra.yaml
  ansible.builtin.assert:
    that: _changed | length == 0
    fail_msg: >-
      {{ (['This run would change storage_compatibility_mode on ' ~ _changed | map(attribute='node') | join(', ')
           ~ ": it writes the inventory's config before each restart, without showing it. Nothing was changed."]
          + _changed | map(attribute='row') | list
          + ['WAY OUT  Run apply_config first (it shows the change and its warning). Then run this again.']) | join(_nl) }}
    quiet: true
  run_once: true
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"
    _changed: >-
      {%- set out = [] -%}
      {%- for h in _cassandra_storage_mode_hosts | default(ansible_play_hosts)
            if hostvars[h].cassandra_version | default('') == '50x' -%}
      {%-   set lines = hostvars[h].cassandra_storage_mode_read.stdout_lines | default([]) -%}
      {%-   set inventory = hostvars[h].cassandra_storage_compatibility_mode | default('NONE') | string -%}
      {%-   set file = lines | select('match', '^yaml=') | map('regex_replace', '^yaml=', '') | first | default('') -%}
      {%-   if 'yaml_read=yes' in lines and inventory | upper != (file or 'CASSANDRA_4') | upper -%}
      {%-     set _ = out.append({'node': h, 'row': '  ' ~ h ~ '  inventory ' ~ inventory ~ ', its cassandra.yaml '
                                                    ~ (file or 'CASSANDRA_4 (no such line)')}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  when:
    - cassandra_version | default('') == '50x'
    - _cassandra_storage_mode_kept | default(false) | bool

- name: The restarts keep the storage_compatibility_mode Cassandra runs, or a later one
  ansible.builtin.assert:
    that: _back | length == 0
    fail_msg: >-
      {{ (['A restart would take ' ~ _back | map(attribute='node') | join(', ') ~ ' back to an earlier'
           ~ ' storage_compatibility_mode than the one Cassandra runs (5.0 moves CASSANDRA_4, UPGRADING, NONE, never'
           ~ ' back). Nothing was changed.']
          + _back | map(attribute='row') | list
          + ['WAY OUT  ' ~ _back | map(attribute='way_out') | join(' ') ~ ' Then run this again.']) | join(_nl) }}
    quiet: true
  run_once: true
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"
    _written: "{{ _cassandra_storage_mode_written | default(false) | bool }}"
    _back: >-
      {%- set out = [] -%}
      {%- for h in _cassandra_storage_mode_hosts | default(ansible_play_hosts)
            if hostvars[h].cassandra_version | default('') == '50x' -%}
      {%-   set hv = hostvars[h] -%}
      {%-   set stop = {'inventory_hostname': h,
                        'cassandra_storage_mode_read': hv.cassandra_storage_mode_read | default({}),
                        'cassandra_storage_mode_cql': hv.cassandra_storage_mode_cql | default({}),
                        'cassandra_storage_mode_running': hv.cassandra_storage_mode_running | default('')}
                       | community.cassandra.cassandra_storage_mode_back_stop(
                           hv.cassandra_storage_compatibility_mode | default('NONE'), _written) -%}
      {%-   if stop -%}{%- set _ = out.append(stop) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: cassandra_version | default('') == '50x'

# ... nor more than one step after it (CASSANDRA_4 to NONE: its cassandra.yaml written ahead of it, by an apply_config
# cut before its restart, the role run alone or a hand edit): UPGRADING first. apply_config writes it from a
# CASSANDRA_4 line (cassandra_config moves the file one step at a time, never back); else by hand
- name: The restarts move the storage_compatibility_mode Cassandra runs one step at most
  ansible.builtin.assert:
    that: _jump | length == 0
    fail_msg: >-
      {{ (['A restart would take ' ~ _jump | map(attribute='node') | join(', ') ~ ' from CASSANDRA_4 straight to NONE'
           ~ ' (5.0 moves CASSANDRA_4, UPGRADING, NONE, one step at a time, each node restarted in UPGRADING before'
           ~ ' NONE). Nothing was changed.']
          + _jump | map(attribute='row') | list
          + ['WAY OUT  ' ~ _jump | map(attribute='way_out') | join(' ') ~ ' Then run this again.']) | join(_nl) }}
    quiet: true
  run_once: true
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"
    _written: "{{ _cassandra_storage_mode_written | default(false) | bool }}"
    _jump: >-
      {%- set out = [] -%}
      {%- for h in _cassandra_storage_mode_hosts | default(ansible_play_hosts)
            if hostvars[h].cassandra_version | default('') == '50x' -%}
      {%-   set hv = hostvars[h] -%}
      {%-   set stop = {'inventory_hostname': h,
                        'cassandra_storage_mode_read': hv.cassandra_storage_mode_read | default({}),
                        'cassandra_storage_mode_cql': hv.cassandra_storage_mode_cql | default({}),
                        'cassandra_storage_mode_running': hv.cassandra_storage_mode_running | default('')}
                       | community.cassandra.cassandra_storage_mode_jump_stop(
                           hv.cassandra_storage_compatibility_mode | default('NONE'), _written) -%}
      {%-   if stop -%}{%- set _ = out.append(stop) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}
  when: cassandra_version | default('') == '50x'

# ... nor, the mode it runs not read (no CQL answer, no line logged since its start) while its cassandra.yaml may have
# changed since that start (else the file tells it): it may run an earlier or a later mode (NONE too: from
# CASSANDRA_4, the point of no return in one step). Not when the file written is the one it started with (the record
# of that start: written back). Read it over CQL, or by hand and given with -e cassandra_storage_mode_running=<node>:<mode>
- name: The restarts move no node back while the mode it runs is not known
  ansible.builtin.assert:
    that: _unsure | length == 0
    fail_msg: >-
      {{ (['A restart could move ' ~ _unsure | map(attribute='node') | join(', ') ~ ' back, or two steps on.'
           ~ ' Nothing was changed.',
           'The storage_compatibility_mode Cassandra runs there could not be read.',
           '5.0 moves CASSANDRA_4, UPGRADING, NONE: one step at a time, never back.']
          + _unsure | map(attribute='rows') | flatten | list
          + ['WAY OUT  Read the mode Cassandra runs on each node, and give it to this run:',
             "  1. On each node, as the cluster's CQL user (null means CASSANDRA_4):",
             "     SELECT value FROM system_views.settings WHERE name = 'storage_compatibility_mode';"]
          + _unsure | map(attribute='where') | list
          + ['  2. Run this again with:',
             '     -e cassandra_storage_mode_running='
             ~ _unsure | map(attribute='node') | map('regex_replace', '$', ':<its mode>') | join(','),
             '  Or let this run read it over CQL:',
             '  1. Set cassandra_cql_username and cassandra_cql_password.',
             "  2. For a cqlsh outside root's PATH, set cassandra_cqlsh_command.",
             '  3. Run this again.']) | join(_nl) }}
    quiet: true
  run_once: true
  vars:
    cassandra_output: true  # a verdict: its msg as is (ops callback)
    _nl: "\n"
    _written: "{{ _cassandra_storage_mode_written | default(false) | bool }}"
    _unsure: >-
      {%- set out = [] -%}
      {%- for h in _cassandra_storage_mode_hosts | default(ansible_play_hosts)
            if hostvars[h].cassandra_version | default('') == '50x' -%}
      {%-   set hv = hostvars[h] -%}
      {%-   set read = {'inventory_hostname': h,
                        'cassandra_storage_mode_read': hv.cassandra_storage_mode_read | default({}),
                        'cassandra_storage_mode_cql': hv.cassandra_storage_mode_cql | default({}),
                        'cassandra_storage_mode_running': hv.cassandra_storage_mode_running | default(''),
                        'cassandra_rpc_address': hv.cassandra_rpc_address | default(''),
                        'cassandra_listen_address': hv.cassandra_listen_address | default(''),
                        'cassandra_native_transport_port': hv.cassandra_native_transport_port | default(9042)} -%}
      {%-   set rendered = (hv._cassandra_config_new | default({})).get('cassandra.yaml') if _written else none -%}
      {%-   set unsure = read | community.cassandra.cassandra_storage_mode_unsure(
                hv.cassandra_storage_compatibility_mode | default('NONE') if _written else none,
                rendered | hash('sha1') if rendered is not none else none) -%}
      {%-   if unsure -%}
      {%-     set _ = out.append({'node': h, 'rows': unsure.rows,
                                  'where': '     ' ~ h ~ '  cqlsh on ' ~ unsure.cql}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  when: cassandra_version | default('') == '50x'
