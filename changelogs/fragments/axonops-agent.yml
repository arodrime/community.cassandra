minor_changes:
  - cassandra_axonops role - new role. Installs the AxonOps agent (``axon-agent``) and the AxonOps Java agent package built for the node's Cassandra series (4.0, 4.1, 5.0) and Java, from AxonOps' repository, a mirror of it or package files (air-gapped), adds Cassandra's account and ``axonops`` to each other's group, writes ``/etc/axonops/axon-agent.yml`` and keeps ``axon-agent`` running. Never restarts Cassandra.
  - cassandra_config role - with ``cassandra_axonops_enabled`` true, sources ``/usr/share/axonops/axonops-jvm.options`` at the end of ``cassandra-env.sh`` (the AxonOps Java agent); refuses to write it when the file is missing, and refuses a second loader in the JVM options or the ``cassandra-env.sh`` snippet.
  - create_cluster, add_node, replace_node, add_datacenter and apply_config playbooks - apply the cassandra_axonops role when ``cassandra_axonops_enabled`` is true, before the config is written; ``apply_config`` shows the agent's changes in its plan (section "AxonOps agent", no restart for them) and restarts each node once for the ``cassandra-env.sh`` line.
  - upgrade and update_java playbooks - refuse, before any change and under ``--check`` too, the nodes with ``cassandra_axonops_enabled`` true (an upgrade or a Java change with the AxonOps agent is not supported yet).
  - cassandra_config role - with ``cassandra_axonops_enabled`` true, refuses a ``cassandra-env.sh`` template of ``cassandra_config_template_overrides`` that does not write ``{{ _cassandra_config_axonops_line }}`` or loads the agent itself, and a loader in ``JVM_OPTS`` or ``JVM_EXTRA_OPTS`` of ``cassandra_service_environment``.
  - apply_config playbook - compares the AxonOps repository the role adds (source, signing key, login; secrets never shown) and shows its changes in the plan.
  - cassandra_axonops role - the yum repository it adds is ``skip_if_unavailable`` (a mirror that fails stops no other dnf run; the role reads it first when it installs a package from it). Existing RedHat nodes get one "repository ... written" change from it.
