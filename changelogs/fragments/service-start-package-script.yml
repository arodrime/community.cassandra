---
minor_changes:
- "cassandra_service - ``cassandra_service_start: package_script`` starts Cassandra with the package's init script (no unit written nor removed, its state and boot setting managed; the playbooks drain the node before stopping it). It stops, with the way out, on a systemd without its SysV generator (``systemd-sysv-generator``). The default, ``unit``, is the role's systemd unit as before."
trivial:
- "import_cluster - a node started by the Cassandra package's init script as installed (``rpm -V`` or ``dpkg --verify``), with no drop-in of its own (``cassandra.service.d``), gets ``cassandra_service_start: package_script`` instead of ``cassandra_service_unit_manage: false``. Another unit, or a script modified or of no package, is compared with the roles' unit by the self-check, which stops with the way out (``-e import_keep_hand_edits=unit`` keeps it, or the roles' unit takes over at the next restart)."
