---
# Waits for the cleanups of a batch (cleanup_batch.yml) as long as they make
# progress: every cassandra_stream_check_interval seconds (sooner at first), reads nodetool
# compactionstats on the batch's nodes, prints the progress (bytes cleaned
# by the running Cleanup tasks, cassandra_stream_report), and fails only after
# cassandra_stream_stall_time seconds without progress. The checks
# (cleanup_check.yml) run in wait_loop.yml until every cleanup job has ended.
# Run once; expects
# cassandra_cleanup_jobs_started (the async jobs) and _cassandra_stream_state
# reset to {} before the include.
- name: Start following them
  ansible.builtin.set_fact:
    _cassandra_cleanup_status: going
  vars:
    cassandra_output_gap: true  # its progress lines, a block of their own (ops callback)

- name: Check the progress, then every {{ cassandra_stream_check_interval }}s
  ansible.builtin.include_tasks: wait_loop.yml
  vars:
    _cassandra_wait_check: cleanup_check.yml
    _cassandra_wait_going: "{{ _cassandra_cleanup_status == 'going' }}"

- name: Stop when a cleanup failed or stopped moving
  ansible.builtin.fail:
    msg: >-
      {{ _cassandra_cleanup_status | community.cassandra.cassandra_cleanup_failure(
           _cassandra_cleanup_jobs | default([]), refused=_cassandra_cleanup_refused | default([]),
           idle=_cassandra_stream_state.idle | default(0), stall_time=cassandra_stream_stall_time,
           last=_cassandra_stream_state | community.cassandra.cassandra_stream_report(what='cleanup',
                                                                                     status=_cassandra_cleanup_status)
                | first) }}
  when: _cassandra_cleanup_status in ['failed', 'stalled', 'jmx_refused']
