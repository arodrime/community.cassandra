---
# python3.11 (cqlsh, Medusa) is not the modules' Python: the first role of
# the node plays, so the next ones and the operator's own tasks run with the
# system python3 too
- name: Keep the modules on the system python3
  ansible.builtin.include_role:
    name: community.cassandra.cassandra_install
    tasks_from: python_interpreter.yml
  when: ansible_python_interpreter is not defined

- name: Check the install method
  ansible.builtin.assert:
    that: cassandra_install_method in ['repository', 'packages']
    fail_msg: >-
      cassandra_install_method is {{ cassandra_install_method }}:
      {{ 'not supported yet' if cassandra_install_method == 'tarball' else 'unknown' }}, use repository or packages.
    quiet: true

# Nothing to do where the repositories are managed by other means (a
# Satellite/Foreman, an image, a local mirror already configured)
- name: Configure the Cassandra repository
  ansible.builtin.include_tasks: repository.yml
  when:
    - cassandra_repository_manage | bool
    - cassandra_install_method == 'repository'

# Package files from a plain directory: no repository. The ones this role
# added earlier (e.g. on that directory, which breaks every dnf/apt call) go.
- name: Remove the Cassandra repositories (packages)
  ansible.builtin.include_tasks: no_repository.yml
  when:
    - cassandra_repository_manage | bool
    - cassandra_install_method == 'packages'

# What the step lines of a prepare say (cassandra_service prepare_lines.yml):
# off, packages (no repository), set (its source, keys or credentials written or
# changed now, the other series' removed; under --check also
# a Debian node without python3-debian yet, where it can't be compared) or ok
- name: Keep what was done with the repository
  ansible.builtin.set_fact:
    _cassandra_repository_outcome: >-
      {{ 'off' if not cassandra_repository_manage | bool
         else 'packages' if cassandra_install_method == 'packages'
         else 'set' if [_cassandra_repository_yum | default({}), _cassandra_repository_apt | default({}),
                        _cassandra_repository_old | default({}), _cassandra_repository_one_line | default({}),
                        _cassandra_repository_credentials | default({}),
                        _cassandra_repository_key_downloaded | default({}), _cassandra_repository_old_yum | default({}),
                        _cassandra_repository_debian_packages | default({}),
                        _cassandra_repository_credentials_removed | default({})] | select('changed') | list | length > 0
                   or (_cassandra_repository_python_debian | default({})).rc | default(0) != 0
         else 'ok' }}
