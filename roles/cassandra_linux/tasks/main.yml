---
# tasks file for cassandra_linux
- name: Include vars for OS family
  ansible.builtin.include_vars:
    file: "{{ ansible_facts['os_family'] }}.yml"

# Persistent settings (sysctl.conf, fstab, THP unit) are always written;
# applying them live is skipped in containers, where /proc/sys and /sys
# belong to the host kernel (read-only, or worse, the host's if privileged).
- name: Decide whether kernel settings are applied live
  ansible.builtin.set_fact:
    _cassandra_linux_live: >-
      {{ (ansible_facts['virtualization_type'] not in cassandra_linux_container_types)
         if cassandra_linux_apply_live | string | lower == 'auto' else cassandra_linux_apply_live | bool }}

- name: Snapshot the current OS settings (change report)
  ansible.builtin.include_tasks: snapshot.yml

- name: Disable Swap
  ansible.builtin.command: swapoff -a
  when:
    - _cassandra_linux_live
    - ansible_facts['swaptotal_mb'] > 0

- name: Remove swap partitions
  ansible.posix.mount:
    path: swap
    state: absent

# Absent on minimal images
- name: Directory of the kernel settings file
  ansible.builtin.file:
    path: "{{ cassandra_linux_sysctl_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Kernel settings for Cassandra
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: "{{ cassandra_linux_sysctl_file }}"
    sysctl_set: "{{ _cassandra_linux_live }}"
    reload: "{{ _cassandra_linux_live }}"
  loop: "{{ cassandra_linux_sysctl | dict2items }}"

# /etc/sysctl.conf is read last: a line left there by an earlier version of
# the role would win over the file above
- name: Remove the same settings from /etc/sysctl.conf
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    state: absent
    sysctl_file: /etc/sysctl.conf
    reload: false
  loop: "{{ cassandra_linux_sysctl | dict2items }}"
  when: cassandra_linux_sysctl_file != '/etc/sysctl.conf'

- name: Install time sync package
  ansible.builtin.package:
    name: "{{ _cassandra_timesync_pkg }}"
    state: present
  retries: 3
  register: cassandra_timesync_install

- name: Ensure timesync service starts
  ansible.builtin.service:
    name: "{{ _cassandra_timesync_service }}"
    enabled: yes
    state: started
  when: not (ansible_check_mode and cassandra_timesync_install is changed)  # not installed yet under --check
  register: cassandra_timesync_service_result
  tags:
  - molecule-idempotence-notest # Ubuntu 2404 timesyncd issue

# For what runs as cassandra outside the systemd unit (tools run by hand):
# the unit sets its own limits, systemd ignores these files
- name: Limits of the cassandra user
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (community.cassandra.cassandra_linux)
      {% for name, value in cassandra_linux_limits.items() %}
      cassandra - {{ name }} {{ value }}
      {% endfor %}
    dest: /etc/security/limits.d/cassandra.conf
    mode: "0644"

- name: Remove the block earlier versions of the role wrote to limits.conf
  ansible.builtin.blockinfile:
    path: /etc/security/limits.conf
    marker: "#<!-- {mark} ANSIBLE MANAGED BLOCK -->"
    state: absent

- name: Extra Limit for RH Derived Distros
  ansible.builtin.lineinfile:
    path: /etc/security/limits.d/90-nproc.conf
    regexp: "^\\* - nproc 32768"
    line: "* - nproc 32768"
    create: yes
  when: ansible_facts['os_family'] == "RedHat"
  register: cassandra_linux_nproc

- name: Ensure disable-thp service file exists
  ansible.builtin.copy:
    src: disable-thp.service
    dest: /etc/systemd/system/
    mode: "0644"
  register: thp

- name: Ensure service to disable THP is enabled and started
  ansible.builtin.systemd:
    name: disable-thp
    daemon_reload: true
    state: started
    enabled: true
  when:
    - _cassandra_linux_live
    - thp.changed
    - not ansible_check_mode  # the unit file only exists once really copied

# Resolve the data disk into an internal fact (_cassandra_data_disk, kernel
# name only) rather than overwriting cassandra_data_block_device: a role param
# outranks set_fact, so the user var can't be reliably rewritten in place.
# Auto-detected from cassandra_data_dir via findmnt + lsblk. Skipped, not guessed, if detection is inconclusive.
- name: Use the explicitly set cassandra_data_block_device
  ansible.builtin.set_fact:
    _cassandra_data_disk: "{{ cassandra_data_block_device | basename }}"
  when: cassandra_data_block_device != ""

- name: Auto-detect the data disk from cassandra_data_dir
  when:
    - cassandra_data_block_device == ""
    - cassandra_data_dir is defined
  block:
    - name: Find the device backing cassandra_data_dir
      ansible.builtin.command: "findmnt -n -o SOURCE --target {{ cassandra_data_dir }}"
      register: cassandra_data_findmnt
      changed_when: false
      failed_when: false

    - name: Resolve the parent kernel device (handles partitions - read-ahead/scheduler are tuned at the whole-disk level)
      ansible.builtin.command: "lsblk -no pkname {{ cassandra_data_findmnt.stdout | trim }}"
      register: cassandra_data_pkname
      changed_when: false
      failed_when: false
      when:
        - cassandra_data_findmnt.rc == 0
        - cassandra_data_findmnt.stdout | trim != ""

    - name: Set the data disk from the resolved device
      ansible.builtin.set_fact:
        _cassandra_data_disk: "{{ (cassandra_data_pkname.stdout | trim) if (cassandra_data_pkname.rc == 0 and cassandra_data_pkname.stdout | trim != '') else (cassandra_data_findmnt.stdout | trim | basename) }}"
      when:
        - cassandra_data_findmnt.rc == 0
        - cassandra_data_findmnt.stdout | trim != ""

- name: Confirm the data disk exists under sysfs (skip tuning rather than guess wrong)
  ansible.builtin.stat:
    path: "{{ cassandra_sysfs_block_root }}/{{ _cassandra_data_disk }}/queue"
  register: cassandra_data_disk_stat
  when: _cassandra_data_disk | default('') != ""

# Read-ahead is one of the worst default settings for Cassandra's read
# path (see the role README) - applied immediately via the sysfs queue/
# attributes, then persisted via udev since a raw sysfs write alone
# reverts on reboot.
- name: Disk tuning for the Cassandra data disk
  when:
    - _cassandra_data_disk | default('') != ""
    - cassandra_data_disk_stat.stat.exists
    - _cassandra_linux_live or cassandra_sysfs_block_root != '/sys/block'
  vars:
    cassandra_data_queue: "{{ cassandra_sysfs_block_root }}/{{ _cassandra_data_disk }}/queue"
  block:
    - name: Read the current read-ahead and IO scheduler (change report)
      ansible.builtin.shell: >-
        echo "$(cat {{ cassandra_data_queue }}/read_ahead_kb)|$(sed -n 's/.*\[\(.*\)\].*/\1/p' {{ cassandra_data_queue }}/scheduler)"
      register: cassandra_data_disk_before
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Set read-ahead on the Cassandra data device (immediate)
      ansible.builtin.copy:
        content: "{{ cassandra_data_readahead_kb }}"
        dest: "{{ cassandra_data_queue }}/read_ahead_kb"
        unsafe_writes: true
      changed_when: false

    - name: Set IO scheduler to none on the Cassandra data device (immediate)
      ansible.builtin.copy:
        content: "none"
        dest: "{{ cassandra_data_queue }}/scheduler"
        unsafe_writes: true
      changed_when: false
      failed_when: false  # some virtualized block devices only expose "none" already, or reject the switch

    - name: Ensure the udev rules dir exists (absent on minimal images without udev)
      ansible.builtin.file:
        path: /etc/udev/rules.d
        state: directory
        mode: "0755"

    - name: Persist read-ahead + IO scheduler via udev rule
      ansible.builtin.template:
        src: 60-cassandra-data-disk.rules.j2
        dest: /etc/udev/rules.d/60-cassandra-data-disk.rules
        mode: "0644"
      register: cassandra_data_disk_udev

- name: Report changes
  ansible.builtin.include_tasks: report.yml
