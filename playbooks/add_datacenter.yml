---
# Adds a datacenter to a running cluster:
#   ansible-playbook -i inventory community.cassandra.add_datacenter -e cassandra_hosts=my_cluster \
#     -e cassandra_new_nodes=my_cluster_dc3 -e cassandra_rebuild_source_dc=dc1 \
#     -e '{"cassandra_datacenter_replication": {"orders": 3, "system_auth": 3}}'
# Put the new nodes in the cluster's inventory group first, all declaring the
# new cassandra_dc. They join one at a time without streaming (auto_bootstrap:
# false), then the keyspaces in cassandra_datacenter_replication get that many
# replicas in the new datacenter (they must use NetworkTopologyStrategy), then
# each new node streams those keyspaces from cassandra_rebuild_source_dc
# (nodetool rebuild). Keyspaces not listed get no replica there. Afterwards,
# make one node per rack of the new datacenter a seed (change_seeds), and point the
# clients of that region at it. CQL credentials, when authentication is on:
# cassandra_cql_username/_password.
# One token per node (cassandra_num_tokens: 1): the new nodes without
# cassandra_initial_token get evenly spaced tokens, as create_cluster gives.
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight

- name: Check the new datacenter
  hosts: "{{ cassandra_new_nodes }}"
  gather_facts: false
  any_errors_fatal: true
  vars:
    _new_dc: "{{ hostvars[ansible_play_hosts_all[0]]._cassandra_preflight.cassandra_dc }}"
    _existing: "{{ groups[cassandra_hosts | default('cassandra')] | reject('in', ansible_play_hosts_all) | list }}"
    _p0: "{{ hostvars[ansible_play_hosts_all[0]]._cassandra_preflight }}"
    _single: "{{ _p0.cassandra_num_tokens | int == 1 }}"
  tasks:
    - name: Load the cassandra_service defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Read the ring from {{ _existing[0] | default('') }}
      community.cassandra.cassandra_status:
        down: 10000
      module_defaults:
        community.cassandra.cassandra_status: "{{ _cassandra_service_jmx }}"
      delegate_to: "{{ _existing[0] }}"
      run_once: true
      register: cassandra_new_dc_ring
      failed_when: cassandra_new_dc_ring.cluster_status is not defined

    - name: Read the keyspaces' replication
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: keyspaces.yml
        apply:
          run_once: true
      vars:
        cassandra_keyspaces_from: "{{ _existing[0] }}"
      run_once: true

    - name: Check the request
      ansible.builtin.assert:
        that:
          - _existing | length > 0
          - ansible_play_hosts_all | map('extract', hostvars, ['_cassandra_preflight', 'cassandra_dc']) | unique | list == [_new_dc]
          - _new_dc not in cassandra_new_dc_ring.cluster_status
          - cassandra_rebuild_source_dc | default('') in cassandra_new_dc_ring.cluster_status
          - not ansible_play_hosts_all | map('extract', hostvars, '_cassandra_service_is_seed') | select | list
        fail_msg: >-
          The new nodes must all declare the same, new cassandra_dc ({{ _new_dc }}{{ ', already in the ring'
          if _new_dc in cassandra_new_dc_ring.cluster_status else '' }}), none of them a seed yet (they don't
          bootstrap: make them seeds with change_seeds afterwards), and cassandra_rebuild_source_dc must be an
          existing datacenter ({{ cassandra_new_dc_ring.cluster_status | list | join(', ') }}).
        quiet: true
      run_once: true

    # Fails on a keyspace that is not NetworkTopologyStrategy or does not exist
    - name: Work out the replication changes
      ansible.builtin.set_fact:
        cassandra_new_dc_alter: >-
          {{ cassandra_keyspaces | community.cassandra.cassandra_replication_alter(_new_dc,
               add=cassandra_datacenter_replication | default({})) }}
      run_once: true

    # One token per node: evenly spaced, the datacenter's offset (100 * its index in the sorted names, or the next
    # free one); a new datacenter has no ranges yet, bisect and balanced are the same plan
    - name: Work out the tokens of the new nodes (one token per node)
      when: _single | bool
      run_once: true
      block:
        - name: Read the tokens of the ring
          community.cassandra.cassandra_ring:
          module_defaults:
            community.cassandra.cassandra_ring: >-
              {{ _cassandra_service_jmx | combine({'port': hostvars[_existing[0]].cassandra_jmx_port | default(_cassandra_service_jmx.port) | int}) }}
          delegate_to: "{{ _existing[0] }}"
          register: cassandra_new_dc_tokens_ring

        - name: Work out where the new nodes go
          ansible.builtin.set_fact:
            cassandra_new_dc_tokens: >-
              {{ cassandra_new_dc_tokens_ring.ring | community.cassandra.cassandra_token_add_plan(_new_tokens,
                   _p0.cassandra_partitioner, hosts={},
                   default_rf=(cassandra_datacenter_replication | default({}, true)).values() | list | max
                              | default(cassandra_token_rf | default(3), true)) }}
          vars:
            _new_tokens: >-
              {%- set l = [] -%}
              {%- for h in ansible_play_hosts_all -%}
              {%-   set p = hostvars[h]._cassandra_preflight -%}
              {%-   set _ = l.append({'name': h, 'address': p.ring_address, 'dc': p.cassandra_dc, 'rack': p.cassandra_rack,
                                      'token': p.cassandra_initial_token}) -%}
              {%- endfor -%}
              {{ l }}

        - name: Refuse tokens that can't be worked out
          ansible.builtin.assert:
            that: cassandra_new_dc_tokens.problems | length == 0
            fail_msg: "{{ cassandra_new_dc_tokens.problems }}"
            quiet: true

    - name: Confirm
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: confirm.yml
      vars:
        cassandra_confirm_prompt: |-
          add_datacenter will add {{ _new_dc }} ({{ ansible_play_hosts_all | join(', ') }}), then run:
          {% for statement in cassandra_new_dc_alter %}
            {{ statement }}
          {% endfor %}
          then stream each new node's data from {{ cassandra_rebuild_source_dc }} (this can take hours).
          {% if _single | bool %}
          One token per node, the new datacenter's ring:
          {% for line in cassandra_new_dc_tokens.lines | reject('match', '^\+ new node') %}
            {{ line }}
          {% endfor %}
          {% endif %}
          {{ _cassandra_session_warning }}

    # a new datacenter: balanced (no move) is the even ring, racks taken in turn
    - name: Give the new node its token
      ansible.builtin.set_fact:
        cassandra_initial_token: "{{ cassandra_new_dc_tokens[_kind][inventory_hostname] }}"
      when:
        - _single | bool
        - inventory_hostname in cassandra_new_dc_tokens[_kind]
      vars:
        _kind: >-
          {{ 'balanced' if cassandra_new_dc_tokens.moves | length == 0 and cassandra_new_dc_tokens.balanced_problems | length == 0
             and inventory_hostname in cassandra_new_dc_tokens.balanced else 'bisect' }}

- name: Start the new nodes, one at a time, without streaming
  hosts: "{{ cassandra_new_nodes }}"
  serial: 1
  any_errors_fatal: true
  tasks:
    # Computed first: a var can't be defined from itself (recursive template)
    - name: Add auto_bootstrap false to the settings
      ansible.builtin.set_fact:
        _cassandra_new_dc_settings: "{{ cassandra_extra_settings | default({}) | combine({'auto_bootstrap': false}) }}"

    - name: Add this node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: add
        cassandra_service_node_checks_before: false
        cassandra_extra_settings: "{{ _cassandra_new_dc_settings }}"
        # no bootstrap (auto_bootstrap false): the node joins in minutes
        _cassandra_join_then: wait until it is UN in nodetool status.
        _cassandra_join_over: run add_datacenter again.
        _done: "{{ ansible_play_hosts_all.index(inventory_hostname) }}"
        cassandra_service_expected_before: >-
          {{ groups[cassandra_hosts | default('cassandra')] | length - ansible_play_hosts_all | length + _done | int }}
        cassandra_service_expected_after: >-
          {{ groups[cassandra_hosts | default('cassandra')] | length - ansible_play_hosts_all | length + _done | int + 1 }}

- name: Give the datacenter its replicas and data
  hosts: "{{ cassandra_new_nodes }}"
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Load the cassandra_service defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Change the keyspaces' replication
      community.cassandra.cassandra_cqlsh:
        execute: "{{ item }}"
        cqlsh_host: >-
          {{ cassandra_rpc_address | default('')
             if cassandra_rpc_address | default('') not in ['', 'localhost', '0.0.0.0'] else '127.0.0.1' }}
        username: "{{ cassandra_cql_username | default(omit, true) }}"
        password: "{{ cassandra_cql_password | default(omit, true) }}"
      loop: "{{ cassandra_new_dc_alter }}"
      run_once: true

- name: Stream each new node's data, one at a time
  hosts: "{{ cassandra_new_nodes }}"
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Load the cassandra_service defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    # Only the keyspaces that now have replicas here: a plain rebuild also
    # tries the SimpleStrategy ones (system_traces...) and fails to find sources
    - name: Stream this node's data from {{ cassandra_rebuild_source_dc }}
      ansible.builtin.shell: >-
        set -e;
        {% for ks in _keyspaces %}
        {{ _cassandra_service_nodetool }} rebuild --keyspace {{ ks | quote }} -- {{ cassandra_rebuild_source_dc | quote }};
        {% endfor %}
      vars:
        _keyspaces: >-
          {{ cassandra_datacenter_replication | default({}) | dict2items | selectattr('value', 'gt', 0)
             | map(attribute='key') | list }}
      async: "{{ cassandra_rebuild_timeout | default(_cassandra_stream_async) }}"
      poll: 0
      register: cassandra_rebuild_job
      changed_when: true
      no_log: "{{ cassandra_jmx_password | length > 0 }}"

    - name: Start following the rebuild
      ansible.builtin.set_fact:
        _cassandra_stream_state: {}

    - name: Follow the rebuild
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: stream_wait.yml
      when: not ansible_check_mode  # the rebuild did not run
      vars:
        _cassandra_stream_what: rebuild
        _cassandra_stream_operations: [Rebuild]
        _cassandra_stream_from: ["{{ inventory_hostname }}"]
        _cassandra_stream_job: {jid: "{{ cassandra_rebuild_job.ansible_job_id }}", host: "{{ inventory_hostname }}"}
        _cassandra_stream_advice: >-
          if nodetool netstats on it still shows streams, wait for the rebuild to end (nodetool netstats), then run
          nodetool rebuild again for the keyspaces it did not finish, if any (see its system.log).

- name: Finish the datacenter
  hosts: "{{ cassandra_new_nodes }}"
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Load the cassandra_service defaults
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: defaults.yml
        public: true

    - name: Write the config without auto_bootstrap (read at the first start only)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
      vars:
        cassandra_config_confirm: false
        _cassandra_config_no_restart_warning: true

    - name: Check the cluster
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: cluster_health.yml
        apply:
          run_once: true
      run_once: true

    - name: Say what is left to do
      ansible.builtin.debug:
        msg: >-
          {{ hostvars[ansible_play_hosts_all[0]]._cassandra_preflight.cassandra_dc }} is up with its data. Make one node
          per rack of it a seed (cassandra_seeds, then change_seeds), and point that region's clients at it.
      run_once: true
