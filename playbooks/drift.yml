---
# Show how far the cluster is from stock, changing nothing.
#
#   ansible-playbook community.cassandra.drift
#
# IN SYNC: apply_config's compare, nothing changed. WORTH A LOOK, BETWEEN
# NODES and FIXES (the values to give every node one value of a setting, and
# the grep that finds where the inventory sets it), OFF STOCK: the settings
# off the collection's default. The screen sums them up (-e
# drift_details=true: every setting); all in reports/<cluster>/drift-*.txt.
# -e drift_nodes=false: the inventory alone, no node contacted.
#
# Options and defaults: ansible-playbook community.cassandra.help -e help_topic=drift
- name: Check the cluster's group
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
  tasks:
    - name: Check the cluster's group
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: hosts_check.yml
      tags: [always]  # its variables check under --tags too

# The inventory as Ansible resolves it for each node, read before apply_config's compare sets facts of its own (a
# fact named as a variable would hide the inventory's)
- name: Read the inventory
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
    ansible_connection: local  # never an inventory's ssh to localhost
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _cluster: "{{ lookup('community.cassandra.cassandra_hosts') }}"
    _nodes: "{{ query('community.cassandra.cassandra_nodes') }}"
  tasks:
    - name: Note when the run started
      ansible.builtin.set_fact:
        _cassandra_drift_start: "{{ now().timestamp() | int }}"

    - name: Say which cluster the run is on
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: cluster_banner.yml

    # (Ansible's values: where each is set is its precedence, never modelled here)
    - name: Read the inventory
      ansible.builtin.set_fact:
        _cassandra_drift_values: "{{ hostvars | community.cassandra.cassandra_drift_values(_nodes) }}"
      no_log: true  # the values hold secrets (shown masked in the lines below)

    # each node's DC and rack (the node lists say "dc1", "dc1/rack2")
    - name: Note each node's DC and rack
      ansible.builtin.set_fact:
        _cassandra_drift_info: >-
          {%- set out = [] -%}
          {%- for h in _nodes -%}
          {%-   set v = _cassandra_drift_values[h] | default({}) -%}
          {%-   set _ = out.append({'name': h, 'dc': v.cassandra_dc | default('dc1'),
                                    'rack': v.cassandra_rack | default('rack1')}) -%}
          {%- endfor -%}
          {{ out }}

# apply_config's compare, as a real run does it before its plan: read only (no question, nothing written, no stop)
- name: Compare the nodes with the inventory
  ansible.builtin.import_playbook: community.cassandra.apply_config
  when: drift_nodes | default(true) | bool
  vars:
    _cassandra_apply_config_compare_only: true
    # (-e drift_nodes=false: the preflight's plays on no host, the compare's tasks skipped)
    _cassandra_preflight_skip: "{{ not drift_nodes | default(true) | bool }}"

- name: Drift
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_become: false  # an inventory ansible_become beats the become keyword
    ansible_connection: local  # never an inventory's ssh to localhost
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _cluster: "{{ lookup('community.cassandra.cassandra_hosts') }}"
    _nodes: "{{ query('community.cassandra.cassandra_nodes') }}"
    _compared: "{{ drift_nodes | default(true) | bool }}"
    _args:
      inventory: "{{ ansible_inventory_sources | default([]) }}"
      default_inventory: "{{ lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST') }}"
      hosts: "{{ cassandra_hosts | default('') }}"
      cwd: "{{ lookup('ansible.builtin.env', 'PWD') }}"
    _info: "{{ _cassandra_drift_info }}"
    # what the defaults made of facts need, read by the compare (none: those defaults not known here)
    _facts: >-
      {%- set out = {} -%}
      {%- for h in _nodes if hostvars[h].ansible_facts.os_family | default('') -%}
      {%-   set _ = out.update({h: {'os_family': hostvars[h].ansible_facts.os_family,
                                    'hostname': hostvars[h].ansible_facts.hostname | default(h)}}) -%}
      {%- endfor -%}
      {{ out }}
    # the compare's view of each node (apply_config's facts; none when the compare did not run)
    _sync: >-
      {%- set out = [] -%}
      {%- for h in _nodes -%}
      {%-   set v = hostvars[h] -%}
      {%-   set _ = out.append({'name': h, 'compared': v.cassandra_apply_config_todo is defined,
                                'todo': v.cassandra_apply_config_todo | default(false) | bool,
                                'then': v.cassandra_apply_config_then | default('none'),
                                'files': v._cassandra_config_items | default([]) | map(attribute='item', default='')
                                         | select | map('basename') | unique | list,
                                'os': v.cassandra_apply_config_os | default([]) | map(attribute='item', default='')
                                      | select | list,
                                'medusa': v.cassandra_apply_config_medusa | default([]),
                                'extras': v.cassandra_apply_config_extras | default([]),
                                'restart': v.cassandra_apply_config_restart_items | default([]),
                                'unit': (['cassandra.service'] if v.cassandra_service_unit_compare | default({}) is changed
                                         else [])
                                        + (['zz-ansible-environment.conf']
                                           if v.cassandra_service_dropin_compare | default({}) is changed else [])}) -%}
      {%- endfor -%}
      {{ out }}
    _stops: >-
      {{ _nodes | map('extract', hostvars) | selectattr('_cassandra_apply_config_stops', 'defined')
         | map(attribute='_cassandra_apply_config_stops') | first | default([]) }}
    _command: "{{ 'apply_config' | community.cassandra.cassandra_command(extra=['--check', '--diff'], **_args) }}"
    _dash: "\u2014"
    _verdict: >-
      {%- set c = _cassandra_drift_report.counts -%}
      {%- set out = [c.stock ~ (' setting' if c.stock == 1 else ' settings') ~ ' off stock' if c.stock else 'at stock'] -%}
      {%- set _ = out.append(c.between ~ (' differs' if c.between == 1 else ' differ') ~ ' between nodes' if c.between
                             else 'nodes alike') -%}
      {%- if c.kept -%}{%- set _ = out.append(c.kept ~ (' file' if c.kept == 1 else ' files') ~ ' kept by hand') -%}{%- endif -%}
      {%- set _ = out.append(_sync | community.cassandra.cassandra_drift_verdict(_stops, _compared)) -%}
      {{ out | join(', ') }}
  tasks:
    - name: Work out the drift
      ansible.builtin.set_fact:
        # laid out at the terminal's width on the screen, at the report's in its file
        _cassandra_drift_screen: >-
          {{ _cassandra_drift_values | community.cassandra.cassandra_drift_sections(
               _info, _cluster, _facts, width='terminal', **_args) }}
        _cassandra_drift_report: >-
          {{ _cassandra_drift_values | community.cassandra.cassandra_drift_sections(
               _info, _cluster, _facts, **_args) }}
        _cassandra_drift_in_sync: >-
          {{ _sync | community.cassandra.cassandra_drift_sync(_stops, _command) if _compared | bool
             else ['NOT CHECKED ' ~ _dash ~ ' the nodes (-e drift_nodes=false: the inventory alone, no node contacted)'] }}
      no_log: true  # (its inputs hold secrets; its lines mask them, shown next)

    # the verdict first, then each section summed up (-e drift_details=true: every setting, as in the report)
    - name: Show the drift
      ansible.builtin.debug:
        msg: >-
          {{ _cassandra_drift_screen | community.cassandra.cassandra_drift_screen(
               _sync, _stops, _command, _cluster, compared=_compared, details=drift_details | default(false)) }}
      vars:
        cassandra_output: true  # its lines as they are (ops callback)

    # the report on the controller (run_report.yml): reports/<cluster>/drift-<YYYY-MM-DD-HHMMSS>.txt
    - name: Write the report
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_operation
        tasks_from: run_report.yml
      vars:
        _cassandra_run_report_operation: drift
        _cassandra_run_report_started: "{{ _cassandra_drift_start }}"
        _cassandra_run_report_status: "{{ _verdict }}"
        _cassandra_run_report_run: >-
          read only, nothing was changed{{ '' if _compared | bool else ' (-e drift_nodes=false: no node contacted)' }}
        _cassandra_run_report_sections:
          - lines: "{{ _cassandra_drift_report.stock }}"
          - lines: "{{ _cassandra_drift_report.between }}"
          - lines: "{{ _cassandra_drift_in_sync }}"
          - lines: "{{ _cassandra_drift_report.look }}"
          - lines: "{{ _cassandra_drift_report.fixes }}"
