---
# Applies the inventory's config to a running cluster. The settings that differ
# are shown first, each with the inventory's value and the nodes already on it,
# then the value of each node to change, and what each node gets (--check: the
# settings in the recap at the end); the whole run is confirmed once; then the
# nodes are done one at a time: cluster checked, config written, node drained and restarted,
# cluster checked again. Only the nodes whose config changes, or whose running
# Cassandra did not start with its config files or its systemd unit (written by
# cassandra_config or cassandra_service, which do not restart, or by a run
# stopped before the restart), are touched. Cassandra reads its config at
# start: a node whose files only need another owner, group or mode is not
# restarted (the JMX password file is read at each login: its new owner and
# mode apply at once). A node where Cassandra failed (e.g. it could not read
# its config) is started once its config is written; one stopped on purpose
# gets its config and stays stopped. The health checks let these nodes be
# down, except before a restart: any other node down stops the run.
# Stops at the first problem.
#   ansible-playbook -i inventory community.cassandra.apply_config
# Without -e cassandra_hosts=<group>: the cluster the CASSANDRA_CLUSTER environment
# variable names (its group or its cassandra_cluster_name), else the group
# cassandra, else the inventory's cluster group (lookup
# community.cassandra.cassandra_hosts).
# Root on the nodes (sudo): the playbook asks for it itself, no -b needed.
# Resume an interrupted run (skips the nodes already done): add -e cassandra_rolling_resume=true
- name: Preflight
  ansible.builtin.import_playbook: community.cassandra.preflight
  vars:
    _cassandra_preflight_seeds_down_ok: true  # a seed of this run not running: written, maybe started

- name: Find what each node needs
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Say what the run does
      ansible.builtin.debug:
        msg: "{{ 'compare_config' | community.cassandra.cassandra_phase(count=ansible_play_hosts_all | length) }}"
      run_once: true
      vars:
        cassandra_output: true  # a phase line (ops callback)
        cassandra_output_gap: true  # a block of its own

    - name: Note when the run started
      ansible.builtin.set_fact:
        _cassandra_apply_config_start: "{{ now().timestamp() | int }}"
      run_once: true

    # Check mode: shows the diffs, writes nothing
    - name: Compare the config
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_config
        public: true  # cassandra_conf_dir for the next task
        apply:
          check_mode: true
      vars:
        cassandra_config_confirm: false
        cassandra_config_reload_seeds: false
        cassandra_change_report_dir: ""  # the real run reports
        _cassandra_config_no_restart_warning: true
        # the changes once: in the plan of a real run (before its question), in the recap under --check
        _cassandra_config_quiet: true
        _cassandra_change_report_quiet: true

    - name: Look for a restart still pending
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: config_pending.yml

    # no record of the files it started with: an edit made since may be applied or not
    - name: Say which files changed since Cassandra started, with no record of the ones it started with
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ cassandra_config_unknown_files | join(', ') }} written after Cassandra started
          (not by the roles, which keep a record of the files it starts with): not restarted for them. If they
          changed a setting, run rolling_restart to apply it.
      when: cassandra_config_unknown_files | length > 0

    # its unit not running: a JVM started another way still runs the config it read
    - name: Look for a Cassandra JVM the unit did not start
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: jvm_started.yml
      when: not _cassandra_preflight_running | default(true) | bool

    # failed (it could not start, or crashed) or restarting after a failure: it was to run; else stopped on purpose
    - name: Read the state of its unit
      ansible.builtin.systemd_service:
        name: cassandra
      register: cassandra_apply_config_unit
      failed_when: false  # no unit: not started by it
      when: not _cassandra_preflight_running | default(true) | bool

    - name: Note what this node needs
      ansible.builtin.set_fact:
        cassandra_apply_config_todo: "{{ _files | length > 0 or (_perms + _dirs) | length > 0 or _pending | bool }}"
        # then, Cassandra running: restart (new settings or a restart pending), none (an owner or mode alone:
        # read at start); not running: start (its unit failed: it could not start, e.g. its config unreadable;
        # or the node a resumed run stopped), write (stopped on purpose: left stopped)
        cassandra_apply_config_then: >-
          {{ ('restart' if _files | length > 0 or _pending | bool else 'none') if _running | bool
             else 'start' if _unit_failed | bool or _pending | bool else 'write' }}
        cassandra_apply_config_pending: "{{ _pending }}"
        # said under the node's outcome, in the plan and the recap (whatever the outcome)
        cassandra_apply_config_notes: >-
          {{ (['restart pending (' ~ cassandra_config_newer_files | join(', ') ~ ' changed since the running Cassandra started)']
              if _pending | bool else [])
             + _cassandra_config_dir_notes | default([]) }}
      vars:
        _files: "{{ _cassandra_config_changes | default([]) }}"
        _perms: "{{ _cassandra_config_perm_changes | default([]) | map(attribute='item') | map('regex_replace', ' [(].*$', '') | map('basename') | list }}"
        _dirs: "{{ _cassandra_config_dir_changes | default([]) | map(attribute='item') | map('regex_replace', ' [(].*$', '') | list }}"
        _running: "{{ _cassandra_preflight_running | default(true) | bool or cassandra_jvm.pid is defined }}"
        # a node not running reads its files when it starts: pending only under a resumed run, taken for the
        # node the interrupted run stopped (then started)
        _pending: >-
          {{ cassandra_config_restart_pending | bool and (_running | bool or cassandra_rolling_resume | default(false) | bool) }}
        _unit: "{{ cassandra_apply_config_unit.status | default({}) }}"
        # failed, or restarting after a failure; not a stop that ended failed (SIGTERM's 143 with no
        # SuccessExitStatus=143 in a unit kept as it was, a timeout: a stop's, or a forking unit's start)
        _unit_failed: >-
          {{ _unit.ActiveState | default('') in ['failed', 'activating']
             and _unit.Result | default('') != 'timeout' and _unit.ExecMainStatus | default('') | string != '143' }}

    # a restart waits for every other node up (cluster health): a node not running that this run leaves
    # down, or starts after the restart (nodes go in inventory order), would stop it halfway
    - name: Refuse restarts while a node is not running
      ansible.builtin.assert:
        that: _down | length == 0
        fail_msg: >-
          {{ _down | join(', ') }}: Cassandra not running, and {{ _restart | join(', ') }} would be restarted, which needs
          every other node up. Nothing was changed. Apply the config there first (--limit {{ _down | join(',') }}) and
          start {{ 'them' if _down | length > 1 else 'it' }} if stopped on purpose, or, if an interrupted run stopped
          {{ 'them' if _down | length > 1 else 'it' }}, resume it (-e cassandra_rolling_resume=true); then run again.
        quiet: true
      run_once: true
      vars:
        _restart: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts if hostvars[h].cassandra_apply_config_todo | bool
                                            and hostvars[h].cassandra_apply_config_then == 'restart' -%}
          {%-   set _ = out.append(h) -%}
          {%- endfor -%}
          {{ out }}
        _down: >-
          {%- set out = [] -%}
          {%- if _restart -%}
          {%-   set first = ansible_play_hosts.index(_restart[0]) -%}
          {%-   for h in ansible_play_hosts -%}
          {%-     set v = hostvars[h] -%}
          {%-     if v.cassandra_apply_config_then == 'write'
                     or (v.cassandra_apply_config_then == 'start'
                         and (not v.cassandra_apply_config_todo | bool or ansible_play_hosts.index(h) > first)) -%}
          {%-       set _ = out.append(h) -%}
          {%-     endif -%}
          {%-   endfor -%}
          {%- endif -%}
          {{ out }}

    # every node's value of the settings that differ somewhere: the live files that differ on a node, read on
    # each one (only shown masked)
    - name: Read the live files that differ on a node
      ansible.builtin.slurp:
        src: "{{ cassandra_conf_dir }}/{{ cassandra_apply_config_file }}"
      loop: >-
        {{ ansible_play_hosts | map('extract', hostvars) | map(attribute='_cassandra_config_items', default=[]) | flatten
           | selectattr('diff', 'defined') | map(attribute='item') | map('basename') | unique | list }}
      loop_control:
        loop_var: cassandra_apply_config_file
      register: cassandra_apply_config_live
      failed_when: false  # not on this node: no value of its own shown
      no_log: true  # passwords
      check_mode: false  # reads only

    # setting-centric, the nodes grouped: in the plan of a real run (before its question), in the recap under --check
    - name: Put the settings that differ side by side
      ansible.builtin.set_fact:
        cassandra_apply_config_diff: "{{ _nodes | community.cassandra.cassandra_apply_config_diff }}"
      run_once: true
      vars:
        _nodes: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts -%}
          {%-   set v = hostvars[h] -%}
          {%-   set _ = out.append({'name': h, 'items': v._cassandra_config_items | default([]),
                                    'live': v.cassandra_apply_config_live.results | default([]),
                                    'stats': v.cassandra_config_live_stat.results | default([]),
                                    'dir_stats': v.cassandra_config_dir_stat.results | default([])}) -%}
          {%- endfor -%}
          {{ out }}

    - name: Group the nodes to do
      ansible.builtin.group_by:
        key: "cassandra_apply_config_{{ cassandra_apply_config_todo | bool }}"
      changed_when: false

    - name: Nothing to do on this node
      ansible.builtin.set_fact:
        cassandra_op_result: nothing to apply
      when: not cassandra_apply_config_todo | bool

    - name: Show the plan and confirm the run
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: screen.yml
      when: _todo | length > 0
      vars:
        _nodes: >-
          {%- set out = [] -%}
          {%- for h in ansible_play_hosts -%}
          {%-   set v = hostvars[h] -%}
          {%-   set _ = out.append({'name': h, 'todo': v.cassandra_apply_config_todo | default(false) | bool,
                                    'then': v.cassandra_apply_config_then | default(''),
                                    'result': v.cassandra_op_result | default('nothing to apply'),
                                    'notes': v.cassandra_apply_config_notes | default([])}) -%}
          {%- endfor -%}
          {{ out }}
        cassandra_screen_question: "Apply the config on {{ _todo | community.cassandra.cassandra_node_list }}?"
        cassandra_screen:
          operation: apply_config
          summary: "{{ 'would apply' if ansible_check_mode else 'apply' }} the config on {{ _todo | community.cassandra.cassandra_node_list }}"
          intro:
            - >-
              {{ 'A real run would write each node in turn, then restart or start it as said below; the settings
                 that differ are in the recap at the end.'
                 if ansible_check_mode else
                 'Writes the config one node at a time, then restarts or starts it as said below.' }}
          # a real run: the settings that differ before its question (--check: in the recap, no question)
          sections:
            - "{{ [] if ansible_check_mode else [{'pre': cassandra_apply_config_diff | default([])}] }}"
            - - pre: "{{ _nodes | community.cassandra.cassandra_apply_config_outcomes(plan=true) }}"
  vars:
    _todo: >-
      {%- set out = [] -%}{%- for h in ansible_play_hosts if hostvars[h].cassandra_apply_config_todo | default(false) | bool -%}{%-          set _ = out.append(h) -%}{%- endfor -%}{{ out }}

- name: Set up the progress file
  hosts: "{{ query('community.cassandra.cassandra_nodes') | select('in', groups['cassandra_apply_config_True'] | default([])) | list }}"
  gather_facts: false
  become: true
  vars:
    cassandra_service_node_action: apply_config
  tasks:
    - name: Set up the progress file
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: progress.yml

- name: Apply the config, one node at a time
  hosts: "{{ query('community.cassandra.cassandra_nodes') | select('in', groups['cassandra_apply_config_True'] | default([])) | list }}"
  serial: 1
  any_errors_fatal: true
  become: true
  tasks:
    - name: Apply the config on this node
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_service
        tasks_from: node_operation.yml
      vars:
        cassandra_service_node_action: apply_config
        # the other nodes where Cassandra is not running may stay down while a node is written without
        # being taken down (none, start, write): those started later in the run (or not to do), those left
        # stopped; a restart waits for every other node up (under --check, the nodes before it were not started)
        cassandra_service_health_down_ok: >-
          {%- set out = [] -%}
          {%- set nodes = query('community.cassandra.cassandra_nodes') -%}
          {%- for h in nodes if h != inventory_hostname and hostvars[h].cassandra_apply_config_then is defined -%}
          {%-   set v = hostvars[h] -%}
          {#-   a start node down until its turn (or not to do: left down); a write node down for good -#}
          {%-   set later_start = v.cassandra_apply_config_then == 'start'
                                  and (nodes.index(h) > nodes.index(inventory_hostname) or not v.cassandra_apply_config_todo | bool
                                       or ansible_check_mode) -%}
          {%-   if later_start or (v.cassandra_apply_config_then == 'write' and cassandra_apply_config_then != 'restart') -%}
          {%-     set _ = out.append(v._cassandra_preflight.ring_address) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ out if cassandra_apply_config_then != 'restart' or ansible_check_mode else [] }}
        _cassandra_health_no_wait: "{{ cassandra_service_health_down_ok | length > 0 }}"  # they will not come back

# What each node got; under --check, first the settings that differ (secrets masked), owner/mode changes included
- name: Summary
  hosts: "{{ query('community.cassandra.cassandra_nodes') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Print the changes
      ansible.builtin.debug:
        msg: >-
          {{ _nodes | community.cassandra.cassandra_apply_config_recap(check=ansible_check_mode, cluster=cassandra_cluster_name | default(''),
                                                                        seconds=(now().timestamp() | int - _start | int) if _start else none,
                                                                        diff=_diff) }}
      run_once: true
      vars:
        cassandra_output: true
        cassandra_output_gap: true  # a block of its own (ops callback)
        _start: >-
          {{ query('community.cassandra.cassandra_nodes') | map('extract', hostvars) | selectattr('_cassandra_apply_config_start', 'defined')
             | map(attribute='_cassandra_apply_config_start') | first | default('') }}
        # the settings that differ (said under --check only: a real run showed them before its question)
        _diff: >-
          {{ query('community.cassandra.cassandra_nodes') | map('extract', hostvars) | selectattr('cassandra_apply_config_diff', 'defined')
             | map(attribute='cassandra_apply_config_diff') | first | default([]) }}
        _nodes: >-
          {%- set out = [] -%}
          {%- for h in query('community.cassandra.cassandra_nodes') -%}
          {%-   set v = hostvars[h] -%}
          {%-   set _ = out.append({'name': h, 'todo': v.cassandra_apply_config_todo | default(false) | bool,
                                    'done': v.cassandra_op_done | default(false), 'then': v.cassandra_apply_config_then | default(''),
                                    'result': v.cassandra_op_result | default('not reached' if h in ansible_play_hosts_all
                                                                                else 'not in this run (--limit)'),
                                    'notes': v.cassandra_apply_config_notes | default([])}) -%}
          {%- endfor -%}
          {{ out }}
