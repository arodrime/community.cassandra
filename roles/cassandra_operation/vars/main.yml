---
# Private to the collection (a leading underscore): computed from the public settings in
# defaults/main.yml or fixed. Role vars, so an inventory or play variable of the same name does not
# override them by accident.

_cassandra_service_jmx: >-
  {{ {'port': cassandra_jmx_port | default(7199) | int}
     | combine({'username': cassandra_jmx_username} if cassandra_jmx_username else {})
     | combine({'password_file': cassandra_jmx_password_file} if cassandra_jmx_password_file
               else ({'password': cassandra_jmx_password} if cassandra_jmx_password else {})) }}

# the words of an action in a --check result ("would restart")
_cassandra_service_would:
  apply_config: apply the config
  update_java: update Java
  upgradesstables: upgrade the SSTables

# The results of the nodes of the run (summary.yml, the stop block of node_operation.yml): a node without result
# was not reached when it was in the run (stopped before it, or unreachable), else left out of the run (--limit)
_cassandra_op_results: >-
  {%- set out = [] -%}
  {%- for h in cassandra_service_summary_hosts | default(query('community.cassandra.cassandra_nodes')) -%}
  {%-   set _ = out.append({'node': h, 'result': hostvars[h].cassandra_op_result
                              | default('not reached' if h in ansible_play_hosts_all else 'not in this run (--limit)')}) -%}
  {%- endfor -%}
  {{ out }}

# the command of the run, for the way out of a stop (resume) and the TO DO lines
_cassandra_run_command_args:
  inventory: "{{ ansible_inventory_sources }}"
  default_inventory: "{{ lookup('ansible.builtin.config', 'DEFAULT_HOST_LIST') }}"
  hosts: "{{ cassandra_hosts | default('') }}"
  cwd: "{{ lookup('ansible.builtin.env', 'PWD') }}"

# The screens of long operations (screen.yml: session=) warn when the
# controller's shell is not inside tmux or screen (a lost SSH session would stop the run)
_cassandra_session_warning: >-
  {{ '' if lookup('ansible.builtin.env', 'TMUX') or lookup('ansible.builtin.env', 'STY')
     else 'not inside tmux or screen: if this SSH session drops, the run stops'
          ~ ' (the operation itself goes on, unwatched; run it inside tmux or screen)' }}

# the lifetime of the background job of a decommission, removenode or rebuild
# (outlives cassandra_stream_max_time: the wait reports it, the job is not killed)
_cassandra_stream_async: "{{ cassandra_stream_max_time | int + 86400 if cassandra_stream_max_time | int > 0 else 2592000 }}"

# add_node's mark of a bootstrap it started on a node, removed once the node
# joined: data of this cluster without it is a former member's (reset_node_plan.yml)
_cassandra_service_bootstrap_mark: /var/lib/cassandra/.ansible_bootstrap_started

# seeds_apply's mark of a seed list written while the node runs, removed once reloaded:
# a rerun reloads it (an earlier run stopped before the reload, or its reload failed)
_cassandra_service_seeds_reload_mark: /var/lib/cassandra/.ansible_seeds_reload_owed

# sync_clocks' mark of a restart window open on a node (Cassandra stopped for its clock)
_cassandra_clock_window_mark: /var/lib/cassandra/.ansible_clock_window

# an older mark is not trusted (a node that may have joined since, its end not seen)
_cassandra_service_bootstrap_mark_days: 7

# The files of the conf dir cassandra_config writes: the config a restart picks up
# (and the JMX access file, in the conf dir on Debian and Ubuntu; not the password
# file, read at each login: a new one needs no restart; the record of the parts of
# the Prometheus exporter's config read at start, not its config, whose rules it
# reloads itself)
_cassandra_service_config_files: [cassandra.yaml, cassandra-env.sh, jvm*-server.options, cassandra-rackdc.properties, logback.xml,
                                  jmxremote.access, jmx_prometheus.at_start]

_cassandra_service_nodetool: >-
  nodetool -p {{ _cassandra_service_jmx.port }}{{ (' -u ' ~ cassandra_jmx_username | quote) if cassandra_jmx_username else '' }}{{
  (' -pwf ' ~ cassandra_jmx_password_file | quote) if cassandra_jmx_password_file
  else ((' -pw ' ~ cassandra_jmx_password | quote) if cassandra_jmx_password else '') }}

# The variables the playbooks are run with (-e): a name set close to one of them
# is pointed out (hosts_check.yml), preflight warns about cassandra_*
# variables no role or playbook knows, and a -e one under a prefix of the
# collection that none knows stops the run (variables_check.yml; -e
# cassandra_allow_unknown_variables=true lets it through)
_cassandra_playbook_variables: [cassandra_hosts, cassandra_target_nodes, cassandra_target_dc, cassandra_target_rack,
                                cassandra_upgrade_phase, cassandra_rolling_resume, cassandra_rolling_mode, cassandra_dead_node_method,
                                cassandra_dead_node_new_removal, cassandra_dead_node_assassinate_confirm,
                                cassandra_replace_address,
                                cassandra_rebuild_source_dc, cassandra_cleanup_mode, cassandra_status_raw,
                                cassandra_allow_down_nodes, cassandra_allow_mixed_versions, cassandra_accept_default_identity,
                                cassandra_add_node_reset, cassandra_replace_node_reset, cassandra_create_cluster_reset,
                                cassandra_create_cluster_reset_confirm, cassandra_allow_unknown_variables,
                                # import_cluster's and help's options (their header)
                                import_cluster_dir, import_cluster_report_dir, import_cluster_force, import_cluster_host_names,
                                import_cluster_set_ansible_host, import_cluster_vault_password_file, import_cluster_vault_id,
                                import_cluster_medusa_path, import_cluster_keep_hand_edits, import_cluster_allow_unread,
                                import_cluster_keep_unread_jvm_options, import_cluster_carry_exporter_config,
                                import_cluster_report_shareable,
                                import_cluster_adopt, import_cluster_strict, import_cluster_debug,
                                help_topic, help_write, help_runbook_dir, help_inventory]

# storage_mode_read.yml's CQL read: the node's own address (its rpc_address, else its listen_address, else
# 127.0.0.1: several instances on a host each their own), TLS when client encryption is required
_cassandra_storage_mode_cql_host: >-
  {{ (([cassandra_rpc_address | default(''), cassandra_listen_address | default('')]
       | map('string') | reject('in', ['', 'localhost', '0.0.0.0']) | list) + ['127.0.0.1']) | first }}

_cassandra_storage_mode_cql_ssl: >-
  {{ cassandra_client_encryption_enabled | default(false) | bool
     and not cassandra_client_encryption_optional | default('') | string | lower == 'true' }}
