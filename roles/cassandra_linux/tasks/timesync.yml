---
# Time sync: chrony kept where it is installed, else chrony (systemd-timesyncd
# on Debian/Ubuntu when chrony is not installed); installed unless
# cassandra_offline, enabled and started. The NTP servers are the site's: no
# config is written. Run by os.yml; alone by apply_config (in a node's restart
# window, Cassandra stopped) and by sync_clocks (include_role tasks_from, on a
# node whose time sync does not run). cassandra_linux_timesync false leaves it
# alone. Needs the os_family fact. With cassandra_offline and nothing
# installed: a warning, refused instead when _cassandra_timesync_required
# (sync_clocks: the clock is what it is there for).
- name: Look for chrony (kept rather than replaced)
  ansible.builtin.stat:
    path: /usr/sbin/chronyd
  register: cassandra_linux_chrony
  when: _cassandra_chrony_present is not defined

- name: Keep what was found
  ansible.builtin.set_fact:
    _cassandra_chrony_present: "{{ cassandra_linux_chrony.stat.exists }}"
  when: _cassandra_chrony_present is not defined

# installed already: no package manager call (it reads every repository's
# metadata, and fails when a mirror is down though nothing is to install)
- name: Read the installed packages (time sync)
  ansible.builtin.command:
    argv: "{{ [_cassandra_timesync_pkg] | community.cassandra.cassandra_package_query(ansible_facts['os_family']) }}"
  register: cassandra_timesync_read
  changed_when: false
  failed_when: false  # not installed; nothing read at all: the task below fails
  check_mode: false  # a read
  when:
    - cassandra_linux_timesync | bool
    - not cassandra_offline | bool

- name: Install time sync package
  ansible.builtin.package:
    name: "{{ _cassandra_timesync_pkg }}"
    state: present
  retries: 3
  register: cassandra_timesync_install
  # --check: without the repositories cassandra_repository removes (no_repository.yml)
  module_defaults:
    ansible.builtin.dnf:
      disablerepo: "{{ _cassandra_repository_check_removed | default([]) }}"
    ansible.legacy.dnf:
      disablerepo: "{{ _cassandra_repository_check_removed | default([]) }}"
  when:
    - cassandra_linux_timesync | bool
    - not cassandra_offline | bool
    - _cassandra_timesync_pkg not in cassandra_timesync_read | default({}) | community.cassandra.cassandra_installed_packages

- name: Look for the time sync service (offline)
  ansible.builtin.command:
    argv: [systemctl, cat, "{{ _cassandra_timesync_service }}"]
  register: cassandra_timesync_unit
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - cassandra_linux_timesync | bool
    - cassandra_offline | bool

- name: Say the time sync service is missing (offline)
  ansible.builtin.debug:
    msg: >-
      WARNING  {{ _cassandra_timesync_pkg }} is not installed on {{ inventory_hostname }} and cassandra_offline
      downloads nothing: install it from your image or mirror (Cassandra needs synchronized clocks), or set
      cassandra_linux_timesync to false if the host's time sync is managed another way.
  when:
    - cassandra_linux_timesync | bool
    - cassandra_offline | bool
    - cassandra_timesync_unit.rc != 0
    - not _cassandra_timesync_required | default(false) | bool
  vars:
    cassandra_output: true

- name: Refuse a time sync that is not installed (offline)
  ansible.builtin.fail:
    msg: >-
      {{ _cassandra_timesync_pkg }} is not installed on {{ inventory_hostname }} and cassandra_offline downloads
      nothing: install it from your image or mirror, or set cassandra_linux_timesync to false if the host's time
      sync is managed another way.
  when:
    - cassandra_linux_timesync | bool
    - cassandra_offline | bool
    - cassandra_timesync_unit.rc != 0
    - _cassandra_timesync_required | default(false) | bool
    - not ansible_check_mode

- name: Ensure timesync service starts
  ansible.builtin.service:
    name: "{{ _cassandra_timesync_service }}"
    enabled: yes
    state: started
  when:
    - cassandra_linux_timesync | bool
    - not (cassandra_offline | bool and cassandra_timesync_unit.rc != 0)
    - not (_cassandra_linux_check and cassandra_timesync_install is changed)  # not installed yet under --check
  register: cassandra_timesync_service_result
  tags:
  - molecule-idempotence-notest # Ubuntu 2404 timesyncd issue

# chrony's servers (cassandra_linux_timesync_servers): its server, pool and peer lines are the ones listed, the
# others commented out (never removed), the missing ones added at the end (or uncommented), then chrony restarted
- name: Time servers (chrony)
  when:
    - cassandra_linux_timesync | bool
    - cassandra_linux_timesync_servers | length > 0
    - not (_cassandra_linux_check and cassandra_timesync_install | default({}) is changed)  # not installed yet
  vars:
    _chrony_conf: "{{ '/etc/chrony/chrony.conf' if ansible_facts['os_family'] == 'Debian' else '/etc/chrony.conf' }}"
    # (compared word by word: the spaces between them do not count)
    _wanted: "{{ cassandra_linux_timesync_servers | map('split') | map('join', ' ') | list }}"
  block:
    - name: Refuse time servers for another time sync than chrony
      ansible.builtin.fail:
        msg: >-
          cassandra_linux_timesync_servers sets the servers of chrony, but {{ inventory_hostname }} runs
          {{ _cassandra_timesync_service }} (chrony is not installed there): install chrony (the role then keeps it),
          or set cassandra_linux_timesync_servers to [] to leave its servers as they are.
      when: _cassandra_timesync_service not in ['chronyd', 'chrony']

    - name: Read the server lines of chrony
      ansible.builtin.command:
        argv: [grep, -E, '^[[:space:]]*(server|pool|peer)[[:space:]]', "{{ _chrony_conf }}"]
      register: cassandra_linux_chrony_lines
      changed_when: false
      failed_when: cassandra_linux_chrony_lines.rc > 1
      check_mode: false  # read-only

    - name: Comment out the server lines not listed
      ansible.builtin.lineinfile:
        path: "{{ _chrony_conf }}"
        regexp: "^{{ item | regex_escape }}$"
        line: "#{{ item }}"
      loop: >-
        {{ cassandra_linux_chrony_lines.stdout_lines | reject('in', _found_wanted) | unique | list }}
      vars:
        _found_wanted: >-
          {{ cassandra_linux_chrony_lines.stdout_lines
             | zip(cassandra_linux_chrony_lines.stdout_lines | map('split') | map('join', ' ') | list)
             | selectattr(1, 'in', _wanted) | map(attribute=0) | list }}
      register: cassandra_linux_chrony_commented

    # (a line there word for word is left as it is; commented out there: uncommented)
    - name: Add the server lines listed
      ansible.builtin.lineinfile:
        path: "{{ _chrony_conf }}"
        regexp: "^\\s*#?\\s*{{ item.split() | map('regex_escape') | join('\\s+') }}\\s*$"
        line: "{{ item }}"
      loop: "{{ cassandra_linux_timesync_servers | zip(_wanted) | rejectattr(1, 'in', _found) | map(attribute=0) | list }}"
      vars:
        _found: "{{ cassandra_linux_chrony_lines.stdout_lines | map('split') | map('join', ' ') | list }}"
      register: cassandra_linux_chrony_added

    - name: Restart chrony with its servers
      ansible.builtin.service:
        name: "{{ _cassandra_timesync_service }}"
        state: restarted
      when: cassandra_linux_chrony_commented is changed or cassandra_linux_chrony_added is changed
