---
- name: Offline mode on a host without the packages
  hosts: all
  tasks:
    - name: Nothing is installed, the missing packages are listed
      tags: molecule-idempotence-notest  # installed by the next play
      block:
        - name: Run the role offline
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_install
          vars:
            cassandra_offline: true
            cassandra_java_tarball: ""  # EL 10's tarball URL is refused first offline

        - name: Should not be reached
          ansible.builtin.fail:
            msg: offline mode accepted a host without Cassandra
      rescue:
        - name: Check the refusal lists the Cassandra packages
          ansible.builtin.assert:
            that:
              - "'cassandra_offline downloads nothing' in ansible_failed_result.msg"
              - "'cassandra, cassandra-tools' in ansible_failed_result.msg"

- name: EL 10 without a Java tarball
  hosts: el10
  tags: molecule-idempotence-notest
  tasks:
    - name: No Java 11 or 17 package there, said clearly
      block:
        - name: Run the role with the Java package
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_install
          vars:
            cassandra_java_tarball: ""

        - name: Should not be reached
          ansible.builtin.fail:
            msg: the role went on without a Java package
      rescue:
        - name: Check the refusal names the way out
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Stop when no repository offers the Java package (RedHat)'
              - "'java-17-openjdk-headless' in ansible_failed_result.msg"
              - "'EL 10 has no Java 11 or 17 package' in ansible_failed_result.msg"
              - "'cassandra_java_tarball' in ansible_failed_result.msg"

- name: Converge
  hosts: all
  roles:
    - role: community.cassandra.cassandra_repository
    - role: community.cassandra.cassandra_install

# 4.x's cqlsh needs Python 3.11 at most: EL 10 has 3.12 and no python3.11
- name: EL 10 with a 4.x cqlsh
  hosts: el10
  tags: molecule-idempotence-notest
  tasks:
    - name: No Python for cqlsh, said clearly
      block:
        - name: Run the role for 4.1 (Cassandra 5.0 stays installed)
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_install
          vars:
            cassandra_version: 41x

        - name: Should not be reached
          ansible.builtin.fail:
            msg: the role went on without a Python for cqlsh
      rescue:
        - name: Check the refusal names the way out
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Stop when no repository offers python3.11 (RedHat)'
              - "'3.6 to 3.11' in ansible_failed_result.msg"
              - "'cassandra_cqlsh_python' in ansible_failed_result.msg"

# Ubuntu 26.04's sudo is sudo-rs (prepare.yml), and its cqlsh runs through
# the wrapper (python3 is 3.14). (The RHEL 9 images' PAM refuses sudo to the
# rpm's cassandra user.)
- name: cqlsh through become
  hosts: all
  tasks:
    - name: Run cqlsh as cassandra (Ubuntu)
      ansible.builtin.command: cqlsh --version
      become: true
      become_user: cassandra
      register: cassandra_test_cqlsh_become
      changed_when: false
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: It ran
      ansible.builtin.assert:
        that: cassandra_test_cqlsh_become.stdout is search('cqlsh')
      when: ansible_facts['distribution'] == 'Ubuntu'

- name: Pinned version
  hosts: all
  tasks:
    - name: Read the installed Cassandra version
      ansible.builtin.package_facts:

    - name: Pin the installed version (nothing changes, packages held on Debian)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_install
      vars:
        cassandra_package_version: "{{ ansible_facts.packages['cassandra'][0].version | regex_replace('^([0-9.]+).*$', '\\1') }}"

    - name: Another version is refused
      block:
        - name: Run the role with another version
          ansible.builtin.include_role:
            name: community.cassandra.cassandra_install
          vars:
            cassandra_package_version: 5.0.1

        - name: Should not be reached
          ansible.builtin.fail:
            msg: the role accepted to change the version of an installed node
      rescue:
        - name: Check the refusal came from the version check
          ansible.builtin.assert:
            that: ansible_failed_task.name == 'Refuse to change the version of an installed node'

- name: Offline mode on an installed host
  hosts: all
  tasks:
    - name: Run the role offline (checks only)
      ansible.builtin.include_role:
        name: community.cassandra.cassandra_install
      vars:
        cassandra_offline: true
